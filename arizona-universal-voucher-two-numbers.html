<style>
  :root{
    --ink:#141210;
    --paper:#F4EFE6;
    --rule: rgba(20,18,16,.18);
    --rule-soft: rgba(20,18,16,.10);
    --muted: rgba(20,18,16,.62);
    --display: 'Roboto Slab', serif;
    --body: 'Fraunces', Georgia, serif;

  }
  html[data-theme="paper"]{ --ink:#141210; --paper:#F4EFE6; --rule:rgba(20,18,16,.18); --rule-soft:rgba(20,18,16,.10); --muted:rgba(20,18,16,.62); }
  html[data-theme="poster"]{ --ink:#EDE6D8; --paper:#171413; --rule:rgba(237,230,216,.22); --rule-soft:rgba(237,230,216,.10); --muted:rgba(237,230,216,.6); }
  html[data-theme="zine"]{ --ink:#0A0908; --paper:#EFEBDF; --rule:rgba(10,9,8,.35); --rule-soft:rgba(10,9,8,.18); --muted:rgba(10,9,8,.68); }

  html[data-pair="slab-serif"]{ --display:'Roboto Slab', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }
  html[data-pair="grotesk-serif"]{ --display:'Archivo', sans-serif; --body:'Fraunces', Georgia, serif; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="slab-mono"]{ --display:'Roboto Slab', serif; --body:'IBM Plex Mono', monospace; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="display-serif"]{ --display:'Instrument Serif', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }
  body{ font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","ss02","onum"; }

  ::selection{ background: var(--ink); color: var(--paper); }

  body::before{

  .post-body .callout-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .post-body code { font-family: var(--mono); font-size: 0.88em; background: var(--rule-soft); padding: 2px 5px; }
  .post-body pre { font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--rule-soft); padding: 20px 24px; overflow-x: auto; margin: 2em 0; }

<script type="text/babel" data-presets="react">

// ==================== TEMPLATE DATA — update for each post ====================
const POST = {
  kind:    'Analysis',
  number:  '024',
  date:    'May 1, 2026',
  readTime: '4 min',
  title:   'Arizona has three years of the best voucher data in the country — the headline number still depends on how you ask',
  dek:     'Arizona\'s ESA program generates more transaction-level data than any school choice program in history. The answer to its most basic question — who was in public school before? — changes depending on which population you measure.',
  byline:  'T.J. Müehleman',
};
// =============================================================================

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="index.html" style={{ textDecoration:'none' }}>&#8592; All dispatches</a>
          <a href="index.html#about" style={{ textDecoration:'none' }}>About</a>
          <a href="index.html#subscribe" style={{ textDecoration:'none' }}>Subscribe</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      {/* Wordmark */}
      <div style={{ marginBottom:32 }}>
        <a href="index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      {/* Meta row */}
      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>&#8470; {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&#183;</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&#183;</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&#183;</span>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      {/* Title + dek */}
      <div style={{ maxWidth:900, paddingTop:32 }}>

          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>

        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>

      </div>

);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'24px 0' }}>
      <img
        src="https://quickchart.io/chart/render/zf-ad8460d6-015e-4d24-978e-9bb1d16337df"
        alt="Horizontal bar chart showing prior school enrollment of Arizona universal ESA students in FY2025: 76.3% never attended a district or charter school, 12.4% previously in district school, 11.3% previously in charter school."
        style={{ width:'100%', display:'block' }}
      />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:14, textAlign:'center' }}>
        Source: Grand Canyon Institute, <a href="https://grandcanyoninstitute.org/research/education/private-school-subsidies/cost-of-the-universal-esa-voucher-program-fy2025/">The Real Cost of Arizona&rsquo;s Universal ESA Voucher Program: FY2025</a> (Feb 2026). N = 61,688 universal ESA students. &ldquo;Never attended&rdquo; = 47,044 students who reported no prior district or charter enrollment (46,035 base + 1,009 entering kindergarteners). Percentages derived: 47,044/61,688 = 76.3%; 7,628/61,688 = 12.4%; 7,016/61,688 = 11.3%.
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&#8212; {cite}</cite>}</blockquote>;
const Callout = ({ label, children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Every few months at Standard Co, someone asks us to explain Arizona&rsquo;s ESA data.
          Usually they&rsquo;ve just read a number that surprised them. The problem is there are
          two correct answers to the most basic question about this program, and which one you
          hear first shapes everything you think about it afterward.
        </P>

        <P>
          Arizona&rsquo;s Empowerment Scholarship Account program became the first
          universal school voucher in the country in 2022 &#8212; open to every Arizona student
          regardless of income or prior school attendance. By fall 2025,{' '}
          <a href="https://www.commonsenseinstituteus.org/arizona/research/education/esas-in-arizona-q3-2025-report">92,362 students were enrolled</a>,
          average award $10,349, program cost approaching $882 million for the fiscal year.
          The most-tracked school choice program in history.
        </P>

        <P>
          Here&rsquo;s the number that surprises people first: according to the Arizona
          Department of Education, 57% of students <em>newly enrolling</em> in the ESA
          program in fall 2025 had previously attended a public school.
          More than half of new growth is coming from public school switchers.
        </P>

        <P>
          Here&rsquo;s the number that surprises people second: the{' '}
          <a href="https://grandcanyoninstitute.org/research/education/private-school-subsidies/cost-of-the-universal-esa-voucher-program-fy2025/">Grand Canyon Institute&rsquo;s FY2025 analysis</a>{' '}
          found that about three-quarters of <em>all current</em> universal ESA students &#8212;
          roughly 47,000 of the 62,000 analyzed &#8212; never attended a district or
          charter school. Not last year. Not ever.
        </P>

        <P>
          Both numbers are right. They measure different populations at different time windows.
          Together they tell you what happened when universal eligibility opened in 2022 and
          what&rsquo;s happening now as growth slows &#8212; and neither one lying is exactly
          the problem.
        </P>

        <H2>The two-number problem</H2>

        <P>
          When universal eligibility opened in 2022, the families first through the door were
          already homeschooling or in private school. According to{' '}
          <a href="https://www.commonsenseinstituteus.org/arizona/research/education/esas-in-arizona-q2-2025-report">CSI&rsquo;s Q2 2025 report</a>,
          fewer than 25% of new enrollees in late 2022 had previously attended public school.
          That population &#8212; families already outside the public system &#8212; enrolled
          quickly and essentially saturated the program.
        </P>

        <P>
          By Q4 2024, ADE&rsquo;s reported &ldquo;switcher rate&rdquo; (new enrollees from
          public school) had risen to 55%. By fall 2025: 57%. The share keeps climbing not
          because private-school families stopped using ESAs, but because they already enrolled.
          Future growth has to come from somewhere. That somewhere is public school.
        </P>

        <Callout label="The same program, two ways">
          Among <strong>all current</strong> universal ESA students: roughly three-quarters
          never attended a public school (GCI FY2025, based on 61,688 students). Among
          students <strong>newly joining</strong> the program in fall 2025: 57% previously
          attended a public school (ADE, reported in CSI Q3 2025). Both statements are
          simultaneously true and will remain true for years.
        </Callout>

        <P>
          If you&rsquo;re building a data system to track this program, the question you care
          about determines everything about your schema. &ldquo;Prior year enrollment&rdquo;
          and &ldquo;lifetime enrollment history&rdquo; are different fields that generate
          different answers &#8212; and ADE&rsquo;s application collects one of them via
          self-report without cross-referencing the other against district SIS records.
        </P>

        <H2>What the reporting system actually captures</H2>

        <P>
          Arizona produces more ESA data than any program in the world. ADE processed
          and tracked{' '}
          <a href="https://www.commonsenseinstituteus.org/arizona/research/education/esas-in-arizona-q3-2025-report">260,568 individual reimbursement transactions in a single quarter</a>{' '}
          (average purchase: $42). There are quarterly reports to the state board, quarterly
          reports to the governor and legislature, and two independent institutions doing their
          own tracking &#8212; the Grand Canyon Institute and Common Sense Institute-Arizona.
        </P>

        <P>
          And yet: ADE{' '}
          <a href="https://www.commonsenseinstituteus.org/arizona/research/education/esas-in-arizona-q2-2025-report">doesn&rsquo;t collect or report family income, race, or demographic information</a>{' '}
          about ESA recipients. Researchers have to infer demographics from ZIP code data
          using the American Community Survey, with all the sample-size caveats that come with
          ZIP-level ACS estimates. The &ldquo;prior enrollment&rdquo; field on the ESA
          application is self-reported. GCI has to reconstruct the full enrollment history
          from transaction data because ADE doesn&rsquo;t present it that way.
        </P>

        <P>
          The program generates more raw data than any comparable program anywhere.
          The data it <em>doesn&rsquo;t</em> collect is what matters most for evaluating
          its purpose.
        </P>

        <H2>What every other state is inheriting</H2>

        <P>
          Texas launched universal ESA eligibility in September 2025 &#8212; 5 million
          eligible students, roughly $1 billion over two years. Tennessee, Louisiana, Oklahoma:
          all recent adopters of universal-style programs. None of them have an equivalent of
          GCI&rsquo;s multi-year prior-enrollment analysis. None are publishing switcher-rate
          trends with the quarterly consistency Arizona has built over three years.
        </P>

        <P>
          Arizona&rsquo;s 57%-vs.-three-quarters paradox exists because independent
          researchers cared enough to reconstruct it from transaction data that ADE collects
          but doesn&rsquo;t publish cleanly. For the programs launching now, there
          won&rsquo;t be three years of history to work backward from. There will be a
          political debate, some press releases, and whatever the state&rsquo;s application
          form thinks to ask.
        </P>

        <P>
          Measurement design is not a neutral choice. It determines which questions the
          data can answer later. Arizona figured that out slowly, by accident, over three
          years &#8212; and it still hasn&rsquo;t fully answered the question. Most states
          copying its voucher policy are not copying its dataset.
        </P>

        <Divider />

        <P>
          If you build data systems for a living, the part that keeps you up
          isn&rsquo;t the 57% or the three-quarters. It&rsquo;s knowing that the answer
          changes based on a schema decision someone made in 2022 when the program was
          being stood up in a hurry &#8212; and that fourteen states are now making the
          same schema decisions, even faster.
        </P>

        <P>
          <em>&#8212; TJ</em>
        </P>

        <Divider />

        <H2>Sources</H2>

        <P>
          <a href="https://grandcanyoninstitute.org/research/education/private-school-subsidies/cost-of-the-universal-esa-voucher-program-fy2025/">Grand Canyon Institute &#8212; The Real Cost of Arizona&rsquo;s Universal ESA Voucher Program: FY2025</a> (Feb 2026).
          Source for prior school enrollment breakdown: 61,688 universal students analyzed, three-quarters
          never attended district or charter schools. Also source for FY2025 total program cost ($872M)
          and net universal voucher cost ($358M).
        </P>

        <P>
          <a href="https://www.commonsenseinstituteus.org/arizona/research/education/esas-in-arizona-q3-2025-report">Common Sense Institute &#8212; ESA&rsquo;s in Arizona Q3 2025 Report</a> (Oct 2025).
          Source for fall 2025 enrollment (92,362 students as of Sept 15, 2025), average award ($10,349),
          57% switcher rate for new enrollees, and 260,568 reimbursement transactions in one quarter.
        </P>

        <P>
          <a href="https://www.commonsenseinstituteus.org/arizona/research/education/esas-in-arizona-q2-2025-report">Common Sense Institute &#8212; ESA&rsquo;s in Arizona Q2 2025 Report</a> (June 2025).
          Source for Q4 2024 switcher rate (55%), late-2022 switcher rate (fewer than 25% of new
          enrollees from public school), FY2025 program cost estimate ($882M), and ADE demographic
          data limitations (income, race not collected).
        </P>

        <P>
          <a href="https://www.azed.gov/esa/esa-quarterly-reports">Arizona Department of Education &#8212; ESA Quarterly Reports</a>.
          Official source for ADE program data; prior enrollment field reported to state board and legislature quarterly.
        </P>

      </article>
    </Prose>
  </Container>
);

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>

  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

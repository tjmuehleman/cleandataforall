// ==================== Hero visual — Chart 1: notifications 2019–2023 ====================
const PostHero = () => (

// ==================== Post body helpers ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Standard Co builds data tools for global health. Which means once a year the <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024">WHO Global Tuberculosis Report</a> lands on my desk, and I read it the way I read most things: as a story about data pipelines, not about pathogens. Epidemiology isn&rsquo;t my lane. Data systems are. And on that front, this year&rsquo;s report is the most interesting one I&rsquo;ve read in a while.
        </P>

        <P>
          Two numbers opened the 2024 edition, published last October. Both are records. Neither of them means what the headline says it means.
        </P>

        <P>
          <strong>8.16 million people</strong> were diagnosed with TB and officially notified in 2023. Highest single-year total since WHO started collecting this data in the mid-1990s — higher than 2022&rsquo;s previous record of 7.5M, and 15% above pre-pandemic 2019&rsquo;s 7.1M. <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-1-case-notifications">(WHO, §2.1)</a>
        </P>

        <P>
          <strong>88%</strong> of people who completed a first-line TB regimen got cured (drug-susceptible TB, 2022 treatment outcomes — the latest year for which WHO has data). Up from 81% in 2016. Seven straight years of improvement. <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-3-tb-treatment--coverage-and-outcomes">(WHO, §2.3)</a>
        </P>

        <P>
          In almost any other disease, both numbers are unambiguous wins. In TB they sit next to each other because <em>both are measuring the subset we could see.</em> Notifications = people caught by a surveillance system somewhere on earth. Treatment success = outcomes for the people caught AND who entered treatment AND whose outcome was documented. Two records about a data pipeline catching up, not necessarily a disease being beaten.
        </P>

        <P>
          The 2020 crater in the chart above wasn&rsquo;t 18% fewer people getting sick. It was 18% fewer people getting <em>seen</em> — a global data-collection failure caused by health systems being repointed at COVID response. WHO is explicit that 2023&rsquo;s record rebound &ldquo;likely reflects a backlog of people who developed TB in previous years.&rdquo; Translation: 2023 isn&rsquo;t a pure detection year, it&rsquo;s a catch-up year. Two different things loaded onto one bar.
        </P>

        <P>
          Now the gap. WHO&rsquo;s best estimate of how many people actually developed TB in 2023 was <strong>10.84 million.</strong> Notifications came in at <strong>8.16 million.</strong> Delta: <strong>2.7 million people.</strong> WHO calls the gap &ldquo;a mixture of (i) underdiagnosis and (ii) underreporting of people diagnosed with TB to national authorities.&rdquo; <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-3-tb-treatment--coverage-and-outcomes">(WHO, §2.3)</a>
        </P>

        <P>
          That distinction is the whole post. <em>Underdiagnosis</em> = people who were never caught by a clinic. <em>Underreporting</em> = people who were caught by a clinic and never made it into the national dataset (private provider, paper form that never got entered, a reporting pipeline that drops records between facility and ministry). One is a clinical problem. The other is a data-plumbing problem. Both live in that 2.7M number.
        </P>

        <P>
          Five countries account for about half the gap: India (16%), Indonesia (11%), Pakistan (7.8%), China (6.5%), Myanmar (6.5%).
        </P>

        <Fig caption={<>Source: <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-3-tb-treatment--coverage-and-outcomes">WHO Global TB Report 2024, §2.3</a>. &ldquo;All other countries combined&rdquo; = 52.2%, calculated as 100% − the five named shares.</>}>
          <img src="https://quickchart.io/chart/render/zf-87125a7a-dc95-49df-b303-b62903cfc083" alt="Where the 2.7M missing TB cases are — 2023" style={{ width:'100%', display:'block' }} />
        </Fig>

        <H2>The data-systems footnotes I did not see a single headline pick up</H2>

        <UL items={[
          <>In 2023, only <strong>133 countries</strong> — accounting for <strong>70% of notified cases</strong> — had a case-based digital surveillance system for TB. The rest of the world is still reporting aggregated, paper-based data. WHO, not one to dramatize things, flagged it directly: <em>&ldquo;acceleration of progress in making the transition from paper-based reporting of aggregated TB data to case-based digital TB surveillance is particularly needed in the African Region.&rdquo;</em> <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-1-case-notifications">(WHO, §2.1)</a></>,
          <>The TB incidence estimates WHO is publishing for <strong>Uganda</strong> are still based on a <strong>2015</strong> national prevalence survey. For <strong>Zambia</strong>, a <strong>2014</strong> survey. We are driving with a decade-old rearview. <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-3-tb-treatment--coverage-and-outcomes">(WHO, §2.3)</a></>,
          <>When WHO took its data snapshot for the 2024 report on <strong>July 29, 2024</strong>, <strong>15 European countries had not yet reported 2023 notification data.</strong> The Europe coverage numbers in this year&rsquo;s report are underestimated as a result — a fact buried in a caption.</>,
          <>That 88% success rate is for <strong>2022</strong> outcomes. TB treatment is a 6-month regimen and documented outcomes take longer, so outcome data in the global report runs one year behind notifications. We won&rsquo;t know 2023 outcomes until next year&rsquo;s report.</>,
        ]} />

        <P>
          Also — footnote that deserves its own paragraph — the 88% is for drug-susceptible TB. For multidrug-resistant / rifampicin-resistant TB, the 2022 success rate was <strong>68%.</strong> For people living with HIV treated for TB, <strong>79%.</strong> <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-3-tb-treatment--coverage-and-outcomes">(WHO, §2.3)</a> The &ldquo;record cure rate&rdquo; is a record for the easiest version of the disease, among patients who entered the system, whose outcome was documented, a year ago.
        </P>

        <P>
          Still real. Still hard-won. But the headline number is three data filters deep before you get to it.
        </P>

        <Callout label="The bottleneck">
          TB killed an estimated <strong>1.25 million people</strong> in 2023, reclaiming its title as the world&rsquo;s leading infectious-disease killer from COVID-19. <a href="https://www.who.int/news-room/fact-sheets/detail/tuberculosis">(WHO TB fact sheet)</a> The cure has existed since 1944. The bottleneck here isn&rsquo;t pharmacology. It&rsquo;s information flow. We know how to treat this disease. In a meaningful share of the world, we do not yet reliably find, record, and follow the people who have it.
        </Callout>

        <P>
          The 2025 numbers start arriving in late 2026. Skip the cure headlines. Watch the share of countries on case-based digital surveillance. Watch which prevalence surveys get refreshed. Watch how many countries submit their notification data by the July snapshot. That is where the 2.7 million live. That is the scoreboard.
        </P>

        <Divider />

        <H3>Sources</H3>

        <UL items={[
          <><a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024">WHO Global Tuberculosis Report 2024 (landing page)</a> — report published 29 October 2024, covers 2023 data.</>,
          <><a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-1-case-notifications">WHO — Case notifications (§2.1)</a> — 8.16M 2023 notifications, historical series back to 2010, 133-country digital surveillance figure, &ldquo;backlog&rdquo; quote on 2023 rebound.</>,
          <><a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2024/tb-diagnosis-and-treatment/2-3-tb-treatment--coverage-and-outcomes">WHO — Treatment coverage and outcomes (§2.3)</a> — 10.84M incidence, 2.7M gap, &ldquo;underdiagnosis and underreporting&rdquo; language, five-country gap shares, 88%/68%/79% treatment success, Uganda/Zambia prevalence-survey vintages, 15-country European reporting lag.</>,
          <><a href="https://www.who.int/news-room/fact-sheets/detail/tuberculosis">WHO Tuberculosis fact sheet</a> — 1.25M deaths in 2023, TB as leading infectious killer.</>,
        ]} />

        <p style={{ marginTop:48, fontStyle:'italic', color:'var(--muted)' }}>— T.J. Müehleman</p>

      </article>
    </Prose>
  </Container>
);

      <PostBody />

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

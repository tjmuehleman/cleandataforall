// ==================== shapes.jsx ====================
const Shape = ({ children, viewBox = "0 0 400 300", style, className, ariaLabel }) => (
  <svg viewBox={viewBox} className={className} style={{ display:'block', width:'100%', height:'100%', color:'currentColor', ...style }} role="img" aria-label={ariaLabel} xmlns="http://www.w3.org/2000/svg">
    {children}
  </svg>
);

const RingsShape = ({ count = 9 }) => (
  <Shape viewBox="0 0 400 300" ariaLabel="Concentric rings">
    {Array.from({length: count}).map((_, i) => {
      const r = 14 + i * 14;
      return <circle key={i} cx="200" cy="150" r={r} fill="none" stroke="currentColor" strokeWidth={i === count-1 ? 2 : 1} opacity={0.15 + i*0.08} />
    })}
    <circle cx="200" cy="150" r="4" fill="currentColor" />
  </Shape>
);

const BarsShape = ({ values = [0.35,0.62,0.4,0.85,0.55,0.92,0.7,0.45,0.78,0.3,0.6,0.5,0.88,0.42,0.7] }) => {
  const n = values.length, pad = 20, w = (400 - pad*2) / n, gap = 3;
  return (
    <Shape viewBox="0 0 400 300" ariaLabel="Bar distribution">
      <line x1="20" y1="260" x2="380" y2="260" stroke="currentColor" strokeWidth="1" opacity=".5"/>
      {values.map((v,i)=>{
        const h = v * 220; const x = pad + i*w + gap/2;
        return <rect key={i} x={x} y={260 - h} width={w-gap} height={h} fill="currentColor" opacity={0.25 + v*0.55}/>
      })}
    </Shape>
  );
};

const DotGridShape = ({ cols = 22, rows = 14, missing = [[5,4],[6,4],[5,5],[6,5],[7,5],[5,6],[6,6],[14,9],[15,9],[14,10],[15,10]] }) => {
  const dots = [];
  for (let c=0;c<cols;c++) for (let r=0;r<rows;r++){
    const x = 16 + c*(368/(cols-1));
    const y = 16 + r*(268/(rows-1));
    const gone = missing.some(([mc,mr])=>mc===c&&mr===r);
    dots.push(<circle key={`${c}-${r}`} cx={x} cy={y} r={gone ? 0 : 2.2} fill="currentColor" opacity={gone ? 0 : 0.75}/>)
  }
  return <Shape viewBox="0 0 400 300" ariaLabel="Dot grid with gaps">{dots}</Shape>;
};

const StrataShape = () => (
  <Shape viewBox="0 0 400 300" ariaLabel="Stacked strata">
    {[
      [0, 300, 40, .9],
      [0, 260, 28, .55],
      [0, 232, 36, .75],
      [0, 196, 20, .35],
      [0, 176, 48, .85],
      [0, 128, 22, .45],
      [0, 106, 30, .65],
      [0, 76, 18, .3],
      [0, 58, 40, .8],
      [0, 18, 18, .45],
    ].map(([x,y,h,o],i)=>(
      <rect key={i} x={x} y={y-h} width="400" height={h} fill="currentColor" opacity={o*0.4}/>
    ))}
    {[300,260,232,196,176,128,106,76,58,18].map((y,i)=>(
      <line key={i} x1="0" x2="400" y1={y} y2={y} stroke="currentColor" opacity=".35"/>
    ))}
  </Shape>
);

const ScatterShape = () => {
  const pts = Array.from({length: 70}).map((_,i)=>{
    const x = 20 + (i*(360/69));
    const base = 240 - (i*2.6);
    const jitter = (Math.sin(i*1.73)+Math.cos(i*0.9))*24;
    return [x, Math.max(30, Math.min(260, base + jitter))];
  });
  return (
    <Shape viewBox="0 0 400 300" ariaLabel="Scatter with trend">
      <line x1="20" y1="260" x2="380" y2="260" stroke="currentColor" opacity=".5"/>
      <line x1="20" y1="30" x2="20" y2="260" stroke="currentColor" opacity=".5"/>
      <line x1="22" y1="248" x2="378" y2="56" stroke="currentColor" strokeWidth="1" strokeDasharray="4 3" opacity=".7"/>
      {pts.map(([x,y],i)=>(
        <circle key={i} cx={x} cy={y} r="2.4" fill="currentColor" opacity={0.6}/>
      ))}
    </Shape>
  );
};

const LineChartShape = () => {
  const pts = [20,40,60,80,100,120,140,160,180,200,220,240,260,280,300,320,340,360,380].map((x,i)=>{
    const v = [0.6,0.55,0.65,0.5,0.62,0.7,0.68,0.75,0.62,0.8,0.55,0.35,0.42,0.5,0.6,0.58,0.7,0.72,0.85][i];
    return [x, 260 - v*220];
  });
  const d = pts.map((p,i)=> (i===0?'M':'L') + p[0] + ' ' + p[1]).join(' ');
  return (
    <Shape viewBox="0 0 400 300" ariaLabel="Line chart">
      {[60,120,180,240].map(y=>(
        <line key={y} x1="20" x2="380" y1={y} y2={y} stroke="currentColor" opacity=".12"/>
      ))}
      <line x1="20" y1="260" x2="380" y2="260" stroke="currentColor" opacity=".5"/>
      <path d={d} fill="none" stroke="currentColor" strokeWidth="2"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="3.5" fill="currentColor"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="8" fill="none" stroke="currentColor" opacity=".5"/>
    </Shape>
  );
};

const OverlapShape = () => (
  <Shape viewBox="0 0 400 300" ariaLabel="Overlapping fields">
    <circle cx="160" cy="150" r="90" fill="none" stroke="currentColor" strokeWidth="1.5" opacity=".8"/>
    <circle cx="240" cy="150" r="90" fill="none" stroke="currentColor" strokeWidth="1.5" opacity=".8"/>
    <circle cx="200" cy="210" r="90" fill="none" stroke="currentColor" strokeWidth="1.5" opacity=".8"/>
    <circle cx="200" cy="170" r="3" fill="currentColor"/>
  </Shape>
);

const PulseShape = () => {
  const bars = Array.from({length: 40}).map((_,i)=>{
    const h = 20 + Math.abs(Math.sin(i*0.9)+Math.cos(i*0.35))*80 + (i%7===0?40:0);
    return h;
  });
  return (
    <Shape viewBox="0 0 400 160" ariaLabel="Pulse">
      <line x1="0" x2="400" y1="80" y2="80" stroke="currentColor" opacity=".2"/>
      {bars.map((h,i)=>{
        const x = (i/(bars.length-1))*400;
        return <line key={i} x1={x} x2={x} y1={80 - h/2} y2={80 + h/2} stroke="currentColor" strokeWidth="1.5" opacity={0.3 + (h/140)*0.6}/>
      })}
    </Shape>
  );
};

const ArchiveShape = () => (
  <Shape viewBox="0 0 400 300" ariaLabel="Archive">
    <rect x="30" y="30" width="340" height="240" fill="none" stroke="currentColor" strokeWidth="1.5"/>
    {Array.from({length: 20}).map((_,i)=>(
      <line key={`h-${i}`} x1="30" x2="370" y1={30 + i*12.2} y2={30 + i*12.2} stroke="currentColor" opacity=".2"/>
    ))}
    {Array.from({length: 10}).map((_,i)=>(
      <line key={`v-${i}`} x1={30 + i*35} x2={30 + i*35} y1="30" y2="270" stroke="currentColor" opacity=".12"/>
    ))}
    <rect x="110" y="96" width="140" height="24" fill="currentColor" opacity=".7"/>
    <rect x="110" y="136" width="210" height="8" fill="currentColor" opacity=".35"/>
    <rect x="110" y="152" width="180" height="8" fill="currentColor" opacity=".35"/>
    <rect x="110" y="168" width="80" height="8" fill="currentColor" opacity=".35"/>
  </Shape>
);

  { n: '093', date: 'July 22, 2026', read: '3 min', kind: 'Data Study',
    title: 'The ‘1 in 6’ antibiotic-resistance stat is an average of four diseases 40x apart',
    dek: 'WHO’s headline says 1 in 6 bacterial infections now resist treatment. But that single fraction blends four infections — from 1 in 3 urinary cases to 1 in 125 gonorrhea cases — a more than 40-fold spread averaged into one tidy number.',
    href: 'blog/one-in-six-average-of-four-diseases.html', shape: 'dotgrid' },
  { n: '092', date: 'July 21, 2026', read: '3 min', kind: 'Data Study',
    title: 'TB is the world’s deadliest infection again — and a fifth of it was never counted',
    dek: 'The WHO says 10.7 million people fell ill with tuberculosis in 2024. Only 8.3 million were diagnosed and reported. The other 2.4 million are a model estimate — and the money that pays for counting is shrinking.',
    href: 'blog/tb-deadliest-a-fifth-never-counted.html', shape: 'strata' },
  { n: '091', date: 'July 20, 2026', read: '3 min', kind: 'Data Study',
    title: 'The overdose count fell to a number nobody finished counting',
    dek: 'U.S. overdose deaths fell for a third straight year — the best number in a decade. But the 69,973 everyone quoted is a prediction, not the 68,600 actually on file. The good news is still a draft.',
    href: 'blog/overdose-count-nobody-finished-counting.html', shape: 'rings' },
  { n: '090', date: 'July 19, 2026', read: '3 min', kind: 'Data Study',
    title: 'The newest mpox strain’s first case was found second',
    dek: 'Mpox never went quiet — the reporting did. 44,299 cases while nobody was looking, six countries reclassified by a definition, and a recombinant strain that sat in a database misfiled for three months before it had a name.',
    href: 'blog/mpox-strain-first-case-found-second.html', shape: 'overlap' },
  { n: '089', date: 'July 18, 2026', read: '3 min', kind: 'Data Study',
    title: 'There is no such thing as the price of cocoa',
    dek: 'In eighteen months cocoa futures went 12,646 to 3,400 to 4,709. But “the price of cocoa” was never one number — the futures desk, the farmgate, and your candy bar each got a different one, on a different clock.',
    href: 'blog/no-such-thing-as-the-price-of-cocoa.html', shape: 'archive' },
  { n: '088', date: 'July 17, 2026', read: '3 min', kind: 'Analysis',
    title: 'The US loses measles elimination the day the outbreaks are ruled one chain',
    dek: 'There is no case count that forfeits elimination — not 2,288, not 2,260. What forfeits it is a ruling: are the 2025–26 outbreaks one genomically linked chain past 12 months, or a pile of separate imports?',
    href: 'blog/measles-elimination-one-chain-or-many.html', shape: 'scatter' },
  { n: '087', date: 'July 16, 2026', read: '3 min', kind: 'Analysis',
    title: 'The cleanest measles data we have is a stack of school exemption forms',
    dek: 'The 2024–25 kindergarten exemption rate hit a record 3.6% and MMR coverage slipped to 92.5%, below the herd-immunity line. Then measles came back — and the paperwork had called it a year early.',
    href: 'blog/cleanest-measles-data-exemption-forms.html', shape: 'pulse' },
  { n: '086', date: 'July 15, 2026', read: '3 min', kind: 'Analysis',
    title: 'Most of the world’s measles is an estimate. Ours is a count.',
    dek: 'The WHO puts 2024 at 11 million measles infections — a modeled figure almost nobody sees. The CDC puts 2026 at 2,231 confirmed cases through July 9, already near all of last year. Only one of those numbers can move.',
    href: 'blog/measles-estimate-vs-count.html', shape: 'bars' },
  { n: '085', date: 'July 13, 2026', read: '3 min', kind: 'Analysis',
    title: 'The Americas lost measles-free status on a clock, not a case count',
    dek: 'In November 2025 the region lost measles-free status — not on a case count, but on a 12-month clock. By early 2026 the country that tripped it had gone quiet while two others ran up the tab.',
    href: 'blog/measles-elimination-clock-not-case-count.html', shape: 'line' },
  { n: '084', date: 'July 12, 2026', read: '3 min', kind: 'Analysis',
    title: 'The good counselor number came in the month the money ran out',
    dek: 'The national student-to-counselor ratio improved to 372:1 in 2024-25 — the best figure in years. But it’s an average that describes almost no real child, and it was measured the month the federal money behind it expired.',
    href: 'blog/counselor-ratio-money-ran-out.html', shape: 'dotgrid' },
  { n: '083', date: 'July 11, 2026', read: '3 min', kind: 'Analysis',
    title: 'The numbers that fell are the ones we only have to count once',
    dek: 'The WHO’s 2026 hepatitis report led with two numbers that fell and buried two that didn’t. The difference isn’t willpower. It’s that prevention is something you count once, and treatment is something you count five times.',
    href: 'blog/numbers-that-fell-count-once.html', shape: 'strata' },
  { n: '082', date: 'July 10, 2026', read: '3 min', kind: 'Data Study',
    title: 'Africa passed Europe on the HPV vaccine. The count that proves it lands this month.',
    dek: 'Africa’s HPV vaccine coverage went from 4% to 44% in a decade and just overtook Europe. It’s the best number in global health this year. It’s also flagged “preliminary,” and the audit that confirms it lands this month.',
    href: 'blog/africa-passed-europe-hpv-pending-count.html', shape: 'rings' },
  { n: '081', date: 'July 9, 2026', read: '3 min', kind: 'Data Study',
    title: 'Air pollution didn’t start attacking the brain in 2023. The data did.',
    dek: 'Air pollution killed 7.9 million people in 2023 — and for the first time the toll includes 600,000 dementia deaths. That number didn’t appear because the air changed. It appeared because someone added a row.',
    href: 'blog/air-pollution-brain-not-lungs.html', shape: 'overlap' },
  { n: '080', date: 'July 8, 2026', read: '3 min', kind: 'Analysis',
    title: 'Cholera cases rose 15%. Deaths rose 90%.',
    dek: 'A curable disease killed 7,598 people in 2025 — nearly double 2023 — while reported cases rose just 15%. When deaths outrun cases like that, the story isn’t the bug. It’s the case-fatality rate, and who treatment reached in time.',
    href: 'blog/cholera-cases-rose-deaths-rose-faster.html', shape: 'archive' },
  { n: '079', date: 'July 7, 2026', read: '3 min', kind: 'Analysis',
    title: 'The birth-dearth panic is mostly a public-health win',
    dek: 'The 2025 U.S. general fertility rate hit another record low, and the coverage called it a crisis. But the single biggest driver of the decline is teen births — down 72% since 2007, the least-celebrated public-health win in the data.',
    href: 'blog/birth-dearth-panic-mostly-a-win.html', shape: 'scatter' },
  { n: '078', date: 'July 6, 2026', read: '4 min', kind: 'Analysis',
    title: 'Measles jumped 43-fold. The lab network that counts it is funded at 15%.',
    dek: 'In the first three weeks of 2026, seven countries in the Americas confirmed 1,031 measles cases — 43 times the year before. The global lab network that confirmed them secured just 15% of its 2026 budget.',
    href: 'blog/measles-jumped-43-fold-counted-at-15.html', shape: 'pulse' },
  { n: '077', date: 'July 5, 2026', read: '4 min', kind: 'Analysis',
    title: 'The century low is an estimate. The funding cut isn’t.',
    dek: 'U.S. cities just logged the largest one-year homicide drop on record. But “safest in a century” is still a projection built on a 35-city sample — and the federal grants that would explain the drop were terminated the same year.',
    href: 'blog/century-low-estimate-funding-cut-isnt.html', shape: 'bars' },
  { n: '076', date: 'July 4, 2026', read: '3 min', kind: 'Analysis',
    title: 'The voucher didn’t change. The intake form did.',
    dek: 'Arizona’s universal voucher mostly went to families already in private school. Texas’ first awards mostly went to public-school kids. Same policy, opposite data — and the difference is the eligibility filter, not the politics.',
    href: 'blog/voucher-didnt-change-intake-form-did.html', shape: 'line' },
  { n: '075', date: 'July 3, 2026', read: '3 min', kind: 'Analysis',
    title: 'The pediatric HIV gap is a counting problem',
    dek: 'New HIV infections in children fell 62% since 2010 — a real win. But only 55% of kids with HIV are on treatment, against 78% of adults. The gap isn’t about drugs. It’s about who we manage to count.',
    href: 'blog/pediatric-hiv-gap-counting-problem.html', shape: 'dotgrid' },
  { n: '074', date: 'July 2, 2026', read: '3 min', kind: 'Data Study',
    title: 'Half the world’s unvaccinated babies live where we count worst',
    dek: 'The WHO’s cleanest equity stat this year — a quarter of the world’s infants live in 26 fragile countries, and they hold half its unvaccinated ones. It comes from estimates, not counts, and it’s measured thinnest where it matters most.',
    href: 'blog/half-unvaccinated-babies-count-worst.html', shape: 'strata' },
  { n: '073', date: 'July 1, 2026', read: '3 min', kind: 'Data Study',
    title: 'The same drug fails three times as often in South-East Asia as in Europe. The average hides the rest.',
    dek: 'WHO says antibiotic resistance runs about three times higher in South-East Asia than in Europe. But that regional gap is a median — and a median hides the spread, the drug failing worst in the ‘safe’ region, and half the planet that never sent data.',
    href: 'blog/resistance-3x-gap-what-the-median-hides.html', shape: 'rings' },
  { n: '072', date: 'June 30, 2026', read: '3 min', kind: 'Data Study',
    title: 'Overdose deaths are falling fast. We counted 2024 three different ways.',
    dek: 'Three CDC documents give three different counts of how many Americans died from an overdose in 2024. The decline is real and historic. The exact number is a provisional estimate that hasn’t finished moving — so say “about.”',
    href: 'blog/overdose-deaths-2024-counted-three-ways.html', shape: 'overlap' },
  { n: '071', date: 'June 29, 2026', read: '3 min', kind: 'Data Study',
    title: 'The birth rate hit a record low. Half the table went up.',
    dek: 'The 2025 general fertility rate fell again, and headlines called it a crisis. But the same CDC table shows rates rising for every age group over 30 — and teen births down 81% since 1991. One average, two opposite trends.',
    href: 'blog/birth-rate-record-low-half-the-table.html', shape: 'archive' },
  { n: '070', date: 'June 28, 2026', read: '3 min', kind: 'Analysis',
    title: 'The student-loan crisis didn’t spike. The reporting clock just restarted.',
    dek: 'The New York Fed says 3.6 million borrowers defaulted in two quarters. The number is real — but it’s a backlog clearing through a reporting turnstile that was bolted shut for four years, and the count isn’t finished.',
    href: 'blog/student-loan-default-reporting-clock.html', shape: 'scatter' },
  { n: '069', date: 'June 26, 2026', read: '4 min', kind: 'Analysis',
    title: 'The crime perception gap closed. The data didn’t close it.',
    dek: 'For a decade Americans believed crime was rising while it fell — the perception gap. In October 2025 it narrowed to a 2018 low. The thing that moved wasn’t the crime rate. It was which party holds the White House.',
    href: 'blog/perception-gap-closed-partisanship.html', shape: 'pulse' },
  { n: '068', date: 'June 25, 2026', read: '3 min', kind: 'Analysis',
    title: 'We count malaria with a test the parasite learned to dodge',
    dek: 'The 2025 World Malaria Report logged 282 million cases — about 9 million more than the year before. Some of that rise isn’t biology. It’s the rapid test reading negative on parasites that stopped making the protein it looks for.',
    href: 'blog/malaria-rapid-test-going-blind.html', shape: 'bars' },
  { n: '067', date: 'June 23, 2026', read: '3 min', kind: 'Analysis',
    title: 'The recovery has two headlines, and they disagree',
    dek: 'The Education Recovery Scorecard says wealthy districts recovered nearly four times as often as poor ones. It also says the recovery is U-shaped and the middle got squeezed. Both are true. The difference is what you measured.',
    href: 'blog/recovery-two-headlines-disagree.html', shape: 'line' },
  { n: '066', date: 'June 22, 2026', read: '3 min', kind: 'Analysis',
    title: 'The biggest crime drop since 1937 is still an estimate',
    dek: 'The FBI says violent crime fell 9.3% and murder 18.1% in 2025 — the largest one-year decline since 1937. The number is almost certainly good news. It is also preliminary, voluntary, and the kind of thing that gets revised.',
    href: 'blog/crime-drop-since-1937-still-an-estimate.html', shape: 'dotgrid' },
  { n: '065', date: 'June 21, 2026', read: '3 min', kind: 'Analysis',
    title: 'We cured it in 2015. It killed 1.34 million people in 2024.',
    dek: 'A pill has cured hepatitis C since 2015, at a rate above 95 percent. In 2024 viral hepatitis still killed 1.34 million people — more than HIV and malaria. The cure was never the problem. Delivery is.',
    href: 'blog/we-cured-it-in-2015.html', shape: 'strata' },
  { n: '064', date: 'June 19, 2026', read: '4 min', kind: 'Data Study',
    title: 'No state improved 8th-grade math. The average calls it flat.',
    dek: 'On the 2024 Nation’s Report Card, no state’s 8th graders scored higher in math than before the pandemic. Forty-nine fell; Tennessee held even. The “flat” national average hides a top that recovered and a bottom still falling.',
    href: 'blog/no-state-improved-eighth-grade-math.html', shape: 'rings' },
  { n: '063', date: 'June 18, 2026', read: '3 min', kind: 'Data Study',
    title: 'The virus is the predictable part',
    dek: 'A Lancet HIV model puts the cost of the global HIV funding cuts at 4.4 to 10.8 million new infections by 2030. The range is that wide because the hardest variable to forecast isn’t the virus — it’s the budget.',
    href: 'blog/the-virus-is-the-predictable-part.html', shape: 'overlap' },
  { n: '062', date: 'June 17, 2026', read: '4 min', kind: 'Data Study',
    title: 'The COVID toll just tripled. Nobody died twice.',
    dek: 'WHO now puts the 2020–23 pandemic toll at 22 million — more than triple the 7 million officially reported. The deaths didn’t change. What changed is how much of the world’s death ledger we can actually read.',
    href: 'blog/covid-toll-tripled-nobody-died-twice.html', shape: 'archive' },
  { n: '061', date: 'June 15, 2026', read: '3 min', kind: 'Data Study',
    title: 'The malaria vaccine worked. We measured that better than we measure malaria.',
    dek: 'WHO confirmed the malaria vaccine averts 1 in 8 child deaths — a number somebody actually counted. The burden it’s shrinking is mostly a model, built off a system that sees about a third of the world’s deaths.',
    href: 'blog/malaria-vaccine-counted-not-modeled.html', shape: 'scatter' },
  { n: '060', date: 'June 15, 2026', read: '3 min', kind: 'Data Study',
    title: 'The world’s leading cause of disability was measured by 102 countries out of 194',
    dek: 'WHO’s first global report on neurology calls brain disorders the world’s leading cause of disability — more than 3 billion people. It’s built on data from barely half its member states. The gap is the story.',
    href: 'blog/neurology-report-102-of-194.html', shape: 'pulse' },
  { n: '059', date: 'June 12, 2026', read: '3 min', kind: 'Data Study',
    title: 'Every other disease curve bent the right way. Malaria went backwards.',
    dek: 'WHO’s new health report logged one disease going the wrong way: malaria, up 8.5% since 2015. The southern Africa spike is real-time. The global death toll is mostly modeled — off a system that sees a third of the world’s deaths.',
    href: 'blog/every-other-curve-malaria-went-backwards.html', shape: 'bars' },
  { n: '058', date: 'June 8, 2026', read: '4 min', kind: 'Data Study',
    title: 'Only 6% of kids fully recovered — and the next scorecard changed the question',
    dek: 'The 2025 Harvard–Stanford scorecard found just 6% of grade 3–8 kids in districts back above 2019 in both math and reading, and rich districts nearly four times likelier to get there. A year later, the baseline moved to 2022.',
    href: 'blog/six-percent-recovered-baseline-moved.html', shape: 'line' },
  { n: '057', date: 'June 7, 2026', read: '5 min', kind: 'Data Study',
    title: 'The number that ends US measles elimination isn’t 1,983.',
    dek: 'PAHO reviews US measles-elimination status in November. The 1,983 cases through May 28 are loud. The criterion the review actually runs on is a calendar — and it’s been ticking since January 20, 2025.',
    href: 'blog/measles-1983-isnt-the-number.html', shape: 'dotgrid' },
  { n: '056', date: 'June 4, 2026', read: '4 min', kind: 'Data Study',
    title: 'America finally has enough school counselors. For the seniors.',
    dek: 'ASCA’s 2024-25 ratio update landed last fall with a single-line headline that traveled — for the first time since 1965, U.S. high schools cleared the 250:1 standard. The same press release listed three other numbers that didn’t make the headline.',
    href: 'blog/america-finally-enough-counselors-seniors.html', shape: 'strata' },
  { n: '055', date: 'June 3, 2026', read: '4 min', kind: 'Data Study',
    title: 'The recovery is U-shaped. The American median district is on the bottom.',
    dek: 'The new Harvard-Stanford-Dartmouth Education Scorecard sorted 35 million kids by lunch-subsidy share. The recovery curve grew a hole in the middle 30–70%. Averaged into one line, it would have looked like progress.',
    href: 'blog/recovery-u-shape-middle-district.html', shape: 'rings' },
  { n: '054', date: 'June 2, 2026', read: '4 min', kind: 'Data Study',
    title: 'The mosquitoes are doing 0.12 percent of the climate-malaria math',
    dek: 'A Nature paper from January projects 123 million additional malaria cases in Africa by 2050. The mosquito-range channel everyone has been modeling for two decades accounts for 0.12 percent of the rise. The other 79 percent is what happens when a cyclone takes the clinic offline.',
    href: 'blog/mosquitoes-0-12-percent-of-the-math.html', shape: 'overlap' },
  { n: '053', date: 'June 1, 2026', read: '4 min', kind: 'Data Study',
    title: 'USDA named the bee killer in June. The FAQ from the same investigation said hold on.',
    dek: 'Commercial beekeepers lost 62% of their colonies between June 2024 and March 2025 — the worst run ever recorded. USDA pinned the cause on three viruses and miticide-resistant mites. A Project Apis m. FAQ from the same group walked the causal claim back the next paragraph.',
    href: 'blog/usda-bee-killer-faq-disagreed.html', shape: 'archive' },
  { n: '052', date: 'May 31, 2026', read: '4 min', kind: 'Data Study',
    title: 'Total enrollment fell. IDEA grew 3.8%. The funding formula moved zero.',
    dek: 'Public-school enrollment dipped 0.3% in 2024–25. IDEA-eligible enrollment crossed eight million and added 301,991 students in twelve months. Autism alone was 40% of the increase. The federal funding share stayed at 10.9%.',
    href: 'blog/idea-grew-enrollment-fell-2024.html', shape: 'scatter' },
  { n: '051', date: 'May 30, 2026', read: '4 min', kind: 'Data Study',
    title: 'The bed net stopped working in 2014. Ghana retired it in 2026.',
    dek: 'Ghana announced the first national phase-out of standard pyrethroid-only mosquito nets last month. The biological signal that the nets had stopped killing mosquitoes was visible in the field data more than a decade earlier.',
    href: 'blog/bed-net-stopped-working-2014.html', shape: 'pulse' },
  { n: '050', date: 'May 29, 2026', read: '3 min', kind: 'Data Study',
    title: 'WHO got 1 in 6 from 104 countries. The story is the half that didn’t file.',
    dek: 'WHO drew its “1 in 6” resistance headline from 23 million infections in 104 countries. About half the membership sent no data. The map of where resistance looks worst is mostly the map of where it gets measured.',
    href: 'blog/amr-glass-half-that-filed.html', shape: 'bars' },
  { n: '049', date: 'May 27, 2026', read: '3 min', kind: 'Data Study',
    title: 'Schools spent tens of millions to ban phones. The only number that moved was phone use.',
    dek: 'The biggest U.S. study of school phone bans landed last month. The thing the policy was buying — test scores, attention, bullying — did not move. Phone use during third period did.',
    href: 'blog/phone-ban-column-of-zeroes.html', shape: 'line' },
  { n: '048', date: 'May 27, 2026', read: '3 min', kind: 'Data Study',
    title: 'Does Washington State really have a lot of restaurants?',
    dek: 'Washington has the 13th-most restaurants in America. Per capita, it’s exactly the median — 25th of 50. Oregon, with half the population, has more dining seats per resident than we do.',
    href: 'blog/washington-restaurants-per-capita.html', shape: 'dotgrid' },
  { n: '047', date: 'May 26, 2026', read: '3 min', kind: 'Data Study',
    title: 'Global child obesity passed underweight in 2025. The Pacific called it in 2000.',
    dek: 'UNICEF says 2025 was the year obesity overtook underweight worldwide among kids. Niue crossed that line a generation ago. The “first time ever” chart is a 25-year supply-chain story averaging out into one number.',
    href: 'blog/obesity-passed-underweight-pacific-2000.html', shape: 'strata' },
  { n: '046', date: 'May 25, 2026', read: '3 min', kind: 'Data Study',
    title: 'Your power bill is the lagging indicator. PJM’s capacity auction is the leading one.',
    dek: 'The price of residential electricity rose 5% in a year. The price PJM pays generators just to be available rose 1,038% in two. The interval between those two scoreboards is where every U.S. data center is hiding.',
    href: 'blog/power-bill-lagging-pjm-leading.html', shape: 'rings' },
  { n: '045', date: 'May 24, 2026', read: '3 min', kind: 'Data Study',
    title: 'Midtown Manhattan is at 2.9% vacancy. The pandemic office story flipped — and brokers can’t agree on Austin.',
    dek: 'The prime office in the city most people declared dead in 2020 is tighter than it was pre-pandemic. Austin’s vacancy is the worst in the country — at 23.3%, or 26.7%, or 28.9%, depending which broker’s Q1 report you opened.',
    href: 'blog/midtown-29-and-the-broker-spread.html', shape: 'overlap' },
  { n: '044', date: 'May 22, 2026', read: '3 min', kind: 'Data Study',
    title: '80% of American students use AI for schoolwork. The evidence base is 20 papers.',
    dek: 'Stanford filtered 800-plus academic papers on AI in K-12 down to 20 high-quality causal studies. Zero were conducted in U.S. classrooms — the country running the biggest education experiment of the decade.',
    href: 'blog/stanford-ai-evidence-base-20-papers.html', shape: 'archive' },
  { n: '043', date: 'May 21, 2026', read: '3 min', kind: 'Data Study',
    title: 'The measles outbreak was already in the data five school years ago',
    dek: 'The CDC pushes the U.S. measles case count every Friday. The kindergarten MMR coverage data — the leading indicator that says whether a chain has a path — runs once a year, on a school-year clock.',
    href: 'blog/measles-leading-indicator-broke.html', shape: 'scatter' },
  { n: '042', date: 'May 20, 2026', read: '4 min', kind: 'Data Study',
    title: 'Canada lost measles in November. The lab network that watches for the next one is going broke.',
    dek: 'Canada’s measles elimination status came off after 12 months of sustained transmission. The U.S. is on the same clock. And the global lab network that does the counting went looking for $3.6 million on the public internet.',
    href: 'blog/canada-lost-measles-lab-network-broke.html', shape: 'pulse' },
  { n: '041', date: 'May 19, 2026', read: '4 min', kind: 'Data Study',
    title: 'The reading recession headline has 38 states on it. Not 50.',
    dek: 'The Harvard-Stanford-Dartmouth Education Scorecard says only five (or seven) states improved reading 2022 to 2025. Twelve states aren’t in the analysis at all. The denominator is the part nobody’s reading.',
    href: 'blog/reading-recession-38-states-not-50.html', shape: 'bars' },
  { n: '040', date: 'May 18, 2026', read: '3 min', kind: 'Data Study',
    title: 'The U.S. just turned off the hunger meter. The last reading was 13.7%.',
    dek: 'On December 30, 2025, USDA published its final annual household food security report. After 30 years of one consistent series, the only national measurement of who can’t eat in America is over — in the same calendar year the program it measured got cut by $186 billion.',
    href: 'blog/usda-final-hunger-reading.html', shape: 'line' },
  { n: '039', date: 'May 17, 2026', read: '4 min', kind: 'Data Study',
    title: 'The FBI’s pipeline got fast. The polls trying to measure how it landed are a mess.',
    dek: 'On May 13 the FBI released preliminary 2025 crime data four months faster than last year’s release. The crime supply side is the cleanest it has ever been. The two polls about how anyone feels about it cannot agree on a question.',
    href: 'blog/fbi-2025-pipeline-polls.html', shape: 'dotgrid' },
  { n: '038', date: 'May 16, 2026', read: '5 min', kind: 'Data Study',
    title: 'The measles clock',
    dek: 'The U.S. eliminated measles in 2000. In 2025 we had the worst year since. With seven months left in 2026, we are already on the second-worst. The clock that would un-eliminate it has rules nobody has started.',
    href: 'blog/measles-second-worst-year.html', shape: 'strata' },
  { n: '037', date: 'May 14, 2026', read: '4 min', kind: 'Data Study',
    title: 'The chronic absenteeism recovery has the shape of a curve that doesn’t reach 15%.',
    dek: 'Pre-pandemic, the country sat near 15% chronic absenteeism. It peaked at 28.5% in 2022. Each year since, the gain has been roughly half the size of the last. That’s not the shape of a recovery. That’s an asymptote.',
    href: 'blog/chronic-absenteeism-asymptote.html', shape: 'rings' },
  { n: '036', date: 'May 13, 2026', read: '3 min', kind: 'Data Study',
    title: 'None',
    dek: 'Roughly 4.3 million fewer Americans were on SNAP in January 2026 than a year earlier. The unemployment rate barely budged. The two numbers were supposed to track each other. This year they didn’t.',
    href: 'blog/every-state-snap-rolls-fell.html', shape: 'overlap' },
  { n: '035', date: 'May 12, 2026', read: '3 min', kind: 'Data Study',
    title: 'One reform, two scoreboards. The slow one moved last.',

const cdfaStyles = {
  smallcaps: { fontFamily: 'var(--mono)', fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 500 },
  rule: { height: 1, background: 'var(--rule)', border: 0, margin: 0 },
  ruleDouble: { borderTop: '1px solid var(--ink)', borderBottom: '1px solid var(--ink)', height: 6, margin: 0 }
};

const Rule = ({ double, style }) => (
  double ? <div style={{ ...cdfaStyles.ruleDouble, ...style }} /> : <hr style={{ ...cdfaStyles.rule, ...style }} />
);

const Small = ({ children, style, as:Tag='span' }) => (
  <Tag style={{ ...cdfaStyles.smallcaps, ...style }}>{children}</Tag>
);

const CdfaButton = ({ children, variant='solid', as='a', href='#', onClick, style }) => {
  const base = {
    display: 'inline-flex', alignItems: 'center', gap: 10, padding: '14px 22px',
    fontFamily: 'var(--mono)', fontSize: 12, letterSpacing: '0.12em',
    textTransform: 'uppercase', fontWeight: 600,
    textDecoration: 'none', cursor: 'pointer', border: '1.5px solid var(--ink)',
    transition: 'transform .15s ease, background .15s ease, color .15s ease',
    userSelect: 'none',
  };
  const solid = { background: 'var(--ink)', color: 'var(--paper)' };
  const ghost = { background: 'transparent', color: 'var(--ink)' };
  const Cmp = as;
  const [hover, setHover] = React.useState(false);
  const hoverStyle = hover
    ? (variant === 'solid' ? { background: 'var(--paper)', color: 'var(--ink)' } : { background: 'var(--ink)', color: 'var(--paper)' })
    : {};
  return (
    <Cmp href={href} onClick={onClick}
      onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{ ...base, ...(variant==='solid'?solid:ghost), ...hoverStyle, ...style }}>
      <span>{children}</span>
      <span aria-hidden="true" style={{ fontFamily:'var(--mono)' }}>→</span>
    </Cmp>
  );
};

const Ticker = ({ items, speed=60 }) => {
  const content = [...items, ...items, ...items];
  return (
    <div style={{ overflow:'hidden', borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', background:'var(--paper)', position:'relative' }}>
      <div style={{ display:'flex', whiteSpace:'nowrap', animation:`cdfa-ticker ${speed}s linear infinite`, padding:'14px 0' }}>
        {content.map((t,i)=>(
          <span key={i} style={{ fontFamily:'var(--mono)', fontSize:13, letterSpacing:'0.08em', textTransform:'uppercase', display:'inline-flex', alignItems:'center', gap:24, padding:'0 24px' }}>
            <span style={{ width:6, height:6, background:'var(--ink)', borderRadius:'50%', display:'inline-block' }} />
            {t}
          </span>
        ))}
      </div>
      <style>{`@keyframes cdfa-ticker { from { transform: translateX(0); } to { transform: translateX(-${100/3}%); } }`}</style>
    </div>
  );
};

    background: active ? 'var(--ink)' : 'transparent', color: active ? 'var(--paper)' : 'var(--ink)',
  });
  const set = (k, v) => setState({ ...state, [k]: v });
  return (
    <div style={{ position:'fixed', bottom:20, right:20, zIndex:100, width:280, background:'var(--paper)', border:'1.5px solid var(--ink)', padding:'14px 18px 16px', boxShadow:'6px 6px 0 var(--ink)', fontFamily:'var(--body)' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:4 }}>
        <span style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:18, textTransform:'uppercase', letterSpacing:'0.02em' }}>Tweaks</span>
        <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--muted)' }}>Live</span>
      </div>
      <div style={row}>
        <span style={label}>Style direction</span>
        <div style={pills}>
          {[['paper','Paper'],['poster','Poster'],['zine','Zine']].map(([v,l])=>(
            <button key={v} style={pill(state.theme===v)} onClick={()=>set('theme', v)}>{l}</button>
          ))}
        </div>
      </div>
      <div style={row}>
        <span style={label}>Type pairing</span>
        <div style={pills}>
          {[['slab-serif','Slab + Serif'],['grotesk-serif','Grotesk + Serif'],['slab-mono','Slab + Mono'],['display-serif','Display + Serif']].map(([v,l])=>(
            <button key={v} style={pill(state.pair===v)} onClick={()=>set('pair', v)}>{l}</button>
          ))}
        </div>
      </div>
      <div style={row}>
        <span style={label}>Ticker</span>
        <div style={pills}>
          <button style={pill(state.showTicker)} onClick={()=>set('showTicker', true)}>On</button>
          <button style={pill(!state.showTicker)} onClick={()=>set('showTicker', false)}>Off</button>
        </div>
      </div>
      <div style={{ ...row, borderBottom:'none', paddingBottom:0 }}>
        <span style={label}>Colophon</span>
        <div style={pills}>
          <button style={pill(state.showColophon)} onClick={()=>set('showColophon', true)}>On</button>
          <button style={pill(!state.showColophon)} onClick={()=>set('showColophon', false)}>Off</button>
        </div>
      </div>
    </div>
  );
};

// ==================== app.jsx ====================
const SubscribeAndColophon = ({ showColophon }) => (
  <footer style={{ borderTop:'1px solid var(--ink)', marginTop:40 }}>
    <Container>
      {showColophon && (
        <div style={{ padding:'48px 0 32px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }} className="cdfa-colophon">
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Colophon</div>
            <div>Hosted on Github pages. Built with a mix of Claude and TJ.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>
            <div>All text, charts, and datasets are published under CC BY 4.0. Copy us, cite us, improve us. Corrections, at the bottom of every piece.</div>
          </div>
        </div>
      )}
      <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
        <span>© 2013–2026 <a href="https://www.standardco.de" target="_blank" rel="noopener" style={{ color:'inherit', borderBottom:'1px solid currentColor', textDecoration:'none' }}>Standard Co</a> · All rights unreserved</span>
      </div>
    </Container>
    <style>{`
      @media (max-width: 820px){
        .cdfa-colophon{ grid-template-columns: 1fr !important; }
      }
    `}</style>
  </footer>
);

const readDefaults = () => {
  try {
    const el = document.getElementById('tweak-defaults');
    const text = el.textContent;
    const m = text.match(/\{[\s\S]*\}/);
    return m ? JSON.parse(m[0]) : {};
  } catch { return {}; }
};

function App(){
  const [state, setState] = React.useState(() => ({
    theme:'paper', pair:'slab-serif', showTicker:true, showColophon:true,
    ...readDefaults(),
  }));
  const [editVisible, setEditVisible] = React.useState(true);

  React.useEffect(()=>{
    const html = document.documentElement;
    html.setAttribute('data-theme', state.theme);
    html.setAttribute('data-pair', state.pair);
  }, [state.theme, state.pair]);

  React.useEffect(()=>{
    const handler = (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === '__activate_edit_mode') setEditVisible(true);
      if (d.type === '__deactivate_edit_mode') setEditVisible(false);
    };
    window.addEventListener('message', handler);
    try { window.parent.postMessage({ type:'__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <div data-screen-label="01 Home">
      <TopBar />
      <Masthead />
      {state.showTicker && <Ticker items={TICKER} />}
      <HeroLede />
      <Pillars />
      <Featured />
      <DispatchIndex />
      <SubscribeAndColophon showColophon={state.showColophon} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>

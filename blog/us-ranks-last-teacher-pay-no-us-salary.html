// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <UL items={['Item one', 'Item two']} />

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The brief on my desk said American primary teachers earn 37% less than other college grads, against an OECD average gap of 17%. So I went looking for the 17. Found it in the OECD’s <a href="https://www.oecd.org/en/publications/2026/09/education-at-a-glance-2026_3bce4131/full-report/how-much-are-teachers-and-school-heads-paid_a6233c97.html" target="_blank" rel="noopener">teacher pay chapter</a>, published September 29. It’s how much teacher salaries <em>grew</em> in real terms across the OECD between 2015 and 2025. Not a gap. Whoops.
        </P>

        <P>
          The actual average: primary teachers across the OECD make <a href="https://www.oecd.org/en/publications/2026/09/education-at-a-glance-2026_3bce4131/full-report/how-much-are-teachers-and-school-heads-paid_a6233c97.html" target="_blank" rel="noopener">87% of what full-time, full-year workers with a college degree make</a>. It’s 83% in pre-primary, 91% in lower secondary, 95% in upper secondary. So the average gap at primary is 13 points (100 − 87). I couldn’t find the 37 either, so it’s not in this post.
        </P>

        <Fig caption={<>Source: <a href="https://www.oecd.org/en/publications/2026/09/education-at-a-glance-2026_3bce4131/full-report/how-much-are-teachers-and-school-heads-paid_a6233c97.html" target="_blank" rel="noopener">OECD, Education at a Glance 2026, Indicator D3</a>. Actual salaries of teachers relative to full-time, full-year earnings of tertiary-educated 25-64 year-olds, OECD average.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Pre-primary+%2883%25%29%22%2C%22Primary+%2887%25%29%22%2C%22Lower+secondary+%2891%25%29%22%2C%22Upper+secondary+%2895%25%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B83%2C87%2C91%2C95%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%2C%22%23777%22%2C%22%23777%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22OECD+average%3A+teacher+pay+as+a+share+of+other+college+grads%2C+2025%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22x%22%7D%5D%2C%22yAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A100%2C%22stepSize%22%3A20%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+tertiary-educated+workers%5Cu2019+earnings%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22y%22%7D%5D%7D%7D%7D&amp;v=2.9.4&amp;w=900&amp;h=480&amp;bkg=transparent&amp;devicePixelRatio=2" alt="Bar chart of OECD average teacher pay as a share of tertiary-educated workers’ earnings in 2025: pre-primary 83%, primary 87%, lower secondary 91%, upper secondary 95%." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>Dead last, on one dot</H2>

        <P>
          The headline version comes from <a href="https://www.brookings.edu/articles/teacher-pay-in-the-us-is-relatively-low-and-trending-downward/" target="_blank" rel="noopener">Brookings</a>. On October 27, Dan Goldhaber and Dick Startz charted the OECD’s primary teacher numbers and wrote that the US “ranks dead last on the chart,” with teachers estimated to earn less than two-thirds of what other college-educated Americans earn. <a href="https://www.k12dive.com/news/the-us-ranks-last-in-teacher-pay-worldwide/873781/" target="_blank" rel="noopener">K-12 Dive</a> ran it on November 5 as the US ranking last across more than 30 countries.
        </P>

        <P>
          (Full disclosure: I couldn’t pull the US row out of the OECD’s data table myself. That’s Brookings’ read of it, not mine.)
        </P>

        <P>
          I don’t doubt the direction. RAND’s <a href="https://www.rand.org/pubs/research_reports/RRA4404-2.html" target="_blank" rel="noopener">2026 teacher survey</a> has teachers reporting an average base salary of $75,599 against slightly more than $105,000 for similar working adults. That’s a gap of about 28% (1 − 75,599 / 105,000), from 829 teachers and 498 everybody-elses. Brookings cites the Economic Policy Institute at <a href="https://www.brookings.edu/articles/teacher-pay-in-the-us-is-relatively-low-and-trending-downward/" target="_blank" rel="noopener">nearly 27% for 2024</a>. Three shops, three methods, and they all land on a big number.
        </P>

        <H2>There is no American teacher salary</H2>

        <P>
          Here’s the part a data guy can’t unsee. A ranking needs one number per country. And the same OECD chapter that feeds the ranking has a box on what happens inside countries. Starting pay for a US primary teacher <a href="https://www.oecd.org/en/publications/2026/09/education-at-a-glance-2026_3bce4131/full-report/how-much-are-teachers-and-school-heads-paid_a6233c97.html" target="_blank" rel="noopener">runs from $43,669 in North Carolina to $66,244 in California</a>. That’s a 52% spread ($22,575) inside one dot. For principals it’s wilder: $87,502 in West Virginia, $180,545 in New York.
        </P>

        <P>
          The other side of the fraction doesn’t move at all. The OECD’s notes say the college-grad earnings figure covers the whole country, and that its reference year <a href="https://www.oecd.org/en/publications/2026/09/education-at-a-glance-2026_3bce4131/full-report/how-much-are-teachers-and-school-heads-paid_a6233c97.html" target="_blank" rel="noopener">may differ from 2025</a>. So “last in the world” is a salary that changes at every state line, divided by an average that doesn’t, possibly from a different year. Brookings says as much: the penalty and the rankings <a href="https://www.brookings.edu/articles/teacher-pay-in-the-us-is-relatively-low-and-trending-downward/" target="_blank" rel="noopener">vary with how the comparison is done</a>. Summers off push the gap one way. Teachers having more education than the comparison group pushes it the other.
        </P>

        <H2>And the money trail stops in 2019ish</H2>

        <P>
          The best line in the Brookings piece is about where the money went. A hundred years ago, <a href="https://www.brookings.edu/articles/teacher-pay-in-the-us-is-relatively-low-and-trending-downward/" target="_blank" rel="noopener">more than half of school spending went to teacher salaries</a>. Where the data ends, it’s a quarter. Districts added staff instead of raising pay.
        </P>

        <P>
          Where the data ends is just before COVID. It’s November 2026.
        </P>

        <Divider />

        <P>
          I buy that teachers are underpaid. I don’t buy that we know our rank. We’ve got one national dot, a 52% spread hiding inside it, a denominator that ignores where anybody lives, and a spending series that quits before the pandemic. Nobody gets paid the US average. Especially not in North Carolina.
        </P>

        <H3>Sources</H3>
        <UL items={[
          <>OECD, <a href="https://www.oecd.org/en/publications/2026/09/education-at-a-glance-2026_3bce4131/full-report/how-much-are-teachers-and-school-heads-paid_a6233c97.html" target="_blank" rel="noopener">Education at a Glance 2026, Indicator D3: How much are teachers and school heads paid?</a> (September 29, 2026): OECD average relative salaries, 2015-2025 real salary growth, US subnational salary ranges, notes on earnings data</>,
          <>Dan Goldhaber and Dick Startz, <a href="https://www.brookings.edu/articles/teacher-pay-in-the-us-is-relatively-low-and-trending-downward/" target="_blank" rel="noopener">Teacher pay in the US is relatively low and trending downward</a>, Brookings Brown Center Chalkboard (October 27, 2026)</>,
          <>RAND, <a href="https://www.rand.org/pubs/research_reports/RRA4404-2.html" target="_blank" rel="noopener">Teacher Well-Being, Pay, and Intentions to Leave in 2026</a> (June 8, 2026): State of the American Teacher survey, fielded January-February 2026</>,
          <>K-12 Dive, <a href="https://www.k12dive.com/news/the-us-ranks-last-in-teacher-pay-worldwide/873781/" target="_blank" rel="noopener">The US ranks last in teacher pay worldwide</a> (November 5, 2026)</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

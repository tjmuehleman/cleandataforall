// Available helper components:

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">
        <P>
          Wisconsin&rsquo;s public schools have 63,165 fewer students than they did in 2020. They also have 187 fewer licensed staff. And 1,581 more of something called &ldquo;other staff.&rdquo;
        </P>

        <P>
          That&rsquo;s from a May write-up by a <a href="https://reforminggovernment.org/irg-analysis-new-dpi-report-shows-wisconsin-schools-break-all-time-staffing-record/" target="_blank" rel="noopener">think tank called IRG</a>, reading the state&rsquo;s 2026 <a href="https://publicstaffreports.dpi.wi.gov/PubStaffReport/Public/PublicReport" target="_blank" rel="noopener">public school staff reports</a>. (I tried the DPI portal myself. It&rsquo;s a wall of filters, so the Wisconsin numbers here are IRG&rsquo;s read, not mine.) The same piece puts the state at <a href="https://reforminggovernment.org/irg-analysis-new-dpi-report-shows-wisconsin-schools-break-all-time-staffing-record/" target="_blank" rel="noopener">113,171 staff and 791,794 students</a>. One adult for every seven kids.
        </P>

        <P>
          IRG also quotes NCES for the long view: from 2010 to 2025 Wisconsin added 973 teachers and 11,108 non-teachers while losing 65,381 students. Same direction, fifteen years. (That&rsquo;s IRG quoting NCES&rsquo;s table tool. I didn&rsquo;t re-run it.)
        </P>

        <Fig caption={<>Wisconsin public schools, 2020 to 2026, as reported by <a href="https://reforminggovernment.org/irg-analysis-new-dpi-report-shows-wisconsin-schools-break-all-time-staffing-record/" target="_blank" rel="noopener">IRG</a> from DPI&rsquo;s 2026 staff reports. The write-up doesn&rsquo;t say whether these are heads or FTE, or what&rsquo;s in &ldquo;other.&rdquo;</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Students++%28-63%2C165%29%22%2C%22Licensed+staff++%28-187%29%22%2C%22Other+staff++%28%2B1%2C581%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B-63165%2C-187%2C1581%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23777%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.5%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Wisconsin+public+schools%2C+2020+to+2026%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22change%2C+2020+to+2026%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=400&bkg=transparent&devicePixelRatio=2" alt="Bar chart: Wisconsin public schools 2020 to 2026. Students down 63,165; licensed staff down 187; other staff up 1,581." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>The national file has the same shape</H2>

        <P>
          Between fall 2013 and fall 2022, U.S. public school enrollment went from <a href="https://nces.ed.gov/programs/digest/d23/tables/dt23_203.20.asp" target="_blank" rel="noopener">50,044,522 to 49,618,464</a>. That&rsquo;s 426,058 fewer kids. Over the same stretch, <a href="https://nces.ed.gov/programs/digest/d23/tables/dt23_213.10.asp" target="_blank" rel="noopener">staff went from 6,187,901 to 6,795,470 FTE</a>. That&rsquo;s 607,569 more adults.
        </P>

        <P>
          Start at the 2019 peak instead and it gets sillier: 1,177,981 fewer students, 112,168 more staff. (Same two tables, my subtraction.)
        </P>

        <P>
          Teachers grew by 115,131, or 3.7%. Instructional aides grew 22.6%. Support staff added 226,148. The four categories I pulled leave 70,648 FTE unaccounted for, which is just me subtracting, but still. The teacher line is the one everybody argues about. It barely moved.
        </P>

        <H2>Before you write the bloat op-ed</H2>

        <P>
          Aides and support staff are where kids with IEPs get served, and Education Next reports that <a href="https://www.educationnext.org/propulsive-growth-of-non-teaching-school-staff-despite-decline-student-enrollment-public-schools/" target="_blank" rel="noopener">special education staff rose 25.3% while students served under IDEA rose 12.6%</a> between 2007 and 2023. The same piece says instructional aides and student support staff together were <a href="https://www.educationnext.org/propulsive-growth-of-non-teaching-school-staff-despite-decline-student-enrollment-public-schools/" target="_blank" rel="noopener">51.7% of all public school staff growth</a> over the last two decades. So maybe this is bloat. Maybe it&rsquo;s caseload. Maybe it&rsquo;s both, in proportions nobody has published. I can&rsquo;t tell you which. Neither can the chart.
        </P>

        <H2>The actual data problem</H2>

        <P>
          Wisconsin says licensed and other. NCES says teachers, aides, principals, support. Those two taxonomies don&rsquo;t line up, and one of them might be heads while the other is FTE. And the freshest NCES staffing table I could pull stops at fall 2022. Four school years of hiring (and, lately, cutting) have happened since that row.
        </P>

        <P>
          Want to see the problem up close? Pick any district, open its staff file, and ask which column your newest hire landed in. Then ask who decided. Then ask whether the same person decided in the district next door. That last one is where the comparison falls apart.
        </P>

        <Divider />

        <P>
          So: fewer kids, more adults, and a bucket labeled &ldquo;other&rdquo; doing most of the work. Somebody should open the bucket.
        </P>
      </article>
    </Prose>
  </Container>
);

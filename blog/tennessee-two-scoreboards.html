<!doctype html>
<html lang="en" data-theme="paper" data-pair="slab-serif">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="/favicon.ico" />
<title>One reform, two scoreboards. The slow one moved last. — Clean Data for All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Archivo:wght@400;500;700;900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --ink:#141210;
    --paper:#F4EFE6;
    --rule: rgba(20,18,16,.18);
    --rule-soft: rgba(20,18,16,.10);
    --muted: rgba(20,18,16,.62);
    --display: 'Roboto Slab', serif;
    --body: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[data-theme="paper"]{ --ink:#141210; --paper:#F4EFE6; --rule:rgba(20,18,16,.18); --rule-soft:rgba(20,18,16,.10); --muted:rgba(20,18,16,.62); }
  html[data-theme="poster"]{ --ink:#EDE6D8; --paper:#171413; --rule:rgba(237,230,216,.22); --rule-soft:rgba(237,230,216,.10); --muted:rgba(237,230,216,.6); }
  html[data-theme="zine"]{ --ink:#0A0908; --paper:#EFEBDF; --rule:rgba(10,9,8,.35); --rule-soft:rgba(10,9,8,.18); --muted:rgba(10,9,8,.68); }

  html[data-pair="slab-serif"]{ --display:'Roboto Slab', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }
  html[data-pair="grotesk-serif"]{ --display:'Archivo', sans-serif; --body:'Fraunces', Georgia, serif; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="slab-mono"]{ --display:'Roboto Slab', serif; --body:'IBM Plex Mono', monospace; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="display-serif"]{ --display:'Instrument Serif', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }
  body{ font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","ss02","onum"; }
  a{ color: inherit; }
  ::selection{ background: var(--ink); color: var(--paper); }

  body::before{
    content:""; position: fixed; inset:0; pointer-events:none; z-index: 1;
    background-image:
      radial-gradient(rgba(20,18,16,.045) 1px, transparent 1px),
      radial-gradient(rgba(20,18,16,.03) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
    opacity: .7;
  }
  html[data-theme="poster"] body::before{
    background-image:
      radial-gradient(rgba(237,230,216,.04) 1px, transparent 1px),
      radial-gradient(rgba(237,230,216,.025) 1px, transparent 1px);
    mix-blend-mode: screen;
  }

  #root{ position: relative; z-index: 2; }

  .post-body p { margin: 0 0 1.5em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body h2 { font-family: var(--display); font-weight: 900; font-size: clamp(24px, 2.5vw, 34px); line-height: 1.05; margin: 2em 0 0.5em; letter-spacing: -0.01em; }
  .post-body h3 { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 2vw, 26px); line-height: 1.1; margin: 1.8em 0 0.4em; }
  .post-body ul, .post-body ol { margin: 0 0 1.5em; padding-left: 1.4em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body li { margin-bottom: 0.4em; }
  .post-body blockquote { margin: 2em 0; padding: 0 0 0 24px; border-left: 3px solid var(--ink); font-style: italic; font-size: 20px; line-height: 1.6; max-width: 60ch; color: var(--ink); }
  .post-body blockquote cite { display: block; margin-top: 0.75em; font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .post-body hr { border: 0; border-top: 1px solid var(--rule); margin: 3em 0; }
  .post-body a { border-bottom: 1px solid var(--rule); text-decoration: none; }
  .post-body a:hover { border-bottom-color: var(--ink); }
  .post-body figure { margin: 2.5em 0; }
  .post-body figcaption { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
  .post-body .callout { border: 1px solid var(--ink); padding: 24px 28px; margin: 2.5em 0; max-width: 68ch; }
  .post-body .callout-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .post-body code { font-family: var(--mono); font-size: 0.88em; background: var(--rule-soft); padding: 2px 5px; }
  .post-body pre { font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--rule-soft); padding: 20px 24px; overflow-x: auto; margin: 2em 0; }
</style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel" data-presets="react">

const POST = {
  kind:     'Data Study',
  number:   '035',
  date:     'May 12, 2026',
  readTime: '3 min',
  title:    'One reform, two scoreboards. The slow one moved last.',
  dek:      'Tennessee passed a major reading law in 2021. The state test showed gains three years running. The federal scoreboard barely budged. Four years later, both are pointing the same way.',
  byline:   'T.J. Müehleman',
};

const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>&#8592; All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
          <a href="../index.html#subscribe" style={{ textDecoration:'none' }}>Subscribe</a>
        </div>
      </div>
    </Container>
  </div>
);

const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:24, flexWrap:'wrap' }}>
        <Small style={{ background:'var(--ink)', color:'var(--paper)', padding:'4px 10px' }}>{POST.kind}</Small>
        <Small style={{ color:'var(--muted)' }}>No. {POST.number}</Small>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      <div style={{ maxWidth:900, paddingTop:32 }}>
        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>
          {POST.dek}
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>
        </div>
      </div>
    </div>
  </Container>
);

const PostHero = () => (
  <Container>
    <div style={{ borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'40px 0', margin:'0 0 56px' }}>
      <figure style={{ margin:0, textAlign:'center' }}>
        <img
          src="https://quickchart.io/chart/render/zf-ee2650aa-b158-4d70-aeaa-5811fe20951c"
          alt="Bar chart of Tennessee TCAP 3rd grade ELA proficiency: 40% in 2023, 40.9% in 2024, 41.7% in 2025."
          style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
        />
        <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:12, maxWidth:760, margin:'12px auto 0' }}>
          Source: <a href="https://www.tn.gov/education/news/2024/6/13/tdoe-releases-2023-24-3rd-grade-and-4th-grade-ela-tcap-state-level-results.html">Tennessee DOE TCAP 2023–24 release</a>;{' '}
          <a href="https://tnscore.org/perspectives-and-press/perspectives/2025-tcap-data-our-compass-for-the-work-ahead">Tennessee SCORE, 2025 TCAP analysis</a>. Third year of year-over-year improvement at this grade and subject.
        </figcaption>
      </figure>
    </div>
  </Container>
);

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&#8212; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Tennessee passed its big reading law in May 2021. Mandatory phonics. K&#8211;3 screeners. Teacher
          training. Third-grade retention with intervention. Then everybody had to wait for the test
          results to come in.
        </P>

        <P>
          Two of them, actually. Tennessee runs its state assessment &#8212; TCAP &#8212; every spring. Every
          student. Results in the summer. The federal scoreboard, NAEP, runs every two years, samples
          roughly <a href="https://www.chalkbeat.org/tennessee/2025/01/29/naep-students-buck-national-trends-nations-report-card-2024/">1,700&#8211;1,800
          Tennessee students per assessment</a>, and won&#8217;t release a new data point until early 2027.
        </P>

        <P>
          When the question is &#8220;is a policy working?&#8221;, those two cadences don&#8217;t tell you the
          same story on the same day.
        </P>

        <H2>The fast scoreboard moved first</H2>

        <P>
          Tennessee&#8217;s state test is annual, near-census, and short-cycle. Third-grade ELA proficiency
          went from <a href="https://www.tn.gov/education/news/2024/6/13/tdoe-releases-2023-24-3rd-grade-and-4th-grade-ela-tcap-state-level-results.html">40.0%
          in 2023 to 40.9% in 2024</a>, then to{' '}
          <a href="https://tnscore.org/perspectives-and-press/perspectives/2025-tcap-data-our-compass-for-the-work-ahead">41.7%
          in 2025</a>. Three years in a row. Each year-over-year move is small. Each one survives.
        </P>

        <P>
          And critically: in 2025, all four core subjects in grades 3&#8211;8 hit{' '}
          <a href="https://www.tn.gov/education/news/2025/7/8/tdoe-announces-year-over-year-improvement-across-all-subject-areas.html">post-pandemic
          highs across the state</a>, and every major student group made progress between 2024 and 2025.
          That last clause is the part that matters. A state can post a record headline while the
          subgroup numbers backslide. Tennessee&#8217;s didn&#8217;t.
        </P>

        <H2>The slow scoreboard finally moved second</H2>

        <P>
          NAEP is a different animal. The 2024 cycle was the first federal snapshot to land after the
          2021 reading law had three full school years to work on it. Tennessee&#8217;s 4th-grade reading
          average went from <a href="https://nces.ed.gov/nationsreportcard/subject/publications/stt2024/pdf/2024220TN4.pdf">214
          in 2022 to 215 in 2024</a> &#8212; one point. Not statistically significant, per NCES.
        </P>

        <P>
          The national average over the same window dropped from 216 to 214. Tennessee didn&#8217;t
          really climb. The country sank around it. And on the state rankings, that one-point hold turned
          into a <a href="https://www.chalkbeat.org/tennessee/2025/01/29/naep-students-buck-national-trends-nations-report-card-2024/">jump
          from 35th to 23rd in 4th-grade reading</a>.
        </P>

        <Fig caption={<>Source: <a href="https://nces.ed.gov/nationsreportcard/subject/publications/stt2024/pdf/2024220TN4.pdf">NCES Tennessee Grade 4 Reading Snapshot 2024</a>. The Tennessee 2-cycle change is not statistically significant per NCES; the national 2-point decline is.</>}>
          <img
            src="https://quickchart.io/chart/render/zf-b722ec3d-df53-468c-a726-f082c2281293"
            alt="Line chart comparing NAEP 4th grade reading average scale scores in 2022 and 2024 for Tennessee (214 to 215) and the nation (216 to 214). Tennessee holds; the nation declines."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          Rankings are a relative measure. NAEP at the state level uses roughly 1,700 students per grade
          per state per cycle. That sample size is enough to detect a big move and not enough to detect
          a one-point one. The error bars on a single-point shift are wider than the shift itself.
          That&#8217;s not a flaw &#8212; that&#8217;s the design. NAEP is built to catch decade-scale
          trends, not policy-by-policy report cards.
        </P>

        <H2>When two instruments agree, you can write the headline</H2>

        <P>
          The thing nobody quite explains in the press releases is why you needed both. If you only had
          NAEP, you&#8217;d be looking at four years of public debate and one statistically insignificant
          blip. If you only had TCAP, you&#8217;d be looking at a state insisting its own test shows
          progress &#8212; which is, in fairness, what every state with a low NAEP score also says.
        </P>

        <P>
          The case for &#8220;Tennessee&#8217;s reading law is working&#8221; comes from the fact that
          a sample-based federal instrument and a census-based state instrument finally point the same
          direction on the cohort that received the full intervention. The state test caught the move
          two years before the federal test could. The federal test confirmed it.
        </P>

        <H2>Mississippi tells you what NAEP can and can&#8217;t see</H2>

        <P>
          Mississippi passed its Literacy-Based Promotion Act in 2013. Eleven years later, after adjusting
          for student demographics, <a href="https://www.mississippifirst.org/contextualizing-mississippis-2024-naep-scores/">Mississippi&#8217;s
          4th graders ranked first in the nation in 4th-grade reading and math</a> on the 2024 NAEP, per
          Urban Institute analysis cited by Mississippi First. Mississippi&#8217;s Black 4th graders rank
          third in the country.
        </P>

        <P>
          Mississippi&#8217;s 8th graders, who hit the reform after the early-intervention window had
          closed, scored <a href="https://nces.ed.gov/nationsreportcard/subject/publications/stt2024/pdf/2024220MS8.pdf">253
          on NAEP reading in 2024 &#8212; the same as 2022</a>, and basically where the state sat in 1998.
          The reading gains held at the grade the reform was built for. They didn&#8217;t carry forward.
        </P>

        <P>
          NAEP can absolutely show you a decade-long cohort effect when it&#8217;s that big. It just
          needs the decade.
        </P>

        <Callout label="Key figure">
          Tennessee&#8217;s 4th-grade NAEP reading average moved 1 point between 2022 and 2024 (not
          statistically significant). The national average fell 2 points over the same window. Tennessee
          jumped 12 spots in the state rankings on a non-significant change &#8212; because the field around
          it dropped.
        </Callout>

        <H2>The next federal cycle is in a year, maybe more</H2>

        <P>
          The 2026 NAEP administration window <a href="https://nces.ed.gov/nationsreportcard/about/calendar.aspx">ran
          January 26 through March 20</a>. Results aren&#8217;t expected until early 2027. Anyone trying
          to evaluate a state&#8217;s reading reform today gets one new data point per twenty-four months
          on the federal side, twelve months on the state side, and the two instruments don&#8217;t
          really agree until the cohort has been through the whole intervention.
        </P>

        <P>
          If you&#8217;re a superintendent, you&#8217;re committing to a curriculum decision today on data
          that won&#8217;t be ready to confirm or refute you until 2028. That&#8217;s the policy
          environment. The two-scoreboard wait is the policy environment.
        </P>

        <Divider />

        <P>
          The federal scoreboard finally moved. The state scoreboard already had. Both took longer than
          the political debate that produced them.
        </P>

        <P style={{ fontStyle:'italic', color:'var(--muted)' }}>&#8212; TJ</P>

      </article>
    </Prose>
  </Container>
);

const Footer = () => {
  const [email, setEmail] = React.useState('');
  const [sent, setSent] = React.useState(false);
  return (
    <footer id="subscribe" style={{ borderTop:'1px solid var(--ink)', marginTop:80 }}>
      <Container>
        <div style={{ padding:'64px 0 40px', maxWidth:560 }}>
          <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, color:'var(--muted)' }}>&sect; Subscribe</span>
          <h3 style={{ fontFamily:'var(--display)', fontWeight:900, letterSpacing:'-0.01em', fontSize:'clamp(32px, 4vw, 56px)', lineHeight:0.95, margin:'8px 0 16px' }}>
            The dispatch,<br/>every Saturday morning.
          </h3>
          <p style={{ fontSize:17, lineHeight:1.55, maxWidth:'42ch', margin:'0 0 24px', textWrap:'pretty' }}>
            One email a week. A short essay, a chart, and links to anything we read
            that changed the way we read public data. No tracking pixels.
          </p>
          <form onSubmit={(e)=>{ e.preventDefault(); setSent(true); }}
            style={{ display:'flex', gap:0, maxWidth:460, border:'1.5px solid var(--ink)' }}>
            <input value={email} onChange={e=>setEmail(e.target.value)}
              type="email" placeholder="you@yourdomain.org" required
              style={{ flex:1, border:0, background:'transparent', padding:'14px 16px', fontFamily:'var(--body)', fontSize:16, color:'var(--ink)', outline:'none' }}/>
            <button type="submit"
              style={{ border:0, borderLeft:'1.5px solid var(--ink)', padding:'0 20px', background:'var(--ink)', color:'var(--paper)', fontFamily:'var(--mono)', fontSize:12, letterSpacing:'0.12em', textTransform:'uppercase', cursor:'pointer', fontWeight:600 }}>
              {sent ? 'Sent ✓' : 'Subscribe →'}
            </button>
          </form>
          {sent && <p style={{ marginTop:10, fontFamily:'var(--mono)', fontSize:12, color:'var(--muted)' }}>Check your inbox &#8212; the confirmation note is on its way.</p>}
        </div>

        <Rule />

        <div style={{ padding:'24px 0 40px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }}>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Colophon</div>
            <div>Hosted on GitHub Pages. No trackers, no cookies, no stock photography. Built by hand at Standard Co.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>
            <div>All text, charts, and datasets are published under CC BY 4.0. Copy us, cite us, improve us. Corrections, at the bottom of every piece.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Contact</div>
            <div>info@standardco.de<br/>Standard Co, est. 2013<br/>A reader-supported project.</div>
          </div>
        </div>

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
          <span>&copy; 2013&#8211;2026 Standard Co &middot; All rights unreserved</span>
          <span>Made with help from Claude</span>
        </div>
      </Container>
      <style>{`
        @media (max-width: 820px){
          .cdfa-colophon{ grid-template-columns: 1fr !important; }
        }
      `}</style>
    </footer>
  );
};

function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

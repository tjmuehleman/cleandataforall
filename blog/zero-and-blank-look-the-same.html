const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The Education Department published the 2023-24 Civil Rights Data Collection in the
          first week of September. <a href="https://www.edweek.org/leadership/ed-dept-releases-data-on-schools-racial-disparities-months-late/2026/09" target="_blank" rel="noopener">More than eight months</a> after
          the date it had given itself. No press release, no report of top-line findings — a
          download link showed up on a page one day and that was the release.
        </P>

        <P>
          Here's the part I keep chewing on as a data person and not a policy person. This file is
          the only national count of how often American schoolchildren get arrested at school. And
          nobody has ever been able to add it up.
        </P>

        <P>
          Not because the arrests don't happen. Because of a schema decision.
        </P>

        <P>
          The CRDC asks every district to report school-related arrests. Districts that don't track
          arrests, or can't pull them out of whatever system they're in, or just don't feel like it,
          type a 0. The Department knows. Its own <a href="https://www.ed.gov/sites/ed/files/about/offices/list/ocr/docs/crdc-data-notes.doc" target="_blank" rel="noopener">Data Notes</a> say
          districts &ldquo;unable to report complete and accurate data&rdquo; on arrests and
          law-enforcement referrals &ldquo;may have reported zero students.&rdquo;
        </P>

        <P>
          So the field accepts that zero. It also accepts a real zero. In the CSV they are the same byte.
        </P>

        <P>
          Daniel Losen at UCLA's Center for Civil Rights Remedies actually ran the audit. In 2015-16,
          <a href="https://files.eric.ed.gov/fulltext/ED613535.pdf" target="_blank" rel="noopener"> 60% of districts</a> with
          at least 1,000 secondary students reported zero school-related arrests. In 2017-18 it got
          slightly worse: <a href="https://files.eric.ed.gov/fulltext/ED613535.pdf" target="_blank" rel="noopener">61%</a>.
        </P>

        <P>
          Sixty-one percent of the big districts. Reported nothing.
        </P>

        <P>
          And the conclusion Losen drew is the one nobody quotes.
        </P>

        <BQ cite="Losen, Martinez &amp; Shin, Disabling Inequity, UCLA Civil Rights Project, 2021">
          &hellip;with so many large districts reporting zeros, it is not possible to calculate
          national- or state-level numbers with accuracy.
        </BQ>

        <P>
          He refused to compute national rates off the file. Everybody citing the file in arguments
          about school policing went ahead anyway.
        </P>

        <H2>The zeros with names on them</H2>

        <P>
          A few of those zeros can be checked against some other government's paperwork, which is how
          you know they're wrong.
        </P>

        <P>
          New York City — the largest school system in the country — reported zero school-related
          arrests for 2017-18. NYPD's own school safety records show officers
          <a href="https://publicintegrity.org/inside-publici/newsletters/watchdog-newsletter/underreporting-police-schools-arrests/" target="_blank" rel="noopener"> arrested nearly 1,200 students</a> on
          campuses between July 2017 and June 2018.
        </P>

        <P>
          Pittsburgh reported zero. Pennsylvania's Department of Education counted
          <a href="https://publicintegrity.org/inside-publici/newsletters/watchdog-newsletter/underreporting-police-schools-arrests/" target="_blank" rel="noopener"> 86 arrests</a> in
          that district that year. Pittsburgh called it a data entry error. The number was never
          corrected on the federal site. Three other districts among the ten largest, Chicago among
          them, also reported zero.
        </P>

        <Fig caption={<>Source: Center for Public Integrity, &ldquo;Underreporting undermines accountability about police and schools&rdquo; (Oct. 15, 2021), citing NYPD school safety reports and the Pennsylvania Department of Education. The CRDC bars are zero, so they render as nothing &mdash; which is the point.</>}>
          <img src={CHART_GAP} alt="School-related arrests in 2017-18: New York City reported 0 to the CRDC while NYPD logged nearly 1,200; Pittsburgh reported 0 while Pennsylvania counted 86" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Two agencies. One district. One school year. Two answers. One of them is the one everybody cites.
        </P>

        <H2>The part that actually bugs me</H2>

        <P>
          Everyone frames this as an enforcement problem. Districts don't comply, OCR won't penalize
          anybody, there's no consequence. All true. But it's downstream of something more boring and
          much more fixable.
        </P>

        <Callout label="The bug">
          A required numeric field with no way to distinguish &ldquo;none happened&rdquo; from
          &ldquo;we don't have this&rdquo; is a broken field. That's the whole thing.
        </Callout>

        <P>
          Anybody who has ever built an intake form knows exactly what happens when you make a number
          required and give the user no way to say <em>I don't know</em>: they type a zero and get on
          with their day. Not out of malice. Because they want to submit the form.
        </P>

        <P>
          ED has started telling districts when a zero is appropriate versus a null — instructions
          that first appeared in the 2017-18 collection. Instructions. Not validation. Not a separate
          &ldquo;not collected&rdquo; code that survives into the public file where a researcher
          would see it.
        </P>

        <P>
          Meanwhile the 2023-24 file is sitting there unanalyzed, with no topline report from the
          agency that built it. Education Week said it
          <a href="https://www.edweek.org/leadership/ed-dept-releases-data-on-schools-racial-disparities-months-late/2026/09" target="_blank" rel="noopener"> won't publish any of the actual numbers</a> until
          it has vetted the files for errors. A newsroom doing the data-quality review the publisher

        </P>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Last week my middle-schooler patiently explained to me &mdash; with the look kids reserve for confused boomers &mdash; that under the school&rsquo;s new policy he literally cannot text me when soccer ends. The data is allegedly fine with this. The data is, as usual, fine with a lot of things at once.
        </P>

        <P>
          Thirty-three states and DC now have laws restricting cellphones in K&ndash;12 schools. <a href="https://news.ballotpedia.org/2026/03/26/kansas-becomes-thirty-third-state-to-enact-a-k-12-cellphone-ban/">Kansas became the 33rd in March 2026.</a> Most of those laws moved through legislatures inside eighteen months, on the strength of a feeling. The evidence base behind that feeling, as of right now, is one working paper.
        </P>

        <P>
          The paper is <a href="https://www.nber.org/papers/w34388">NBER w34388</a>, David Figlio and Umut &Ouml;zek, October 2025. Florida&rsquo;s 2023 cellphone law (<a href="https://news.ballotpedia.org/2024/08/15/eight-states-have-implemented-statewide-policies-on-k-12-school-cellphone-usage/">HB 379</a>, the first statewide ban in the country), one large urban district, student-level administrative data, quasi-experimental design. It is <em>the</em> rigorous test we have of &ldquo;did the bans work.&rdquo; If you read coverage of the paper, you saw one number: the ban lifted spring test scores by <a href="https://www.nber.org/digest/202512/school-cell-phone-bans-and-student-achievement">1.1 percentile in year two</a>.
        </P>

        <P>
          Here&rsquo;s the version that didn&rsquo;t travel.
        </P>

        <P>
          In year one, suspensions climbed <a href="https://www.edweek.org/technology/do-school-cellphone-bans-work-what-early-findings-tell-us/2025/10">as much as 12%</a>, and the spike fell disproportionately on Black students. Year two, the suspension spike mostly dissipated. Year-two test scores were higher (<a href="https://www.nber.org/digest/202512/school-cell-phone-bans-and-student-achievement">+1.4 percentile for boys, +1.3 percentile for middle and high schoolers</a>). And the test-score effect for Black students &mdash; the group whose discipline got worse first &mdash; was, in the paper&rsquo;s own phrasing, &ldquo;<a href="https://www.nber.org/digest/202512/school-cell-phone-bans-and-student-achievement">modestly smaller and statistically insignificantly distinct from zero</a>.&rdquo;
        </P>

        <H2>Pick a year, pick a subgroup, pick a headline</H2>

        <P>
          Here&rsquo;s the data person&rsquo;s version of &ldquo;the ban worked.&rdquo; Pick the year, pick the subgroup, pick the outcome variable, and you can produce three different headlines from one paper. Year-one suspensions, you get a story about disparate impact. Year-two scores for boys, you get a +1.4 percentile bounce. Year-two scores for Black students, you get a confidence interval that quietly straddles zero.
        </P>

        <P>
          This isn&rsquo;t a methodology gripe. The paper is careful. The disclosure is in the abstract. What&rsquo;s interesting (the data-guy thing) is which of the paper&rsquo;s findings made it to legislatures and which didn&rsquo;t. Thirty-three states wrote the headline number on the bill. Almost none of those bills wrote year-one disciplinary thresholds into implementation guidance.
        </P>

        <Callout label="Worth pausing on">
          77% of U.S. public schools already prohibit cellphones during any class &mdash; 86% of elementary schools, 55% of high schools &mdash; per the December 2024 <a href="https://nces.ed.gov/learn/press-release/more-half-public-school-leaders-say-cell-phones-hurt-academic-performance">NCES School Pulse Panel</a>. Most state laws are catching up to building-level rules that already existed, and overlaying them with whatever the legislature thinks &ldquo;all-day&rdquo; means.
        </Callout>

        <H2>One paper, one county, two years</H2>

        <P>
          The thing that should keep you up if you build data systems for a living: the NBER paper has two findings, and one is bigger than the other. The smaller one is the one that compresses into a campaign-trail bumper sticker. The bigger one disappears into a footnote about confidence intervals. The state-law map drew itself around the bumper sticker.
        </P>

        <P>
          And it&rsquo;s a single county. Florida is enormous; the paper studies one large urban district&rsquo;s admin data, which is the right move for causal identification but a bad ratio for &ldquo;the country&rsquo;s policy decision rests on this.&rdquo; A second NBER paper landed shortly after &mdash; <a href="https://www.nber.org/papers/w35132">w35132</a>, on lockable phone pouches &mdash; and is going to add its own findings to the pile. The map of state laws will not redraw itself when it does.
        </P>

        <Divider />

        <P>
          The bans probably do something. The cleanest evidence we have says it&rsquo;s about a percentile, after a year, with a year-one disciplinary cost we already saw and a disparate impact we already measured. We didn&rsquo;t run out of data. We ran out of patience for it.
        </P>

        <P><em>&mdash; TJ</em></P>

        <Divider />

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://www.nber.org/papers/w34388">NBER Working Paper w34388</a> (Figlio &amp; &Ouml;zek, Oct 2025) &mdash; the underlying paper.</>,
          <><a href="https://www.nber.org/digest/202512/school-cell-phone-bans-and-student-achievement">NBER Digest, December 2025</a> &mdash; the +1.1 percentile year-2 number, the +1.4 / +1.3 subgroup numbers, and the &ldquo;statistically insignificantly distinct from zero&rdquo; phrasing for Black students.</>,
          <><a href="https://www.edweek.org/technology/do-school-cellphone-bans-work-what-early-findings-tell-us/2025/10">Education Week, Oct 2025</a> &mdash; the &ldquo;up as much as 12%&rdquo; year-one suspension figure and the disproportionate impact on Black students, mostly fading in year two.</>,
          <><a href="https://news.ballotpedia.org/2026/03/26/kansas-becomes-thirty-third-state-to-enact-a-k-12-cellphone-ban/">Ballotpedia, March 2026</a> &mdash; the running state-law count (Kansas as 33rd state).</>,
          <><a href="https://nces.ed.gov/learn/press-release/more-half-public-school-leaders-say-cell-phones-hurt-academic-performance">NCES School Pulse Panel, Feb 2025 release</a> &mdash; the 77% / 86% / 55% building-level policy figures.</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

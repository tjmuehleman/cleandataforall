// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Canada lost its measles elimination status on{' '}
          <a href="https://www.canada.ca/en/public-health/news/2025/11/statement-from-the-public-health-agency-of-canada-on-canadas-measles-elimination-status.html">November
          10, 2025</a>. Twelve months of continuous transmission. Twenty-seven-year run, ended. Around{' '}
          <a href="https://www.cidrap.umn.edu/measles/canada-loses-measles-elimination-status-after-record-year-outbreaks">5,425
          cases</a> reported in 2025, with{' '}
          <a href="https://www.cbc.ca/news/health/livestory/canada-measles-elimination-status-9.6973195">84% in
          Ontario and Alberta</a>.
        </P>

        <P>
          The news headline is the elimination loss. The data headline is the trigger itself.
        </P>

        <P>
          &#8220;Twelve months of sustained transmission&#8221; is a definition, not a forecast. PAHO actually
          counts &#8212; week by week, lab-confirmed case by lab-confirmed case &#8212; that the chain hasn&#8217;t
          broken. If you can&#8217;t count, you can&#8217;t trigger. If you can&#8217;t trigger, the certification
          doesn&#8217;t change. The disease doesn&#8217;t care; the status does.
        </P>

        <P>
          The U.S. is on the same clock. As of{' '}
          <a href="https://publications.aap.org/aapnews/news/35082/Measles-cases-rise-to-1-842-two-jurisdictions">May
          14, 2026, the CDC reports 1,893 confirmed cases across 40 jurisdictions</a>, with 27 new outbreaks
          opened in 2026 and{' '}
          <a href="https://publications.aap.org/aapnews/news/35082/Measles-cases-rise-to-1-842-two-jurisdictions">93%
          of cases tied to an active outbreak chain</a>. The American chain started in{' '}
          <a href="https://en.wikipedia.org/wiki/Measles_resurgence_in_the_United_States">late 2024</a>. The
          12-month timer is somebody&#8217;s job to keep watching.
        </P>

        <P>
          The numbers are the easy part. The thing that makes the next year of those numbers genuinely
          uncertain is not the disease. It&#8217;s the budget for counting.
        </P>

        <H2>The lab network that flags an outbreak is going to public fundraising</H2>

        <P>
          The WHO Foundation went public on{' '}
          <a href="https://www.who.foundation/post/who-foundation-launches-urgent-appeal-to-save-measles-and-rubella-surveillance-network-as-global-outbreaks-escalate">May
          29, 2025</a> with an emergency appeal for{' '}
          <a href="https://www.who.foundation/post/who-foundation-launches-urgent-appeal-to-save-measles-and-rubella-surveillance-network-as-global-outbreaks-escalate">$3.6
          million</a> to keep the Global Measles and Rubella Laboratory Network running in 22 high-risk
          African countries. Same page, smaller print: the{' '}
          <a href="https://www.who.foundation/post/who-foundation-launches-urgent-appeal-to-save-measles-and-rubella-surveillance-network-as-global-outbreaks-escalate">full
          network &#8212; 700+ laboratories across 190 countries</a> &#8212; needs $22 million a year just to
          operate. The U.S. CDC was{' '}
          <a href="https://www.statnews.com/2025/06/09/trump-global-aid-cuts-who-foundation-tries-public-fundraising-to-save-measles-lab-network/">one
          of the largest historical funders</a>. That contribution got cut.
        </P>

        <Fig caption={<>Source: <a href="https://www.who.foundation/post/who-foundation-launches-urgent-appeal-to-save-measles-and-rubella-surveillance-network-as-global-outbreaks-escalate">WHO Foundation &#8212; Urgent appeal to save measles and rubella surveillance network</a> (May 29, 2025). The $3.6M emergency target funds 22 high-risk African countries; the $22M annual figure covers the full 700-lab, 190-country network.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Emergency%20public%20appeal%20target%22%2C%22Annual%20cost%20of%20the%20full%20lab%20network%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22USD%20millions%22%2C%22data%22%3A%5B3.6%2C22%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22WHO%20Foundation%20measles%20appeal%3A%20ask%20vs.%20need%22%2C%22fontSize%22%3A16%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A25%2C%22stepSize%22%3A5%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22USD%20millions%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&backgroundColor=transparent&devicePixelRatio=2&nonce=w135417397"
            alt="Horizontal bar chart comparing the WHO Foundation emergency public appeal target of $3.6 million against the full lab network's annual operating cost of $22 million."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          I run a data company. I read this kind of asking-the-public-for-money story for what it implies
          about the institutional pipeline behind it. A surveillance network that&#8217;s gone to public
          fundraising isn&#8217;t a network chasing upside. It&#8217;s a network that&#8217;s already failed
          at its institutional funding source and is patching the floor before the floor falls in.
        </P>

        <P>
          The $3.6 million keeps 22 countries&#8217; labs alive. The other $18.4 million &#8212; the gap
          between the emergency floor and the operating cost &#8212; is the difference between &#8220;we know
          where measles is&#8221; and &#8220;we know where measles is in 22 countries.&#8221;
        </P>

        <H2>The 12-month rule is a data product</H2>

        <P>
          That gap matters here, because the U.S. and Canadian outbreaks don&#8217;t get their lab
          confirmations from U.S. and Canadian labs alone. They draw on the coordinated{' '}
          <a href="https://www.who.foundation/post/who-foundation-launches-urgent-appeal-to-save-measles-and-rubella-surveillance-network-as-global-outbreaks-escalate">700-lab,
          190-country network</a> that does the molecular work &#8212; lineage typing, strain confirmation,
          the part that tells you whether a case is the same chain you already had or a new one. The 12-month
          rule that just took Canada off the elimination list is a data product of the network the WHO
          Foundation is asking the public to keep alive.
        </P>

        <P>
          The brittle thing about a &#8220;12 months of sustained transmission&#8221; definition is that it
          depends on the network never lying down. If labs go offline in 2026, the chain doesn&#8217;t end
          &#8212; the chain just stops being visible to the people whose job it is to count it. The country
          still gets measles either way. The country just stops getting flagged for it.
        </P>

        <Callout label="The data-pipeline read">
          The case count and the lab-network budget are running in opposite directions on the same
          dashboard. We&#8217;re spending less and less to count what&#8217;s getting more and more.
        </Callout>

        <Divider />

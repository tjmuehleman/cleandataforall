const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>Two numbers came out of the New York Fed&rsquo;s first-quarter report, and they point in opposite directions.</P>

        <P>The first one made the headlines: 10.3% of student-loan balances are now 90 or more days past due, up from 9.6% the quarter before (<A href={PR}>NY Fed, May 2026</A>). The delinquency rate is climbing. Grim.</P>

        <P>The second number didn&rsquo;t make the headlines, because it&rsquo;s boring and it&rsquo;s good: the rate at which borrowers are <em>newly</em> falling into serious delinquency dropped from 16.2% to 10.9% (<A href={PR}>same report</A>). The inflow is slowing. The pipe feeding the pool is narrowing even as the pool keeps filling.</P>

        <P>That&rsquo;s a weird combination. A stock still rising while its flow falls is usually what the top of a wave looks like &mdash; the last of the backlog draining through, fewer new bodies arriving behind it. If you&rsquo;re the kind of person who reads Fed tables for fun (hi), you look at those two lines and think: this might be cresting.</P>

        <P>And you might be wrong, because the number that would settle it is switched off.</P>

        <H2>The one line item that moved</H2>

        <P>First, the honest part. This spike is almost entirely a student-loan story. The Fed breaks new flows into serious delinquency out by debt type, and in the year to the first quarter of 2026 student loans went from 8.04% to 10.86%. Everything else barely twitched &mdash; mortgages 1.22 to 1.48, auto loans 2.94 to 2.97, credit cards 7.04 to 7.10 (<A href={PR}>NY Fed</A>). Households aren&rsquo;t collapsing across the board. One drawer of the filing cabinet caught fire.</P>

        <Fig caption={<>In the year to Q1 2026, student loans were the only category that jumped. Mortgages, autos, and cards barely moved. Source: <A href={PR}>NY Fed Household Debt &amp; Credit, Q1 2026</A>.</>}>
          <img src={FLOW_CHART} alt="Flow into serious delinquency by debt type, Q1 2025 vs Q1 2026: student loans jump from 8.04% to 10.86% while all other categories stay nearly flat" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>The reason is mechanical, and I wrote about it back in June: payments were paused for over three years, and a twelve-month &ldquo;on-ramp&rdquo; kept missed payments off credit reports until October 2024 (<A href={LSE}>Liberty Street Economics</A>). Default takes 270 days of nonpayment to register. So the first defaults only began landing on credit files at the end of 2025 &mdash; roughly 1 million in the fourth quarter, another 2.6 million in the first, about 3.6 million borrowers, most of whom were current or didn&rsquo;t even have a payment due back in 2019 (<A href={LSE}>same post</A>). These aren&rsquo;t new deadbeats. It&rsquo;s a reporting turnstile that was bolted shut for four years, finally spinning.</P>

        <H2>The seven million who aren&rsquo;t counted</H2>

        <P>Here&rsquo;s the part that should stop you from calling the peak.</P>

        <P>Buried in the same Fed post: borrowers who had enrolled in the now-dead SAVE repayment plan got parked in a forbearance while the plan&rsquo;s fate ran through the courts. &ldquo;Very few have re-entered repayment,&rdquo; the Fed writes, and there are roughly 7 million of them (<A href={LSE}>Liberty Street Economics</A>). A borrower in forbearance is not delinquent. They don&rsquo;t show up in the 10.3%. They don&rsquo;t show up in the inflow. They are, for now, simply absent from the number &mdash; a second reservoir held behind a policy wall, waiting on a court.</P>

        <Callout label="Key figure">Roughly 7 million SAVE-plan borrowers sit in a litigation forbearance and are not counted as delinquent. When they re-enter repayment, the 270-day default clock starts over. Source: <A href={LSE}>NY Fed, Liberty Street Economics</A>.</Callout>

        <P>So the slowing inflow might mean the wave is cresting. Or it might mean the next wave hasn&rsquo;t been let into the data yet. From where I sit, you cannot tell the two apart. And that is the whole problem with reading this series: three times now &mdash; the pause, the on-ramp, the SAVE forbearance &mdash; the thing being measured has been the reporting rule, not the borrower.</P>

        <Divider />

        <P>A delinquency rate is a snapshot of who was allowed to be in the frame when the shutter clicked. Right now the frame has a seven-million-person hole in it, on purpose. Collections are still suspended too, so even the defaults already on the books aren&rsquo;t garnishing anyone&rsquo;s wages yet (<A href={LSE}>Liberty Street Economics</A>).</P>

        <P>The honest headline isn&rsquo;t &ldquo;student-loan crisis peaks,&rdquo; and it isn&rsquo;t &ldquo;student-loan crisis worsens.&rdquo; It&rsquo;s: we turned the meter off, then on, then half-off again, and now we&rsquo;re surprised the reading is hard to interpret.</P>

        <P>Peak or plateau? Ask me after the court rules.</P>

        <P><em>&mdash; TJ</em></P>

      </article>

);

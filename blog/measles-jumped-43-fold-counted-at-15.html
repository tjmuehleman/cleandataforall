// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In the first three weeks of 2026, seven countries in the Americas confirmed <a href="https://www.paho.org/en/news/4-2-2026-paho-issues-epidemiological-alert-amid-continued-measles-transmission-americas-and">1,031 measles cases</a>. In the same three weeks of 2025, they confirmed 23. That&rsquo;s a 43-fold jump, and it isn&rsquo;t a rounding artifact &mdash; Mexico alone logged 740 of them.
        </P>

        <P>
          Here&rsquo;s the part that keeps me up. The lab network that produced that number &mdash; the one that swabbed the patients, ran the assays, and told the world &ldquo;740, and yes, they&rsquo;re measles&rdquo; &mdash; had secured just <a href="https://www.cfr.org/articles/many-countries-eliminated-measles-why-is-it-coming-back-in-the-u-s-and-globally">15% of its 2026 funding</a> as of December. The alarm is getting louder. We&rsquo;re defunding the alarm.
        </P>

        <H2>The big number is a model</H2>

        <P>
          You&rsquo;ve probably seen the headline figure: <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">11 million measles cases in 2024</a>, roughly 800,000 more than before the pandemic, with an estimated 95,000 deaths, mostly children under five. Enormous, awful, real. Also &mdash; and WHO says this itself, in the note to editors &mdash; modeled. The agency <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">uses statistical modelling</a> to estimate cases and deaths from what countries manage to report, then revises last year&rsquo;s number as better data trickles in.
        </P>

        <P>
          Models are fine. I build them for a living. But a model is only as good as the ground truth underneath it. For measles, the ground truth is the <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">Global Measles and Rubella Laboratory Network</a> &mdash; more than 760 labs that in 2024 tested over 500,000 samples, up 27% from the year before. The counting was getting <em>better</em>, right up until the money ran out.
        </P>

        <H2>What nine million dollars buys</H2>

        <P>
          The network &mdash; the people who run it call it &ldquo;Gremlin&rdquo; &mdash; costs about <a href="https://www.statnews.com/2025/06/09/trump-global-aid-cuts-who-foundation-tries-public-fundraising-to-save-measles-lab-network/">$9 million a year</a>. That&rsquo;s pocket lint by global-health standards. It was funded almost entirely by the CDC, and that transfer stopped. The WHO Foundation is now <a href="https://www.statnews.com/2025/06/09/trump-global-aid-cuts-who-foundation-tries-public-fundraising-to-save-measles-lab-network/">passing the hat</a> for $3.6 million just to keep the lights on into next year.
        </P>

        <P>
          The failure mode here isn&rsquo;t &ldquo;we won&rsquo;t know the number.&rdquo; It&rsquo;s worse and more specific. Measles is a fever-and-rash illness, and so are a dozen other things. Without a lab to confirm it, WHO&rsquo;s own immunization director <a href="https://www.statnews.com/2025/06/09/trump-global-aid-cuts-who-foundation-tries-public-fundraising-to-save-measles-lab-network/">put it</a> plainly: a country can end up &ldquo;deploying measles vaccine resources and outbreak response resources to the wrong thing at the wrong time in the wrong place.&rdquo; You don&rsquo;t just lose the count. You start acting on the wrong one.
        </P>

        <figure style={{ margin:'2.5em auto', maxWidth:900, textAlign:'center' }}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22First+dose%22%2C%22Second+dose%22%2C%22Needed+to+stop+spread%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22MMR+coverage%2C+2024%22%2C%22data%22%3A%5B84%2C76%2C95%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Global+measles+vaccine+coverage+vs.+the+95%25+threshold%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A100%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+children%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of global measles vaccine coverage in 2024. First dose 84 percent, second dose 76 percent, both below the 95 percent needed to stop transmission." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
          <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>
            Source: WHO/UNICEF estimates, reported by WHO, November 28, 2025. First-dose 84%, second-dose 76%; 95% two-dose coverage is the level WHO says is needed to stop transmission.
          </figcaption>
        </figure>

        <Callout label="The timing, side by side">
          Confirmed cases in the Americas up 43-fold in three weeks. Global coverage stuck at 84% first dose and 76% second, both well under the 95% needed to stop spread. And the network that turns &ldquo;suspected&rdquo; into &ldquo;confirmed&rdquo; funded at fifteen cents on the dollar.
        </Callout>

        <H2>This is not somebody else&rsquo;s outbreak</H2>

        <P>
          It&rsquo;s tempting to file this under far-away. Don&rsquo;t. The U.S. recorded <a href="https://www.cdc.gov/measles/data-research/index.html">2,144 confirmed cases in 2025</a>, its worst year in more than three decades, and the Americas as a region <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">lost the measles-elimination status</a> it had clawed back only a year earlier. When the surveillance network goes dark abroad, the early warning we lean on at home goes with it. An outbreak in one country is a plane ride from being an outbreak in yours.
        </P>

        <Divider />

        <P>
          We spent 25 years and <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">59 million saved lives</a> building the ability to see this virus coming. The seeing part costs nine million dollars a year. We&rsquo;re about to find out what it&rsquo;s like to fight the world&rsquo;s most contagious disease with the lights off.
        </P>

        <P><em>— TJ</em></P>

        <H2>Sources</H2>

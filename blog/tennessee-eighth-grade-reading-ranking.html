const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In January 2025, the Nation&#8217;s Report Card released its 8th-grade reading results.
          Tennessee jumped from 35th to 20th among states &#8212; one of the sharpest single-cycle ranking gains
          in the country. The state&#8217;s press release called it a &#8220;meaningful academic gain.&#8221;
          Advocacy groups cited it as proof that Tennessee&#8217;s 2021 reading mandate was working.
          Fifteen spots in the rankings sounds like something.
        </P>

        <P>
          The <a href="https://nces.ed.gov/nationsreportcard/subject/publications/stt2024/pdf/2024220TN8.pdf">average
          scale score went from 258 to 259</a>. One point. Not statistically significant, per NCES.
          Tennessee&#8217;s 8th-grade reading score in 2024 is the same as it was in 1998.
        </P>

        <P>
          Here&#8217;s what actually happened: while Tennessee held roughly flat, most other states
          declined. The <a href="https://www.nagb.gov/news-and-events/news-releases/2025/nations-report-card-decline-in-reading-progress-in-math.html">national
          average 8th-grade reading score fell by two points</a> between 2022 and 2024. Tennessee
          went from one point below the national average (258 vs. 259 nationally) to two points
          above it (259 vs. 257 nationally). That&#8217;s not a gain &#8212; it&#8217;s a fixed position in a falling field.
        </P>

        <P>
          Rankings are a relative measure. And right now, the whole field is falling.
        </P>

        <H2>The number that should be in every headline</H2>

        <P>
          Before getting to the state divergence, the national number deserves its own sentence.
          One in three 8th graders &#8212; <a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/10-takeaways-from-2024-naep-results.html">a
          third, the greatest share ever recorded</a> &#8212; scored below NAEP Basic in reading in 2024.
          Not below Proficient. Below Basic, which NAEP defines as partial mastery of grade-level skills.
          The kids who hit that floor were in kindergarten or first grade when COVID closed schools in spring 2020.
          They&#8217;re now in 9th grade. The literacy gap went to high school with them.
        </P>

        <Callout label="Key figure">
          <strong>33%</strong> of 8th graders scored below NAEP Basic in reading in 2024 &#8212; the greatest
          share ever recorded in the assessment&#8217;s history, per{' '}
          <a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/10-takeaways-from-2024-naep-results.html">NAGB&#8217;s
          10 Takeaways</a>. NAEP Basic represents partial mastery of grade-level skills &#8212; not proficiency,
          just the floor.
        </Callout>

        <H2>The Mississippi problem</H2>

        <P>
          The other state in every Science of Reading success story is Mississippi. And the 2024 8th-grade data
          is where that story gets complicated.
        </P>

        <P>
          Mississippi&#8217;s 4th-grade gains are genuine. <a href="https://www.mississippifirst.org/contextualizing-mississippis-2024-naep-scores/">Adjusting
          for student demographics, Mississippi 4th graders ranked first in the nation in reading and math in 2024</a>,
          per Urban Institute analysis cited by Mississippi First. That&#8217;s the outcome of a decade-long
          commitment to evidence-based early literacy instruction that started with the 2013 Literacy-Based Promotion Act.
        </P>

        <P>
          Mississippi&#8217;s 8th graders <a href="https://nces.ed.gov/nationsreportcard/subject/publications/stt2024/pdf/2024220MS8.pdf">scored
          253 in 2024 &#8212; the same as in 2022, and not meaningfully different from 1998</a>. The reading gains
          did not persist to middle school. Mississippi ranks near the bottom nationally at 8th grade.
        </P>

        <P>
          Why? There are at least three candidate explanations. The state&#8217;s 3rd-grade retention policy holds back
          students who don&#8217;t pass a reading test &#8212; which means the weakest readers get filtered out before
          they show up in the 4th-grade NAEP sample, and the gain at 4th grade is at least partially a
          measurement artifact. Mississippi&#8217;s 2024 8th graders were also born around 2010 and were already
          past early elementary when the SoR reforms reached full implementation &#8212; so this cohort
          may simply not have been fully exposed to the new curriculum. And there&#8217;s a third possibility: early
          reading gains just don&#8217;t persist without continued explicit literacy support in middle school,
          regardless of what happened in 2nd grade.
        </P>

        <P>
          All three could be true. The data can&#8217;t tell you which.
        </P>

        <H2>What the ranking system is measuring</H2>

        <P>
          This is the part worth sitting with. We have two states that are routinely cited as proof that
          science-of-reading mandates work. One shows a 15-spot ranking jump that is largely driven by other
          states declining faster. The other shows 4th-grade gains that stop at the classroom door to middle school.
          Both stories are real. Neither one is complete.
        </P>

        <P>
          NAEP is a cross-sectional snapshot &#8212; it tests a different sample of students each cycle, not the same
          cohort followed over time. When we see Tennessee&#8217;s ranking rise, we&#8217;re seeing it relative to
          states whose 8th graders declined more. When we see Mississippi&#8217;s 4th-grade miracle and 8th-grade
          stagnation side by side, we&#8217;re seeing two different cohorts &#8212; kids who got the reformed curriculum
          vs. kids who were already past the window when reforms arrived.
        </P>

        <P>
          The 2026 NAEP administration just closed. Results will arrive sometime in 2027. That cycle will cover
          the cohort of 8th graders who were <em>actually</em> in kindergarten when schools closed in 2020 &#8212;
          the first group to have gone through early elementary entirely in the post-pandemic, post-mandate
          instructional environment. That&#8217;s the dataset that can start to answer whether SoR gains
          persist to middle school.
        </P>

        <P>
          Until then, the rankings will keep moving. The scores barely will.
        </P>

        <Divider />

        <P>
          <strong>Sources</strong>
        </P>

        <UL items={[
          <><a href="https://nces.ed.gov/nationsreportcard/subject/publications/stt2024/pdf/2024220TN8.pdf">NCES &#8212; 2024 Reading State Snapshot Report: Tennessee Grade 8 Public Schools</a></>,
          <><a href="https://nces.ed.gov/nationsreportcard/subject/publications/stt2024/pdf/2024220MS8.pdf">NCES &#8212; 2024 Reading State Snapshot Report: Mississippi Grade 8 Public Schools</a></>,
          <><a href="https://www.nagb.gov/news-and-events/news-releases/2025/nations-report-card-decline-in-reading-progress-in-math.html">NAGB &#8212; The Nation&#8217;s Report Card Shows Declines in Reading, Some Progress in 4th Grade Math (Jan. 2025)</a></>,
          <><a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/10-takeaways-from-2024-naep-results.html">NAGB &#8212; 10 Takeaways from the 2024 NAEP Results</a></>,
          <><a href="https://www.mississippifirst.org/contextualizing-mississippis-2024-naep-scores/">Mississippi First &#8212; Contextualizing Mississippi&#8217;s 2024 NAEP Scores</a></>,
          <><a href="https://www.tn.gov/education/news/2025/1/29/nation-s-report-card-shows-meaningful-academic-gains-as-a-result-of-tennessee-s-commitment-to-public-schools-.html">Tennessee DOE &#8212; Nation&#8217;s Report Card Shows Meaningful Academic Gains (Jan. 2025)</a></>,
        ]} />

        <P>
          <em>&#8212; TJ</em>
        </P>

      </article>
    </Prose>

);

        <div style={{ padding:'64px 0 40px', maxWidth:560 }}>
          <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, color:'var(--muted)' }}>§ Subscribe</span>
          <h3 style={{ fontFamily:'var(--display)', fontWeight:900, letterSpacing:'-0.01em', fontSize:'clamp(32px, 4vw, 56px)', lineHeight:0.95, margin:'8px 0 16px' }}>
            The dispatch,<br/>every Saturday morning.
          </h3>
          <p style={{ fontSize:17, lineHeight:1.55, maxWidth:'42ch', margin:'0 0 24px', textWrap:'pretty' }}>
            One email a week. A short essay, a chart, and links to anything we read
            that changed the way we read public data. No tracking pixels.
          </p>
          <form onSubmit={(e)=>{ e.preventDefault(); setSent(true); }}
            style={{ display:'flex', gap:0, maxWidth:460, border:'1.5px solid var(--ink)' }}>
            <input value={email} onChange={e=>setEmail(e.target.value)}
              type="email" placeholder="you@yourdomain.org" required
              style={{ flex:1, border:0, background:'transparent', padding:'14px 16px', fontFamily:'var(--body)', fontSize:16, color:'var(--ink)', outline:'none' }}/>
            <button type="submit"
              style={{ border:0, borderLeft:'1.5px solid var(--ink)', padding:'0 20px', background:'var(--ink)', color:'var(--paper)', fontFamily:'var(--mono)', fontSize:12, letterSpacing:'0.12em', textTransform:'uppercase', cursor:'pointer', fontWeight:600 }}>
              {sent ? 'Sent ✓' : 'Subscribe →'}
            </button>
          </form>
          {sent && <p style={{ marginTop:10, fontFamily:'var(--mono)', fontSize:12, color:'var(--muted)' }}>Check your inbox &#8212; the confirmation note is on its way.</p>}
        </div>

        <Rule />

        <div style={{ padding:'24px 0 40px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }}>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Colophon</div>
            <div>Hosted on GitHub Pages. No trackers, no cookies, no stock photography. Built by hand at Standard Co.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>
            <div>All text, charts, and datasets are published under CC BY 4.0. Copy us, cite us, improve us. Corrections, at the bottom of every piece.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Contact</div>
            <div>info@standardco.de<br/>Standard Co, est. 2013<br/>A reader-supported project.</div>
          </div>
        </div>

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
          <span>&#169; 2013&#8211;2026 Standard Co &#183; All rights unreserved</span>
          <span>Made with help from Claude</span>
        </div>
      </Container>
    </footer>
  );
};

function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

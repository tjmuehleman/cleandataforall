  readTime: '4 min',
  title:   'An mpox database update found a virus we already had',
  dek:     'The recombinant mpox strain reported by the UK in December 2025 was already sitting in India\u2019s September case files. A Nextclade schema update on December 16 made it visible \u2014 the data-system story behind a four-country outbreak.',

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900 }}>
      <img
        src="https://quickchart.io/chart/render/zf-3323b995-aa5b-414b-a2ea-d3d71f75f52a"

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In September 2025, a man in India developed mpox symptoms on the way back from an extended work stay in the Arabian Peninsula. Real-time PCR confirmed it on September 11. A few days later, a clade-differentiation PCR ran the standard query against the standard schema and said: <em>clade IIb</em>. He was hospitalized, recovered without complications, tested negative on the 29th. End of case file.
        </P>

        <P>
          Three months later, on December 16, 2025, the global <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON595">Nextclade reference database</a> &mdash; the open-source phylogenetic schema that public health labs everywhere use to classify orthopox samples &mdash; pushed an update. The update added a new reference sequence: a clade Ib/IIb recombinant just reported by the United Kingdom, in a traveler returning from somewhere in Asia.
        </P>

        <P>
          India re-ran the September genome against the new schema. It wasn&rsquo;t clade IIb. Whole-genome analysis showed <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON595">&gt;99.9% similarity</a> to the UK case. A virus we&rsquo;d been carrying around in case files for three months turned out to be a different virus.
        </P>

        <P>
          That is not a story about a virus. That&rsquo;s a story about a database.
        </P>

        <H2>What the schema update actually did</H2>

        <P>
          Mpox surveillance, until very recently, ran on two clades, each with a couple of subclades. Clade I (Ia, Ib). Clade II (IIa, IIb). PCR tests are designed around those known references &mdash; they ask the sample, &ldquo;are you clade I or clade II?&rdquo; When the answer was &ldquo;clade IIb,&rdquo; that was the answer. The PCR could not have told you &ldquo;you&rsquo;re a chimera of both,&rdquo; because there wasn&rsquo;t a chimera category yet.
        </P>

        <P>
          Once the UK detected the recombinant in December and submitted the genome to public databases, <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON595">Nextclade added it as a reference on December 16</a>. Anyone with a previously sequenced sample could now query it against the new tree. India did. They got a different answer than they had in September.
        </P>

        <P>
          The earliest known case of the recombinant strain happened two months <em>before</em> we knew the strain existed.
        </P>

        <Callout label="Key figure">
          <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--63---24-february-2026">WHO Sitrep #63</a> (Feb 24, 2026): two confirmed cases of the clade Ib/IIb recombinant, &ldquo;implicating four countries in three WHO regions over a period of at least two months.&rdquo; Both detected via whole-genome sequencing. Neither caught by clade-differentiation PCR alone.
        </Callout>

        <H2>The retroactive correction nobody else got</H2>

        <P>
          The Nextclade update only worked if the lab kept the genome. PCR-only labs &mdash; which is most of them &mdash; got nothing back. There&rsquo;s no &ldquo;send a notification when an old sample reclassifies&rdquo; feature in WHO surveillance. There can&rsquo;t be. The genome has to exist somewhere reachable, in a format the new schema can run against, with a chain of custody to the original case. India had that. Most of the 98 reporting countries on the <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--63---24-february-2026">January 2026 sitrep</a> don&rsquo;t.
        </P>

        <P>
          Globally, <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--63---24-february-2026">54,817 confirmed mpox cases were reported between January 2025 and January 2026</a>. WHO recommends sequencing 10% of confirmed-case specimens in community-transmission settings. Most countries don&rsquo;t hit that. The rest run the clade-differentiation PCR, file the answer, move on.
        </P>

        <H2>The non-uniform January</H2>

        <P>
          The other thing the same sitrep makes legible is whose curve is doing what. In January 2026, four WHO regions reported declines compared to December &mdash; the Americas down 54%, Western Pacific down 46%, South-East Asia down 12%, Eastern Mediterranean down 75% off a tiny base. One region went the other way: the European Region <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--63---24-february-2026">jumped 67%, from 129 to 216 confirmed cases</a>, with community transmission of clade Ib now established in France, Portugal, and Spain.
        </P>

        <Fig caption={<>Source: <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--63---24-february-2026">WHO Mpox Sitrep no. 63</a> (Feb 24, 2026), p. 4. Africa not shown &mdash; the sitrep gives an overall declining trend for the African Region but doesn&rsquo;t state a December 2025 confirmed-case total in this comparison.</>}>
          <img
            src="https://quickchart.io/chart/render/zf-a72c70aa-5f28-4f0e-b452-e22e652682f7"
            alt="Confirmed mpox cases by WHO region, December 2025 vs January 2026: Europe 129 to 216, Americas 376 to 172, Western Pacific 90 to 49, South-East Asia 17 to 15, Eastern Mediterranean 4 to 1."
            style={{ width:'100%', display:'block', border:'1px solid var(--rule)' }}
          />
        </Fig>

        <P>
          Africa is mostly down &mdash; DRC, Guinea, Liberia all declining since the May 2025 peak (367, 104, and 96 confirmed cases respectively in the past six weeks, and Madagascar at 313 with its own clade Ib outbreak that&rsquo;s spilling into <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON595">Comoros and La R&eacute;union for the first time</a>). The continent CFR sits at <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--63---24-february-2026">0.4% across the past six weeks</a>. None of that is what most public memory of mpox looks like.
        </P>

        <Divider />

        <P>
          Two takeaways for anyone building surveillance &mdash; both unflattering for anyone who treats &ldquo;the data&rdquo; like a finished file.
        </P>

        <P>
          One: case definitions are not stable. Whether something counts as clade IIb today depends on which version of Nextclade your lab pulled last Friday. If you froze your classification at the time of diagnosis and never went back, you don&rsquo;t have what you think you have.
        </P>

        <P>
          Two: most countries can&rsquo;t go back even if they wanted to. The genome has to exist, the linkage has to exist, somebody has to actually re-run it. The recombinant has now turned up in four countries across three WHO regions. Probably more. Those are just the ones who kept the FASTA file.
        </P>

        <P style={{ marginTop:'2em', fontStyle:'italic' }}>
          &mdash; TJ
        </P>

        <H2>Sources</H2>

        <UL items={[
          <><a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--63---24-february-2026">WHO &mdash; Multi-country outbreak of mpox, External situation report no. 63 (24 Feb 2026)</a> &mdash; global confirmed-case totals, regional Dec/Jan deltas, top African countries past six weeks.</>,
          <><a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON595">WHO Disease Outbreak News &mdash; Mpox: recombinant virus with genomic elements of clades Ib and IIb (14 Feb 2026)</a> &mdash; UK and India case histories, Nextclade December 16 update, retroactive reclassification.</>,
          <><a href="https://cdn.who.int/media/docs/default-source/_sage-2026/multi-country-outbreak-of-mpox--external-situation-report_64.pdf?sfvrsn=10400a6e_4&download=true">WHO Mpox Sitrep #64 (26 March 2026)</a> &mdash; subsequent confirmation of trends.</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

          </h3>

              style={{ border:0, borderLeft:'1.5px solid var(--ink)', padding:'0 20px', background:'var(--ink)', color:'var(--paper)', fontFamily:'var(--mono)', fontSize:12, letterSpacing:'0.12em', textTransform:'uppercase', cursor:'pointer', fontWeight:600 }}>

        <div style={{ padding:'24px 0 40px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }}>

          </div>
        </div>

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>

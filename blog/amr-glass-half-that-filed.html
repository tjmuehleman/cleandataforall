// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          When the WHO dropped the{' '}
          <a href="https://www.who.int/publications/i/item/9789240116337">2025 GLASS report</a>{' '}
          in October, the headline traveled fast:{' '}
          <a href="https://www.who.int/news/item/13-10-2025-who-warns-of-widespread-resistance-to-common-antibiotics-worldwide">one in six confirmed bacterial infections worldwide in 2023 was resistant</a>{' '}
          to the antibiotic prescribed for it.{' '}
          <a href="https://www.amr-insights.eu/global-antibiotic-resistance-surveillance-report-2025/">Twenty-three million laboratory-confirmed infections</a>.{' '}
          <a href="https://www.amr-insights.eu/global-antibiotic-resistance-surveillance-report-2025/">104 countries reporting</a>. The biggest single AMR dataset ever published.
        </P>

        <P>
          That&rsquo;s the number. Now the footnote.
        </P>

        <P>
          <a href="https://www.amr-insights.eu/global-antibiotic-resistance-surveillance-report-2025/">48% of WHO member states didn&rsquo;t report data to GLASS in 2023</a>. Of the half that did,{' '}
          <a href="https://www.lshtm.ac.uk/research/centres/amr/news/473666/whos-2025-glass-report-progress-patterns-and-persistent-gaps">about half still lack the surveillance systems to generate reliable data</a>. The &ldquo;1 in 6&rdquo; was computed from the part of the world that has the capacity to count, and was willing to send the count to Geneva.
        </P>

        <H2>The regional reporting column</H2>

        <P>
          The thing I keep returning to in the GLASS report isn&rsquo;t the headline. It&rsquo;s the regional reporting column.
        </P>

        <P>
          In the WHO South-East Asia region,{' '}
          <a href="https://www.amr-insights.eu/global-antibiotic-resistance-surveillance-report-2025/">90.9% of member states reported</a>. In the Eastern Mediterranean, 76.2%. In the Americas, 20%. Six regions, four-and-a-half-fold spread, and the region with the lowest reporting rate (the Americas) sits next to one of the most-resourced national surveillance systems in the world. The visibility gap isn&rsquo;t where most readers would assume it is.
        </P>

        <H2>The trend column</H2>

        <P>
          Between 2018 and 2023,{' '}
          <a href="https://www.who.int/news/item/13-10-2025-who-warns-of-widespread-resistance-to-common-antibiotics-worldwide">resistance rose in over 40% of the pathogen-antibiotic combinations</a>{' '}
          GLASS tracks. The average annual climb is{' '}
          <a href="https://www.who.int/news/item/13-10-2025-who-warns-of-widespread-resistance-to-common-antibiotics-worldwide">5&ndash;15%</a>.{' '}
          <a href="https://www.who.int/news/item/13-10-2025-who-warns-of-widespread-resistance-to-common-antibiotics-worldwide">For E. coli alone, more than 40% of isolates worldwide are now resistant to third-generation cephalosporins; in the African Region, over 70%</a>.{' '}
          <a href="https://www.who.int/news/item/13-10-2025-who-warns-of-widespread-resistance-to-common-antibiotics-worldwide">For UTIs, the rate is 1 in 3, not 1 in 6</a>{' '}
          &mdash; the most common infection most adults ever get is resistant to the cheap front-line drug a third of the time.
        </P>

        <P>
          GLASS country participation has{' '}
          <a href="https://www.amr-insights.eu/global-antibiotic-resistance-surveillance-report-2025/">grown four-fold, from 25 countries in 2016 to 104 in 2023</a>. By end-2024 the cumulative total will be 127. That growth is the genuine success story buried in the headline.
        </P>

        <P>
          But &ldquo;more countries reporting&rdquo; and &ldquo;we know how bad it is&rdquo; are not the same statement. The longer the surveillance lag in a country, the wider the gap between the measured number and the actual number is allowed to grow. The map of where we&rsquo;ve added cameras since 2016 is mostly the map of where the pictures already looked OK.
        </P>

        <H2>The plan, the targets, the money</H2>

        <P>
          Last Monday &mdash; May 25, 2026 &mdash; the{' '}
          <a href="https://www.who.int/news/item/25-05-2026-the-world-health-assembly-adopts-updated-global-action-plan-on-antimicrobial-resistance-(2026-2036)">World Health Assembly adopted the updated Global Action Plan on AMR for 2026&ndash;2036</a>, after{' '}
          <a href="https://healthpolicy-watch.news/wha-member-states-approve-who-antimicrobial-resistance-strategy-after-resolving-tech-transfer-debate/">a months-long fight</a>{' '}
          over technology-transfer language. That&rsquo;s the political layer. The data layer is one{' '}
          <a href="https://www.nature.com/articles/s41591-026-04257-1">Nature Medicine paper</a> below.
        </P>

        <P>
          A Nature Medicine team scored AMR governance across 193 countries.{' '}
          <a href="https://www.nature.com/articles/s41591-026-04257-1">178 of them have a national action plan on paper. 68% of those are implementing it. 11% &mdash; 19 of 178 &mdash; have actually funded it</a>.
        </P>

        <Fig caption={<>Source: <a href="https://www.nature.com/articles/s41591-026-04257-1">Evaluation of AMR governance across 193 countries, Nature Medicine (March 2026)</a>. Counts: 178 with a NAP; 68% implementing = 121; 11% funded = 19.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Have+a+NAP+on+paper%22%2C%22Implementing+the+NAP%22%2C%22Funded+the+NAP%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Countries%22%2C%22data%22%3A%5B178%2C121%2C19%5D%2C%22backgroundColor%22%3A%5B%22%23bbbbbb%22%2C%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22National+Action+Plans+on+AMR+%E2%80%94+of+178+countries+with+a+plan%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A200%2C%22stepSize%22%3A50%2C%22fontSize%22%3A11%2C%22beginAtZero%22%3Atrue%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Countries%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of national action plans on AMR. Have a NAP on paper: 178. Implementing the NAP: 121. Funded the NAP: 19."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          178 plans. 121 in motion. 19 with money behind them.
        </P>

        <H2>The data-guy read</H2>

        <Callout label="The data-guy read">
          The new GLASS report is the cleanest AMR baseline the world has ever had. It&rsquo;s also a survey-weighted estimate of the surveyed. The countries that didn&rsquo;t file are probably where the picture is worst. The countries that did file, mostly, haven&rsquo;t paid for the response.
        </Callout>

        <P>
          The line on the trend chart is moving{' '}

          <a href="https://www.amr-insights.eu/global-antibiotic-resistance-surveillance-report-2025/">half the membership</a>. None of that helps if the half of the world that&rsquo;s missing from the dataset is the half doing worst on the thing the dataset is supposed to measure.

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In FY2016, Head Start’s cumulative enrollment was <a href="https://aspe.hhs.gov/sites/default/files/documents/d09f085b67317c6447f63c7a6321096d/OHS%20Comprehensive%20Services_Final.pdf" target="_blank" rel="noopener">1,067,965</a> children and pregnant women. In FY2025 it was 771,121. Subtract and you get 296,844 people, a 28% drop, in a federal program nobody repealed, block-granted, or voted to shrink.
        </P>

        <P>
          So where did they go? I wish I had one clean answer. What I have is a trail, and the trail is paperwork. When a grantee wants to serve fewer kids, it files a Change in Scope request. Requests to reduce enrollment: <a href="https://headstart.gov/policy/im/acf-ohs-im-26-01" target="_blank" rel="noopener">39 in FY2021, 746 in FY2024</a>. HHS’s analysts say those requests <a href="https://www.aspe.hhs.gov/reports/head-start-change-scope" target="_blank" rel="noopener">eliminated 97,625 funded slots</a> between FY2022 and FY2024. And in FY2023 and FY2024, 94% of the slots lost came through enrollment reductions, with only 6% from conversions (28,820 + 54,799 = 83,619 of 89,218, per the same <a href="https://www.aspe.hhs.gov/reports/head-start-change-scope" target="_blank" rel="noopener">ASPE data point</a>; the division is mine).
        </P>

        <Fig caption={<>Enrollment-reduction requests filed with the Administration for Children and Families. Source: <a href="https://headstart.gov/policy/im/acf-ohs-im-26-01" target="_blank" rel="noopener">ACF-OHS-IM-26-01</a>, issued August 6, 2026. The 39 and 746 are the only two years the memo reports.</>}>
          <img src={CHART_REQUESTS} alt="Requests to reduce Head Start enrollment: 39 in FY2021, 746 in FY2024" style={{ width:'100%', maxWidth:900, height:'auto', display:'block', margin:'0 auto' }} />
        </Fig>

        <P>
          Now the part that makes me squint. Three numbers are floating around and they are not the same kind of number. 771,121 is cumulative enrollment. 97,625 is funded slots, and HHS says Head Start was <a href="https://www.aspe.hhs.gov/reports/head-start-change-scope" target="_blank" rel="noopener">funded to serve 715,873</a> in FY2024, a different measure in a different year. I won’t subtract one from another and neither should you. The 97,625 covers three years. The 296,844 covers nine. I couldn’t find a source that reconciles them, which means I can’t tell you how much of the 28% went out through a request form.
        </P>

        <P>
          The same brief has a second finding that’s easy to skip. The number of enrolled families getting at least one family service fell by <a href="https://aspe.hhs.gov/sites/default/files/documents/d09f085b67317c6447f63c7a6321096d/OHS%20Comprehensive%20Services_Final.pdf" target="_blank" rel="noopener">89,228, or 13.2%</a>, and 67% of the service categories it examined shrank in volume. A 2016 rule cut slots on the theory that fewer would mean better. The brief says the service data doesn’t show that goal was achieved. Fair enough. But notice who’s counting. This is HHS analyzing HHS files, and I haven’t found anyone outside the agency who has rebuilt the numbers.
        </P>

        <Divider />

        <P>
          A cut this size should get a vote. Failing that, it should get a column: slots requested away, by grantee, by year. Right now it’s a stat in a memo.
        </P>

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://aspe.hhs.gov/sites/default/files/documents/d09f085b67317c6447f63c7a6321096d/OHS%20Comprehensive%20Services_Final.pdf" target="_blank" rel="noopener">ASPE issue brief</a>, From FY16 to FY25, Fewer Head Start Families Received Comprehensive Services (August 2026); also on <a href="https://acf.gov/ohs/policy-guidance/fy16-fy25-fewer-head-start-families-received-comprehensive-services-and" target="_blank" rel="noopener">acf.gov</a></>,
          <><a href="https://www.aspe.hhs.gov/reports/head-start-change-scope" target="_blank" rel="noopener">ASPE data point</a>, Increases in Head Start Change in Scope Requests from FY21 to FY24</>,
          <><a href="https://headstart.gov/policy/im/acf-ohs-im-26-01" target="_blank" rel="noopener">ACF-OHS-IM-26-01</a>, Enrollment Reductions (August 6, 2026)</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

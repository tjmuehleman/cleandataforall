// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The number I walked in with was 15%. One in seven schools that could feed every kid for free, I&rsquo;d been told, says no. In Arizona, 48%. Great hook. I went and found the source anyway.
        </P>

        <P>
          FRAC&rsquo;s 2026 report counts <a href="https://frac.org/wp-content/uploads/CEP-Report-2026.pdf">73,939 eligible schools and 55,362 using the Community Eligibility Provision</a> (CEP), or 74.9% (Table 2, p. 13). Subtract and 18,577 don&rsquo;t. That&rsquo;s one in four, not one in seven. The subtraction is mine; the report doesn&rsquo;t print it. In Arizona it&rsquo;s <a href="https://frac.org/wp-content/uploads/CEP-Report-2026.pdf">1,065 of 1,519</a>, so 454 holdouts, 29.9%. Neither 15% nor 48% is in there. The real story is better anyway.
        </P>

        <P>
          Quick plumbing. A school needs an identified student percentage (ISP, the share of kids who qualify for free meals automatically, no application) of at least 25% to be eligible. Federal reimbursement is <a href="https://frac.org/wp-content/uploads/CEP-Report-2026.pdf">the ISP times 1.6</a> (p. 4), which is the share of meals paid at the free rate. At a 50% ISP, that&rsquo;s 80% of meals. At 25%, it&rsquo;s 40%. At 62.5%, it&rsquo;s all of them (62.5 &times; 1.6 = 100). Every kid eats free either way. Who pays for the gap is the part nobody puts on the poster.
        </P>

        <P>
          Now sort the eligible schools by ISP, which is the chart at the top. At 60% and up, <a href="https://frac.org/wp-content/uploads/CEP-Report-2026.pdf">99.6% of eligible schools use CEP</a>. At 50&ndash;59%, 90.1%. At 40&ndash;49%, 74.1%. At 25&ndash;39%, 35.5% (Table 3, p. 14). A curve that clean doesn&rsquo;t come from principals having feelings about free food. It comes from a formula.
        </P>

        <Fig caption={<>Eligible schools <em>not</em> using CEP, by ISP band, school year 2025&ndash;26. Derived: eligible minus adopting, from FRAC <a href="https://frac.org/wp-content/uploads/CEP-Report-2026.pdf">Table 3</a> (15,753 &minus; 5,600; 13,687 &minus; 10,137; 15,081 &minus; 13,583; 26,038 &minus; 25,942). Same exclusions as the chart above.</>}>
          <img src={'https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%2225%5Cu201339%25%3A+10%2C153%22%2C%2240%5Cu201349%25%3A+3%2C550%22%2C%2250%5Cu201359%25%3A+1%2C498%22%2C%2260%25%2B%3A+96%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B10153%2C3550%2C1498%2C96%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23777%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.8%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontFamily%22%3A%22Georgia%22%2C%22fontSize%22%3A14%2C%22min%22%3A0%2C%22max%22%3A12000%2C%22stepSize%22%3A2000%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Eligible+schools+NOT+using+CEP%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontFamily%22%3A%22Georgia%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22School%27s+identified+student+percentage+%28ISP%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2'} alt="Bar chart: eligible schools not using community eligibility, by identified student percentage. 25 to 39 percent: 10,153. 40 to 49 percent: 3,550. 50 to 59 percent: 1,498. 60 percent and up: 96." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Flip it around and count the schools that said no. 10,153 in the bottom band. 3,550 in the next. 1,498. Then 96 at the top. Of the 15,297 holdouts in that table, about two in three sit in the 25&ndash;39% band, where the formula covers 40% to 62% of meals (25 &times; 1.6 and 39 &times; 1.6). They&rsquo;re still poor. They&rsquo;re just not poor enough for the arithmetic to close.
        </P>

        <P>
          Here&rsquo;s the part a data person should squint at. &ldquo;Eligible&rdquo; isn&rsquo;t something anyone measures on a single day. FRAC built it from state lists: <a href="https://frac.org/wp-content/uploads/CEP-Report-2026.pdf">25 states and DC sent both an eligible list and an adopting list</a>, schools on both were &ldquo;treated as participating,&rdquo; and the report notes a school can adopt without being on a state&rsquo;s list at all, because some lists are built from proxy data (Technical Notes, p. 10). The files were <a href="https://frac.org/research/resource-library/community-eligibility-cep-database">collected between November 2025 and January 2026</a>. Illinois sent no school-level ISP, so it&rsquo;s missing from the chart. That&rsquo;s a perfectly fine way to count. It&rsquo;s a terrible way to produce a round number like 15%.
        </P>

        <P>
          So the next time somebody hands you a national opt-out rate, ask who wrote the list of who could opt in.
        </P>

        <Divider />

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://frac.org/wp-content/uploads/CEP-Report-2026.pdf">FRAC, Community Eligibility: The Key to Hunger-Free Schools, School Year 2025&ndash;2026</a> (Tables 1&ndash;3, p. 4 reimbursement formula, Technical Notes pp. 10&ndash;11)</>,
          <><a href="https://frac.org/research/resource-library/community-eligibility-cep-database">FRAC, Community Eligibility (CEP) Database</a> (data collected November 2025 to January 2026; 55,362 participating schools)</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

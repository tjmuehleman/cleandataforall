const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Twenty-one thousand six hundred forty-seven schools were asked how many of
          their students had a 504 plan. What came back was a blank.
        </P>

        <P>
          That is out of 97,166 public schools in the 2021&ndash;22 Civil Rights Data
          Collection. The federal code for the blank is &ldquo;Skipped/Not Applicable,&rdquo;
          and it means those schools&rsquo; numbers never made it into the public-use file at
          all. Perry Zirkel and Gina Gullo, who have been tracking this series for fifteen
          years, had to run their whole analysis on the
          {' '}<a href="https://perryzirkel.com/wp-content/uploads/2025/08/zirkel-and-gullo-2021-22-district-and-school-rates-article-.pdf">remaining 77.7% of schools</a> &mdash; what they call
          &ldquo;a stark decline from near 100% availability in prior years.&rdquo;
        </P>

        <P>
          In the previous collection, the same missing-data problem hit
          {' '}<a href="https://perryzirkel.com/wp-content/uploads/2024/05/zirkel-and-gullo-school-504-rates-article.pdf">788 schools</a>. Not 788 hundred. 788.
        </P>

        <H2>A growth curve with a moving denominator</H2>

        <P>
          The number everybody quotes is 3.93% &mdash; roughly one in 25 American public
          school students carrying a 504 plan, up from
          {' '}<a href="https://perryzirkel.com/wp-content/uploads/2018/07/zirkel-and-huang-state-by-state-504-only-rates-article-061118.pdf">1.02% in 2009&ndash;10</a>, the first full school year under
          the widened ADA eligibility standards. Every single collection since has gone up:
          1.48, 1.81, 2.29, 2.71, 3.26, 3.93. Nearly quadrupled in a dozen years.
        </P>

        <P>
          I have no reason to think that direction is wrong. The trend is real and it is
          almost certainly the biggest quiet change in how American schools classify kids.
          But the 3.93% is an average over the schools that answered. We are describing four
          percent of the country&rsquo;s students using three quarters of the country&rsquo;s
          buildings. Nobody hid that. It is right there in the footnotes. It just does not
          survive the trip into a headline.
        </P>

        <H2>The most common error is the one you would guess</H2>

        <P>
          Here is the part that should worry anyone who has ever built a data pipeline.
          When Zirkel and Gullo hit districts with implausibly high rates, they did the thing
          almost nobody does with a federal file &mdash; they emailed the schools and asked.
        </P>

        <Fig caption={<>Six schools whose administrators corrected their 2021&ndash;22 CRDC submission after being contacted by the researchers. Each pair is the rate as filed and the rate the school confirmed. Source: Zirkel &amp; Gullo, &ldquo;School District and Individual School Rates of &sect; 504-Only Students: The Next Update,&rdquo; 436 Educ. L. Rep. 1 (2025), notes 16&ndash;17.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Watsonville+Prep+%28CA%29%22%2C%22Susquehanna+Cnty+CTC+%28PA%29%22%2C%22Round+Valley+Elem%2FMid+%28CA%29%22%2C%22Gilroy+Prep+%28CA%29%22%2C%22JVL+Wildcat+Academy+%28NY%29%22%2C%22Irvington+Middle+%28NY%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Rate+as+filed+in+CRDC%22%2C%22data%22%3A%5B62.01%2C35.84%2C29.3%2C27.04%2C26.98%2C21.48%5D%2C%22backgroundColor%22%3A%22%23bbbbbb%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Rate+after+the+school+corrected+it%22%2C%22data%22%3A%5B0.32%2C3.4%2C1.2%2C3.52%2C1.27%2C7.85%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Atrue%2C%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22boxWidth%22%3A14%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22What+the+file+said+vs.+what+the+school+said+%282021-22+CRDC%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22504-only+students%2C+percent+of+enrollment%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%2C%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=520&bkg=transparent&devicePixelRatio=2"
            alt="Grouped horizontal bar chart comparing six schools' 504-only rates as originally filed in the CRDC against the corrected rates confirmed by school administrators, showing drops such as 62.01 percent to 0.32 percent."
            style={{ display:'block', width:'100%', maxWidth:900, margin:'0 auto', height:'auto' }} />
        </Fig>

        <P>
          Watsonville Prep in California had filed 62.01%. The real number was 0.32%. A
          career and technology center in Pennsylvania filed 35.84%; it was 3.40%. A charter
          school in New York filed 26.98%; it was 1.27%. These are not rounding problems.
        </P>

        <P>
          And the most common cause, in the researchers&rsquo; own words, was
          {' '}<a href="https://perryzirkel.com/wp-content/uploads/2025/08/zirkel-and-gullo-2021-22-district-and-school-rates-article-.pdf">submitting the number of students with IEPs rather than 504 plans</a>.
        </P>

        <P>
          Two adjacent concepts. One survey form. Somebody grabbed the wrong column.
        </P>

        <Callout label="The other end of the range">
          In 2020&ndash;21, <a href="https://perryzirkel.com/wp-content/uploads/2024/05/zirkel-and-gullo-school-504-rates-article.pdf">8,492 schools</a> with more than 250 students
          reported exactly zero 504-only students. Some of those are real. A lot of them are
          a field left at zero because zero passes validation.
        </Callout>

        <H2>Why this field and not the other one</H2>

        <P>
          This is where I stop being a person who reads education research and go back to
          being a guy who runs a data company.
        </P>

        <P>
          IDEA counts &mdash; kids with IEPs &mdash; ride a federal funding stream. Somebody
          downstream reconciles those numbers, because money moves when they change. Section
          504 has no federal dollars attached to it at all, and as of the most recent scan of
          state law, <a href="https://perryzirkel.com/wp-content/uploads/2025/08/zirkel-and-gullo-2021-22-district-and-school-rates-article-.pdf">no state has appropriated funding for 504-only students</a>
          {' '}either. Same civil rights statute, same legal obligations, same evaluations and
          hearings and services. Zero dollars keyed to the headcount.
        </P>

        <P>
          A number nobody pays against is a number nobody audits.
        </P>

        <P>
          That is not a conspiracy, it is just how data systems behave when you leave them
          alone. Fields that gate a payment get three rounds of validation and an angry email
          when they are wrong. Fields that gate nothing get whatever the person had time for in
          April. The 504 column has been the second kind for fifteen years, which is exactly as
          long as the thing it measures has been quadrupling.
        </P>

        <Divider />

        <P>
          The 2023&ndash;24 collection <a href="https://www.npr.org/2026/09/04/nx-s1-5955681/civil-rights-data-schools-trump">went up earlier this month</a>, quietly,
          with no First Look report &mdash; we wrote about that release in No. 136. For 504
          students there is genuinely good news buried in it: the 504-only disaggregation is
          {' '}<a href="https://www.ed.gov/sites/ed/files/about/offices/list/ocr/docs/2023-24-crdc-data-elements.pdf">required this cycle rather than optional</a>, so for the first
          time you can follow these kids through discipline and course access instead of just
          counting them.
        </P>

        <P>
          Which will be a terrific analysis, right up until somebody checks how many schools
          left the box blank.
        </P>

        <H2>Sources</H2>

        <UL items={[
          <><a href="https://perryzirkel.com/wp-content/uploads/2025/08/zirkel-and-gullo-2021-22-district-and-school-rates-article-.pdf">Perry A. Zirkel &amp; Gina L. Gullo, &ldquo;School District and Individual School Rates of &sect; 504-Only Students: The Next Update,&rdquo; 436 Educ. L. Rep. 1 (August 14, 2025)</a> (PDF). Source for the national 3.93% rate for 2021&ndash;22; the 21,647 of 97,166 schools coded &ldquo;Skipped/Not Applicable&rdquo; and the resulting 77.7% coverage; the administrator corrections charted above; the finding that the most common submission problem was reporting IEP counts instead of 504 counts; and the statement that neither &sect; 504 nor the ADA provides federal funding and no state has appropriated funding for 504-only students.</>,
          <><a href="https://perryzirkel.com/wp-content/uploads/2024/05/zirkel-and-gullo-school-504-rates-article.pdf">Perry A. Zirkel &amp; Gina L. Gullo, &ldquo;Public School Rates of &sect; 504-Only Students: The Latest Update,&rdquo; 420 Educ. L. Rep. 1 (April 11, 2024)</a> (PDF). Source for the 2020&ndash;21 national rate of 3.26%, the 2017&ndash;18 rate of 2.71%, the 788 schools excluded from the 2020&ndash;21 file for unavailable enrollment or 504 entries, and the 8,492 schools over 250 students reporting zero 504-only students.</>,
          <><a href="https://perryzirkel.com/wp-content/uploads/2018/07/zirkel-and-huang-state-by-state-504-only-rates-article-061118.pdf">Perry A. Zirkel &amp; Tiedan Huang, &ldquo;State Rates of 504-Only Students in K&ndash;12 Public Schools: An Update,&rdquo; 354 Ed. Law Rep. 621 (2018)</a> (PDF). Source for the earlier points in the series &mdash; 1.02% in 2009&ndash;10, 1.48% in 2011&ndash;12, 1.81% in 2013&ndash;14, 2.29% in 2015&ndash;16 &mdash; and for the January 2009 effective date of the ADA Amendments.</>,
          <><a href="https://www.npr.org/2026/09/04/nx-s1-5955681/civil-rights-data-schools-trump">NPR, &ldquo;Federal civil rights data about students is finally out. It&rsquo;s different under Trump&rdquo;</a> (Jonaki Mehta, September 4, 2026). Source for the quiet early-September release of the 2023&ndash;24 collection and the absence of a First Look Report.</>,
          <><a href="https://www.ed.gov/sites/ed/files/about/offices/list/ocr/docs/2023-24-crdc-data-elements.pdf">U.S. Department of Education, 2023&ndash;24 CRDC data elements</a> (PDF), and the <a href="https://www.ed.gov/laws-and-policy/civil-rights-laws/civil-rights-data-collection-crdc/civil-rights-data/civil-rights-data-collection-crdc-2023-24-school-year">2023&ndash;24 CRDC data files</a>. Source for the 504-only disaggregation requirements in the current collection.</>,
          <><a href="https://civilrightsdata.ed.gov/data">Civil Rights Data Collection public-use data files</a> &mdash; the underlying source for every rate in this piece.</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

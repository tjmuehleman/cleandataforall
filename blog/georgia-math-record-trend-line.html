const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On August 6, Georgia&rsquo;s Department of Education published math scores for <a href="https://www.lumoslearning.com/llwp/test-result-analysis-2026/georgia-gmas-results-2026-analysis.html">748,440 students</a> in grades 3 through 8, and did not publish a single reading score. Not late. Not stuck in a queue. <a href="https://gpee.org/2025-2026-georgia-milestones-results-released/">Not calculated yet.</a>
        </P>

        <P>
          The math number is good, and I want to be clear about that up front. 45.3% proficient or above, up from 43.3% the year before. The state&rsquo;s own release calls out <a href="https://www.wabe.org/georgia-milestone-2025-2026-scores-see-all-time-high-in-math-steady-rise-in-science-and-social-studies/">all-time highs in fourth, fifth and sixth grade math and high school Algebra</a>, with 12 of 13 tested assessments up or flat.
        </P>

        <P>
          Here&rsquo;s the part I keep turning over. Those two facts came out of the same agency, in the same press release, on the same morning. And both of them are correct.
        </P>

        <H2>The reading number doesn&rsquo;t exist</H2>

        <P>
          2025-26 was the first administration of Georgia Milestones ELA aligned to the state&rsquo;s new K-12 English Language Arts standards. GaDOE&rsquo;s wording is that <a href="https://www.wabe.org/georgia-milestone-2025-2026-scores-see-all-time-high-in-math-steady-rise-in-science-and-social-studies/">&ldquo;additional test development activities must be completed before ELA scores can be calculated and reported.&rdquo;</a>
        </P>

        <P>
          That&rsquo;s standard setting. Panels of educators sit in a room and decide which scale score counts as proficient. Until they do, there is nothing to withhold &mdash; there&rsquo;s a pile of raw scores and no line drawn through it. Georgia didn&rsquo;t sit on reading. Georgia rebuilt reading, and rebuilding takes the trend line with it.
        </P>

        <H2>Math kept its trend line because somebody decided it should</H2>

        <P>
          This is the part that didn&rsquo;t make the coverage. Georgia did the exact same thing to math two years ago. New K-12 math standards landed in 2023-24, the Milestones math tests were <a href="https://georgiamilestonesresources.com/2023-2024-mathematics-assessments/">redeveloped to match</a>, and the state went through standard setting.
        </P>

        <P>
          And then it made a call. The educator panels validated the existing Developing and Proficient cut scores and recommended changing only the Distinguished cut. GaDOE&rsquo;s guidance afterward was explicit: scale scores and the percentage at or above Proficient stay <a href="https://resources.finalsite.net/images/v1727709749/fultonschoolsorg/pfb3a4b39ga2tpxqpsbq/ES2024MathMilestones.pdf">comparable to previous years</a>; don&rsquo;t compare Distinguished across the break.
        </P>

        <P>
          Which is why &ldquo;all-time high in the history of Georgia Milestones&rdquo; is a defensible sentence about math in 2026 and not a marketing one. Somebody deliberately preserved the scale through a standards change so that sentence would still be true two years later. Continuity is not a property of data. It&rsquo;s maintenance. Somebody does it on purpose, or nobody does.
        </P>

        <H2>The grade nobody put in the headline</H2>

        <P>
          Eighth grade went down. From 46.9% to 46.3% &mdash; the <a href="https://www.ajc.com/education/2026/08/georgia-8th-graders-math-scores-dip-whats-your-schools-score/">only grade that lost ground</a> while the other five gained. It is also the grade that decides who gets into Algebra I on time. For scale, <a href="https://www.wsbtv.com/news/local/atlanta/math-proficiency-down-georgia-eighth-grade-classes-latest-milestones-scores-show/UQ3IWVWD3ZCR3AP4BP45UDOCYE/">35% of Georgia eighth graders were proficient in 2019</a>, so a dip from 46.9 is a dip from a much higher shelf. Still a dip.
        </P>

        <Callout label="Key figure">
          124 of Georgia&rsquo;s 180 traditional school systems (69%) posted higher math proficiency in 2026 than in 2025. Thirty-six declined. District rates ran from roughly 1% to 78%. (<a href="https://www.lumoslearning.com/llwp/test-result-analysis-2026/georgia-gmas-results-2026-analysis.html">Lumos Learning analysis of GaDOE files</a>)
        </Callout>

        <H2>One line through 748,440 scores</H2>

        <P>
          Last thing about 45.3%. It&rsquo;s a single cut line drawn through a continuous distribution, and every band under it moved this year too. Beginning Learners fell from 22.6% to 20.9%. Distinguished climbed from 16.2% to 17.4%. Developing basically didn&rsquo;t budge. The headline picked one of those four movements, because a committee picked where the line goes.
        </P>

        <Fig caption={<>Statewide Georgia Milestones mathematics achievement-level distribution, grades 3&ndash;8, 2025 vs 2026. The four bands sum to 100%; proficient or above is Proficient plus Distinguished (27.8 + 17.4 = 45.2, reported as 45.3 before rounding of the components). Source: <a href="https://www.lumoslearning.com/llwp/test-result-analysis-2026/georgia-gmas-results-2026-analysis.html">Lumos Learning analysis of GaDOE GMAS files</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Beginning%22%2C%22Developing%22%2C%22Proficient%22%2C%22Distinguished%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222025%22%2C%22data%22%3A%5B22.6%2C34.0%2C27.1%2C16.2%5D%2C%22backgroundColor%22%3A%22%238a8378%22%2C%22barPercentage%22%3A0.8%2C%22categoryPercentage%22%3A0.65%7D%2C%7B%22label%22%3A%222026%22%2C%22data%22%3A%5B20.9%2C33.9%2C27.8%2C17.4%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.8%2C%22categoryPercentage%22%3A0.65%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Every+Georgia+math+score%2C+sorted+into+four+boxes%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A40%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+students+tested%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"

        <Divider />

        <P>
          Georgia will publish reading later this year. It&rsquo;ll be a real number, carefully set, and it will mean nothing next to 2025 &mdash; or 2024, or 2019 &mdash; for a while. Nobody did anything wrong here. The state protected one series through a standards change and started the other one from zero, both times deliberately, and the result is a department that can tell you precisely how math is going and cannot tell you one thing about reading.
        </P>

        <P>
          Trend lines are infrastructure. You maintain them or you don&rsquo;t.
        </P>

      </article>
    </Prose>
  </Container>
);

alse%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2'} alt="Line chart of national chronic absenteeism: 28.3 percent in 2022, 25.7 in 2023, 23.5 in 2024, 22.6 in 2025. If the 2025 pace holds it reaches 20.8 percent in 2027; the 50% Challenge needs 14.2 percent." style={{ width:'100%', height:'auto', display:'block' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Eighteen states have <a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/">formally adopted</a> the 50% Challenge: cut your 2022 chronic absenteeism rate in half by 2027. The national 2022 rate was <a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/">28.3%</a>. Half of that is 14.15%.
        </P>

        <P>
          Sit with that for a second. Before the pandemic the country was at <a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/">about 15%</a>. So the pledge isn&rsquo;t &ldquo;recover.&rdquo; It&rsquo;s &ldquo;beat 2019.&rdquo; In two years.
        </P>

        <H2>The pace line nobody draws</H2>

        <P>
          AEI&rsquo;s tracker has the national rate at <a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/">28.3, 25.7, 23.5, and 22.6</a> for 2022 through 2025. Subtract and you get declines of 2.6, 2.2, and 0.9 points. (AEI&rsquo;s own text says 2.7 in one section and 2.6 in another, and 2.1 where the table gives 2.2. Rounding. Doesn&rsquo;t change anything, but it&rsquo;s a nice reminder these are rounded numbers.)
        </P>

        <P>
          From 22.6% to 14.15% is 8.45 points. Over the two school years left, that&rsquo;s about 4.2 a year. The best year so far was 2.6. The last one was 0.9.
        </P>

        <Fig caption={<>Year-over-year declines are differences of the rounded AEI rates (28.3 &rarr; 25.7 &rarr; 23.5 &rarr; 22.6). &ldquo;Needed&rdquo; = (22.6 &minus; 14.15) &divide; 2 = 4.2, derived. Source: <a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/">AEI</a>.</>}>
          <img src={'https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222023%22%2C%222024%22%2C%222025%22%2C%22Needed+per+year%2C+2026-27%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B2.6%2C2.2%2C0.9%2C4.2%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A5%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Points+of+decline+per+year%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2'} alt="Bar chart of points of decline per year: 2.6 in 2023, 2.2 in 2024, 0.9 in 2025, and 4.2 needed per year in 2026 and 2027." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Keep the 2025 pace and 2027 lands at 20.8%. To actually reach 14.15% at 0.9 a year, you wait about nine and a half more years. Mid-2030s. Not a century, but nobody&rsquo;s cutting a ribbon.
        </P>

        <H2>Washington, with receipts</H2>

        <P>
          Washington&rsquo;s OSPI <a href="https://ospi.k12.wa.us/student-success/support-programs/attendance-chronic-absenteeism-truancy/washingtons-5-year-challenge-cut-chronic-absenteeism-half">publishes its own challenge page</a>: 27.3% in 2023&ndash;24, 27.1% in 2024&ndash;25, a goal of 14% by 2029. That&rsquo;s a 0.2-point drop last year. Getting from 27.1% to 14% in four years takes 3.3 points a year (13.1 &divide; 4, my math).
        </P>

        <P>
          I didn&rsquo;t run all eighteen states. The national line and Washington are the two I can source cleanly. But AEI says most of the 18 have <a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/">fewer than half their students in districts on pace</a>, which tells you where the rest are headed.
        </P>

        <P>
          The real problem is a data one. A pledge is a target with no checkpoints. Nobody publishes the required-pace line next to the actual line, so the gap never shows up on a dashboard. It takes one subtraction and one division.
        </P>

        <Divider />

        <P>
          A goal without a pace line is a mood.
        </P>

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/">AEI, From Attendance Crisis to Chronic Condition? Tracking Post-Pandemic Chronic Absenteeism into 2025</a></>,
          <><a href="https://ospi.k12.wa.us/student-success/support-programs/attendance-chronic-absenteeism-truancy/washingtons-5-year-challenge-cut-chronic-absenteeism-half">Washington OSPI, 5-Year Challenge: Cut Chronic Absenteeism in Half</a></>,
        ]} />

      </article>
    </Prose>

<!doctype html>
<html lang="en" data-theme="paper" data-pair="slab-serif">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="/favicon.ico" />
<title>The FBI&rsquo;s pipeline got fast. The polls trying to measure how it landed are a mess. &mdash; Clean Data for All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Archivo:wght@400;500;700;900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --ink:#141210;
    --paper:#F4EFE6;
    --rule: rgba(20,18,16,.18);
    --rule-soft: rgba(20,18,16,.10);
    --muted: rgba(20,18,16,.62);
    --display: 'Roboto Slab', serif;
    --body: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[data-theme="paper"]{ --ink:#141210; --paper:#F4EFE6; --rule:rgba(20,18,16,.18); --rule-soft:rgba(20,18,16,.10); --muted:rgba(20,18,16,.62); }
  html[data-theme="poster"]{ --ink:#EDE6D8; --paper:#171413; --rule:rgba(237,230,216,.22); --rule-soft:rgba(237,230,216,.10); --muted:rgba(237,230,216,.6); }
  html[data-theme="zine"]{ --ink:#0A0908; --paper:#EFEBDF; --rule:rgba(10,9,8,.35); --rule-soft:rgba(10,9,8,.18); --muted:rgba(10,9,8,.68); }

  html[data-pair="slab-serif"]{ --display:'Roboto Slab', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }
  html[data-pair="grotesk-serif"]{ --display:'Archivo', sans-serif; --body:'Fraunces', Georgia, serif; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="slab-mono"]{ --display:'Roboto Slab', serif; --body:'IBM Plex Mono', monospace; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="display-serif"]{ --display:'Instrument Serif', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }
  body{ font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","ss02","onum"; }
  a{ color: inherit; }
  ::selection{ background: var(--ink); color: var(--paper); }

  body::before{
    content:""; position: fixed; inset:0; pointer-events:none; z-index: 1;
    background-image:
      radial-gradient(rgba(20,18,16,.045) 1px, transparent 1px),
      radial-gradient(rgba(20,18,16,.03) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
    opacity: .7;
  }
  html[data-theme="poster"] body::before{
    background-image:
      radial-gradient(rgba(237,230,216,.04) 1px, transparent 1px),
      radial-gradient(rgba(237,230,216,.025) 1px, transparent 1px);
    mix-blend-mode: screen;
  }

  #root{ position: relative; z-index: 2; }

  /* Post body typography */
  .post-body p { margin: 0 0 1.5em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body h2 { font-family: var(--display); font-weight: 900; font-size: clamp(24px, 2.5vw, 34px); line-height: 1.05; margin: 2em 0 0.5em; letter-spacing: -0.01em; }
  .post-body h3 { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 2vw, 26px); line-height: 1.1; margin: 1.8em 0 0.4em; }
  .post-body ul, .post-body ol { margin: 0 0 1.5em; padding-left: 1.4em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body li { margin-bottom: 0.4em; }
  .post-body blockquote { margin: 2em 0; padding: 0 0 0 24px; border-left: 3px solid var(--ink); font-style: italic; font-size: 20px; line-height: 1.6; max-width: 60ch; color: var(--ink); }
  .post-body blockquote cite { display: block; margin-top: 0.75em; font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .post-body hr { border: 0; border-top: 1px solid var(--rule); margin: 3em 0; }
  .post-body a { border-bottom: 1px solid var(--rule); text-decoration: none; }
  .post-body a:hover { border-bottom-color: var(--ink); }
  .post-body figure { margin: 2.5em 0; }
  .post-body figcaption { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
  .post-body .callout { border: 1px solid var(--ink); padding: 24px 28px; margin: 2.5em 0; max-width: 68ch; }
  .post-body .callout-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .post-body code { font-family: var(--mono); font-size: 0.88em; background: var(--rule-soft); padding: 2px 5px; }
  .post-body pre { font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--rule-soft); padding: 20px 24px; overflow-x: auto; margin: 2em 0; }
</style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel" data-presets="react">

// ==================== TEMPLATE DATA ====================
const POST = {
  kind:    'Data Study',
  number:  '039',
  date:    'May 17, 2026',
  readTime: '4 min',
  title:   'The FBI’s pipeline got fast. The polls trying to measure how it landed are a mess.',
  dek:     'On May 13 the FBI released preliminary 2025 crime data four months faster than last year’s release. The crime supply side is the cleanest it has ever been. The two polls about how anyone feels about it cannot agree on a question.',
  byline:  'T.J. Müehleman',
};
// =============================================================================

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>&larr; All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
          <a href="../index.html#subscribe" style={{ textDecoration:'none' }}>Subscribe</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>&#8470; {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      <div style={{ maxWidth:900, paddingTop:32 }}>
        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>
          {POST.dek}
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>
        </div>
      </div>
    </div>
  </Container>
);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'24px 0' }}>
      <img
        src="https://quickchart.io/chart/render/zf-035bace9-60f3-4551-b44f-dd65e1732f37"
        alt="Horizontal bar chart of estimated year-over-year change in five FBI crime categories from 2024 to 2025: aggravated assault down 7.2 percent, total violent crime down 9.3 percent, property crime down 12.4 percent, murder and non-negligent manslaughter down 18.1 percent, robbery down 18.5 percent."
        style={{ width:'100%', display:'block' }}
      />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:14, textAlign:'center' }}>
        Source: <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">FBI, &ldquo;First Look: 2025 Crime Data&rdquo; press release (May 13, 2026)</a>. Estimated YoY change, 2024 &rarr; 2025. Preliminary, subject to revision before the finalized Crime in the Nation report later this year.
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          May 13, 2026. The FBI released its{' '}
          <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">First Look: 2025 Crime Data</a>.
          {' '}Violent crime down 9.3%. Murder and non-negligent manslaughter down 18.1%. Robbery down 18.5%. Aggravated assault down 7.2%. Property crime down 12.4%. Submitted by more than 17,000 law enforcement agencies covering 96% of the U.S. population. Preliminary numbers. The finalized report comes later this year.
        </P>

        <P>
          FBI Director Kash Patel called it{' '}
          <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">&ldquo;the single largest decrease in violent crime and murder since 1937.&rdquo;</a>
        </P>

        <P>
          Jeff Asher had this trajectory in hand months ago. His{' '}
          <a href="https://jasher.substack.com/p/2025-year-in-review-a-remarkable">Real-Time Crime Index</a>
          {' '}sample of 570 agencies through October had murder running roughly 20% below 2024 &mdash; &ldquo;by far the largest decline ever recorded,&rdquo; he wrote, &ldquo;eclipsing the decline in 2024.&rdquo; The data was always going to look like this. The question worth caring about is what other data systems did with it.
        </P>

        <P>So I went looking for the polls.</P>

        <H2>Two polls, one fall, no agreement</H2>

        <P>
          The dominant TV frame on this release is <em>people don&rsquo;t believe the data</em>. The cited number is from the{' '}
          <a href="https://ciceroinstitute.org/research/national-crime-poll/">Cicero Institute&rsquo;s 2025 National Public Safety Poll</a>:{' '}
          <a href="https://www.globenewswire.com/news-release/2025/10/30/3177742/0/en/New-National-Poll-Americans-Demand-Accountability-on-Crime-Homelessness-and-the-Courts.html">75% of Americans say violent crime is &ldquo;going up or staying the same&rdquo;</a>; only 18% say going down. 2,102 likely voters, &plusmn;2.18%, fielded September 20&ndash;25.
        </P>

        <P>
          Except{' '}
          <a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">Gallup&rsquo;s 2025 reading</a>
          {' '}found 49% saying there&rsquo;s more crime in the U.S. &mdash; the <em>lowest share since 2001</em>. The 30% saying local crime is up from a year ago dropped 19 points off the prior year.
        </P>

        <Fig caption={<>Sources: <a href="https://www.globenewswire.com/news-release/2025/10/30/3177742/0/en/New-National-Poll-Americans-Demand-Accountability-on-Crime-Homelessness-and-the-Courts.html">Cicero Institute National Public Safety Poll, Sept 20&ndash;25 2025, n=2,102</a>; <a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">Gallup, Crime in U.S. Seen as Less Serious for Second Straight Year (Oct 2025)</a>. Cicero&rsquo;s binary lumps &ldquo;staying the same&rdquo; in with &ldquo;going up&rdquo;; Gallup forces a direction.</>}>
          <img
            src="https://quickchart.io/chart/render/zf-4db9809e-134c-4c78-ad54-cf3c9ee3702f"
            alt="Bar chart comparing two national polls on U.S. crime perception conducted in fall 2025: Cicero Institute reports 75 percent of respondents say crime is going up or staying the same; Gallup reports 49 percent of respondents say there is more crime in the U.S. than a year ago."
            style={{ width:'100%', display:'block' }}
          />
        </Fig>

        <P>Both polls are real. Both are competent. They are not measuring the same thing.</P>

        <P>
          Cicero&rsquo;s question is a trapdoor &mdash; <em>going up or staying the same</em> lumps the people who think things are flat in with the people who think things are getting worse, so of course it clears 70%. Gallup forces a direction, and the share saying &ldquo;more&rdquo; is collapsing. You can write &ldquo;75% don&rsquo;t believe the FBI&rdquo; or &ldquo;crime concern at a 24-year low&rdquo; off the same fall. Two different rooms will write two different things.
        </P>

        <H2>The supply side is fast. The demand side is the mess.</H2>

        <P>
          The FBI just dropped <em>preliminary annual</em> 2025 data on May 13. The 2024 numbers showed up the previous{' '}
          <a href="https://www.fbi.gov/news/press-releases/fbi-releases-2024-reported-crimes-in-the-nation-statistics">August</a>. The 2023 numbers in September 2024. The pipeline got about four months faster in two years, because the bureau moved to monthly NIBRS submissions and could roll up a draft year without waiting on slow-to-report jurisdictions. That&rsquo;s a real pipeline win. The supply side of U.S. crime data is cleaner and faster than it has ever been.
        </P>

        <P>
          The demand side is the mess. Perception is measured by independent shops, each picking its own question, sample frame, weighting, and field window. Cicero&rsquo;s binary is sticky. Gallup&rsquo;s slope is real. Cable bookers will pick whichever number plays in the segment.
        </P>

        <Callout label="What the cliche gets wrong">
          &ldquo;Perception lags reality&rdquo; treats public belief like a single slow thermometer. It isn&rsquo;t one. It&rsquo;s twelve thermometers in twelve different rooms, calibrated differently, read by people who want twelve different things. They aren&rsquo;t lagging the FBI release by months. They were already running. They just don&rsquo;t agree.
        </Callout>

        <Divider />

        <P>
          Murder fell 18.1%. The data system that says so is the fastest it has ever been. The data system that&rsquo;s supposed to tell us how that landed in anyone&rsquo;s head is still nineteenth-century craftwork bolted to a twenty-first-century pipeline.
        </P>

        <P>
          And the chart that doesn&rsquo;t yet exist is the one where the FBI release and the polls about it both run on the same calendar.
        </P>

      </article>
    </Prose>
  </Container>
);

// ==================== Footer ====================
const Footer = () => {
  const [email, setEmail] = React.useState('');
  const [sent, setSent] = React.useState(false);
  return (
    <footer id="subscribe" style={{ borderTop:'1px solid var(--ink)', marginTop:80 }}>
      <Container>
        <div style={{ padding:'64px 0 40px', maxWidth:560 }}>
          <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, color:'var(--muted)' }}>&sect; Subscribe</span>
          <h3 style={{ fontFamily:'var(--display)', fontWeight:900, letterSpacing:'-0.01em', fontSize:'clamp(32px, 4vw, 56px)', lineHeight:0.95, margin:'8px 0 16px' }}>
            The dispatch,<br/>every Saturday morning.
          </h3>
          <p style={{ fontSize:17, lineHeight:1.55, maxWidth:'42ch', margin:'0 0 24px', textWrap:'pretty' }}>
            One email a week. A short essay, a chart, and links to anything we read
            that changed the way we read public data. No tracking pixels.
          </p>
          <form onSubmit={(e)=>{ e.preventDefault(); setSent(true); }}
            style={{ display:'flex', gap:0, maxWidth:460, border:'1.5px solid var(--ink)' }}>
            <input value={email} onChange={e=>setEmail(e.target.value)}
              type="email" placeholder="you@yourdomain.org" required
              style={{ flex:1, border:0, background:'transparent', padding:'14px 16px', fontFamily:'var(--body)', fontSize:16, color:'var(--ink)', outline:'none' }}/>
            <button type="submit"
              style={{ border:0, borderLeft:'1.5px solid var(--ink)', padding:'0 20px', background:'var(--ink)', color:'var(--paper)', fontFamily:'var(--mono)', fontSize:12, letterSpacing:'0.12em', textTransform:'uppercase', cursor:'pointer', fontWeight:600 }}>
              {sent ? 'Sent ✓' : 'Subscribe →'}
            </button>
          </form>
          {sent && <p style={{ marginTop:10, fontFamily:'var(--mono)', fontSize:12, color:'var(--muted)' }}>Check your inbox &mdash; the confirmation note is on its way.</p>}
        </div>

        <Rule />

        <div style={{ padding:'24px 0 40px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }}>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Colophon</div>
            <div>Hosted on GitHub Pages. No trackers, no cookies, no stock photography. Built by hand at Standard Co.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>
            <div>All text, charts, and datasets are published under CC BY 4.0. Copy us, cite us, improve us. Corrections, at the bottom of every piece.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Contact</div>
            <div>info@standardco.de<br/>Standard Co, est. 2013<br/>A reader-supported project.</div>
          </div>
        </div>

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
          <span>&copy; 2013&ndash;2026 Standard Co &middot; All rights unreserved</span>
          <span>Made with help from Claude</span>
        </div>
      </Container>
      <style>{`
        @media (max-width: 820px){
          .cdfa-colophon{ grid-template-columns: 1fr !important; }
        }
      `}</style>
    </footer>
  );
};

// ==================== App ====================
function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

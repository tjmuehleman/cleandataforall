      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On October 13 the WHO published its <a href={REPORT}>Global Antibiotic Resistance Surveillance Report 2025</a> &mdash; its biggest ever, drawn from <a href={CIDRAP}>more than 23 million bacterial infections across 104 countries</a> &mdash; and the number that traveled was clean and terrifying: <a href={PRESS}>1 in 6 lab-confirmed bacterial infections in 2023 was resistant to the antibiotic meant to treat it</a>. It&rsquo;s a good number. It&rsquo;s also an average. And averages are where I start poking.
        </P>

        <P>
          Here&rsquo;s what &ldquo;1 in 6&rdquo; is averaging. The report breaks resistance out by the kind of infection, and the four buckets don&rsquo;t resemble each other at all. <a href={CIDRAP}>Urinary tract: 1 in 3. Bloodstream: 1 in 6. Gastrointestinal: 1 in 15. Gonorrhea: 1 in 125.</a> Line those up and the worst bucket is more than forty times the best. &ldquo;1 in 6&rdquo; is what you get when you pour a UTI and a case of gonorrhea into the same bucket and stir.
        </P>

        <H2>An average is not a measurement</H2>

        <P>
          I don&rsquo;t say that to nitpick WHO &mdash; pooling is the honest move when you&rsquo;re reporting one global figure across <a href={PRESS}>22 antibiotics and eight pathogens</a>. But a single fraction hides its own composition, and composition is the whole story here. The headline makes it sound like resistance is one weather system drifting across the planet. It isn&rsquo;t. It&rsquo;s four different infections failing four different drugs at four different rates, and the tidy number sits on top like a lid.
        </P>

        <P>
          The regional cut has the same problem &mdash; <a href={PRESS}>1 in 3 in South-East Asia and the Eastern Mediterranean, 1 in 5 in Africa, 1 in 7 in the Americas, 1 in 10 in Europe</a>. (We&rsquo;ve been down that road here before.) But the spread <em>by infection type</em> is wider than the spread by geography, and it barely gets mentioned &mdash; because it doesn&rsquo;t fit on a map.
        </P>

        <H2>The worst bucket is the one that kills</H2>

        <P>
          Now flip it around and ask which bucket you&rsquo;d least want to be in. Bloodstream infections &mdash; sepsis, organ failure, the ones that actually kill &mdash; sit at 1 in 6 on average. But average hides the drug that matters. For the two workhorse gram-negative bugs in blood, resistance to the first-line treatment (third-generation cephalosporins) already runs <a href={CIDRAP}>44.8% for <em>E. coli</em> and 55.2% for <em>K. pneumoniae</em></a>. In Africa, <a href={PRESS}>over 70% for both</a>. And the break-glass drugs are going too: <a href={CIDRAP}>54.3% of <em>Acinetobacter</em> bloodstream infections were resistant to carbapenems</a>.
        </P>

        <Fig caption={<>Global bloodstream-infection resistance, 2023: <em>E. coli</em> to third-generation cephalosporins 44.8%, <em>K. pneumoniae</em> to third-generation cephalosporins 55.2%, <em>Acinetobacter</em> to carbapenems 54.3%. Source: WHO Global Antibiotic Resistance Surveillance Report 2025, via CIDRAP.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22E.+coli+vs+3rd-gen+cephalosporins%22%2C%22K.+pneumoniae+vs+3rd-gen+cephalosporins%22%2C%22Acinetobacter+vs+carbapenems%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+of+bloodstream+isolates+resistant%22%2C%22data%22%3A%5B44.8%2C55.2%2C54.3%5D%2C%22backgroundColor%22%3A%5B%22%233a3a3a%22%2C%22%23141210%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22In+bloodstream+infections%2C+first-line+drugs+already+fail+about+half+the+time%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A60%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+resistant%2C+2023+%28global%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of bloodstream-infection resistance in 2023: E. coli to third-generation cephalosporins 44.8 percent, K. pneumoniae to third-generation cephalosporins 55.2 percent, Acinetobacter to carbapenems 54.3 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          Read those bars again. In the infection category most likely to kill you, the first-choice antibiotic already fails about half the time, and the last-resort antibiotic fails more than half. That&rsquo;s not &ldquo;1 in 6.&rdquo; That&rsquo;s a coin flip in the exact place a coin flip is unaffordable.
        </P>

        <H2>What the lid is for</H2>

        <P>
          I keep coming back to why the pooled number exists in the first place. It exists because it travels. &ldquo;1 in 6&rdquo; fits in a headline, a post, a minister&rsquo;s speech. &ldquo;Third-generation cephalosporin resistance in <em>K. pneumoniae</em> bloodstream isolates reached 55%&rdquo; does not. The aggregate is built for distribution, not for decisions. And the people making decisions &mdash; which drug to stock, which infection to test for, where to put a lab &mdash; need the numbers under the lid, not the lid.
        </P>

        <Callout label="Worth keeping in mind">
          This is only the second time WHO has been able to produce global resistance estimates at all &mdash; it&rsquo;s the <a href={CIDRAP}>most comprehensive AMR assessment since GLASS launched in 2015</a>. The granularity <em>is</em> the achievement. The headline is just the part that fits in a headline.
        </Callout>

        <Divider />

        <P>
          So keep the 1 in 6. It&rsquo;s real, it&rsquo;s rising &mdash; <a href={PRESS}>up in more than 40% of the bug-drug pairs WHO tracks, 5 to 15% a year</a> &mdash; and it should scare you. Just don&rsquo;t mistake it for a measurement of anything you&rsquo;d actually treat. It&rsquo;s the average of a UTI and a case of gonorrhea. Nobody has ever had that.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

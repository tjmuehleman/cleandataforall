// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H3 = ({ children }) => <h3>{children}</h3>;

);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          17.60%. That’s the yellow slice of a donut chart on the <a href="https://comptroller.texas.gov/transparency/open-data/tableau/tefa.php" target="_blank" rel="noopener">Texas comptroller’s voucher dashboard</a>, and it’s the share of the program’s 111,327 funded kids who attended public school the previous year. The Texas Tribune turned it into the line you’ve probably seen: <a href="https://www.texastribune.org/2026/08/03/esa-students-texas-school-vouchers-first-year/" target="_blank" rel="noopener">only 17% of first-year voucher recipients attended public schools</a>. On a <a href="https://www.texastribune.org/2026/08/03/esa-students-texas-school-vouchers-first-year/" target="_blank" rel="noopener">$1 billion</a> program. The brief I started from went further and said about 7 in 10 were already in private school.
        </P>

        <P>
          I went and stared at the donut for a while. The 17.60 is real. It’s also doing something weird, and the weird part is printed right there in the legend.
        </P>

        <H2>More than a quarter of the donut had no previous year</H2>

        <P>
          Three slices. <a href="https://comptroller.texas.gov/transparency/open-data/tableau/tefa.php" target="_blank" rel="noopener">Attended public school the previous year, grades 2-12: 17.60%. Didn’t attend public school the previous year, grades 2-12: 54.68%. No prior K-12 enrollment (PK, K, Grade 1): 27.72%.</a>
        </P>

        <P>
          So 27.72% of funded kids, roughly 30,900 of them (27.72% of 111,327), sit in the denominator of the headline number and, the way the slices are drawn, can’t be in the numerator. Take them out and the public share is 24.3% (17.60 ÷ 72.28). Still low! But 17 and 24 are different headlines, and they’re the same donut.
        </P>

        <P>
          And it’s not the first version. In August, Click2Houston reported the split as <a href="https://www.click2houston.com/news/local/2026/08/18/70-of-texas-voucher-awardees-previously-attended-private-school-or-were-homeschooled-state-data-shows/" target="_blank" rel="noopener">70% private school or homeschool, 30% public</a>, out of 118,441 awarded students as of Aug. 10, with pre-K and kindergarten applicants excluded. Awarded, not funded. Two grades out, not three. That’s three public-school shares for one program: 30, 17.60, 24.3.
        </P>

        <Fig caption={<>Sources: <a href="https://www.click2houston.com/news/local/2026/08/18/70-of-texas-voucher-awardees-previously-attended-private-school-or-were-homeschooled-state-data-shows/" target="_blank" rel="noopener">Click2Houston</a> for the Aug. 10 figure (118,441 awarded students, pre-K and K excluded); <a href="https://comptroller.texas.gov/transparency/open-data/tableau/tefa.php" target="_blank" rel="noopener">Texas Comptroller, TEFA Dashboard</a> for Nov. 10. The 24.3% is derived: 17.60 ÷ (17.60 + 54.68).</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Aug.+10%3A+awarded+students%2C+pre-K+and+K+excluded+%2830%25%29%22%2C%22Nov.+10%3A+all+funded+participants+%2817.60%25%29%22%2C%22Nov.+10%3A+funded%2C+grades+2-12+only+%2824.3%25%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B30%2C17.6%2C24.3%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%2C%22%23777%22%5D%2C%22barPercentage%22%3A0.7%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22One+program%2C+three+public-school+shares%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A40%2C%22stepSize%22%3A10%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+who+attended+public+school+in+2024-25%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22x%22%7D%5D%2C%22yAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22y%22%7D%5D%7D%7D%7D&amp;v=2.9.4&amp;w=900&amp;h=480&amp;bkg=transparent&amp;devicePixelRatio=2" alt="Horizontal bar chart of three public-school shares for the Texas voucher program: 30% of awarded students as of August 10 with pre-K and K excluded, 17.60% of all funded participants as of November 10, and 24.3% of funded participants in grades 2-12 only." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>Why is first grade in there?</H2>

        <P>
          Pre-K and kindergarten I get. But a first grader? A kid in first grade this year was in kindergarten last year. Somewhere.
        </P>

        <P>
          The answer is a footnote under the donut: <a href="https://comptroller.texas.gov/transparency/open-data/tableau/tefa.php" target="_blank" rel="noopener">“Previous year at the time of application is 2024-25.”</a> Applications ran <a href="https://educationfreedom.texas.gov/" target="_blank" rel="noopener">Feb. 4 to March 31, 2026</a>, in the middle of the 2025-26 school year, so the last finished year a parent could report on was 2024-25. Fair enough. (I’d have built the form the same way, probably.)
        </P>

        <P>
          But the money is for 2026-27. So “previous year” on the dashboard is two school years back, and this year’s first graders were pre-K age then. A whole grade gets filed under no prior enrollment. The July demographic report counted <a href="https://educationfreedom.texas.gov/wp-content/uploads/2026/07/TEFA-Annual-Demographic-Report.pdf" target="_blank" rel="noopener">6,944 funded first graders</a> out of 85,344 funded accounts as of July 29. Where those kids spent kindergarten isn’t on the dashboard.
        </P>

        <H2>And it’s the parent’s answer</H2>

        <P>
          The field is self-reported. The comptroller’s own report says the public-school flag is <a href="https://educationfreedom.texas.gov/wp-content/uploads/2026/07/TEFA-Annual-Demographic-Report.pdf" target="_blank" rel="noopener">“based on parent-reported information in the TEFA application.”</a> And the big blue slice is “didn’t attend public school,” which is not the same thing as “attended private school.” Private, homeschool, anything else. One bucket.
        </P>

        <Divider />

        <P>
          So was it 7 in 10? Depends which kids you let into the fraction. It’s 54.68% of everyone funded, 75.7% (54.68 ÷ 72.28) if you only count kids old enough to have had a 2024-25, and 70% back in August on a different list. I buy that most of these kids weren’t in a Texas public school two years ago. I just can’t tell you where the first graders were last year. Neither can the donut.
        </P>

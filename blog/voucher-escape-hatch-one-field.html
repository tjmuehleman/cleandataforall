      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Every universal school-voucher program in the country gets sold with the same sentence: this is how a kid escapes a failing public school. Whether that sentence is true turns out to be a data question. And it hangs on a single field that most of these programs barely bother to collect.
        </P>

        <P>
          The field is boring. It&rsquo;s &ldquo;where was this student enrolled last year&rdquo; &mdash; public school, private school, homeschool, or not yet in kindergarten. That one column decides the whole narrative. If most recipients were already in private school, a voucher is a discount for families who&rsquo;d already opted out. If most came from public schools, it&rsquo;s the <em>escape hatch</em> it&rsquo;s advertised as. Same dollars, opposite stories, and the only thing standing between them is a checkbox on an intake form.
        </P>

        <H2>Where the checkbox exists, the pitch mostly doesn&rsquo;t hold</H2>

        <P>
          A handful of states publish the breakdown, and it&rsquo;s lopsided. In Arkansas, <a href={NCPE}>95% of the first year&rsquo;s voucher participants had never attended a public school</a> &mdash; the number comes straight out of the state&rsquo;s own <a href={ARREP}>2023 transparency report</a>, which means 5% came from one. When Florida went universal in 2023, <a href={FLWMFE}>only 13% of the 122,895 new recipients had ever been in a public school</a>; 69% were already private. Iowa&rsquo;s statewide program: <a href={NCPE}>about 13% previously public</a>. Arizona doesn&rsquo;t publish a clean percentage, but the governor&rsquo;s office reported that <a href={AZGOV}>more than half of 2024 voucher spending was newly incurred cost for kids who were already private, homeschooled, or not yet in school</a>.
        </P>

        <P>
          None of that tells you vouchers are good or bad. It tells you who&rsquo;s cashing the checks. And so far it&rsquo;s mostly families who never needed the escape hatch, because they were never in the building.
        </P>

        <H2>Then Texas reported it by tier</H2>

        <P>
          This year Texas opened the biggest program in the country and did something the others mostly didn&rsquo;t: it reported prior-enrollment status by eligibility tier. That&rsquo;s where it gets interesting for anyone who cares how a number gets built.
        </P>

        <P>
          <a href={TXTRIB}>More than 274,000 students applied; roughly 96,000 got award notices</a>. The state handed them out in priority tiers, and the tiers don&rsquo;t agree with each other. The first batch &mdash; students with disabilities and their siblings &mdash; came in at <a href={TXFACT}>53% previously enrolled in public school</a>. The second tier, low-income families under 200% of the poverty line, flipped the other way: <a href={TXTRIB}>68% were already in private school or homeschool</a>, so 32% came from public.
        </P>

        <Fig caption={<>Share of Texas ESA awardees who previously attended a public school, by priority tier. Tier 1 (students with disabilities and siblings): 53%. Tier 2 (families at or below 200% of the federal poverty level): 32%, i.e. 100% &minus; the 68% reported as previously private or homeschool. Source: The Texas Tribune, citing state comptroller data.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Tier+1%3A+disability+%2B+siblings%22%2C%22Tier+2%3A+low-income+%28%3C%3D200%25+FPL%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+who+previously+attended+public+school%22%2C%22data%22%3A%5B53%2C32%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Texas%3A+one+program%2C+two+tiers%2C+two+different+numbers%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A60%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+Texas+awardees+previously+in+public+school%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart: share of Texas voucher awardees who previously attended public school — Tier 1 disability and siblings 53 percent, Tier 2 low-income 32 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          Read that again. One program. Two tiers. 53% from public school in one, 32% in the other. There is no single &ldquo;Texas number&rdquo; yet &mdash; there&rsquo;s a number per tier, and which one you quote is really a choice about which snapshot you took.
        </P>

        <Callout label="What got corrected">
          The pre-launch talking point was that Texas would look like Arkansas &mdash; overwhelmingly kids who were already private. The actual first-tier data went the other way: a slim majority came from public school. The truth is it depends entirely on which tier the state let in first. That&rsquo;s a composition effect, not a finding.
        </Callout>

        <H2>The number is an artifact, not a fact</H2>

        <P>
          Here&rsquo;s the part I keep flagging. A voucher program&rsquo;s headline &ldquo;who is this for&rdquo; statistic isn&rsquo;t really a fact about the world. It&rsquo;s an artifact of three things: which families the state admitted first, which year you look at, and whether the state records prior enrollment at all. Arkansas&rsquo;s damning 95% is from a report filed <a href={ARREP}>before the program went fully universal</a>. Texas&rsquo;s tidy tiers exist only because Texas happened to publish the split. Move the cutoff or drop the field and the story moves with it.
        </P>

        <P>
          And the stakes aren&rsquo;t small. Private-school-choice participation <a href={EDCHOICE}>jumped 25% in a single year, from about 1 million students to 1.3 million</a>. We&rsquo;re routing billions through a policy whose central empirical claim &mdash; that it pulls kids out of struggling public schools &mdash; is measured, where it&rsquo;s measured at all, by a field with no shared definition and no shared reporting schedule across states.
        </P>

        <Divider />

        <P>
          I don&rsquo;t have a dog in the voucher fight. I have a dog in the know-what-your-number-means fight. And right now the honest answer to &ldquo;do vouchers rescue kids from failing schools&rdquo; is: depends which checkbox you&rsquo;re reading, in which state, from which year. That&rsquo;s not an answer. That&rsquo;s a data-collection problem wearing an answer&rsquo;s clothes.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

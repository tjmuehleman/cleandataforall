// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Louisiana spends <a href="https://www.census.gov/content/dam/Census/library/visualizations/2026/comm/school-system-finances.pdf">$12,162</a> per student. The national figure is <a href="https://www.census.gov/newsroom/press-releases/2026/school-system-finances.html">$17,619</a>. And Louisiana is, per the Harvard/Stanford/Dartmouth team behind the Education Recovery Scorecard, <a href="https://www.kedm.org/louisiana-news/2026-05-13/louisiana-is-first-in-reading-score-growth-second-in-math">the only state back above its 2019 level in both reading and math</a>.
        </P>

        <P>
          Cheap <em>and</em> good. Spending skeptics get a trophy, spending advocates get a migraine, and everybody gets a talking point. I run a data company, so I argue about denominators instead. This headline has three, and none of them are doing what you'd hope.
        </P>

        <H2>Dollars that aren&rsquo;t the same dollar</H2>

        <P>
          The $17,619 is Census&rsquo;s FY2024 average, <a href="https://www.census.gov/newsroom/press-releases/2026/school-system-finances.html">up 6.6% in a single year</a>. Census itself says the figures are not adjusted for inflation or cost of living. New York comes in at $31,918. Idaho at $11,060. That&rsquo;s a 2.9x spread (my arithmetic, 31,918 over 11,060) between two states that both get counted as &ldquo;a dollar per pupil.&rdquo; I don&rsquo;t have a cost-adjusted Louisiana number. Neither does the table.
        </P>

        <P>
          Also: the chart up top. Seven states plus D.C. <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf">improved in reading</a> between 2022 and 2025 (p. 24 of the report). Six of the seven spend under the national average. Maryland, at $20,208, spends over it. So &ldquo;cheap and good&rdquo; is mostly true. Mostly.
        </P>

        <H2>&ldquo;Only&rdquo; among whom?</H2>

        <P>
          Louisiana&rsquo;s <a href="https://educationscorecard.org/states/louisiana/">Scorecard page</a> ranks it 2nd of 35 in reading growth and 3rd of 38 in math growth. Not 50. Thirty-five and thirty-eight. The state&rsquo;s own education department says first and second <a href="https://doe.louisiana.gov/about/news-releases/release/2026/05/13/louisiana-ranks-first-among-states-in-reading-growth--second-in-math-on-latest-national-education-scorecard">among states</a>, and second and third once D.C. is counted. So &ldquo;only state&rdquo; means only state with data in both subjects that someone could line up.
        </P>

        <P>
          And how far above 2019? Per that same page: 0.07 grade equivalents in math. 0.29 in reading. Seven hundredths of a grade level is the entire &ldquo;back above&rdquo; in math.
        </P>

        <H2>A snapshot explaining a slope</H2>

        <P>
          Third denominator is time. The spending number is one fiscal year. The score number is a change across three (2022 to 2025). Pairing a one-year ledger with a three-year slope isn&rsquo;t wrong, exactly, it&rsquo;s just not a join anybody has checked. Louisiana&rsquo;s chronic absenteeism, for what it&rsquo;s worth, <a href="https://educationscorecard.org/states/louisiana/">went from 18.8% to 22%</a> over the same stretch, which tells you the state was busy doing at least two things at once.
        </P>

        <Divider />

        <P>
          Louisiana might be the best deal in American education. Or the table is measuring the right thing in the wrong units. Until someone adjusts the denominator, &ldquo;spends less&rdquo; is a fact about the ledger, not about the kids.
        </P>

        <P><em>— TJ</em></P>

        <H3>Sources</H3>

        <UL items={[
          <><a href="https://www.census.gov/newsroom/press-releases/2026/school-system-finances.html">Census Bureau press release, May 7, 2026</a> ($17,619; 6.6%; New York $31,918; Idaho $11,060; no inflation or cost-of-living adjustment)</>,
          <><a href="https://www.census.gov/content/dam/Census/library/visualizations/2026/comm/school-system-finances.pdf">Census Bureau, FY2024 school system finances table</a> (state per-pupil figures)</>,
          <><a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf">Education Recovery Scorecard, May 2026 report</a> (states improving in reading, p. 24)</>,
          <><a href="https://educationscorecard.org/states/louisiana/">Education Recovery Scorecard, Louisiana</a> (rankings, grade equivalents vs. 2019, absenteeism)</>,
          <><a href="https://www.kedm.org/louisiana-news/2026-05-13/louisiana-is-first-in-reading-score-growth-second-in-math">KEDM, May 13, 2026</a> and <a href="https://doe.louisiana.gov/about/news-releases/release/2026/05/13/louisiana-ranks-first-among-states-in-reading-growth--second-in-math-on-latest-national-education-scorecard">Louisiana Department of Education release</a> (&ldquo;only state&rdquo; claim; D.C. caveat)</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

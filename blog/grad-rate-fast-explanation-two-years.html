// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <P>Paragraph text.</P>

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;

const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On Wednesday, September 2, North Carolina announced the highest graduation rate in its
          history: <a href="https://www.dpi.nc.gov/news/press-releases/2026/09/02/2026-graduation-rate-reaches-historic-high-accountability-results-continue-positive-trend-north" target="_blank" rel="noopener">88.8%</a>,
          up a full percentage point from the previous record.
        </P>

        <P>
          Six days later, Chalkbeat published a different number about the same schools. North
          Carolina credit recovery enrollment: <a href="https://www.chalkbeat.org/2026/09/08/credit-recovery-enrollment-spikes-after-pandemic-data-shows/" target="_blank" rel="noopener">up 173%</a>,
          from 16,882 students to 46,133.
        </P>

        <P>
          That second number is from the 2023-24 school year.
        </P>

        <H2>Two clocks</H2>

        <P>
          I run a data company. Most of the work is not analysis. It&rsquo;s reconciling files that
          were built on different clocks and then handed to somebody who assumed they lined up.
        </P>

        <P>
          Here&rsquo;s the national version. NCES publishes the canonical graduation series in
          Digest <a href="https://nces.ed.gov/programs/digest/d24/tables/dt24_219.10.asp?current=yes" target="_blank" rel="noopener">table 219.10</a>,
          and it runs from 79.0% in 2010-11 to 86.6% in 2021-22. Up 7.6 points over eleven years.
          And then it stops. The 2022-23 row has a dash where the rate should be. (The chart above
          is that table, dash included.)
        </P>

        <P>
          So this month, while state after state announces a 2025-26 record, the most recent
          national graduation rate a federal table will hand you belongs to a cohort that started
          ninth grade in 2018.
        </P>

        <H2>The slow file</H2>

        <P>
          The 2023-24 Civil Rights Data Collection &mdash; the thing credit recovery lives in &mdash;
          was <a href="https://www.npr.org/2026/09/04/nx-s1-5955681/civil-rights-data-schools-trump" target="_blank" rel="noopener">supposed to be published at the end of last year</a>,
          by the Education Department&rsquo;s own deadline. It went up quietly in the first week of
          September. No First Look Report, which for more than a decade was the thing that made the
          collection readable by somebody who is not a data scientist. Thirty-seven raw files
          instead. The Office for Civil Rights, which runs the collection, cut its staff in half.
        </P>

        <P>
          Nationally, credit recovery enrollment is
          up <a href="https://www.chalkbeat.org/2026/09/08/credit-recovery-enrollment-spikes-after-pandemic-data-shows/" target="_blank" rel="noopener">13%</a> between
          2017-18 and 2023-24. In a few places it is not 13%.
        </P>

        <Fig caption={<>Source: <a href="https://www.chalkbeat.org/2026/09/08/credit-recovery-enrollment-spikes-after-pandemic-data-shows/" target="_blank" rel="noopener" style={{ color:'inherit' }}>Chalkbeat analysis of the 2017-18 and 2023-24 Civil Rights Data Collection</a>. Percent change in students enrolled in credit recovery courses.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22North+Carolina%22%2C%22Philadelphia%22%2C%22Houston+ISD%22%2C%22Maryland%22%2C%22Nationwide%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Change+in+credit+recovery+enrollment+%28%25%29%22%2C%22data%22%3A%5B173%2C148%2C122%2C75%2C13%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%235a5a5a%22%2C%22%23777%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.45%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Credit+recovery+enrollment+change%2C+2017-18+to+2023-24%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22min%22%3A0%2C%22max%22%3A190%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+change%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
               alt="Horizontal bar chart of change in credit recovery enrollment from 2017-18 to 2023-24: North Carolina up 173 percent, Philadelphia up 148 percent, Houston ISD up 122 percent, Maryland up 75 percent, nationwide up 13 percent."
               style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Houston ISD went from 12,202 students in credit recovery to 27,074 &mdash; a 122% increase,
          while total district enrollment fell. Philadelphia went from 1,459 to 3,624.
        </P>

        <P>
          I&rsquo;m not going to tell you credit recovery is bad. I don&rsquo;t know, and the people
          who actually study it are careful about saying so. Samantha Viano at Johns Hopkins, quoted
          in that same piece, calls it <em>&ldquo;such a wild west.&rdquo;</em> Which is a
          researcher&rsquo;s way of saying nobody is counting it properly.
        </P>

        <H2>The part that bugs me</H2>

        <P>
          It isn&rsquo;t the rate. It&rsquo;s the asymmetry.
        </P>

        <P>
          A graduation rate is one arithmetic operation on a roster the state already owns. It ships
          within weeks of the last day of school with a superintendent quote attached. The counts
          that would let you interpret it &mdash; who took a compressed online course to clear a
          failed semester, which buildings are staffed by first-year teachers &mdash; take two
          years, arrive eight months late, and arrive without a summary.
        </P>

        <P>
          And then there&rsquo;s a third number, on a third clock. The class of 2024 sat the
          12th-grade NAEP in January through March of that year, a few months before they picked up
          their diplomas. <a href="https://www.nagb.gov/news-and-events/news-releases/2025/declines-in-8th-grade-science-and-12th-grade-math-and-reading.html" target="_blank" rel="noopener">45% scored below <em>NAEP Basic</em> in math</a>,
          the highest share ever recorded. 33% were judged academically prepared for entry-level
          college math, down from 37% in 2019. Those results came out in September 2025.
        </P>

        <Callout label="Three clocks, one cohort">
          Graduation rate: announced within the calendar year. NAEP: about 18 months from test to
          release. CRDC credit recovery counts: two school years, and eight months past the
          Department&rsquo;s own deadline.
        </Callout>

        <Divider />

        <P>
          Nobody designed this. Every one of those release schedules is defensible on its own, and
          the people building these files are not the problem &mdash; half of them just got laid
          off. But stack the calendars and you get a system where the flattering number always makes
          the press conference, and the complicating number shows up two years later as a zip file
          with no readme.
        </P>

      </article>
    </Prose>
  </Container>
);

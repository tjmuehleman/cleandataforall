const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          April 25, 2026. World Malaria Day. Dr. Nana Yaw Peprah, Deputy Programme Manager of Ghana&rsquo;s National Malaria Elimination Programme, told the press that the country is{' '}
          <a href="https://www.gbcghanaonline.com/news/health/ghana-malaria-day/2026/">phasing out the standard pyrethroid-only insecticide-treated net</a>{' '}
          &mdash; the single most-procured malaria-prevention tool of the past twenty years.
        </P>

        <P>
          The reason is the part you don&rsquo;t want to hear before bed. The mosquitoes are no longer dying when they touch them.
        </P>

        <P>
          Pyrethroid resistance has been showing up in vector data across sub-Saharan Africa for over a decade. The cleanest single-country longitudinal series I&rsquo;ve seen is from Malawi.{' '}
          <em>Anopheles funestus</em>{' '}&mdash;{' '}
          one of the dominant malaria vectors in southern Africa &mdash; was hit with permethrin at the WHO discriminating dose in 2009. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9338535/">47.2% of the mosquitoes died.</a>{' '}
          By 2014, <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9338535/">13%.</a>{' '}
          By 2021, <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9338535/">6.7%.</a>{' '}
          The deltamethrin numbers track the same shape: <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9338535/">42.3%, then 1.75%, then 5.2%.</a>
        </P>

        <P>
          A net is supposed to kill a mosquito on contact. The Malawi data says the standard formulation is killing roughly one in fifteen.
        </P>

        <H2>The procurement system was the slow part</H2>

        <P>
          I run a data company. The thing that bugs me about this isn&rsquo;t the biology. The biology has been clear for a long time.
        </P>

        <P>
          What bugs me is the lag between the field signal and the order book. The{' '}
          <a href="https://www.who.int/teams/global-malaria-programme/prevention/vector-control/insecticide-resistance">WHO Global Insecticide Resistance Database</a>{' '}
          has been publishing this signal year after year. The Malawi paper landed in 2022.{' '}
          <a href="https://cdn.who.int/media/docs/default-source/malaria/world-malaria-reports/world-malaria-report-2025-executive-summary-eng.pdf">Thirty-eight WHO Member States have reported resistance to three or more classes of insecticides since 2010.</a>{' '}
          The biological story stopped being news years ago.
        </P>

        <P>
          The procurement story is only just catching up. Dual-active-ingredient nets &mdash; the next-generation product with chlorfenapyr that actually still works on resistant mosquitoes &mdash; were{' '}
          <a href="https://alma2030.org/heads-of-state-and-government/african-union-malaria-progress-reports/2025-africa-malaria-progress-report/">20% of net distribution across 39 reporting Member States in 2023.</a>{' '}
          They were{' '}
          <a href="https://alma2030.org/heads-of-state-and-government/african-union-malaria-progress-reports/2025-africa-malaria-progress-report/">51% in 2024.</a>{' '}
          In 2025, they hit{' '}
          <a href="https://alma2030.org/heads-of-state-and-government/african-union-malaria-progress-reports/2025-africa-malaria-progress-report/">74%.</a>
        </P>

        <Fig caption={<>Source: <a href="https://alma2030.org/heads-of-state-and-government/african-union-malaria-progress-reports/2025-africa-malaria-progress-report/">2025 Africa Malaria Progress Report</a> &mdash; share of insecticide-treated nets distributed across 39 reporting WHO Member States that were dual-active-ingredient nets, 2023&ndash;2025.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222023%22%2C%222024%22%2C%222025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Dual-AI+nets%2C+%25+of+distribution%22%2C%22data%22%3A%5B20%2C51%2C74%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Dual-active-ingredient+bed+nets%2C+share+of+distribution%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22fontSize%22%3A11%2C%22min%22%3A0%2C%22max%22%3A100%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+nets+distributed+%2839+WHO+Member+States%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of dual-active-ingredient bed nets as a share of all nets distributed across 39 reporting WHO Member States: 20% in 2023, 51% in 2024, 74% in 2025."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          That&rsquo;s most of a decade of lag between the Malawi field data flipping red and the order book responding to it. Eleven years from the 2014 mortality number to the dual-AI majority in 2025.
        </P>

        <H2>Why the lag isn&rsquo;t surprising</H2>

        <P>
          A pyrethroid-only net is cheap. The pyrethroid&ndash;chlorfenapyr dual-AI net{' '}
          <a href="https://www.who.int/news-room/feature-stories/detail/expanded-use-of-new-dual-insecticide-nets-offers-hope-for-malaria-control-efforts-in-africa">costs more &mdash; and requires stable funding.</a>{' '}
          Most national malaria budgets are scaled in the cheap net per kid, with funding pipelines from the Global Fund and PMI denominated against the same unit cost. The forecasting model that ran clean and tight on the cheaper net had to be rebuilt to handle a unit-cost increase. Without the malaria budget growing.
        </P>

        <P>
          That&rsquo;s not a biology problem. That&rsquo;s a budget-line problem with biology consequences.
        </P>

        <P>
          The other half is the data system itself. Resistance assays are done locally, batched seasonally, published in peer-reviewed papers, summarized in WHO annexes a year or two later, then folded into a country&rsquo;s procurement specification by the next tender cycle. Each step is sensible. Together they add up to a multi-year reporting lag against a vector whose resistance has been compounding the whole time.
        </P>

        <H2>What Ghana actually did</H2>

        <P>
          Ghana isn&rsquo;t first to deploy dual-AI nets. Plenty of countries have been distributing them for years. Ghana is the country that{' '}
          <a href="https://www.gbcghanaonline.com/news/health/ghana-malaria-day/2026/">made the national-level policy declaration</a>{' '}
          on the loudest possible day: we are not bringing in the standard pyrethroid net at all anymore, anywhere in the country. PBO nets and new-generation formulations only.
        </P>

        <P>
          The press conference is the news. The procurement curve is the story.
        </P>

        <P>
          The new nets do work. WHO reports that{' '}

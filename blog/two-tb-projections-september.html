// ==================== Post body helpers ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

);

const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On September 12, 2025, <em>The Lancet Child &amp; Adolescent Health</em> <a href="https://www.thelancet.com/journals/lanchi/article/PIIS2352-4642(25)00218-4/abstract">published</a> a Harvard and Boston University mathematical model of what U.S. funding withdrawal does to pediatric tuberculosis over the next decade. The same month, a separate model from a different team, scoped differently, ran in <a href="https://journals.plos.org/globalpublichealth/article?id=10.1371/journal.pgph.0004899"><em>PLOS Global Public Health</em></a>. Both peer-reviewed. Both built on the same WHO baseline. Both right.
        </P>

        <P>
          They report different numbers. That is the most useful data point in the room.
        </P>

        <P>
          The Lancet paper, scope = children, window = 2025&ndash;2034, projects <strong>2.5 million additional pediatric TB cases and 340,000 additional child deaths</strong> if the U.S. drops bilateral aid alone. Layer a <a href="https://www.devex.com/news/devex-checkup-why-the-us-commitment-to-the-global-fund-has-cratered-107231">Global Fund withdrawal</a> on top &mdash; the administration has signaled it will pay one-fifth of Global Fund activities going forward, down from one-third &mdash; and the model runs to <strong>8.9 million additional child cases and more than 1.5 million additional child deaths</strong>. <a href="https://hsph.harvard.edu/news/u-s-funding-cuts-could-result-in-nearly-9-million-child-tuberculosis-cases-1-5-million-child-deaths/">(Press summary.)</a>
        </P>

        <P>
          The PLOS paper, scope = all ages, window = 2025&ndash;2030, <a href="https://journals.plos.org/globalpublichealth/article?id=10.1371/journal.pgph.0004899">26 high-burden countries</a>, runs three scenarios and gets <strong>+0.63M / +1.66M / +10.67M cases</strong> with corresponding deaths of <strong>+99,900 / +268,600 / +2,243,700</strong>.
        </P>

        <P>
          Same disease. Same cuts. One paper on five-year all-ages outcomes; the other on ten-year pediatric outcomes. Different methodologies. Different baselines. Both right. Both pointing at the same hole in the ground. Neither paper is the floor.
        </P>

        <H2>What the cuts actually cut</H2>

        <P>
          It is easy to read these as papers about drugs. They aren&rsquo;t.
        </P>

        <P>
          USAID provided <a href="https://www.cidrap.umn.edu/tuberculosis/usaid-funding-freeze-disrupts-global-tuberculosis-control-efforts">approximately $406 million for global TB control in 2024</a>, and from 2015 to 2024 the U.S. government accounted for <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2025/featured-topics/Impact-of-2025-funding-cuts">roughly 50% of all international donor funding for TB</a>. <a href="https://www.who.int/news/item/05-03-2025-funding-cuts-to-tuberculosis-programmes-endanger-millions-of-lives">Stop-work orders</a> landed in late January 2025. Of 162 USAID awards that touched TB, <a href="https://www.cidrap.umn.edu/tuberculosis/usaid-funding-freeze-disrupts-global-tuberculosis-control-efforts">79% were terminated</a>. The Global Fund&rsquo;s 2024&ndash;2026 cycle was <a href="https://www.devex.com/news/global-fund-plans-to-cut-1-4-billion-from-grants-it-has-already-awarded-110481">cut by $1.43 billion &mdash; 11% of allocation</a>, with some country grants taking cuts of 16%.
        </P>

        <P>
          What that money paid for is mostly not pharmacology. TB drugs are off-patent. The money paid for the system that finds the patient and follows them &mdash; molecular diagnostics, contact tracing, community health workers, the case-based digital surveillance that turns &ldquo;estimated&rdquo; into &ldquo;notified.&rdquo;
        </P>

        <P>
          (Last year I <a href="../blog/tb-two-records.html">wrote about</a> how only 133 of ~215 countries were on case-based digital TB surveillance as of 2023. The rest are still on aggregated, paper-based reporting. WHO had been pushing hard to accelerate that transition. USAID was the largest single donor to it. That is part of what got the stop-work order.)
        </P>

        <Fig caption={<>U.S. government share of international donor funding for TB, 2015&ndash;2024 average. Source: <a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2025/featured-topics/Impact-of-2025-funding-cuts">WHO Global Tuberculosis Report 2025</a>.</>}>
          <img src="https://quickchart.io/chart/render/zf-3cfe728f-2b3a-47c6-a45b-076aa8b8f225" alt="U.S. share of international donor TB funding, 2015–2024 — roughly 50%, per WHO" style={{ width:'100%', display:'block' }} />
        </Fig>

        <P>
          So the data pipeline producing the baseline both papers project from &mdash; the WHO Global TB Report &mdash; runs partly on the bilateral aid that got cut. The projections look out ten years. Year one is the year the input quality starts to fall.
        </P>

        <H2>The conditional in the title</H2>

        <P>
          Here is the part I cannot stop thinking about. The Harvard team also estimated that <a href="https://hsph.harvard.edu/news/u-s-funding-cuts-could-result-in-nearly-9-million-child-tuberculosis-cases-1-5-million-child-deaths/"><strong>90% of the additional projected child deaths could be avoided if funding was restored after just one year</strong></a>.
        </P>

        <P>
          Ninety percent. From one year of policy reversal. The remaining 10% accrues anyway &mdash; TB has a long latent period, and today&rsquo;s untreated transmission shows up in case counts two and three years from now. But the bulk of the projected harm is conditional.
        </P>

        <P>
          And that is what distinguishes a forecast from a budget choice. A forecast says: here is what will happen. A conditional projection says: here is what will happen <em>unless we don&rsquo;t</em>. The &ldquo;unless we don&rsquo;t&rdquo; window for TB closes earlier than the ten-year horizon of the headline numbers suggests.

        </P>

        <Callout label="What I&rsquo;d watch next">
          The 2025 WHO Global TB Report covers the first calendar year of the cuts. It is already <a href="https://www.who.int/news/item/12-11-2025-global-gains-in-tuberculosis-response-endangered-by-funding-challenges">flagging service disruptions across the 30 highest-burden countries</a>. The first numerical test will be the 2026 report&rsquo;s case-notification series &mdash; specifically the gap between notified and estimated cases. If the gap widens fast in the countries that lost the most USAID bilateral support, the input-quality concern from these projection papers is no longer hypothetical.
        </Callout>

        <P>
          Two papers, different methods, same direction, range on the magnitude. The variance is a feature.
        </P>

        <P>
          If you&rsquo;re going to repeat one number from these papers, skip the death toll and repeat the 90%. The death toll is downstream of a choice still being made daily.
        </P>

        <Divider />

        <H3>Sources</H3>

        <UL items={[
          <><a href="https://www.thelancet.com/journals/lanchi/article/PIIS2352-4642(25)00218-4/abstract">Menzies, Brown, Imai-Eaton, Dodd, Cohen, Martinez. &ldquo;Potential paediatric tuberculosis incidence and deaths resulting from interruption in programmes supported by international health aid, 2025&ndash;34: a mathematical modelling study.&rdquo; <em>The Lancet Child &amp; Adolescent Health</em>, Sept 12, 2025.</a> &mdash; the 2.5M cases / 340K deaths (bilateral aid only) and 8.9M / 1.5M+ (full withdrawal) figures, plus the 90% reversibility claim.</>,
          <><a href="https://journals.plos.org/globalpublichealth/article?id=10.1371/journal.pgph.0004899">Mandal, Nair, Sahu, Ditiu, Pretorius. &ldquo;A deadly equation: The global toll of US TB funding cuts.&rdquo; <em>PLOS Global Public Health</em>, Sept 2025.</a> &mdash; the 26-country, all-ages, 2025&ndash;2030 scenarios: 0.63M / 1.66M / 10.67M additional cases.</>,
          <><a href="https://hsph.harvard.edu/news/u-s-funding-cuts-could-result-in-nearly-9-million-child-tuberculosis-cases-1-5-million-child-deaths/">Harvard T.H. Chan press summary</a> &mdash; pediatric scenario language, 90% reversibility framing.</>,
          <><a href="https://www.who.int/teams/global-programme-on-tuberculosis-and-lung-health/tb-reports/global-tuberculosis-report-2025/featured-topics/Impact-of-2025-funding-cuts">WHO Global TB Report 2025 &mdash; Impact of 2025 funding cuts</a> &mdash; USG share of donor funding (50%, 2015&ndash;2024); USAID priority-country dependency; Global Fund 11% cut.</>,
          <><a href="https://www.cidrap.umn.edu/tuberculosis/usaid-funding-freeze-disrupts-global-tuberculosis-control-efforts">CIDRAP &mdash; USAID funding freeze disrupts global tuberculosis control efforts</a> &mdash; $406M USAID TB total 2024; 162 awards / 79% terminated; late January 2025 stop-work orders.</>,
          <><a href="https://www.devex.com/news/global-fund-plans-to-cut-1-4-billion-from-grants-it-has-already-awarded-110481">Devex &mdash; Global Fund plans to cut $1.4 billion from grants it has already awarded</a> &mdash; $1.43B / 11% Global Fund cycle cut, with some country grants at 16%.</>,
          <><a href="https://www.who.int/news/item/12-11-2025-global-gains-in-tuberculosis-response-endangered-by-funding-challenges">WHO &mdash; Global gains in tuberculosis response endangered by funding challenges (Nov 12, 2025)</a> &mdash; ongoing service-disruption reports from 30 highest-burden countries.</>,
        ]} />

        <p style={{ marginTop:48, fontStyle:'italic', color:'var(--muted)' }}>&mdash; T.J. M&uuml;ehleman</p>

      </article>
    </Prose>
  </Container>
);

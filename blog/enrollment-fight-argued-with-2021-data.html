// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Fourteen school districts have now voted to close or consolidate <a href="https://www.k12dive.com/news/public-schools-closure-tracker-enrollment/809364/">147 schools</a>. Cleveland is merging or closing 29 of them. Philadelphia 17, Atlanta 16, Pittsburgh and Houston a dozen each.
        </P>

        <P>
          Read what the districts themselves say caused it and you get a different story than the one on cable. Arizona&rsquo;s Kyrene district <a href="https://www.k12dive.com/news/public-schools-closure-tracker-enrollment/809364/">ranks decreasing birthrates first</a>, then real estate costs, then school choice &mdash; &ldquo;to a lesser degree,&rdquo; in the district&rsquo;s own words. San Jose Unified, down 20% and 6,000 students since 2017-18, names birthrates and Bay Area cost of living. Miami-Dade fell 4% in one year, 326,279 students to 313,220, and points at birthrates and fewer newcomer families.
        </P>

        <P>
          Nobody in that paragraph is lying. But the national argument about <em>why</em> enrollment is falling is being conducted with numbers of wildly different vintages, and almost nobody says so out loud.
        </P>

        <H2>The one number that needs no model</H2>

        <P>
          Nationally, the first-grade cohort is <a href="https://bellwether.org/publications/declining-enrollment-in-10-figures/">14% smaller than the ninth-grade cohort</a>. In fall 2024, 45 states had first-grade classes at least 5% smaller than their ninth-grade classes.
        </P>

        <P>
          That is a same-year, same-file, same-definition comparison. No projection. No survey lag. No modeling assumption about migration or behavior. You count first graders and you count ninth graders out of the same collection on the same day, and the gap is just sitting there.
        </P>

        <P>
          Which is why the chart at the top looks the way it does. Between fall 2019 and fall 2024, elementary grades lost about <a href="https://www.future-ed.org/k-12-public-school-enrollment-declines-explained/">940,000 students (4%)</a> and middle grades lost nearly 700,000 (6%) &mdash; while high school enrollment went <em>up</em> 2%, roughly 290,000 students. Kindergarten alone fell 237,000, over 6%. Sixth grade dropped 7%, the steepest of any single grade.
        </P>

        <P>
          The cliff hasn&rsquo;t reached high school. It&rsquo;s still in the building, walking up one grade a year, on a schedule you could read off a birth certificate.
        </P>

        <H2>The vintage problem</H2>

        <P>
          Now go look at the data everyone reaches for to argue the other side.
        </P>

        <Fig caption={<>Sources: Bellwether, &ldquo;How Student Enrollment Declines Are Affecting Education Budgets,&rdquo; July 2026, and its underlying NCES Digest table citations; FutureEd, updated July 2, 2026. &ldquo;Most recent year of available data&rdquo; is as stated by those sources.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Grade-level+public+enrollment%22%2C%22Total+public+enrollment%22%2C%22Charter+enrollment%22%2C%22Federal+projections+%28base+year%29%22%2C%22English+learner+enrollment%22%2C%22Private+school+enrollment%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Most+recent+year+of+available+data%22%2C%22data%22%3A%5B2024%2C2024%2C2022%2C2022%2C2021%2C2021%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%2C%22%23777%22%2C%22%23777%22%2C%22%23bbb%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22text%22%3A%5B%22Most+recent+year+of+available+data%2C+by+series%22%2C%22The+cohort+numbers+are+current.+The+choice+numbers+are+not.%22%5D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A2020%2C%22max%22%3A2025%2C%22stepSize%22%3A1%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Fall+of+year%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart showing the most recent year of available data by series: grade-level public enrollment fall 2024, total public enrollment fall 2024, charter enrollment fall 2022, federal projections base year fall 2022, English learner enrollment fall 2021, private school enrollment fall 2021."
            style={{ width:'100%', height:'auto', display:'block' }}
          />
        </Fig>

        <P>
          Private school enrollment: the most recent NCES figure is <a href="https://bellwether.org/publications/declining-enrollment-in-10-figures/">fall 2021</a>. English learner enrollment: fall 2021. Charter enrollment: fall 2022. And the federal projections everybody quotes &mdash; the ones forecasting 2.7 million fewer students between fall 2022 and fall 2031 &mdash; run off a fall 2022 base. Bellwether adds the part that should make you nervous: actual losses have come in <em>smaller</em> than those projections since they were published.
        </P>

        <Callout label="The join nobody checks">
          The choice-side evidence is three to five years stale. The cohort evidence is current. A board member comparing &ldquo;how many kids left for private school&rdquo; against &ldquo;how many first graders we have&rdquo; is comparing a 2021 number to a 2024 number and calling the difference a trend.
        </Callout>

        <P>
          This isn&rsquo;t a conspiracy. It&rsquo;s a collection calendar. The Common Core of Data lands every year; the private school survey doesn&rsquo;t. But I&rsquo;ve watched this exact failure mode in every data system we&rsquo;ve ever built at Standard Co. Two tables, two refresh cadences, one careless join, and suddenly your dashboard is telling a story about the lag instead of the world.
        </P>

        <H2>What&rsquo;s actually clean here</H2>

        <P>
          Birth rates fell <a href="https://bellwether.org/publications/declining-enrollment-in-10-figures/">15% nationally between 2012 and 2024</a>. Every state and DC fell at least 6%. The fertility rate hit 1.6 in 2024, an all-time low. Those kids are already born, already counted, already enrolled or not. Nothing about that number is a forecast.
        </P>

        <P>
          And here&rsquo;s the mismatch I can&rsquo;t stop staring at: public school enrollment is at a 15-year low while the number of public schools <em>in operation</em> is at a 15-year high. From fall 2013 to fall 2022, enrollment shrank by 426,058 students while total staffing grew by 607,569 &mdash; with district administrative positions up 36%.
        </P>

        <Divider />

        <P>
          Fair warning on the parts that don&rsquo;t fit. LAUSD and others name federal immigration enforcement as a separate driver, and net international migration fell from 2.7 million in 2024 to 1.3 million in 2025. That&rsquo;s real, and it is not a maternity-ward effect. Five of the fourteen closing districts are in Texas, a state people are still moving to.
        </P>

        <P>
          But if you want the one number in this file that isn&rsquo;t a forecast, isn&rsquo;t a five-year-old survey, and doesn&rsquo;t rest on a modeling assumption, it&rsquo;s the gap between first grade and ninth grade.
        </P>

        <P>
          It&rsquo;s already on the roster. Somebody just has to subtract.
        </P>

        <Divider />

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The 2026 U.S. measles count made the news this month.{' '}
          <a href="https://www.cdc.gov/measles/data-research/index.html">1,893 confirmed cases across 40 jurisdictions through May 14</a>, with 93% of them outbreak-associated. The CDC pushes the number every Friday. The worst year since the 1990s.
        </P>

        <P>
          The data that would have told you it was coming has been sitting on a shelf &#8212; published once a year, on a school-year delay.
        </P>

        <P>
          I run a data company. I read this story for the reporting cadence, not the case count.
        </P>

        <H2>The line</H2>

        <P>
          Measles is the most contagious disease modern epidemiology measures. The herd-immunity threshold sits at about 95% two-dose MMR coverage. Below 95%, the chain has a path. Above, it dies.
        </P>

        <P>
          National kindergarten MMR coverage was{' '}
          <a href="https://www.cdc.gov/mmwr/volumes/70/wr/mm7003a2.htm">95.2% in the 2019-20 school year</a>. Then{' '}
          <a href="https://www.cdc.gov/mmwr/volumes/71/wr/mm7116a1.htm">93.9% in 2020-21</a>. Then{' '}
          <a href="https://www.cdc.gov/mmwr/volumes/72/wr/mm7202a2.htm">93.0% in 2021-22</a>. Around{' '}
          <a href="https://www.cdc.gov/mmwr/volumes/72/wr/mm7245a2.htm">93% in 2022-23</a>. Then{' '}
          <a href="https://www.cdc.gov/mmwr/volumes/73/wr/mm7341a3.htm">92.7% in 2023-24</a>. And{' '}
          <a href="https://www.kff.org/medicaid/kindergarten-routine-vaccination-rates-continue-to-decline/">92.5% for the 2024-25 cohort</a>. Every one of those numbers is below the line. The leading indicator broke five school years ago.
        </P>

        <P>
          For five years the case count stayed quiet. A few hundred a year. Then the{' '}
          <a href="https://www.healthbeat.org/2026/04/27/south-carolina-measles-outbreak-end/">South Carolina outbreak ran 997 cases</a> before closing in April. Utah is{' '}
          <a href="https://www.aha.org/news/headline/2026-05-08-utah-measles-outbreak-climbs-638-cases">638 and climbing</a> as of May 5. Both chains started in 2025. Both started under the line. Neither was surprising in retrospect.
        </P>

        <H2>The national number is the wrong unit anyway</H2>

        <P>
          Even 92.5% misses what&#8217;s happening. Herd immunity is local. The chain doesn&#8217;t average across state lines.
        </P>

        <P>
          Idaho&#8217;s 2024-25 MMR rate is{' '}
          <a href="https://www.kff.org/medicaid/kindergarten-routine-vaccination-rates-continue-to-decline/">78.5%</a>. Connecticut&#8217;s is{' '}
          <a href="https://www.kff.org/medicaid/kindergarten-routine-vaccination-rates-continue-to-decline/">98.2%</a>.{' '}
          <a href="https://www.kff.org/medicaid/kindergarten-routine-vaccination-rates-continue-to-decline/">Thirty-nine states</a> sit below the 95% line. A national average of 92.5% suggests the U.S. is two points under. The truth is most states are under and a handful are dragging the mean up.
        </P>

        <Fig caption={<>Source: <a href="https://www.kff.org/medicaid/kindergarten-routine-vaccination-rates-continue-to-decline/">KFF analysis of CDC SchoolVaxView 2024-25 data</a>. U.S. average is the national kindergarten MMR coverage figure for 2024-25.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Idaho+%28lowest%29%22%2C%22U.S.+national+average%22%2C%22Connecticut+%28highest%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22MMR+coverage+%28%25%29%22%2C%22data%22%3A%5B78.5%2C92.5%2C98.2%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%233a3a3a%22%5D%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%2295%25+herd-immunity+floor%22%2C%22type%22%3A%22line%22%2C%22data%22%3A%5B95%2C95%2C95%5D%2C%22borderColor%22%3A%22%23777%22%2C%22borderWidth%22%3A2%2C%22borderDash%22%3A%5B6%2C6%5D%2C%22fill%22%3Afalse%2C%22pointRadius%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22MMR+coverage+range%2C+2024-25+kindergarten+cohort%22%2C%22fontSize%22%3A16%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Atrue%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A70%2C%22max%22%3A100%2C%22stepSize%22%3A5%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Coverage+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart comparing 2024-25 kindergarten MMR coverage: Idaho 78.5%, U.S. national average 92.5%, Connecticut 98.2%, with a dashed line at the 95% herd-immunity floor."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>The reporting calendar is the actual problem</H2>

        <P>
          Here&#8217;s what makes this a data-pipeline story instead of a vaccine story: SchoolVaxView, the federal kindergarten MMR dataset, publishes the <em>previous</em> school year&#8217;s coverage every August. The{' '}
          <a href="https://www.cidrap.umn.edu/childhood-vaccines/us-childhood-vaccination-rates-continue-fall-cdc-data-show">2024-25 number landed last August</a>. The 2025-26 cohort just finished their school year. We won&#8217;t see their MMR number until summer 2026 at the earliest.
        </P>

        <P>
          The kindergartners enrolling this fall &#8212; the 2026-27 cohort &#8212; won&#8217;t appear in the federal data until August 2027.
        </P>

        <P>
          So the{' '}
          <a href="https://publichealth.jhu.edu/2026/why-review-of-the-uss-measles-elimination-status-has-been-delayed">PAHO commission that decides in November</a> whether the U.S. loses its elimination status will be looking at kindergarten MMR coverage from kids who were five years old in 2024.
        </P>

        <P>
          A real-time version of this data already exists. Pharmacies record doses in state Immunization Information Systems. Districts have first-day immunization records. Several states publish near-real-time IIS extracts. The pipeline exists. The choice to publish on a weekly cadence does not.
        </P>

        <P>
          The case count goes out Friday afternoons. The chain still moves on its own schedule.
        </P>

        <Callout label="The data-pipeline read">
          The leading indicator runs on a school-year clock. The lagging one runs weekly. The chain has been living in the gap.
        </Callout>

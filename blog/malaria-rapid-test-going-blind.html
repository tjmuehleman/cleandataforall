const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In December, the WHO&rsquo;s World Malaria Report 2025 put 2024 at <a href="https://www.who.int/news/item/04-12-2025-new-tools-saved-a-million-lives-from-malaria-last-year-but-progress-under-threat-as-drug-resistance-rises">282 million cases and 610,000 deaths &mdash; about 9 million more cases than the year before</a>. The coverage led with drugs: <a href="https://www.who.int/news/item/04-12-2025-new-tools-saved-a-million-lives-from-malaria-last-year-but-progress-under-threat-as-drug-resistance-rises">partial resistance to artemisinin is now confirmed or suspected in at least 8 African countries</a>. That&rsquo;s the scary headline, and it&rsquo;s real.
        </P>

        <P>
          But I run a data company. So the line that stopped me wasn&rsquo;t about the drug. It was about the test.
        </P>

        <H2>The parasite figured out the instrument</H2>

        <P>
          Most malaria gets diagnosed in the field with a rapid diagnostic test &mdash; a little cassette that looks for a protein called HRP2 that <em>Plasmodium falciparum</em> makes. No protein, no line, no case. And in parts of the malaria belt, the parasite has stopped making it. Strains carrying pfhrp2/pfhrp3 deletions don&rsquo;t produce the protein the test is built to find, so they read negative while the patient is, in fact, positive.
        </P>

        <P>
          How common is that? A 2025 meta-analysis pooled the deletion prevalence in <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12552085/">Ethiopia at 35.6%, with country-level estimates across endemic Africa ranging from 0.4% in Angola to 62% in Eritrea</a>. A field study in <a href="https://www.mdpi.com/2075-4418/14/3/262">Djibouti found 86.5% of falciparum strains missing both genes</a>. In Eritrea, more than half of falciparum infections read negative on the test we trust to read positive.
        </P>

        <H2>A measurement problem wearing a biology costume</H2>

        <P>
          That 9-million-case jump is partly biology &mdash; more transmission, fewer bed nets, thinner budgets. But part of it is the instrument. When your detector starts returning false negatives, the count doesn&rsquo;t fall. It goes weird. Cases get missed in the field, then partly recovered when someone runs a better test, and the gap between &ldquo;confirmed&rdquo; and &ldquo;actual&rdquo; stops being noise and starts being a direction.
        </P>

        <Fig caption={<>In a place like Eritrea, where 62% of P. falciparum carries the deletion, a standard HRP2 rapid test reads negative on most infections. The 38% detected is 100% minus the 62% deletion share. Source: <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12552085/">PMC meta-analysis, 2025</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Detected+by+HRP2+test%22%2C%22False-negative+%28gene-deleted%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B38%2C62%5D%2C%22backgroundColor%22%3A%5B%22%23bbbbbb%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22text%22%3A%5B%22In+Eritrea%2C+the+standard+rapid+test+misses+most+of+it%22%2C%22P.+falciparum+infections+by+HRP2+rapid-test+result+%28%25%29%22%5D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22min%22%3A0%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+infections%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart for Eritrea showing that of P. falciparum infections, about 38 percent are detected by an HRP2 rapid test and about 62 percent return a false negative because of gene deletions" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          WHO has a rule for this now. As of <a href="https://www.who.int/news/item/24-04-2026-who-prequalifies-first-ever-malaria-treatment-for-newborns-and-infants-adds-new-diagnostic-tests">April 2026 it prequalified new rapid tests that target a different protein (pf-LDH) the parasite can&rsquo;t easily shed, and it recommends countries switch when more than 5% of cases are missed to pfhrp2 deletions</a>. Five percent. Eritrea, Ethiopia, and Djibouti are all multiples past that line. Djibouti actually <a href="https://www.mdpi.com/2075-4418/14/3/262">switched to an LDH-based test back in 2021</a>, after local deletions made the old one useless. Most others haven&rsquo;t.
        </P>

        <H2>The part that makes me wince</H2>

        <P>
          Switching tests costs money, and the money is moving the other way. Global malaria funding in 2024 was <a href="https://news.un.org/en/story/2025/12/1166508">$3.9 billion &mdash; 42% of the $9.3 billion target &mdash; and overseas development aid fell about 21%</a>. So the countries with the blindest tests are, on average, the ones with the least cash to buy seeing ones. The instrument breaks exactly where there&rsquo;s no budget to replace it.
        </P>

        <P>
          Here&rsquo;s the thing about a number like 282 million. We read it as a measurement. It&rsquo;s closer to an estimate built on a test that, in a growing list of places, is looking right past the thing it&rsquo;s supposed to count.
        </P>

        <P>
          The parasite is beating the drugs and the bed nets. It&rsquo;s also beating the instrument we use to know any of that &mdash; which means the scariest figure in the report might be the one we can&rsquo;t quite see.
        </P>

        <Divider />

        <P><strong>Sources</strong></P>

        <UL items={[
          <><a href="https://www.who.int/news/item/04-12-2025-new-tools-saved-a-million-lives-from-malaria-last-year-but-progress-under-threat-as-drug-resistance-rises">WHO &mdash; World Malaria Report 2025 announcement (cases, deaths, drug resistance)</a></>,
          <><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12552085/">PMC &mdash; pfhrp2/3 gene deletions in Ethiopia: systematic review and meta-analysis (2025)</a></>,
          <><a href="https://www.mdpi.com/2075-4418/14/3/262">MDPI Diagnostics &mdash; LDH-based RDT performance in Djibouti, 2022–2023 (incl. 2021 switch)</a></>,
          <><a href="https://www.who.int/news/item/24-04-2026-who-prequalifies-first-ever-malaria-treatment-for-newborns-and-infants-adds-new-diagnostic-tests">WHO &mdash; Prequalifies new malaria diagnostic tests; 5% switch threshold (April 2026)</a></>,
          <><a href="https://news.un.org/en/story/2025/12/1166508">UN News &mdash; Drug resistance and underfunding threaten malaria progress (funding figures)</a></>,
        ]} />

      </article>
    </Prose>
  </Container>
);

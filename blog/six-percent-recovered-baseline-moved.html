      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Six percent. That is the share of American grade 3&ndash;8 students who, as of spring 2024, sat in a school district that had clawed its scores back above 2019 levels in <em>both</em> <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">math and reading</a>.
        </P>

        <P>
          I run a data company, so the number I keep staring at isn&rsquo;t the six. It&rsquo;s that a year later the same research shop quietly stopped measuring it.
        </P>

        <P>
          The six comes from the 2025 Education Recovery Scorecard &mdash; the Harvard&ndash;Stanford&ndash;Dartmouth project that stitched the NAEP together with state tests for <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">roughly 35 million grade 3&ndash;8 students across 8,719 districts in 43 states</a>. Recovering in one subject was hard enough: <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">17 percent of kids were in districts back above 2019 in math, 11 percent in reading</a>. Recovering in both was a much smaller room. Six percent. And <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">no state pulled it off</a> &mdash; not one scored above its own 2019 NAEP level in both subjects. The districts that did are scattered inside states that, on the official scoreboard, look like they went nowhere.
        </P>

        <H2>The gap inside the six percent</H2>

        <P>
          The six percent wasn&rsquo;t handed out evenly. <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">Districts in the highest income decile were nearly four times likelier to be back above 2019 in both subjects than districts in the lowest: 14.1 percent versus 3.9 percent.</a>
        </P>

        <Fig caption={<>Source: <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">CEPR &mdash; Education Recovery Scorecard (Feb 11, 2025)</a>. Highest vs. lowest income-decile districts that recovered above 2019 in both math and reading; 14.1% vs 3.9% is the report&rsquo;s &ldquo;nearly four times&rdquo; gap.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Lowest-income+decile+districts%22%2C%22Highest-income+decile+districts%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Districts+recovered+in+both+math+and+reading+%28%25%29%22%2C%22data%22%3A%5B3.9%2C14.1%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Share+of+districts+back+above+2019+in+BOTH+subjects%2C+by+income+decile%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%2C%22min%22%3A0%2C%22max%22%3A16%2C%22stepSize%22%3A4%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Districts+recovered+in+both+subjects+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=440&bkg=transparent&devicePixelRatio=2" alt="Bar chart: lowest-income decile districts recovered in both subjects at 3.9%, highest-income decile at 14.1% — nearly four to one." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          That&rsquo;s the part that vanishes when you read recovery as a single national average. The average is a blanket. Under it, the richest districts came back at almost four times the rate of the poorest.
        </P>

        <BQ cite="Tom Kane, Harvard CEPR, February 2025">
          The rescue phase is over. The federal relief dollars are gone.
        </BQ>

        <H2>Then the floor moved</H2>

        <P>
          A year later, the same shop published the <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">2026 Education Scorecard</a>. Same universities. Different ruler. It dropped the NAEP, ran on Stanford&rsquo;s data archive alone, and measured change <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">from 2022 to 2025 instead of from 2019</a>.
        </P>

        <P>
          Against that baseline the story turns hopeful. The recovery is now <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">&ldquo;U-shaped&rdquo;</a> &mdash; the highest- and lowest-income districts gaining most, the middle left behind. And the headline isn&rsquo;t &ldquo;back to 2019&rdquo; anymore. It&rsquo;s <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">108 &ldquo;Districts on the Rise&rdquo;</a>, defined as districts improving faster than their statistically matched peers.
        </P>

        <P>
          Notice what survived and what didn&rsquo;t. &ldquo;Over 100 districts&rdquo; carried from one report to the next, almost word for word. The definition under it did not. In 2025 it meant <em>back above their own 2019 scores in both subjects</em>. In 2026 it meant <em>improving faster than similar neighbors since the pandemic trough</em>. Same phrase, different denominator, different year called zero.
        </P>

        <Callout label="The two baselines">
          Measured against 2019: 6% of grade 3&ndash;8 kids in fully recovered districts, and the richest districts recovered at nearly 4&times; the rate of the poorest (14.1% vs 3.9%). Measured against the 2022 trough: the same scores read as a U-shaped recovery. Sources: <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">CEPR 2025</a>; <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Harvard GSE 2026</a>.
        </Callout>

        <P>
          None of this is a knock on the researchers. 2022 is a defensible floor &mdash; it&rsquo;s roughly when scores bottomed out, and both reports say so plainly. But it&rsquo;s a reminder that &ldquo;recovery&rdquo; isn&rsquo;t a thing you read off a dashboard. It&rsquo;s a subtraction problem. And somebody picks the year you subtract from.
        </P>

        <Divider />

        <P>
          Pick 2019 and almost nobody recovered. Pick 2022 and almost everybody is. The kids didn&rsquo;t change. The zero did.
        </P>

        <P><em>&mdash; TJ</em></P>

        <H2>Sources</H2>
        <UL items={[
          <><a href="https://cepr.harvard.edu/news/education-recovery-scorecard">CEPR &mdash; Education Recovery Scorecard, third report (Feb 11, 2025)</a>: 8,719 districts across 43 states; 17% math / 11% reading / 6% both above 2019; no state above 2019 in both on NAEP; highest vs. lowest income decile 14.1% vs 3.9%; Kane quote.</>,
          <><a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Harvard GSE &mdash; New Education Scorecard Finds &ldquo;U-Shaped Recovery&rdquo; (May 13, 2026)</a>: SEDA-based 2022&ndash;2025 window; U-shaped recovery; 108 &ldquo;Districts on the Rise&rdquo; defined relative to matched peers.</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

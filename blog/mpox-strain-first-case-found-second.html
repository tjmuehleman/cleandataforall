// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          A man in India got sick on <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON595">September 1, 2025</a>. PCR confirmed mpox on September 11. A clade-differentiation test on September 15 called it clade II, filed it, and moved on. Case closed. Except the test wasn&rsquo;t wrong because the lab botched it. It was wrong because the right answer didn&rsquo;t exist yet.
        </P>

        <P>
          On <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON595">December 16, 2025</a>, the global reference database that labs sequence against got an update. It now had a brand-new category in it: a recombinant mpox strain, clade Ib spliced together with clade IIb, first reported days earlier out of the UK. Somebody re-ran the old India sample against the new reference. It flipped. That &ldquo;clade II&rdquo; case from September turned out to be the <em>earliest known</em> case of the recombinant strain anywhere on Earth. It just took a database update to say so.
        </P>

        <P>
          So the world&rsquo;s first case of this thing was, technically, the second one found. Sit with that for a second, because it&rsquo;s the whole story.
        </P>

        <H2>The quiet that wasn&rsquo;t</H2>

        <P>
          Here&rsquo;s what the reclassification quietly tells you: mpox never stopped. We stopped watching. WHO declared its second mpox emergency in August 2024, the feeds moved on by early 2025, and the virus just kept going. WHO&rsquo;s own count for January through September 2025: <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--59---30-october-2025">44,299 confirmed cases and 180 deaths across 93 countries</a>. That is not a dormant disease. That&rsquo;s a five-figure outbreak that got a rounding error&rsquo;s worth of coverage.
        </P>

        <P>
          One tell about how much attention those numbers were getting: the header on that WHO figure reads &ldquo;1 Jan &ndash; 31 Sep 2025.&rdquo; September has thirty days. When the people counting the outbreak can&rsquo;t get the date field right, you&rsquo;re not looking at a spotlight. You&rsquo;re looking at a spreadsheet nobody&rsquo;s double-checking.
        </P>

        <H2>Six countries, one definition</H2>

        <P>
          Late in 2025 the headlines finally came back, and they were about the wrong continent. &ldquo;Clade Ib is spreading in the US and Europe.&rdquo; What actually happened is more boring and more interesting than that: six countries &mdash; the United States, Italy, Spain, the Netherlands, Portugal, and Malaysia &mdash; <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--59---30-october-2025">crossed a definition</a>. WHO flips a country to &ldquo;community transmission&rdquo; the moment a single case in the prior six weeks has no travel link. One case. That&rsquo;s not an explosion, it&rsquo;s a threshold. The virus didn&rsquo;t announce itself. A rule did.
        </P>

        <P>
          And the map those headlines drew was upside down. In September 2025, <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--59---30-october-2025">84% of the world&rsquo;s confirmed mpox &mdash; 2,622 of 3,135 cases &mdash; was in the African Region</a>. The story went to the other sixteen percent, because that&rsquo;s where the cameras point.
        </P>

        <Fig caption={<>Confirmed mpox cases, September 2025: African Region 2,622 vs. everywhere else 513. The 513 is the residual &mdash; 3,135 total minus the 2,622 in Africa. Source: <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-mpox--external-situation-report--59---30-october-2025" style={{ color:'inherit' }}>WHO Mpox External Situation Report no. 59</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22African+Region%22%2C%22Everywhere+else%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Confirmed+mpox+cases%2C+September+2025%22%2C%22data%22%3A%5B2622%2C513%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23bbb%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Where+the+world%27s+mpox+actually+was%2C+September+2025+%2884%25+vs+16%25%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Confirmed+cases%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of confirmed mpox cases in September 2025. African Region 2,622 cases. Everywhere else 513 cases. Africa is 84 percent of the total."
            style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <H2>The virus is never the news</H2>

        <P>
          Every one of these &ldquo;events&rdquo; is a data-system event wearing a virus costume. The India case broke in January not because the man got sicker but because a reference database updated in December. The six countries &ldquo;started&rdquo; community transmission the week a paper definition said they had. The whole outbreak looked quiet because global surveillance reports monthly, and a monthly clock makes a continuous thing look like it blinks.
        </P>

        <Callout label="Key figure">
          One recombinant mpox case. Symptom onset September 1, 2025. A name for what it was on December 16, 2025. A WHO notification on January 13, 2026. A public bulletin on February 14, 2026. That&rsquo;s 166 days from sick to said-out-loud &mdash; and it&rsquo;s still one of only two known cases on the planet.
        </Callout>

        <P>
          None of this means mpox is safe, or that the recombinant is nothing. It means the thing we call &ldquo;news&rdquo; here is mostly the lag between when a virus does something and when our instruments can name it. And those instruments &mdash; a monthly report, a six-week rule, a reference database &mdash; are the part we actually control.
        </P>

        <Divider />

        <P>
          The recombinant strain isn&rsquo;t frightening because it&rsquo;s new. It&rsquo;s frightening because it was already here in September, filed under the wrong clade, and nothing about the virus changed between then and February. Only the database did. We didn&rsquo;t catch a new strain. We caught up to an old one. Five months late.
        </P>

      </article>
    </Prose>
  </Container>
);

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H3 = ({ children }) => <h3>{children}</h3>;

const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Ask three people how big the national school phone ban study is and you’ll get three numbers. The brief on my desk said more than 40,000 schools. <a href="https://news.stanford.edu/stories/2026/05/national-study-school-cellphone-bans-benefits-research" target="_blank" rel="noopener">Stanford’s write-up</a> says more than 43,000 middle and high schools. The <a href="https://www.nber.org/system/files/working_papers/w35132/w35132.pdf" target="_blank" rel="noopener">paper itself</a> has a GPS dataset covering 40,542 schools, and a test-score table with 42,919 schools that never bought a phone pouch and 1,778 that did. (42,919 + 1,778 = 44,697, if you’re keeping score.)
        </P>

        <P>
          None of those are wrong. They’re answers to different questions. Which is sort of the whole post.
        </P>

        <H2>The headline, quickly</H2>

        <P>
          The paper is <a href="https://www.nber.org/papers/w35132" target="_blank" rel="noopener">NBER working paper 35132</a>, revised in September. Not peer-reviewed yet, but pre-registered, which I <a href="phone-ban-study-checked-its-homework.html">wrote about in August</a>. The finding everybody quotes: average effects on test scores are “consistently close to zero.” The authors can <a href="https://www.nber.org/system/files/working_papers/w35132/w35132.pdf" target="_blank" rel="noopener">rule out improvements larger than about 0.007 student-level standard deviations</a>.
        </P>

        <P>
          Meanwhile the laws kept coming. <a href="https://ballotpedia.org/State_policies_on_cellphone_use_in_K-12_public_schools" target="_blank" rel="noopener">Ballotpedia counts 37 states</a> that ban or limit phones in classrooms as of October 29, and 46 with some kind of law or policy on the books. That’s not two-thirds of states anymore. It’s 37 of 50.
        </P>

        <Fig caption={<>Source: <a href="https://ballotpedia.org/State_policies_on_cellphone_use_in_K-12_public_schools" target="_blank" rel="noopener">Ballotpedia</a>, as of Oct. 29, 2026. “No law or policy” is derived: 50 − 46 = 4.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Ban+or+limit+%2837%29%22%2C%22Require+a+district+policy+%285%29%22%2C%22Encourage+limits+%284%29%22%2C%22No+law+or+policy+%284%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B37%2C5%2C4%2C4%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23777%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22State+school+cellphone+policies%2C+as+of+Oct.+29%2C+2026%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22x%22%7D%5D%2C%22yAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A40%2C%22stepSize%22%3A10%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Number+of+states%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22y%22%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of state school cellphone policies as of October 29, 2026: 37 states ban or limit, 5 require a district policy, 4 encourage limits, 4 have no law or policy." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>Every outcome brought its own map</H2>

        <P>
          Here’s the part a data guy can’t unsee. The study isn’t one dataset. It’s a stack of them, joined at the school ID, and each one covers a different slice of the country. All figures from <a href="https://www.nber.org/system/files/working_papers/w35132/w35132.pdf" target="_blank" rel="noopener">the paper’s data section</a>:
        </P>

        <UL items={[
          <><strong>Phone use:</strong> a teacher survey with nearly 108,000 responses from all 50 states, plus GPS pings for those 40,542 schools.</>,
          <><strong>Well-being, attention, bullying:</strong> student surveys from Panorama Education. 16,285 schools across 46 states. Sounds big. It’s 6.9% of school-years in the federal school panel.</>,
          <><strong>Chronic absenteeism:</strong> 38 states. Attendance rates: 31.</>,
          <><strong>High school test scores:</strong> 26 states, covering 64% of high school students.</>,
          <><strong>Discipline:</strong> 22 states.</>,
        ]} />

        <P>
          That’s the chart up top. So “the bans didn’t move test scores” and “suspensions rose about 15% in year one” aren’t statements about the same set of schools. The discipline finding lives in 22 states. The well-being finding lives in whichever districts happened to buy a survey product. And the <a href="https://www.nber.org/system/files/working_papers/w35132/w35132.pdf" target="_blank" rel="noopener">drop in in-class phone use from 61% to 13%</a> (the number in my brief) is teachers remembering what things were like before the policy changed. The authors call those comparisons descriptive and retrospective. They’re upfront about it. The headlines, less so.
        </P>

        <H2>The line that got me</H2>

        <P>
          Buried in the data section: there is no central repository of high school test scores. So six economists built one by hand, pulling public files from state education departments where they existed and asking the state for them where they didn’t. They got 26 states.
        </P>

        <P>
          Middle school has a compiled source. High school, in 2026, nope. Some states use end-of-course exams, some use end-of-grade exams, some use the ACT or SAT.
        </P>

        <P>
          And the clock is short. The main analysis uses schools that adopted pouches in 2023, 2024, or 2025, so <a href="https://www.nber.org/system/files/working_papers/w35132/w35132.pdf" target="_blank" rel="noopener">nobody is observed more than three years out</a>.
        </P>

        <Divider />

        <P>
          37 states wrote a law. The best evidence we have covers 1,778 schools that bought one brand of pouch, measured with whatever each state happened to publish. I don’t think that’s a knock on the study. It’s the most careful thing anyone has done on this. It’s a knock on the plumbing. We passed the laws in 37 statehouses and left the measurement to six researchers and whatever the states would send them.
        </P>

        <H3>Sources</H3>

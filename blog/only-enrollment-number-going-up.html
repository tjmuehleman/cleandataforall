const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          American public schools enrolled <a href={S_DIG} target="_blank" rel="noopener">49,387,403</a> kids last fall. Down 0.3% from the year before. Down 2.8% from 2019.
        </P>

        <P>
          Every version of that story ends with a closed building. Then Bellwether published a piece in July with a number pointing the other direction: one geographic category of American school <a href={S_BW} target="_blank" rel="noopener">gained 380,000 students</a> over the last decade, up 6%, while city schools lost 950,000, suburbs lost 370,000, distant schools lost 320,000, and remote lost 170,000.
        </P>

        <P>
          The category is called &ldquo;fringe.&rdquo; I went looking for it in the source data. It isn&rsquo;t there.
        </P>

        <H2>Fringe is a decision, not a field</H2>

        <P>
          NCES tags every school with a locale code. There are <a href={S_LOC} target="_blank" rel="noopener">twelve of them</a>: City large / midsize / small, Suburban large / midsize / small, Town fringe / distant / remote, Rural fringe / distant / remote. Twelve buckets. Not five.
        </P>

        <P>
          The five buckets in the analysis &mdash; city, suburb, fringe, distant, remote &mdash; are a regrouping the authors did themselves, and to their credit they say so in the footnote under Figure 1. &ldquo;Fringe&rdquo; is Town-Fringe plus Rural-Fringe, glued together because both of them mean &ldquo;close to a city, not in one.&rdquo;
        </P>

        <P>
          That&rsquo;s a defensible call. It&rsquo;s also the entire finding. Roll the same twelve codes up the standard way &mdash; city, suburban, town, rural &mdash; and the 380,000 dissolves into two separate rows and nobody writes the piece.
        </P>

        <H2>The category is a buffer in a GIS file</H2>

        <P>
          Here&rsquo;s what makes fringe a strange thing to hang a decade-long trend on. It isn&rsquo;t a description of a place. It&rsquo;s a distance measurement:
        </P>

        <UL items={[
          <>Rural-Fringe (41): rural territory <strong>5 miles or less</strong> from an urban area of 50,000+, or 2.5 miles or less from a smaller one</>,
          <>Town-Fringe (31): territory inside an urban area under 50,000 that sits <strong>10 miles or less</strong> from an urban area of 50,000+</>
        ]} />

        <P>
          Five miles. Ten miles. Somebody drew a buffer, and every school that fell inside it became a fringe school. The exurban donut everybody wants to map is, in the most literal way, a donut somebody drew.
        </P>

        <H2>And then the ruler got swapped</H2>

        <P>
          This is the part that actually bugs me. Locale codes get reassigned. The <a href={S_EDGE} target="_blank" rel="noopener">2020 and 2021 vintages</a> ran on the 2010 Census urban criteria. The 2023, 2024 and 2025 vintages run on the 2020 criteria. There is no 2022 vintage at all &mdash; NCES says the Census inputs weren&rsquo;t available.
        </P>

        <P>
          And the 2020 criteria weren&rsquo;t a tune-up. The Census Bureau <a href={S_FR} target="_blank" rel="noopener">retired &ldquo;urbanized area&rdquo; and &ldquo;urban cluster&rdquo;</a> as entity types and replaced both with a single urban area defined as at least 2,000 housing units or 5,000 people. The <a href={S_LEG} target="_blank" rel="noopener">old Rural-Fringe definition</a> read &ldquo;5 miles from an Urbanized Area.&rdquo; The <a href={S_LOC} target="_blank" rel="noopener">new one</a> reads &ldquo;5 miles from an urban area with population of 50,000 or more.&rdquo; Same code number. Same five miles. Different underlying geography.
        </P>

        <Callout label="What that means">
          A school can move from Rural-Distant to Rural-Fringe without one family moving in. The building didn&rsquo;t move. The line did.
        </Callout>

        <P>
          I don&rsquo;t know how much of the 380,000 that accounts for. Neither does anybody else, as far as I can tell, because the published analysis doesn&rsquo;t name which locale vintage it pulled. And the <a href={S_ELSI} target="_blank" rel="noopener">ElSi table generator</a> will hand you a ten-year enrollment series filtered by locale without ever mentioning that the filter means something different at the two ends of the series.
        </P>

        <H2>The percentage is doing work too</H2>

        <Fig caption={<>Percent change in US public school enrollment, 2015&ndash;2024, by the same five groups. Figures from <a href={S_BW} target="_blank" rel="noopener" style={{ color:'inherit' }}>Bellwether</a>, which reports fringe +6% (380,000), suburb &minus;2% (370,000), distant &minus;5% (320,000), city &minus;6% (950,000), remote &minus;6% (170,000).</>}>
          <img src={CHART_PCT} alt="Horizontal bar chart of percent change in US public school enrollment 2015 to 2024. Fringe plus 6 percent. Suburb minus 2 percent. Distant minus 5 percent. City minus 6 percent. Remote minus 6 percent." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          City fell 6%. Remote fell 6%. Fringe rose 6%. Three identical numbers describing 950,000 kids, 170,000 kids, and 380,000 kids. That&rsquo;s how a bucket holding <a href={S_BW} target="_blank" rel="noopener">6.4 million students</a> &mdash; roughly 13% of American public school kids &mdash; ends up on the same axis as one holding tens of millions, looking like an equal and opposite force.
        </P>

        <Divider />

        <P>
          None of this makes the finding wrong. Medina Valley ISD outside San Antonio grew 115%, five thousand students, and you don&rsquo;t need a locale code to see that &mdash; you need a bond election. Fringe enrollment across the San Antonio&ndash;New Braunfels metro rose 40% from 2015 to 2024 while the city&rsquo;s fell 7%. Those districts are absorbing real children into buildings that don&rsquo;t exist yet.
        </P>

        <P>
          But the headline says a category grew. And the category is two codes out of twelve, rolled up by hand, drawn as a five-mile buffer, measured with a ruler that got replaced somewhere in the middle of the trend line.
        </P>

        <P>
          The kids moved. So did the lines.
        </P>

      </article>
    </Prose>
  </Container>
);

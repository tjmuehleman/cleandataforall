// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;

const WHO = "https://www.who.int/news/item/15-07-2025-global-childhood-vaccination-coverage-holds-steady-yet-over-14-million-infants-remain-unvaccinated-who-unicef";

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here&rsquo;s a stat built for a chyron. A quarter of the world&rsquo;s infants live in
          just <a href={WHO}>26 countries</a> marked by fragility, conflict, or humanitarian crisis
          &mdash; and those same 26 countries hold <a href={WHO}>half of every unvaccinated child on Earth</a>.
          One in four babies; one in two who miss the shot. It&rsquo;s the cleanest equity number
          global health put out this year.
        </P>

        <P>
          I run a data company, so the first thing I did was ask where the number comes from. It comes
          from <a href="https://immunizationdata.who.int/">WUENIC</a> &mdash; the WHO and UNICEF estimates
          of national immunization coverage, the biggest immunization dataset there is. Read the middle
          word again. <em>Estimates.</em> Coverage doesn&rsquo;t get counted the way you count votes or invoices;
          it gets modeled &mdash; clinic tallies reconciled against household surveys and smoothed into one
          number per country. For 2024, <a href={WHO}>189 countries reported</a>.
        </P>

        <P>
          Now stack two facts. The unvaccinated kids cluster in fragile, conflict-hit places. And fragile,
          conflict-hit places are exactly where the clinics stop reporting, the surveys stop happening, and
          the denominator &mdash; how many babies are even out there &mdash; turns into a guess. The gap gets
          measured worst precisely where it&rsquo;s widest.
        </P>

        <H2>The trend is the tell</H2>

        <P>
          WHO put a line on it, and the line is the story. In half of those 26 countries, the number of
          unvaccinated children didn&rsquo;t hold steady. It went from <a href={WHO}>3.6 million in 2019 to
          5.4 million in 2024</a>. That&rsquo;s a 50% jump in five years &mdash; 5.4 &divide; 3.6 = 1.5, do the
          arithmetic yourself.
        </P>

        <figure style={{ margin:'2.5em auto', maxWidth:900, textAlign:'center' }}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222019%22%2C%222024%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B3.6%2C5.4%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.5%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Unvaccinated+children%2C+13+of+the+26+fragile+countries%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%2C%22fontStyle%22%3A%22bold%22%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23F4EFE6%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22start%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A16%7D%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A6%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22children%2C+millions%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=440&bkg=transparent&devicePixelRatio=2" alt="Bar chart of unvaccinated children in 13 of the 26 fragile countries, rising from 3.6 million in 2019 to 5.4 million in 2024." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
          <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
            Unvaccinated children in the 13 of the 26 fragile countries where the count rose, 2019 vs. 2024. 3.6M &rarr; 5.4M, a 50% increase (5.4 &divide; 3.6 = 1.5). Source: <a href="https://www.who.int/news/item/15-07-2025-global-childhood-vaccination-coverage-holds-steady-yet-over-14-million-infants-remain-unvaccinated-who-unicef">WHO / UNICEF, 15 July 2025</a>.
          </figcaption>
        </figure>

        <P>
          The tidy post-COVID story was that coverage cratered in 2020 and clawed most of the way back.
          Globally, sort of true: <a href={WHO}>89% of infants</a> got at least one DTP dose in 2024, and
          85% got all three. But &ldquo;mostly recovered&rdquo; is a global average, and global averages are where
          inconvenient places go to hide. In the 13 countries where it matters most, coverage didn&rsquo;t
          recover. It got worse. By half.
        </P>

        <H2>The rich-country hedge</H2>

        <P>
          Then there&rsquo;s the sentence I keep rereading. WHO wrote that <a href={WHO}>&ldquo;signs of slippage are
          emerging&rdquo;</a> in upper-middle and high-income countries that used to sit comfortably above 90%
          coverage. Signs of slippage. Not &ldquo;coverage fell to X%.&rdquo; Not a country list. A hedge. When an
          agency that publishes to the decimal reaches for a phrase that soft, it usually means the data is
          early, the numbers are radioactive, or both. <a href={WHO}>Twenty-two countries</a> that cleared
          the 90% bar in 2019 have since dropped back under it. They just didn&rsquo;t say which ones.
        </P>

        <H2>Two kinds of missing</H2>

        <P>
          So there are two gaps here, and they&rsquo;re opposite shapes. The poor-country gap, where kids go
          unvaccinated and the machinery to see them is thin. And the rich-country gap, where the machinery
          is fine and the agency is hedging anyway. The first is a measurement problem wearing an outcome&rsquo;s
          clothes. The second is an outcome wearing a measurement problem&rsquo;s.
        </P>

        <Divider />

        <P>
          A quarter of the babies, half the gap. It&rsquo;s a good number. It&rsquo;s also a floor, not a ceiling
          &mdash; because in the places doing the most damage, we&rsquo;re not counting, we&rsquo;re estimating. The
          real chart is worse than the one we can draw. It usually is.
        </P>

        <H2>Sources</H2>
        <UL items={[
          <span>WHO / UNICEF. <a href="https://www.who.int/news/item/15-07-2025-global-childhood-vaccination-coverage-holds-steady-yet-over-14-million-infants-remain-unvaccinated-who-unicef">Global childhood vaccination coverage holds steady, yet over 14 million infants remain unvaccinated</a>, 15 July 2025 (a quarter of infants in 26 fragile/conflict countries hold half of all unvaccinated children; 3.6M&rarr;5.4M in half those countries, 2019&ndash;2024; 89% one-dose / 85% three-dose DTP coverage in 2024; &ldquo;signs of slippage&rdquo; in upper-middle and high-income countries; 22 countries above 90% in 2019 have since declined; 189 countries reported for 2024).</span>,
          <span>WHO / UNICEF. <a href="https://immunizationdata.who.int/">WHO/UNICEF Immunization Data Portal (WUENIC)</a> &mdash; the underlying modeled national coverage estimates.</span>,
        ]} />

      </article>
    </Prose>
  </Container>
);

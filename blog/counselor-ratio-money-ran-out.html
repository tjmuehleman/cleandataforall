// ==================== Hero visual ====================
const PostHero = () => (

    <figure style={{ margin:'0 auto 56px', maxWidth:900 }}>
      <img
        src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Vermont%22%2C%22New+Hampshire%22%2C%22Hawaii%22%2C%22Colorado%22%2C%22ASCA+recommendation%22%2C%22National+average%22%2C%22Arizona%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Students+per+counselor%22%2C%22data%22%3A%5B172%2C186%2C243%2C247%2C250%2C372%2C570%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23777%22%2C%22%23777%22%2C%22%23777%22%2C%22%23bbb%22%2C%22%23141210%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Students+per+school+counselor%2C+2024-25%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Students+per+counselor%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
        alt="Horizontal bar chart of students per school counselor in 2024-25: Vermont 172, New Hampshire 186, Hawaii 243, Colorado 247, ASCA recommendation 250, national average 372, Arizona 570"
        style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>
        Four states meet the 250:1 standard; the national average sits at 372:1. Source: <a href="https://www.schoolcounselor.org/about-school-counseling/school-counselor-roles-ratios" style={{ color:'inherit' }}>ASCA, 2024-25 ratios</a>.

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Every so often the education-data feed hands you a number that&rsquo;s actually good, and this year it&rsquo;s this one: the United States got down to <strong>372 students for every school counselor</strong> in 2024-25, an improvement over 376 the year before. The American School Counselor Association, which publishes the ratio, says that nudge put about <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">529,000 more kids</a> within reach of a counselor.
        </P>

        <P>
          I like good news. I don&rsquo;t get to write much of it here. So I sat with this one for a minute &mdash; and then I did the two things a data person does before believing a headline. I asked what the average is averaging. And I asked when they took the picture.
        </P>

        <H2>What the average is averaging</H2>

        <P>
          372:1 is a blend, and blends lie. Break it out by grade band and the single number splits into two different countries. High schools came in at <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">195 to 224 students per counselor</a> &mdash; under the <a href="https://www.schoolcounselor.org/about-school-counseling/school-counselor-roles-ratios">250:1 line ASCA recommends</a>, for the first time. Elementary and middle schools came in at <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">571 to 694</a>. So the &ldquo;national average&rdquo; of 372 describes almost no actual child. It&rsquo;s the midpoint between a senior who can get a meeting and a fourth-grader who&rsquo;s one of six hundred names on somebody&rsquo;s list.
        </P>

        <Fig caption={<>Grade-band ranges reported by ASCA for 2024-25. High schools clear the 250:1 target; elementary and middle schools are more than double it. Source: <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">K-12 Dive</a> on ASCA data.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22High+schools%22%2C%22Elementary+%26+middle%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Range+low%22%2C%22data%22%3A%5B195%2C571%5D%2C%22backgroundColor%22%3A%22%23777%22%7D%2C%7B%22label%22%3A%22Range+high%22%2C%22data%22%3A%5B224%2C694%5D%2C%22backgroundColor%22%3A%22%23141210%22%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+national+average+hides+the+gap+by+grade+band%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Students+per+counselor+%28ASCA+target%3A+250%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart showing high schools at 195 to 224 students per counselor and elementary and middle schools at 571 to 694, against an ASCA target of 250"
            style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          The state spread does the same thing. Four states &mdash; Vermont at 172, New Hampshire at 186, Hawaii at 243, Colorado at 247 &mdash; actually <a href="https://www.schoolcounselor.org/about-school-counseling/school-counselor-roles-ratios">meet the recommendation</a>. Arizona sits at 570, the worst in the country, even though ASCA called it the <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">most-improved state</a> in the same breath (it was 645 the year before). One number, fifty stories.
        </P>

        <H2>When they took the picture</H2>

        <P>
          Here&rsquo;s the part that actually bugs me. A lot of the counselors behind this improvement were hired with pandemic money. ESSER &mdash; the federal COVID relief that flowed to schools &mdash; was one of the biggest one-time hiring engines K-12 has ever seen, and counselors and other student-support staff were exactly what districts <a href="https://www.edweek.org/leadership/counselor-to-student-ratios-show-improvement-but-looming-fiscal-cliff-may-threaten-gains/2024/02">spent it on</a>. The catch is that ESSER had a clock. Districts had to commit the last of it by <a href="https://www.ed.gov/grants-and-programs/formula-grants/response-formula-grants/covid-19-emergency-relief-grants/elementary-and-secondary-school-emergency-relief-fund">September 30, 2024</a>.
        </P>

        <Callout label="Read the dates together">
          The good ratio is a 2024-25 number. The money that paid for a chunk of it expired in the fall of 2024. We measured the high-water mark at almost exactly the moment the tide started going out.
        </Callout>

        <P>
          This is the thing people miss about a snapshot statistic. It doesn&rsquo;t tell you the direction. 372:1 reads like an arrow pointing down and to the right &mdash; progress, momentum, keep going. But a ratio measured the year its funding sunsets isn&rsquo;t a trend. It&rsquo;s a photo taken at the top of the arc. Education Week saw it coming and <a href="https://www.edweek.org/leadership/counselor-to-student-ratios-show-improvement-but-looming-fiscal-cliff-may-threaten-gains/2024/02">called it a fiscal cliff</a> that could unwind the gains.
        </P>

        <P>
          I&rsquo;d love to be wrong. Maybe districts backfill the ESSER counselors with their own dollars and the 372 holds, or drops further. That&rsquo;s a real possibility and I hope it happens. But we won&rsquo;t know it from this number. We&rsquo;ll know it from the 2025-26 one &mdash; the first count taken entirely on post-relief money.
        </P>

        <Divider />

        <P>
          Until then, here&rsquo;s the honest version of the headline: the counselor shortage got better, in some grades, in some states, right before we stopped paying for the thing that fixed it.
        </P>

        <P>
          Good news. Check the date on it.
        </P>

        <P style={{ fontStyle:'italic', color:'var(--muted)' }}>&mdash; TJ</P>

      </article>
    </Prose>
  </Container>
);

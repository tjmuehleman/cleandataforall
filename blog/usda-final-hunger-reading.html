<!doctype html>
<html lang="en" data-theme="paper" data-pair="slab-serif">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="/favicon.ico" />
<title>The U.S. just turned off the hunger meter. The last reading was 13.7%. &mdash; Clean Data for All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Archivo:wght@400;500;700;900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --ink:#141210;
    --paper:#F4EFE6;
    --rule: rgba(20,18,16,.18);
    --rule-soft: rgba(20,18,16,.10);
    --muted: rgba(20,18,16,.62);
    --display: 'Roboto Slab', serif;
    --body: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[data-theme="paper"]{ --ink:#141210; --paper:#F4EFE6; --rule:rgba(20,18,16,.18); --rule-soft:rgba(20,18,16,.10); --muted:rgba(20,18,16,.62); }
  html[data-theme="poster"]{ --ink:#EDE6D8; --paper:#171413; --rule:rgba(237,230,216,.22); --rule-soft:rgba(237,230,216,.10); --muted:rgba(237,230,216,.6); }
  html[data-theme="zine"]{ --ink:#0A0908; --paper:#EFEBDF; --rule:rgba(10,9,8,.35); --rule-soft:rgba(10,9,8,.18); --muted:rgba(10,9,8,.68); }

  html[data-pair="slab-serif"]{ --display:'Roboto Slab', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }
  html[data-pair="grotesk-serif"]{ --display:'Archivo', sans-serif; --body:'Fraunces', Georgia, serif; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="slab-mono"]{ --display:'Roboto Slab', serif; --body:'IBM Plex Mono', monospace; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="display-serif"]{ --display:'Instrument Serif', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }
  body{ font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","ss02","onum"; }
  a{ color: inherit; }
  ::selection{ background: var(--ink); color: var(--paper); }

  body::before{
    content:""; position: fixed; inset:0; pointer-events:none; z-index: 1;
    background-image:
      radial-gradient(rgba(20,18,16,.045) 1px, transparent 1px),
      radial-gradient(rgba(20,18,16,.03) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
    opacity: .7;
  }
  html[data-theme="poster"] body::before{
    background-image:
      radial-gradient(rgba(237,230,216,.04) 1px, transparent 1px),
      radial-gradient(rgba(237,230,216,.025) 1px, transparent 1px);
    mix-blend-mode: screen;
  }

  #root{ position: relative; z-index: 2; }

  /* Post body typography */
  .post-body p { margin: 0 0 1.5em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body h2 { font-family: var(--display); font-weight: 900; font-size: clamp(24px, 2.5vw, 34px); line-height: 1.05; margin: 2em 0 0.5em; letter-spacing: -0.01em; }
  .post-body h3 { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 2vw, 26px); line-height: 1.1; margin: 1.8em 0 0.4em; }
  .post-body ul, .post-body ol { margin: 0 0 1.5em; padding-left: 1.4em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body li { margin-bottom: 0.4em; }
  .post-body blockquote { margin: 2em 0; padding: 0 0 0 24px; border-left: 3px solid var(--ink); font-style: italic; font-size: 20px; line-height: 1.6; max-width: 60ch; color: var(--ink); }
  .post-body blockquote cite { display: block; margin-top: 0.75em; font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .post-body hr { border: 0; border-top: 1px solid var(--rule); margin: 3em 0; }
  .post-body a { border-bottom: 1px solid var(--rule); text-decoration: none; }
  .post-body a:hover { border-bottom-color: var(--ink); }
  .post-body figure { margin: 2.5em 0; }
  .post-body figcaption { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
  .post-body .callout { border: 1px solid var(--ink); padding: 24px 28px; margin: 2.5em 0; max-width: 68ch; }
  .post-body .callout-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .post-body code { font-family: var(--mono); font-size: 0.88em; background: var(--rule-soft); padding: 2px 5px; }
  .post-body pre { font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--rule-soft); padding: 20px 24px; overflow-x: auto; margin: 2em 0; }
</style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel" data-presets="react">

// ==================== TEMPLATE DATA ====================
const POST = {
  kind:    'Data Study',
  number:  '040',
  date:    'May 18, 2026',
  readTime: '3 min',
  title:   'The U.S. just turned off the hunger meter. The last reading was 13.7%.',
  dek:     'On December 30, 2025, USDA published its final annual household food security report. After 30 years of one consistent series, the only national measurement of who can&rsquo;t eat in America is over &mdash; in the same calendar year the program it measured got cut by $186 billion.',
  byline:  'T.J. Müehleman',
};
// =============================================================================

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>&larr; All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
          <a href="../index.html#subscribe" style={{ textDecoration:'none' }}>Subscribe</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>&#8470; {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      <div style={{ maxWidth:900, paddingTop:32 }}>
        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>
          {POST.dek}
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>
        </div>
      </div>
    </div>
  </Container>
);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'24px 0' }}>
      <img
        src="https://quickchart.io/chart/render/zf-6a87a30b-62ae-4263-bcf5-07eca2d67219"
        alt="Line chart of U.S. household food insecurity from 2001 to 2024 using USDA Economic Research Service anchor years. The rate sits between 10.7 and 11.1 percent through 2007, spikes to 14.6 percent in 2008, peaks at 14.9 percent in 2011, declines to 10.5 percent in 2019 and 2020, then rises to 12.8 percent in 2022, 13.5 percent in 2023, and 13.7 percent in 2024."
        style={{ width:'100%', display:'block' }}
      />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:14, textAlign:'center' }}>
        Source: <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">USDA ERS, Food Security in the U.S. &mdash; Key Statistics &amp; Graphics</a>. Anchor years drawn from the ERS trends summary; the underlying series ran annually from 1995 through 2024 and was discontinued by USDA in September 2025.
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          December 30, 2025. USDA&rsquo;s Economic Research Service published{' '}
          <a href="https://www.ers.usda.gov/publications/pub-details?pubid=113622">Household Food Security in the United States in 2024</a>.
          {' '}ERR-358. Five authors. <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">13.7% of U.S. households food insecure at some point in 2024</a>. <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">47.9 million people</a> in those households. The 30-year series ends here. There won&rsquo;t be a 2025 edition.
        </P>

        <P>
          This isn&rsquo;t a budget thing. USDA announced in September 2025 that the survey would no longer be funded &mdash; the reports, the agency told{' '}
          <a href="https://thehill.com/homenews/administration/5515070-trump-administration-halts-government-hunger-report/">The Hill</a>, had become &ldquo;redundant, costly, politicized, and extraneous.&rdquo; The Current Population Survey Food Security Supplement that fed it had been administered annually since{' '}
          <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/history-background">April 1995</a>. The line that starts 30 years ago, runs through the Great Recession spike, the pandemic, the post-ARPA recovery, and the post-2022 climb &mdash; that line just hit its last data point.
        </P>

        <P>
          The reading is grim. <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">5.4% of households had very low food security</a>. <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">7.3 million children</a> lived in households where children and adults were both food insecure. The state spread (three-year average, 2022&ndash;2024) runs <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">9.0% in North Dakota to 19.4% in Arkansas</a>. The headline rate sits 3.2 percentage points above the <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">10.5% pre-pandemic baseline of 2019</a>. None of the year-over-year subgroup moves cleared statistical significance &mdash; the news is the level, not the slope.
        </P>

        <H2>The instrument got switched off the same year the lever got pulled</H2>

        <P>
          I run a data company. We work with WHO and with school districts. I don&rsquo;t have a take on SNAP policy. I have a take on what just happened to the measurement layer.
        </P>

        <P>
          In July 2025, the federal government signed the One Big Beautiful Bill, which CBO scored as <a href="https://www.cnbc.com/2025/08/08/trumps-spending-bill-cuts-billions-in-snap-benefits.html">$186 billion in SNAP cuts over the next decade</a> &mdash; the largest reduction in the program&rsquo;s history. In September it announced it would stop publishing the report that measures whether SNAP is working. The 2024 release was the last in the series.
        </P>

        <P>
          This is the part the policy people miss. The hunger report is the <em>evaluator</em>. It&rsquo;s the instrument that tells you whether the program you fund or cut is producing the outcome you care about. You don&rsquo;t have to like the framing. You don&rsquo;t have to like the methodology &mdash; the National Academies wrote{' '}
          <a href="https://nap.nationalacademies.org/read/11578/chapter/4">two volumes</a> about it. You just have to want one consistent series, asked the same way every year, on the same survey instrument, on the same calendar.
        </P>

        <Fig caption={<>Source: <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">USDA ERS, Food Security in the U.S. &mdash; Key Statistics &amp; Graphics</a>. 2024 figures. None of the year-over-year subgroup changes from 2023 cleared statistical significance &mdash; the 2024 level is the news.</>}>
          <img
            src="https://quickchart.io/chart/render/zf-4cc28bca-59a2-4670-85d1-a9e56b952972"
            alt="Horizontal bar chart of 2024 U.S. food insecurity rate by household type: single-mother households 36.8 percent, Black non-Hispanic households 24.4 percent, Hispanic households 20.2 percent, households with children 18.4 percent, all U.S. households 13.7 percent, white non-Hispanic households 10.1 percent."
            style={{ width:'100%', display:'block' }}
          />
        </Fig>

        <H2>The placeholder isn&rsquo;t the same instrument</H2>

        <P>
          What replaces the report isn&rsquo;t nothing. <a href="https://povertycenter.columbia.edu/publication/predicting-national-rates-food-insecurity-absence-official-data-collection">Columbia&rsquo;s Center on Poverty and Social Policy</a> published a model in October 2025 that takes poverty, unemployment, and food-specific inflation &mdash; anything correlated with food insecurity &mdash; and predicts national rates. Sophie Collyer and team back-tested it against the historical USDA series. It tracks. It&rsquo;s also a model. It&rsquo;s not a survey.
        </P>

        <P>
          Modeled food insecurity from a non-government source is to surveyed food insecurity what a forecast of the unemployment rate is to the BLS Current Population Survey. Useful, defensible, <em>not the same instrument</em>. The line that gets drawn after 2024 will be dotted, predicted, and produced by a university. That is a different kind of line.
        </P>

        <Callout label="The data-pipeline read">
          A cut to the program and a cut to the measurement layer arrive in the same calendar year. After 2024, there is no federal counterfactual. The next time someone wants to ask &mdash; did the SNAP changes move food insecurity up or down? &mdash; there will be no government series asking the question on the same calendar with the same question stem.
        </Callout>

        <Divider />

        <P>
          30 years. One survey. One methodology. The longest, cleanest national hunger time series in the developed world. The chart on the wall would have run 2020, 2021, 2022, 2023, 2024, and then a fresh annual data point every December.
        </P>

        <P>
          The line stops at 13.7%. Whatever comes next is a forecast.
        </P>

        <H3>Sources</H3>

        <UL items={[
          <><a href="https://www.ers.usda.gov/publications/pub-details?pubid=113622">USDA ERS &mdash; Household Food Security in the United States in 2024 (ERR-358)</a></>,
          <><a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/key-statistics-graphics">USDA ERS &mdash; Food Security in the U.S., Key Statistics &amp; Graphics</a></>,
          <><a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-us/history-background">USDA ERS &mdash; Food Security in the U.S., History &amp; Background (CPS-FSS administered annually since April 1995)</a></>,
          <><a href="https://thehill.com/homenews/administration/5515070-trump-administration-halts-government-hunger-report/">The Hill &mdash; Trump administration halts government hunger report (Sept 2025)</a></>,
          <><a href="https://frac.org/news/foodsecuritysurveyterminationsept25">FRAC &mdash; USDA&rsquo;s Decision to End 30-Year Food Security Report (Sept 2025)</a></>,
          <><a href="https://www.cnbc.com/2025/08/08/trumps-spending-bill-cuts-billions-in-snap-benefits.html">CNBC &mdash; Big Beautiful Bill will cut $186 billion from SNAP through 2035</a></>,
          <><a href="https://povertycenter.columbia.edu/publication/predicting-national-rates-food-insecurity-absence-official-data-collection">Columbia CPSP &mdash; Predicting National Rates of Food Insecurity in the Absence of Official Data Collection</a></>,
          <><a href="https://www.csis.org/analysis/last-us-hunger-data-what-we-lose-termination-usdas-household-food-security-united-states">CSIS &mdash; The Last U.S. Hunger Data: What We Lose with the Termination of the USDA Report</a></>,
        ]}/>

        <P><em>&mdash; TJ</em></P>

      </article>
    </Prose>
  </Container>
);

// ==================== Footer ====================
const Footer = () => {
  const [email, setEmail] = React.useState('');
  const [sent, setSent] = React.useState(false);
  return (
    <footer id="subscribe" style={{ borderTop:'1px solid var(--ink)', marginTop:80 }}>
      <Container>
        <div style={{ padding:'64px 0 40px', maxWidth:560 }}>
          <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, color:'var(--muted)' }}>&sect; Subscribe</span>
          <h3 style={{ fontFamily:'var(--display)', fontWeight:900, letterSpacing:'-0.01em', fontSize:'clamp(32px, 4vw, 56px)', lineHeight:0.95, margin:'8px 0 16px' }}>
            The dispatch,<br/>every Saturday morning.
          </h3>
          <p style={{ fontSize:17, lineHeight:1.55, maxWidth:'42ch', margin:'0 0 24px', textWrap:'pretty' }}>
            One email a week. A short essay, a chart, and links to anything we read
            that changed the way we read public data. No tracking pixels.
          </p>
          <form onSubmit={(e)=>{ e.preventDefault(); setSent(true); }}
            style={{ display:'flex', gap:0, maxWidth:460, border:'1.5px solid var(--ink)' }}>
            <input value={email} onChange={e=>setEmail(e.target.value)}
              type="email" placeholder="you@yourdomain.org" required
              style={{ flex:1, border:0, background:'transparent', padding:'14px 16px', fontFamily:'var(--body)', fontSize:16, color:'var(--ink)', outline:'none' }}/>
            <button type="submit"
              style={{ border:0, borderLeft:'1.5px solid var(--ink)', padding:'0 20px', background:'var(--ink)', color:'var(--paper)', fontFamily:'var(--mono)', fontSize:12, letterSpacing:'0.12em', textTransform:'uppercase', cursor:'pointer', fontWeight:600 }}>
              {sent ? 'Sent ✓' : 'Subscribe →'}
            </button>
          </form>
          {sent && <p style={{ marginTop:10, fontFamily:'var(--mono)', fontSize:12, color:'var(--muted)' }}>Check your inbox &mdash; the confirmation note is on its way.</p>}
        </div>

        <Rule />

        <div style={{ padding:'24px 0 40px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }}>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Colophon</div>
            <div>Hosted on GitHub Pages. No trackers, no cookies, no stock photography. Built by hand at Standard Co.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>
            <div>All text, charts, and datasets are published under CC BY 4.0. Copy us, cite us, improve us. Corrections, at the bottom of every piece.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Contact</div>
            <div>info@standardco.de<br/>Standard Co, est. 2013<br/>A reader-supported project.</div>
          </div>
        </div>

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
          <span>&copy; 2013&ndash;2026 Standard Co &middot; All rights unreserved</span>
          <span>Made with help from Claude</span>
        </div>
      </Container>
      <style>{`
        @media (max-width: 820px){
          .cdfa-colophon{ grid-template-columns: 1fr !important; }
        }
      `}</style>
    </footer>
  );
};

// ==================== App ====================
function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          53%. That’s how much of the spread in proficiency rates between DC schools gets explained by one thing: the share of economically disadvantaged kids a school serves. EmpowerK12 published it in <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">its deep dive on DC’s 2026 test results</a> and called the relationship <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">“the lowest in DC state test history.”</a> It is. The <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">previous record low was 2016</a>, and in 2022 the same figure was <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">nearly three-quarters</a>.
        </P>

        <P>
          Meanwhile, Vermont. The Agency of Education’s <a href="https://education.vermont.gov/press-release/vermont-agency-education-releases-2025-2026-statewide-assessment-results" target="_blank" rel="noopener">Sept. 10 release</a> reported modest gains in nearly every tested grade and subject, and said gaps between historically marginalized students and their peers <a href="https://education.vermont.gov/press-release/vermont-agency-education-releases-2025-2026-statewide-assessment-results" target="_blank" rel="noopener">“continued to widen.”</a> No number attached. VTDigger got the numbers from the agency a few weeks later: <a href="https://vtdigger.org/2026/10/05/despite-some-overall-progress-vermont-test-scores-show-a-widening-achievement-gap/" target="_blank" rel="noopener">30 to 38 percentage points</a> depending on the subject, widest in <a href="https://vtdigger.org/2026/10/05/despite-some-overall-progress-vermont-test-scores-show-a-widening-achievement-gap/" target="_blank" rel="noopener">sixth grade English language arts</a>, up from <a href="https://vtdigger.org/2026/10/05/despite-some-overall-progress-vermont-test-scores-show-a-widening-achievement-gap/" target="_blank" rel="noopener">26 to 36 last year</a>.
        </P>

        <P>
          The brief I started from stacked those two up and called DC the most equitable school system in America and Vermont the least. Great headline. I couldn’t find anybody who actually ranks them, though (I looked), and the longer I stared the more it looked like a tape measure and a bathroom scale.
        </P>

        <H2>A record low that’s still more than half</H2>

        <P>
          DC’s number is a share of variation, calculated across schools. Poverty explains 53% of the differences between them. Everything else explains the other 47% (100 − 53). If that’s a plain R-squared, and the chart file on the page is literally named rsq_poverty so I think it is, the correlation underneath is about 0.73 (the square root of 0.53). Lowest ever. Still strong. Both true!
        </P>

        <Fig caption={<>Source: <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">EmpowerK12, 2026 DC state assessment deep dive</a>. The 53% is EmpowerK12’s figure for 2026; the 47% is derived (100 − 53).</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Explained+by+school+poverty+%2853%25%29%22%2C%22Everything+else+%2847%25%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B53%2C47%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22DC+2026%3A+what+explains+the+spread+in+school+proficiency+rates%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A60%2C%22stepSize%22%3A10%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+variation+between+schools%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&amp;v=2.9.4&amp;w=900&amp;h=480&amp;bkg=transparent&amp;devicePixelRatio=2" alt="Horizontal bar chart for DC in 2026: 53% of the variation in school proficiency rates is explained by a school’s share of economically disadvantaged students, 47% by everything else." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          And it’s a number about schools, not kids. Same post, same paragraph: differences between student groups <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">“remain stark.”</a> The Black-white gap in math at the career-ready bar <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">fell 6 points this year, to 54</a>. That’s bigger than anything Vermont reported. Nobody would call it comparable either.
        </P>

        <H2>Vermont’s gap group is most of the state</H2>

        <P>
          Vermont counts a student as marginalized if they <a href="https://vtdigger.org/2026/10/05/despite-some-overall-progress-vermont-test-scores-show-a-widening-achievement-gap/" target="_blank" rel="noopener">belong to a racial or ethnic minority, live in poverty</a>, have an IEP, are a migrant or English learner, are homeless, are in foster care, or come from a military-connected family. Eight doors into one bucket. And the bucket is <a href="https://vtdigger.org/2026/10/05/despite-some-overall-progress-vermont-test-scores-show-a-widening-achievement-gap/" target="_blank" rel="noopener">57% of about 80,000 students</a>.
        </P>

        <P>
          So the “gap” is the majority of Vermont kids against the other 43% (100 − 57). The bottom of the range moved up 4 points and the top moved up 2 (30 − 26, 38 − 36). Which door did that? Poverty? IEPs? You can’t tell from a range. DC’s poverty flag is a lot narrower: <a href="https://osse.dc.gov/sites/default/files/dc/sites/osse/page_content/attachments/2026%20DC%20Statewide%20Assessment%20Results%208.20.26.pdf" target="_blank" rel="noopener">TANF or SNAP, homelessness, or a ward of the state</a>, about <a href="https://osse.dc.gov/sites/default/files/dc/sites/osse/page_content/attachments/2026%20DC%20Statewide%20Assessment%20Results%208.20.26.pdf" target="_blank" rel="noopener">50% of students citywide</a>.
        </P>

        <H2>And both rulers are about to change</H2>

        <P>
          This spring’s DC results were <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">the tenth and final set from the PARCC/CAPE test</a>. New test in 2027. So the record low is the last dot on that line. Vermont’s numbers are still labeled preliminary, with final results due <a href="https://education.vermont.gov/press-release/vermont-agency-education-releases-2025-2026-statewide-assessment-results" target="_blank" rel="noopener">later this fall</a>.
        </P>

        <Divider />

        <P>
          Scores up was the headline in both places. Underneath, one city ran a regression on its schools and one state did subtraction on its students. I’d love to see DC’s math run on Vermont’s schools, and Vermont’s subtraction run on DC’s kids. Until somebody does that, the most equitable school system in America is whichever one you measured last.
        </P>

        <H3>Sources</H3>
        <UL items={[
          <>EmpowerK12, <a href="https://www.empowerk12.org/blog-source/2026-cape-results-deep-dive" target="_blank" rel="noopener">DC Students Post a Fourth Straight Year of Gains on the 2026 State Assessments</a>: 53% of variation, 2016 and 2022 comparisons, group gaps, final PARCC/CAPE year</>,
          <>DC Office of the State Superintendent of Education, <a href="https://osse.dc.gov/sites/default/files/dc/sites/osse/page_content/attachments/2026%20DC%20Statewide%20Assessment%20Results%208.20.26.pdf" target="_blank" rel="noopener">2026 DC Statewide Assessment Results</a> (Aug. 20, 2026): economically disadvantaged definition and citywide share</>,
          <>Vermont Agency of Education, <a href="https://education.vermont.gov/press-release/vermont-agency-education-releases-2025-2026-statewide-assessment-results" target="_blank" rel="noopener">Vermont Agency of Education Releases 2025-2026 Statewide Assessment Results</a> (Sept. 10, 2026): modest gains, widening gaps, preliminary status</>,
          <>VTDigger, <a href="https://vtdigger.org/2026/10/05/despite-some-overall-progress-vermont-test-scores-show-a-widening-achievement-gap/" target="_blank" rel="noopener">Despite some overall progress, Vermont test scores show a widening achievement gap</a> (Oct. 5, 2026): gap ranges for both years, definition of marginalized, 57% share</>,
        ]} />

      </article>

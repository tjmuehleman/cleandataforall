const PostHero = () => (
  <Container>
    <div style={{ borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'40px 0', margin:'0 0 56px' }}>
      <figure style={{ margin:0, textAlign:'center' }}>
        <img
          src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Mean+temperature%22%2C%22Daytime+high%22%2C%22Overnight+low%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22anomaly%22%2C%22data%22%3A%5B3.3%2C2.9%2C3.7%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23777%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22July+2026+was+the+warmest+month+in+the+132-year+U.S.+record.%22%2C%22Degrees+F+above+the+20th-century+average%2C+contiguous+U.S.%22%2C%22The+overnight+low+is+the+one+that+set+its+own+record.%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Degrees+F+above+20th-century+average%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
          alt="Bar chart of July 2026 temperature anomalies for the contiguous United States in degrees Fahrenheit above the 20th-century average: mean temperature plus 3.3, daytime high plus 2.9, overnight low plus 3.7."

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H3 = ({ children }) => <h3>{children}</h3>;

const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Milwaukee Public Schools opened for the year on Tuesday, September 1. It closed on Wednesday,
          September 2.
        </P>

        <P>
          Day two.{' '}
          <a href="https://www.wpr.org/news/milwaukee-public-schools-closed-due-to-excessive-heat">The health
          department said the buildings were not safe</a>, the National Weather Service had the high near 89,
          and 64,500 kids stayed home. The average MPS building is 85 years old. Some went up before 1900,
          back when leaving air conditioning out of the design wasn&#8217;t an omission, because there was
          nothing to leave out.
        </P>

        <P>
          That&#8217;s a story. Here&#8217;s the part that bugs me.
        </P>

        <H2>The temperature side of this is gorgeous</H2>

        <P>
          NOAA can tell you exactly how hot the month before that was.{' '}
          <a href="https://www.ncei.noaa.gov/news/national-climate-202607">July 2026 averaged 76.9&#176;F across
          the contiguous U.S., 3.3&#176;F above the 20th-century average</a> &#8212; the warmest month in a
          132-year record, beating July 1936 and July 2012 by a tenth or two of a degree. Every state in the
          Lower 48 ran at least 1&#176;F above its own normal. Thirteen landed in their top five.
        </P>

        <P>
          And the number that actually matters for a brick school with no AC isn&#8217;t the daytime high.
          Daytime highs were only the sixth warmest on record. Overnight lows were <em>the</em> warmest ever
          measured, 3.7&#176;F above average. The building never got its night to dump the heat. Milwaukee&#8217;s
          interim COO says they run fans overnight and have put barn fans in some buildings, which is what you
          do when the thing you&#8217;re cooling against refuses to cool.
        </P>

        <P>
          Gridded, quality-controlled, published on a schedule, corrected in public &#8212; NOAA reissued the
          Wyoming figure two days later and posted a note saying so. That is what a well-run data system looks
          like.
        </P>

        <Fig caption={<>Counts from <a href="https://www.climatecentral.org/climate-matters/lingering-summer-heat-2025">Climate Central, Lingering Summer Heat</a>, based on NOAA station data, 1970&#8211;2024. Of 246 major U.S. cities analyzed, 227 now see summer-like temperatures run later into fall, by an average of 10 days.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Cities+analyzed%22%2C%22Summer+runs+later%22%2C%22At+least+a+week+later%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22cities%22%2C%22data%22%3A%5B246%2C227%2C167%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22The+weather+side+of+this+is+measured+very+well.%22%2C%22U.S.+cities+where+summer-like+heat+now+runs+later+into+fall+than+in+the+early+1970s.%22%2C%22Climate+Central%2C+station+data+1970-2024.%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Number+of+cities%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart showing 246 U.S. cities analyzed by Climate Central, 227 where summer-like heat now runs later into fall than in the early 1970s, and 167 where it runs at least a week later."
            style={{ width:'100%', display:'block' }}
          />
        </Fig>

        <H2>The closure side is a spreadsheet</H2>

        <P>
          Now try to answer a much simpler question: how many school days did American kids lose to heat this
          year?
        </P>

        <P>
          The best number available comes from UndauntedK12, a nonprofit.{' '}
          <a href="https://www.k12dive.com/news/severe-weather-impacting-millions-of-students-wildfires-heat-floods-hurricanes/827368/">More
          than 9 million students at 10,000 schools</a> hit by extreme weather in 2024&#8211;25. Nearly half a
          million students hit specifically by heat closures and early dismissals in 2025&#8211;26, almost all
          of them in the northern half of the country, because that&#8217;s where the buildings have no AC.
        </P>

        <P>
          Those are good numbers. They are also a hand count by an advocacy shop, and they are the only
          national numbers there are.
        </P>

        <H2>Counting is harder than it looks</H2>

        <P>
          Even one district can&#8217;t hold the unit of analysis still. Milwaukee: about a quarter of
          classrooms have air conditioning. Also Milwaukee:{' '}
          <a href="https://www.wpr.org/news/milwaukee-public-schools-closed-due-to-excessive-heat">56 percent
          of schools offer full or partial air conditioning</a>. Both true, both from the district&#8217;s own
          facilities plan. One counts rooms and one counts buildings, and the building number is more than
          double the room number.
        </P>

        <P>
          Philadelphia has been working its uncooled-building count down for years &#8212;{' '}
          <a href="https://www.accuweather.com/en/weather-news/heat-forces-school-closures-remote-learning-and-early-dismissals-across-8-states/1930561">roughly
          100 in 2022, down to 52 by 2026</a>. Real progress. But{' '}
          <a href="https://time.com/article/2026/08/19/as-students-return-to-school-america-s-classrooms-are-dangerously-hot/">57
          Philadelphia schools went remote on a single day in May</a>, and 52 ran shortened days last week.
          Inventory count, closure count, disruption count. Three numbers describing the same buildings, and
          none of them roll up anywhere.
        </P>

        <Callout label="The exception">
          Troy City Schools in Ohio dismissed two hours early on Tuesday and Wednesday last week. The district
          can tell you those were its{' '}
          <a href="https://www.accuweather.com/en/weather-news/heat-forces-school-closures-remote-learning-and-early-dismissals-across-8-states/1930561">15th
          and 16th heat-related early dismissals since 2019</a>. One district in Ohio keeps a running tally. No
          federal agency keeps one for the country.
        </Callout>

        <P>
          Last week alone, at least 18 districts across eight states lost time. Detroit sent 54,000 students
          home three hours early two days running, on a 98-degree Wednesday, for the second consecutive year
          it has opened the doors and then closed them for heat.
        </P>

        <H2>What it would take</H2>

        <P>
          The retrofit numbers exist and they are enormous. GAO found in 2020 that{' '}
          <a href="https://www.gao.gov/products/gao-20-494">41 percent of districts needed HVAC updates in at
          least half their schools</a>, about 36,000 buildings. Pittsburgh priced cooling its 37 uncooled
          facilities at $443 million to $552 million. And{' '}
          <a href="https://luskin.ucla.edu/hot-weather-lowers-students-ability-to-learn-new-study-finds">each
          1&#176;F rise in school-year temperature costs about 1 percent of what gets learned</a> in schools
          without cooling, so the cost of not doing it is real too.
        </P>

        <P>
          But you can&#8217;t rank half a trillion dollars of buildings against a dataset that doesn&#8217;t
          exist. And here&#8217;s the thing: the collection is already built. Every state takes emergency
          closure and amended-calendar filings from districts. They&#8217;re public records. They already have
          a date, a district, and a day count.
        </P>

        <P>
          They just don&#8217;t have a reason code. Heat, snow, flood, smoke, other.
        </P>

        <Divider />

        <P>
          One column. That&#8217;s the whole ask.
        </P>

      </article>
    </Prose>
  </Container>
);

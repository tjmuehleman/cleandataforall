// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Since 1870, the federal government has collected statistics on the condition and progress of American education (<a href="https://nces.ed.gov/fastfacts/display.asp?id=932" target="_blank" rel="noopener">NCES</a>). That&rsquo;s 156 years of counting enrollment, spending, graduation, teachers and their salaries &mdash; the whole instrument panel everyone quietly assumes just exists. This year&rsquo;s edition of the Condition of Education, released May 28, updated 17 of the 702 indicators the Education Department&rsquo;s statistics wing is supposed to track (<a href="https://ies.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">NCES 2026-144</a>; confirmed by <a href="https://www.edweek.org/policy-politics/feds-issue-a-slimmed-down-data-release-on-u-s-schools/2026/05" target="_blank" rel="noopener">Education Week</a>).
        </P>

        <P>
          Read that again. Seventeen. Out of seven hundred and two.
        </P>

        <P>
          I run a data company. We build the systems that turn messy field reporting into numbers people actually trust, and the thing that gets me about this story isn&rsquo;t the politics &mdash; it&rsquo;s the plumbing. Every chart anyone has ever shared about American schools, per-pupil spending, chronic absenteeism, graduation rates, traces back to a small number of federal collections nobody thinks about until they stop.
        </P>

        <H2>Here&rsquo;s what stopped</H2>

        <P>
          The National Center for Education Statistics went from something like 100 staff to 3 last year, after DOGE cuts. It&rsquo;s crawled back to about 11 as of this February (<a href="https://www.luminafoundation.org/news-and-views/after-the-buzz-cut-rebuilding-the-nations-education-data-agency/" target="_blank" rel="noopener">Lumina Foundation</a>). The Institute of Education Sciences, the parent shop that runs NCES, lost about 90% of its staff in the same wave (Education Week).
        </P>

        <P>
          And here&rsquo;s the part that should bother anyone who works with data for a living: nobody agrees on how many contracts got cancelled. DOGE posted on X that it had terminated 89 Education Department contracts worth $881 million. A department spokesperson later told ProPublica the number was 90. The American Educational Research Association counted 169 &mdash; nearly double &mdash; because it was tracking IES contracts specifically, including ones tied to NCES itself (<a href="https://www.chalkbeat.org/2025/02/11/elon-musk-and-doge-cancel-education-department-research-contracts/" target="_blank" rel="noopener">Chalkbeat</a>). Three different people looked at the same stack of terminated paperwork and got three different totals. That&rsquo;s not a rounding error. That&rsquo;s a sign nobody kept a master list of the list-keepers.
        </P>

        <P>
          The American Statistical Association has been trying to build that master list ever since. Its tracker of the 56 NCES data collections finds 11 fully active and 8 gathering limited data; 26 others have been halted outright, with the remaining 11 either unknown or one-time studies that had already wrapped &mdash; 56 minus 11 minus 8 minus 26 (<a href="https://www.amstat.org/policy-and-advocacy/nces-study-and-project-tracker/" target="_blank" rel="noopener">ASA NCES Study and Project Tracker</a>, via Education Week). That&rsquo;s not a chart I built for effect. That&rsquo;s the whole inventory, and more than half of it is dark.
        </P>

        <Fig caption={<>Status of the 56 NCES data collections tracked by the American Statistical Association, as reported May 2026. 56 &minus; 11 &minus; 8 &minus; 26 = 11 unknown or completed. Source: <a href="https://www.amstat.org/policy-and-advocacy/nces-study-and-project-tracker/" target="_blank" rel="noopener" style={{ color:'inherit', borderBottom:'1px solid currentColor' }}>ASA NCES Study and Project Tracker</a>, via <a href="https://www.edweek.org/policy-politics/feds-issue-a-slimmed-down-data-release-on-u-s-schools/2026/05" target="_blank" rel="noopener" style={{ color:'inherit', borderBottom:'1px solid currentColor' }}>Education Week</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Halted%22%2C%22Fully+active%22%2C%22Limited+data%22%2C%22Unknown+%2F+one-time%2C+completed%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B26%2C11%2C8%2C11%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23777777%22%2C%22%23bbbbbb%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Status+of+the+56+NCES+data+collections+tracked+by+ASA%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x1%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Number+of+collections%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y1%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart showing 26 of 56 NCES data collections halted, 11 fully active, 8 gathering limited data, and 11 unknown or one-time completed"
            style={{ maxWidth:900, width:'100%', display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>A pulse, not a fix</H2>

        <P>
          Some of this is coming back. IES has started re-advertising vacant positions (Education Week). A Senate committee &mdash; Murkowski and Collins crossing over with Kaine and other Democrats &mdash; advanced a bill on July 30 to block much of the department&rsquo;s dismantling (<a href="https://www.edweek.org/policy-politics/senate-panel-advances-bill-to-block-much-of-trump-admin-s-ed-dept-dismantling/2026/07" target="_blank" rel="noopener">Education Week</a>). Neither of those things is a fix. They&rsquo;re a pulse.
        </P>

        <P>
          And the newest wrinkle isn&rsquo;t even about missing numbers &mdash; it&rsquo;s about what the numbers are allowed to mean once they show up. The department told Chalkbeat in early July that the long-delayed Civil Rights Data Collection &mdash; discipline, suspensions, AP access, bullying &mdash; would land &ldquo;later this summer&rdquo; (<a href="https://www.chalkbeat.org/2026/07/10/department-of-education-says-civil-rights-and-discipline-data-coming-soon/" target="_blank" rel="noopener">Chalkbeat</a>). Two weeks after that promise, the department also changed what counts as evidence of discrimination: raw demographic gaps in discipline or AP enrollment can no longer, on their own, trigger a civil rights investigation (<a href="https://www.chalkbeat.org/2026/07/23/department-of-education-limits-civil-rights-investigations/" target="_blank" rel="noopener">Chalkbeat</a>). So even once the data shows up, the department has already decided in advance that the gaps it shows won&rsquo;t count as proof of anything.
        </P>

        <Divider />

        <P>
          That&rsquo;s the real story here. Not a policy fight over vouchers or curriculum. A country that has counted its own schools every year for 156 years just lost track of its instrument panel &mdash; and can&rsquo;t yet agree, even internally, on how many pieces it dropped.
        </P>

      </article>
    </Prose>
  </Container>
);

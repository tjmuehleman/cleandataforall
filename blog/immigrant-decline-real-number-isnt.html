// ==================== Post body ====================

// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In August, a survey told us the foreign-born population of the United States fell by <A href={CIS}>2.2 million people between January and July</A>. Six months. The largest same-year drop the Current Population Survey has recorded since it started asking about citizenship in 1994. Every outlet ran it. Two think tanks built estimates on top of it.
        </P>

        <P>
          And the economist at the Peterson Institute who looked at it said, more or less: <A href={PIIE}>that’s almost certainly wrong</A>.
        </P>

        <P>
          Not wrong like fabricated. Wrong like the number is describing a world that doesn’t exist. Jed Kolko’s math is brutal: if 2.2 million immigrants really vanished in six months, then payroll employment is overstated by millions of jobs — or the <A href={PIIE}>true unemployment rate is 2.6 percent</A>, a level the country hasn’t touched since 1953, and the economy is running so hot the Fed should be hiking into it. Neither of those things is happening. So the number is lying about something.
        </P>

        <P>
          Here’s the part that made me put my coffee down. The reason it’s lying is built into how the survey adds up.
        </P>

        <H2>The books have to balance</H2>

        <P>
          The CPS is weighted to a fixed population total the Census Bureau set back in late 2024 — the “population controls.” Every month in 2025 has to sum to that predetermined total, no matter what the survey actually collects. Foreign-born and native-born aren’t controlled separately; they only have to add up to the whole. So when the foreign-born count drops 2.2 million, the native-born count is <A href={CIS}>forced to rise 3.1 million</A> to keep the ledger square. Not because 3.1 million Americans were born. Because the arithmetic demanded it.
        </P>

        <Fig caption={<>The CPS is weighted so the two have to sum to a preset total. When the foreign-born count fell 2.2 million from January to July 2025, the U.S.-born count was pushed up 3.1 million to match. Source: <A href={CIS}>Center for Immigration Studies, from BLS/CPS data</A>.</>}>
          <img src={OFFSET_CHART} alt="CPS population change January to July 2025: foreign-born down 2.2 million, US-born up 3.1 million" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          So a big chunk of “native-born employment is booming” is the exact same event as “immigrants are disappearing,” measured from the other end. One artifact. Two headlines. Opposite political valence.
        </P>

        <H2>The good data is two years old</H2>

        <P>
          Which brings me to the actual scandal, the boring one, the one nobody’s yelling about. The survey we’d trust to size the foreign-born population is the American Community Survey — bigger sample, better methods. It currently <A href={CIS}>reflects the population only through July 2023</A>, and it hasn’t been reweighted for the recent migration estimates. So to say anything about right now, everyone reaches for the CPS: a labor-force survey with a small foreign-born sample that the <A href={CENSUS}>Census Bureau itself doesn’t use to size the foreign-born</A>. We’re reading 2025 off the one instrument built for a different job, because the right instrument is still developing 2023’s film.
        </P>

        <P>
          None of this means nothing happened. Something did. Census’s own estimates show <A href={CENSUS}>net international migration fell from 2.7 million in 2024 to 1.3 million in 2025</A>, and if the trend holds it’ll be the first net-negative migration in more than 50 years. That’s a real break. The direction isn’t in dispute.
        </P>

        <P>
          The magnitude is the whole story. And the magnitude is exactly where a survey stops measuring the world and starts measuring itself — response rates falling fastest among the very people the number is about, <A href={PIIE}>as the administration moves to use IRS files and insurance claims for immigration enforcement</A>. A frightened respondent and an emigrated one look identical in a spreadsheet. The cell is just empty.
        </P>

        <Divider />

        <P>
          The best independent guess for full-year 2025 net immigration runs from <A href={PIIE}>a gain of 115,000 to a loss of 525,000</A>. The headline said down 2.2 million, in half the time.
        </P>

        <P>
          Somebody’s off by an order of magnitude. My money’s on the people who are sure.
        </P>

      </article>
    </Prose>
  </Container>
);

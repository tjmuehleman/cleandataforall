const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The 2024 Nation&rsquo;s Report Card came with a map of all 50 states, shaded by how their 8th graders did in math since 2019, the last test before the pandemic. There is <a href="https://nces.ed.gov/use-work/resource-library/report/statistical-analysis-report/2024-naep-mathematics-assessment-results-grades-4-and-8-nation-states-and-districts">no green on it</a>. Forty-nine states scored lower than they did in 2019. <a href="https://www.chalkbeat.org/tennessee/2025/01/29/naep-students-buck-national-trends-nations-report-card-2024/">One &mdash; Tennessee &mdash; held even</a>. Zero went up.
        </P>

        <P>
          I run a data company. When a national result spreads across 50 states as &ldquo;49 down, 1 flat, 0 up,&rdquo; my first instinct isn&rsquo;t <em>kids got worse at math</em>. It&rsquo;s: what is this instrument measuring, and on what clock?
        </P>

        <H2>The flat average that isn&rsquo;t</H2>

        <P>
          Here&rsquo;s the part the one-line headline gets backwards. Nationally, <a href="https://www.nagb.gov/news-and-events/news-releases/2025/nations-report-card-decline-in-reading-progress-in-math.html">8th-grade math was flat from 2022 to 2024</a> &mdash; no change. Flat sounds like a floor. It isn&rsquo;t. The average sat still because two things moved underneath it in opposite directions: the top recovered a little, the bottom kept falling. <a href="https://hechingerreport.org/naep-test-2024-dismal-report/">The losses for the lowest-performing 8th graders grew about 70% larger between 2022 and 2024</a>, and <a href="https://hechingerreport.org/naep-test-2024-dismal-report/">the gap between the top and bottom is now the widest in the history of the test</a>. A flat average is the sound of a high performer and a low performer cancelling each other out on the page.
        </P>

        <H2>The cohort accounting</H2>

        <P>
          NAEP doesn&rsquo;t follow individual kids. It&rsquo;s a snapshot of whoever happens to be in 8th grade that spring &mdash; a different group every cycle. So &ldquo;scores fell&rdquo; doesn&rsquo;t mean a child unlearned anything. It means this year&rsquo;s 8th graders know less math than the same-age kids did a few years ago. And <a href="https://hechingerreport.org/naep-test-2024-dismal-report/">the 8th graders who sat the 2024 test were in 4th grade in spring 2020</a>, when school stopped. Their fraction-and-decimal year happened over a webcam. The number isn&rsquo;t measuring a backslide. It&rsquo;s measuring a foundation that never got poured.
        </P>

        <H2>Where the grades fork</H2>

        <Fig caption={<>4th-grade math rose 2 points from 2022 but sits 3 points under 2019; 8th-grade math was unchanged from 2022 and 9 points under 2019. Sources: <a href="https://www.nagb.gov/news-and-events/news-releases/2025/nations-report-card-decline-in-reading-progress-in-math.html">NAGB &mdash; 2024 Nation&rsquo;s Report Card</a> (changes vs. 2022); <a href="https://www.chalkbeat.org/tennessee/2025/01/29/naep-students-buck-national-trends-nations-report-card-2024/">Chalkbeat</a> (changes vs. 2019).</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Grade+4+math%22%2C%22Grade+8+math%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Change+vs+2022%22%2C%22data%22%3A%5B2%2C0%5D%2C%22backgroundColor%22%3A%22%23777%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Change+vs+2019%22%2C%22data%22%3A%5B-3%2C-9%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22NAEP+math%3A+4th+grade+edged+up%2C+8th+grade+didn%27t+move%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Atrue%2C%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A8%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%2C%22min%22%3A-10%2C%22max%22%3A4%2C%22stepSize%22%3A2%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Score+change+%28NAEP+points%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart of NAEP math score change for grade 4 and grade 8, showing change versus 2022 and change versus 2019" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          Put 4th and 8th grade on the same axis and the cohort story shows up as a fork. <a href="https://www.nagb.gov/news-and-events/news-releases/2025/nations-report-card-decline-in-reading-progress-in-math.html">4th-grade math ticked up 2 points from 2022</a> &mdash; but it&rsquo;s still <a href="https://www.chalkbeat.org/tennessee/2025/01/29/naep-students-buck-national-trends-nations-report-card-2024/">3 points below 2019</a>. 8th grade didn&rsquo;t move from 2022 and sits <a href="https://www.chalkbeat.org/tennessee/2025/01/29/naep-students-buck-national-trends-nations-report-card-2024/">9 points under 2019</a>. The younger cohort is clawing back; the older one is stuck near the bottom of the hole. And <a href="https://www.nagb.gov/news-and-events/news-releases/2025/nations-report-card-decline-in-reading-progress-in-math.html">nearly 40% of 8th graders now score below NAEP Basic in math</a> &mdash; below the floor the test sets for itself.
        </P>

        <H2>The yardstick is the only reason we can say any of this</H2>

        <P>
          The reason &ldquo;no state improved&rdquo; is even sayable is NAEP. It&rsquo;s the one national ruler that puts all 50 states on the same scale, which is exactly why a sentence like &ldquo;zero states gained&rdquo; holds up. But it&rsquo;s a snapshot taken every two years, <a href="https://hechingerreport.org/naep-test-2024-dismal-report/">scored from a sample of about 450,000 kids tested between January and March 2024</a> and <a href="https://www.nagb.gov/news-and-events/news-releases/2025/nations-report-card-decline-in-reading-progress-in-math.html">not released until a year later</a>. By the time a number lands, the kids who produced it have moved on a grade. The ruler is good. It is also slow, coarse, and built to compare strangers to strangers.
        </P>

        <Callout label="The receipt">
          8th-grade NAEP math, 2019 &rarr; 2024: 49 states down, Tennessee even, none up. Nationally flat vs. 2022, 9 points under 2019, with nearly 40% below Basic. Sources: <a href="https://nces.ed.gov/use-work/resource-library/report/statistical-analysis-report/2024-naep-mathematics-assessment-results-grades-4-and-8-nation-states-and-districts">NCES</a>; <a href="https://www.nagb.gov/news-and-events/news-releases/2025/nations-report-card-decline-in-reading-progress-in-math.html">NAGB</a>; <a href="https://www.chalkbeat.org/tennessee/2025/01/29/naep-students-buck-national-trends-nations-report-card-2024/">Chalkbeat</a>.
        </Callout>

        <Divider />

        <P>
          So the honest read of the map isn&rsquo;t the flat national line. It&rsquo;s that the recovery, where it exists at all, is happening at the top &mdash; and the one state that didn&rsquo;t go backwards in 8th-grade math did it by holding still. Tennessee isn&rsquo;t the green state. There is no green state. Tennessee is the one that stopped digging.
        </P>

        <P>
          A flat average can mean nothing changed. It can also mean two halves of the country walked away from each other and the number split the difference. This one&rsquo;s the second kind.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

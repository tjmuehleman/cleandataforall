// Available helper components:

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Seven points. That’s how much the share of Maryland schools with four or five stars grew in one year, <a href="https://www.wypr.org/wypr-news/2026-10-29/half-of-schools-earn-four-or-five-star-ratings-in-final-iteration-of-maryland-report-card" target="_blank" rel="noopener">from 43% to 50%</a>, on the <a href="https://news.maryland.gov/msde/2026-maryland-report-card/" target="_blank" rel="noopener">2026 Report Card the state released October 29</a>. <a href="https://news.maryland.gov/msde/2026-maryland-report-card/" target="_blank" rel="noopener">Nearly 89%</a> landed at three stars or better, <a href="https://news.maryland.gov/msde/2026-maryland-report-card/" target="_blank" rel="noopener">up three</a>.
        </P>

        <P>
          Now the test underneath. Math proficiency on MCAP came in at <a href="https://news.maryland.gov/msde/2025-26-mcap-scores/" target="_blank" rel="noopener">27.1%</a> this year. Last year it was <a href="https://news.maryland.gov/msde/state-assessment-scores-2025/" target="_blank" rel="noopener">26.5%</a>. English language arts went from <a href="https://news.maryland.gov/msde/state-assessment-scores-2025/" target="_blank" rel="noopener">50.8%</a> to <a href="https://news.maryland.gov/msde/2025-26-mcap-scores/" target="_blank" rel="noopener">51.7%</a>. That’s 0.6 and 0.9 points (27.1 − 26.5 and 51.7 − 50.8). Those are five-year highs, and the state’s own release called the year <a href="https://news.maryland.gov/msde/2025-26-mcap-scores/" target="_blank" rel="noopener">steady with slight improvements</a>.
        </P>

        <P>
          The brief I started from read this as a rating system getting generous on its way out the door. Maybe! I can’t show that from what’s published, and neither could the brief. Here’s what I can show.
        </P>

        <H2>A star is a bin</H2>

        <P>
          Schools earn a percentage of points across a handful of indicators, and the stars get cut from that: <a href="https://thedailyrecord.com/2026/10/30/half-maryland-public-schools-four-five-stars/" target="_blank" rel="noopener">75% and up is five stars, 60 to 74 is four, 45 to 59 is three</a>. Bins do two things to a number. A school parked at 59 picks up one point and becomes a four-star school. A school at 46 picks up twelve and nothing happens. (That second one is the State Board president’s own example, <a href="https://thedailyrecord.com/2026/10/30/half-maryland-public-schools-four-five-stars/" target="_blank" rel="noopener">a 12-point gain that still lands on three stars</a>.)
        </P>

        <P>
          So seven points of stars on top of 0.6 points of math isn’t impossible arithmetic. It depends on how many schools were sitting just under a line last year. Which I’d love to check. The release doesn’t give the number of schools at each star level, this year or last, and none of the coverage I read had it either.
        </P>

        <Fig caption={<>Source: <a href="https://thedailyrecord.com/2026/10/30/half-maryland-public-schools-four-five-stars/" target="_blank" rel="noopener">Maryland Matters via The Daily Record</a> (Oct. 30, 2026): 964 schools (74%) had no change and about 252 (19%) went up one star. The 7% is derived (100 − 74 − 19) and isn’t described in the story.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22No+change+%2874%25%29%22%2C%22Up+one+star+%2819%25%29%22%2C%22Not+broken+out+%287%25%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B74%2C19%2C7%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Maryland+2026+Report+Card%3A+what+happened+to+each+school%27s+stars%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A80%2C%22stepSize%22%3A10%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+rated+schools%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&amp;v=2.9.4&amp;w=900&amp;h=480&amp;bkg=transparent&amp;devicePixelRatio=2" alt="Horizontal bar chart: 74% of Maryland schools had no change in star rating, 19% went up one star, 7% not broken out" />
        </Fig>

        <P>
          What did get published: <a href="https://thedailyrecord.com/2026/10/30/half-maryland-public-schools-four-five-stars/" target="_blank" rel="noopener">964 schools, 74%, didn’t move</a>. <a href="https://thedailyrecord.com/2026/10/30/half-maryland-public-schools-four-five-stars/" target="_blank" rel="noopener">About 252, or 19%, went up one star</a>. That leaves 7% (100 − 74 − 19) nobody describes. Went down? Newly rated? Up two? Dunno.
        </P>

        <H2>And the points aren’t all test scores</H2>

        <P>
          The indicators include achievement and progress, but also <a href="https://news.maryland.gov/msde/2026-maryland-report-card/" target="_blank" rel="noopener">school quality and student success</a>, and for high schools <a href="https://news.maryland.gov/msde/2026-maryland-report-card/" target="_blank" rel="noopener">graduation rate</a>. The state’s accountability chief credited the star gains to <a href="https://www.wypr.org/wypr-news/2026-10-29/half-of-schools-earn-four-or-five-star-ratings-in-final-iteration-of-maryland-report-card" target="_blank" rel="noopener">better test scores and less chronic absenteeism</a>. Absenteeism is the one that moved: <a href="https://news.maryland.gov/msde/2025-26-mcap-scores/" target="_blank" rel="noopener">31% in 2021-22</a>, <a href="https://news.maryland.gov/msde/2025-26-mcap-scores/" target="_blank" rel="noopener">25% in 2024-25</a>, <a href="https://thedailyrecord.com/2026/10/30/half-maryland-public-schools-four-five-stars/" target="_blank" rel="noopener">nearly 23% last year</a>. Two-ish points in a year. Math got 0.6.
        </P>

        <H2>Is this the last one? Depends who you read</H2>

        <P>
          MSDE’s release says the state is <a href="https://news.maryland.gov/msde/2026-maryland-report-card/" target="_blank" rel="noopener">redesigning the accountability system</a>, no date. WYPR called it <a href="https://www.wypr.org/wypr-news/2026-10-29/half-of-schools-earn-four-or-five-star-ratings-in-final-iteration-of-maryland-report-card" target="_blank" rel="noopener">the final round</a> and quoted the accountability chief <a href="https://www.wypr.org/wypr-news/2026-10-29/half-of-schools-earn-four-or-five-star-ratings-in-final-iteration-of-maryland-report-card" target="_blank" rel="noopener">expecting the stars to stay</a>. Maryland Matters wrote that this is <a href="https://thedailyrecord.com/2026/10/30/half-maryland-public-schools-four-five-stars/" target="_blank" rel="noopener">the last year for the star-rating system</a>. Three sources, three answers.
        </P>

        <P>
          The test part isn’t fuzzy. Last spring was <a href="https://news.maryland.gov/msde/2025-26-mcap-scores/" target="_blank" rel="noopener">the fifth and final full MCAP</a> for grades 3-8, and <a href="https://news.maryland.gov/msde/2025-26-mcap-scores/" target="_blank" rel="noopener">MSTAR starts in 2026-27</a>.
        </P>

        <Divider />

        <P>
          So whatever shows up next fall, stars or no stars, it sits on a different test. This year’s 50% is the last dot on this line. And I still don’t know how many schools were sitting at 59.
        </P>

        <H3>Sources</H3>
        <UL items={[
          <>Maryland State Department of Education, <a href="https://news.maryland.gov/msde/2026-maryland-report-card/" target="_blank" rel="noopener">MSDE Releases 2026 Maryland School Report Card Results</a> (Oct. 29, 2026): top-three and top-two star shares, indicators, accountability redesign</>,
          <>MSDE, <a href="https://news.maryland.gov/msde/2025-26-mcap-scores/" target="_blank" rel="noopener">State MCAP Scores Reach Five-Year High in English Language Arts and Mathematics</a> (July 28, 2026): 2025-26 proficiency, chronic absenteeism 2021-22 and 2024-25, MSTAR timeline</>,
          <>MSDE, <a href="https://news.maryland.gov/msde/state-assessment-scores-2025/" target="_blank" rel="noopener">State Assessment Scores Rising in Mathematics and English Language Arts</a> (Aug. 26, 2025): 2024-25 proficiency</>,
          <>WYPR, <a href="https://www.wypr.org/wypr-news/2026-10-29/half-of-schools-earn-four-or-five-star-ratings-in-final-iteration-of-maryland-report-card" target="_blank" rel="noopener">Half of schools earn four or five star ratings in final iteration of Maryland Report Card</a> (Oct. 29, 2026): 43% to 50%, what the state credits, whether stars continue</>,
          <>Maryland Matters via The Daily Record, <a href="https://thedailyrecord.com/2026/10/30/half-maryland-public-schools-four-five-stars/" target="_blank" rel="noopener">Half of MD schools earn four or five stars on latest report card</a> (Oct. 30, 2026): star cut points, schools that moved, 2025-26 chronic absenteeism</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

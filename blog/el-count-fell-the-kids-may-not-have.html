  title:   'The English learner count fell. The kids may not have.',
  dek:     'California’s English learner count fell by more than its whole enrollment did. Massachusetts lost 7,000 of them. Nobody publishing the numbers can say how many left school and how many just changed columns.',

    {children}

const Container = ({ children, style }) => (

    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================

      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>

        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      {/* Wordmark */}
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      {/* Meta row */}
      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>№ {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>

          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>

// ==================== Optional hero visual ====================
// Remove this block if the post doesn't have a lead visual.
const PostHero = () => (
  <Container>
    <figure style={{ maxWidth:900, margin:'0 auto 56px' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22All+students+-74%2C961%22%2C%22English+learners+-83%2C159%22%2C%22Everyone+else+%2B8%2C198%2A%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B-74961%2C-83159%2C8198%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22California%2C+2024-25+to+2025-26%3A+change+in+students%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22min%22%3A-100000%2C%22max%22%3A20000%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22students+%28change%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of California enrollment change: all students down 74,961, English learners down 83,159, everyone else up 8,198" style={{ width:'100%', height:'auto', display:'block' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>
        California public school enrollment change, 2024&ndash;25 to 2025&ndash;26. Source: <a href="https://www.cde.ca.gov/ds/cm/documents/dqae26.pdf" target="_blank" rel="noopener">CDE</a>. *&ldquo;Everyone else&rdquo; is derived: &minus;74,961 &minus; (&minus;83,159) = +8,198.
      </figcaption>

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>
//   <Divider />  (section break)
//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          California&rsquo;s public schools lost 74,961 students this year, down 1.3% to 5,731,260 (<a href="https://www.cde.ca.gov/ds/cm/dqae26.asp" target="_blank" rel="noopener">CDE</a>). English learners fell by 83,159. That&rsquo;s 8.2% (<a href="https://www.cde.ca.gov/ds/cm/documents/dqae26.pdf" target="_blank" rel="noopener">CDE annual enrollment flyer</a>).
        </P>

        <P>
          Read that again. The English learner column dropped by more than the whole state did. Subtract one from the other and everybody else, all together, went <em>up</em> by about 8,200 (derived: 83,159 &minus; 74,961). Either those kids are the only ones leaving, or some of them didn&rsquo;t leave at all. They just changed columns.
        </P>

        <H2>Two ways out of a column</H2>

        <P>
          EdSource says the drop &ldquo;could be attributed, in part, to students being reclassified as proficient in English&rdquo; (<a href="https://edsource.org/2026/declining-school-enrollment-california/756174" target="_blank" rel="noopener">EdSource</a>). No number attached. And there&rsquo;s a second exit. Transitional kindergarten grew 20.1% to 213,313 students (<a href="https://www.cde.ca.gov/ds/cm/dqae26.asp" target="_blank" rel="noopener">CDE</a>), and AB 2268 exempted TK students from the English language proficiency test, so fewer of them get flagged at all (<a href="https://edsource.org/2026/declining-school-enrollment-california/756174" target="_blank" rel="noopener">EdSource</a>). A kid who never gets tested never becomes a count.
        </P>

        <H2>Massachusetts has the same hole</H2>

        <P>
          Massachusetts enrollment fell by 15,442 to 900,490, the lowest since 1994, and there are 7,000 fewer English learners than a year ago (<a href="https://www.wbur.org/news/2026/01/09/massachusetts-k-12-enrollment-drops-student-state-data" target="_blank" rel="noopener">WBUR</a>). Close to half the loss. MassBudget gets 46% on a different measure, the foundation-budget count, which is weighted full-time equivalents and not a headcount (<a href="https://massbudget.org/2026/05/13/enrollment-decline-and-fiscal-pressure-in-massachusetts-public-schools-a-focus-on-english-learners/" target="_blank" rel="noopener">MassBudget</a>). Two counting methods, one answer. Nice.
        </P>

        <P>
          What none of the three pieces I read does is say how many of those English learners were reclassified and are still sitting in a classroom. The sources describe the drop as students leaving. They don&rsquo;t show the split. And the local numbers wobble: for Chelsea, MassBudget has about 230 fewer English learners, GBH has about 242, WBUR quotes a superintendent on losing 344 students overall.
        </P>

        <Fig caption={<>Massachusetts enrollment change, fall 2024 to fall 2025 (headcount). Source: <a href="https://www.wbur.org/news/2026/01/09/massachusetts-k-12-enrollment-drops-student-state-data" target="_blank" rel="noopener">WBUR</a>, citing state data (all students &minus;15,442; English learners about &minus;7,000). *&ldquo;Everyone else&rdquo; is derived: &minus;15,442 + 7,000 = &minus;8,442. Rounded inputs.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22All+students+-15%2C442%22%2C%22English+learners+-7%2C000%22%2C%22Everyone+else+-8%2C442%2A%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B-15442%2C-7000%2C-8442%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Massachusetts%2C+fall+2024+to+fall+2025%3A+change+in+students%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22min%22%3A-18000%2C%22max%22%3A2000%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22students+%28change%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of Massachusetts enrollment change: all students down 15,442, English learners down 7,000, everyone else down 8,442" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>The tidy story is probably partly true</H2>

        <P>
          Immigration enforcement is the obvious suspect. Texas reported 14,200 fewer immigrant students, a 7% drop (<a href="https://www.texastribune.org/2026/09/30/immigrant-students-enrollment-texas-schools/" target="_blank" rel="noopener">Texas Tribune</a>). But read the definition: not born in the U.S. and not in school in any state for more than three full academic years. Districts don&rsquo;t ask about status. A student who&rsquo;s been here four years has aged out of the count without moving an inch. The Tribune&rsquo;s own headline says the true number is likely higher, and that the cause is unclear.
        </P>

        <P>
          There is real evidence of an attendance effect. A Brown working paper using one district&rsquo;s daily records finds the probability of absence among foreign-born students rose 2.2 percentage points after January 2025 (<a href="https://edworkingpapers.com/sites/default/files/ai26-1453.pdf" target="_blank" rel="noopener">EdWorkingPaper 26-1453</a>). One district. Attendance, not enrollment.
        </P>

        <Divider />

        <P>
          An enrollment file counts a child. An English learner flag counts a test result and a date. When the flag count falls, nobody can tell you the child did. Somebody should pull reclassification rates next to it before the headline picks a reason.
        </P>

      </article>
    </Prose>
  </Container>
);

const H2 = ({ children }) => <h2>{children}</h2>;

const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Two thousand. That&rsquo;s the year the United States eliminated measles. Twenty years of vaccination, then a press release. As of May 14, the CDC has confirmed <a href="https://www.cdc.gov/measles/data-research/index.html">1,893 measles cases for 2026</a> &mdash; the second-worst year since elimination, with seven months still to go. Last year was the worst: <a href="https://www.cdc.gov/measles/data-research/index.html">2,283 confirmed cases in 2025</a>, the highest count since 1992.
        </P>

        <P>
          Eliminated isn&rsquo;t gone. The official definition is narrower than the word: the <a href="https://www.cdc.gov/measles/data-research/index.html">absence of endemic measles transmission in a region for at least 12 months in the presence of a well-performing surveillance system</a>. A single virus chain that runs 365 consecutive days from one import undoes the whole status. It&rsquo;s a clock. The clock is running. The CDC hasn&rsquo;t told us from when.
        </P>

        <P>
          That&rsquo;s mostly because the surveillance system is the timer, and the timer is slow.
        </P>

        <H2>Two clusters, almost all the cases</H2>

        <P>
          South Carolina&rsquo;s Upstate outbreak &mdash; which started in October 2025 and was <a href="https://scdailygazette.com/2026/04/27/nations-largest-measles-outbreak-is-over-sc-health-officials-say/">declared ended on April 28, 2026, at 997 confirmed cases</a> &mdash; is the <a href="https://www.cnn.com/2026/04/27/health/south-carolina-measles-outbreak-over">largest single U.S. outbreak in 35 years</a>. The <a href="https://www.knau.org/knau-and-arizona-news/2026-04-03/measles-outbreak-along-arizona-utah-border-surpasses-500-cases">Utah&ndash;Arizona border outbreak crossed 500 cases by early April</a> and is still active. Of the 1,893 cases CDC has confirmed this year, <a href="https://www.cdc.gov/measles/data-research/index.html">1,761 &mdash; 93% &mdash; are tied to one of 27 outbreaks running across 40 jurisdictions</a>. The other 132 are sporadic.
        </P>

        <P>
          That ratio is the part of this story that has been getting worse the longest.
        </P>

        <Fig caption={<>U.S. measles cases by outbreak status, 2024&ndash;2026. Outbreak-associated share: 69% in 2024, 90% in 2025, 93% in 2026 YTD. Sporadic-case totals derived by subtraction (285&minus;198, 2,283&minus;2,045, 1,893&minus;1,761). Source: <a href="https://www.cdc.gov/measles/data-research/index.html">CDC Measles Cases and Outbreaks</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222024%22%2C%222025%22%2C%222026+YTD%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Outbreak-associated%22%2C%22data%22%3A%5B198%2C2045%2C1761%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%2C%22stack%22%3A%22s%22%7D%2C%7B%22label%22%3A%22Sporadic%22%2C%22data%22%3A%5B87%2C238%2C132%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22borderWidth%22%3A0%2C%22stack%22%3A%22s%22%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+measles+cases+by+outbreak+status%2C+2024%5Cu20132026+YTD%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Atrue%2C%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22stacked%22%3Atrue%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Year+%28CDC%3B+sporadic+totals+derived+by+subtraction%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22stacked%22%3Atrue%2C%22ticks%22%3A%7B%22min%22%3A0%2C%22max%22%3A2500%2C%22stepSize%22%3A500%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Confirmed+cases%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2" alt="Stacked bar chart of measles cases by outbreak status, 2024 to 2026" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <H2>What the system is built to do</H2>

        <P>
          I&rsquo;m not an epidemiologist. I run a data company. What I know is reporting pipelines.
        </P>

        <P>
          CDC publishes confirmed cases <a href="https://www.cdc.gov/measles/data-research/index.html">notified to it as of noon on Thursdays</a>. Those notifications come from state health departments, which got them from county or city public health offices, which got them from clinicians who ran a confirmatory lab test on a patient who walked in after rash onset. The chain from &ldquo;person infected&rdquo; to &ldquo;national figure&rdquo; runs about two weeks in the best case and longer in places without a working public-health office on top of it.
        </P>

        <P>
          That&rsquo;s a known problem for any outbreak. It&rsquo;s a different kind of problem for the 12-month-continuous-transmission threshold. To certify that we <em>did not</em> sustain transmission for 12 months, somebody has to point at the last confirmed case, count forward, and say nothing came after that. Each state runs the count on its own clock. The CDC stitches them. The verification panel &mdash; the <a href="https://www.cdc.gov/measles/about/history.html">WHO Region of the Americas commission</a>, which made the original 2000 determination &mdash; moves on years, not weeks.
        </P>

        <P>
          So when does the clock start? Retrospectively. When an unbroken chain of transmission can be drawn from a confirmed case to a later one across more than 12 months. Genomic sequencing draws that line in the best case. When a chain seems to break and resumes a few months later, the question of whether it really broke or merely went dark is a judgment call that gets made a year after the fact, by a body that meets twice.
        </P>

        <H2>The UK ran this play</H2>

        <P>
          The UK eliminated measles in 2017. <a href="https://www.gavi.org/vaccineswork/what-does-it-mean-lose-measles-free-status-and-can-countries-get-it-back">In 2019, the WHO determined it had lost the status, based on a B3 Dublin strain that had circulated continuously across 2017 and 2018</a>. Nobody said in real time, &ldquo;this is the chain.&rdquo; The chain was identified after the fact. The status was withdrawn after the fact. The UK has not regained it.
        </P>

        <H2>The leading indicator nobody puts on the dashboard</H2>

        <P>
          CDC publishes one chart that doesn&rsquo;t get the same attention as the case count: MMR coverage for kindergarteners. In 2019&ndash;2020 it was 95.2% &mdash; just at the herd-immunity threshold. In 2024&ndash;2025 it was <a href="https://www.cdc.gov/measles/data-research/index.html">92.5%, leaving about 286,000 kindergartners unprotected</a>. That&rsquo;s not the leading indicator of an outbreak. It&rsquo;s the leading indicator of why this outbreak doesn&rsquo;t have to end.
        </P>

        <Callout label="The number that moved">
          U.S. measles cases by outbreak status: 198 of 285 in 2024 (69%). 2,045 of 2,283 in 2025 (90%). 1,761 of 1,893 in 2026 to date (93%). <a href="https://www.cdc.gov/measles/data-research/index.html">CDC</a>.
        </Callout>

        <P>
          The share of cases attached to sustained chains has climbed every year. The share attached to one-off imports has fallen. Two bad years on a stale dashboard look like noise. Two bad years in a row, with the outbreak share rising in both, with a 500-case chain still running, look like the thing the 12-month clock was written to detect.
        </P>

        <Divider />

        <P>
          Eliminated isn&rsquo;t gone. It&rsquo;s a clock. The clock is running. The data system that would tell us how long it has been running is calibrated for a world in which it doesn&rsquo;t matter.
        </P>

        <P>

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <P>Paragraph text.</P>

const Divider = () => <hr />;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In 2015, 49.5% of Washington girls who took the state math test met the standard. For boys it was 48.9%. Girls were ahead (<a href="https://data.wa.gov/d/7a92-jdsy">OSPI</a>). By 0.6 points, which is nothing, and which was the whole point: the math gender gap was one of the few education gaps that had actually closed.
        </P>

        <P>
          Then the pandemic happened, and everybody started writing about boys. Fair enough. Boys have a real reading problem: in Washington&rsquo;s 2026 results girls lead boys in ELA by 7.5 points, 56.6% to 49.1% (<a href="https://data.wa.gov/d/9fjj-2374">OSPI</a>). But I keep not seeing anyone write up the other column.
        </P>

        <H2>The other column</H2>

        <P>
          In 2019, 49.7% of girls and 50.5% of boys met the math standard (<a href="https://data.wa.gov/d/6rue-47ak">OSPI</a>). In 2022, the first year after the gap in the files, it was 38.1% and 41.9%. So girls lost 11.6 points and boys lost 8.6. And every year since, the gap has gotten wider: 3.8 points in 2022, then 4.0, 4.6, 4.9, and 4.9 again in 2026, when it was 40.5% for girls and 45.5% for boys (<a href="https://data.wa.gov/d/9fjj-2374">OSPI</a>, <a href="https://data.wa.gov/d/fusr-6kv7">2025-26 file</a>). Girls are still 9.2 points under their 2019 number. Boys are 5.0 under.
        </P>

        <Fig caption={<>Girls minus boys, percentage points, share meeting standard, Washington, 2022 to 2026. Math is negative (boys ahead), ELA is positive (girls ahead). Source: <a href="https://data.wa.gov/d/9fjj-2374">OSPI, 2021-22 to present</a>. Arithmetic: 2026 math is 40.55 &minus; 45.49 = &minus;4.94; 2026 ELA is 56.63 &minus; 49.09 = 7.54.</>}>
          <img src={'https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222022%22%2C%222023%22%2C%222024%22%2C%222025%22%2C%222026%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Math%22%2C%22data%22%3A%5B-3.77%2C-4.02%2C-4.58%2C-4.86%2C-4.94%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.8%2C%22categoryPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%22ELA%22%2C%22data%22%3A%5B8.4%2C7.63%2C8.01%2C7.78%2C7.54%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22barPercentage%22%3A0.8%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontFamily%22%3A%22Georgia%22%2C%22fontSize%22%3A14%2C%22min%22%3A-8%2C%22max%22%3A10%2C%22stepSize%22%3A2%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Girls+minus+boys%2C+percentage+points%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontFamily%22%3A%22Georgia%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2'} alt="Bar chart of the girls-minus-boys gap in Washington, 2022 to 2026. Math bars are negative and grow from 3.8 to 4.9 points; ELA bars are positive at roughly 7.5 to 8.4 points." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Not a reading thing, then. Girls still beat boys in ELA by a margin that barely moved. The math gap is its own animal.
        </P>

        <P>
          And Washington isn&rsquo;t alone. Utah&rsquo;s boys-over-girls gap went from 1.8 points in 2016 to 7.3 in 2026 (<a href="https://statetestscoreresults.substack.com/p/utah-2026-assessment-results">Education Data Center</a>). In California, girls had higher math scores in 62% of districts in 2018-19 and 4% in 2023-24 (<a href="https://edsource.org/2025/math-gender-gap-california/740113">EdSource</a>). Across the 33 states in the AP analysis, boys came out ahead in nearly 9 of 10 districts in 2023-24 (<a href="https://www.chalkbeat.org/2025/09/05/math-gender-gap-returns-after-pandemic-schools-try-to-recover/">Chalkbeat</a>).
        </P>

        <H2>Three files and an afternoon</H2>

        <P>
          Now the part that&rsquo;s actually my job. To draw that first chart I had to stitch together three public files from Washington&rsquo;s open data portal. The early years call the measure &ldquo;percent met standard.&rdquo; The later ones call it &ldquo;consistent grade level knowledge and above (including previously passed).&rdquo; Same idea, different column, different file. In the 2022-23 file the number of girls tested (275,165) is bigger than the number expected to test (272,672). That&rsquo;s probably a quirk (I&rsquo;m not saying the data is wrong, I&rsquo;m saying it&rsquo;s weird). And nothing I pulled has a 2020 or 2021 point, which is why the line in the chart jumps.
        </P>

        <P>
          I couldn&rsquo;t find a single table that hands you this picture. I built it. And I don&rsquo;t have a why: these files count kids, not reasons.
        </P>

        <Divider />

        <P>
          One of these stories has a hashtag. The other took three files and an afternoon.
        </P>

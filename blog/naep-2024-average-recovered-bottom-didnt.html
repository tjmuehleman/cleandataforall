  title:   'The average recovered. The bottom didn’t.',

const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 0 56px', borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'40px 0' }}>
      <img
        src="https://quickchart.io/chart/render/zf-408ea142-e3a8-4631-ba29-0a6887fa959b"
        alt="Horizontal bar chart showing NAEP reading score decline from 2019 to 2024: Grade 4 down 5 points, Grade 8 down 5 points, Grade 12 down 3 points."
        style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
      />

        <a href="https://www.nagb.gov/news-and-events/news-releases/2025/declines-in-8th-grade-science-and-12th-grade-math-and-reading.html">NAGB</a> (grade 12, Sept. 2025).

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Late January 2025, the Nation&#8217;s Report Card dropped its grades 4 and 8 reading results, and
          education press had the reaction it usually has to a nuanced dataset: find the good news, lead with it.
          Average 4th grade math was up two points. A handful of urban districts posted double-digit gains.
          &#8220;Recovery&#8221; showed up in a lot of ledes. None of that coverage was wrong. It&#8217;s just
          that the average is doing a lot of work it wasn&#8217;t designed to do.
        </P>

        <P>
          Here&#8217;s the distribution underneath it.
          The <a href="https://www.nationsreportcard.gov/reports/reading/2024/g4_8/national-trends/?grade=4">national
          average 4th grade reading score in 2024 is 5 points below 2019</a> &#8212; not great, but not the
          alarm either. The 90th percentile (the top performers) was essentially flat from
          pre-pandemic levels. And the lowest-performing fourth graders?{' '}
          <a href="https://www.chalkbeat.org/2025/01/29/naep-reading-scores-decline-and-struggling-students-fall-behind/">The
          worst NAEP reading scores in 32 years.</a> Same pattern at 8th grade. And when NAGB released the
          12th grade data in September 2025, it was three for three:{' '}
          <a href="https://www.nagb.gov/news-and-events/news-releases/2025/declines-in-8th-grade-science-and-12th-grade-math-and-reading.html">scores
          declined across all percentiles except the 90th.</a>
        </P>

        <H2>The divergence</H2>

        <P>
          This is what people in the assessment world call distributional divergence. The pandemic didn&#8217;t
          uniformly suppress learning and then uniformly release it &#8212; it stretched the distribution.
          Between 2022 and 2024, the years when the average started to look like recovery,{' '}
          <a href="https://www.eschoolnews.com/educational-leadership/2025/02/06/naep-scores-disheartening-trends-lowest-performing-students/">pandemic
          learning losses for the bottom 10% of readers grew 70% larger, not smaller.</a> For students in the
          bottom 25%, losses grew 25% larger. The average recovered because the top held. The bottom kept falling.
        </P>

        <Callout label="Key figure">
          <strong>70% larger.</strong> That&#8217;s how much pandemic learning losses grew for the bottom decile of
          U.S. readers between 2022 and 2024 &#8212; the same two years when national average scores were
          trending toward &#8220;recovery.&#8221;{' '}
          Source: <a href="https://www.eschoolnews.com/educational-leadership/2025/02/06/naep-scores-disheartening-trends-lowest-performing-students/">eSchoolNews
          / NAGB analysis</a>.
        </Callout>

        <P>
          <a href="https://www.chalkbeat.org/2025/01/29/naep-reading-scores-decline-and-struggling-students-fall-behind/">Forty
          percent of 4th graders scored below NAEP Basic in 2024</a> &#8212; the highest share in 20 years.{' '}
          <a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/10-takeaways-from-2024-naep-results.html">A
          third of 8th graders scored below NAEP Basic</a> &#8212; the greatest share ever recorded.{' '}
          <a href="https://www.nagb.gov/news-and-events/news-releases/2025/declines-in-8th-grade-science-and-12th-grade-math-and-reading.html">Thirty-two
          percent of 12th graders scored below NAEP Basic</a> &#8212; also the greatest share ever. Three grade
          levels, three historic firsts, all happening inside the same year &#8220;recovery&#8221; was the
          dominant frame.
        </P>

        <Fig caption={
          <>
            Source:{' '}
            <a href="https://www.nationsreportcard.gov/reports/reading/2024/g4_8/">NCES / Nation&#8217;s Report Card</a> (grades 4 and 8);{' '}
            <a href="https://www.nagb.gov/news-and-events/news-releases/2025/declines-in-8th-grade-science-and-12th-grade-math-and-reading.html">NAGB</a>{' '}
            (grade 12 Sept. 2025 release). All three percentages represent the share of students scoring below{' '}
            the NAEP Basic achievement level &#8212; partial mastery of grade-level skills &#8212; and all three{' '}
            are at or near historic highs for their respective grades.
          </>
        }>
          <img
            src="https://quickchart.io/chart/render/zf-7a7ed805-4385-4f1b-b669-cd9e3c238122"
            alt="Bar chart showing percentage of students below NAEP Basic in reading, 2024: 4th grade 40%, 8th grade 33%, 12th grade 32%."
            style={{ width:'100%', display:'block' }}
          />
        </Fig>

        <H2>What the reporting system is missing</H2>

        <P>
          Here&#8217;s the part that keeps me up &#8212; and it&#8217;s the data-systems angle, not the policy one.
          NCES publishes national averages. State DOEs publish state averages and proficiency rates. Neither of
          those is built to catch what&#8217;s happening at the bottom of the distribution in anything like
          real time. Your state&#8217;s NAEP number is a two-year-lagged sample average. Your state&#8217;s own
          assessment publishes one proficiency rate and one average scale score. Neither tells you whether the
          10th percentile is falling while the 75th is recovering. For that you need the percentile table &#8212;
          which NAEP publishes, every two years, with an 18-month lag, for a sample.
        </P>

        <P>
          The 33% of 8th graders below NAEP Basic aren&#8217;t evenly distributed. They cluster in high-poverty
          districts, in schools without reading coaches, in places where the state assessment probably already
          flagged a problem but wasn&#8217;t built to report whether the gap is actively widening.
          &#8220;Below proficient&#8221; and &#8220;below proficient and accelerating downward&#8221; look exactly
          the same in most state dashboards. One of them requires a very different response.
        </P>

        <P>
          <a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/10-takeaways-from-2024-naep-results.html">Louisiana
          was the only state in the country to exceed its 2019 4th grade reading score.</a> One state. And on the
          500-point NAEP scale, the lowest-performing students now score{' '}
          <a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/10-takeaways-from-2024-naep-results.html">roughly
          100 points below the highest-performing students</a> &#8212; a gap that has been widening for more than
          a decade and that 2024 made worse. The next NAEP cycle runs in 2026. The question isn&#8217;t what
          NAEP will find. It&#8217;s what measurement system anybody is running between now and then for the
          kids at the bottom of the distribution.
        </P>

        <Divider />

        <P>
          The average recovered. For some kids.
        </P>

        <P>
          <em>&#8212; TJ</em>
        </P>

        <Divider />

        <H2>Sources</H2>

        <P>
          <a href="https://www.nationsreportcard.gov/reports/reading/2024/g4_8/national-trends/?grade=4">NCES &#8212; NAEP 2024 Reading: National Trends and Student Skills</a>.
          Primary source for grade 4 and 8 national average score changes (5 points below 2019, 2 points below 2022),
          90th-percentile trend (unchanged from 2022), and 40% of 4th graders below NAEP Basic.
        </P>

        <P>
          <a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/10-takeaways-from-2024-naep-results.html">NAGB &#8212; 10 Takeaways from the 2024 NAEP Results</a>.
          Source for: Louisiana as only state above 2019 reading levels; one-third of 8th graders below NAEP Basic
          (greatest share ever); 100-point gap between top and bottom performers.
        </P>

        <P>
          <a href="https://www.nagb.gov/news-and-events/news-releases/2025/declines-in-8th-grade-science-and-12th-grade-math-and-reading.html">NAGB &#8212; Nation&#8217;s Report Card: 8th Grade Science and 12th Grade Math and Reading (Sept. 2025)</a>.
          Source for grade 12 results: 3 points below 2019, 32% below NAEP Basic (greatest ever), and score
          declines across all percentiles except the 90th.
        </P>

        <P>
          <a href="https://www.chalkbeat.org/2025/01/29/naep-reading-scores-decline-and-struggling-students-fall-behind/">Chalkbeat &#8212; &#8220;Struggling students just posted their worst NAEP reading scores in 32 years&#8221;</a> (Jan. 29, 2025).
          Source for the 32-year-low characterization and the 40% below-Basic figure for 4th grade.
        </P>

        <P>
          <a href="https://www.eschoolnews.com/educational-leadership/2025/02/06/naep-scores-disheartening-trends-lowest-performing-students/">eSchoolNews &#8212; &#8220;NAEP scores show disheartening trends for the lowest-performing students&#8221;</a> (Feb. 6, 2025).
          Source for: pandemic learning losses for the bottom 10% grew 70% larger between 2022 and 2024;
          bottom-25% losses grew 25% larger.
        </P>

      </article>
    </Prose>
  </Container>
);

      <style>{`
        @media (max-width: 820px){
          .cdfa-colophon{ grid-template-columns: 1fr !important; }
        }
      `}</style>
    </footer>
  );
};

function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

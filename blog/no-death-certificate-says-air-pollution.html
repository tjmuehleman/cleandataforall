      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Read the State of Global Air 2025 report and you land on a very confident number.
          Air pollution killed{' '}
          <a href="https://www.stateofglobalair.org/news-events/2025/new-state-global-air-2025-report-shows-nearly-nine-ten-global-air-pollution-deaths">7.9 million people in 2023</a>,
          the report says &mdash; the leading environmental risk factor for death on the
          planet. And this year, for the first time, the toll includes{' '}
          <a href="https://www.stateofglobalair.org/news-events/2025/new-state-global-air-2025-report-shows-nearly-nine-ten-global-air-pollution-deaths">more than 625,000 deaths from dementia</a>.
        </P>

        <P>
          Here&rsquo;s the thing nobody says at the top of the press release. No death
          certificate anywhere on Earth says &ldquo;air pollution.&rdquo;
        </P>

        <P>
          Not one of those 7.9 million people has a cause of death that reads PM2.5. They
          died of heart disease, stroke, COPD, diabetes, dementia &mdash; the boring, named
          killers that fit on the form.{' '}
          <a href="https://www.stateofglobalair.org/news-events/2025/new-state-global-air-2025-report-shows-nearly-nine-ten-global-air-pollution-deaths">Eighty-six percent of them, 6.8 million, from noncommunicable disease</a>.
          Air pollution isn&rsquo;t on the certificate. It&rsquo;s a thing you add afterward,
          in a model.
        </P>

        <H2>The number is a fraction, not a headcount</H2>

        <P>
          What the report is actually reporting is an <em>attributable</em> death. You take
          the deaths that got counted &mdash; the ones on certificates, in registries, with
          a disease and a date &mdash; and you multiply by a fraction: the share you&rsquo;d
          expect to vanish if everyone breathed cleaner air. That fraction comes from a
          relative risk, which comes from a stack of epidemiology studies, which come from
          cohorts in a handful of countries. Multiply, sum, publish. Out comes 625,000.
        </P>

        <P>
          For dementia, the fraction is{' '}
          <a href="https://healthpolicy-watch.news/air-pollution-related-dementia-kills-over-625000-people-a-year/">about 28%</a>.
          So the report isn&rsquo;t saying 625,000 people were killed by air the way 625,000
          people are killed by a bus. It&rsquo;s saying: of all the dementia deaths in 2023,
          roughly 28 in every 100 wouldn&rsquo;t have happened in a cleaner-air world that
          doesn&rsquo;t exist. That&rsquo;s a real number. A defensible, useful, hard-won
          number. It is not a body count. Those are two different data objects, and they get
          printed in the same font.
        </P>

        <Fig caption={<>Dementia deaths in 2023, split by the attributable fraction: 28% assigned to air pollution (about 625,000 deaths), 72% the residual (100% &minus; 28%). Source: <a href="https://healthpolicy-watch.news/air-pollution-related-dementia-kills-over-625000-people-a-year/">State of Global Air 2025 / IHME GBD 2023, via Health Policy Watch</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Dementia+deaths%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Attributed+to+air+pollution+%2828%25%29%22%2C%22data%22%3A%5B28%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Not+attributed+%2872%25%29%22%2C%22data%22%3A%5B72%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Share+of+dementia+deaths+attributed+to+air+pollution%2C+2023%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22stacked%22%3Atrue%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+dementia+deaths%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22stacked%22%3Atrue%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Stacked horizontal bar showing 28% of dementia deaths attributed to air pollution and 72% not attributed." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <Callout label="Key figure">
          Air pollution is tied to <strong>28%</strong> of dementia deaths &mdash; about{' '}
          <strong>625,000 deaths</strong> and{' '}
          <a href="https://www.stateofglobalair.org/news-events/2025/new-state-global-air-2025-report-shows-nearly-nine-ten-global-air-pollution-deaths">nearly 12 million healthy years of life lost</a>{' '}
          in 2023. Attributed, not counted.
        </Callout>

        <H2>And the confidence doesn&rsquo;t fade where the counting gets worse</H2>

        <P>
          Here&rsquo;s where the data guy in me gets twitchy. The 7.9 million deaths{' '}
          <a href="https://healthpolicy-watch.news/air-pollution-related-dementia-kills-over-625000-people-a-year/">break out by income group</a>:
          3.7 million in lower-middle-income countries, 2.9 million in upper-middle, 657,000
          in high-income, 642,000 in low-income. Look at the hero chart again. Look at where
          the mass sits.
        </P>

        <P>
          The biggest tolls land in exactly the places with the thinnest vital registration
          &mdash; the countries least likely to have a doctor sign a cause-of-death line at
          all. High-income countries, where nearly every death gets a certificate, are the
          smallest slice on the page. Which means most of that 7.9 million isn&rsquo;t built
          on death certificates. It&rsquo;s built on models of what the certificates would
          have said, layered on models of who was exposed to what, layered on the
          attributable fractions from the top. Models most of the way down. And the total
          still comes out to three significant figures.
        </P>

        <P>
          I run a data company. I spend my days reminding people that a modeled estimate and
          a counted thing are not the same animal, even when they wear the same number. This
          is that, at planetary scale, with 7.9 million lives as the line item.
        </P>

        <Divider />

        <P>
          None of this is a knock on the report. Attributable-burden estimates are how you
          make an invisible risk factor legible. You can&rsquo;t regulate what you refuse to
          count, and &ldquo;roughly zero, because it&rsquo;s not on the certificate&rdquo; is
          a much worse answer than 28%. I&rsquo;ll take the model every time.
        </P>

        <P>
          But say which number you&rsquo;re holding. A counted death is a fact with a date
          and a name. An attributable death is a hypothesis with an error bar. The report
          itself knows the difference &mdash; it&rsquo;s all over the methods. The headline
          almost never does.
        </P>

        <P>
          7.9 million is the best estimate we have. It is also, to the last digit, an
          estimate.
        </P>

        <P><em>&mdash; TJ</em></P>

        <H2>Sources</H2>
        <UL items={[

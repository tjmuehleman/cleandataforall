const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Every spring the chronic-absenteeism numbers land and the headline writes itself: &#8220;progress,
          but slow.&#8221; The slope is what nobody reads.
        </P>

        <P>
          Pre-pandemic, by the federal definition (a student missing 10% or more of school days &#8212;
          usually 18 days a year), the country sat at{' '}
          <a href="https://www.aei.org/research-products/report/long-covid-for-public-schools-chronic-absenteeism-before-and-after-the-pandemic/">about
          15% chronic absenteeism in 2018&#8211;19</a>. It{' '}
          <a href="https://www.aei.org/research-products/report/lingering-absence-in-public-schools-tracking-post-pandemic-chronic-absenteeism-into-2024/">peaked
          at 28.5% in 2022</a>. 2023: 25.4%. 2024: 23.5%. Year-over-year gains were 3.1 points, then
          1.9 points. Roughly half the size each round.
        </P>

        <P>
          The 2024&#8211;25 data is now starting to come in. AEI&#8217;s{' '}
          <a href="https://www.aei.org/op-eds/progress-on-absenteeism-is-stalling-what-can-we-do-about-it/">working
          count, 39 states and DC reporting</a>, puts the average year-over-year drop at &#8220;just over
          1 percentage point&#8221; &#8212; and six states are <em>up</em>. FutureEd&#8217;s earlier
          early-look from 27 states{' '}
          <a href="https://www.future-ed.org/tracking-state-trends-in-chronic-absenteeism/">pegged the
          national 2024&#8211;25 number around 21%</a>. Whichever you take, the recovery slope shrank again.
        </P>

        <Fig caption={<>Sources: 2022&#8594;2023 (28.5% &#8594; 25.4%) and 2023&#8594;2024 (25.4% &#8594; 23.5%) from <a href="https://www.aei.org/research-products/report/lingering-absence-in-public-schools-tracking-post-pandemic-chronic-absenteeism-into-2024/">AEI, <em>Lingering Absence in Public Schools</em></a>. The 2024&#8594;2025 working figure (~1.1 points) is the &#8220;just over 1 percentage point&#8221; average reported by <a href="https://www.aei.org/op-eds/progress-on-absenteeism-is-stalling-what-can-we-do-about-it/">Malkus (AEI, Feb 2026)</a>, with 39 states and DC reporting. Bar lengths represent the absolute size of each year&#8217;s improvement; each one roughly half the size of the last.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222022+%5Cu2192+2023%22%2C%222023+%5Cu2192+2024%22%2C%222024+%5Cu2192+2025+%28prelim.%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Year-over-year+improvement+%28pp%29%22%2C%22data%22%3A%5B3.1%2C1.9%2C1.1%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Each+year%5Cu2019s+recovery+is+about+half+the+size+of+the+last%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A4%2C%22stepSize%22%3A1%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percentage-point+drop+in+U.S.+chronic+absenteeism+rate%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of year-over-year percentage-point improvement in chronic absenteeism: 3.1 points (2022 to 2023), 1.9 points (2023 to 2024), 1.1 points (2024 to 2025, preliminary). Each bar is roughly half the length of the last."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          If you&#8217;ve ever modeled customer churn for a SaaS business or run regression on a
          global-health program&#8217;s enrollment, you&#8217;ve seen this shape. The first interventions
          move the big stuff. Successive interventions fight diminishing returns. The curve doesn&#8217;t
          converge on zero. It converges on whatever the steady state turned out to be.
        </P>

        <P>
          Nat Malkus at AEI, who runs the <a href="https://www.returntolearntracker.net/">Return to Learn
          Tracker</a> (the cleanest open dataset on chronic absenteeism),{' '}
          <a href="https://www.aei.org/op-eds/progress-on-absenteeism-is-stalling-what-can-we-do-about-it/">said
          the corollary plainly</a>: at the current pace, pre-pandemic levels aren&#8217;t reached until
          2029. If the deceleration continues, the country may stall north of 20% indefinitely.
        </P>

        <H2>The state spread is what nobody puts in the headline</H2>

        <P>
          23.5% is an average of averages. The spread is the story.{' '}
          <a href="https://www.aei.org/op-eds/progress-on-absenteeism-is-stalling-what-can-we-do-about-it/">Iowa:
          down 6 percentage points</a> year over year &#8212; the largest single-state drop in the country.
          Delaware, Nevada, Kentucky: each down more than 3 points. Most other states moving less than
          one. Six moving up.
        </P>

        <P>
          If Iowa figured something out, the question is whether it travels. Each state runs its own
          absenteeism reporting on its own timeline. Each one has its own definitional drift, its own
          data pipeline, its own annual cadence. Whatever Iowa did, every other state has its own back-end
          to retrofit before they can copy it.
        </P>

        <P>
          The urban/rural split is uglier.{' '}
          <a href="https://www.rand.org/pubs/research_reports/RRA956-34.html">RAND&#8217;s American
          School District Panel for 2024&#8211;25</a> found that in roughly half of urban districts, more
          than 30% of students are chronically absent &#8212; running five to six times more likely than
          rural or suburban districts to be in that &#8220;extreme&#8221; tier. AEI&#8217;s earlier
          district-level work showed{' '}
          <a href="https://www.aei.org/research-products/report/lingering-absence-in-public-schools-tracking-post-pandemic-chronic-absenteeism-into-2024/">high-minority
          districts went from 17% to 32% chronic absenteeism between 2018 and 2022 &#8212; a 15-point
          jump &#8212; while low-minority districts went 13% to 23%, a 10-point jump</a>. The recovery
          is decelerating from a level that was never one number to begin with.
        </P>

        <H2>The data system is auditing the autopsy</H2>

        <P>
          I run a data company. The thing that bugs me isn&#8217;t the slope. It&#8217;s that the system
          measuring this &#8212; 50 state ed-data offices, federal CRDC files on a two-year lag, RAND&#8217;s
          panel survey, AEI&#8217;s tracker stitching all of it together &#8212; is counting kids who
          already missed the year. There is no real-time signal. By the time &#8220;chronic&#8221; is
          confirmed at the state level, we&#8217;re 12 to 18 months downstream from the kid who didn&#8217;t
          show up. The 2024&#8211;25 numbers will land cleanly around when that same kid starts the{' '}
          <em>next</em> school year.
        </P>

        <P>
          That&#8217;s not actionable. That&#8217;s an autopsy.
        </P>

        <P>
          You can run an early-warning model on individual student attendance. The kids missing 5 of the
          first 20 school days will, with high probability, miss 18+ for the year. That&#8217;s a model
          you can run on a Tuesday in week four. Nobody has to wait for the state file.{' '}
          <a href="https://www.aei.org/research-products/report/need-not-be-a-surprise-early-warning-systems-for-chronic-absenteeism/">AEI
          itself argues districts that do this see meaningfully lower rates</a>.
        </P>

        <Callout label="Key figure">
          A 23.5% headline that lands 14 months after the data was generated isn&#8217;t telling districts
          what to do. It&#8217;s telling them what already happened. Again. In smaller increments each
          time.
        </Callout>

        <Divider />

        <P>
          The chronic-absenteeism number is a leading indicator of nothing. It&#8217;s a lagging indicator
          of a curve that&#8217;s leveling off above the place we used to call normal.
        </P>

        <P style={{ fontStyle:'italic', color:'var(--muted)' }}>&#8212; TJ</P>

      </article>
    </Prose>
  </Container>
);

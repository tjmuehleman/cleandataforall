// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <div style={{ borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'32px 0', margin:'0 0 56px' }}>
      <figure style={{ margin:0, maxWidth:900, marginLeft:'auto', marginRight:'auto' }}>
        <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22HHS+release+subhead%3A+268%2C000%22%2C%22HHS+release+body%3A+236%2C000%22%2C%22The+rule%27s+own+RIA%3A+162%2C094%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Thousands+of+slots%22%2C%22data%22%3A%5B268%2C236%2C162.1%5D%2C%22backgroundColor%22%3A%5B%22%23999%22%2C%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%2C%22barPercentage%22%3A0.68%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22Three+official+slot+counts%2C+one+agency%2C+one+week%22%2C%22Head+Start+NPRM%2C+published+August+7%2C+2026%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A300%2C%22stepSize%22%3A50%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Thousands+of+Head+Start+%2F+Early+Head+Start+slots%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart comparing three official Head Start slot counts: HHS press release subhead 268,000, HHS press release body 236,000, and the rule's own regulatory impact analysis 162,094." style={{ width:'100%', height:'auto', display:'block' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>
//   <Divider />  (section break)
//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The Head Start press release and the Head Start rule went out one day apart. They do not
          agree on how many slots the rule creates.
        </P>

        <P>
          On August 6, HHS announced <a href="https://www.hhs.gov/press-room/acf-proposes-head-start-reforms-expand-access.html">&ldquo;Reducing Federal Burden for Head Start Programs.&rdquo;</a> The body of that release
          says the rule is &ldquo;projected to preserve or expand as many as 236,000 Head Start slots
          nationwide and save $2.2 billion.&rdquo; The subhead sitting on the same page &mdash; the line that
          becomes the meta description, the thing that shows up when somebody pastes the link into
          Slack &mdash; says <em>Up to 268,000 New Slots</em>.
        </P>

        <P>
          The next day the actual rule <a href="https://www.federalregister.gov/documents/2026/08/07/2026-16134/reducing-federal-burden-for-head-start-programs">hit the Federal Register</a>. Its regulatory impact analysis says the
          savings &ldquo;may translate into increases in funded slots, including approximately 116,516 new
          Head Start Preschool slots and 45,578 Early Head Start slots in 2031.&rdquo; Add them up. 162,094.
        </P>

        <P>
          Three numbers. One agency. One week. Nobody lied.
        </P>

        <H2>The $2.2 billion is a midpoint</H2>

        <P>
          Same document, same section: ACF estimates &ldquo;total quantified impacts of approximately
          $1,476,881,912 to $2,959,495,914 annually at full implementation, with a primary estimate of
          approximately $2,218,188,913.&rdquo; The top of that range is <em>just over twice</em> the bottom.
          The $2.2B everybody is quoting is the middle bar.
        </P>

        <P>
          And there is a fourth dollar figure in there, doing different work. For Executive Order
          14192 accounting &mdash; annualized, 7% discount, 2024 dollars, transfers excluded &mdash; ACF puts the
          savings at &ldquo;approximately $0.94 billion.&rdquo; Which is a perfectly defensible number. It's just
          not the one on the press release.
        </P>

        <Fig caption={<>ACF Regulatory Impact Analysis, five-year horizon 2027&ndash;2031, at full implementation. The low/primary/high figures are $1,476,881,912 / $2,218,188,913 / $2,959,495,914; high &divide; low = 2.00. The $0.94B is ACF&rsquo;s separate Executive Order 14192 annualized savings figure at a 7% discount rate in 2024 dollars, excluding transfers. Source: <a href="https://www.federalregister.gov/documents/2026/08/07/2026-16134/reducing-federal-burden-for-head-start-programs">Federal Register, August 7, 2026</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22High+scenario%22%2C%22Primary+estimate+%28the+%242.2B%29%22%2C%22Low+scenario%22%2C%22EO+14192+annualized+savings%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Billions+of+dollars+per+year%22%2C%22data%22%3A%5B2.96%2C2.22%2C1.48%2C0.94%5D%2C%22backgroundColor%22%3A%5B%22%23999%22%2C%22%23141210%22%2C%22%23777%22%2C%22%233a3a3a%22%5D%2C%22borderWidth%22%3A0%2C%22barPercentage%22%3A0.68%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22The+%242.2+billion+is+the+middle+of+a+range+that+doubles%22%2C%22ACF+Regulatory+Impact+Analysis%2C+2027-2031%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A3.2%2C%22stepSize%22%3A0.5%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Billions+of+dollars+per+year%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of ACF cost impact estimates: high scenario 2.96 billion, primary estimate 2.22 billion, low scenario 1.48 billion, and EO 14192 annualized savings 0.94 billion dollars per year." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Here is the chain the slot number rides on. Savings come from what the rule calls
          &ldquo;scenario-based reductions in personnel expenditures.&rdquo; Slots come from the savings. So the
          headline is an estimate built on an estimate built on a scenario about how many adults
          programs keep. The rule also says the slot figures are &ldquo;not cumulative across years,&rdquo; are
          &ldquo;based on 2031 costs,&rdquo; and do not assume &ldquo;cost-of-living adjustments (COLAs) needed to keep
          pace with increasing costs.&rdquo;
        </P>

        <Callout label="What that last one means">
          A 2031 slot count with no COLA baked in is a 2026 number wearing a 2031 date. Five years of
          wage growth in early childhood, assumed away. That is a modeling choice, disclosed in the
          document, and invisible the second the number leaves it.
        </Callout>

        <H2>The other side has a cleaner unit</H2>

        <P>
          The rule hands group size and ratios to state child care licensing. The Children's Equity
          Project at ASU ran that swap state by state and found that <a href="https://cep.asu.edu/blog-cep/child-care-ratios-head-start-state-licensing">80% of children enrolled in
          Early Head Start and Head Start would experience worse adult-to-child ratios</a>. They publish
          the breakdown too: 23% of infants, 85% of 1-year-olds, 97% of 2-year-olds, 93% of
          3-year-olds, 71% of 4-year-olds.
        </P>

        <Fig caption={<>Share of enrolled Head Start and Early Head Start children in each age group who would face worse adult-to-child ratios if state child care licensing ratios replaced the federal standards. Overall figure across all ages: 80%. Source: <a href="https://cep.asu.edu/blog-cep/child-care-ratios-head-start-state-licensing">Children&rsquo;s Equity Project at ASU, August 2026</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Infants+0-12mo%22%2C%221-year-olds%22%2C%222-year-olds%22%2C%223-year-olds%22%2C%224-year-olds%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Share+facing+worse+ratios%22%2C%22data%22%3A%5B23%2C85%2C97%2C93%2C71%5D%2C%22backgroundColor%22%3A%5B%22%23999%22%2C%22%233a3a3a%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%2C%22barPercentage%22%3A0.66%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22If+state+licensing+ratios+replace+Head+Start+ratios%22%2C%22Share+of+enrolled+children+who+would+face+worse+adult-to-child+ratios%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22stepSize%22%3A20%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+enrolled+children%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart showing the share of enrolled children who would face worse adult-to-child ratios by age: infants 23 percent, 1-year-olds 85 percent, 2-year-olds 97 percent, 3-year-olds 93 percent, 4-year-olds 71 percent." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          I want to be careful here, because I like this measurement better and that is exactly when
          you're most likely to fool yourself. But structurally it <em>is</em> a tighter number. One unit
          (children). One counterfactual (state licensing ratio versus the federal standard). And the
          aggregate is published alongside the parts, so you can see where 80% comes from and argue
          with the pieces.
        </P>

        <P>
          The federal number can't do that. Slots sit on dollars, dollars sit on a staffing scenario,
          and the staffing scenario spans a 2x range. Every layer is another place to lose the thread
          between the document and the tweet. Head Start cumulatively served <a href="https://headstart.gov/program-data/article/head-start-program-facts-fiscal-year-2024">805,919 children and
          pregnant women in FY2024</a>, so we're arguing over roughly a fifth of the program with a
          number that has three official values.
        </P>

        <Divider />

        <P>
          The rule rescinds <a href="https://www.federalregister.gov/documents/2026/08/07/2026-16134/reducing-federal-burden-for-head-start-programs">more than 1,400 regulatory provisions</a> and requires that all education
          be delivered in English. Comments close October 6.
        </P>

        <P>
          Somebody is going to file one citing a slot count. There are three to pick from and every
          one of them is official.
        </P>


      </article>
    </Prose>

);

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here is a number that reads like a five-alarm fire. <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">2.6 million federal student-loan borrowers defaulted in the first quarter of 2026, on top of roughly 1 million the quarter before</a>. Call it 3.6 million people in two quarters &mdash; the largest concentrated wave of student-loan defaults the data has ever recorded.
        </P>

        <P>
          And it&rsquo;s real. I&rsquo;m not going to tell you it isn&rsquo;t. But I run a data company, and when a number jumps from zero to 2.6 million in two quarters, my first question isn&rsquo;t <em>how bad is it</em>. It&rsquo;s <em>what changed about the counting</em>.
        </P>

        <H2>The clock was switched off</H2>

        <P>
          Plenty changed, it turns out. Federal loan payments were paused at the start of the pandemic, then extended, then extended again &mdash; <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">borrowers went more than three years without owing a dime</a>. Payments technically resumed in late 2023, but a 12-month &ldquo;on-ramp&rdquo; through October 2024 meant missed payments weren&rsquo;t reported to the credit bureaus at all. And federal default takes <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">270 days of nonpayment</a> to register.
        </P>

        <P>
          Do the math on that fuse. The first new defaults couldn&rsquo;t legally land on a credit report until the fourth quarter of 2025. Not because nobody was missing payments before then &mdash; because the machine that records the missing was switched off, and then switched back on. The chart above isn&rsquo;t a spike. It&rsquo;s four years of backlog clearing through a turnstile that had been bolted shut.
        </P>

        <H2>The caveat the Fed wrote on itself</H2>

        <P>
          This matters for the part everyone is running with: the new defaulters are older than they used to be &mdash; <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">an average age of 38.9 versus 36.4 before the pandemic</a> &mdash; and they cluster in the South, with <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">at least one in ten borrowers newly in default in Louisiana, Mississippi, Alabama, Georgia, and South Carolina</a>.
        </P>

        <P>
          Both true. But here&rsquo;s what I love about the Fed&rsquo;s own write-up: they caveat their headline before you can. The age bump, they note, <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">&ldquo;could be an artifact of the four-year pause&rdquo;</a> &mdash; someone who&rsquo;d have defaulted in 2021 at 35 instead shows up in 2025 at 39, older on paper, same person underneath. So they went and checked the full age distribution and found a genuine shift toward the 50-and-older crowd sitting <em>on top of</em> the artifact. That&rsquo;s the move. Name the measurement error, then bank the finding.
        </P>

        <H2>The number isn&rsquo;t finished</H2>

        <P>
          And it isn&rsquo;t done counting. <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">Roughly 7 million borrowers sat in the now-defunct SAVE plan, parked in a litigation forbearance with their clocks not yet running</a>. When they reach the nine-month mark, a second wave shows up in the data. So 3.6 million isn&rsquo;t the count. It&rsquo;s the count <em>so far</em> &mdash; a snapshot of a process caught mid-stream, which is the most dangerous kind of number to hang a headline on.
        </P>

        <Fig caption={<>Share of newly defaulted borrowers who are also past due on their other debts, conditional on holding that debt type, 2026:Q1. Source: <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">New York Fed, Federal Student Loan Defaults Return After Pandemic Pause</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Credit+cards%22%2C%22Auto+loans%22%2C%22Mortgages%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Share+past+due+%28%25%29%22%2C%22data%22%3A%5B56%2C40%2C20%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Newly+defaulted+borrowers+are+behind+on+their+other+debts+too+%282026%3AQ1%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A60%2C%22stepSize%22%3A20%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+past+due%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of how often newly defaulted borrowers are past due on other debts in 2026:Q1: credit cards 56 percent, auto loans 40 percent, mortgages 20 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          One more, because it&rsquo;s the same disease. The Parent PLUS crowd &mdash; heavily those same older, Southern borrowers &mdash; had until <a href="https://www.insidehighered.com/news/government/student-aid-policy/2026/04/03/deadlines-are-quickly-approaching-parent-plus">June 30, 2026 to consolidate and keep access to income-driven repayment</a>. Sounds like a deadline you could still hit this week. Except it&rsquo;s a <em>disbursement</em> deadline, not an application one, <a href="https://thecollegeinvestor.com/70597/parent-plus-borrowers-face-a-june-30-2026-deadline/">consolidation takes 30 to 90 days to process</a>, and the Department itself told people to apply back in the spring. The door everyone&rsquo;s sprinting toward closed months before the date printed on it.
        </P>

        <Callout label="The tell">
          A default count of zero through 2025:Q3, then 1.0 million, then 2.6 million. The jump isn&rsquo;t the moment people stopped paying. It&rsquo;s the moment the credit bureaus were allowed to start writing it down again.
        </Callout>

        <Divider />

        <P>
          None of this makes the crisis fake. Defaulted borrowers are <a href="https://libertystreeteconomics.newyorkfed.org/2026/05/federal-student-loan-defaults-return-after-pandemic-pause/">91 credit-score points poorer for it</a> &mdash; from 567 down to 476 &mdash; and that&rsquo;s real money and real harm. But the story being told &mdash; sudden surge, brand-new demographic, act before Tuesday &mdash; is mostly an artifact of when we started counting and which end of a deadline we read.
        </P>

        <P>
          The data didn&rsquo;t lie. We just forgot to ask it when it started talking.
        </P>

        <P><em>&mdash; TJ</em></P>

        <Divider />

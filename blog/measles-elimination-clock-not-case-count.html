        alt="Grouped bar chart of confirmed measles cases in the Americas by country. Mexico: 6,152 in 2025, 8,315 in the first 12 weeks of 2026. Guatemala: 1 in 2025, 3,687 in 2026. United States: 2,144 in 2025, 1,664 in 2026. Canada: 5,425 in 2025, 733 in 2026."

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On November 10, 2025, the Region of the Americas lost its measles-free status. Not because of a spike. Because of a <a href="https://www.paho.org/en/news/10-11-2025-paho-calls-regional-action-americas-lose-measles-elimination-status">clock</a>.
        </P>

        <P>
          PAHO&rsquo;s re-verification commission met in Mexico City and concluded that endemic transmission had been reestablished in Canada, where the virus had circulated <a href="https://www.paho.org/en/news/10-11-2025-paho-calls-regional-action-americas-lose-measles-elimination-status">uninterrupted for at least 12 months</a>. That 12-month mark is the whole ballgame. Elimination isn&rsquo;t a case-count threshold you drop below. It&rsquo;s a stopwatch. Let one chain of transmission run past a year, and the region &mdash; the first in the world to eliminate measles <em>twice</em> &mdash; loses the certification for the entire hemisphere.
        </P>

        <P>
          So there are really two clocks running on this outbreak, and they don&rsquo;t agree. One is the stopwatch: how long has a single chain stayed alive. The other is the odometer: how many cases have rolled up. The status flipped on the stopwatch. Almost everything you read about measles counts the odometer. Watch what happens when you put them side by side.
        </P>

        <H2>The country that lost it had already turned the corner</H2>

        <P>
          Canada&rsquo;s outbreak started in New Brunswick in October 2024 and drove more than <a href="https://www.paho.org/en/news/10-11-2025-paho-calls-regional-action-americas-lose-measles-elimination-status">5,000 cases</a>. That&rsquo;s what tripped the stopwatch. But by the time the certificate came off the wall, the fire was mostly out. In the first 12 weeks of 2026, Canada reported <a href="https://www.paho.org/sites/default/files/2026/04/pahomeaslessitrep1engupdated_0.pdf">733 confirmed cases</a> &mdash; down from 5,425 across all of 2025. The country that cost the Americas its status is the one going quiet.
        </P>

        <P>
          Meanwhile the odometer is spinning somewhere else entirely. Mexico logged <a href="https://www.paho.org/sites/default/files/2026/04/pahomeaslessitrep1engupdated_0.pdf">8,315 cases</a> in those same 12 weeks. Guatemala went from a single case in all of 2025 to 3,687. Both of them still hold their elimination status. The map that lost its measles-free label and the map of where measles actually is have quietly stopped being the same map.
        </P>

        <H2>&ldquo;On pace to match last year&rdquo; is doing a lot of hiding</H2>

        <P>
          Here&rsquo;s the odometer number people keep repeating: between epidemiological weeks 1 and 12 of 2026, the Americas reported <a href="https://www.paho.org/sites/default/files/2026/04/pahomeaslessitrep1engupdated_0.pdf">14,465 confirmed cases</a> &mdash; within 38 of the <em>entire</em> 2025 total of 14,503. Read that fast and you&rsquo;d file it under &ldquo;bad, but roughly last year&rsquo;s bad.&rdquo;
        </P>

        <Callout label="Read the denominator">
          14,465 cases is not a year. It&rsquo;s a quarter. The Americas matched a full 2025 in the first 12 weeks of 2026 &mdash; roughly four times the 2025 pace, hiding inside a year-to-date number that happens to look like a tie.
        </Callout>

        <P>
          That&rsquo;s the trap in every accumulation stat: a running total compared against a finished one isn&rsquo;t a comparison, it&rsquo;s a category error. The 2025 line stopped moving in December. The 2026 line has nine months left to run.
        </P>

        <H2>Why the odometer keeps climbing</H2>

        <P>
          The plumbing reason is coverage, and it&rsquo;s not close. Herd immunity for measles needs about 95% of people to have had both doses. In 2024, global first-dose coverage was <a href="https://www.who.int/news/item/15-07-2025-global-childhood-vaccination-coverage-holds-steady-yet-over-14-million-infants-remain-unvaccinated-who-unicef">84%</a> and second-dose coverage was 76% &mdash; nineteen points under the floor. PAHO&rsquo;s own read of the current outbreak: roughly <a href="https://www.paho.org/sites/default/files/2026/04/pahomeaslessitrep1engupdated_0.pdf">two-thirds of confirmed cases</a> have no record of measles vaccination.
        </P>

        <Fig caption={<>Global coverage in 2024: 84% for the first dose, 76% for the second, against the 95% needed for herd immunity &mdash; a 19-point gap on the second dose. Source: <a href="https://www.who.int/news/item/15-07-2025-global-childhood-vaccination-coverage-holds-steady-yet-over-14-million-infants-remain-unvaccinated-who-unicef">WHO/UNICEF, July 15, 2025</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22First+dose+%28MCV1%29%22%2C%22Second+dose+%28MCV2%29%22%2C%22Herd-immunity+floor%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Global+coverage%2C+2024+%28%25%29%22%2C%22data%22%3A%5B84%2C76%2C95%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23141210%22%2C%22%23bbb%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Global+measles+vaccine+coverage+vs+the+95%25+floor%2C+2024%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A100%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Coverage+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of global measles vaccine coverage in 2024: first dose 84%, second dose 76%, against a herd-immunity floor of 95%."
            style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <Divider />

        <P>
          None of this means the elimination status is fake. It&rsquo;s a real, useful, hard-won piece of bookkeeping. But that&rsquo;s exactly what it is: a record of what a committee could verify about the previous 12 months, not a live readout of where the risk is today. Canada tripped the stopwatch on its way down. Mexico and Guatemala are running up the odometer with their status intact.
        </P>

        <P>
          The status comes back the same way it left &mdash; <a href="https://www.paho.org/en/news/10-11-2025-paho-calls-regional-action-americas-lose-measles-elimination-status">12 straight clean months</a>, and the certificate goes back on the wall. Twelve months from when, is the one thing neither clock can tell you.
        </P>

        <P style={{ fontStyle:'italic', color:'var(--muted)' }}>&mdash; TJ</P>

      </article>
    </Prose>
  </Container>
);

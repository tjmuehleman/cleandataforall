        alt="Bar chart of US confirmed measles cases by year, 2018 to 2026. 2018: 381. 2019: 1,274. 2020: 13. 2021: 49. 2022: 121. 2023: 59. 2024: 285. 2025: 2,288. 2026 through July 16: 2,260. The 2025 and 2026 bars tower over every prior year."

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Sometime this November, a review commission at the Pan American Health Organization will sit down and decide whether the United States still gets to call measles <a href="https://www.cdc.gov/measles/about/history.html">eliminated</a> &mdash; a title it has held since 2000. Here&rsquo;s the part that surprises people: they will not be counting cases.
        </P>

        <P>
          There is no number that forfeits elimination. Not <a href="https://www.cdc.gov/measles/data-research/index.html">2,288</a>, the confirmed 2025 total and the worst year since 1992. Not the <a href="https://www.cdc.gov/measles/data-research/index.html">2,260 cases across 44 jurisdictions</a> the CDC has logged in 2026 as of July 16, with nearly half the year still to run. You can have a terrible year and keep the label. The 2019 outbreak hit <a href="https://www.cdc.gov/measles/data-research/index.html">1,274 cases</a> and the country held on.
        </P>

        <P>
          What forfeits it is a classification call. Elimination means no <a href="https://www.kff.org/other-health/measles-elimination-status-what-it-is-and-how-the-u-s-could-lose-it/">endemic transmission for 12 straight months</a>. And &ldquo;endemic transmission&rdquo; isn&rsquo;t a count &mdash; it&rsquo;s a judgment about whether the chains link. Are the 2025 and 2026 outbreaks one continuous, genomically linked chain that has now run past a year? Or are they a pile of separate introductions that keep getting stamped out and reimported? Same cases. Two completely different verdicts.
        </P>

        <P>
          This is the oldest fight in data work wearing a new hat. Lumpers and splitters. <a href="https://www.astho.org/communications/blog/2026/understanding-current-us-measles-outbreaks-elimination-status/">ASTHO&rsquo;s 2026 briefing</a> says CDC and PAHO are actively analyzing exactly this &mdash; whether the linked outbreaks constitute the continuous endemic transmission that would trip the loss. That analysis is the whole ballgame. Not the headline number. The linkage.
        </P>

        <H2>The data already leans one way</H2>

        <P>
          Here&rsquo;s the tell. In 2024, <a href="https://www.cdc.gov/measles/data-research/index.html">69% of confirmed cases</a> were outbreak-associated &mdash; 198 of 285. In 2025 it was <a href="https://www.cdc.gov/measles/data-research/index.html">90%</a>, 2,065 of 2,288. In 2026 so far it&rsquo;s <a href="https://www.cdc.gov/measles/data-research/index.html">93%</a>, 2,108 of 2,260.
        </P>

        <Fig caption={<>Share of confirmed US measles cases that were outbreak-associated: 198/285 (2024), 2,065/2,288 (2025), 2,108/2,260 (2026 through July 16). Source: <a href="https://www.cdc.gov/measles/data-research/index.html" style={{ color:'inherit' }}>CDC, Measles Cases and Outbreaks</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222024%22%2C%222025%22%2C%222026%2A%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+of+confirmed+cases+outbreak-associated%22%2C%22data%22%3A%5B69%2C90%2C93%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A100%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+outbreak-associated%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of the share of confirmed US measles cases that were outbreak-associated. 2024: 69 percent. 2025: 90 percent. 2026 through July 16: 93 percent."
            style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          That trend line is the fingerprint of endemic transmission. Scattered imports look like a lot of ones and twos &mdash; a traveler, a household, done. Sustained domestic chains look like this: a rising share of every year&rsquo;s cases tracing back to outbreaks that won&rsquo;t die. The virus is doing the thing the label is supposed to certify it isn&rsquo;t doing.
        </P>

        <P>
          And it&rsquo;s happening on ground that got softer. Kindergarten MMR coverage <a href="https://www.cdc.gov/measles/data-research/index.html">slid from 95.2% to 92.5%</a> between the 2019&ndash;20 and 2024&ndash;25 school years &mdash; under the 95% herd-immunity line, leaving about 286,000 kindergartners unprotected in a single cohort. Below that line, a chain doesn&rsquo;t need luck to keep going. It just needs a room.
        </P>

        <H2>The label was always paperwork</H2>

        <P>
          Something to sit with: the disease doesn&rsquo;t change on the day of the ruling. Measles in the US is already, functionally, back. The region already <a href="https://www.paho.org/en/news/10-11-2025-paho-calls-regional-action-americas-lose-measles-elimination-status">lost its status in November 2025</a> &mdash; the whole Americas, tripped by Canada crossing 12 months. The US decision in November 2026 is bookkeeping catching up to a reality the charts called a year ago. Analysts already put a loss at <a href="https://www.cidrap.umn.edu/measles/us-highly-likely-lose-measles-elimination-status-fall-analysis-warns">&ldquo;highly likely.&rdquo;</a>
        </P>

        <Callout label="Key figure">
          There is no case-count threshold for measles elimination. The status turns entirely on whether transmission is ruled continuous for 12 or more months.
        </Callout>

        <Divider />

        <P>
          So watch for the linkage determination, not the next case tally. The number everyone quotes &mdash; 2,260, and climbing &mdash; was never the one that mattered. The one that matters is a yes or no to a single question in a conference room: is this one chain? And the data has been quietly nodding for months.
        </P>

      </article>
    </Prose>
  </Container>
);

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In 2023, exactly one state had a statewide ban on phones in school. Florida. By this July, a <a href="https://jamanetwork.com/journals/jamapediatrics/article-abstract/2851916">JAMA Pediatrics review</a> counted 42 of 51 jurisdictions (50 states plus DC) with a law or policy restricting them, <a href="https://www.deseret.com/education/2026/07/27/cell-phone-limitations-public-schools-nationwide-study/">per Deseret News</a>. One to 42 in about three years. That isn't a policy trend. That's a stampede.
        </P>

        <P>
          So when the biggest study yet says disciplinary incidents rise about 15% in year one, you'd assume it's a study of those 42. It isn't. <a href="https://www.nber.org/papers/w35132">NBER Working Paper 35132</a> is a study of lockable pouches. Specifically, of schools that bought them from the largest pouch provider, whose sales records are how the authors know who is treated.
        </P>

        <H2>What “ban” means in the 42</H2>

        <P>
          Of the 42, 32 are bans during instructional time. Fifteen of those are bell to bell. Seventeen let kids use phones at lunch and between classes. Two limit use with local flexibility. Three encourage districts to write a policy. And five require a district policy and don’t say what it should contain (chart above).
        </P>

        

        <P>
          Five states passed a law requiring a policy. The count books that as a state that restricts phones. I’d book it as a state that scheduled a meeting.
        </P>

        <H2>What “treated” means in the study</H2>

        <P>
          The pouch is the intervention. Phone goes in, pouch locks, phone stays locked all day. The study’s treated schools are the <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf">1,778 pouch adopters</a> in the test-score sample (Table 1, adoption cohorts 2023 through 2025), against 42,919 never-adopters. The vendor’s own records list 4,608 public schools that bought pouches, ever (Section 3.1).
        </P>

        <Fig caption={<>Test-score sample, NBER 35132, Table 1. Pouch adopters are 1,778 of 44,697 schools, about 4% (1,778 ÷ (1,778 + 42,919)). Source: <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf">Allcott, Baron, Dee, Duckworth, Gentzkow, Jacob</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Never-adopters+%28comparison%29%22%2C%22Pouch+adopters+%28treated%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B42919%2C1778%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.5%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Schools+in+the+test-score+sample%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Schools%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of schools in the test-score sample: 42,919 never-adopters versus 1,778 pouch adopters."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          A vendor’s sales ledger records what the vendor sold. It does not record the teacher’s phone caddy, the honor-system rule, or the principal who says “not in the hallway.” Whatever the 32 “bans” look like inside a building, the ledger only sees one brand of pouch. That’s not a flaw in the paper. It’s a clean answer to a narrower question than the one the legislatures are asking.
        </P>

        <H2>The join nobody has</H2>

        <P>
          Here is the question a school board actually has. Our state passed a ban. What happens in year one? To answer it you need two tables: state law type on one side, school-level discipline on the other. The JAMA count has the first. The NBER paper has the second. I couldn’t find a place where they share a key.
        </P>

        <P>
          The cleanest comparison available is 15 bell-to-bell states against 17 instructional-time states. I couldn’t find anyone who has run it.
        </P>

        <P>
          Forty-two jurisdictions have a rule. One vendor’s customer list has the results. Somebody should introduce them.
        </P>

      </article>
    </Prose>
  </Container>
);

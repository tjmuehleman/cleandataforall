// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, textAlign:'center' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%2212+mo.+ending+Dec+2024%22%2C%2212+mo.+ending+Dec+2025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Reported+%28deaths+actually+filed%29%22%2C%22data%22%3A%5B80860%2C68600%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Predicted+%28CDC+model+estimate%29%22%2C%22data%22%3A%5B81313%2C69973%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+headline+overdose+count+is+a+model+estimate%2C+not+a+body+count%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Atrue%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A90000%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Drug+overdose+deaths%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart comparing reported versus predicted U.S. drug overdose deaths for the 12 months ending December 2024 and December 2025. Reported: 80,860 then 68,600. Predicted: 81,313 then 69,973." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
        Reported = death certificates filed and coded; predicted = CDC&rsquo;s model estimate once late certificates land. 2025: 68,600 reported, 69,973 predicted. Source: CDC NCHS, May 13, 2026; reported figures via The Hill / Nexstar.

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On May 13 the CDC posted the number the overdose-research world had waited a decade to see: an estimated <a href={CDC}>69,973 drug overdose deaths in 2025</a>, down almost 14% from 81,313 the year before &mdash; the third straight year of decline. Good news. The kind this dataset almost never hands you.
        </P>

        <P>
          Then I opened the <a href={VSRR}>actual dashboard</a>, and there&rsquo;s a second number sitting right next to it: 68,600. That&rsquo;s how many overdose deaths have actually been <a href={HILL}>reported</a> for 2025 &mdash; certificates filed, coded, counted. The 69,973 everyone quoted lives in the other column. It&rsquo;s <em>predicted</em>. A model&rsquo;s estimate of how many death certificates are still working their way through the system.
        </P>

        <P>
          I run a data company, not a coroner&rsquo;s office. So the first thing I notice isn&rsquo;t the drop. It&rsquo;s that the headline is a forecast &mdash; and the forecast is the honest number. CDC publishes <a href={CDC}>both columns every month</a>, reported and predicted, precisely because an overdose death takes months to investigate, autopsy, and certify. Count only what&rsquo;s filed and you&rsquo;d undercount every recent month on the calendar. So NCHS models the gap, and it tells you that&rsquo;s what it did.
        </P>

        <H2>Provisional is doing a lot of work</H2>

        <P>
          Every one of these figures is <a href={CDC}>provisional</a> &mdash; &ldquo;incomplete and subject to change as more 2025 data are submitted,&rdquo; in CDC&rsquo;s own words. It&rsquo;s a 12-month rolling window ending in December, not a calendar-year tally you can carve in stone. Puerto Rico&rsquo;s deaths aren&rsquo;t even in the national total. None of that makes the decline fake. It makes it a draft. A very good draft, three years running, that keeps getting revised as the slow certificates catch up.
        </P>

        <Callout label="The gap">
          For 2025, CDC <a href={HILL}>reports 68,600</a> overdose deaths actually on file and <a href={CDC}>predicts 69,973</a> once the backlog clears &mdash; a gap of about 1,400 deaths the model believes happened but the paperwork hasn&rsquo;t confirmed. Both numbers ship in the same release.
        </Callout>

        <H2>Which brings me to the map</H2>

        <P>
          The headline everyone ran was national. The story underneath was the map: most states down, a handful up. Four states &mdash; <a href={HILL}>Oregon, Rhode Island, North Carolina, and New York</a> &mdash; posted reported drops over 30%. Seven went the other way: New Mexico, Arizona, and Colorado up 10% or more, with North Dakota, Minnesota, South Dakota, and Montana also rising. One state, Nebraska, reportedly didn&rsquo;t move at all.
        </P>

        <P>
          Here&rsquo;s my problem with the map, and it isn&rsquo;t a policy problem. Those state figures are percent changes of <em>provisional</em> counts &mdash; the least-finished layer of an already-unfinished dataset. A small state with a couple hundred deaths and a slow medical examiner can swing double digits on a few certificates that just haven&rsquo;t posted yet. A &ldquo;no change&rdquo; state like Nebraska is exactly what a half-filled 2025 column looks like. The seven-state reversal might be real. It might be a reporting-lag mirage that quietly corrects when these files close. We won&rsquo;t know which until the counts firm up.
        </P>

        <Fig caption={<>All-drug total fell 81,313 &rarr; 69,973 (&minus;11,340); opioid-involved fell 55,296 &rarr; 44,564 (&minus;10,732). Opioids are about 95% of the drop. Source: CDC NCHS, May 13, 2026.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222024%22%2C%222025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22All+drug+overdose+deaths%22%2C%22data%22%3A%5B81313%2C69973%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Opioid-involved%22%2C%22data%22%3A%5B55296%2C44564%5D%2C%22backgroundColor%22%3A%22%23777%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Opioids+account+for+almost+the+entire+decline%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Atrue%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A90000%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Estimated+deaths%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart of all drug overdose deaths versus opioid-involved deaths, 2024 and 2025. All drug: 81,313 then 69,973. Opioid-involved: 55,296 then 44,564." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          What I&rsquo;d bet on is the part that barely needs the model: opioids. Opioid-involved deaths fell from <a href={CDC}>55,296 to 44,564</a> &mdash; roughly 10,700 of the national drop of about 11,300. That&rsquo;s the signal. Nearly the whole decline is opioids coming down, and it&rsquo;s big enough to survive whatever the revisions do to the third decimal place.
        </P>

        <Divider />

        <P>
          So yes &mdash; three years down, the best overdose number in a decade. Just keep track of which number it is. The one everyone cheered isn&rsquo;t the count. It&rsquo;s the estimate of the count. And the estimate is still the most honest thing in the file.
        </P>

        <H2>Sources</H2>

        <P>
          <a href={CDC}>CDC NCHS Pressroom &mdash; U.S. Overdose Deaths Decrease for Third Consecutive Year in 2025 (May 13, 2026)</a>. <a href={VSRR}>CDC NCHS &mdash; Provisional Drug Overdose Death Counts (VSRR dashboard)</a>. <a href={HILL}>The Hill / Nexstar &mdash; Drug overdose deaths declined last year, except in these 8 states (May 14, 2026)</a>.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

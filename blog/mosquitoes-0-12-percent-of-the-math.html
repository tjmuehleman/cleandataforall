      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Additional+cases%5Cn%28123M%2C+2024-2050%29%22%2C%22Additional+deaths%5Cn%28532K%2C+2024-2050%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+from+disruptive+channel%22%2C%22data%22%3A%5B79%2C93%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Share+of+the+climate-driven+malaria+rise+tied+to+extreme-weather+disruption%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A28%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22fontSize%22%3A11%2C%22min%22%3A0%2C%22max%22%3A100%2C%22stepSize%22%3A20%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Share+attributed+to+extreme-weather+disruption+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart: the disruptive channel — extreme weather events that interrupt malaria treatment programs and damage housing — accounts for 79% of the additional malaria cases (123 million) and 93% of the additional deaths (532,000) projected across Africa between 2024 and 2050 under SSP2-4.5." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;

const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          For two decades the climate-malaria question got modeled the same way. Heat the planet, push the <em>Anopheles</em> belt higher in elevation and farther from the equator, count the new people in the new range. That&rsquo;s the ecological channel. It&rsquo;s the chart in every public-health intro.
        </P>

        <P>
          A new <a href="https://doi.org/10.1038/s41586-025-10015-z">Nature paper</a> from Symons, Gething, and the Malaria Atlas Project team &mdash; <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/">published January 28</a> &mdash; added a column. The team pulled 25 years of African data on temperature, rainfall, malaria burden, mosquito habitat, <em>and</em> extreme weather events. They ran the world to 2050 under <a href="https://www.carbonbrief.org/explainer-how-shared-socioeconomic-pathways-explore-future-climate-change/">SSP2-4.5</a> &mdash; the pathway that approximates current climate pledges &mdash; and counted what changes.
        </P>

        <P>
          The mosquito-range channel &mdash; the one the textbook is built around &mdash; moves the African malaria caseload <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/"><strong>0.12% above present-day by 2050</strong></a>. Not 12 percent. <em>0.12 percent.</em> Some highland areas pick up risk; the Sahel loses it as temperatures push past the optimal range for the mosquito; the continental average barely budges.
        </P>

        <P>
          Add the extreme-weather column and the projection turns into <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/"><strong>123 million additional malaria cases and 532,000 additional deaths</strong></a> between 2024 and 2050. And the rise tracks almost entirely to disruption &mdash; flooding that wipes out the road to the clinic, cyclones that destroy housing and the bed nets inside it, weather events that throw early-treatment supply chains off schedule. <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/"><strong>79% of the additional cases and 93% of the additional deaths</strong></a> come from this channel. The bug-on-a-warming-planet story is the third decimal.
        </P>

        <H2>What changed wasn&rsquo;t the climate. It was the column.</H2>

        <P>
          The story rewrite isn&rsquo;t a finding about mosquitoes. It&rsquo;s a finding about modeling. Everyone running climate-malaria projections had a temperature-and-rainfall layer. Almost nobody had a healthcare-systems-disruption layer. The authors flag this directly: current literature <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/"><em>&ldquo;often overlooks how heavily malaria risk in Africa is today shaped by climate-fragile prevention and treatment systems&rdquo;</em></a>. One missing data column produced an answer that was nearly the inverse of the right one.
        </P>

        <P>
          The Cyclone Idai signal was already in the data. In 2019, the storm hit Mozambique, and in the weeks after &mdash; when housing was rubble and clinics were inaccessible &mdash; <a href="https://www.unicef.org.uk/press-releases/nearly-15000-cases-of-malaria-reported-in-areas-of-mozambique-affected-by-cyclone-idai-unicef/">nearly 15,000 malaria cases were reported</a> in the affected zones. That&rsquo;s the channel writ small, captured by post-disaster surveillance. The Nature team modeled it forward across the continent for 25 years and got ~97 million additional malaria cases (79% of 123M).
        </P>

        <Callout label="The lever change">
          The textbook answer (&ldquo;warming spreads mosquitoes&rdquo;) implies vector control: more nets, more spray, expand the program upslope. The disruption finding implies a different lever entirely: harden the supply chain. Pre-position bed nets ahead of cyclone season. Stand up early-warning systems for storms. Stock community health workers <em>before</em> the flood, not chasing the outbreak after.
        </Callout>

        <H2>The map gets weirder too</H2>

        <P>
          Combining channels, the gain in malaria risk concentrates in the highlands of <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/">Burundi, eastern DRC, Ethiopia, Kenya, and Rwanda</a> &mdash; where the temperature was previously too low for the mosquito &mdash; and along the <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/">cyclone-prone coastal regions of southeast Africa</a>, where the storms hit. The Sahel, meanwhile, gets <em>less</em> malaria, because the heat moves past the optimum for the bug. <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/">67% of people in Africa</a> end up with higher climate-attributable risk by 2050. The other third get less, for the wrong reason.
        </P>

        <P>
          The WHO put 2024 malaria deaths at <a href="https://www.who.int/news-room/fact-sheets/detail/malaria">610,000 worldwide, with 95% in Africa</a>. Layer the projection on top and Africa absorbs roughly 21,000 climate-attributable deaths per year through 2050, on average. Most of the bodies sit in the disruption channel.
        </P>

        <Divider />

        <P>
          The mosquito spent two decades getting blamed. It was the clinic the whole time.
        </P>

        <P style={{ fontStyle:'italic', color:'var(--muted)', marginTop:'2em' }}>
          &mdash; TJ
        </P>

        <H2>Sources</H2>

        <UL items={[
          <span>Symons, T. et al. (2026). <a href="https://doi.org/10.1038/s41586-025-10015-z">Projected impacts of climate change on malaria in Africa</a>. <em>Nature</em>, doi:10.1038/s41586-025-10015-z.</span>,
          <span>Carbon Brief (Jan 28, 2026). <a href="https://www.carbonbrief.org/climate-change-could-lead-to-500000-additional-malaria-deaths-in-africa-by-2050/">Climate change could lead to 500,000 additional malaria deaths in Africa by 2050</a>.</span>,
          <span>WHO. <a href="https://www.who.int/news-room/fact-sheets/detail/malaria">Malaria fact sheet</a> (610,000 deaths in 2024; 95% in Africa).</span>,
          <span>UNICEF UK (Apr 2019). <a href="https://www.unicef.org.uk/press-releases/nearly-15000-cases-of-malaria-reported-in-areas-of-mozambique-affected-by-cyclone-idai-unicef/">Nearly 15,000 cases of malaria reported in areas of Mozambique affected by Cyclone Idai</a>.</span>,
          <span>Carbon Brief explainer: <a href="https://www.carbonbrief.org/explainer-how-shared-socioeconomic-pathways-explore-future-climate-change/">How Shared Socioeconomic Pathways explore future climate change</a> (SSP2-4.5 reference).</span>,
        ]} />

      </article>
    </Prose>
  </Container>
);

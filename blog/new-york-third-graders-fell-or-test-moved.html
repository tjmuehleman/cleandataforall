// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>

const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>Last year, 58.0% of New York City third graders were proficient in reading. This year it’s 44.2%. That’s 13.8 points, gone in 12 months, per the <a href="https://brooklynbridgeparents.com/new-york-state-test-results-2026-for-public-schools-released/">state’s numbers</a>.</P>

        <P>Citywide, grades 3–8 went from 56.3% to 50.3%. A year earlier that same line <a href="https://www.amny.com/education/reading-scores-in-nyc-public-schools-plunge/">climbed 7.2 points</a>. Up seven, down six. Meanwhile math, same kids, same spring: 56.9% to 57.0%. Flat as a table.</P>

        <P>(Yes, a different crop of third graders shows up every year. But look at the chart. Fifth grade fell 13.1 points. Eighth grade fell 0.4. Same test, same city.)</P>

        <H2>It’s not just New York City</H2>

        <P>Statewide, grades 3–8 reading went from 53% to 48%. Math went from 55% to 57%. Science went from 44% to 47%, per <a href="https://newyork.edtrust.org/edtrust-new-york-calls-for-independent-audit-of-state-ela-assessments-following-significant-year-over-year-fluctuations/">EdTrust-New York</a>. Reading down, everything else up, one administration.</P>

        <P>EdTrust-New York wants an independent audit of the last three years of ELA testing, including the scaling, the scoring and the standard-setting. When the advocacy group asks for an audit instead of more phonics, you know which part of the system it’s squinting at.</P>

        <H2>The bar moves, on purpose</H2>

        <P>Here’s the detail I can’t stop looking at. On the 2025 ELA exam, a third grader had to get 57% of the test right to count as proficient. In 2024 it was 60%. Fourth grade: 56%, down from 65% (that’s a nine-point drop in the bar, same year the city gained 7.2). Sixth grade: 57%, down from 63%. Those come from a <a href="https://www.yahoo.com/news/articles/york-state-lowered-bar-students-132943612.html">Times-Union analysis</a> of the state’s passing benchmarks.</P>

        <Fig caption={<>Source: percent of the ELA test required to pass, 2024 vs 2025, from a Times-Union analysis <a href="https://www.yahoo.com/news/articles/york-state-lowered-bar-students-132943612.html">as reported by the New York Post</a> (Yahoo). Only the grades the analysis reported are shown. No derived values.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Grade+3%22%2C%22Grade+4%22%2C%22Grade+6%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222024%22%2C%22data%22%3A%5B60%2C65%2C63%5D%2C%22backgroundColor%22%3A%22%23777%22%2C%22barPercentage%22%3A0.85%2C%22categoryPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%222025%22%2C%22data%22%3A%5B57%2C56%2C57%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.85%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Atrue%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Share+of+the+ELA+test+a+student+had+to+get+right+to+pass%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A80%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22id%22%3A%22y%22%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22id%22%3A%22x%22%7D%5D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A12%7D%7D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: share of the ELA test a student had to get right to pass. Grade 3: 60 in 2024, 57 in 2025. Grade 4: 65 to 56. Grade 6: 63 to 57." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>Now, the state’s explanation is perfectly normal. Test forms differ. When a year’s questions run harder, the number you have to get right goes down, so a “proficient” kid is the same kind of kid in both years. That’s equating, and it’s how this is supposed to work.</P>

        <P>It also means the score line and the cut line are two different instruments, and the thing I actually wanted, the 2026 cut scores, I couldn’t find published anywhere I could cite. So I can’t tell you whether the bar moved again. Maybe it didn’t. Maybe that’s the whole story. Or none of it.</P>

        <P>What I can tell you is what the other instruments say. NYC’s own reading screeners, per that same EdTrust statement, <a href="https://newyork.edtrust.org/edtrust-new-york-calls-for-independent-audit-of-state-ela-assessments-following-significant-year-over-year-fluctuations/">kept inching up</a> both years. A line that goes up 7, down 6, next to a line that goes up a little, up a little. Two stories. One of them is probably about the ruler.</P>

        <P>Years of curriculum fights, and the question everyone wants answered, <em>is it working</em>, runs straight through a test that swings harder than the thing it’s measuring. Before we argue about phonics, somebody should check the ruler.</P>

        <UL items={[
          <><a href="https://brooklynbridgeparents.com/new-york-state-test-results-2026-for-public-schools-released/">Brooklyn Bridge Parents, New York State test results 2026 for public schools released</a> (NYC citywide and grade-level ELA and math, 2025 and 2026)</>,

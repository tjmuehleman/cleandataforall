const H2 = ({ children }) => <h2>{children}</h2>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Late last year a statistics blog{' '}
          <a href="https://statmodeling.stat.columbia.edu/2025/12/01/how-much-of-mississippis-education-miracle-is-an-artifact-of-selection-bias/">picked a fight with Mississippi</a>.
          The claim, in one sentence: maybe Mississippi&rsquo;s 4th graders aren&rsquo;t
          actually getting better at reading &mdash; maybe the state just holds the weak
          readers back in 3rd grade, so the cohort that takes NAEP a year later is older
          and stronger by selection. The full critique ran in the January 2026 issue of{' '}
          <em>Significance</em>. The most-cited K-12 success story of the last decade was,
          allegedly, a sampling artifact.
        </P>

        <P>
          Then in January,{' '}
          <a href="https://fordhaminstitute.org/national/commentary/mississippi-miracle-wasnt-retention-policy-mirage">Fordham reanalyzed the cohort effect</a>{' '}
          using a{' '}
          <a href="https://edworkingpapers.com/ai26-1352">working paper</a>{' '}
          from Sakib Mahmud at Annenberg. Mississippi gained 0.07 to 0.16 standard
          deviations in 4th grade reading vs. comparable states. Strip out the slice you
          can attribute specifically to the state-level retention mandate (vs. the rest
          of the policy stack &mdash; coaches, training, screening, curriculum), and you&rsquo;re
          left with about 0.04 SD. Retention was real. It just wasn&rsquo;t most of the gain.
          Mississippi&rsquo;s improvements began in 2013&ndash;14,{' '}
          <em>before</em> the retention mandate, when state legislators backed the{' '}
          <a href="https://mdek12.org/literacy/lbpa/">Literacy-Based Promotion Act</a>{' '}
          with $15M a year for teacher training.
        </P>

        <P>
          Andrew Gelman, who{' '}
          <a href="https://statmodeling.stat.columbia.edu/2025/12/04/when-the-numbers-dont-look-right-check-them-mississippi-education-update/">hosted the December critique</a>{' '}
          on his blog, conceded the math.
        </P>

        <H2>What the actual numbers look like</H2>

        <P>
          Per the{' '}
          <a href="https://mdek12.org/wp-content/uploads/sites/59/2025/01/NAEPRankings-OnePager-2025-0115-JC-v02.pdf">MS DOE 2024 NAEP one-pager</a>,
          Mississippi went from <strong>49th in 4th grade reading in 2013 to 9th in 2024.</strong>{' '}
          Math: 50 &rarr; 16. Eighth grade scores moved too, just less. Once you adjust
          for student demographics, the{' '}
          <a href="https://www.urban.org/research/publication/states-demographically-adjusted-performance-2024-national-assessment">Urban Institute</a>{' '}
          ranks Mississippi #1 in the country in 4th grade reading, 4th grade math, and
          8th grade math.
        </P>

        <P>
          The subgroup table is where it gets weird. African American 4th graders{' '}
          <a href="https://mdek12.org/wp-content/uploads/sites/59/2025/01/NAEPRankings-OnePager-2025-0115-JC-v02.pdf">rank 3rd nationally</a>{' '}
          in reading. Hispanic 4th graders rank 1st. Economically disadvantaged 4th
          graders rank 1st.
        </P>

        <Fig caption={<>Source: <a href="https://mdek12.org/wp-content/uploads/sites/59/2025/01/NAEPRankings-OnePager-2025-0115-JC-v02.pdf">Mississippi Department of Education one-pager</a> (Jan 2025), 2024 NAEP subgroup national rankings, Grade 4 reading.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Hispanic+students%22%2C%22Economically+disadvantaged%22%2C%22African+American+students%22%2C%22All+students+%28state+avg.%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Mississippi+2024+NAEP+G4+reading+national+rank%22%2C%22data%22%3A%5B1%2C1%2C3%2C9%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%2C%22%233a3a3a%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Mississippi+2024+NAEP+Grade-4+reading+rank%2C+by+subgroup%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A12%2C%22stepSize%22%3A2%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22National+rank+%281+%3D+best%3B+NAEP+2024+cross-tabs%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=440&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of Mississippi's 2024 NAEP national rank in Grade 4 reading by subgroup. Hispanic students: 1. Economically disadvantaged: 1. African American students: 3. All students (state average): 9."
            style={{ width:'100%', display:'block' }}
          />
        </Fig>

        <P>
          The state&rsquo;s overall rank is 9th, but the rank for its most disadvantaged
          kids is higher than the average. That&rsquo;s the inverse of every state-level
          achievement chart I&rsquo;ve ever stared at. (Holds for math, too.)
        </P>

        <H2>The data-systems part</H2>

        <P>
          If you build assessment systems for a living, you&rsquo;ve spent some real
          percentage of your career arguing about what counts as a cohort. Is the 4th
          grade NAEP cohort everyone enrolled in 4th grade in spring 2024? Everyone who
          started kindergarten on schedule with the class? Everyone who <em>should</em>{' '}
          be in 4th grade if you go off birthday? Three definitions, three different
          scores.
        </P>

        <P>
          NAEP samples by current grade-level enrollment. Hold kids back in 3rd grade
          and they show up in next year&rsquo;s 3rd grade NAEP, not this year&rsquo;s
          4th. That&rsquo;s a real artifact. That&rsquo;s what the December critique
          was pointing at. The reason it took two years to settle is that NAEP
          doesn&rsquo;t publish cohort-of-origin variables &mdash; you can&rsquo;t
          filter &ldquo;originally entered K with this class&rdquo; out of the data. The
          argument had to be reconstructed from{' '}
          <a href="https://edopportunity.org/">SEDA</a>{' '}
          (which aligns state assessments to the NAEP scale) plus whatever the retention
          statutes said about timing. Two years of stat-blog posts to do work the source
          data won&rsquo;t do for you.
        </P>

        <Callout label="What this run reminded me">
          The closest thing the U.S. has to a census-grade learning measure can&rsquo;t
          quickly answer <em>what cohort got tested.</em> If a sample-selection question
          on NAEP takes two years to settle, the harder questions &mdash; which reforms
          worked, when, for whom &mdash; are not getting answered any faster.
        </Callout>

        <P>
          I don&rsquo;t have a strong opinion on the policy stack. I think the LBPA was
          probably good and probably not what most of the gain came from. (Mahmud agrees.
          So does Fordham now.) The thing that bugs me is the part above this paragraph.
        </P>

        <Divider />

        <P>
          The 9th-place rank is the surprise on the chart. The cohort-definition argument
          is the surprise underneath it.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

        <Divider />

        <H2>Sources</H2>

        <P>
          <a href="https://mdek12.org/wp-content/uploads/sites/59/2025/01/NAEPRankings-OnePager-2025-0115-JC-v02.pdf">Mississippi Department of Education &mdash; Mississippi&rsquo;s 2024 NAEP Results one-pager</a>{' '}
          (Jan 2025). State-rank trajectory (49 &rarr; 21 &rarr; 9 in Grade 4 reading
          and the parallel rows for math and Grade 8) plus the subgroup national
          rankings used in the second chart.
        </P>

        <P>
          <a href="https://www.urban.org/research/publication/states-demographically-adjusted-performance-2024-national-assessment">Urban Institute &mdash; States&rsquo; Demographically Adjusted Performance on the 2024 NAEP</a>.
          The demographic-adjustment ranking that puts Mississippi #1 in 4th grade
          reading, 4th grade math, and 8th grade math.
        </P>

        <P>
          <a href="https://fordhaminstitute.org/national/commentary/mississippi-miracle-wasnt-retention-policy-mirage">Fordham Institute &mdash; The Mississippi Miracle wasn&rsquo;t a retention-policy mirage</a>{' '}
          (Jan 15, 2026). The reanalysis that walks through Mahmud&rsquo;s estimates
          and credits the Literacy-Based Promotion Act and the $15M annual training
          investment, not the retention rule, with most of the lift.
        </P>

        <P>
          <a href="https://edworkingpapers.com/ai26-1352">Sakib Mahmud &mdash; Does State-Mandated Third-Grade Reading Retention Policy Improve Achievement?</a>{' '}
          EdWorkingPaper 25-1352, Annenberg Institute (Dec 2025). Source for the
          0.07&ndash;0.16 SD aggregate effect and the 0.04 SD retention-only slice.
        </P>

        <P>
          <a href="https://statmodeling.stat.columbia.edu/2025/12/01/how-much-of-mississippis-education-miracle-is-an-artifact-of-selection-bias/">Statistical Modeling, Causal Inference, and Social Science (Andrew Gelman&rsquo;s blog) &mdash; the original critique</a>{' '}
          (Dec 1, 2025) and the{' '}
          <a href="https://statmodeling.stat.columbia.edu/2025/12/04/when-the-numbers-dont-look-right-check-them-mississippi-education-update/">Dec 4 follow-up</a>{' '}
          where the math is rechecked.
        </P>

        <P>
          <a href="https://mdek12.org/literacy/lbpa/">Mississippi Department of Education &mdash; Literacy-Based Promotion Act</a>{' '}
          program page. Background on the 2013 statute that anchors the timeline.
        </P>

        <P>
          <a href="https://edopportunity.org/">Stanford Education Data Archive (SEDA)</a>.
          The dataset Mahmud uses to align state assessments to the NAEP scale; the
          tool the cohort-effect argument had to be reconstructed from because NAEP
          itself doesn&rsquo;t publish cohort-of-origin variables.
        </P>

      </article>
    </Prose>

);

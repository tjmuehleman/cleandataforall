// ==================== Optional hero visual ====================

      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Old+rule%3A+max+share+Exemplary%22%2C%222026%3A+state+share+Exemplary%22%2C%22CPS+2025%3A+share+Exemplary%22%2C%22CPS+2026%3A+share+Exemplary%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B10%2C27%2C2%2C9%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23141210%22%2C%22%23777%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Exemplary+schools+%28%25+of+schools%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A14%7D%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A32%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: old rule capped Exemplary schools at 10 percent; 2026 Illinois share is 27 percent; CPS went from 2 percent to 9 percent" style={{ width:'100%', height:'auto', display:'block' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On October 30, Illinois told the public that 27% of its schools are Exemplary, the top rating (<a href="https://www.chalkbeat.org/chicago/2026/10/30/2026-illinois-state-report-card-released-by-isbe-with-data-on-cps-schools/" target="_blank" rel="noopener">Chalkbeat</a>). Under the old system, no more than 10% of schools could ever hold that label (<a href="https://www.shawlocal.com/news/2026/10/30/2026-illinois-school-report-card-record-graduation-rate-increased-student-success/" target="_blank" rel="noopener">Shaw Local</a>). Same state. Same label. One year apart. Different ruler.
        </P>
        <P>
          And that&rsquo;s the thing to keep straight, because Illinois actually has two rulers, and they moved at different times. Ruler one is the state test. In August 2025 the State Board lowered the cut scores for proficiency on the IAR in math and English, and the change applied to tests taken that spring (<a href="https://www.chalkbeat.org/chicago/2025/08/13/illinois-approves-lower-cut-scores-on-state-exams" target="_blank" rel="noopener">Chalkbeat, Aug. 2025</a>). Ruler two is the school rating. The old system ranked schools against each other (top 10% Exemplary, bottom 5% Comprehensive). The new one uses a rubric and puts no percentage caps on any category (<a href="https://www.shawlocal.com/news/2026/10/30/2026-illinois-school-report-card-record-graduation-rate-increased-student-success/" target="_blank" rel="noopener">Shaw Local</a>).
        </P>
        <H2>The test ruler moved once, and it&rsquo;s already in the baseline</H2>
        <P>
          English proficiency in grades 3-8 went from 39.4% in 2024 to 52.4% in 2025 (<a href="https://www.chalkbeat.org/chicago/2025/10/30/illinois-standardized-test-scores-show-growth-with-new-benchmarks" target="_blank" rel="noopener">Chalkbeat, Oct. 2025</a>; <a href="https://www.shawlocal.com/news/2026/10/30/2026-illinois-school-report-card-record-graduation-rate-increased-student-success/" target="_blank" rel="noopener">Shaw Local</a>). That&rsquo;s 13 points. Nobody learned 13 points of reading in a year. The bar came down, and ISBE did not restate prior years, so that jump is a line you can&rsquo;t draw.
        </P>
        <P>
          But look at the next step. 2025 to 2026 is 52.4% to 55.4%, same cut scores both years, so +3.0 points is a real comparison. Math went 38.4% to 39.2%, +0.8 (<a href="https://www.shawlocal.com/news/2026/10/30/2026-illinois-school-report-card-record-graduation-rate-increased-student-success/" target="_blank" rel="noopener">Shaw Local</a>). Graduation hit 89.8%, a third straight record, after 89% and 87.7% (<a href="https://www.shawlocal.com/news/2026/10/30/2026-illinois-school-report-card-record-graduation-rate-increased-student-success/" target="_blank" rel="noopener">Shaw Local</a>). I came into this expecting to write &ldquo;the ruler moved under everything.&rdquo; It didn&rsquo;t. Not for reading, not for graduation.
        </P>
        <Fig caption={<>Illinois IAR proficiency, grades 3-8. 2024 from <a href="https://www.chalkbeat.org/chicago/2025/10/30/illinois-standardized-test-scores-show-growth-with-new-benchmarks" target="_blank" rel="noopener">Chalkbeat, Oct. 30, 2025</a>; 2025 and 2026 from <a href="https://www.shawlocal.com/news/2026/10/30/2026-illinois-school-report-card-record-graduation-rate-increased-student-success/" target="_blank" rel="noopener">Shaw Local, Oct. 30, 2026</a>. 2024 was scored on the old cut scores and was not restated, so only 2025 to 2026 is a like-for-like comparison.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22English+language+arts%22%2C%22Math%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222024+%28old+cut+scores%29%22%2C%22data%22%3A%5B39.4%2C27.9%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22barPercentage%22%3A0.9%2C%22categoryPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%222025+%28new+cut+scores%29%22%2C%22data%22%3A%5B52.4%2C38.4%5D%2C%22backgroundColor%22%3A%22%23777%22%2C%22barPercentage%22%3A0.9%2C%22categoryPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%222026+%28new+cut+scores%29%22%2C%22data%22%3A%5B55.4%2C39.2%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.9%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Illinois+IAR+proficiency%2C+grades+3-8+%28%25+proficient%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A14%7D%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A70%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart of Illinois ELA and math proficiency for 2024, 2025 and 2026" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>
        <H2>The label is where it got weird</H2>
        <P>
          Last year almost three-quarters of Illinois schools were Commendable. Now Commendable is a little more than a quarter of them. In Chicago, Exemplary went from 2% of schools to 9%, and the share in the two lowest tiers grew too (about 14% last year; Chalkbeat gives no 2026 figure) (<a href="https://www.chalkbeat.org/chicago/2026/10/30/2026-illinois-state-report-card-released-by-isbe-with-data-on-cps-schools/" target="_blank" rel="noopener">Chalkbeat</a>). Both tails got fatter. That isn&rsquo;t children learning more in the middle of the room. That&rsquo;s what happens when you change the bins.
        </P>
        <P>
          There&rsquo;s one design choice I keep staring at. ISBE says its &ldquo;elevating&rdquo; indicators (English learner progress, attendance, the climate survey) can raise a school&rsquo;s designation but never lower it (<a href="https://www.isbe.net/summative" target="_blank" rel="noopener">ISBE</a>). A one-way ratchet. Fine, that&rsquo;s a policy call. But it means a school can move up a tier without its proficiency moving at all, and the headline count can&rsquo;t tell you how many did. The school-level files could. I haven&rsquo;t run that yet (and nobody on release day did either, as far as I can tell).
        </P>
        <Divider />
        <P>
          If you want to know whether Illinois schools got better, read the 3 points. If you want to know whether Illinois got a new vocabulary, read the 27%.
        </P>
        <P>
          <em>— TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

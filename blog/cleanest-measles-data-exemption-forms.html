  html, body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }

<script type="text/babel" data-presets="react">

const POST = {
  kind:    'Analysis',
  number:  '087',
  date:    'July 16, 2026',
  readTime: '3 min',
  title:   'The cleanest measles data we have is a stack of school exemption forms',
  dek:     'The 2024–25 kindergarten exemption rate hit a record 3.6% and MMR coverage slipped to 92.5%, below the herd-immunity line. Then measles came back — and the paperwork had called it a year early.',
  byline:  'T.J. Müehleman',

// =============================================================================

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (

const Small = ({ children, style }) => (

    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>

      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>← All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      {/* Wordmark */}
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>

      <Rule double />

      {/* Meta row */}
      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>№ {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>

      <Rule />

        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>

);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900 }}>
      <img
        src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222019%22%2C%222020%22%2C%222021%22%2C%222022%22%2C%222023%22%2C%222024%22%2C%222025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22U.S.+confirmed+measles+cases%22%2C%22data%22%3A%5B1274%2C13%2C49%2C121%2C59%2C285%2C2288%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23777%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+confirmed+measles+cases+by+year%2C+2019%5Cu20132025%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Confirmed+cases%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
        alt="Bar chart of U.S. confirmed measles cases by year, 2019 through 2025. 2019: 1,274. 2020: 13. 2021: 49. 2022: 121. 2023: 59. 2024: 285. 2025: 2,288."
        style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>
        After two decades of near-zero years, 2025 was the most measles the U.S. has counted since it eliminated the disease in 2000. Source: <a href="https://www.cdc.gov/measles/data-research/index.html" style={{ color:'inherit' }}>CDC, Measles Cases and Outbreaks</a>.
      </figcaption>
    </figure>
  </Container>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Every fall, somebody in a school office counts a stack of forms. Not lab results, not case reports — permission slips, more or less. A parent signs one so their kid can start kindergarten without a required shot. In 2024–25, <a href="https://www.cdc.gov/schoolvaxview/data/index.html">3.6% of U.S. kindergartners showed up with one</a>, a record, up from 3.3% the year before. That's the cleanest number in the whole measles story. And it landed a year before anybody got sick.
        </P>

        <P>
          Here's what a data person notices first: those forms are exact. The parent didn't forget, didn't move, didn't lose the records. They filed to opt out. It's a deliberate "no" — written down, dated, and counted before the school year even starts.
        </P>

        <P>
          Add them all up and MMR coverage among kindergartners fell to <a href="https://www.cdc.gov/measles/data-research/index.html">92.5%</a>, down from <a href="https://www.cdc.gov/measles/data-research/index.html">95.2% in 2019–20</a>. 95% is the floor — below it, measles has room to run — and roughly <a href="https://www.cdc.gov/measles/data-research/index.html">286,000 kindergartners</a> are sitting under it. That's not a model. It's a headcount of five-year-olds, taken every autumn.
        </P>

        <P>
          Then the disease did exactly what the forms said it would. The U.S. logged <a href="https://www.cdc.gov/measles/data-research/index.html">2,288 confirmed measles cases in 2025</a> — the most in any year since the country declared measles eliminated in 2000, roughly double the next-worst year (2019) since. <a href="https://www.cdc.gov/measles/data-research/index.html">2026 was already past 2,000 confirmed cases by early June</a> and on track to break the record again.
        </P>

        <H2>Watch the precision fall apart</H2>

        <P>
          Now watch what happens to the data once measles is actually spreading. When the CDC reports who's getting sick, it doesn't say "unvaccinated." It reports one combined column: <a href="https://www.cdc.gov/measles/data-research/index.html">"unvaccinated or unknown."</a> In 2024, <a href="https://www.cdc.gov/measles/data-research/index.html">89% of cases</a> landed in that bucket. The agency explains why: mid-outbreak, jurisdictions often can't separate "this person chose not to vaccinate" from "we have no record for this person." So they lump the two together to keep up.
        </P>

        <Callout label="Two datasets, opposite precision">
          The school exemption form, filed a year early in a quiet office, can tell refusal from a missing record. The outbreak tracker, running live during an emergency, mostly can't — which is why the CDC files the sick under <a href="https://www.cdc.gov/measles/data-research/index.html">"unvaccinated or unknown."</a> The clean number comes first and slow. The blurry one comes later and fast.
        </Callout>

        <P>
          Think about that ordering. We had the sharp number in hand — a precise count of deliberate opt-outs, climbing three years running — and spent the year staring at the fuzzy one that shows up after people are already in the hospital.
        </P>

        <H2>The average is the other trap</H2>

        <P>
          "92.5% national coverage" sounds like a rounding error. But measles doesn't infect a national average. It infects a classroom. <a href="https://www.cdc.gov/schoolvaxview/data/index.html">17 states</a> run exemption rates above 5%, and <a href="https://www.cdc.gov/schoolvaxview/data/index.html">Idaho sits at 15.4%</a> — more than four times the national figure. The CDC says it plainly: <a href="https://www.cdc.gov/measles/data-research/index.html">pockets of unvaccinated people can exist in states with high vaccination coverage</a>. The headline number launders the local one.
        </P>

        <Fig caption={<>The national exemption average hides the pockets where measles actually spreads. Source: <a href="https://www.cdc.gov/schoolvaxview/data/index.html" style={{ color:'inherit' }}>CDC SchoolVaxView</a>, 2024–25 school year.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22National+average%22%2C%22Idaho+%28highest%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Kindergarten+exemption+rate+%28%25%29%22%2C%22data%22%3A%5B3.6%2C15.4%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Kindergarten+vaccine+exemption+rate%3A+U.S.+vs+the+top+state%2C+2024%5Cu201325%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Exemption+rate+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of kindergarten vaccine exemption rates for the 2024-25 school year. National average: 3.6%. Idaho, the highest state: 15.4%."
            style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <Divider />

        <P>
          None of this needed a forecast model. It needed reading a stack of permission slips and believing them. The exemption rate is a leading indicator that shows up on paper, in ink, a full year early — and it's been climbing three years straight. The case count is just the part that made the news.
        </P>

        <P>
          <em>— TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

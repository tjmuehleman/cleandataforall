const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here’s a mechanism almost nobody outside a school nutrition office knows exists. If your household gets SNAP, your kid is automatically certified for free school meals. No application, no income form, no phone call. A data match does it, quietly, in a state system, and the family never sees it happen.
        </P>

        <P>
          So when Congress cut SNAP by <a href={S_CBO_SNAP} target="_blank" rel="noopener">nearly $187 billion through 2034</a> in the law enacted July 4, 2025, some kids lost lunch as a side effect of losing groceries. CBO priced that side effect: <a href={S_CBPP_NUM} target="_blank" rel="noopener">96,000 children in an average month</a> losing free school meals and Summer EBT because the automatic eligibility went away with the benefit. It’s a good number. Specific, auditable, not an advocacy projection.
        </P>

        <P>
          It’s also the smallest number in this story.
        </P>

        <H2>The number that actually decides who eats</H2>

        <P>
          That same data match does a second job, and the second job is the big one. Under the Community Eligibility Provision, a school — or a group of schools, or an entire district — that hits <a href={S_FEDREG} target="_blank" rel="noopener">25% “identified students”</a> can stop collecting meal applications altogether and feed every kid free. Identified students are the ones certified without a form, mostly through SNAP. Cross the line and everybody eats. Fall under it and the cafeteria goes back to applications, tiers, and unpaid meal debt.
        </P>

        <P>
          Here’s the part that makes me twitchy. That percentage — the ISP — is measured <a href={S_CFR_ISP} target="_blank" rel="noopener">as of April 1 of the school year before you implement</a>, per 7 CFR 245.9(f)(3)(i). One date, once a year. Then it gets <a href={S_CFR_MULT} target="_blank" rel="noopener">multiplied by 1.6</a> to set the share of meals reimbursed at the federal free rate. Everything above that comes back at the much lower paid rate, and the district covers the difference out of non-federal money or stops participating.
        </P>

        <P>
          A one-day count, run through a fixed multiplier, decides whether a building can afford to feed children. Snapshot in, budget out. I build systems like this for a living and that design would keep me up at night.
        </P>

        <H2>Then the input moved</H2>

        <P>
          SNAP participation is down <a href={S_CBPP_TRK} target="_blank" rel="noopener">more than 4.5 million people, about 11%</a>, between the law’s July 2025 enactment and April 2026. Down in every state except Alaska. Down 10% or more in 23 states. Unemployment sat flat at roughly 4% the whole stretch, which is the tell — this isn’t need receding, it’s the machinery. In the 19 states that publish child-level counts, <a href={S_CBPP_TRK} target="_blank" rel="noopener">1,069,158 fewer children</a> are on SNAP. CBPP puts the national figure at more than 1.5 million.
        </P>

        <P>
          The last time the rolls moved like this was 1997 — <a href={S_CBPP_TRK} target="_blank" rel="noopener">11%, 2.7 million people, in nine months</a>, after the 1996 cuts. That’s the comparison class. Not a normal year with a bad quarter.
        </P>

        <H2>A national average is the wrong tool here</H2>

        <Fig caption={<>Nineteen states, nineteen different years. Percent decline in children receiving SNAP, July 2025 to each state’s latest reported month (March–June 2026). Arizona’s decline is larger than any other state’s, so the 19-state total is not a national estimate. Source: <a href={S_CBPP_TRK} target="_blank" rel="noopener" style={{ color:'inherit' }}>CBPP SNAP Tracker</a>, CBPP calculations of state agency data as of July 20, 2026.</>}>
          <img src={VAR_CHART} alt="Bar chart of percent decline in children receiving SNAP by state, July 2025 to latest month: Arizona 49%, Louisiana 23%, Massachusetts 18%, Texas 18%, Kansas 13%, Maine 10%, California 9%, Ohio 9%, Pennsylvania 9%, Arkansas 8%, Michigan 8%, South Dakota 8%, Vermont 8%, Alabama 7%, New Jersey 7%, Maryland 6%, Missouri 6%, New Mexico 6%, New Hampshire 4%." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Arizona is down 49% on children. New Hampshire is down 4. Averaging those tells you nothing useful, because CEP isn’t an average — it’s a threshold, crossed or not crossed, building by building. A district sitting at 27% ISP and a district sitting at 61% are having completely different years, and only one of them is about to reprint meal applications. The dispersion is the finding. The mean is noise.
        </P>

        <H2>The record was stale when it printed</H2>

        <P>
          Meanwhile the official scoreboard says everything is great. FRAC’s July report counts a <a href={S_FRAC_RPT} target="_blank" rel="noopener">record 55,362 schools</a> serving free breakfast and lunch to all students through CEP in 2025–2026, <a href={S_FRAC_RPT} target="_blank" rel="noopener">27.6 million children</a>, <a href={S_FRAC_RPT} target="_blank" rel="noopener">74.9% of eligible schools</a> participating. Record year.
        </P>

        <P>
          That record ran on eligibility determined by the April 2025 snapshot. Three months before the law passed.
        </P>

        <P>
          FRAC says the quiet part out loud, to their credit. Growth was <a href={S_FRAC_RPT} target="_blank" rel="noopener">1,128 schools, 2.1%</a> — the lowest rate in the program’s history — and <a href={S_FRAC_RPT} target="_blank" rel="noopener">17 states plus DC lost CEP schools</a> outright. The record and the reversal are in the same document.
        </P>

        <Callout label="Two numbers, one report">
          55,362 schools on CEP, an all-time high. 2.1% growth, an all-time low. Both from <a href={S_FRAC_PDF} target="_blank" rel="noopener">FRAC’s 2026 CEP report</a>, both computed on a base that has since fallen 11%.
        </Callout>

        <P>
          One more thing, because I can’t leave it alone. FRAC’s <a href={S_FRAC_NEWS} target="_blank" rel="noopener">press release</a> says 386,019 more children attended a CEP school this year. FRAC’s <a href={S_FRAC_RPT} target="_blank" rel="noopener">own report page</a> says 368,019, a 1.4% increase. Somebody transposed two digits, and eighteen thousand children exist or don’t depending on which page you landed on. This isn’t a knock on FRAC — it happens in every shop, including mine, and they publish more usable school-meals data than anyone. It’s just a reminder that the number you’re arguing about was typed by a person having a Tuesday.
        </P>

        <Divider />

        <P>
          The April 1, 2026 snapshot already happened. It’s sitting in state direct-certification systems right now, matched and counted, quietly deciding which schools serve free breakfast next year. The number that decides who eats already exists. We don’t get to read it until next summer.
        </P>

      </article>
    </Prose>
  </Container>
);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Eighty-six percent. That’s the share of American 5-year-olds enrolled in school in 2024, according to <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">the 2026 Condition of Education</a>. In 2019 it was <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">86%</a>. In between it fell to <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">79%</a>. Same shape for 3- and 4-year-olds: <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">49%, then 40%, now 50%</a>. NCES calls the 2024 rates <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">not measurably different</a> from 2019, and the trade press ran it as <a href="https://www.k12dive.com/news/nces-reports-show-enrollment-rebound-among-youngest-students/822063/" target="_blank" rel="noopener">a rebound among the youngest students</a>.
        </P>

        <P>
          And last fall Colorado’s kindergarten count <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">fell 2.0%</a>.
        </P>

        <P>
          Both of those are correct. They just aren’t the same kind of number.
        </P>

        <H2>A rate is a fraction</H2>

        <P>
          The 86% comes from the <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">American Community Survey</a>. That’s a household survey. It asks families whether the kid is enrolled, anywhere, and divides by all the kids that age. The headcounts everybody argues about come from a different pipe, the <a href="https://nces.ed.gov/programs/coe/indicator/cga/public-school-enrollment" target="_blank" rel="noopener">Common Core of Data</a>, where states report how many students are sitting in public schools each fall. One of these has a denominator. The other one doesn’t.
        </P>

        <P>
          So here’s how you get both headlines at once. If there are fewer 5-year-olds, and 86% of them show up, the rate is flat and kindergarten shrinks.
        </P>

        <P>
          Colorado is the clean example. Its October 2025 count came in at <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">870,793 students</a>, down <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">10,272, or 1.2%</a>. Kindergarten went from <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">58,604 to 57,438</a>. The first thing the release points to is the state demographer and a <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">declining number of births statewide across the last two decades</a>. (I wrote about that floor <a href="kindergarten-class-counted-in-2020.html">last week</a>. This year’s kindergarten class was on file in 2020.)
        </P>

        <Fig caption={<>Source: <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">Colorado Department of Education, fall 2025 October student count</a> (Jan. 13, 2026). Pre-K 31,861 to 33,067; kindergarten 58,604 to 57,438; total 881,065 to 870,793. Pre-K covers district-run programs only.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Pre-K+%28%2B3.8%25%29%22%2C%22Kindergarten+%28-2.0%25%29%22%2C%22All+grades%2C+pre-K+to+12+%28-1.2%25%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B3.8%2C-2.0%2C-1.2%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Colorado+October+count%2C+2024+to+2025%3A+one-year+change%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-3%2C%22max%22%3A5%2C%22stepSize%22%3A1%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+change%2C+Oct.+2024+to+Oct.+2025%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22x%22%7D%5D%2C%22yAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22y%22%7D%5D%7D%7D%7D&amp;v=2.9.4&amp;w=900&amp;h=480&amp;bkg=transparent&amp;devicePixelRatio=2" alt="Horizontal bar chart of Colorado one-year enrollment change: pre-K up 3.8%, kindergarten down 2.0%, all grades down 1.2%" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Same table, one row up: pre-K grew <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">3.8%</a>, to <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">33,067</a>. California did the bigger version. Transitional kindergarten added <a href="https://edsource.org/2026/declining-school-enrollment-california/756174" target="_blank" rel="noopener">36,000 kids, up 20.1%, to 213,313</a>, in the same year the state lost <a href="https://edsource.org/2026/declining-school-enrollment-california/756174" target="_blank" rel="noopener">74,961 students overall</a>. States are building seats for 4-year-olds while the grade right above them gets smaller.
        </P>

        <P>
          One more thing about that Colorado release (I can’t help it). The text says enrollment declined in <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/news-release-enrollment-2026" target="_blank" rel="noopener">nine out of 13 grade levels</a>. I count ten in the table printed right under it. Kindergarten through third, fifth, seventh through eleventh. Dunno.
        </P>

        <H2>The math I couldn’t finish</H2>

        <P>
          The brief I started from said the enrollment cliff isn’t where the data says it is. I’d put it differently. The rate recovered and the count didn’t, and they were never measuring the same thing.
        </P>

        <P>
          Nationally, public schools went from <a href="https://nces.ed.gov/programs/coe/indicator/cga/public-school-enrollment" target="_blank" rel="noopener">50.8 million students in fall 2019</a> to <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">49.4 million in fall 2024</a>. High school went <em>up</em> over that stretch, <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">2%, from 15.2 million to 15.5 million</a>, after peaking at <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">15.6 million in fall 2023</a>. So the loss is all below ninth grade: pre-K through 8 went from <a href="https://nces.ed.gov/programs/coe/indicator/cga/public-school-enrollment" target="_blank" rel="noopener">35.6 million</a> to <a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">33.9 million</a>.
        </P>

        <P>
          What I wanted to do next is split that loss into two piles: fewer kids, and a smaller share of kids enrolled. You need fall 2019 and fall 2024 counts for pre-K and kindergarten to do it. The NCES indicator page that breaks those grades out <a href="https://nces.ed.gov/programs/coe/indicator/cga/public-school-enrollment" target="_blank" rel="noopener">stops at fall 2022</a>, when both were still <a href="https://nces.ed.gov/programs/coe/indicator/cga/public-school-enrollment" target="_blank" rel="noopener">4 and 5 percent</a> under 2019. And the enrollment projection on that same page, <a href="https://nces.ed.gov/programs/coe/indicator/cga/public-school-enrollment" target="_blank" rel="noopener">46.9 million by fall 2031</a>, is built on <a href="https://nces.ed.gov/programs/coe/indicator/cga/public-school-enrollment" target="_blank" rel="noopener">historical data through fall 2021, only</a>. That forecast was fit to the bottom of the hole.
        </P>

        <Divider />

        <P>
          So the youngest students did come back. All 86% of them. There are just fewer of them to count, and the survey that says they’re back was never going to tell you that.
        </P>

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://nces.ed.gov/sites/default/files/nces/document/2026/05/NCES%202026144.pdf" target="_blank" rel="noopener">NCES, Report on the Condition of Education 2026 (NCES 2026-144)</a>, May 2026: enrollment rates by age for 2019, 2021, 2023 and 2024; fall 2024 public enrollment; grades 9-12 change</>,
          <><a href="https://nces.ed.gov/programs/coe/indicator/cga/public-school-enrollment" target="_blank" rel="noopener">NCES, Public School Enrollment indicator</a>, last updated May 2024: fall 2019 total, fall 2022 pre-K and kindergarten vs. 2019, projection to fall 2031 and its footnote</>,

          <><a href="https://edsource.org/2026/declining-school-enrollment-california/756174" target="_blank" rel="noopener">EdSource, California enrollment decline</a>, 2026: statewide change, transitional kindergarten</>,
          <><a href="https://www.k12dive.com/news/nces-reports-show-enrollment-rebound-among-youngest-students/822063/" target="_blank" rel="noopener">K-12 Dive, NCES reports show enrollment rebound among youngest students</a>, June 5, 2026</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          <a href="https://www.cdc.gov/measles/data-research/index.html">1,983 confirmed measles cases through May 28</a>. Forty jurisdictions reporting. <a href="https://abcnews.com/Health/us-measles-cases-surpass-2000-2nd-year-row/story?id=133618006">92% of patients unvaccinated or unknown status</a>. The worst year for measles since the early 1990s, and we&rsquo;re not halfway through it.
        </P>

        <P>
          <a href="https://www.paho.org/en/news/2-3-2026-update-review-measles-elimination-status">PAHO&rsquo;s Regional Verification Commission reviews US measles-elimination status in November</a>. The 1,983 is the loud number. It is also not the number the review actually runs on.
        </P>

        <H2>The criterion is a calendar.</H2>

        <P>
          Elimination, under <a href="https://www.kff.org/other-health/measles-elimination-status-what-it-is-and-how-the-u-s-could-lose-it/">WHO/PAHO rules</a>, means a country has gone twelve months without endemic transmission from a single chain. The outbreak that anchors this conversation <a href="https://www.paho.org/en/news/2-3-2026-update-review-measles-elimination-status">started in Gaines County, Texas, on January 20, 2025</a>. Twelve months from there is January 2026. The Verification Commission was supposed to meet that April. <a href="https://us.cnn.com/2026/03/02/health/us-measles-elimination-status-paho-meeting-delay">It moved the meeting to November</a>.
        </P>

        <P>
          That delay is the only reason the certification is still on the books. The criterion has already failed.
        </P>

        <P>
          The 1,983 doesn&rsquo;t enter into it. It could be 5,000 or 500 in November and the question PAHO is answering is the same one: is the chain that started in January 2025 still in the data? The answer is yes &mdash; <a href="https://www.cdc.gov/measles/data-research/index.html">93% of 2026&rsquo;s cases are outbreak-associated</a>, and 1,330 of them trace to outbreaks that began in 2025.
        </P>

        <P>
          (<a href="https://www.kff.org/other-health/measles-elimination-status-what-it-is-and-how-the-u-s-could-lose-it/">PAHO retired Canada&rsquo;s elimination status in November 2025</a> on the same criterion. The chain was the operative number then too.)
        </P>

        <H2>The 92.5% national MMR average hides where the cases are.</H2>

        <P>
          <a href="https://www.aha.org/news/headline/2025-08-04-cdc-data-finds-kindergarten-vaccination-rates-declined-during-2024-25-school-year">US kindergarten MMR coverage in the 2024&ndash;25 school year was 92.5%</a>. <a href="https://www.cdc.gov/mmwr/volumes/70/wr/mm7003a2.htm">Down from 95.2% in 2019&ndash;20</a>. The national average has been under the 95% herd-immunity floor for <a href="https://www.kff.org/medicaid/kindergarten-routine-vaccination-rates-continue-to-decline/">five years running</a>.
        </P>

        <Fig caption={<>Sources: <a href="https://www.cidrap.umn.edu/childhood-vaccines/us-childhood-vaccination-rates-continue-fall-cdc-data-show">CDC SchoolVaxView 2024&ndash;25 (national + Idaho + Connecticut)</a> and <a href="https://www.texastribune.org/2026/03/17/texas-measles-hudspeth-county-health-department/">Texas DSHS / Texas Tribune (Gaines County)</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Connecticut+%28best+state%29%22%2C%22US+national+average%22%2C%22Idaho+%28worst+state%29%22%2C%22Gaines+County%2C+TX%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222024-25+kindergarten+MMR+coverage+%28%25%29%22%2C%22data%22%3A%5B98.2%2C92.5%2C78.5%2C77.0%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%233a3a3a%22%2C%22%23141210%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+92.5%25+national+MMR+average+hides+the+cluster+below+80%25%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A14%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A8%2C%22bottom%22%3A14%2C%22left%22%3A12%2C%22right%22%3A28%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+kindergartners+with+2-dose+MMR%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%2C%22annotation%22%3A%7B%22annotations%22%3A%5B%7B%22type%22%3A%22line%22%2C%22mode%22%3A%22vertical%22%2C%22scaleID%22%3A%22x%22%2C%22value%22%3A95%2C%22borderColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A2%2C%22borderDash%22%3A%5B6%2C4%5D%2C%22label%22%3A%7B%22enabled%22%3Atrue%2C%22content%22%3A%2295%25+herd-immunity+threshold%22%2C%22position%22%3A%22top%22%2C%22backgroundColor%22%3A%22rgba%28244%2C239%2C230%2C0.95%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontStyle%22%3A%22bold%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of 2024-25 kindergarten MMR coverage: Connecticut 98.2%, US national average 92.5%, Idaho 78.5%, and Gaines County Texas at 77%, with the 95% herd-immunity threshold shown as a dashed line" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          State range: <a href="https://www.newsweek.com/states-highest-lowest-kindergarten-vaccine-rates-2107551">Idaho 78.5% to Connecticut 98.2%</a>. Only ten states are above 95%. The county where the outbreak that started the chain originated &mdash; <a href="https://www.texastribune.org/2025/03/04/west-texas-measles-outbreak-mennonite-seminole/">Gaines County, Texas &mdash; was at 77%</a>.
        </P>

        <P>
          One number does the work of three different countries. The national average is the wrong unit for a disease that spreads in two-county clusters while 3,000 other counties stay above the line.
        </P>

        <H2>&ldquo;Unvaccinated or unknown&rdquo; is two categories.</H2>

        <P>
          CDC reports that <a href="https://abcnews.com/Health/us-measles-cases-surpass-2000-2nd-year-row/story?id=133618006">92% of 2026 patients are &ldquo;unvaccinated or unknown status.&rdquo;</a> It&rsquo;s the headline stat in every recap. It is also two different problems.
        </P>

        <P>
          &ldquo;Unvaccinated&rdquo; is a coverage problem. &ldquo;Unknown&rdquo; is a data-quality problem &mdash; a person showed up with measles and nobody recorded whether they were ever vaccinated. The two categories live in the same bucket because the clinical answer (assume worst, treat as unvaccinated) is the same. The policy lever isn&rsquo;t.
        </P>

        <P>
          When 92% spans both, the public-health intervention either is or isn&rsquo;t sized to the right share of the population, depending which one you mean. CDC keeps the split in its line-list. The dashboard collapses it. The dashboard is what travels.
        </P>

        <H2>The cases sit in clusters, not in the country.</H2>

        <P>
          Among Texas&rsquo;s 2026 cases, <a href="https://www.texastribune.org/2026/04/02/texas-measles-hudspeth-el-paso-federal-detention-immigration/">the largest single concentration is the West Texas Detention Facility</a> in Hudspeth County &mdash; a federal facility operated by LaSalle Corrections under a US Marshals Service contract, not by ICE &mdash; with <a href="https://www.texastribune.org/2026/03/17/texas-measles-hudspeth-county-health-department/">at least 108 confirmed cases by mid-March</a> and <a href="https://www.texastribune.org/2026/04/02/texas-measles-hudspeth-el-paso-federal-detention-immigration/">135 by early April</a>.
        </P>

        <P>
          <a href="https://elpasomatters.org/2026/05/03/el-paso-texas-measles-outbreak-ice-camp-east-montana-west-texas-detention/">El Paso Matters reported that the facility didn&rsquo;t fully share case data with the county health department for weeks</a>, and at least four El Paso residents who worked there became infected and seeded community transmission. The number on the CDC dashboard caught up after the reporting did.
        </P>

        <P>
          That isn&rsquo;t a special pleading. It&rsquo;s a structural feature of the dataset. When a sizable share of an outbreak comes from one closed facility with intermittent reporting, the national line graph is doing different work than people think it is.
        </P>

        <Callout label="The receipt">
          <a href="https://www.cdc.gov/measles/data-research/index.html">1,983 cases through May 28, 2026.</a> 93% outbreak-associated. <a href="https://abcnews.com/Health/us-measles-cases-surpass-2000-2nd-year-row/story?id=133618006">92% unvaccinated or unknown.</a> <a href="https://www.aha.org/news/headline/2025-08-04-cdc-data-finds-kindergarten-vaccination-rates-declined-during-2024-25-school-year">National kindergarten MMR: 92.5%.</a> Idaho 78.5%. Gaines County 77%. <a href="https://www.texastribune.org/2026/04/02/texas-measles-hudspeth-el-paso-federal-detention-immigration/">135 of Texas&rsquo;s cases in one West Texas detention facility.</a> <a href="https://www.paho.org/en/news/2-3-2026-update-review-measles-elimination-status">PAHO reviews November 2026.</a>
        </Callout>

        <Divider />

        <P>
          The November review is going to retire US measles elimination on a twelve-month calendar nobody made loud, on a national average that hides where the cases are, on a column called &ldquo;unvaccinated or unknown&rdquo; that hides what the data is actually missing.
        </P>

        <P>
          The 1,983 is the receipt, not the cause.
        </P>

        <P>

const H2 = ({ children }) => <h2>{children}</h2>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In 2023, cholera killed <a href="https://www.who.int/news/item/12-09-2025-cholera-kills-more-people-for-second-consecutive-year-while-prevention-and-treatment-available">4,007 people</a>. In 2025 it killed <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-cholera--epidemiological-update--33--27-january-2026">7,598</a>. That’s the body count nearly doubling in two years — for a disease we’ve known how to treat since before the moon landing. Clean water and a packet of oral rehydration salts. Pennies.
        </P>

        <P>
          The reflex read is “the outbreak got bigger.” It did, a little. Reported cases went from <a href="https://www.who.int/news/item/12-09-2025-cholera-kills-more-people-for-second-consecutive-year-while-prevention-and-treatment-available">535,321</a> to <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-cholera--epidemiological-update--33--27-january-2026">614,828</a> — up about 15%. But deaths climbed six times faster. When the death count outruns the case count like that, one number does the explaining. And it isn’t the case count.
        </P>

        <H2>The ratio is the tell</H2>

        <P>
          Case-fatality rate is just deaths divided by cases: of everyone who got sick, what share died. For cholera, WHO treats <a href="https://www.who.int/news-room/fact-sheets/detail/cholera">1% as the line</a> — with prompt rehydration you should be able to keep it under there. In 2023 the world was under it, around 0.75%. By 2025 it was 1.24%. The curve on the chart above that crosses the dotted line and keeps going? That’s the whole story.
        </P>

        <P>
          A rising fatality rate for a curable disease is not the pathogen getting meaner. It’s a measurement of who reached treatment in time, and who didn’t. WHO’s own 2024 numbers say a <a href="https://www.who.int/news/item/12-09-2025-cholera-kills-more-people-for-second-consecutive-year-while-prevention-and-treatment-available">quarter of cholera deaths</a> happened in the community — outside any health facility. People dying before they were ever a patient in a ledger somewhere.
        </P>

        <H2>Fewer places are even counting</H2>

        <P>
          Here’s the part that gets me as a data guy. The number of countries reporting cholera to WHO went 45 in 2023, up to <a href="https://www.who.int/news/item/12-09-2025-cholera-kills-more-people-for-second-consecutive-year-while-prevention-and-treatment-available">60 in 2024</a>, then <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-cholera--epidemiological-update--33--27-january-2026">33 in the 2025 tally</a>. I won’t pretend those three counts use identical rules — the annual global report and the multi-country situation reports scope things a bit differently. But the direction is uncomfortable. Deaths are climbing while the reporting footprint isn’t.
        </P>

        <P>
          And the deaths are concentrating. In 2025 the African region alone logged <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-cholera--epidemiological-update--33--27-january-2026">5,315 of the 7,598 deaths</a>. Sudan is the case study nobody wants: a fresh outbreak in West Kordofan has killed at least <a href="https://www.africanews.com/2026/07/02/who-says-120-dead-in-sudans-latest-cholera-outbreak/">120 people since May 2026</a> — its third wave in three years, erupting two months after the country declared the previous one over. That previous wave infected more than 124,400 people and killed over 3,500. In DR Congo, the first quarter of 2026 alone brought <a href="https://www.who.int/publications/m/item/multi-country-outbreak-of-cholera--epidemiological-update--35--27-march-2026">522 deaths</a>.
        </P>

        <Fig caption={<>Source: WHO Multi-country cholera epidemiological update #33. Reported deaths by WHO region, full-year 2025. The African and Eastern Mediterranean regions account for 7,482 of the 7,598 total.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22African+Region%22%2C%22Eastern+Mediterranean%22%2C%22Americas%22%2C%22Western+Pacific%22%2C%22South-East+Asia%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Cholera+deaths%2C+2025%22%2C%22data%22%3A%5B5315%2C2167%2C78%2C27%2C11%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23777%22%2C%22%23bbb%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Where+cholera+killed+in+2025%3A+7%2C598+deaths%2C+one+region%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A6000%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Reported+deaths%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of reported cholera deaths by WHO region in 2025. African Region 5,315, Eastern Mediterranean 2,167, Americas 78, Western Pacific 27, South-East Asia 11." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <H2>Supply went up. That’s not the constraint.</H2>

        <P>
          There’s a genuinely good number in here. Global supply of oral cholera vaccine <a href="https://www.who.int/news/item/04-02-2026-preventive-cholera-vaccination-resumes-as-global-supply-reaches-critical-milestone">doubled</a> — from 35 million doses in 2022 to nearly 70 million in 2025 — enough that in February 2026 WHO restarted preventive campaigns for the first time in over three years, starting with Mozambique.
        </P>

        <Callout label="The distinction that matters">
          A rising case-fatality rate is not a supply problem you can solve from a warehouse. Doses that exist don’t help the kid in a war zone the truck can’t reach. When the thing that’s climbing is the share of the sick who die, the binding constraint isn’t how much you have — it’s whether it arrives.
        </Callout>

        <P>
          Which is why the CFR is the number I’d put on the dashboard, not the case count. Cases tell you how loud the outbreak is. The fatality rate tells you whether the system underneath it still works. Sudan can declare an outbreak over in March and be burying people from the next one by May — the doses can be sitting in a depot the whole time.
        </P>

        <Divider />

        <P>
          Cholera is the disease we solved and never finished delivering. The case count tells you how many people got sick. The death rate tells you how many we reached. Right now both are pointed the wrong way — and only one of them is a mystery.
        </P>

        <P><em>— TJ</em></P>

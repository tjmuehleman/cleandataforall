const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Most federal programs that shrink leave a crime scene. A vote, a rescission, a shutdown standoff, an angry press release from somebody’s office. Head Start lost 277,658 funded slots between FY15 and FY25, and the closest thing to a crime scene is a table in a regulatory impact analysis.
        </P>

        <P>
          The count comes from HHS’s own analysts at ASPE: <a href="https://aspe.hhs.gov/sites/default/files/documents/b0d3392889f0e9750f6f66e7f0fab380/OHS%20Historical%20Approach%20to%20Regulation_Final.pdf" target="_blank" rel="noopener">944,581 funded slots in FY15, 666,923 in FY25</a>. A 29% drop. That’s funded slots (the seats the federal grant is paying for), not cumulative enrollment, which is a different number I <a href="nobody-voted-shrink-head-start-grantees-filed-requests.html">wrote about in September</a>.
        </P>

        <H2>The forecast was in the rule</H2>

        <P>
          Here’s the part that made me put my coffee down. Nobody should be surprised. When HHS rewrote the Head Start performance standards in 2016, and again in 2024, each rule shipped with an estimate of how many seats the new requirements would cost. ASPE adds them up: “Combined, the two rulemakings were estimated to reduce funded slots by 228,000” (<a href="https://aspe.hhs.gov/sites/default/files/documents/b0d3392889f0e9750f6f66e7f0fab380/OHS%20Historical%20Approach%20to%20Regulation_Final.pdf" target="_blank" rel="noopener">ASPE, Aug 2026</a>). The 2016 rule alone: 123,614 fewer slots.
        </P>

        <P>
          The mechanism is not mysterious. New requirements cost money. A fixed-ish pot divided by a higher price per seat buys fewer seats. That’s not a conspiracy. It’s division.
        </P>

        <P>
          And the price per seat did go up. Average spending per Head Start Preschool slot went from $10,575 in FY15 to $15,752 in FY24, in 2024 dollars. Early Head Start went from $16,042 to $21,175. In ASPE’s words, spending <a href="https://aspe.hhs.gov/sites/default/files/documents/b0d3392889f0e9750f6f66e7f0fab380/OHS%20Historical%20Approach%20to%20Regulation_Final.pdf" target="_blank" rel="noopener">“outpaced inflation by 32 percent in Early Head Start and 49 percent in Head Start Preschool.”</a>
        </P>

        <Fig caption={<>Average federal spending per funded slot, FY15 and FY24, in 2024 dollars. Head Start Preschool: $10,575 → $15,752 ($15,752 ÷ $10,575 = 1.49). Early Head Start: $16,042 → $21,175 ($21,175 ÷ $16,042 = 1.32). Source: <a href="https://aspe.hhs.gov/sites/default/files/documents/b0d3392889f0e9750f6f66e7f0fab380/OHS%20Historical%20Approach%20to%20Regulation_Final.pdf" target="_blank" rel="noopener">ASPE, Aug 2026</a>, Table 2.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Head+Start+Preschool%22%2C%22Early+Head+Start%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22FY15+%28%2410%2C575+%2F+%2416%2C042%29%22%2C%22data%22%3A%5B10575%2C16042%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%22FY24+%28%2415%2C752+%2F+%2421%2C175%29%22%2C%22data%22%3A%5B15752%2C21175%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Average+spending+per+funded+slot%2C+2024+dollars%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A25000%2C%22stepSize%22%3A5000%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Dollars+per+slot+%282024+%24%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart of average spending per funded slot in 2024 dollars: Head Start Preschool $10,575 in FY15 and $15,752 in FY24; Early Head Start $16,042 in FY15 and $21,175 in FY24." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Meanwhile the top line kept climbing. The <a href="https://headstart.gov/archive/about-us/article/head-start-program-facts-fiscal-year-2011" target="_blank" rel="noopener">FY2011 fact sheet</a> lists $7,559,634,000 available after a rescission. The <a href="https://headstart.gov/program-data/article/head-start-program-facts-fiscal-year-2024" target="_blank" rel="noopener">FY2024 fact sheet’s</a> federal funding table totals $12,271,361,085. (Both nominal, and the two tables don’t bundle line items identically, so don’t do math on them.) Budget up, seats down. Both lines are telling the truth.
        </P>

        <H2>The shape is the story</H2>

        <P>
          Compare endpoints and you miss it. From FY15 to FY22 the program lost 111,506 slots over seven years. A slow leak. From FY22 to FY25 it lost 166,152 in three. That’s about 60% of the decade’s loss crammed into the last three bars of the chart up top.
        </P>

        <P>
          I can’t tell you from these files why the slope changed. The enrollment-reduction requests grantees filed are part of it. They aren’t all of it, and I haven’t found anyone who has published the reconciliation.
        </P>

        <H2>Two numbers for one price</H2>

        <P>
          One more nit, because I can’t help myself. ASPE published two per-slot numbers this year. The <a href="https://aspe.hhs.gov/sites/default/files/documents/6b4fa8b4c6e481fdb83cae736c632425/Head%20Start%20Spending%20Per%20Slot%20Brief_Final.pdf" target="_blank" rel="noopener">February brief</a> puts <em>median</em> Head Start Preschool spending per slot at $14,532 in 2024. The August brief puts the <em>average</em> at $15,752. Both are fine. They’re different statistics. Quoted without the word in front, you have no idea which one you’re holding.
        </P>

        <P>
          So did the trade buy anything? ASPE says classroom quality scores “generally represent a plateau.” The <a href="https://aspe.hhs.gov/sites/default/files/documents/d09f085b67317c6447f63c7a6321096d/OHS%20Comprehensive%20Services_Final.pdf" target="_blank" rel="noopener">companion brief</a> is blunter: “The rule did, however, meet its forecasted increase in costs and reduction in slots.”
        </P>

        <Divider />

        <P>
          Most days my job is hunting for the number nobody published. This time the number was published, in advance, with a methodology section. The forecast was right. The seats are gone. The model worked. That’s the problem.
        </P>

        <H3>Sources</H3>
        <UL items={[
          <>ASPE, <a href="https://aspe.hhs.gov/sites/default/files/documents/b0d3392889f0e9750f6f66e7f0fab380/OHS%20Historical%20Approach%20to%20Regulation_Final.pdf" target="_blank" rel="noopener">HHS’ Historical Approach to Head Start Regulation Following the 2007 Statutory Reauthorization has Increased Costs and Reduced Access, without Substantial Quality Gains</a> (August 2026): funded slots FY15–FY25, per-slot spending, rule estimates</>,
          <>ASPE, <a href="https://aspe.hhs.gov/sites/default/files/documents/d09f085b67317c6447f63c7a6321096d/OHS%20Comprehensive%20Services_Final.pdf" target="_blank" rel="noopener">From FY16 to FY25, Fewer Head Start Families Received Comprehensive Services</a> (August 2026)</>,
          <>ASPE, <a href="https://aspe.hhs.gov/sites/default/files/documents/6b4fa8b4c6e481fdb83cae736c632425/Head%20Start%20Spending%20Per%20Slot%20Brief_Final.pdf" target="_blank" rel="noopener">Head Start Spending Per Slot Varies Widely Across Grants</a> (February 2026)</>,
          <>Office of Head Start, <a href="https://headstart.gov/archive/about-us/article/head-start-program-facts-fiscal-year-2011" target="_blank" rel="noopener">Head Start Program Facts, FY2011</a> and <a href="https://headstart.gov/program-data/article/head-start-program-facts-fiscal-year-2024" target="_blank" rel="noopener">FY2024</a></>,
        ]} />

      </article>
    </Prose>
  </Container>
);

      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Pregnant+women+%28to+prevent+transmission%29%22%2C%22Adults+%2815%2B%29%22%2C%22All+people+with+HIV%22%2C%22Children+%280%5Cu201314%29%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B84%2C78%2C77%2C55%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%235a5a5a%22%2C%22%233a3a3a%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22HIV+treatment+coverage%2C+2024%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A19%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22percent+on+antiretroviral+treatment%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of HIV treatment coverage in 2024: pregnant women 84 percent, adults 78 percent, all people with HIV 77 percent, and children aged 0 to 14 just 55 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const FS = "https://www.unaids.org/sites/default/files/media_asset/UNAIDS_FactSheet_en.pdf";
const WHO = "https://cdn.who.int/media/docs/default-source/hq-hiv-hepatitis-and-stis-library/who-ias-hiv-statistics_2025-new.pdf";
const IMPACT = "https://www.unaids.org/en/impact-US-funding-cuts/About";

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Two lines in the same UNAIDS dataset are running in opposite directions, and the
          gap between them is the whole story. New HIV infections among children fell from
          <a href={FS}> 310,000 in 2010 to 120,000 in 2024</a> &mdash; a 62% drop, one of the
          biggest sustained wins in modern global health. And in that same 2024 data, only
          <a href={FS}> 55% of children living with HIV are on treatment</a>, against 78% of
          adults. Prevention is winning. Treatment is losing. Same disease, same year, same kids.
        </P>

        <P>
          I run a data company, so I don&rsquo;t read that as a medical mystery. The drugs exist &mdash;
          pediatric dolutegravir comes as a tablet you dissolve in water. The question was never
          whether we can treat a two-year-old. It&rsquo;s whether we ever found her.
        </P>

        <H2>The win had a fixed address</H2>

        <P>
          The reason new infections cratered is almost boring: mothers show up.
          <a href={FS}> 84% of pregnant women</a> living with HIV got antiretrovirals to keep from
          passing it on. Antenatal care is a scheduled, repeatable touchpoint &mdash; a woman with a
          due date is a row in a system, a known appointment, a place to intervene. You can build a
          pipeline against a due date. Prevention worked because the data had somewhere to hook in.
        </P>

        <P>
          Then the baby is born, and the hook comes out. There&rsquo;s no due date for a toddler.
          Diagnosing an infant needs a virologic test &mdash; a PCR, not the rapid antibody strip you&rsquo;d
          use on an adult &mdash; because a baby carries the mother&rsquo;s antibodies for months and would
          test positive no matter what. That means a lab, a sample transported, a result routed back
          before the family moves on. Every one of those steps is a place to lose a kid. And we do.
        </P>

        <H2>The cascade breaks at the front door</H2>

        <P>
          Look at where children fall behind adults and it isn&rsquo;t the pharmacy. It&rsquo;s the front door.
          <a href={WHO}> 63% of children</a> with HIV even know their status, versus 88% of adults.
          On treatment: 55% versus 78%. Virally suppressed: <a href={WHO}>47% versus 74%</a>. The gap
          is widest at diagnosis and it never closes &mdash; you can&rsquo;t treat a child you haven&rsquo;t found,
          and you can&rsquo;t suppress a virus you&rsquo;re not treating. The 23-point treatment gap is mostly a
          diagnosis gap wearing a treatment gap&rsquo;s clothes.
        </P>

        <figure style={{ margin:'2.5em auto', maxWidth:900, textAlign:'center' }}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Know+their+status%22%2C%22On+treatment%22%2C%22Virally+suppressed%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Children+%280%5Cu201314%29%22%2C%22data%22%3A%5B63%2C55%2C47%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%22Adults+%2815%2B%29%22%2C%22data%22%3A%5B88%2C78%2C74%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22barPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+HIV+care+cascade%3A+children+vs.+adults%2C+2024%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22percent+of+those+living+with+HIV%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart comparing children and adults living with HIV across the care cascade in 2024. Children: 63 percent know their status, 55 percent on treatment, 47 percent virally suppressed. Adults: 88 percent, 78 percent, 74 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
          <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
            Share of people living with HIV at each cascade step, 2024. The children&rsquo;s gap is already
            wide at diagnosis (63% vs. 88%) and widens through treatment and suppression. Source: <a href={WHO}>WHO/UNAIDS, 2025</a>.
          </figcaption>
        </figure>

        <H2>The 55% is already old</H2>

        <P>
          Here&rsquo;s the part that gets me. WHO stamped a footnote on the 2024 estimates:
          <a href={WHO}> they were made &ldquo;before the implementation of cuts to foreign aid.&rdquo;</a> So the
          55% isn&rsquo;t today&rsquo;s number. It&rsquo;s the last clean reading before the instrument got unplugged.
          The US paused foreign assistance in January 2025; as of December 2024, PEPFAR was keeping
          <a href={IMPACT}> about 560,000 children</a> on treatment. UNAIDS&rsquo; own projection: if those
          programs are permanently discontinued, an <a href={IMPACT}>additional 300,000 children die of
          AIDS</a> between 2025 and 2029.
        </P>

        <Callout label="Key figure">
          <a href={FS}>75,000 children died of AIDS-related causes in 2024</a> &mdash; about 205 a day &mdash;
          down from 240,000 in 2010. The tools to prevent nearly all of it already exist.
        </Callout>

        <Divider />

        <P>
          So the pediatric gap isn&rsquo;t waiting on a breakthrough. The breakthrough shipped. It&rsquo;s waiting
          on us to count the kids the way we already count their mothers &mdash; and to keep the lights on
          long enough for the next dataset to mean anything. The saddest chart in global health right now
          is the one we can still draw. The next one, we might not be able to.
        </P>

        <P><em>&mdash; TJ</em></P>

        <H2>Sources</H2>
        <UL items={[
          <span>UNAIDS. <a href={FS}>Global HIV &amp; AIDS statistics &mdash; Fact Sheet 2025</a> (new infections among children 310,000 in 2010 &rarr; 120,000 in 2024, a 62% decline; children 0&ndash;14 ART coverage 55% vs. adults 78%; pregnant women 84%; 75,000 children died of AIDS-related causes in 2024 vs. 240,000 in 2010).</span>,
          <span>WHO / UNAIDS. <a href={WHO}>HIV statistics, globally and by WHO region, 2025</a> (care cascade for children vs. adults: know status 63% vs. 88%, on ART 55% vs. 78%, virally suppressed 47% vs. 74%; footnote that 2024 estimates were made before the implementation of foreign-aid cuts).</span>,
          <span>UNAIDS. <a href={IMPACT}>About the impact of US funding cuts on the global HIV response</a> (US foreign-assistance pause in January 2025; PEPFAR supporting about 560,000 children on treatment as of December 2024; projected additional 300,000 child AIDS deaths, 2025&ndash;2029, if programs are permanently discontinued).</span>,
        ]} />

      </article>
    </Prose>
  </Container>

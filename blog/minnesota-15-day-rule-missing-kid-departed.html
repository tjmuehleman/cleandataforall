// ==================== Shared primitives ====================

// ==================== Top bar ====================

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', margin:'0 0 56px', padding:'32px 0', textAlign:'center' }}>
      <img src={CHART_HEADLINE} alt="Students lost midyear in the same 29 Minnesota districts and charters: fewer than 80 from October 2024 to March 2025, about 1,700 from October 2025 to March 2026" style={{ width:'100%', maxWidth:900, height:'auto', display:'block', margin:'0 auto' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:14, maxWidth:760, marginLeft:'auto', marginRight:'auto' }}>
        Source: <a href="https://sahanjournal.com/education/minnesota-schools-lost-1700-students-after-metro-surge/" target="_blank" rel="noopener" style={{ color:'inherit' }}>Sahan Journal</a>, August 31, 2026. The first bar is drawn at 80, the ceiling of "fewer than 80." 1,700 ÷ 80 = 21.25, so the jump is at least 21x.

);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Sahan Journal asked 40 Minnesota schools for two numbers: their <a href="https://sahanjournal.com/education/minnesota-schools-lost-1700-students-after-metro-surge/" target="_blank" rel="noopener">October 1 and March 1 enrollment</a>. That's the whole request. Two snapshots, five months apart. Twenty-nine schools sent back something usable, and across those 29 the gap between the snapshots was about 1,700 students. The same schools, same window, one year earlier? Fewer than 80. Do the division and it's better than 21 to 1.
        </P>

        <P>
          Caveats first, because I run a data company and can't help myself. These aren't random schools. They're the districts and charters with the highest English learner shares, and 11 of the 40 couldn't or didn't give comparable numbers. So 1,700 isn't a statewide figure. It's the number for the places you'd go looking. And a snapshot is a funny thing. October 1 is a photo, March 1 is a photo, and whatever happened in between (who left, who got dropped, who walks back in come April) is in neither one. Sahan notes that some of these kids may return.
        </P>

        <Fig caption={<>Sahan Journal requested data from 20 districts (18 provided; St. Cloud Area and Windom Area were excluded) and 20 charter schools (11 provided comparative data). 18 + 11 = 29. Source: <a href="https://sahanjournal.com/education/minnesota-schools-lost-1700-students-after-metro-surge/" target="_blank" rel="noopener">Sahan Journal</a>, August 31, 2026.</>}>
          <img src={CHART_COVERAGE} alt="Sahan Journal requested enrollment data from 20 districts and 20 charters; 18 districts and 11 charters provided usable counts." style={{ width:'100%', maxWidth:900, height:'auto', display:'block', margin:'0 auto' }} />
        </Fig>

        <P>
          Now the part that makes me squint. <a href="https://www.revisor.mn.gov/statutes/cite/126C.05" target="_blank" rel="noopener">Minnesota Statute 126C.05</a> says a student absent 15 consecutive school days, without instruction at home or in a hospital, gets dropped from enrollment and stops counting toward funding. The only carve-out I can find is instruction at home or in a hospital. Fear is not a field.
        </P>

        <P>
          So to the ledger, an absence and a departure look identical. Day 15 comes, the kid isn't "absent" anymore. The kid is "withdrawn." Fridley has about 2,600 students, and Sahan found the number of kids dropped after 15 straight absences who never came back went from 4 to 12. The 74, reporting in April, counted <a href="https://www.the74million.org/article/ice-raids-caused-enrollment-to-drop-now-districts-are-paying-the-price/" target="_blank" rel="noopener">20 for the same rule in the same district</a>. Different windows, probably. I can't tell from either piece, which is sort of the point.
        </P>

        <P>
          The 74 puts the money at $1 million out of Fridley's $51 million budget, and more than $4 million in Willmar, which lost 170-plus students. Meanwhile teachers see the front end. In an Education Minnesota poll of <a href="https://educationminnesota.org/news/press-release/poll-metro-surge-impacted-nearly-three-quarters-of-minnesota-educators/" target="_blank" rel="noopener">4,460 members</a> (Voss Research and Strategy, April 27 to May 6), 91% of Twin Cities members reported increased absenteeism. Teachers see the absence. The funding formula sees the enrollment. Between them sits a 15-day clock that nobody publishes.
        </P>

        <Divider />

        <P>
          Publish the day-15 drops as their own column. Right now they live inside the enrollment number, wearing a moving-van costume.
        </P>

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://sahanjournal.com/education/minnesota-schools-lost-1700-students-after-metro-surge/" target="_blank" rel="noopener">Sahan Journal</a>, Minnesota schools lost 1,700 students after Metro Surge (Aug 31, 2026)</>,
          <><a href="https://www.revisor.mn.gov/statutes/cite/126C.05" target="_blank" rel="noopener">Minnesota Statutes 126C.05</a>, Revisor of Statutes</>,
          <><a href="https://www.the74million.org/article/ice-raids-caused-enrollment-to-drop-now-districts-are-paying-the-price/" target="_blank" rel="noopener">The 74</a>, ICE raids caused enrollment to drop; now districts are paying the price (Apr 2, 2026)</>,
          <><a href="https://educationminnesota.org/news/press-release/poll-metro-surge-impacted-nearly-three-quarters-of-minnesota-educators/" target="_blank" rel="noopener">Education Minnesota</a>, poll on Metro Surge impact</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

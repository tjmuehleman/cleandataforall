const PostHero = () => (
  <Container>
    <div style={{ borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'32px 0', margin:'0 0 56px' }}>
      <figure style={{ margin:0, maxWidth:900, marginLeft:'auto', marginRight:'auto' }}>
        <img src={HERO_CHART} alt="Bar chart: 11.2 percent of Arizona children age 5 to 17 in ZIP codes with median household income of $153,000 or more use an ESA voucher, versus 4.0 percent in ZIP codes at $35,000 or below." style={{ width:'100%', height:'auto', display:'block' }} />

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Arizona&rsquo;s voucher program has been running under universal eligibility since 2022 and <a href="https://www.edchoice.org/2026-arizonas-esa-program-crosses-the-100000-student-threshold/">crossed 100,000 students in January 2026</a>. The state can tell you the ZIP code of every one of them. It cannot tell you what a single one of their families earns.
        </P>

        <P>
          That isn&rsquo;t a transparency complaint. Arizona is one of the better states here &mdash; the Department of Education publishes <a href="https://www.azed.gov/esa/esa-quarterly-reports">quarterly ESA reports</a>, hands transaction-level data to outside researchers, and the whole thing gets picked over by RAND and EdChoice and Save Our Schools within weeks of every release. The data is public. The field just doesn&rsquo;t exist.
        </P>

        <P>
          Which brings us to June, when the AP ran the numbers and found that <a href="https://ktar.com/arizona-education/voucher-esa-income-zip-codes/5880836/">11.2% of kids in Arizona&rsquo;s high-income ZIP codes are on an ESA voucher, versus 4% in the low-income ones</a>. Nearly three times higher. That got picked up everywhere as the equity finding.
        </P>

        <P>
          Read the definitions though.
        </P>

        <P>
          &ldquo;Low-income ZIP code&rdquo; means a postal zone with a median household income of $35,000 or below. &ldquo;High-income&rdquo; means $153,000 or above. Arizona&rsquo;s actual median household income is <a href="https://www.census.gov/quickfacts/fact/table/AZ/INC110224">$79,964</a>. So the AP compared the far-left tail of the ZIP distribution to the far-right tail, and the typical Arizona family &mdash; the one both sides claim to be arguing about &mdash; is in neither bar.
        </P>

        <P>
          That&rsquo;s not a knock on the AP. It&rsquo;s the only cut you can make with the data that exists. You&rsquo;ve got a program with 100,000-plus enrollees, no income field, and ZIP code as the only economic signal in the file. So you bin the ZIPs and compare the ends, because the middle of a ZIP-median distribution tells you almost nothing about the households inside it.
        </P>

        <P>
          State Superintendent Tom Horne made exactly that objection: <a href="https://ktar.com/arizona-education/voucher-esa-income-zip-codes/5880836/">&ldquo;A ZIP code is too large an area to be indicative of the economic status of ESA users.&rdquo;</a> He&rsquo;s right. He also runs the department that would have to collect the field.
        </P>

        <P>
          And the guy on the other side agrees with him about the data. Tyler Kowch at Save Our Schools Arizona:
        </P>

        <BQ cite="Tyler Kowch, Save Our Schools Arizona, via KTAR, June 2026">
          All we have from the Department of Education is ZIP code data. We don&rsquo;t actually have data on income of people in the program. So, it would be really fantastic if the Department of Education could collect some actual data on what&rsquo;s going on in the program.
        </BQ>

        <P>
          Two people who agree on nothing else agree the measurement is wrong.
        </P>

        <H2>The cap and the proxy are $3,000 apart</H2>

        <P>
          Here&rsquo;s where it gets strange. Save Our Schools and the Arizona Education Association are gathering signatures for a ballot measure &mdash; the Protect Education Act &mdash; that <a href="https://ktar.com/arizona-education/voucher-esa-income-zip-codes/5880836/">would block families earning more than $150,000 from receiving ESA funds</a>.
        </P>

        <P>
          $150,000. The AP&rsquo;s high-income ZIP floor is $153,000.
        </P>

        <Fig caption={<>Sources: ZIP thresholds and proposed cap from <a href="https://ktar.com/arizona-education/voucher-esa-income-zip-codes/5880836/" style={{ color:'inherit' }}>KTAR, June 17, 2026</a>; Arizona median household income (2020&ndash;2024, in 2024 dollars) from <a href="https://www.census.gov/quickfacts/fact/table/AZ/INC110224" style={{ color:'inherit' }}>U.S. Census QuickFacts</a>. Bars plot dollars in thousands.</>}>
          <img src={SECOND_CHART} alt="Bar chart comparing four dollar figures: AP high-income ZIP floor $153,000, proposed ESA income cap $150,000, Arizona median household income $79,964, AP low-income ZIP ceiling $35,000." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Those two numbers look like the same line. They aren&rsquo;t. One is a household&rsquo;s actual income, which nobody collects. The other is the median of everyone living in a postal zone, which is the thing we have. A $150,000 cap is a rule about families. Every piece of public evidence about who uses the program is a statement about neighborhoods.
        </P>

        <P>
          So if the measure passes, the state builds the income-verification pipeline from scratch &mdash; intake changes, verification, appeals, an audit trail &mdash; and then waits a couple of years before anyone can say whether the cap did anything. There&rsquo;s no baseline. You can&rsquo;t evaluate a policy against a field that didn&rsquo;t exist before the policy.
        </P>

        <H2>The other number has the same problem</H2>

        <P>
          Prior enrollment does this too, differently. RAND put <a href="https://www.sosaznetwork.org/2026/a-case-study-on-arizonas-universal-esa-voucher-program/">71% of universal ESA students as previously private or homeschooled</a>. Horne says <a href="https://ktar.com/arizona-education/voucher-esa-income-zip-codes/5880836/">60% of new users now come from public schools</a>. Tucson Unified reports <a href="https://www.azfamily.com/2026/06/18/esa-voucher-enrollment-data-finds-higher-participation-high-income-zip-codes/">80% of Tucson recipients were already in private school</a>. All three can be true at once &mdash; different populations, different cutoffs, different quarters. That&rsquo;s a spec problem, not a lying problem.
        </P>

        <Divider />

        <P>
          Arizona built the most-studied voucher program in the country and left out the one column the entire argument turns on. Everything else is a proxy wearing a number&rsquo;s clothes.
        </P>

        <H2>Sources</H2>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On September 28, Georgia announced the highest graduation rate in its history:{' '}
          <a href="https://gadoe.org/press-releases/georgias-graduation-rate-hits-another-historic-high-of-88-5/" target="_blank" rel="noopener">88.5%</a>, up from 87.2%. (The release actually says &ldquo;up from 87.2% in 2026.&rdquo;
          Typos happen at the state level too, which I find comforting.)
        </P>

        <P>
          Ten weeks earlier, on July 21, the same agency announced that{' '}
          <a href="https://gadoe.org/press-releases/chronic-absenteeism-hits-another-post-pandemic-low-in-georgia-as-efforts-to-reduce-absence-rates-continue/" target="_blank" rel="noopener">17.7%</a> of its students were chronically absent last year.
        </P>

        <P>
          The research brief for this post said those two facts shouldn&rsquo;t sit together. More than one kid
          in six misses a tenth of the year and the diploma rate sets a record anyway? Something has to be broken.
        </P>

        <P>
          I almost wrote that. Then I read how each number gets built.
        </P>

        <H2>One is a movie. The other is a photograph.</H2>

        <P>
          The graduation rate is a <a href="https://gadoe.org/press-releases/georgias-graduation-rate-hits-another-historic-high-of-88-5/" target="_blank" rel="noopener">four-year adjusted cohort</a>. Kids who start ninth grade together
          form a cohort, the state adds anyone who transfers in, subtracts anyone who transfers out, and divides
          graduates by whoever is left. The class of 2026 started ninth grade in the fall of 2022. So 88.5% is a
          statement about one group of kids over four years.
        </P>

        <P>
          The absenteeism rate is the share of students <a href="https://gadoe.org/press-releases/chronic-absenteeism-hits-another-post-pandemic-low-in-georgia-as-efforts-to-reduce-absence-rates-continue/" target="_blank" rel="noopener">absent for 10% or more of enrolled days</a>.
          All grades. One year. So 17.7% is a statement about everybody, kindergartners included, over ten months.
        </P>

        <P>
          Different kids, a different clock, and a denominator that has nothing to do with the other one. You
          can&rsquo;t subtract one from the other. You definitely can&rsquo;t call it a paradox.
        </P>

        <H2>The number you&rsquo;d need isn&rsquo;t in either release</H2>

        <P>
          What you&rsquo;d actually want is the chronic absence rate for the class of 2026, across their four years
          of high school. Here&rsquo;s what the releases give you instead.
        </P>

        <Fig caption={<>Sources: GaDOE releases of <a href="https://gadoe.org/press-releases/chronic-absenteeism-hits-another-post-pandemic-low-in-georgia-as-efforts-to-reduce-absence-rates-continue/" target="_blank" rel="noopener">July 21, 2026</a> (17.7%, 19.5%) and <a href="https://gadoe.org/press-releases/chronic-absenteeism-reaches-lowest-levels-since-pre-pandemic-as-state-continues-efforts-to-reduce-absence-rates/" target="_blank" rel="noopener">August 4, 2025</a> (21.3%). Grade labels follow from the cohort definition: a four-year class of 2026 entered ninth grade in 2022&ndash;23. Neither release quotes a 2022&ndash;23 rate.</>}>
          <img src={CHART2} alt="Bar chart of statewide chronic absenteeism in the class of 2026's high school years: 2022-23 not in the releases, 21.3 percent in 2023-24, 19.5 percent in 2024-25, 17.7 percent in 2025-26." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Those are all-grades rates. The July release does break out one band:{' '}
          <a href="https://gadoe.org/press-releases/chronic-absenteeism-hits-another-post-pandemic-low-in-georgia-as-efforts-to-reduce-absence-rates-continue/" target="_blank" rel="noopener">K&ndash;5 is at 13.5%</a>. If the little kids sit below the statewide number, the older grades
          have to sit above it. How far above? The release doesn&rsquo;t say. The only high school figure in it is
          one county (Whitfield, &ldquo;an 11.3% drop in grades 9-12&rdquo;), and it doesn&rsquo;t say whether
          that&rsquo;s percent or points. Hmmmm.
        </P>

        <P>
          And the pre-pandemic baseline isn&rsquo;t in GaDOE&rsquo;s releases at all. It comes from a different agency.
          A researcher from the Governor&rsquo;s Office of Student Achievement{' '}
          <a href="https://www.wuga.org/local-news/2025-09-23/governors-office-research-shows-chronic-student-absenteeism-persists-since-pandemic" target="_blank" rel="noopener">told a Senate committee</a> last year that the rate was 13.1% in 2018, 13.0% in 2019, and 24.4%
          in 2022. GaDOE&rsquo;s own peak for 2021&ndash;22 is <a href="https://gadoe.org/press-releases/chronic-absenteeism-reaches-lowest-levels-since-pre-pandemic-as-state-continues-efforts-to-reduce-absence-rates/" target="_blank" rel="noopener">23.9%</a>. Same state, same year, half a point
          apart. (Nat Malkus at AEI calls the GaDOE figure <a href="https://www.aei.org/education/early-returns-and-good-news-on-attendance-in-georgia/" target="_blank" rel="noopener">&ldquo;de-duplicated&rdquo;</a>, which is
          probably a clue.)
        </P>

        <H2>The join nobody has published</H2>

        <P>
          This isn&rsquo;t a knock on Georgia. Malkus called it <a href="https://www.aei.org/education/early-returns-and-good-news-on-attendance-in-georgia/" target="_blank" rel="noopener">one of the first states</a> to release
          attendance data for the year that just ended, and he&rsquo;s right to be impressed.
        </P>

        <P>
          But look at what the state is holding. It builds the graduation cohort kid by kid, since that&rsquo;s the
          only way to add transfers in and take transfers out. And its attendance numbers{' '}
          <a href="https://georgiainsights.gadoe.org/dashboards/attendance/" target="_blank" rel="noopener">come from the Student Record collection</a>, which is also kid by kid. Two student-level files
          in the same building. The table I want (graduation rate for the seniors who were chronically absent,
          next to the rate for the ones who weren&rsquo;t) is not in either release.
        </P>

        <P>
          AEI ran the district-level version nationally and found the link between a district&rsquo;s absenteeism
          and its graduation rate <a href="https://www.aei.org/research-products/report/graduation-in-the-time-of-covid-the-weakened-relationship-with-chronic-absenteeism/" target="_blank" rel="noopener">weakened by about half</a> during the pandemic. That&rsquo;s district
          averages. Georgia could do it with actual students.
        </P>

        <Divider />

        <P>
          Until somebody does, 88.5 and 17.7 are two good numbers about two different sets of kids, published
          ten weeks apart. That&rsquo;s not a paradox. It&rsquo;s a missing table.
        </P>

        <P><em>&mdash; TJ</em></P>

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://gadoe.org/press-releases/georgias-graduation-rate-hits-another-historic-high-of-88-5/" target="_blank" rel="noopener">Georgia Department of Education, &ldquo;Georgia&rsquo;s graduation rate hits another historic high of 88.5%&rdquo;</a> (September 28, 2026): 2011&ndash;2026 graduation rates, cohort definition</>,
          <><a href="https://gadoe.org/press-releases/chronic-absenteeism-hits-another-post-pandemic-low-in-georgia-as-efforts-to-reduce-absence-rates-continue/" target="_blank" rel="noopener">Georgia Department of Education, &ldquo;Chronic absenteeism hits another post-pandemic low in Georgia&rdquo;</a> (July 21, 2026): 17.7%, 19.5%, 23.9% peak, K&ndash;5 rate, Whitfield County</>,
          <><a href="https://gadoe.org/press-releases/chronic-absenteeism-reaches-lowest-levels-since-pre-pandemic-as-state-continues-efforts-to-reduce-absence-rates/" target="_blank" rel="noopener">Georgia Department of Education, &ldquo;Chronic absenteeism reaches lowest levels since pre-pandemic&rdquo;</a> (August 4, 2025): 21.3% for 2023&ndash;24</>,
          <><a href="https://georgiainsights.gadoe.org/dashboards/attendance/" target="_blank" rel="noopener">Georgia Insights attendance dashboard, GaDOE</a>: definition, Student Record data source</>,
          <><a href="https://www.wuga.org/local-news/2025-09-23/governors-office-research-shows-chronic-student-absenteeism-persists-since-pandemic" target="_blank" rel="noopener">WUGA, &ldquo;Governor&rsquo;s office research shows chronic student absenteeism persists since pandemic&rdquo;</a> (September 23, 2025): GOSA figures for 2018, 2019, 2022</>,
          <><a href="https://www.aei.org/education/early-returns-and-good-news-on-attendance-in-georgia/" target="_blank" rel="noopener">Nat Malkus, &ldquo;Early Returns, and Good News, on Attendance in Georgia,&rdquo; AEI</a> (July 30, 2026)</>,
          <><a href="https://www.aei.org/research-products/report/graduation-in-the-time-of-covid-the-weakened-relationship-with-chronic-absenteeism/" target="_blank" rel="noopener">Nat Malkus and Sam Hollon, &ldquo;Graduation in the Time of COVID: The Weakened Relationship with Chronic Absenteeism,&rdquo; AEI</a> (May 14, 2025)</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Washington has{' '}
          <a href="https://pos.toasttab.com/blog/on-the-line/how-many-restaurants-are-in-the-us">16,732 restaurants</a>.
          That number puts the state{' '}
          <a href="https://pos.toasttab.com/blog/on-the-line/how-many-restaurants-are-in-the-us">13th in the country by raw count</a>,
          tucked between Virginia (16,930) and Massachusetts (15,709). Sounds like a lot. Locally,
          it feels like a lot. The Seattle food press writes about it like a lot.
        </P>

        <P>
          I run a data company. The raw count is the number you read. The per-capita rank is the
          number that means something. Run that math and the answer is annoyingly clean.
        </P>

        <H2>Washington is the median state</H2>

        <P>
          Toast&rsquo;s blog post publishes the National Restaurant Association&rsquo;s state-level
          counts alongside a {' '}
          <a href="https://pos.toasttab.com/blog/on-the-line/how-many-restaurants-are-in-the-us">residents-per-restaurant column</a>.
          Washington&rsquo;s figure is 476 &mdash; one restaurant for every 476 people. Convert to
          restaurants per 10,000 residents and you get 21.0.
        </P>

        <P>
          Now rank the 50 states by that metric. The leaders are tourism-heavy and
          population-light:{' '}
          <a href="https://pos.toasttab.com/blog/on-the-line/how-many-restaurants-are-in-the-us">Hawaii at 30.5</a>,
          Montana at 30.2, Oregon at 28.2, Rhode Island at 28.1, then New York at 24.9. The
          laggards are population-heavy and growing fast: Arizona at 16.3, Oklahoma at 17.2, New
          Mexico at 17.3, Texas at 18.1. Washington at 21.0 lands at{' '}
          <strong>25th out of 50</strong> &mdash; the literal median.
        </P>

        <Callout label="The data-pipeline read">
          Washington is 13th by absolute count and 25th per capita. The gap between those two
          ranks is the entire answer to &ldquo;does Washington have a lot of restaurants?&rdquo;
          We have a lot because we have a lot of people. We don&rsquo;t have a lot per person.
        </Callout>

        <H2>Oregon is the comp nobody wants</H2>

        <P>
          The cleanest comparison is the state directly south. Oregon has{' '}
          <a href="https://pos.toasttab.com/blog/on-the-line/how-many-restaurants-are-in-the-us">11,928 restaurants</a>{' '}
          for a population of about 4.23 million &mdash; 28.2 per 10,000 residents, fourth in the
          country. Washington has 16,732 restaurants for about 7.96 million people &mdash; 21.0
          per 10,000. So Oregon has 71% as many restaurants as Washington but serves them to 53%
          as many people. Same coast, same climate, same coffee. Different per-capita density,
          and not by a little.
        </P>

        <P>
          Put more bluntly: a Washingtonian who moves to Portland walks into a city with 34%
          more restaurants per person.
        </P>

        <H2>The number being counted isn&rsquo;t one number</H2>

        <P>
          The Toast article has two tables. One lists restaurants{' '}
          <a href="https://pos.toasttab.com/blog/on-the-line/how-many-restaurants-are-in-the-us">by type</a>{' '}
          (fast-food chains 207,800; single-location full-service 150,100; chain full-service
          137,500; coffee &amp; snack 83,000; bars 67,800; etc.). Add those rows up and you
          get about 1.03 million. The other table lists restaurants by state and adds to about
          708,000.
        </P>

        <P>
          Two of the article&rsquo;s own tables don&rsquo;t agree on the national total. The
          reason isn&rsquo;t a typo. The type rows overlap &mdash; a single storefront can be a
          pizza restaurant <em>and</em> an Italian restaurant <em>and</em> a chain location, and
          IBISWorld&rsquo;s typology counts it under each. The state rows are NRA&rsquo;s
          NAICS-based head count, which dedupes. So &ldquo;how many restaurants are in the U.S.&rdquo;
          is roughly 700,000 if you&rsquo;re counting storefronts and roughly a million if
          you&rsquo;re counting storefront-categories.
        </P>

        <P>
          For Washington that ambiguity bites both ways. The 16,732 is a head count. The
          neighborhoods you walk to count by type &mdash; the new ramen place is also the new
          sake bar is also the new noodle counter. The state ranking would not change much
          either way; the local feel might.
        </P>

        <Divider />

        <H2>So, do we have a lot of restaurants?</H2>

        <P>
          Sort of. In absolute terms, yes &mdash; 13th nationally. Per capita, no. Twenty-fifth of
          fifty, exactly average, surrounded on the leaderboard by North Carolina, Illinois, Ohio,
          and Florida. The states that punch above their weight (Hawaii, Montana, Oregon, Rhode
          Island) all share one thing Washington doesn&rsquo;t: a tourism economy substantially
          larger than the resident base it&rsquo;s feeding.
        </P>

        <P>
          Seattle&rsquo;s food reputation is doing some heavy lifting here. The state&rsquo;s
          per-capita count quietly disagrees.
        </P>

        <Divider />

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://pos.toasttab.com/blog/on-the-line/how-many-restaurants-are-in-the-us">Toast / Caroline Price &mdash; How Many Restaurants Are in the United States?</a> (May 14, 2026): state-by-state restaurant counts (sourced to the National Restaurant Association), residents-per-restaurant figures, IBISWorld type breakdown.</>,
          <><a href="https://restaurant.org/research-and-media/research/industry-statistics/state-statistics/">National Restaurant Association &mdash; State statistics</a> (underlying data behind Toast&rsquo;s state table).</>,
          <>Per-capita rank computed by sorting Toast&rsquo;s residents-per-restaurant column ascending; restaurants per 10,000 residents = 10,000 &divide; that column. Washington&rsquo;s implied population from Toast&rsquo;s math (16,732 &times; 476 = 7,964,432) matches the U.S. Census 2023 estimate within rounding.</>,
        ]} />

        <P>
          <em>&mdash; TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

      <Container>
        <div style={{ padding:'64px 0 40px', maxWidth:560 }}>
          <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, color:'var(--muted)' }}>§ Subscribe</span>
          <h3 style={{ fontFamily:'var(--display)', fontWeight:900, letterSpacing:'-0.01em', fontSize:'clamp(32px, 4vw, 56px)', lineHeight:0.95, margin:'8px 0 16px' }}>
            The dispatch,<br/>every Saturday morning.
          </h3>
          <p style={{ fontSize:17, lineHeight:1.55, maxWidth:'42ch', margin:'0 0 24px', textWrap:'pretty' }}>
            One email a week. A short essay, a chart, and links to anything we read
            that changed the way we read public data. No tracking pixels.
          </p>
          <form onSubmit={(e)=>{ e.preventDefault(); setSent(true); }}
            style={{ display:'flex', gap:0, maxWidth:460, border:'1.5px solid var(--ink)' }}>
            <input value={email} onChange={e=>setEmail(e.target.value)}
              type="email" placeholder="you@yourdomain.org" required
              style={{ flex:1, border:0, background:'transparent', padding:'14px 16px', fontFamily:'var(--body)', fontSize:16, color:'var(--ink)', outline:'none' }}/>
            <button type="submit"
              style={{ border:0, borderLeft:'1.5px solid var(--ink)', padding:'0 20px', background:'var(--ink)', color:'var(--paper)', fontFamily:'var(--mono)', fontSize:12, letterSpacing:'0.12em', textTransform:'uppercase', cursor:'pointer', fontWeight:600 }}>
              {sent ? 'Sent ✓' : 'Subscribe →'}
            </button>
          </form>
          {sent && <p style={{ marginTop:10, fontFamily:'var(--mono)', fontSize:12, color:'var(--muted)' }}>Check your inbox — the confirmation note is on its way.</p>}
        </div>

        <Rule />

        <div style={{ padding:'24px 0 40px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }}>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Colophon</div>
            <div>Hosted on GitHub Pages. No trackers, no cookies, no stock photography. Built by hand at Standard Co.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>
            <div>All text, charts, and datasets are published under CC BY 4.0. Copy us, cite us, improve us. Corrections, at the bottom of every piece.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Contact</div>
            <div>info@standardco.de<br/>Standard Co, est. 2013<br/>A reader-supported project.</div>
          </div>
        </div>

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
          <span>© 2013–2026 Standard Co · All rights unreserved</span>
          <span>Made with help from Claude</span>
        </div>
      </Container>
      <style>{`
        @media (max-width: 820px){
          .cdfa-colophon{ grid-template-columns: 1fr !important; }
        }
      `}</style>
    </footer>
  );
};

// ==================== App ====================
function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

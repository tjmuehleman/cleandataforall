const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Somewhere in a county office, a SNAP case closes. Nobody tells the cafeteria. Nobody has to, because the cafeteria is already reading that caseload through a pipe it doesn&rsquo;t control.
        </P>

        <P>
          Here&rsquo;s the size of it. USDA&rsquo;s monthly report has 42,248 thousand people on SNAP in May 2025 and 36,562 thousand in May 2026 (<a href="https://fns-prod.azureedge.us/sites/default/files/data-files/birdseye-May-2026.pdf">FNS</a>). That&rsquo;s 5.7 million fewer people, a 13.5% drop (my arithmetic: 5,686 &divide; 42,248).
        </P>

        <H2>The pipe</H2>

        <P>
          Kids in SNAP households are <em>directly certified</em> for free school meals, no application, just records matched between agencies (<a href="https://www.urban.org/research/publication/changes-snap-could-reduce-student-access-free-school-meals">Urban Institute</a>). The share of a school&rsquo;s students certified that way is its identified student percentage, or ISP. A school needs an ISP of at least 25% to elect the Community Eligibility Provision, and the ISP times 1.6 sets the share of meals reimbursed at the free rate, capped at 100% (<a href="https://www.fna.usda.gov/cn/cep/slider-tool">USDA</a>). Do the division and the cap hits at 62.5%.
        </P>

        <P>
          Below that line, the school eats the difference. Urban counted 7.2 million students in schools sitting between 25% and 62.5% in states without statewide universal meals (<a href="https://www.urban.org/research/publication/changes-snap-could-reduce-student-access-free-school-meals">Urban Institute</a>). That&rsquo;s the band where a SNAP caseload change turns into a budget problem.
        </P>

        <Fig caption={<>Share of students at the maximum federal reimbursement, Marion County Public Schools, as described by its school nutrition director. Source: <a href="https://stateline.org/2026/09/01/snap-cuts-could-lead-to-kids-losing-free-school-breakfast-and-lunch/">Stateline</a>. Both figures are &ldquo;about,&rdquo; as quoted.</>}>
          <img src={'https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22On+the+four-year+certification%22%2C%22On+current+SNAP+enrollment%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B93%2C75%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%5D%2C%22barPercentage%22%3A0.8%2C%22categoryPercentage%22%3A0.6%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontFamily%22%3A%22Georgia%22%2C%22fontSize%22%3A14%2C%22min%22%3A0%2C%22max%22%3A100%2C%22stepSize%22%3A20%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+students+at+max+federal+reimbursement+%28about%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontFamily%22%3A%22Georgia%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2'} alt="Bar chart: Marion County Public Schools gets maximum federal reimbursement for about 93% of students on its four-year certification, falling to about 75% under current SNAP enrollment." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          One district told Stateline it gets the maximum reimbursement for about 93% of its students under its four-year certification. On today&rsquo;s SNAP enrollment, about 75%. Same kids. Same cafeterias. Different spreadsheet. (And notice the phrase <em>four-year</em>: the formula is reading an old snapshot while the real number moves underneath it.)
        </P>

        <H2>Even the 5.7 million moves</H2>

        <P>
          The May report put May 2026 at 36,562 thousand. The June report lists the same month at 36,685 thousand (<a href="https://fns-prod.azureedge.us/sites/default/files/data-files/birdseye-June-2026.pdf">FNS</a>). That&rsquo;s 123 thousand people who showed up after the fact. FRAC reports USDA also made &ldquo;substantial adjustments to previous months of data&rdquo; in September (<a href="https://frac.org/snap-participation-data-january-2025-present">FRAC</a>). I can&rsquo;t tell you whether May 2025 moved too. So the 13.5% is as-first-published, and that&rsquo;s the honest label.
        </P>

        <H2>The count nobody has</H2>

        <P>
          The number that actually matters is how many kids lost direct certification. I couldn&rsquo;t find it. Rep. Raja Krishnamoorthi had to write USDA a letter asking for exactly that (<a href="https://www.k12dive.com/news/usda-urged-to-report-how-snap-cuts-impact-free-school-meals/829198/">K-12 Dive</a>). And it&rsquo;s not a clean subtraction: Urban notes roughly 75% of kids on SNAP are also on Medicaid, which can certify them too.
        </P>

        <P>
          The SNAP number is public, monthly, and revised. The school number is a question in a congressman&rsquo;s letter.
        </P>

        <Divider />

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://fns-prod.azureedge.us/sites/default/files/data-files/birdseye-May-2026.pdf">USDA FNS, Program Information Report (Keydata), May 2026</a></>,

          <><a href="https://frac.org/snap-participation-data-january-2025-present">FRAC, SNAP participation data, January 2025 to present</a></>,
          <><a href="https://www.fna.usda.gov/cn/cep/slider-tool">USDA, CEP Estimator (ISP, 25% minimum, 1.6 multiplier)</a></>,
          <><a href="https://www.urban.org/research/publication/changes-snap-could-reduce-student-access-free-school-meals">Urban Institute, Changes to SNAP could reduce student access to free school meals</a></>,
          <><a href="https://stateline.org/2026/09/01/snap-cuts-could-lead-to-kids-losing-free-school-breakfast-and-lunch/">Stateline, SNAP cuts could lead to kids losing free school breakfast and lunch</a></>,
          <><a href="https://www.k12dive.com/news/usda-urged-to-report-how-snap-cuts-impact-free-school-meals/829198/">K-12 Dive, USDA urged to report how SNAP cuts impact free school meals</a></>,
        ]} />

      </article>
    </Prose>
  </Container>
);

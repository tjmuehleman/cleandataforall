<style>

    --ink:#141210;
    --paper:#F4EFE6;
    --rule: rgba(20,18,16,.18);
    --rule-soft: rgba(20,18,16,.10);
    --muted: rgba(20,18,16,.62);
    --display: 'Roboto Slab', serif;

  html[data-theme="poster"]{ --ink:#EDE6D8; --paper:#171413; --rule:rgba(237,230,216,.22); --rule-soft:rgba(237,230,216,.10); --muted:rgba(237,230,216,.6); }
  html[data-theme="zine"]{ --ink:#0A0908; --paper:#EFEBDF; --rule:rgba(10,9,8,.35); --rule-soft:rgba(10,9,8,.18); --muted:rgba(10,9,8,.68); }

  html[data-pair="slab-serif"]{ --display:'Roboto Slab', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }
  html[data-pair="grotesk-serif"]{ --display:'Archivo', sans-serif; --body:'Fraunces', Georgia, serif; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="slab-mono"]{ --display:'Roboto Slab', serif; --body:'IBM Plex Mono', monospace; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="display-serif"]{ --display:'Instrument Serif', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }
  body{ font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","ss02","onum"; }
  a{ color: inherit; }
  ::selection{ background: var(--ink); color: var(--paper); }

  body::before{
    content:""; position: fixed; inset:0; pointer-events:none; z-index: 1;
    background-image:
      radial-gradient(rgba(20,18,16,.045) 1px, transparent 1px),

<script type="text/babel" data-presets="react">

// ==================== TEMPLATE DATA — update for each post ====================
const POST = {
  kind:    'Data Study',
  number:  '081',
  date:    'July 9, 2026',
  readTime: '3 min',
  title:   'Air pollution didn’t start attacking the brain in 2023. The data did.',
  dek:     'Air pollution killed 7.9 million people in 2023 — and for the first time the toll includes 600,000 dementia deaths. That number didn’t appear because the air changed. It appeared because someone added a row.',
  byline:  'T.J. Müehleman',
};
// =============================================================================

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>← All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      {/* Wordmark */}
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      {/* Meta row */}
      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>№ {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      {/* Title + dek */}
      <div style={{ maxWidth:900, paddingTop:32 }}>
        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>
          {POST.dek}
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>
        </div>
      </div>
    </div>
  </Container>
);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, textAlign:'center' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Noncommunicable+diseases%22%2C%22Communicable+%26+other%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Deaths%2C+2023+%28millions%29%22%2C%22data%22%3A%5B6.8%2C1.1%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22What+air+pollution+killed+in+2023%3A+86%25+was+chronic+disease%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A8%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Deaths+%28millions%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of 2023 air-pollution deaths by disease type. Noncommunicable diseases 6.8 million; communicable and other 1.1 million." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
        Source: Health Effects Institute, State of Global Air 2025. Of 7.9M air-pollution deaths in 2023, 6.8M (86%) were noncommunicable; the 1.1M remainder is 7.9M &minus; 6.8M.
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In 2023, air pollution killed <a href="https://www.stateofglobalair.org/news-events/2025/new-state-global-air-2025-report-shows-nearly-nine-ten-global-air-pollution-deaths" target="_blank" rel="noopener">7.9 million people</a>. Ask most people how, and they mime a cough.
        </P>

        <P>
          They&rsquo;d be describing about a tenth of it. <a href="https://www.healthdata.org/news-events/newsroom/news-releases/new-report-shows-nearly-9-10-global-air-pollution-deaths-are" target="_blank" rel="noopener">Eighty-six percent</a> of those deaths &mdash; 6.8 million &mdash; were noncommunicable diseases: heart disease, stroke, diabetes, lung cancer, and, for the first time in this report&rsquo;s history, dementia. Not the acute respiratory collapse the word &ldquo;smog&rdquo; conjures. The lungs are the doorway. The damage is systemic.
        </P>

        <P>
          That&rsquo;s the Health Effects Institute&rsquo;s State of Global Air 2025, out this year with the Institute for Health Metrics and Evaluation. And the number I keep circling isn&rsquo;t 7.9 million. It&rsquo;s 600,000.
        </P>

        <H2>The row that wasn&rsquo;t there last year</H2>

        <P>
          <a href="https://www.healtheffects.org/announcements/new-state-global-air-2025-report-shows-nearly-nine-ten-global-air-pollution-deaths-are" target="_blank" rel="noopener">600,000</a> is the count of dementia deaths attributable to air pollution in 2023 &mdash; plus almost 12 million years of healthy life lost. It&rsquo;s the first time the report has put a number on it. Which is the part worth pausing on. Those 600,000 people didn&rsquo;t start dying because the air changed in 2023. They showed up because the accounting did. Someone decided the evidence tying fine particulate to neurodegeneration was strong enough to earn a line in the ledger, and a line appeared.
        </P>

        <P>
          This is how burden-of-disease data works, and it&rsquo;s easy to forget. A cause of death isn&rsquo;t counted until a model says to count it. Before this year, air-pollution dementia deaths were real and uncounted &mdash; the worst kind of number, because zero and &ldquo;we never measured it&rdquo; look identical on a chart.
        </P>

        <H2>Heart, then brain, then the doorway</H2>

        <P>
          Once you stop hunting for the cough, the picture reorganizes. Air pollution is behind <a href="https://www.healthdata.org/news-events/newsroom/news-releases/new-report-shows-nearly-9-10-global-air-pollution-deaths-are" target="_blank" rel="noopener">1 in 4</a> ischemic heart disease deaths worldwide &mdash; as high as 35% across much of Africa and South Asia, about 7% in wealthy countries &mdash; and roughly half of all chronic respiratory disease deaths. Among adults over 60, <a href="https://www.healtheffects.org/announcements/new-state-global-air-2025-report-shows-nearly-nine-ten-global-air-pollution-deaths-are" target="_blank" rel="noopener">95%</a> of pollution-attributable deaths are noncommunicable. The organ the public files this under is the least surprising thing on the list.
        </P>

        <Fig caption={<>Source: Health Effects Institute, State of Global Air 2025 (with IHME). Attributable deaths by pollutant, 2023. The three estimates overlap on PM2.5 and are not additive &mdash; their sum exceeds the 7.9M total.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Ambient+PM2.5%22%2C%22Household+air+pollution%22%2C%22Ozone%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Attributable+deaths%2C+2023+%28millions%29%22%2C%22data%22%3A%5B4.9%2C2.8%2C0.47%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Where+the+exposure+comes+from+%28estimates+overlap%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A6%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Attributable+deaths+%28millions%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of attributable deaths by pollutant in 2023. Ambient PM2.5 4.9 million, household air pollution 2.8 million, ozone 0.47 million." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          The exposure side has its own counting problem. The report splits the toll by source: <a href="https://www.healthdata.org/news-events/newsroom/news-releases/new-report-shows-nearly-9-10-global-air-pollution-deaths-are" target="_blank" rel="noopener">4.9 million</a> deaths tied to ambient PM2.5, 2.8 million to household air pollution, 470,000 to ozone. Add those up and you sail past 7.9 million, because the categories overlap &mdash; cooking-fire smoke is &ldquo;household&rdquo; indoors and &ldquo;ambient&rdquo; once it drifts out the door. Three estimates, one shared pollutant, no honest way to stack them into a single bar. And <a href="https://www.stateofglobalair.org/hap/impacts-on-children" target="_blank" rel="noopener">three-quarters</a> of the children under five who die from air pollution die from that cooking smoke &mdash; the most domestic, least visible source there is.
        </P>

        <Divider />

        <P>
          None of this needed the air to get worse. In plenty of places it got better. What changed is what we were willing to attribute &mdash; heart, then brain, then a slow admission that &ldquo;the lungs&rdquo; was always a stand-in for a whole-body problem we hadn&rsquo;t finished measuring. The 7.9 million is the headline. The 600,000 is the tell. A cause of death is a decision to look. This year we looked at the brain.
        </P>

      </article>
    </Prose>
  </Container>
);

        </div>
      </div>

      <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
        <span>© 2013–2026 <a href="https://www.standardco.de" target="_blank" rel="noopener" style={{ color:'inherit', borderBottom:'1px solid currentColor', textDecoration:'none' }}>Standard Co</a> · All rights unreserved</span>
      </div>

    <style>{`
      @media (max-width: 820px){
        .cdfa-colophon{ grid-template-columns: 1fr !important; }
      }
    `}</style>
  </footer>
);

// ==================== App ====================
function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Every state except Hawaii now has some kind of dyslexia law on the books, and 23 states plus D.C. have enacted 118 separate laws since 2019 that specifically invoke &ldquo;the science of reading&rdquo; (<a href="https://www.shankerinstitute.org/blog/science-reading-laws-lets-begin-facts" target="_blank" rel="noopener">Shanker Institute</a>). Legislatures that can&rsquo;t agree on cell phones in class, vouchers, or what to call the thing you sound out at the whiteboard all agreed on this one. It&rsquo;s about as close to consensus as American education policy gets.
        </P>

        <P>
          Then a team out of the University at Albany actually checked the scoreboard. They pulled NAEP fourth-grade reading data from 2003 to 2022, tracked 47 states before and after their dyslexia laws passed, and measured two things: whether more kids got flagged with a reading disability, and whether those kids&rsquo; scores moved. More than half the states saw no meaningful shift in identification. On scores, only four states &mdash; Arizona, Mississippi, Nevada, and Oklahoma &mdash; posted a statistically significant gain, from 3 points in Oklahoma to 10 in Arizona. Reading scores for kids with learning disabilities actually got worse in Alaska, Maine, Massachusetts, New York, Ohio, and West Virginia after their laws passed (<a href="https://www.mississippifreepress.org/opinion-dyslexia-laws-show-limited-change-for-struggling-readers/" target="_blank" rel="noopener">Mississippi Free Press, reprinting the underlying study</a>). Four out of forty-seven. That&rsquo;s the researchers&rsquo; scoreboard, not mine.
        </P>

        <H2>Georgia is a live look at why</H2>

        <P>
          Third-grade ELA proficiency on the Milestones test was 42% before COVID. It fell to 36.2% during the pandemic. It climbed back to 38.7% by 2023-24. And then it cratered to 35.1% this year &mdash; the worst mark in seven years, a steeper single-year drop (3.6 points) than the entire two-year pandemic decline (5.8 points) (<a href="https://georgiareads.org/wp-content/uploads/State-of-Literacy-April2026.pdf" target="_blank" rel="noopener">State of Literacy in Georgia</a>). Georgia passed its own Early Literacy Act in 2023. (Recently, as literacy laws go.)
        </P>

        <P>
          Here&rsquo;s the part that should bother anyone who works with data for a living: 35.1% isn&rsquo;t one number, it&rsquo;s an average pretending to be one. Split it by student subgroup and proficiency runs from 14% for English learners to 62% for Asian students, a 48-point spread hiding inside a single statewide figure (same source). Split it by district instead, using the state&rsquo;s own numbers, and third-grade proficiency runs from 0% to 68.6% (<a href="https://gpee.org/georgia-milestones-data-underscore-math-progress-literacy-challenges/" target="_blank" rel="noopener">Georgia Partnership for Excellence in Education</a>). You can&rsquo;t manage, or even honestly report on, a system where the average is doing that much lying.
        </P>

        <Fig caption={<>Georgia 3rd grade ELA proficiency by subgroup, 2024-25. Source: <a href="https://georgiareads.org/wp-content/uploads/State-of-Literacy-April2026.pdf" target="_blank" rel="noopener" style={{ color:'inherit', borderBottom:'1px solid currentColor' }}>State of Literacy in Georgia</a>; district spread of 0&ndash;68.6% via <a href="https://gpee.org/georgia-milestones-data-underscore-math-progress-literacy-challenges/" target="_blank" rel="noopener" style={{ color:'inherit', borderBottom:'1px solid currentColor' }}>Georgia Partnership for Excellence in Education</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22English+learners%22%2C%22Black+students%22%2C%22Hispanic+students%22%2C%22Econ.+disadvantaged%22%2C%22Statewide+average%22%2C%22White+students%22%2C%22Not+econ.+disadvantaged%22%2C%22Asian+students%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%223rd+grade+ELA+proficient+%26+above%2C+2024-25%22%2C%22data%22%3A%5B14%2C23.6%2C25.4%2C26.9%2C35.1%2C47.6%2C59.3%2C61.5%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23999%22%2C%22%23888%22%2C%22%23777%22%2C%22%23141210%22%2C%22%235a5a5a%22%2C%22%233a3a3a%22%2C%22%23222%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Georgia%27s+35.1%25+reading+average+hides+a+48-point+spread%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A70%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+proficient+or+above%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart showing Georgia 3rd grade ELA proficiency by subgroup: 14% for English learners, 23.6% Black, 25.4% Hispanic, 26.9% economically disadvantaged, 35.1% statewide average, 47.6% White, 59.3% not economically disadvantaged, 61.5% Asian"
            style={{ maxWidth:900, width:'100%', display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>The counter-case</H2>

        <P>
          Mississippi is the other half of the story, and it&rsquo;s real, not survivorship bias: its NAEP fourth-grade reading proficiency rate climbed from 21% to 32% in the decade after its 2013 Literacy-Based Promotion Act, which paired the mandate with reading coaches, structured instruction, and teacher training in every building (State of Literacy in Georgia, citing NAEP). California just bet $200 million of its own money on the same theory, earmarked specifically for retraining elementary teachers in the &ldquo;science of reading&rdquo; under AB 1454, signed by Governor Newsom in October. The bill&rsquo;s backers point to Los Angeles Unified, whose ELA scores jumped 5.5 percentage points since it adopted a phonics-based curriculum in 2022 (<a href="https://www.kpbs.org/news/education/2025/10/20/expect-more-phonics-lessons-in-california-schools-under-law-newsom-signed" target="_blank" rel="noopener">CalMatters, via KPBS</a>).
        </P>

        <Divider />

        <P>
          So: near-total legislative consensus, a peer-reviewed scoreboard showing 4 winners out of 47, and a state average that hides two entirely different school systems inside one press release. If I&rsquo;m building anything for a school district, that&rsquo;s the lesson. The statute is not the intervention. The topline number is not the truth. You can mandate a curriculum. You can&rsquo;t mandate the coaching behind it, and you definitely can&rsquo;t fix a number you&rsquo;re still measuring wrong.
        </P>

      </article>
    </Prose>
  </Container>
);

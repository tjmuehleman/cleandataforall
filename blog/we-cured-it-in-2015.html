// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, textAlign:'center' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22HIV++%5Cu2014++77%25%22%2C%22Hepatitis+C++%5Cu2014++20%25%22%2C%22Hepatitis+B++%5Cu2014++%3C5%25%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B77%2C20%2C5%5D%2C%22backgroundColor%22%3A%5B%22%23999999%22%2C%22%23141210%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22text%22%3A%5B%22Share+of+people+who+need+treatment+who+actually+get+it%22%2C%22HIV+vs.+viral+hepatitis%2C+latest+data%22%5D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22min%22%3A0%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+receiving+treatment%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart comparing treatment coverage: 77 percent for HIV, 20 percent for hepatitis C, under 5 percent for hepatitis B" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In 2015, a pill showed up that cures hepatitis C. Eight to twelve weeks, one course, a cure rate above <a href="https://www.who.int/teams/global-hiv-hepatitis-and-stis-programmes/hepatitis/reports/global-hepatitis-report-2026">95%</a>. Not &ldquo;manages.&rdquo; Not &ldquo;slows.&rdquo; Cures. One of the cleanest wins modern medicine has shipped.
        </P>

        <P>
          In 2024, viral hepatitis killed <a href="https://www.who.int/news/item/28-04-2026-efforts-to-eliminate-hepatitis-delivers-gains-but-more-action-needed-to-meet-2030-targets">1.34 million people</a> &mdash; more than <a href="https://www.unaids.org/en/resources/fact-sheet">HIV</a> (630,000) and <a href="https://www.who.int/teams/global-malaria-programme/reports/world-malaria-report-2024">malaria</a> (597,000) put together. We built the cure eleven years ago, and the body count went up.
        </P>

        <H2>This isn&rsquo;t a science story</H2>

        <P>
          I run a data company that works in global health, so when I read the WHO&rsquo;s <a href="https://www.who.int/teams/global-hiv-hepatitis-and-stis-programmes/hepatitis/reports/global-hepatitis-report-2026">Global Hepatitis Report 2026</a>, published in April, I didn&rsquo;t see a medical failure. I saw a delivery failure with a paper trail.
        </P>

        <P>
          The science is finished. The hepatitis B vaccine protects more than 95% of the people who get it. The hepatitis C course cures more than 95% of the people who take it. Both numbers sit right there in the report.
        </P>

        <P>
          Here&rsquo;s the figure that actually tells the story: of everyone eligible for hepatitis C treatment since 2015, just <a href="https://www.who.int/teams/global-hiv-hepatitis-and-stis-programmes/hepatitis/reports/global-hepatitis-report-2026">20%</a> have gotten it. Hepatitis B is worse &mdash; fewer than 5% of the 240 million people living with it are on treatment, even though about half are eligible under WHO&rsquo;s own 2024 guidelines.
        </P>

        <H2>The scissors</H2>

        <P>
          Now watch what moves and what doesn&rsquo;t. New hepatitis B infections are down <a href="https://www.who.int/teams/global-hiv-hepatitis-and-stis-programmes/hepatitis/reports/global-hepatitis-report-2026">32% since 2015</a>. Prevention works &mdash; vaccines, birth-dose campaigns, the upstream stuff. And in the same window, hepatitis B deaths went <em>up</em> 17%.
        </P>

        <Fig caption={<>Hepatitis B, indexed to 2015 = 100. New infections fell 32% (to 68); deaths rose 17% (to 117) over 2015&ndash;2024. Source: <a href="https://www.who.int/teams/global-hiv-hepatitis-and-stis-programmes/hepatitis/reports/global-hepatitis-report-2026">WHO &mdash; Global Hepatitis Report 2026</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22line%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222015%22%2C%222024%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22New+hepatitis+B+infections%22%2C%22data%22%3A%5B100%2C68%5D%2C%22borderColor%22%3A%22%23888888%22%2C%22backgroundColor%22%3A%22%23888888%22%2C%22fill%22%3Afalse%2C%22lineTension%22%3A0%2C%22pointRadius%22%3A4%7D%2C%7B%22label%22%3A%22Hepatitis+B+deaths%22%2C%22data%22%3A%5B100%2C117%5D%2C%22borderColor%22%3A%22%23141210%22%2C%22backgroundColor%22%3A%22%23141210%22%2C%22fill%22%3Afalse%2C%22lineTension%22%3A0%2C%22pointRadius%22%3A4%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22text%22%3A%5B%22Prevention+is+working.+The+death+curve+isn%27t.%22%2C%22Hepatitis+B%2C+indexed+to+2015+%3D+100%22%5D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22min%22%3A60%2C%22max%22%3A130%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Index+%282015+%3D+100%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Line chart of hepatitis B indexed to 2015 equals 100: new infections fall to 68 by 2024 while deaths rise to 117" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          That&rsquo;s the scissors. The infection line falls, the death line climbs, and somewhere in there they cross. It happens because deaths come from people who are already infected &mdash; the prevalent pool, the ones already counted in the data &mdash; and that pool isn&rsquo;t getting the drugs that would keep them alive.
        </P>

        <H2>HIV figured out the last mile. Hepatitis didn&rsquo;t.</H2>

        <P>
          Here&rsquo;s the comparison that sticks with me. HIV is also chronic, also incurable, also treatable. <a href="https://www.unaids.org/en/resources/fact-sheet">77%</a> of people living with HIV worldwide are on treatment. For hepatitis C it&rsquo;s 20%. For hepatitis B it&rsquo;s under 5%. Same kind of disease, same kind of problem, wildly different number.
        </P>

        <P>
          The gap isn&rsquo;t the drugs. It&rsquo;s the machine HIV built around the drugs: the testing cascades, the coverage dashboards, the funded last mile, the advocacy loud enough that every untreated case became a number somebody had to answer for. Hepatitis got the cure and skipped the machine.
        </P>

        <Callout label="The number that says it all">
          11 million people have been diagnosed with hepatitis C and are not on treatment (<a href="https://www.who.int/teams/global-hiv-hepatitis-and-stis-programmes/hepatitis/reports/global-hepatitis-report-2026">WHO, 2026</a>). Not undiscovered. Not unfindable. Diagnosed. Sitting in a column somewhere, counted, with a cure on the shelf and nobody moving it to them.
        </Callout>

        <Divider />

        <P>
          We don&rsquo;t have a hepatitis problem anymore. We have a hepatitis delivery problem &mdash; and delivery problems are data problems. Who&rsquo;s diagnosed, who&rsquo;s eligible, who got the drug, who didn&rsquo;t, and who is going to go find the 11 million names in the gap.
        </P>

        <P>
          The cure was the hard part. We finished it eleven years ago.
        </P>

        <P><em>&mdash; TJ</em></P>

      </article>
    </Prose>
  </Container>
);

      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          For about a decade, the most reliable fact about American crime data was that nobody believed it. The FBI would log a decline. Gallup would ask people, and a clear majority would say crime was getting worse. In 2024, <a href="https://news.gallup.com/poll/652763/smaller-majorities-say-crime-serious-increasing.aspx">64% of Americans told Gallup there was more crime in the U.S. than a year earlier</a>. The rate had been falling for most of that stretch. The belief went the other way. People gave it a name &mdash; the perception gap &mdash; and treated it as the whole story.
        </P>

        <P>
          It just closed. In <a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">Gallup&rsquo;s October 2025 poll, only 49% said crime was rising &mdash; down 15 points in a year, the lowest reading since at least 2018</a>. And the timing looks immaculate: in May 2026 the FBI&rsquo;s preliminary 2025 numbers showed <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">violent crime down 9.3% and murder down 18.1%, which the Bureau called the single largest decrease in violent crime and murder since 1937</a>. Reality fell. Perception finally followed. Clean story.
        </P>

        <P>
          Except it isn&rsquo;t, and this is where I get off. I run a data company, so I do the annoying thing and break the number down.
        </P>

        <Fig caption={<>FBI preliminary estimates for 2025, based on data from more than 17,000 agencies covering about 96% of the population. The Bureau called the murder decline the largest one-year drop since 1937. Source: <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">FBI, First Look: 2025 Crime Data</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Robbery%22%2C%22Murder%22%2C%22Property+crime%22%2C%22Violent+crime%22%2C%22Rape%22%2C%22Agg.+assault%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B18.5%2C18.1%2C12.4%2C9.3%2C7.6%2C7.2%5D%2C%22backgroundColor%22%3A%22%23141210%22%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22text%22%3A%5B%22The+2025+crime+drop%2C+by+category%22%2C%22Estimated+%25+decline%2C+2024+to+2025+%28FBI+preliminary%29%22%5D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22min%22%3A0%2C%22max%22%3A20%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+decline%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of estimated 2025 crime declines: robbery down 18.5 percent, murder down 18.1 percent, property crime down 12.4 percent, violent crime down 9.3 percent, rape down 7.6 percent, aggravated assault down 7.2 percent" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <H2>The number that actually moved</H2>

        <P>
          Split that 64-to-49 by party and the tidy story falls apart. The overall 15-point drop is almost entirely one group changing its mind. <a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">Gallup reports a 36-point drop since 2024 in the share of Republicans who think crime is rising</a> &mdash; from <a href="https://news.gallup.com/poll/652763/smaller-majorities-say-crime-serious-increasing.aspx">90% in 2024</a> to about 54% now. Democrats went the other way: <a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">more of them said crime was rising in 2025 than the year before</a>.
        </P>

        <P>
          Same FBI report. Same falling murder line. Two groups looking at one reality and walking in opposite directions over twelve months. The thing that changed between the two polls wasn&rsquo;t a statistic. It was the occupant of the White House.
        </P>

        <H2>A mood ring, not a measurement</H2>

        <P>
          Gallup has watched this for years and says it plainly: when your party holds the presidency, you report less crime; when the other party holds it, you report more. <a href="https://news.gallup.com/poll/652763/smaller-majorities-say-crime-serious-increasing.aspx">The 61-point gap between Republicans and Democrats in 2024 was the largest in a trend going back to 1989</a>. 2025 just ran the same tape backward, with the parties trading sides.
        </P>

        <P>
          That&rsquo;s the part that matters to me. When a number swings 36 points in a year, lines up with an election instead of the thing it&rsquo;s nominally about, and points in different directions for different teams &mdash; it has quietly stopped measuring what its label says. &ldquo;Do you think crime is rising&rdquo; reads like a crime statistic. It behaves like a party-ID statistic wearing a crime costume.
        </P>

        <Callout label="The tell">
          The crime rate fell in 2023, 2024, and 2025. Republican belief that crime was rising sat near 90% through 2024 and collapsed to roughly 54% in 2025. The variable that tracks the belief isn&rsquo;t the homicide count. It&rsquo;s whose party is in power.
        </Callout>

        <P>
          This isn&rsquo;t a knock on the public for being dumb. It&rsquo;s a measurement problem, and a familiar one. We line up the perception number next to the FBI number, treat them as two readings of the same world, and call the space between them a literacy failure waiting to be fixed. But they aren&rsquo;t reading the same world. One counts bodies and break-ins. The other counts how people feel about who&rsquo;s in charge, with crime as the prompt.
        </P>

        <P>
          And that means the gap didn&rsquo;t close because anyone got better informed. It closed because a different set of partisans happened to be answering the prompt. Wait two years, swap the party in office, and it reopens &mdash; with the other half of the country supplying the pessimism this time. The crime rate is free to keep falling the whole way through.
        </P>

        <Divider />

        <P>
          The FBI got its data out in May, four months earlier than last year, the cleanest pipeline it has ever run. It won&rsquo;t get the credit for the mood shift, and it doesn&rsquo;t deserve the blame for the old gap either. The number that moved was never theirs to move.
        </P>

        <P><em>&mdash; TJ</em></P>

        <Divider />

        <P><strong>Sources</strong></P>

        <UL items={[
          <><a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">FBI &mdash; Releases Historic Early Look at Annual Crime Data (First Look: 2025), May 13, 2026</a></>,
          <><a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">Gallup &mdash; Crime in U.S. Seen as Less Serious for Second Straight Year, Oct. 30, 2025 (49%; 15-point drop; 36-point Republican drop)</a></>,
          <><a href="https://news.gallup.com/poll/652763/smaller-majorities-say-crime-serious-increasing.aspx">Gallup &mdash; Smaller Majorities Say Crime in U.S. Is Serious, Increasing, Oct. 29, 2024 (64% overall; 90% Republicans; 61-point partisan gap)</a></>,
        ]} />

      </article>
    </Prose>
  </Container>
);

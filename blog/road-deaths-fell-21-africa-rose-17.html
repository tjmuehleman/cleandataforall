<style>

    --ink:#141210;
    --paper:#F4EFE6;
    --rule: rgba(20,18,16,.18);
    --rule-soft: rgba(20,18,16,.10);
    --muted: rgba(20,18,16,.62);
    --display: 'Roboto Slab', serif;

    --mono: 'JetBrains Mono', ui-monospace, monospace;

  html[data-theme="paper"]{ --ink:#141210; --paper:#F4EFE6; --rule:rgba(20,18,16,.18); --rule-soft:rgba(20,18,16,.10); --muted:rgba(20,18,16,.62); }
  html[data-theme="poster"]{ --ink:#EDE6D8; --paper:#171413; --rule:rgba(237,230,216,.22); --rule-soft:rgba(237,230,216,.10); --muted:rgba(237,230,216,.6); }

  html[data-pair="slab-mono"]{ --display:'Roboto Slab', serif; --body:'IBM Plex Mono', monospace; --mono:'IBM Plex Mono', monospace; }

  a{ color: inherit; }
  ::selection{ background: var(--ink); color: var(--paper); }

  body::before{
    content:""; position: fixed; inset:0; pointer-events:none; z-index: 1;

      radial-gradient(rgba(20,18,16,.045) 1px, transparent 1px),

    mix-blend-mode: screen;

  #root{ position: relative; z-index: 2; }

  /* Post body typography */
  .post-body p { margin: 0 0 1.5em; font-size: 19px; line-height: 1.65; max-width: 68ch; }

  .post-body h3 { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 2vw, 26px); line-height: 1.1; margin: 1.8em 0 0.4em; }
  .post-body ul, .post-body ol { margin: 0 0 1.5em; padding-left: 1.4em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body li { margin-bottom: 0.4em; }

<script type="text/babel" data-presets="react">

// ==================== TEMPLATE DATA — update for each post ====================
const POST = {
  kind:    'Data Study',
  number:  '100',
  date:    'July 31, 2026',
  readTime: '3 min',
  title:   'Road deaths fell 21%. In Africa they rose 17%.',
  dek:     'WHO’s new number is a real win — the global road-death rate fell 21% since 2011. But it’s an average, stitched from one region that solved a lot of this and one where it’s getting worse.',
  byline:  'T.J. Müehleman',
};

// Sources
const WHO_NEWS = 'https://www.who.int/news/item/20-07-2026-road-deaths-fall-by-21--globally-but-stronger-action-is-needed-to-save-lives';
const WHO_FS   = 'https://www.who.int/news-room/fact-sheets/detail/road-traffic-injuries';

// Charts (stable URL-encoded QuickChart, never expire)
const HERO_CHART = 'https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Europe%22%2C%22Western+Pacific%22%2C%22South-East+Asia%22%2C%22Americas%22%2C%22Africa%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+change+since+2011%22%2C%22data%22%3A%5B-36%2C-15%2C-2%2C0%2C17%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%23777%22%2C%22%23bbb%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Change+in+road+traffic+deaths+by+WHO+region%2C+2011-2025%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+change+%28negative+%3D+fewer+deaths%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2';
const GAP_CHART = 'https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Share+of+road+deaths%22%2C%22Share+of+the+world%27s+vehicles%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22LMICs%22%2C%22data%22%3A%5B92%2C60%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Low-+and+middle-income+countries%3A+deaths+vs+vehicles%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A100%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+world+total%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2';
// =============================================================================

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>← All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      {/* Wordmark */}
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      {/* Meta row */}
      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>№ {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      {/* Title + dek */}
      <div style={{ maxWidth:900, paddingTop:32 }}>
        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>
          {POST.dek}
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>
        </div>
      </div>
    </div>
  </Container>
);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900 }}>
      <img src={HERO_CHART} alt="Change in road traffic deaths by WHO region since 2011: Europe down 36%, Western Pacific down 15%, South-East Asia down 2%, Americas unchanged, Africa up 17%" style={{ width:'100%', height:'auto', display:'block' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'center' }}>
        One global average, five regions going different directions. Africa is the one bar pointing the wrong way. (Eastern Mediterranean not broken out in the release.) Source: <a href={WHO_NEWS} target="_blank" rel="noopener" style={{ color:'inherit' }}>WHO news release, 20 July 2026</a>.
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const A = ({ href, children }) => <a href={href} target="_blank" rel="noopener">{children}</a>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On July 20, WHO shipped a rare piece of good news: the global rate of road traffic deaths <A href={WHO_NEWS}>fell 21% between 2011 and 2025</A>, even as the world bolted <A href={WHO_NEWS}>more than a billion new vehicles</A> onto its roads. I run a data company, a lot of it in global health, and I don’t get to type “genuine win” very often. So — genuine win.
        </P>

        <P>
          Then I read the next line. Road crashes are still the <A href={WHO_NEWS}>number one killer of every human being aged 5 to 29</A> — ahead of disease, ahead of violence, ahead of everything. A 21% drop, and still the single deadliest thing on Earth for a five-year-old. Both true. You have to hold them at the same time.
        </P>

        <H2>The 21% is an average, and averages are where stories go to hide</H2>

        <P>
          Pull the global number apart by region and it stops being one story. Europe: <A href={WHO_NEWS}>down 36%</A>. Western Pacific: down 15%. South-East Asia: down 2% — basically flat. The Americas: no change at all. And Africa: <A href={WHO_NEWS}>up 17%</A>. Same fifteen years, same report, five regions on five different trajectories, and one of them pointed the wrong way.
        </P>

        <P>
          That’s the whole trick of a headline average. “Down 21%” is what you get when you blend a region that solved a lot of this with a region where it’s getting worse, then weight the mix by where the deaths actually pile up. Report the blend and you’ve quietly buried both halves — the win and the backslide — under one tidy percentage.
        </P>

        <H2>92% of the deaths, 60% of the cars</H2>

        <P>
          Here’s who absorbs the toll. WHO’s own fact sheet: <A href={WHO_FS}>92% of the world’s road deaths happen in low- and middle-income countries</A> — which own only about <A href={WHO_FS}>60% of the world’s vehicles</A>. Fewer cars, far more funerals. The gap between those two bars is the story, and it maps almost cleanly onto income.
        </P>

        <Fig caption={<>Fewer cars, more deaths. Both bars come off the same fact sheet; the distance between them is the inequality. Source: <A href={WHO_FS}>WHO road traffic injuries fact sheet</A>.</>}>
          <img src={GAP_CHART} alt="Low- and middle-income countries hold 92% of the world's road deaths but only about 60% of its vehicles" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          And now the part I can’t not notice, because it’s pure data plumbing. WHO put <A href={WHO_NEWS}>1.16 million deaths</A> — the 2025 count — in its July press release. Walk over to WHO’s own road-traffic fact sheet, the page a journalist actually lands on, and it still says <A href={WHO_FS}>1.19 million a year</A>, and still says “more than 90%” where the key-facts box a few lines up says 92%. Same organization, two pages, two headline numbers.
        </P>

        <Callout label="Which door did you walk through">
          The fact sheet was <A href={WHO_FS}>last updated May 1, 2026</A>. The news release landed July 20. One page got the new snapshot; the other hasn’t been repainted yet. The “fact” you cite depends entirely on which of WHO’s own pages you opened first.
        </Callout>

        <P>
          None of this makes the progress fake. The rate really did fall. Helmets, seatbelts, speed limits, roads built for people instead of cars — they work, and the regions that funded them have the graphs to prove it. But “road deaths fell 21%” is a sentence hiding a region going backwards, a headline number that changes depending on the page, and a five-year-old for whom the most dangerous object in the world is still a car.
        </P>

        <Divider />

        <P>
          The road got safer. Just not everywhere, not for everyone, and not on whichever WHO page you happened to open first.
        </P>

        <P><em>— TJ</em></P>

      </article>
    </Prose>
  </Container>
);

// ==================== Footer ====================

  <footer style={{ borderTop:'1px solid var(--ink)', marginTop:80 }}>
    <Container>
      <div style={{ padding:'48px 0 32px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }} className="cdfa-colophon">

function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

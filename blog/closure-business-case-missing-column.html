// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          There is a slide in every school closure deck. It lists what the building costs to
          run: utilities, custodial, the site administrator, a slice of maintenance and
          transportation. Add it up. Close the building. Bank the difference. That is the case,
          and it has been the case in every district meeting I have ever sat in on.
        </P>

        <P>
          Francis Pearman at Stanford went and ran the other column.
        </P>

        <P>
          He took every public school district in California from 2011 through 2019 and compared
          the districts that entered a closure period against a synthetic composite of districts
          sitting on the same financial trajectory that didn’t close anything. The finding:{' '}
          <a href="https://gettingdowntofacts.com/reports/fiscal-consequences-school-closures-california-evidence-statewide-synthetic-difference" target="_blank" rel="noopener">per-pupil spending fell about $447 and per-pupil revenue fell about $433</a>.
          Neither estimate is statistically distinguishable from zero in the full sample. The
          near-symmetry is the whole story — whatever came off the expense line came off the
          revenue line too.
        </P>

        <H2>The money is attached to kids, not buildings</H2>

        <P>
          California funds districts through the Local Control Funding Formula, which pays on{' '}
          <a href="https://www.cde.ca.gov/fg/aa/lc/lcffoverview.asp" target="_blank" rel="noopener">average daily attendance</a> —
          not on square footage, not on school sites. So when a closure pushes families out of
          the district entirely, the revenue walks with them. Districts that entered a closure
          regime lost{' '}
          <a href="https://news.stanford.edu/stories/2026/09/california-school-closures-financial-impact-research" target="_blank" rel="noopener">about 288 students on average</a>{' '}
          across the study window. Those students were revenue. The building was cost. The deck
          only had the building on it.
        </P>

        <P>
          And the cost side didn’t behave either. Pearman found{' '}
          <a href="https://news.stanford.edu/stories/2026/09/california-school-closures-financial-impact-research" target="_blank" rel="noopener">no statistically significant reduction in teachers, principals, or total district staff</a>{' '}
          in districts that closed schools. The single line item you would actually have to move
          to save structural money is headcount, and headcount didn’t move. You closed a building
          and kept the payroll.
        </P>

        <P>
          Large urban districts get bigger, sharper estimates — about $1,224 off per-pupil
          spending against about $845 off per-pupil revenue, both statistically meaningful. That
          nets out to roughly $379 a pupil ($1,224 − $845). And even there, the districts’
          overall financial position did not significantly improve.
        </P>

        <Callout label="The arithmetic">
          Full sample: $447 saved, $433 lost, net $14 per pupil — inside the noise, and neither
          side of it distinguishable from zero. Large urban: $1,224 saved, $845 lost, net $379
          per pupil. For context, California TK-12 is running on a record{' '}
          <a href="https://edsource.org/2026/newsom-budget-education-funding/761141" target="_blank" rel="noopener">$128 billion state general fund appropriation</a> this year.
        </Callout>

        <H2>Now the other file</H2>

        <P>
          The number getting quoted all fall is 73.{' '}
          <a href="https://edsource.org/2026/california-school-closures-enrollment-decline/764123" target="_blank" rel="noopener">Seventy-three California public schools closed in 2026 through July</a>,
          roughly 19,033 students affected, up against 79 in all of 2025. Big number, clean
          trend line, easy headline.
        </P>

        <P>
          Except 38 of the 73 were independent charter schools. 34 were district-run. One was
          county-run. In LA Unified, 13 of the 14 closures were charters.
        </P>

        <Fig caption={<>Composition of the 73 California public school closures recorded January through July 2026: 38 independent charter, 34 district-run, 1 county-run. Source: <a href="https://edsource.org/2026/california-school-closures-enrollment-decline/764123" target="_blank" rel="noopener">EdSource</a>, using California Department of Education school directory data accessed Aug. 14, 2026.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Independent+charter%22%2C%22District-run%22%2C%22County-run%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Schools+closed%22%2C%22data%22%3A%5B38%2C34%2C1%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23141210%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.55%2C%22categoryPercentage%22%3A0.75%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+73+California+closures%2C+by+what+actually+happened%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A45%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Schools+closed%2C+Jan-July+2026%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=380&bkg=transparent&devicePixelRatio=2"
               alt="Horizontal bar chart of the 73 California school closures in 2026 through July, split into 38 independent charter schools, 34 district-run schools and 1 county-run school"
               style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>
        <P>
          A school board voting to consolidate two elementaries and a charter authorizer
          declining to renew a petition are not the same event. Different body, different
          process, different room, different people crying in the public comment line. They land
          in the same column because the CDE school directory carries one status field, and
          closed is closed. So “California closures are climbing” is partly a consolidation
          story and partly a charter renewal story, and the 73 can’t tell you the mix. You have
          to go open the file.
        </P>

        <P>
          The schools that closed weren’t drawn at random, either. Test scores at them ran{' '}
          <a href="https://edsource.org/2026/california-school-closures-enrollment-decline/764123" target="_blank" rel="noopener">14.3% below the state average in English and 14.6% below in math</a>,
          and 73% of their students were low-income against 62.5% statewide. Which tracks with
          what{' '}
          <a href="https://www.ppic.org/publication/factors-and-future-projections-for-k-12-declining-enrollment/" target="_blank" rel="noopener">PPIC found in 2023</a>.
        </P>

        <Divider />

        <P>
          Pearman is careful to say this isn’t an argument against ever closing a school. Steep
          enrollment decline is real — California lost 74,961 students in 2025-26 alone, the
          biggest one-year drop since 2021-22. Buildings deteriorate. Sometimes there is no other
          move.
        </P>

        <P>
          His point is that the financial analysis is more complicated than the slide. Which, for
          a decision this loud, this irreversible, and this consistently justified on fiscal
          grounds, is a strange thing to be finding out in 2026.
        </P>

      </article>
    </Prose>
  </Container>
);

// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          CDC posted the 2025&ndash;26 kindergarten numbers on August 17. Two headlines fell out of it.
          Exemptions from one or more vaccines hit{' '}
          <a href={S_CDC} target="_blank" rel="noopener">4.2%, a record, up from 3.6%</a>. MMR coverage
          fell to{' '}
          <a href={S_CDC} target="_blank" rel="noopener">92.4%</a>, under the 95% everybody treats as the
          floor. Both numbers are on the same page. Both are correct.
        </P>

        <P>
          They are also not describing the same country.
        </P>

        <H2>Who actually filed</H2>

        <P>
          KFF put the reporting counts in the footnotes of its charts, which I appreciate more than I
          probably should.{' '}
          <a href={S_KFF} target="_blank" rel="noopener">Forty-nine states reported MMR coverage for 2025&ndash;26. Fifty reported exemptions.</a>{' '}
          Kansas and Montana didn&rsquo;t file coverage. Montana didn&rsquo;t file exemptions.
        </P>

        <P>
          Do the arithmetic. Fifty states plus DC is 51 possible filers. Knock out Kansas and Montana and
          you land on 49 &mdash; the coverage roster. Knock out Montana alone and you land on 50 &mdash;
          the exemption roster. It reconciles exactly, which is how you know it isn&rsquo;t a rounding
          artifact. The two headline percentages on that page are averages over different maps.
        </P>

        <P>
          And the roster moves. 48 jurisdictions filed MMR in 2019&ndash;20 and again in 2020&ndash;21. 50
          filed from 2021&ndash;22 through 2023&ndash;24. 49 in each of the last two years. The exemption
          series ran 49, 49, 50, 50, 50, 49, 50. Seven years, and the two series disagree on the
          denominator in three of them.
        </P>

        <P>
          So the sentence everybody wrote this week &mdash; MMR coverage fell from 95% before the pandemic
          to 92.4% now &mdash; compares an average of 48 states to an average of 49 states, and not the
          same 48 or the same 49. The decline is real. I&rsquo;m not arguing the direction. CDC says
          coverage{' '}
          <a href={S_CDC} target="_blank" rel="noopener">decreased in more than half of states</a> and KFF
          counts{' '}
          <a href={S_KFF} target="_blank" rel="noopener">39 states now under 95%, with 18 under 90%</a>.
          But the precision in that 2.6-point drop is borrowed.
        </P>

        <H2>The field with no &ldquo;why&rdquo; in it</H2>

        <P>
          Here&rsquo;s the other thing. ABC asked the obvious question &mdash; are exemptions up because
          more parents object, or because the nonmedical box is the fastest way to get a kid through the
          door in September? The answer was{' '}
          <a href={S_ABC} target="_blank" rel="noopener">it&rsquo;s unclear, and Cleveland&rsquo;s health director thinks it&rsquo;s both</a>.
        </P>

        <P>
          That isn&rsquo;t a dodge. It&rsquo;s a schema problem. The exemption form records that a parent
          claimed one. It does not record why, and it can&rsquo;t, because nobody built a field for it. A
          philosophical objection and a family that lost its pediatrician during COVID and can&rsquo;t get
          an appointment before the enrollment deadline land in the same column. Then the column gets
          reported as sentiment.
        </P>

        <Callout label="Two counts, same release">
          About <a href={S_CDC} target="_blank" rel="noopener">155,000 kindergartners</a> had an exemption
          from one or more vaccines in 2025&ndash;26. About{' '}
          <a href={S_CDC} target="_blank" rel="noopener">280,000</a> started kindergarten with no
          documentation of finishing the MMR series. Both are CDC figures from the same release. CDC
          doesn&rsquo;t publish the crosswalk between them.
        </Callout>

        <P>
          We already know the form and the shot come apart, because it happened in 2020. Exemption rates
          fell that year. Not because objections fell &mdash; because{' '}
          <a href={S_USAF} target="_blank" rel="noopener">states expanded grace periods and provisional enrollment</a>,
          so kids went to school unvaccinated without anyone filing for an exemption. The line that moved
          was the paperwork line.
        </P>

        <Fig caption={<>All of the movement since 2019&ndash;20 is in the non-medical box: 2.2% to 4.0%, while medical exemptions slipped 0.3% to 0.2%. Non-medical rose 1.8 points while the combined rate rose 1.7. Figures via <a href={S_KFF} target="_blank" rel="noopener" style={{ color:'inherit' }}>KFF</a>, from <a href={S_CDC} target="_blank" rel="noopener" style={{ color:'inherit' }}>CDC SchoolVaxView</a>.</>}>
          <img src={CHART_EXEMPT} alt="Grouped bar chart comparing 2019-20 and 2025-26 US kindergarten exemption rates: any exemption 2.5% to 4.2%, non-medical 2.2% to 4.0%, medical 0.3% to 0.2%." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>One vaccine, two directions</H2>

        <P>
          One more, because it&rsquo;s my favorite kind of artifact. Varicella coverage{' '}
          <a href={S_ABC} target="_blank" rel="noopener">fell from 94% to 93.4% this year. Two-dose varicella coverage went up, 92.1% to 92.2%.</a>{' '}
          Same vaccine, same year, same file, opposite directions. Whichever one lands in the headline is
          an editorial decision wearing a lab coat.
        </P>

        <P>
          None of this is CDC hiding anything. The footnotes are right there, the state file is{' '}
          <a href={S_DATA} target="_blank" rel="noopener">downloadable</a>, and the page says out loud that
          data collection methodology differs by state. The problem is that the footnote never survives the
          trip to the second paragraph of the news story.
        </P>

        <Divider />

        <P>
          Do the subtraction in that callout. 280,000 minus 155,000 is 125,000, and that&rsquo;s a floor
          rather than a count, because some of the 155,000 exemptions are for vaccines other than MMR. At
          least 125,000 five-year-olds are missing MMR documentation and nobody filed a single form about
          them.
        </P>

        <P>
          The 4.2% counts parents who filled something out. The 280,000 counts kids nobody has a record
          for. Guess which one made the headline.
        </P>

        <H2>Sources</H2>

        <UL items={[
          <><a href={S_CDC} target="_blank" rel="noopener">CDC SchoolVaxView &mdash; Vaccination Coverage and Exemptions among Kindergartners</a>, updated August 17, 2026 (4.2% exemptions, 92.4% MMR and polio, 92.0% DTaP, ~155,000 exempt, ~280,000 without MMR documentation, 41 states and DC increasing, 24 states above 5%).</>,
          <><a href={S_KFF} target="_blank" rel="noopener">KFF, &ldquo;Kindergarten Routine Vaccination Rates Continue to Decline,&rdquo; August 21, 2026</a> (per-year reporting counts in figure footnotes; 2.5% to 4.2% exemptions; non-medical 2.2% to 4.0%; medical 0.3% to 0.2%; 39 states under 95%, 18 under 90%; KS and MT non-reporting).</>,
          <><a href={S_ABC} target="_blank" rel="noopener">ABC News, &ldquo;Vaccine exemption rate for kindergarteners reaches record high,&rdquo; August 17, 2026</a> (varicella one-dose and two-dose split; the unresolved question of why exemptions rose).</>,
          <><a href={S_USAF} target="_blank" rel="noopener">USAFacts, &ldquo;More kids are getting vaccine exemptions. Here&rsquo;s where.&rdquo;</a> (CDC attribution of the 2020 exemption dip to grace periods and provisional enrollment).</>,
          <><a href={S_CIDRAP} target="_blank" rel="noopener">CIDRAP, &ldquo;US kindergarten vaccine exemptions jumped last school year&rdquo;</a> (280,000 figure, corroborating).</>,
          <><a href={S_DATA} target="_blank" rel="noopener">CDC open data: state-level coverage and exemption file (ijqb-a7ye)</a>.</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

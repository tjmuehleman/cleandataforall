// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Open CRPE&rsquo;s <a href="https://stateofthestudent.crpe.org/#fast-facts">State of the American Student 2026</a> and the first number on the page is 10.5%. It&rsquo;s the share of US students in districts that have recovered to pre-pandemic achievement in both math and reading, and the label under it says <em>Education Scorecard</em>. It&rsquo;s also the number behind the week&rsquo;s headline: <a href="https://www.the74million.org/article/only-1-in-10-students-attends-a-district-that-has-bounced-back-from-the-pandemic/">only 1 in 10 students attends a district that has bounced back</a>, per The 74.
        </P>

        <P>
          I run a data company, so I did the boring thing. I tried to find the number.
        </P>

        <H2>Attempt one: 0.5%</H2>

        <P>
          My first pull of that page returned 0.5%. Not 10.5. Point five. Turns out the stats on the page are animated counters that tick up as you scroll, and I grabbed it mid-count (the teacher-burnout figure read 0% on my first pass for the same reason). Wait a few seconds and it settles at 10.5%. A fun reminder that &ldquo;the number on the page&rdquo; is sometimes a number on its way somewhere.
        </P>

        <H2>Attempt two: the source</H2>

        <P>
          Every other label on that stat strip (AEI, FutureEd, RAND, Gallup) links to the thing it cites. The <em>Education Scorecard</em> label doesn&rsquo;t link to anything. So I went to the Scorecard.
        </P>

        <P>
          The last time it published this exact statistic was February 2025, for grades 3&ndash;8 as of spring 2024: <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">17 percent of students in districts back above 2019 in math, 11 percent in reading, and 6 percent in both</a>. That&rsquo;s the chart up top. Six, not ten and a half. And <a href="https://cepr.harvard.edu/news/education-recovery-scorecard">no state</a> was above its 2019 NAEP level in both subjects.
        </P>

        <P>
          Then the 2026 Scorecard came out, and it changed the ruler. It <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">measures change from 2022 to 2025</a>, and its release doesn&rsquo;t report a share of students above 2019 at all. I also read through the <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf">full May 2026 report</a> looking for a both-subjects share and for 10.5 and came up empty. (What it does count is 108 &ldquo;Districts on the Rise,&rdquo; which is a different thing: big gains relative to similar districts.)
        </P>

        <H2>What I can and can&rsquo;t say</H2>

        <P>
          Maybe 10.5% is spring 2025 data, in which case 6 to 10.5 is a real jump in a year. Maybe CRPE got a custom cut from the Scorecard team. Maybe a different district list. I don&rsquo;t know, and the page doesn&rsquo;t say: no year, no grades, no cut line. It might be exactly right. I just can&rsquo;t show you that it is.
        </P>

        <Callout label="What I left out">
          The coverage also says lifetime earnings fall about 9% in the hardest-hit states versus 2% in the least-affected. Neither CRPE&rsquo;s public page nor The 74&rsquo;s write-up says where that comes from, so it&rsquo;s not in here. The Louisiana &ldquo;only state above 2019&rdquo; claim I already took apart on <a href="louisiana-cheap-and-good-three-denominators.html">October 3</a>.
        </Callout>

        <Divider />

        <P>
          So: 10.5% of American kids may be back to normal. Or 6%, if you trust the last footnote. Or 0.5%, if you&rsquo;re a scraper in a hurry. Same statistic, three answers, and only one of them comes with a source you can click.
        </P>

        <P><em>&mdash; TJ</em></P>

        <H3>Sources</H3>

        <UL items={[
          <><a href="https://stateofthestudent.crpe.org/#fast-facts">CRPE, State of the American Student 2026, fast facts</a> (10.5%, labeled Education Scorecard; unlinked source)</>,
          <><a href="https://www.the74million.org/article/only-1-in-10-students-attends-a-district-that-has-bounced-back-from-the-pandemic/">The 74, &ldquo;Only 1 in 10 students attends a district that has bounced back from the pandemic&rdquo;</a></>,
          <><a href="https://cepr.harvard.edu/news/education-recovery-scorecard">Education Recovery Scorecard release, February 2025</a> (17%, 11%, 6%; grades 3&ndash;8; spring 2024; no state above 2019 on NAEP in both)</>,
          <><a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Harvard GSE on the 2026 Scorecard</a> (2022&ndash;2025 window)</>,
          <><a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf">Education Scorecard, May 2026 report</a> (108 Districts on the Rise; no both-subjects share found)</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

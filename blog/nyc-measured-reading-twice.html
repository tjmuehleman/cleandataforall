// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

//   <Callout label="Note">Callout box text.</Callout>

//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Reading proficiency in New York City fell six percentage points last year.
          Third grade fell nearly fourteen. Fifth grade, thirteen. Math didn&rsquo;t
          move at all &mdash; 57% proficient, flat (<a href="https://www.chalkbeat.org/newyork/2026/08/07/nyc-students-reading-test-scores-decline-amid-literacy-instruction-changes/">preliminary state
          results, via Chalkbeat</a>).
        </P>

        <P>
          That&rsquo;s the state test.
        </P>

        <P>
          The city also gave its own periodic assessments to the same kids, in the same
          buildings, across the same school year. Those <a href="https://www.chalkbeat.org/newyork/2026/08/07/nyc-students-reading-test-scores-decline-amid-literacy-instruction-changes/">generally showed
          reading improving</a>.
        </P>

        <P>
          So New York City has two reading measurements for 2025&ndash;26 and they point
          in opposite directions. One of them ran in every paper in the city. The other
          showed up as a clause most of the way down the story.
        </P>

        <H2>Two instruments, no join</H2>

        <P>
          Schools Chancellor Kamar Samuels said the swings &ldquo;raise important
          questions and deserve careful, rigorous analysis so we can ensure we&rsquo;re
          measuring what students are learning.&rdquo; Which is the right instinct, and
          also the tell. The head of the largest school district in America is saying, on
          the record, that he isn&rsquo;t sure the measurement measured.
        </P>

        <P>
          I move education data between systems for a living, and this is the most
          familiar failure mode there is. Not a bad number. Two numbers, both defensible,
          and no agreed process for what happens when they disagree.
        </P>

        <P>
          The periodic assessments are formative. Built to be given several times a year,
          scored fast, used by a teacher next Tuesday. The state test is summative &mdash;
          one administration, a scale, a cut score, a percent-proficient rate published in
          August. Different instruments, different jobs, totally fine. What&rsquo;s not
          fine is that only one of them is wired into anything. Screening lists,
          intervention rosters, school ratings, the letter a parent gets in the mail. All
          state test.
        </P>

        <Callout label="The actual problem">
          When two instruments disagree, you don&rsquo;t get to pick the one you like.
          You get a reconciliation problem. Nobody built the reconciliation.
        </Callout>

        <H2>And then there&rsquo;s the category that can&rsquo;t lose</H2>

        <P>
          Here&rsquo;s a second one, sitting inside the same file.
        </P>

        <P>
          NYC reading proficiency last year, by student group: Asian American students
          about 67%, and a similar share of white students. Black students nearly 42%.
          Latino students about 37%. Students with disabilities just under 22%.
        </P>

        <P>
          And students who are currently learning English, or were in the past: 62.1%.
        </P>

        <Fig caption={<>NYC reading proficiency by student group, 2025&ndash;26 preliminary state results, as reported by <a href="https://www.chalkbeat.org/newyork/2026/08/07/nyc-students-reading-test-scores-decline-amid-literacy-instruction-changes/">Chalkbeat New York</a>. Chalkbeat gives the Asian American figure as about 67% and the Latino figure as about 37%; white students are described as a similar share to Asian American students and are not plotted separately.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Asian+American%22%2C%22Current+%26+former+English+learners%22%2C%22Black%22%2C%22Latino%22%2C%22Students+with+disabilities%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22NYC+reading+proficiency%2C+2025-26+%28%25%29%22%2C%22data%22%3A%5B67%2C62.1%2C41.9%2C37%2C22%5D%2C%22backgroundColor%22%3A%5B%22%23777777%22%2C%22%23141210%22%2C%22%23777777%22%2C%22%23777777%22%2C%22%23777777%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+English-learner+category+outscores+the+students+it+was+built+to+flag%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22min%22%3A0%2C%22max%22%3A80%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22percent+proficient+in+reading%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of NYC reading proficiency by student group: Asian American 67 percent, current and former English learners 62.1 percent, Black 41.9 percent, Latino 37 percent, students with disabilities 22 percent."
            style={{ width:'100%', height:'auto', display:'block' }}
          />
        </Fig>

        <P>
          The English-learner category outscores Black students by twenty points and
          Latino students by twenty-five.
        </P>

        <P>
          That number isn&rsquo;t wrong. It just isn&rsquo;t measuring the thing on the
          label. The group is <em>current and former</em> English learners &mdash; and the
          way you stop being a current English learner is by demonstrating proficiency in
          English. So the category keeps its graduates. Every kid who succeeds stays
          counted in it; every kid still struggling is a shrinking share of a growing
          denominator. I could be wrong about the exact mechanics in New York, but
          that&rsquo;s the standard shape of an ever-EL number, and it&rsquo;s why nobody
          should read 62.1% as a statement about children learning English.
        </P>

        <P>
          It also fell nearly ten points this year &mdash; <a href="https://www.chalkbeat.org/newyork/2026/08/07/nyc-students-reading-test-scores-decline-amid-literacy-instruction-changes/">the largest
          drop of any group</a>. A category structurally tilted upward still lost more
          ground than anyone else. That should be the alarming sentence in this piece.
        </P>

        <Divider />

        <H2>The part that bugs me</H2>

        <P>
          None of this is a scandal, and there&rsquo;s no villain in it. The state <a href="https://www.chalkbeat.org/newyork/2026/08/07/nyc-students-reading-test-scores-decline-amid-literacy-instruction-changes/">runs
          two independent audits of its assessments every year</a> and says nothing has
          been flagged. The chancellor asked for analysis instead of taking a victory lap.
          All fine.
        </P>

        <P>
          What bugs me is the asymmetry. The number came out on a Friday. The explanation
          is still pending. And the number is already doing work &mdash; in placement, in
          intervention lists, in the argument over whether a <a href="https://www.chalkbeat.org/newyork/2024/09/06/what-to-know-about-nyc-reads-curriculum-mandate-for-schools/">fourth
          year of literacy overhaul</a> is paying off.
        </P>

        <P>
          We built a system that can produce a proficiency rate in three weeks and a
          reconciliation in never.
        </P>

      </article>
    </Prose>
  </Container>
);

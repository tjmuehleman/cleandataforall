// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const H2 = ({ children }) => <h2>{children}</h2>;

);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Washington&rsquo;s <a href="https://ospi.k12.wa.us/student-success/support-programs/attendance-chronic-absenteeism-truancy/washingtons-5-year-challenge-cut-chronic-absenteeism-half" target="_blank" rel="noopener">5-Year Challenge page</a> has a chart. A goal line, an actual line, 2023&ndash;24 through 2028&ndash;29. The actual line stops at 27.1% in 2024&ndash;25. That&rsquo;s the last dot on the page as I write this. The 2025&ndash;26 numbers have been public since the state&rsquo;s <a href="https://ospi.k12.wa.us/about-ospi/news-center/news-releases/state-superintendent-chris-reykdal-unveils-new-student-achievement-data-and-budget-priorities" target="_blank" rel="noopener">September 10 release</a> pointed everyone to the Report Card.
        </P>

        <P>
          So I went and got them. Statewide regular attendance (fewer than two absences a month, on average) was <a href="https://data.wa.gov/d/5pzm-ence" target="_blank" rel="noopener">74.4%</a> in 2025&ndash;26, up from <a href="https://data.wa.gov/d/f7j6-nk2h" target="_blank" rel="noopener">72.7%</a>. Flip it and 25.6% of students fell short, versus 27.3% a year earlier. I&rsquo;m using that as a stand-in for chronic absence (more on why that&rsquo;s slippery in a minute). The goal line says 22.0% for 2025&ndash;26. Washington is 3.6 points behind its own glide path.
        </P>

        <H2>The arithmetic nobody posted</H2>

        <P>
          From 25.6% to the 2028&ndash;29 goal of 13.7% is 11.9 points. Three school years left. That&rsquo;s about 4.0 points a year. Last year the state moved 1.7. Not close, and not a rounding thing: the pace has to more than double, and it has to start with the 2026&ndash;27 data that doesn&rsquo;t exist yet.
        </P>

        <H2>Two numbers for the same thing</H2>

        <P>
          OSPI&rsquo;s chart says 27.3% for the 2023&ndash;24 baseline and 27.1% for 2024&ndash;25. The open file, flipped, says 27.4% and 27.3%. A tenth or two. Could be the definition (OSPI defines chronic absence as missing 10% or more of school days, about 18 days; the file&rsquo;s regular-attendance measure is under two absences a month). Could be data revised after the chart was drawn. I can&rsquo;t tell from the outside, and nobody should lose sleep. But the goal is specified to the tenth, 13.7%, and the thing being measured against it has two versions.
        </P>

        <P>
          Same file, different trap. The count of students short of regular attendance fell from 298,029 to 275,583, which is 22,446 fewer. The enrolled count in the denominator also fell, by 16,319 (1,092,735 to 1,076,416). A headline that says &ldquo;tens of thousands fewer absent kids&rdquo; is mixing a rate story and a headcount story.
        </P>

        <H2>Who carries the gap</H2>

        <P>
          The goal is one statewide number. The file has the groups. Homeless students: 49.7% regular attendance, so half miss the bar. Low-income: 66.2%, a third. Every group below sits above the statewide figure, and the statewide figure is still 11.9 points from the goal.
        </P>

        <Fig caption={<>Share of students not meeting regular attendance (100 minus the published rate), state total, 2025-26, <a href="https://data.wa.gov/d/5pzm-ence" target="_blank" rel="noopener">data.wa.gov</a>: homeless 49.7% regular, low income 66.2%, migrant 67.0%, students with disabilities 67.5%, English learners 68.4%, all students 74.4%. Goal: <a href="https://ospi.k12.wa.us/student-success/support-programs/attendance-chronic-absenteeism-truancy/washingtons-5-year-challenge-cut-chronic-absenteeism-half" target="_blank" rel="noopener">OSPI 2028-29 goal</a> 13.7%.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Homeless%22%2C%22Low+income%22%2C%22Migrant%22%2C%22Students+with+disabilities%22%2C%22English+learners%22%2C%22Statewide%22%2C%222028-29+goal%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B50.3%2C33.8%2C33.0%2C32.5%2C31.6%2C25.6%2C13.7%5D%2C%22backgroundColor%22%3A%5B%22%233a3a3a%22%2C%22%233a3a3a%22%2C%22%233a3a3a%22%2C%22%233a3a3a%22%2C%22%233a3a3a%22%2C%22%23141210%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Share+not+meeting+regular+attendance%2C+2025-26+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A14%7D%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A60%2C%22stepSize%22%3A10%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: share not meeting regular attendance in 2025-26: homeless 50.3%, low income 33.8%, migrant 33.0%, students with disabilities 32.5%, English learners 31.6%, statewide 25.6%, against a 2028-29 goal of 13.7%" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <Divider />

        <P>
          A pledge is a promise. A scoreboard is a data pipeline. Washington has the first one, and it&rsquo;s a few months late on the second. The data&rsquo;s already there. Somebody just has to hit refresh.
        </P>

      </article>
    </Prose>
  </Container>
);

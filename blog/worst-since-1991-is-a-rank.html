const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On July 30 the CDC’s running tally hit <a href={S_CPEDS} target="_blank" rel="noopener">2,371 measles cases</a> for 2026 — past the full-year 2025 total and, per roughly every headline, the worst year since 1991. All true. Here’s the part the headline leaves off: 1991 had <a href={S_CDC_1992} target="_blank" rel="noopener">9,643 cases</a>. The record we just broke is about a quarter the size of the record.
        </P>

        <P>
          I’m not here to tell you measles is fine. It isn’t. 2,371 is a real number, up from <a href={S_CDC_DATA} target="_blank" rel="noopener">285 in 2024</a>, and <a href={S_CIDRAP} target="_blank" rel="noopener">93% of this year’s patients</a> were unvaccinated or of unknown status. I’m here because “worst since 1991” is a rank, not a measurement. It tells you where 2026 sorts on a list. It says nothing about how big 2026 actually is.
        </P>

        <P>
          Ranks hide two things: magnitude, and the machine that made the number. 1991 was the tail of a pre-vaccine-era epidemic — <a href={S_CDC_1992} target="_blank" rel="noopener">27,786 cases in 1990</a>, 9,643 in 1991, then the floor dropped out to 2,200 in 1992. That “case” got counted in a country where measles was endemic and nobody sequenced a thing. The 2026 “case” gets a PCR test, a genotype, and a slot in a transmission chain, all logged against a surveillance system the CDC grades as <a href={S_CDC_MMWR24} target="_blank" rel="noopener">“well-performing.”</a> Same word on the y-axis. Not the same number underneath.
        </P>

        <H2>The record between the records</H2>

        <P>
          The reason “since 1991” has to reach back 34 years is that everything in between stayed low. The post-elimination high was <a href={S_CDC_DATA} target="_blank" rel="noopener">1,274 in 2019</a>. Then 285, then <a href={S_CIDRAP} target="_blank" rel="noopener">2,289 in 2025</a>, then 2,371 and climbing. That’s the real story, and it isn’t a rank — it’s a slope. The line sat flat for two decades and then bent hard in eighteen months.
        </P>

        <P>
          One number here did quietly cross a line, and it’s the boring administrative one. Kindergarten MMR coverage slid from <a href={S_CPEDS} target="_blank" rel="noopener">95.2% in 2019–20 to 92.5% in 2024–25</a>. The 95% mark isn’t a slogan; it’s the CDC’s <a href={S_CDC_MMWR24} target="_blank" rel="noopener">modeled estimate</a> of the population immunity needed to stop sustained transmission. A 2.7-point drop in a coverage spreadsheet, a roughly tenfold swing in cases a few years later. The leading indicator moved first, in a file nobody live-tweets.
        </P>

        <Fig caption={<>Coverage crossed the line years before the case count did. The 95% threshold is the CDC’s modeled floor for stopping sustained transmission, not a target. Sources: <a href={S_CPEDS} target="_blank" rel="noopener" style={{ color:'inherit' }}>CDC kindergarten coverage via Contemporary Pediatrics</a>; <a href={S_CDC_MMWR24} target="_blank" rel="noopener" style={{ color:'inherit' }}>CDC MMWR on the 95% threshold</a>.</>}>
          <img src={COV_CHART} alt="US kindergarten 2-dose MMR coverage fell from 95.2% in 2019-20 to 92.5% in 2024-25, crossing below the 95% herd-immunity threshold." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>The other number that isn’t a case count</H2>

        <P>
          Which brings us to the number everyone’s waiting on this fall. It also isn’t a case count. Elimination doesn’t fall when cases pass a threshold — there is no threshold. It falls when a verification commission rules that one genomic chain of transmission ran unbroken for <a href={S_CDC_MMWR24} target="_blank" rel="noopener">12 months</a>. PAHO makes that call <a href={S_PAHO_NOV} target="_blank" rel="noopener">once a year, in November</a>.
        </P>

        <P>
          Canada already got its verdict: status pulled <a href={S_CANADA} target="_blank" rel="noopener">November 10, 2025</a>, for transmission that started the previous fall. The US is up in November 2026, and independent analysts say the genetic evidence of endemic spread <a href={S_FALL} target="_blank" rel="noopener">already reaches back to January 2025</a>. So the thing on the calendar is a committee reading submitted sequences and deciding whether the surveillance was clean enough to trust the chain. The disease doesn’t wait for November. The paperwork does.
        </P>

        <Callout label="The two numbers">
          2,371 cases in 2026 — billed as the worst since 1991, when there were 9,643. The last year with more measles than right now sits 34 years, and one entire surveillance system, in the past.
        </Callout>

        <Divider />

        <P>

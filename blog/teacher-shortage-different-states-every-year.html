const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Every July, the <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet" target="_blank" rel="noopener">Learning Policy Institute</a> adds up the teacher shortage, and every July the headline writes itself. This year&rsquo;s number: at least 425,412 positions either unfilled or filled by a teacher not fully certified for the job. About 1 in 8 teaching positions nationally. LPI calls it the third consecutive year of increases.
        </P>

        <P>
          I believe every one of those positions is real. I just don&rsquo;t think the year-over-year line means what the headline wants it to mean. And that&rsquo;s not a knock on LPI (they flag this themselves, in plain English). It&rsquo;s a knock on a country that makes a research shop stitch its shortage number together from whatever 50 states feel like publishing.
        </P>

        <H2>Look at who showed up to be counted</H2>

        <P>
          The total is two numbers glued together: vacancies and not-fully-certified teachers. Here&rsquo;s the roster behind each, scan by scan.
        </P>

        <UL items={[
          <><a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-vacancy-resource-tool" target="_blank" rel="noopener">2023 scan</a>: 27,844 vacancies from 21 states, 286,290 uncertified from 47 states plus DC. Total 314,134. Data from 2020&ndash;21 or 2021&ndash;22, depending on the state.</>,
          <><a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-vacancy-resource-tool-2024" target="_blank" rel="noopener">2024 scan</a>: 41,920 vacancies from 30 states plus DC, 365,044 uncertified from 49 plus DC. Total 406,964.</>,
          <><a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-vacancy-resource-tool-2025" target="_blank" rel="noopener">2025 scan</a>: 45,582 vacancies from 31 plus DC, 365,967 uncertified from 48 plus DC. Total 411,549.</>,
          <><a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet" target="_blank" rel="noopener">2026 scan</a>: 37,569 vacancies from 29 plus DC, 387,843 uncertified from 50 plus DC. Total 425,412.</>
        ]} />

        <P>
          The biggest jump in the series, 2023 to 2024, is 92,830 positions (406,964 &minus; 314,134). That&rsquo;s the same year ten more jurisdictions (nine states plus DC) started reporting vacancies. Some of that jump is a worse shortage. Some of it is a longer list. The file can&rsquo;t tell you the split, because nobody built it to.
        </P>

        <Fig caption={<>Number of jurisdictions supplying each half of LPI&rsquo;s shortage count. Counts are states plus DC where LPI lists DC (2023 vacancies: 21 states; certification: 47 states + DC = 48). Sources: LPI <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-vacancy-resource-tool" target="_blank" rel="noopener">2023</a>, <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-vacancy-resource-tool-2024" target="_blank" rel="noopener">2024</a>, <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-vacancy-resource-tool-2025" target="_blank" rel="noopener">2025</a>, <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet" target="_blank" rel="noopener">2026</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222023+scan%22%2C%222024+scan%22%2C%222025+scan%22%2C%222026+scan%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Jurisdictions+reporting+certification+data%22%2C%22data%22%3A%5B48%2C50%2C49%2C51%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%22Jurisdictions+reporting+vacancy+data%22%2C%22data%22%3A%5B21%2C31%2C32%2C30%5D%2C%22backgroundColor%22%3A%22%23777%22%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Who+showed+up+to+be+counted+%28states%2C+plus+DC+where+reported%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22anchor%22%3A%22end%22%2C%22align%22%3A%22top%22%2C%22color%22%3A%22%23141210%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%7D%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A60%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Jurisdictions%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart: jurisdictions reporting certification data 48, 50, 49, 51 and vacancy data 21, 31, 32, 30 across the 2023 to 2026 LPI scans." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>The vacancies went down</H2>

        <P>
          This is the part nobody puts in the headline. Reported vacancies fell from 45,582 to 37,569 this year. The whole increase came from the uncertified side, which rose 21,876 (387,843 &minus; 365,967) in a year when two more jurisdictions started reporting it. And the 2026 fact sheet doesn&rsquo;t say which school year its state numbers describe. LPI says &ldquo;among states that reported data&rdquo; and calls the totals an undercount. Fair. Also: a moving denominator with no date on it.
        </P>

        <H2>Meanwhile, the headcount file says boom</H2>

        <P>
          Over at NCES, the staffing numbers point the other direction. Chad Aldeman at <a href="https://www.the74million.org/article/fewer-teachers-even-fewer-students-see-whats-happening-in-9500-districts/" target="_blank" rel="noopener">The 74</a> ran the Common Core of Data for 9,500+ districts and found schools added the equivalent of 118,000 full-time employees in 2024&ndash;25 while serving 135,000 fewer students. Teachers specifically: 11,000 fewer, against 225,000 fewer students. Three-quarters of districts now serve fewer students per teacher than they did eight years earlier.
        </P>

        <P>
          So which is it? Shortage getting worse, or more teachers per kid than eight years ago? Probably both, in different buildings and different subjects. That&rsquo;s a distribution question. And you can&rsquo;t answer a distribution question with a national total built from a different list of states every summer.
        </P>

        <H2>And the pipeline &ldquo;comeback&rdquo; is five years old</H2>

        <P>
          The good-news version of this story says teacher prep is refilling. The source is an <a href="https://www.nctq.org/research-insights/data-brief-how-do-trends-in-teacher-preparation-enrollment-and-completion-vary-by-state/" target="_blank" rel="noopener">NCTQ brief</a> on federal Title II data: 39 states grew prep enrollment in the last two reported years. True! Those two years are 2018&ndash;19 to 2020&ndash;21. Enrollment was still 591,000, down from 880,000 in 2010&ndash;11. Alternative routes grew faster (enrollment up 20%, completion up 16%, versus 4% and 5% for traditional programs), so the &ldquo;new people don&rsquo;t finish&rdquo; take doesn&rsquo;t survive that file either. But the newest year in it is a pandemic year. Anyone telling you where the pipeline is <em>today</em> is reading a 2021 newspaper.
        </P>

        <Divider />

        <P>
          We don&rsquo;t have a teacher shortage number. We have a teacher shortage <em>participation rate</em>. Fix the reporting and we can argue about the shortage. Until then we&rsquo;re mostly measuring which states answered the email.
        </P>


      </article>
    </Prose>
  </Container>
);

const H2 = ({ children }) => <h2>{children}</h2>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          &ldquo;The teacher shortage&rdquo; is the kind of story that&rsquo;s been written
          so many times the headline writes itself. Pipeline drying up, programs closing,
          districts begging. Last week another state said it was at the bottom. The week
          before that, somewhere else said the same thing.
        </P>

        <P>
          Here&rsquo;s the part that doesn&rsquo;t make the headline.
        </P>

        <P>
          In 2016-17, Michigan&rsquo;s teacher prep programs enrolled 9,512 students. In
          2023-24, they enrolled 17,780. That&rsquo;s an{' '}
          <a href="https://www.michigan.gov/mde/news-and-information/press-releases/2025/09/29/mi-teacher-prep-program-enrollment-continues-increase">87% increase &mdash; basically a doubling</a>{' '}
          &mdash; in seven years. MDE confirmed it last September. The 9,512 was itself the
          floor of a 59% drop from 2011-12 (23,203 students), so the recovery is real but
          still incomplete. The <em>direction</em> of the curve has been reversing for half
          a decade.
        </P>

        <P>
          If you build data systems for a living, the part that catches the eye isn&rsquo;t
          the 87%. It&rsquo;s that the national-headline story doesn&rsquo;t know about it
          yet.
        </P>

        <H2>Two reporting systems, two different stories</H2>

        <P>
          The &ldquo;teacher prep is collapsing&rdquo; narrative is built on{' '}
          <a href="https://title2.ed.gov/Public/Home.aspx">Title II reports</a>{' '}
          &mdash; the federal feed every educator-prep program submits to the Office of
          Postsecondary Education. The most recent national rollup,{' '}
          <a href="https://aacte.org/report/2025-data-update-teacher-preparation-program-trends/">AACTE&rsquo;s 2025 data update</a>,
          runs through 2022-23. Most of Michigan&rsquo;s recovery isn&rsquo;t in the federal
          aggregate yet. By the time it lands in a national average, it&rsquo;ll be three
          years behind whatever&rsquo;s actually happening in the prep program.
        </P>

        <P>
          Michigan&rsquo;s number is visible because MDE keeps a parallel state-level
          dataset. The nine states{' '}
          <a href="https://www.the74million.org/article/teacher-prep-programs-see-encouraging-growth-new-federal-data-reveal/">AACTE flagged as growth states</a>{' '}
          &mdash; Arkansas, Delaware, Florida, Louisiana, Maryland, Ohio, Pennsylvania,
          Rhode Island, South Carolina &mdash; show up there because each of them has been
          pumping long enough to clear the federal lag. Michigan isn&rsquo;t in that list.
          Michigan is somewhere in the middle of clearing it.
        </P>

        <Callout label="Two feeds, same shortage">
          Federal Title II rollups read like long-term decline with a modest recovery.
          State-level dashboards (MDE, MDOE, etc.) read like the states that intervened
          are seeing the lift, and you can name the policy. Same workforce. Different
          schemas. Different time windows.
        </Callout>

        <H2>What&rsquo;s driving the lift</H2>

        <P>
          The policy in Michigan&rsquo;s case is short enough to fit in a sentence: pay your
          student teachers. The state put $50 million into student-teacher stipends in{' '}
          <a href="https://www.michigan.gov/whitmer/news/press-releases/2025/10/07/gov-whitmer-signs-education-budget">the FY 2025-26 budget</a>,
          with each candidate eligible for up to{' '}
          <a href="https://www.michigan.gov/mistudentaid/programs/new-programs-for-future-educators/mi-future-educator-stipend">$9,600 per semester</a>.
          Maryland did a{' '}
          <a href="https://www.bestcolleges.com/news/these-states-pay-student-teachers/">version of this in 2023</a>{' '}
          (up to $20,000 for a 10-month internship, conditional on a two-year teaching
          commitment). Pennsylvania{' '}
          <a href="https://www.bestcolleges.com/news/pennsylvania-will-offer-student-teachers-stipends/">followed</a>{' '}
          with stipends up to $15,000.
        </P>

        <Fig caption={<>Sources: <a href="https://www.michigan.gov/mistudentaid/programs/new-programs-for-future-educators/mi-future-educator-stipend">Michigan MI Future Educator Stipend program page</a>; <a href="https://www.bestcolleges.com/news/these-states-pay-student-teachers/">BestColleges &ldquo;These States Pay Student Teachers&rdquo;</a> summarizing Maryland&rsquo;s 2023 law; <a href="https://www.bestcolleges.com/news/pennsylvania-will-offer-student-teachers-stipends/">BestColleges &ldquo;Pennsylvania to Offer Student Teachers up to $15,000 Stipends&rdquo;</a>. Amounts are program maximums; eligibility conditions vary by state.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Michigan+%28%24%2Fsemester%29%22%2C%22Pennsylvania+%28%24%29%22%2C%22Maryland+%28%24%2C+10-mo+internship%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22State-funded+student-teacher+stipend+maximum+%28USD%29%22%2C%22data%22%3A%5B9600%2C15000%2C20000%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22State-funded+student-teacher+stipend+maximums%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A22000%2C%22stepSize%22%3A5000%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22USD+%28state+program+documents%3B+units+differ+as+labeled%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=440&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of state-funded student-teacher stipend maximums: Michigan $9,600 per semester, Pennsylvania $15,000, Maryland $20,000 for a 10-month internship."
            style={{ width:'100%', display:'block' }}
          />
        </Fig>

        <P>
          The interesting question isn&rsquo;t whether the policy works. The Michigan curve
          is the answer to that.
        </P>

        <P>
          The interesting question is <em>which dataset are you reading when you decide
          if it&rsquo;s working</em>. If you&rsquo;re reading Title II, you&rsquo;re looking
          at 2018&ndash;2022. If you&rsquo;re reading MDE, you&rsquo;re looking at 2023-24.
          If you&rsquo;re a journalist on deadline, you&rsquo;re reading whichever dashboard
          came up first in search &mdash; which might be 18 months stale and missing the
          inflection point entirely.
        </P>

        <P>
          That&rsquo;s not a teacher-supply problem. That&rsquo;s a reporting-cascade
          problem. The pipeline takes four years; the state policy lever shows up at year
          one; the federal report catches up at year three or four. By the time the
          consensus is &ldquo;national recovery,&rdquo; the recovery is already over the
          hump, and the next round of state policy is being debated against a chart
          that&rsquo;s two cycles old.
        </P>

        <Divider />

        <P>
          When the next round of &ldquo;the teacher shortage&rdquo; headlines drops, the
          question to ask is which year&rsquo;s data the reporter pulled &mdash; and from

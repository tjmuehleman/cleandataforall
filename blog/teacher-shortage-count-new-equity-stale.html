// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          425,412 teaching positions nationwide are either empty or filled by someone not fully certified for the job, per{' '}
          <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">the Learning Policy Institute&rsquo;s scan published this July</a>{' '}
          &mdash; about 1 in 8 of all teaching positions in the country, and{' '}
          <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">the third straight year the number has climbed</a>. Last year&rsquo;s scan put the figure at{' '}
          <a href="https://learningpolicyinstitute.org/product/overview-teacher-shortages-2025-factsheet">411,549</a>. Headline: shortage&rsquo;s getting worse.
        </P>

        <P>
          Except look at who&rsquo;s actually in the count.{' '}
          <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">This year, 50 states plus D.C. reported certification data</a>{' '}
          &mdash; every state, for the first time. Last year it was{' '}
          <a href="https://learningpolicyinstitute.org/product/overview-teacher-shortages-2025-factsheet">48 states plus D.C.</a>{' '}
          On the vacancy side, it went the other way:{' '}
          <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">29 states plus D.C. reported unfilled positions this year</a>, down from{' '}
          <a href="https://learningpolicyinstitute.org/product/overview-teacher-shortages-2025-factsheet">31 plus D.C. last year</a>. So the number went up partly because more states showed up to one side of the ledger and fewer showed up to the other. LPI says as much &mdash; this is{' '}
          <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">an undercount by design, not a clean year-over-year trend line</a>.
        </P>

        <P>
          I run a data company. A metric that changes its own sample size every year isn&rsquo;t a bad metric &mdash; it&rsquo;s the only one available &mdash; but it means the &ldquo;third straight year of increases&rdquo; headline is doing more work than the data can support.
        </P>

        <H2>The number nobody&rsquo;s recomputed</H2>

        <P>
          Here&rsquo;s the part that matters more than the topline. Every year LPI updates the shortage count. The number nobody&rsquo;s updated is the one that says who&rsquo;s actually stuck with the gap.{' '}
          <a href="https://learningpolicyinstitute.org/product/crdc-teacher-access-report">Schools with the highest concentrations of students of color are 4 times as likely to employ an uncertified teacher</a>{' '}
          as schools with the lowest &mdash; that stat, repeated in this year&rsquo;s factsheet same as last year&rsquo;s, comes from{' '}
          <a href="https://learningpolicyinstitute.org/product/crdc-teacher-access-report">an LPI report analyzing the U.S. Department of Education&rsquo;s Civil Rights Data Collection from 2014 and 2016</a>. Same report found{' '}
          <a href="https://learningpolicyinstitute.org/product/crdc-teacher-access-report">nearly 1 in 6 teachers in high-minority-enrollment schools are in their first year on the job, versus 1 in 10 in low-minority-enrollment schools</a>. The federal Civil Rights Data Collection that produced those numbers only gets analyzed for this cut every few years &mdash; so the 4x figure everyone quotes as current evidence is running on a decade-old cross-tab, layered underneath a shortage count that gets refreshed annually.
        </P>

        <Fig caption={<>Share of teachers in their first year, by school student-of-color concentration. Source: Learning Policy Institute, &ldquo;<a href="https://learningpolicyinstitute.org/product/crdc-teacher-access-report">Inequitable Opportunity to Learn</a>&rdquo; (2020), analyzing 2014&ndash;16 Civil Rights Data Collection.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Schools+with+high+student-of-color+enrollment%22%2C%22Schools+with+low+student-of-color+enrollment%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Share+of+teachers+in+their+first+year%22%2C%22data%22%3A%5B16.7%2C10%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Novice-teacher+share%2C+by+school+racial+composition+%28CRDC+2014%5Cu201316%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x1%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y1%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+teachers+%281st+year%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart: 16.7 percent of teachers in schools with high student-of-color enrollment are in their first year, versus 10 percent in schools with low student-of-color enrollment."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>A fresher number, pointing the same way</H2>

        <P>
          There&rsquo;s a newer data point that at least points the same direction.{' '}
          <a href="https://learningpolicyinstitute.org/product/teacher-turnover-united-states-report">LPI&rsquo;s March 2026 turnover report</a>, built on federal survey data from 2020&ndash;21 and 2021&ndash;22, found turnover rates{' '}
          <a href="https://learningpolicyinstitute.org/product/teacher-turnover-united-states-report">35% to 37% higher in schools with the largest concentrations of students of color and low-income students than in schools with the smallest</a>. It doesn&rsquo;t update the 4x figure &mdash; it&rsquo;s a different measure, on a different sample &mdash; but it&rsquo;s the freshest evidence anyone has that the pattern the 2016 data caught hasn&rsquo;t gone away. Nobody&rsquo;s actually gone back and rerun the original comparison.
        </P>

        <Callout label="The data-guy read">
          The shortage count gets rebuilt every July, with a reporting base that quietly shifts state by state. The equity ratio underneath it &mdash; the one every teacher-shortage story leans on to say who&rsquo;s hurt worst &mdash; was last computed from 2014&ndash;16 federal data and has been recycled, unchanged, in every factsheet since.
        </Callout>

        <P>
          None of this means the shortage isn&rsquo;t real or the equity gap isn&rsquo;t real.{' '}
          <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">Forty-five states report special education shortages, 41 report science, 40 report math</a>{' '}
          &mdash; that part of the picture is consistent and well documented every single year. What&rsquo;s inconsistent is the refresh rate underneath the headline. The count that makes news gets rebuilt every July. The number that tells you who&rsquo;s actually affected was last computed with an Obama-administration dataset, and it&rsquo;s been doing all the work in every teacher-shortage story since.
        </P>

        <Divider />

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">Learning Policy Institute &mdash; An Overview of Teacher Shortages: 2026 (July 13, 2026)</a> &mdash; 425,412 positions unfilled or uncertified; 50 states + D.C. reporting certification, 29 + D.C. reporting vacancies; subject-shortage breakdown.</>,
          <><a href="https://learningpolicyinstitute.org/product/overview-teacher-shortages-2025-factsheet">Learning Policy Institute &mdash; An Overview of Teacher Shortages: 2025 (July 16, 2025)</a> &mdash; 411,549 positions; 48 states + D.C. reporting certification, 31 + D.C. reporting vacancies.</>,
          <><a href="https://learningpolicyinstitute.org/product/crdc-teacher-access-report">Learning Policy Institute &mdash; Inequitable Opportunity to Learn (Feb. 12, 2020)</a> &mdash; the 4x uncertified-teacher figure and 1-in-6 vs. 1-in-10 novice-teacher figure, both from 2014&ndash;16 Civil Rights Data Collection.</>,
          <><a href="https://learningpolicyinstitute.org/product/teacher-turnover-united-states-report">Learning Policy Institute &mdash; Teacher Turnover in the United States (March 17, 2026)</a> &mdash; 35%&ndash;37% higher turnover in highest- vs. lowest-concentration schools, from NCES NTPS/TFS 2020&ndash;22 data.</>,
        ]} />

        <P>
          <em>&mdash; TJ</em>
        </P>

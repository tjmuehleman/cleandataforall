  dek:     'The BLS April 2026 benchmark reconciled monthly survey estimates against full administrative records and turned the 2025 jobs narrative inside out. Before: 34 states growing. After: 22. The data wasn’t wrong, exactly. It just wasn’t finished.',

// ==================== Shared primitives ====================

  </span>

const Container = ({ children, style }) => (

  </div>
);

const Prose = ({ children, style }) => (

  </div>

// ==================== Top bar ====================

          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
          <a href="../index.html#subscribe" style={{ textDecoration:'none' }}>Subscribe</a>
        </div>

);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <div style={{ borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'32px 0', margin:'0 0 56px' }}>

          src="https://quickchart.io/chart/render/zf-f003e95d-d664-4efb-ab4f-8a7813d72570"
          alt="Grouped bar chart showing 2025 state job growth before and after BLS benchmark revision: before shows 34 states with positive growth and 16 negative; after shows 22 positive and 28 negative."
          style={{ display:'block', width:'100%', maxWidth:900, margin:'0 auto' }}
        />
        <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, maxWidth:900, margin:'10px auto 0' }}>
          Before/after: 2025 nonfarm payroll job growth by state, compared across BLS data vintages &mdash;
          Jan. 27, 2026 (pre-revision) vs. Apr. 13, 2026 (post-revision). Source:{' '}
          <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/" style={{ borderBottom:'1px solid var(--rule)', textDecoration:'none' }}>FRED Blog, April 2026</a>.
        </figcaption>
      </figure>
    </div>
  </Container>
);

// ==================== Helpers ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&#8212; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

// ==================== Post body ====================
const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In January 2026, the official record of the 2025 U.S. labor market
          looked like this: <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/">34 of 50 states</a> had
          positive nonfarm job growth. The median state was up 0.45 percent. Growth was broad,
          if uneven &mdash; two-thirds of the country at least nominally adding jobs
          for the year.
        </P>

        <P>
          In April 2026, the Bureau of Labor Statistics ran its annual benchmark
          revision. Afterward: <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/">22 states</a> with
          positive job growth. Median state down 0.09 percent &mdash; a slight net loss.
          Job growth was revised lower in <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/">40 states</a> and
          higher in 10. Twelve states went from the green column to the red.
        </P>

        <P>
          Nobody moved. It was just data.
        </P>

        <H2>Why this happens isn&rsquo;t mysterious</H2>

        <P>
          The BLS uses two separate counting systems for employment. The first is
          the Current Employment Statistics survey &mdash; monthly, sample-based,
          fast. About 145,000 businesses covering 670,000 worksites report each month.
          Early months are incomplete; later months fill in as more respondents check in.
          The BLS publishes estimates before the full sample closes because timely data
          beats no data, and revises as the picture fills out.
        </P>

        <P>
          The second is the Quarterly Census of Employment and Wages. QCEW is
          administrative data &mdash; built from employer filings to state
          unemployment insurance programs. It&rsquo;s not a sample. It&rsquo;s the
          full population of covered employers, derived from tax records that
          businesses have legal obligations to file accurately. But it arrives
          with a five-to-six-month lag, which is why the annual reconciliation
          happens in the spring: by April, QCEW has closed out the prior calendar year
          and BLS can compare twelve months of survey estimates against twelve months
          of administrative counts.
        </P>

        <P>
          What they find, almost every year, is drift. The 2025 revision averaged
          an <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/">absolute
          discrepancy of 0.70 percentage points</a> across all 50 states. Some states
          moved up, some moved down &mdash; but in 2025, <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/">40 states moved down</a>.
          That&rsquo;s not balanced noise. It&rsquo;s directional. The BLS&rsquo;s own
          preliminary benchmark from September 2025 had already flagged a national-level
          overcount of <a href="https://www.bls.gov/news.release/presae.nr0.htm">-911,000
          jobs</a> in the monthly CES estimates. The April 2026 state-level revision is
          what that national number looks like when disaggregated.
        </P>

        <Callout label="The flip, in numbers">
          <strong>Before revision</strong> (Jan. 2026 vintage): 34 states positive, median growth +0.45%<br/>
          <strong>After revision</strong> (Apr. 2026 vintage): 22 states positive, median growth &minus;0.09%<br/>
          Average absolute state revision: 0.70 percentage points<br/>
          Largest positive: Nevada (+2.33 pp) &mdash; Largest negative: Missouri (&minus;1.99 pp)<br/>
          <small style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--muted)' }}>
            Source: <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/">FRED Blog, April 2026</a>
          </small>
        </Callout>

        <P>
          The BLS identified two structural contributors to the national overcount.
          First, response error: businesses reported <em>more</em> employment to the
          monthly CES survey than they later reported to the quarterly QCEW when
          filing for unemployment insurance. Second, nonresponse bias: businesses
          that didn&rsquo;t reply to the CES survey &mdash; the ones the BLS had to
          impute &mdash; turned out to employ fewer people than the imputation assumed,
          as revealed when their QCEW filings came in. Both errors pushed the survey
          estimates high. Both got corrected in April.
        </P>

        <Fig caption={<>Median 2025 nonfarm payroll growth rate across all 50 states, before and after the April 2026 BLS benchmark revision. Source: <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/">FRED Blog, April 2026</a>.</>}>
          <img
            src="https://quickchart.io/chart/render/zf-ba8d4ef5-11c5-49d9-a74b-9d4be54e2bdb"
            alt="Bar chart showing median state job growth rate flipping from +0.45% before revision to -0.09% after revision."
            style={{ display:'block', width:'100%', maxWidth:760 }}
          />
        </Fig>

        <H2>The data wasn&rsquo;t wrong, exactly</H2>

        <P>
          What I want to resist here: the argument that the BLS failed, or that
          any revision of this size is evidence of institutional dysfunction.
          It isn&rsquo;t. The CES was designed to be fast. The QCEW was designed
          to be complete. They serve different purposes, on different timescales,
          from different source materials. The reconciliation is the point.
          BLS has published state-level benchmark revisions every spring for decades.
          This one was larger than typical &mdash; the 0.70-point average absolute
          revision is worth noting &mdash; but the mechanism itself is routine.
        </P>

        <P>
          What&rsquo;s worth sitting with is a different question. In 2025,
          businesses making hiring decisions, central bank officials setting
          interest rate policy, and the people writing economic headlines were
          all navigating a labor market that the corrected data describes
          differently than the real-time data did. The median state was, by the
          revised count, running a slight net job loss. That&rsquo;s not what
          the January vintage said. It&rsquo;s what the April vintage says now.
        </P>

        <P>
          This is the actual cost of wanting timely data. You get the number before
          it&rsquo;s done, and you navigate by it anyway, because waiting six months
          for the administrative record to close is worse. The tradeoff is
          reasonable. The revision magnitude is part of the design.
        </P>

        <P>
          And the number the headline printed in October 2025 isn&rsquo;t the
          number that ends up in the economic history books.
        </P>

        <Divider />

        <P>
          <strong>Sources</strong><br/>
          <a href="https://fredblog.stlouisfed.org/2026/04/revisions-to-2025-state-employment/">FRED Blog &mdash; Revisions to 2025 state employment (April 20, 2026)</a><br/>
          <a href="https://www.bls.gov/news.release/presae.nr0.htm">BLS &mdash; Current Employment Statistics Preliminary Benchmark, State and Area (September 9, 2025)</a><br/>
          <a href="https://www.bls.gov/news.release/prebmk.nr0.htm">BLS &mdash; Current Employment Statistics Preliminary Benchmark, National (September 9, 2025)</a>
        </P>

        <P><em>&mdash; TJ</em></P>

      </article>
    </Prose>
  </Container>
);

        </div>

        <Rule />

        <div style={{ padding:'24px 0 40px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }}>

          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>
            <div>All text, charts, and datasets are published under CC BY 4.0. Copy us, cite us, improve us. Corrections, at the bottom of every piece.</div>
          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Contact</div>
            <div>info@standardco.de<br/>Standard Co, est. 2013<br/>A reader-supported project.</div>
          </div>
        </div>

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
          <span>&#169; 2013&#8211;2026 Standard Co &middot; All rights unreserved</span>
          <span>Made with help from Claude</span>
        </div>
      </Container>
      <style>{`
        @media (max-width: 820px){
          .cdfa-colophon{ grid-template-columns: 1fr !important; }
        }
      `}</style>

};

// ==================== App ====================
function App() {
  return (
    <div>
      <TopBar />

}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

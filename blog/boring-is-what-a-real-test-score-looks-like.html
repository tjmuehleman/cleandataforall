const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">
        <P>In 2024, 43% of New York third graders were proficient in reading. In 2025, 54%. In 2026, 43% again, <a href="https://www.post-journal.com/news/top-stories/2026/08/mixed-marks-performance-on-state-ela-tests-drops-math-results-increase/">per the state&rsquo;s numbers</a>.</P>
        <P>Fifth grade pulled the same trick, bigger: 44%, 57%, 43%. Fourth grade went 47, 54, 48. Statewide math, same kids, same buildings, same spring, just crept along at 52%, 55%, 57%. A real collapse that politely skips math is a weird collapse.</P>
        <P>I wrote about the New York City version of this <a href="new-york-third-graders-fell-or-test-moved.html">on Friday</a>. Short version: either 2025 or 2026 is partly a measurement artifact, and EdTrust-New York wants <a href="https://newyork.edtrust.org/edtrust-new-york-calls-for-independent-audit-of-state-ela-assessments-following-significant-year-over-year-fluctuations/">an independent audit of the last three years of ELA testing</a>. One independent analyst&rsquo;s <a href="https://statetestscoreresults.substack.com/p/new-yorks-ela-scores-soared-in-2025">best guess</a> is a bad anchor file in the equating step, which would have added roughly 0.3 standard deviations to elementary reading in 2025. That&rsquo;s a hypothesis. The state hasn&rsquo;t confirmed it, and I can&rsquo;t either.</P>
        <H2>What a normal year looks like</H2>
        <P>Here&rsquo;s what kept bugging me. Is an 11-point swing in one grade crazy? I couldn&rsquo;t actually say. Test scores move. So I went and found a control. Washington publishes its state-level results in an <a href="https://data.wa.gov/api/views/9fjj-2374">open dataset on data.wa.gov</a>, so I pulled grades 3 through 8, reading and math, 2025 against 2026. Twelve comparisons.</P>
        <P>The biggest move was 1.2 points. Grade 6 reading down 1.2, grade 8 math up 1.2. Five of the twelve went up, seven went down, and ten of them moved by less than a point. That&rsquo;s it. That&rsquo;s the whole year.</P>
        <Fig caption={<>Source: New York grades 3&ndash;5 from the <a href="https://www.post-journal.com/news/top-stories/2026/08/mixed-marks-performance-on-state-ela-tests-drops-math-results-increase/">Post-Journal</a>&rsquo;s NYSED figures (2026 minus 2025: 43&minus;54, 48&minus;54, 43&minus;57 = &minus;11, &minus;6, &minus;14); grades 6&ndash;8 left blank because I didn&rsquo;t verify them. Washington from <a href="https://data.wa.gov/api/views/9fjj-2374">data.wa.gov dataset 9fjj-2374</a>, state level, all students, Smarter Balanced, percent meeting standard; change computed from unrounded values and rounded to 0.1.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Grade+3%22%2C%22Grade+4%22%2C%22Grade+5%22%2C%22Grade+6%22%2C%22Grade+7%22%2C%22Grade+8%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Washington+ELA%22%2C%22data%22%3A%5B-0.1%2C-0.2%2C-0.4%2C-1.2%2C0.5%2C-0.3%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22barPercentage%22%3A0.85%2C%22categoryPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%22New+York+ELA+%28grades+3-5%29%22%2C%22data%22%3A%5B-11%2C-6%2C-14%2Cnull%2Cnull%2Cnull%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.85%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Change+in+percent+proficient%2C+2025+to+2026+%28points%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-16%2C%22max%22%3A2%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percentage+points%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22y%22%7D%5D%2C%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22x%22%7D%5D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A11%7D%7D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: change in percent proficient, 2025 to 2026, in reading. Washington grades 3 to 8: minus 0.1, minus 0.2, minus 0.4, minus 1.2, plus 0.5, minus 0.3. New York grades 3 to 5: minus 11, minus 6, minus 14." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>
        <P>New York&rsquo;s fifth grade fell 14 points. That&rsquo;s more than eleven times the biggest thing Washington managed in a dozen tries.</P>
        <P>Now, the fine print (and there&rsquo;s a lot of it). Different states, different tests, different kids. Washington could have had a weird year too, and New York could have had a real one. A comparison like this can&rsquo;t prove a number is wrong. All it gives you is a ruler for <em>weird</em>.</P>
        <P>And that&rsquo;s the data-guy point. A number never looks suspicious by itself. 43% means nothing. It only gets suspicious next to 54%, next to math, next to somebody else&rsquo;s year. I&rsquo;d love to see this chart for every state that&rsquo;s published both years, tail and all.</P>
        <P>Until then: boring is what a real number looks like.</P>

          alt="Bar chart comparing COVID-19 deaths for 2020 to 2023: about 7.1 million officially reported to WHO versus a 22.1 million excess-death estimate."
          style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
        />
        <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:12, maxWidth:760, margin:'12px auto 0' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In May, the COVID-19 death toll tripled. Nobody died in the revision &mdash; the dying was done years ago. WHO&rsquo;s <em>World Health Statistics 2026</em> simply put the 2020&ndash;23 toll at <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">22.1 million excess deaths</a>, more than three times the <a href="https://data.who.int/dashboards/covid19/deaths">roughly 7 million</a> reported through the agency&rsquo;s own dashboard. Same pandemic. Same graves. A bigger number, because we finally did the arithmetic on the part we couldn&rsquo;t see.
        </P>

        <P>
          I run a data company, so the figure that stops me isn&rsquo;t the 22 million. It&rsquo;s the gap between 22 and 7 &mdash; about 15 million deaths that happened and were never logged as anything. That&rsquo;s not really a COVID story. It&rsquo;s a ledger story, and the ledger is missing most of its rows.
        </P>

        <H2>Two deaths in three never get a cause</H2>

        <P>
          Of an estimated <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">61 million deaths globally in 2023, only about one-third were registered with a cause of death</a>, and only about one-fifth had meaningful ICD-coded data. The other two-thirds get filled in by models &mdash; careful, peer-reviewed, defensible models, but models. <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">Just one-third of countries meet WHO&rsquo;s standard for high-quality mortality data; about half have low, very-low, or no data at all.</a>
        </P>

        <P>
          And what does come in is slow. As of the end of 2025, <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">only 18% of countries were getting their mortality data to WHO within a year, and nearly a third have never reported cause-of-death data at all.</a> So when a headline says 61 million people died last year, most of that sentence is an estimate built to fill a silence.
        </P>

        <H2>The map of what we can see is a map of who&rsquo;s rich</H2>

        <P>
          The gaps aren&rsquo;t scattered randomly. By WHO&rsquo;s own assessment, the share of deaths that get registered runs <a href="https://www.who.int/news-room/fact-sheets/detail/civil-registration-and-vital-statistics">98% in the European Region, 91% in the Americas, 82% in the Western Pacific &mdash; and 10% in the African Region.</a> Nearly <a href="https://www.who.int/news-room/fact-sheets/detail/civil-registration-and-vital-statistics">40% of the world&rsquo;s deaths go unregistered entirely</a>, and in low-income countries only 8% of the deaths that do get reported carry a documented cause.
        </P>

        <Fig caption={<>Source: <a href="https://www.who.int/news-room/fact-sheets/detail/civil-registration-and-vital-statistics">WHO &mdash; <em>Civil registration and vital statistics</em></a> (SCORE assessment, 164 countries). Share of deaths registered by region: African Region 10%, Eastern Mediterranean 55%, South-East Asia 61%, Western Pacific 82%, Americas 91%, European Region 98%.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22African+Region%22%2C%22Eastern+Mediterranean%22%2C%22South-East+Asia%22%2C%22Western+Pacific%22%2C%22Region+of+the+Americas%22%2C%22European+Region%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+of+deaths+registered%22%2C%22data%22%3A%5B10%2C55%2C61%2C82%2C91%2C98%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%2C%22%23777%22%2C%22%235a5a5a%22%2C%22%233a3a3a%22%2C%22%233a3a3a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Share+of+deaths+that+get+registered%2C+by+WHO+region%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A30%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A100%2C%22stepSize%22%3A20%2C%22fontSize%22%3A11%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+deaths+registered%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of the share of deaths registered by WHO region: African Region 10 percent, Eastern Mediterranean 55, South-East Asia 61, Western Pacific 82, Americas 91, European Region 98."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          Read that as a data person and it&rsquo;s the whole story in one line: the places carrying the heaviest health burdens are the places we can see the least. Which means our cleanest-looking global numbers are blurriest exactly where the stakes are highest. The COVID revision wasn&rsquo;t a surprise. It was the predictable result of estimating a pandemic on a measurement system that misses two deaths in three.
        </P>

        <H2>We had a plan. The clock ran out.</H2>

        <P>
          None of this is news to anyone inside the field, and there was a fix on the books. The World Bank and WHO ran a <a href="https://www.worldbank.org/en/topic/health/publication/global-civil-registration-vital-statistics-scaling-up-investment">Global CRVS Scaling-Up Investment Plan, a ten-year push from 2015 to 2024</a> aimed at universal registration of births, deaths, and causes of death &mdash; with legal proof of identity for everyone &mdash; by 2030. The decade is up. Roughly <a href="https://www.who.int/news-room/fact-sheets/detail/civil-registration-and-vital-statistics">40% of deaths still aren&rsquo;t registered</a>. The plan to fix the ledger expired before the ledger did.
        </P>

        <Callout label="The shape of it">
          Of ~61 million deaths worldwide in 2023, about one-third were registered with a cause of death and only about one-fifth had ICD-coded data. The rest is modeled. The 22 million COVID figure isn&rsquo;t WHO being alarmist &mdash; it&rsquo;s WHO being honest about how little of the world it can actually see.
        </Callout>

        <Divider />

        <P>
          Here&rsquo;s the uncomfortable part from the data side. Every time the estimate gets better, the official count looks worse by comparison &mdash; not because more people died, but because we got more honest about how many we&rsquo;d missed. A revision that triples a death toll feels like a scandal. It&rsquo;s actually the system working: a blurry number being replaced by a slightly-less-blurry one.
        </P>

        <P>
          The scary number was never 22 million. It&rsquo;s the two-thirds of the world&rsquo;s deaths we still can&rsquo;t name &mdash; the rows that stay blank until the next pandemic forces us to estimate our way across them again.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

        <Divider />

        <H2>Sources</H2>

        <UL items={[

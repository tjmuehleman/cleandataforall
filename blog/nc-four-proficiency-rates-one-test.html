// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);

const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          North Carolina released its 2026 test results on September 2. The share of students
          who are proficient is 59.2%. It is also 56%. It is also 37.5%, and also 33.2%.
        </P>

        <P>
          All four are correct. All four came out of the same testing program, about the same
          kids, on the same Wednesday.
        </P>

        <P>
          I run a data company, and this is the thing I have the hardest time explaining to
          people outside the work: a proficiency rate is not a measurement. It&rsquo;s a query.
          Change the cutoff, change the answer. Change the rows you count, change it again.
        </P>

        <H2>Where the line goes</H2>

        <P>
          North Carolina publishes two designations off the same exams. Per DPI,
          {' '}<a href="https://www.dpi.nc.gov/news/press-releases/2026/09/02/2026-graduation-rate-reaches-historic-high-accountability-results-continue-positive-trend-north">Grade Level Proficient is a score of 3, 4 or 5</a>, and College-and-Career Ready
          is a 4 or 5. Statewide, across every end-of-grade and end-of-course test,
          that&rsquo;s 59.2% and 37.5%. Nothing about the students changes between those two
          numbers. One boundary moves one notch.
        </P>

        <P>
          Then narrow the rows. The <a href="https://statetestscoreresults.substack.com/p/north-carolina-2026-assessment-results">Education Data Center</a>, working the same
          release, reports grades 3&ndash;8 reading at 56% under the friendlier standard and 33.2%
          under the stricter one. Math is 59.8% and 40.6%. So in reading, 22.8% of North Carolina
          kids in those grades are proficient and not proficient at the same time, depending on
          which of two official words you use.
        </P>

        <Callout label="The legacy column">
          The EDC notes the state effectively has four achievement levels, and they&rsquo;re
          labeled <em>Not Proficient, Level 3, Level 4, Level 5</em> &mdash; a holdover from the
          assessments before these ones. So the bottom bucket is not Level 1 or Level 2. It&rsquo;s
          just <em>Not Proficient</em>, sitting where 1 and 2 used to be.
        </Callout>

        <P>
          Every data system I&rsquo;ve worked in has a column like that. A field whose name stopped
          matching its contents years ago and got kept anyway, because renaming it breaks twelve
          reports and one dashboard nobody will admit to owning. It&rsquo;s fine. Until somebody
          who wasn&rsquo;t there writes a headline off it.
        </P>

        <H2>The fourth grade problem</H2>

        <P>
          Here&rsquo;s my favorite one, and it isn&rsquo;t a trick.
        </P>

        <P>
          Fourth grade reading was the one subject that didn&rsquo;t improve &mdash;
          {' '}<a href="https://www.wunc.org/education/2026-09-02/north-carolina-students-gains-2026-state-exams">57% proficient, down from 58%</a>. A dip. Except DPI&rsquo;s chief accountability
          officer told the state board, unprompted, that when you follow the actual 2026 fourth
          graders back to their third grade scores, they went from 47% to 57%.
        </P>

        <Fig caption={<>North Carolina grade 4 reading, grade level proficient. The grey pair is the year-over-year comparison the accountability system runs &mdash; this year&rsquo;s fourth graders against last year&rsquo;s fourth graders. The black pair follows the 2026 fourth graders back to their own third grade scores. Both readings were presented at the same September 2 State Board meeting. Source: <a href="https://www.wunc.org/education/2026-09-02/north-carolina-students-gains-2026-state-exams">WUNC</a>, reporting Michael Maher&rsquo;s presentation.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Spring+2025%22%2C%22Spring+2026%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Grade+4+vs.+last+year%5Cu2019s+grade+4+%28different+kids%29%22%2C%22data%22%3A%5B58%2C57%5D%2C%22backgroundColor%22%3A%22%23bbbbbb%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22The+same+kids%3A+grade+3%2C+then+grade+4%22%2C%22data%22%3A%5B47%2C57%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Atrue%2C%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22boxWidth%22%3A14%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22North+Carolina+grade+4+reading%3A+one+57%25%2C+two+readings%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A70%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+grade+level+proficient%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%2C%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Grouped bar chart of North Carolina grade 4 reading proficiency. Cross-sectionally, grade 4 fell from 58 percent in 2025 to 57 percent in 2026. Following the same cohort, the students rose from 47 percent in grade 3 to 57 percent in grade 4."
            style={{ display:'block', width:'100%', maxWidth:900, margin:'0 auto', height:'auto' }} />
        </Fig>

        <P>
          Minus one, or plus ten. Cross-sectional or longitudinal. Neither is a fudge, and the
          state said both out loud in the same meeting. But the accountability system runs the
          first one, so the first one is what lands in the file, in the report card, in the
          school&rsquo;s letter grade, and in the sentence a parent reads on their phone.
        </P>

        <H2>The best paragraph in the whole release</H2>

        <P>
          Buried past the graduation rate: the ACT composite for 11th graders rose to 18.4. DPI
          then discloses that <a href="https://www.dpi.nc.gov/news/press-releases/2026/09/02/2026-graduation-rate-reaches-historic-high-accountability-results-continue-positive-trend-north">ACT found a technical scoring issue</a> in its spring 2026 online
          school-day testing and rescored affected exams nationwide, that this year&rsquo;s composite
          therefore includes a one-time increase, and that NCDPI will watch how it compares to
          future years.
        </P>

        <P>
          That is a vendor-side data correction, flagged by the state, in its own good-news press
          release. I don&rsquo;t think most organizations do that. Genuinely good.
        </P>

        <P>
          It also means this year&rsquo;s ACT line is not comparable to last year&rsquo;s, and the
          only place that&rsquo;s recorded is a sentence in a press release that will be four clicks
          deep by Thanksgiving.
        </P>

        <Divider />

        <P>
          None of this is North Carolina being sneaky. The release defines both designations. The
          accountability officer explained the cohort thing without being asked. The ACT caveat is
          right there. This is a state doing the documentation part reasonably well.
        </P>

        <P>
          The failure is downstream, and it&rsquo;s structural. A parent opens a school report card,
          sees a percentage next to the word <em>proficient</em>, and has no way to know whether
          they&rsquo;re looking at a 3-4-5 cutoff or a 4-5 cutoff, all subjects or one, this
          year&rsquo;s cohort or theirs. The number arrives stripped of the four decisions that made it.
        </P>

        <P>
          A proficiency rate isn&rsquo;t a fact about kids. It&rsquo;s a fact about a WHERE clause.
        </P>

        <H2>Sources</H2>

        <UL items={[
          <><a href="https://www.dpi.nc.gov/news/press-releases/2026/09/02/2026-graduation-rate-reaches-historic-high-accountability-results-continue-positive-trend-north">NC DPI, &ldquo;2026 Graduation Rate Reaches Historic High, Accountability Results Continue Positive Trend for North Carolina Public School Students&rdquo;</a> (September 2, 2026). Source for the 88.8% four-year graduation rate; the 59.2% all-subject, all-grade composite proficiency; the definitions of Grade Level Proficient (3, 4 or 5) and College and Career Ready (4 or 5); the 37.5% CCR rate, up from 34.7%; the ACT composite of 18.4 and the disclosure of ACT&rsquo;s spring 2026 rescoring.</>,
          <><a href="https://statetestscoreresults.substack.com/p/north-carolina-2026-assessment-results">Education Data Center, &ldquo;North Carolina: 2026 Assessment Results&rdquo;</a> (September 3, 2026). Source for the grades 3&ndash;8 figures &mdash; reading at 56% GLP and 33.2% CCR, math at 59.8% and 40.6% &mdash; and for the description of the state&rsquo;s four effective achievement levels labeled Not Proficient, Level 3, Level 4 and Level 5.</>,
          <><a href="https://www.wunc.org/education/2026-09-02/north-carolina-students-gains-2026-state-exams">Liz Schlemmer, &ldquo;North Carolina students showed broad gains on 2026 state exams,&rdquo; WUNC</a> (September 2, 2026). Source for grade 4 reading at 57% versus 58% the prior year, and for Chief Accountability Officer Michael Maher&rsquo;s cohort comparison showing the same students at 47% in grade 3.</>,
          <><a href="https://www.dpi.nc.gov/districts-schools/accountability-and-testing/school-accountability-and-reporting/accountability-data-sets-and-reports">NC DPI accountability data sets and reports</a> &mdash; the underlying 2025&ndash;26 files behind every rate here.</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

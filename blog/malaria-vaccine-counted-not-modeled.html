// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On May 8, WHO published the four-year evaluation of the first malaria vaccine to reach African kids at scale. I read these reports the way some people read box scores &mdash; looking for the number somebody actually went out and counted. This year it&rsquo;s the headline: <a href="https://www.who.int/news/item/08-05-2026-new-evidence-confirms-malaria-vaccine-saves-child-lives-and-will-have-high-impact-in-wider-rollout">1 in 8 child deaths averted</a> among the kids eligible for the shot.
        </P>

        <P>
          The setting was the Malaria Vaccine Implementation Programme &mdash; RTS,S rolled into routine immunization in Ghana, Kenya, and Malawi from 2019 through 2023, reaching <a href="https://www.who.int/news/item/08-05-2026-new-evidence-confirms-malaria-vaccine-saves-child-lives-and-will-have-high-impact-in-wider-rollout">more than 2 million children</a>. WHO first recommended the vaccine in 2021. Today <a href="https://www.who.int/news/item/08-05-2026-new-evidence-confirms-malaria-vaccine-saves-child-lives-and-will-have-high-impact-in-wider-rollout">25 African countries</a> are giving it.
        </P>

        <H2>Numbers that came from counting</H2>

        <P>
          Here&rsquo;s what the pilot actually measured. Over four years, all-cause mortality among age-eligible children fell <a href="https://www.gavi.org/vaccineswork/rtss-vaccine-pilot-13-mortality-reduction-fuels-hope-malaria-control">13%</a> &mdash; that&rsquo;s the 1-in-8 line, said a second way. At the 24-month mark, the independent evaluation logged a <a href="https://www.who.int/news-room/questions-and-answers/item/q-a-on-rts-s-malaria-vaccine">9% drop in all-cause deaths and a 32% drop in hospitalisations for severe malaria</a> in children under five.
        </P>

        <P>
          Those are not modeled numbers. The pilot was a phased, cluster-design rollout with real cohorts, real comparison areas, and deaths counted on the ground over four years. When the report says 1 in 8, somebody added it up. That&rsquo;s rarer than it sounds.
        </P>

        <H2>The disease it&rsquo;s shrinking is a guess</H2>

        <P>
          Now look at the thing the vaccine is acting on. Malaria killed an estimated <a href="https://www.who.int/teams/global-malaria-programme/reports/world-malaria-report-2025">438,000 children in Africa in 2024</a>, out of roughly 610,000 deaths worldwide. That number is mostly an estimate &mdash; not because WHO is sloppy, but because the ledger underneath it has most of its rows missing.
        </P>

        <P>
          The same month, in <em>World Health Statistics 2026</em>, WHO put the substrate on the table: of an estimated <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">61 million deaths globally in 2023, only about a third were registered with a cause</a>. The other two-thirds are filled in by models. So the malaria burden &mdash; the figure every campaign, every funding ask, every chart leans on &mdash; is a count of the part we can see, stretched across the part we can&rsquo;t.
        </P>

        <Fig caption={<>Source: <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">WHO &mdash; <em>Global health gains face threat of reversal</em></a> (World Health Statistics 2026, May 13, 2026). Of ~61 million deaths worldwide in 2023, only about one-third were registered with a cause of death; the ~41M remainder (61 &minus; ~20) is derived by subtraction and is modeled, not counted.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Registered+with+a+cause+of+death+%28~1+in+3%29%22%2C%22Cause+modeled+%2F+estimated+%28~2+in+3%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Deaths%2C+2023+%28millions%29%22%2C%22data%22%3A%5B20%2C41%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Of+~61M+deaths+worldwide+in+2023%2C+most+carry+no+cause-of-death+record%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A30%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A65%2C%22stepSize%22%3A10%2C%22fontSize%22%3A11%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Deaths%2C+2023+%28millions%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=360&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart. Of an estimated 61 million deaths worldwide in 2023, about 20 million were registered with a cause of death and about 41 million had the cause modeled or estimated."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>Watch the number that travels</H2>

        <P>
          That 32% is worth slowing down on, because it&rsquo;s the kind of number that drifts. In the report it means one exact thing: a 32% reduction in <em>severe-malaria hospitalisations</em> among under-fives, at 24 months, in the pilot districts. By the time a stat like that has bounced through a few slide decks, it loosens into &ldquo;malaria fell 32%.&rdquo; It didn&rsquo;t. A measured number and a vibe are not the same data point, and the gap between them is where most bad health charts come from.
        </P>

        <P>
          I run a data company, so this is the part I can&rsquo;t stop staring at. The vaccine result is trustworthy precisely because of how it was produced: defined cohorts, a comparison group, outcomes followed for years. The burden it&rsquo;s pushing down is fuzzier for the opposite reason &mdash; it&rsquo;s assembled from the third of the world that files a cause of death and inferred across the rest. Same disease. Two completely different grades of evidence.
        </P>

        <Callout label="The shape of it">
          The intervention was measured: 1 in 8 child deaths averted, 13% lower all-cause mortality over four years, 32% fewer severe-malaria hospitalisations at 24 months. The problem it&rsquo;s solving is mostly estimated: ~438,000 African child deaths in 2024, off a system that registers a cause for about one death in three.
        </Callout>

        <Divider />

        <P>
          So here&rsquo;s the picture from the data side. For once, the win is the clean number. We ran a real evaluation, counted the kids, and the shot works &mdash; that&rsquo;s not in doubt, and it shouldn&rsquo;t be undersold. The discomfort is that we can now measure the cure better than we can measure the disease.
        </P>

        <P>
          The vaccine is one of the best-counted things in global health this year. The 438,000 it&rsquo;s working against is one of the worst. Fixing that second number is less glamorous than a vaccine. It&rsquo;s also the only way we&rsquo;ll ever know how well the first one did.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

        <Divider />

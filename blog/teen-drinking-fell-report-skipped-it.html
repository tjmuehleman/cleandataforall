// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In 1995, 51.6% of American high schoolers told CDC they&rsquo;d had at least one drink in the past 30 days (<a href="https://www.cdc.gov/mmwr/preview/mmwrhtml/00043812.htm">MMWR, 1996</a>). In 2025 it was 20.3%. Vaping sat at 16.0%. Marijuana at 12.9% (<a href="https://www.cdc.gov/mmwr/volumes/75/su/su7501a6.htm">MMWR Supplement, 2026</a>). That&rsquo;s 31 points off a single behavior, in the longest-running adolescent survey the government has.
        </P>

        <P>
          So where is it in the 2025 national report? Not there.
        </P>

        <P>
          The report covers <a href="https://www.cdc.gov/yrbs/yhif/files/2025/YHIF-2015-2025-Final-508.pdf">diet, physical activity, sleep, digital behavior, and mental health</a>. Drinking shows up as a passing mention. Sex doesn&rsquo;t show up at all. <a href="https://stateline.org/2026/09/24/cdcs-latest-youth-behavior-report-offers-a-narrower-look-at-teen-health/">Stateline counted 36 pages</a>, against 88 for the 2023 edition, and noted the national findings largely skip substance use, sexual behavior, violence, and disparities between student groups.
        </P>

        <H2>The best number lives on page 54</H2>

        <P>
          To be fair, CDC did publish the substance use numbers. They&rsquo;re in the <a href="https://www.cdc.gov/mmwr/volumes/75/su/su7501a1.htm">same MMWR supplement</a>, in a report titled &ldquo;Urban-Rural and Demographic Differences in Substance Use,&rdquo; pages 54&ndash;66. If you wanted the headline (teens drink at well under half the rate they did in 1995) you had to go looking in the report about urban versus rural.
        </P>

        <P>
          That&rsquo;s a data systems problem, not a data problem. The finding exists. It just isn&rsquo;t where a reasonable person would look for it.
        </P>

        <Fig caption={<>Sources: CDC, <a href="https://www.cdc.gov/mmwr/preview/mmwrhtml/00043812.htm">MMWR 1996</a> (1995 drinking); <a href="https://www.cdc.gov/mmwr/volumes/75/su/su7501a6.htm">MMWR Supplement 2026</a> (2025 values). Past-30-day use among U.S. high school students. No 1995 comparison shown for vaping or marijuana.</>}>
          <img src={CHART_USE} alt="Bar chart: drinking 51.6% in 1995 versus 20.3% in 2025; vaping 16.0% and marijuana 12.9% in 2025" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>Then there&rsquo;s the denominator</H2>

        <P>
          Here&rsquo;s the part I can&rsquo;t stop looking at. In 2025, <a href="https://www.cdc.gov/mmwr/volumes/75/su/su7501a1.htm">108 of the 230 sampled schools took part</a>. That&rsquo;s a 47.0% school response rate. Multiply by a 65.2% student rate and the overall response rate is 30.6%, which CDC itself calls the lowest in the survey&rsquo;s history. In 2023 it was <a href="https://www.cdc.gov/mmwr/volumes/73/su/su7304a1.htm">35.4%</a>. The final analytic sample: 10,710 kids.
        </P>

        <Fig caption={<>Sources: CDC, <a href="https://www.cdc.gov/mmwr/volumes/75/su/su7501a1.htm">MMWR Supplement 2026</a> (2025); <a href="https://www.cdc.gov/mmwr/volumes/73/su/su7304a1.htm">MMWR Supplement 2024</a> (2023). Overall rate is CDC&rsquo;s school rate times student rate.</>}>
          <img src={CHART_RESP} alt="Bar chart of YRBS response rates, 2023 vs 2025: schools 49.8% vs 47.0%, students 71.0% vs 65.2%, overall 35.4% vs 30.6%" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Does a low response rate mean the drinking number is wrong? No. I don&rsquo;t know, and nothing I&rsquo;ve read says it is (CDC says overall rates have been sliding steadily since 2011). But it means more than two-thirds of the students the design was built to reach aren&rsquo;t in the data. That&rsquo;s the denominator under every number above.
        </P>

        <Divider />

        <P>
          So: the best teen-behavior news in the dataset, from the least-attended edition in its history, summarized in a report that mostly didn&rsquo;t mention it, with the proof sitting in the urban-rural chapter. If you set out to make good news hard to believe, I&rsquo;m not sure you could do better. (I&rsquo;m not saying anyone did. Could just be a 36-page budget.)
        </P>

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://www.cdc.gov/mmwr/preview/mmwrhtml/00043812.htm">CDC, Youth Risk Behavior Surveillance &mdash; United States, 1995 (MMWR, 1996)</a></>,
          <><a href="https://www.cdc.gov/mmwr/volumes/75/su/su7501a6.htm">CDC, Urban-Rural and Demographic Differences in Substance Use Among High School Students, YRBS 2025 (MMWR Suppl. 2026)</a></>,

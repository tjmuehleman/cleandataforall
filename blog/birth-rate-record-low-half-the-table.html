// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, textAlign:'center' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%221991%22%2C%222007%22%2C%222025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Births+per+1%2C000+females+15-19%22%2C%22data%22%3A%5B61.8%2C41.5%2C11.7%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+teen+birth+rate%2C+ages+15%5Cu201319+%28births+per+1%2C000+females%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A70%2C%22stepSize%22%3A10%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Births+per+1%2C000%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of the U.S. teen birth rate for ages 15 to 19: 61.8 births per 1,000 in 1991, 41.5 in 2007, and 11.7 in 2025." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The U.S. general fertility rate fell to <a href="https://www.cdc.gov/nchs/pressroom/releases/20260409.html">53.1 births per 1,000 women ages 15 to 44 in 2025</a>, down 1% from the year before, and the coverage wrote itself: <a href="https://thehill.com/homenews/5823947-falling-birth-rates-usa/">a new record low, a birth-rate crisis, a country that forgot how to reproduce</a>.
        </P>

        <P>
          And the number is real. Births were down 1%, <a href="https://www.cdc.gov/nchs/pressroom/releases/20260409.html">3,606,400 of them</a>. But I run a data company, and a single falling average is exactly the kind of number that makes me want the breakdown. An average is a story the data tells about itself &mdash; and it&rsquo;s almost never the only one in the file.
        </P>

        <H2>One average, two directions</H2>

        <P>
          Here&rsquo;s the part the headline skipped. Pull <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">Table 1 of the CDC&rsquo;s provisional 2025 report</a> and the birth rate isn&rsquo;t falling. It&rsquo;s splitting. Every age group under 30 dropped &mdash; teens from 12.6 to 11.7, women 20&ndash;24 from 55.8 to 52.2, women 25&ndash;29 from 89.5 to 85.6. And <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">every age group over 30 went <em>up</em></a>: 30&ndash;34 rose to 96.2, 35&ndash;39 to 55.1, even 40&ndash;44 ticked up to 12.8.
        </P>

        <P>
          So three of the six childbearing age bands fell and three rose. The most fertile group in the country is now women in their early thirties, <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">at 96.2 per 1,000, comfortably ahead of the late-twenties band that used to own that spot</a>. That&rsquo;s not a nation having fewer babies so much as a nation having them later. The record-low average is the sound of those two trends &mdash; younger down, older up &mdash; collapsing into one sad-looking line.
        </P>

        <Fig caption={<>U.S. birth rate by age of mother, per 1,000 women, final 2024 vs. provisional 2025. Under-30 bands fall; every band over 30 rises. Source: <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">CDC NCHS, Births: Provisional Data for 2025 (VSRR No. 43), Table 1</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%2215%5Cu201319%22%2C%2220%5Cu201324%22%2C%2225%5Cu201329%22%2C%2230%5Cu201334%22%2C%2235%5Cu201339%22%2C%2240%5Cu201344%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222024%22%2C%22data%22%3A%5B12.6%2C55.8%2C89.5%2C93.7%2C54.3%2C12.7%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%222025%22%2C%22data%22%3A%5B11.7%2C52.2%2C85.6%2C96.2%2C55.1%2C12.8%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Atrue%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+birth+rate+by+age+of+mother%2C+2024+vs+2025+%28per+1%2C000%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A100%2C%22stepSize%22%3A20%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Births+per+1%2C000+women%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart comparing U.S. birth rates by age of mother in 2024 and 2025. Rates fall for ages 15-19, 20-24, and 25-29, and rise for ages 30-34, 35-39, and 40-44." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <H2>The cleanest number in the file</H2>

        <P>
          Then there&rsquo;s the line nobody put on the front page. The <a href="https://www.cdc.gov/nchs/pressroom/releases/20260409.html">teen birth rate hit 11.7 per 1,000 girls ages 15 to 19 in 2025, another record low</a>, down 7% in a single year. Zoom out and it&rsquo;s one of the steepest, most durable reversals in any American social statistic: <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">down 72% since 2007, and 81% since the 1991 peak of 61.8</a>. The youngest teens, 15 to 17, fell <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">78% over that same stretch</a>.
        </P>

        <P>
          I&rsquo;m a data guy, not an epidemiologist, so I won&rsquo;t pretend to know every reason. But I know what a clean trend line looks like, and this is one &mdash; decades long, almost monotonic, <a href="https://www.npr.org/2026/04/09/nx-s1-5777587/teen-birth-rates-hit-another-historical-low-2025-cdc">holding across the whole country</a>. When a number moves like that for thirty years, it isn&rsquo;t noise. It&rsquo;s a system that changed and stayed changed.
        </P>

        <H2>It&rsquo;s a snapshot, and snapshots lie a little</H2>

        <P>
          One more thing the headline left out, because data people are obligated to. This is <em>provisional</em> data &mdash; built from <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">99.95% of 2025 birth records as of February 3, 2026</a>, not a final count. And the rates lean on a <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">blended population base the Census Bureau stitched together from the 2020 count and later estimates</a>, not a fresh denominator. Provisional birth numbers have tracked the final ones closely before, so I&rsquo;d bet the direction holds. But &ldquo;record low&rdquo; is a claim about a snapshot caught mid-development, divided by an estimate of an estimate.
        </P>

        <Callout label="The tell">
          The headline is one number &mdash; 53.1, down 1%. The table underneath it is ten numbers moving in two directions: every age under 30 falling, every age over 30 rising, and the 30&ndash;34 band now the most fertile in the country.
        </Callout>

        <Divider />

        <P>
          None of which makes the decline fake. Fewer Americans are having kids, and that&rsquo;s a real thing with real consequences. But &ldquo;fertility hits record low&rdquo; is one number doing the work of ten. Underneath it, the rate is falling for the young and rising for the old, and the single fastest-moving piece &mdash; teen births in free fall for thirty straight years &mdash; is the kind of win that, if it were running the other way, would be on every front page in the country.
        </P>

        <P>
          The average went down. Half the table went up. Both are true. Only one of them made the headline.
        </P>

        <P><em>&mdash; TJ</em></P>

        <Divider />

        <P><strong>Sources</strong></P>

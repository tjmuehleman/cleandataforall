// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The federal government says 2.5 million students got an out-of-school suspension in 2023-24. That’s <a href="https://www.npr.org/2026/10/07/nx-s1-5988314/civil-rights-data-public-schools-trump">up about 100,000</a> from the 2021-22 count. Flat-ish. Boring. Move along.
        </P>

        <P>
          Now go back one more survey. In 2015-16, <a href="https://www.k12dive.com/news/report-27m-students-suspended-in-2015-16-despite-efforts-to-curb-exclusio/559489/">more than 2.7 million</a> students were suspended out of school. So over eight years the headcount went down. About 200,000 fewer kids (roughly 7%, if you let me round 2.7 and 2.5 like a person).
        </P>

        <P>
          Fewer kids. Fine. Here’s the other number.
        </P>

        <P>
          Students lost <a href="https://civilrightsproject.ucla.edu/press-releases/national-report-calls-attention-to-frequent-use-of-suspension-contributing-to-stark-inequities-in-the-opportunity-to-learn">11 million days</a> of school to out-of-school suspensions in 2015-16. In 2023-24 it was <a href="https://www.npr.org/2026/10/07/nx-s1-5988314/civil-rights-data-public-schools-trump">more than 14 million</a>, per Dan Losen’s analysis of the new federal file. That’s 27% more days (14 ÷ 11) with fewer kids doing the missing.
        </P>

        <P>
          Divide one by the other and the average suspended student lost about 4.1 days then and about 5.6 now. Schools aren’t suspending a lot more children. They’re suspending them for longer.
        </P>

        <Fig caption={<>Index, 2015-16 = 100. Students: 2.5M ÷ 2.7M = 93. Days: 14M ÷ 11M = 127. Both inputs are floors (“more than”), so treat the bars as approximate. Sources: <a href="https://www.k12dive.com/news/report-27m-students-suspended-in-2015-16-despite-efforts-to-curb-exclusio/559489/">K-12 Dive</a>, <a href="https://civilrightsproject.ucla.edu/press-releases/national-report-calls-attention-to-frequent-use-of-suspension-contributing-to-stark-inequities-in-the-opportunity-to-learn">UCLA Civil Rights Project</a>, <a href="https://www.npr.org/2026/10/07/nx-s1-5988314/civil-rights-data-public-schools-trump">NPR</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222015-16%22%2C%222023-24%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Days+lost+per+suspended+student%22%2C%22data%22%3A%5B4.1%2C5.6%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.5%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Days+of+school+lost+per+suspended+student%2C+out-of-school%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A7%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Days+%28derived%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of days of school lost per suspended student: about 4.1 in 2015-16 and about 5.6 in 2023-24."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>Nobody’s file leads with the number that moved</H2>

        <P>
          The 2023-24 Civil Rights Data Collection was due at the end of last year. It <a href="https://www.npr.org/2026/09/04/nx-s1-5955681/civil-rights-data-schools-trump">went up the first week of September</a>, with no First Look Report. Raw files. 37 of them. Good luck.
        </P>

        <P>
          Headcount is the column that’s sitting right there in the table. Days lost is a number somebody has to build. NPR credits it to Losen’s analysis, and as far as I can tell, if he doesn’t run it, the 14 million doesn’t exist in public. I could be wrong about that. Tell me.
        </P>

        <P>
          One honest asterisk: the 2015-16 figure is days lost to out-of-school suspension, and NPR describes the new one as days of school missed to suspensions. I’m treating them as the same series. If they aren’t, the gap shrinks and I owe you a correction.
        </P>

        <H2>What the days are made of</H2>

        <P>
          Losen says most districts suspend for minor offenses like truancy or dress code, <a href="https://www.npr.org/2026/10/07/nx-s1-5988314/civil-rights-data-public-schools-trump">not unsafe behavior</a>. And Black students lost more than four times as many days to out-of-school suspension as white students, per the same NPR piece.
        </P>

        <P>
          Attendance is the metric every district dashboard I’ve ever seen leads with. Meanwhile the discipline system is quietly generating absences on purpose, and the file that counts them doesn’t.
        </P>

        <P>
          Count kids and the story is flat. Count days and it isn’t. Same file.
        </P>

        <Divider />

        <P><strong>Sources</strong></P>
        <UL items={[
          <><a href="https://www.npr.org/2026/10/07/nx-s1-5988314/civil-rights-data-public-schools-trump">NPR, “5 things civil rights data says about public schools” (Oct. 7, 2026)</a></>,
          <><a href="https://www.npr.org/2026/09/04/nx-s1-5955681/civil-rights-data-schools-trump">NPR, federal civil rights data is finally out (Sept. 4, 2026)</a></>,
          <><a href="https://civilrightsproject.ucla.edu/press-releases/national-report-calls-attention-to-frequent-use-of-suspension-contributing-to-stark-inequities-in-the-opportunity-to-learn">UCLA Civil Rights Project, Lost Opportunities (2015-16 data)</a></>,
          <><a href="https://www.k12dive.com/news/report-27m-students-suspended-in-2015-16-despite-efforts-to-curb-exclusio/559489/">K-12 Dive on the U.S. Commission on Civil Rights report (2015-16 suspensions)</a></>,
        ]} />

      </article>
    </Prose>
  </Container>
);

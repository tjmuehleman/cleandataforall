<style>

    --ink:#141210;
    --paper:#F4EFE6;
    --rule: rgba(20,18,16,.18);
    --rule-soft: rgba(20,18,16,.10);
    --muted: rgba(20,18,16,.62);
    --display: 'Roboto Slab', serif;
    --body: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[data-theme="paper"]{ --ink:#141210; --paper:#F4EFE6; --rule:rgba(20,18,16,.18); --rule-soft:rgba(20,18,16,.10); --muted:rgba(20,18,16,.62); }
  html[data-theme="poster"]{ --ink:#EDE6D8; --paper:#171413; --rule:rgba(237,230,216,.22); --rule-soft:rgba(237,230,216,.10); --muted:rgba(237,230,216,.6); }
  html[data-theme="zine"]{ --ink:#0A0908; --paper:#EFEBDF; --rule:rgba(10,9,8,.35); --rule-soft:rgba(10,9,8,.18); --muted:rgba(10,9,8,.68); }

  html[data-pair="slab-serif"]{ --display:'Roboto Slab', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }
  html[data-pair="grotesk-serif"]{ --display:'Archivo', sans-serif; --body:'Fraunces', Georgia, serif; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="slab-mono"]{ --display:'Roboto Slab', serif; --body:'IBM Plex Mono', monospace; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="display-serif"]{ --display:'Instrument Serif', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }
  body{ font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","ss02","onum"; }
  a{ color: inherit; }
  ::selection{ background: var(--ink); color: var(--paper); }

  body::before{
    content:""; position: fixed; inset:0; pointer-events:none; z-index: 1;
    background-image:
      radial-gradient(rgba(20,18,16,.045) 1px, transparent 1px),

  #root{ position: relative; z-index: 2; }

  /* Post body typography */
  .post-body p { margin: 0 0 1.5em; font-size: 19px; line-height: 1.65; max-width: 68ch; }

  .post-body ul, .post-body ol { margin: 0 0 1.5em; padding-left: 1.4em; font-size: 19px; line-height: 1.65; max-width: 68ch; }

<script type="text/babel" data-presets="react">

// ==================== TEMPLATE DATA — update for each post ====================
const POST = {
  kind:    'Analysis',
  number:  '086',
  date:    'July 15, 2026',
  readTime: '3 min',
  title:   'Most of the world’s measles is an estimate. Ours is a count.',
  dek:     'The WHO puts 2024 at 11 million measles infections — a modeled figure almost nobody sees. The CDC puts 2026 at 2,231 confirmed cases through July 9, already near all of last year. Only one of those numbers can move.',
  byline:  'T.J. Müehleman',

// =============================================================================

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>← All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      {/* Wordmark */}
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      {/* Meta row */}
      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>№ {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      {/* Title + dek */}
      <div style={{ maxWidth:900, paddingTop:32 }}>
        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>
          {POST.dek}
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>
        </div>
      </div>
    </div>
  </Container>
);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900 }}>
      <img
        src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222025+%28full+year%29%22%2C%222026+%28through+July+9%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22U.S.+confirmed+measles+cases%22%2C%22data%22%3A%5B2289%2C2231%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+measles%3A+a+full+year+in+six+months%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Confirmed+cases%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
        alt="Bar chart of U.S. confirmed measles cases. 2025 full year: 2,289. 2026 through July 9: 2,231."
        style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>
        The U.S. has counted nearly a full 2025 of measles by the midpoint of 2026. Source: <a href="https://www.cdc.gov/measles/data-research/index.html" style={{ color:'inherit' }}>CDC, Measles Cases and Outbreaks</a> (2,231 as of July 9, 2026; 2,289 total for 2025).
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The United States has recorded <a href="https://www.cdc.gov/measles/data-research/index.html">2,231 measles cases in 2026</a>, as of July 9. All of last year, start to finish, it recorded <a href="https://www.cdc.gov/measles/data-research/index.html">2,289</a>. So we're roughly one bad week away from doing a full year of measles in half the time — and we pulled it off while most of the conversation was still fixed on a different, much bigger number.
        </P>

        <P>
          That bigger number belongs to the WHO: an <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">estimated 11 million measles infections worldwide in 2024</a>, nearly 800,000 above where things sat before the pandemic. It's a real crisis and a serious figure. But look at the verb. Estimated.
        </P>

        <H2>Two ways to count a disease</H2>

        <P>
          There are basically two regimes for counting measles. In most of the world you don't count cases — you model them. Surveillance is thin, labs are far, and a lot of measles never touches a clinic, so the WHO and its partners take what gets reported and scale it into an estimate of the true burden. That's how you get to 11 million. It's the honest way to describe a disease you can't fully see.
        </P>

        <P>
          The US runs the other regime. Nearly every one of those 2,231 cases is a confirmed, line-listed case sitting in a <a href="https://www.cdc.gov/measles/data-research/index.html">CDC table that updates most weeks</a> — 32 outbreaks, 93% of cases tied to one of them. It isn't a guess. It's a count.
        </P>

        <Callout label="The two numbers">
          The world's 2024 measles burden is a modeled estimate: <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">11 million</a> infections. The U.S. 2026 figure is a confirmed count: <a href="https://www.cdc.gov/measles/data-research/index.html">2,231 through July 9</a>, against 2,289 for all of 2025.
        </Callout>

        <H2>Only one of them shows you the slope</H2>

        <P>
          Here's why a data person should care which regime you're in. An estimate is a snapshot. It tells you how big last year was, once the modeling is finished, months after the fact. A count tells you how fast this year is moving, right now. The 11-million figure is a still photo. The 2,231 is a live feed — and the live feed shows the line bending up.
        </P>

        <P>
          That's the thing the global number can't do. It smooths. By the time the 2025 world estimate lands, 2025 will be settled history, not a warning. The confirmed US count doesn't wait around. It told us back in spring that 2026 would blow past 2025, and it was right.
        </P>

        <H2>There's a count underneath the count</H2>

        <P>
          And the count came with a warning label. MMR coverage among US kindergartners was <a href="https://www.cdc.gov/mmwr/volumes/70/wr/mm7003a2.htm">95.2% in 2019–20</a>. It's <a href="https://www.cdc.gov/schoolvaxview/data/index.html">92.5% now</a> — below the 95% floor you need to keep measles from finding room to run. That's not a model either. It's a headcount of five-year-olds, taken every fall, and it has slid four years running.
        </P>

        <Fig caption={<>Kindergarten MMR coverage has dropped below the 95% herd-immunity floor and stayed there. Source: <a href="https://www.cdc.gov/mmwr/volumes/70/wr/mm7003a2.htm" style={{ color:'inherit' }}>CDC MMWR</a> (2019–20) and <a href="https://www.cdc.gov/schoolvaxview/data/index.html" style={{ color:'inherit' }}>CDC SchoolVaxView</a> (2023–24, 2024–25).</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222019%5Cu201320%22%2C%222023%5Cu201324%22%2C%222024%5Cu201325%22%2C%22Herd-immunity+floor%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Kindergarten+MMR+coverage+%28%25%29%22%2C%22data%22%3A%5B95.2%2C92.7%2C92.5%2C95.0%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%235a5a5a%22%2C%22%23141210%22%2C%22%23bbb%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+kindergarten+MMR+coverage+vs+the+95%25+floor%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A100%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Coverage+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of U.S. kindergarten MMR coverage: 95.2% in 2019-20, 92.7% in 2023-24, 92.5% in 2024-25, against a 95% herd-immunity floor."
            style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          The virus is doing exactly what a slipping coverage number says it will do. We had the warning in a confirmed count, watched it fall below the line, and then mostly kept arguing about a modeled global total that couldn't move fast enough to warn anyone.
        </P>

        <Divider />

        <P>
          In November, officials will <a href="https://www.kff.org/other-health/measles-elimination-status-what-it-is-and-how-the-u-s-could-lose-it/">decide whether the US keeps the measles-elimination status</a> it has held since 2000 — the same status the wider <a href="https://www.paho.org/en/news/10-11-2025-paho-calls-regional-action-americas-lose-measles-elimination-status">Region of the Americas lost in November 2025</a>. That call will hinge on a clock and a committee's read of the data. The case count won't. It'll just be sitting there, updated, higher than the year before, not asking anyone's opinion. The estimate tells us how bad it was. The count is telling us now.
        </P>

      </article>
    </Prose>
  </Container>
);

// ==================== Footer ====================
const Footer = () => (

      <div style={{ padding:'48px 0 32px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }} className="cdfa-colophon">
        <div>
          <div style={{ color:'var(--ink)', marginBottom:6 }}>Colophon</div>
          <div>Hosted on Github pages. Built with a mix of Claude and TJ.</div>
        </div>
        <div>
          <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>
          <div>All text, charts, and datasets are published under CC BY 4.0. Copy us, cite us, improve us. Corrections, at the bottom of every piece.</div>
        </div>
      </div>

      <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
        <span>© 2013–2026 <a href="https://www.standardco.de" target="_blank" rel="noopener" style={{ color:'inherit', borderBottom:'1px solid currentColor', textDecoration:'none' }}>Standard Co</a> · All rights unreserved</span>
      </div>
    </Container>
    <style>{`
      @media (max-width: 820px){
        .cdfa-colophon{ grid-template-columns: 1fr !important; }
      }
    `}</style>
  </footer>
);

// ==================== App ====================
function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

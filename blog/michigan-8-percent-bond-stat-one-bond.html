// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Michigan votes today on 42 school bonds, asking for nearly $4 billion in total (<a href="https://bridgemi.com/michigan-education-watch/michigan-elections-school-districts-seeking-nearly-4-billion-in-bonds/" target="_blank" rel="noopener">Bridge Michigan, Oct. 30, 2026</a>). By tomorrow morning somebody will hold the results up against a stat that&rsquo;s been making the rounds: bonds that don&rsquo;t raise the tax rate pass about 60% of the time. Bonds that do pass 8%.
        </P>
        <P>
          I went looking for the denominator. The source is a <a href="https://www.triangle-inc.com/michigan-school-bond-elections/" target="_blank" rel="noopener">July 2026 page from Triangle Associates</a>, a bond consultancy, and it says it plainly: zero-mill-increase proposals passed at &ldquo;approximately 60%,&rdquo; and bonds with a millage increase passed &ldquo;at just 8%.&rdquo; That&rsquo;s May 2025. No counts. No list of proposals. The only hard totals on the page are statewide: 22 of 45 passed, 49%.
        </P>
        <P>
          So do the napkin math (it&rsquo;s mine, not theirs). If 22 of 45 passed, and one group cleared 60% while the other cleared 8%, the millage-increase group has to be about a dozen proposals. Eight percent of a dozen is one bond. 1 of 12 is 8.3%, 1 of 13 is 7.7%. Not a pattern in how voters behave. One bond. Maybe. The page might be counting something I can&rsquo;t see, and that&rsquo;s sort of the whole problem.
        </P>
        <P>
          The one figure on that page that does come with a count: in 2025 alone, 24 districts ran bond campaigns with a millage increase and 4 passed, <a href="https://www.triangle-inc.com/michigan-school-bond-elections/" target="_blank" rel="noopener">17%</a>. Same source, same bucket, more than double the 8%.
        </P>

        <H2>Four sources, four universes</H2>

        <P>
          Fine, go to the official data. Michigan Treasury&rsquo;s <a href="https://www.michigan.gov/treasury/finance/sbqlp/reports/annual-reports/sbq-loan-program/appendix-a" target="_blank" rel="noopener">2025 list of qualified bond elections</a> has 12 of 30 passing in May and 13 of 26 in November (I counted the rows), so 40% and 50%. Bridge Michigan, working from Gongwer News Service data, has <a href="https://bridgemi.com/michigan-education-watch/michigan-voters-split-on-school-bonds-yes-in-novi-zeeland-no-in-lake-orion/" target="_blank" rel="noopener">64.6% in November 2025</a> and <a href="https://bridgemi.com/talent-education/most-school-bonds-pass-in-tuesdays-election-look-up-your-district/" target="_blank" rel="noopener">63.8% in May 2026</a> (23 of 36). Same state. Same elections. Pick a number (they&rsquo;re all in the chart up top).
        </P>


        <P>
          Some of that gap is real. Treasury only covers bonds in the state&rsquo;s qualification program, and Triangle&rsquo;s 45 proposals for May 2025 don&rsquo;t match Treasury&rsquo;s 30. Nobody&rsquo;s necessarily wrong. They&rsquo;re counting different things and not saying which.
        </P>
        <P>
          And the official list has its own cracks. Appendix A labels Lake Orion &ldquo;Pass&rdquo; with 4,982 yes votes and 5,047 no. It labels Wayne-Westland &ldquo;Fail&rdquo; with 5,810 yes and 4,251 no. Bridge reported Lake Orion&rsquo;s bond <a href="https://bridgemi.com/michigan-education-watch/michigan-voters-split-on-school-bonds-yes-in-novi-zeeland-no-in-lake-orion/" target="_blank" rel="noopener">went down</a>.
        </P>

        <Divider />

        <P>
          It may well be true that voters punish a rate increase. It&rsquo;d be surprising if they didn&rsquo;t. But tonight&rsquo;s results will get scored against a number nobody can rebuild, and 42 real ballots deserve better than that. Eight percent, it turns out, can be a single bond.
        </P>
        <P>
          <em>— TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

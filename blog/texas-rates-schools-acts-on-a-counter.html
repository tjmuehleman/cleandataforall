        alt="Horizontal bar chart of consecutive F ratings held by three Austin ISD middle schools after the 2026 Texas A-F release. Burnet Middle School five. Webb Middle School five. Dobie Middle School four. Five consecutive F ratings triggers mandatory state intervention under Texas Education Code 39A.111."
        style={{ width:'100%', height:'auto', display:'block' }}

      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Kirby Middle School earned a failing rating in 2025. Kirby Middle School had already closed.
        </P>

        <P>
          Wichita Falls ISD shut the campus in 2024 and moved its students to Hirschi. But Texas
          accountability ratings measure the <em>previous</em> school year, so the fifth F landed on a
          building nobody had walked into in months &mdash; and that fifth F is what{' '}
          <a href="https://www.texastribune.org/2026/08/14/austin-isd-ratings-texas-school-takeover-trigger/" target="_blank" rel="noopener">triggered state intervention in Wichita Falls</a>.
          A closed school got a grade. The grade had consequences.
        </P>

        <P>
          I run a data company. We spend our days turning student records into numbers other people act
          on, so I read the Texas accountability file the way I read any pipeline: what goes in, what the
          transform does, and what fires downstream. And the thing about A-F is that the letter grade
          everybody argues about is not the field doing the work.
        </P>

        <P>
          The counter is.
        </P>

        <H2>A B and an F in the same file</H2>

        <P>
          On August 14, TEA{' '}
          <a href="https://tea.texas.gov/about-tea/newsroom/tea-releases-2026-f-accountability-ratings-txschoolsgov" target="_blank" rel="noopener">released 2026 ratings</a>{' '}
          for 1,202 districts and 9,105 campuses. 24% of both went up. 585 campuses climbed to an A. 85%
          of rated campuses landed at C or better. Austin ISD{' '}
          <a href="https://www.texastribune.org/2026/08/14/austin-isd-ratings-texas-school-takeover-trigger/" target="_blank" rel="noopener">went from a C to a B</a>{' '}
          &mdash; its district score moved from 79 to 81, its A-and-B campuses went from{' '}
          <a href="https://www.statesman.com/news/education/article/austin-isd-state-takeover-webb-burnet-f-22386041.php" target="_blank" rel="noopener">47 to 61</a>, and its
          Title I A-and-B campuses more than doubled, 7 to 16.
        </P>

        <P>
          Austin ISD is also the only district in Texas that just triggered mandatory state intervention.
        </P>

        <Fig caption={<>Source: Austin ISD figures reported by the Austin American-Statesman, August 14, 2026. Title I campuses serve a majority of low-income students.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22All+campuses+rated+A+or+B%22%2C%22Title+I+campuses+rated+A+or+B%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222025%22%2C%22data%22%3A%5B47%2C7%5D%2C%22backgroundColor%22%3A%22%238a8a8a%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%222026%22%2C%22data%22%3A%5B61%2C16%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Austin+ISD+campuses+rated+A+or+B%2C+2025+vs+2026%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Campuses%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Grouped bar chart comparing Austin ISD campuses rated A or B in 2025 and 2026. All campuses rated A or B rose from 47 to 61. Title I campuses rated A or B rose from 7 to 16."
            style={{ width:'100%', height:'auto', display:'block' }}
          />
        </Fig>

        <P>
          Two campuses did it. Burnet and Webb middle schools hit a fifth consecutive F, and{' '}
          <a href="https://statutes.capitol.texas.gov/Docs/ED/htm/ED.39A.htm#39A.111" target="_blank" rel="noopener">Texas Education Code 39A.111</a>{' '}
          gives the commissioner exactly two options: appoint a board of managers over the entire district,
          or close the campus. Not &ldquo;may consider.&rdquo; Shall.
        </P>

        <P>
          Notice what the statute never reads. It never reads the district grade. No average, no weighting,
          no rollup. The district-level B and the campus-level F sit in the same file and only one of them
          is wired to an action. It&rsquo;s a max() over campus streaks, not a mean over campuses.
        </P>

        <H2>The D doesn&rsquo;t do what you think</H2>

        <P>
          Austin went into this year with <em>three</em> middle schools sitting on four consecutive Fs:
          Burnet, Dobie, and Webb. Dobie earned a D. Plenty of coverage read that as Dobie breaking the streak.
        </P>

        <P>
          It didn&rsquo;t. Per{' '}
          <a href="https://tea.texas.gov/school-and-district-leaders/accountability/academic-accountability/performance-reporting/chapter-9-2026-responsibilities-and-consequences-0.pdf" target="_blank" rel="noopener">TEA&rsquo;s own consequences manual</a>,
          only an A, B, or C stops the count. A D <em>pauses</em> it &mdash; and if a campus stacks three Ds,
          the failing streak resumes from where it left off.
        </P>

        <P>
          So Dobie isn&rsquo;t back to zero. Dobie is at four, holding.
        </P>

        <Callout label="The mechanic">
          A, B, or C clears the consecutive-F count. A D pauses it. Three Ds in a chain and the streak
          picks back up. Five is the number that removes local control.
        </Callout>

        <P>
          That is a reset condition with memory, which is a perfectly reasonable thing to build and a
          genuinely rough thing to leave out of every headline written about it. Read only the letters and
          you&rsquo;d think three schools were in trouble and one of them is now fine. What actually happened
          is that one school&rsquo;s counter stopped incrementing.
        </P>

        <H2>None of it is final until December</H2>

        <P>
          Here&rsquo;s the part that would get a pipeline flagged in any design review I&rsquo;ve ever sat
          through. None of these numbers are final. Commissioner Mike Morath said so himself at the
          August 14 press conference:{' '}
          <a href="https://thetexan.news/issues/education/austin-isd-faces-potential-state-takeover-after-two-campuses-receive-fifth-failing-ratings/article_e8900b58-8d9d-4a28-a934-eecfe9984404.html" target="_blank" rel="noopener">these are preliminary ratings</a>.
          Districts get 30 days to appeal, appeals close September 11, a third-party panel spends roughly
          60 days checking the work, and final ratings don&rsquo;t publish until December 11.
        </P>

        <P>
          Four months between the number that made every headline and the number that ends up being true.
          Austin&rsquo;s superintendent has already said he&rsquo;ll likely appeal.
        </P>

        <P>
          Seven Texas districts are currently run by a state-appointed superintendent and board of managers.
          Four of those takeovers landed in the last ten months &mdash; Fort Worth in October, then Beaumont,
          Lake Worth, and Connally in December. Whatever happens in Austin becomes the reference
          implementation, because Texas is the state other states copy.
        </P>

        <Divider />

        <P>
          I don&rsquo;t have an opinion on whether Burnet and Webb should stay open. I&rsquo;ve never been
          inside those buildings and I&rsquo;m not going to pretend a spreadsheet settles it.
        </P>

        <P>
          But I know what it looks like when a system publishes one number and acts on a different one, and
          I know what it costs when the two don&rsquo;t get reconciled for four months. Austin ISD got its
          best grade in years. The grade was never the thing.
        </P>

        <H3>Sources</H3>

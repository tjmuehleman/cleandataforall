        style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
      />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:14, textAlign:'center' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On June 18, 2026, two Hoover Institution researchers &mdash; Joshua Rauh and Gregory Kearney &mdash; built the first tool that can actually answer a first-grade-level school-finance question: where does the money go. The <a href="https://schoolpensionatlas.org/">U.S. School Pension Atlas</a> links pension disclosures to district budgets, district by district, across roughly <a href="https://www.hoover.org/news/hoover-scholars-compile-comprehensive-database-education-worker-pension-shortfalls-across">12,800 school districts and 95 separate state and local retirement systems</a>.
        </P>

        <P>
          The dataset is the story before the findings are. This data always existed. It just lived in three places that never talked to each other &mdash; GASB 67/68 actuarial reports, individual district CAFRs, and NCES fiscal-survey microdata &mdash; reconstructed by hand, state by state, with no shared method. Nobody had linked pension contributions to district budgets, consistently, across all fifty states, until this year.
        </P>

        <H2>What falls out once you connect the tables</H2>

        <P>
          States and localities spent <a href="https://www.hoover.org/news/hoover-scholars-compile-comprehensive-database-education-worker-pension-shortfalls-across">10.6% of associated education expenditures on school-worker pensions in 2023, up 2.1 percentage points since 2015</a>. In Illinois, pension contributions ate nearly 21% of associated spending, and real pension-contribution growth outran real spending growth by 152%. Required employer contributions &mdash; the share of payroll districts must legally set aside, nationally &mdash; <a href="https://www.k12dive.com/news/teacher-pension-debt-spurs-hidden-cuts-for-schools-survey-says/750841/">tripled from 9.3% to 31.7% between 2001 and 2024</a>.
        </P>

        <P>
          Of the $63 billion districts put into pension plans in 2020, <a href="https://www.k12dive.com/news/teacher-pension-debt-spurs-hidden-cuts-for-schools-survey-says/750841/">$45 billion &mdash; seventy-one cents of every dollar &mdash; serviced debt owed to people who don&rsquo;t teach anymore</a>. Only $18 billion bought anything for a kid sitting in a classroom right now.
        </P>

        <Fig caption={<>Source: Education Commission of the States analysis, cited in <a href="https://www.k12dive.com/news/teacher-pension-debt-spurs-hidden-cuts-for-schools-survey-says/750841/">K-12 Dive</a> (June 2025). $63B total district pension contributions, 2020.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Serviced+pension+debt%22%2C%22Benefits+for+current+employees%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B45%2C18%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%238a8a8a%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Of+%2463B+districts+paid+into+pensions+in+2020%2C+most+wasn%27t+for+anyone+teaching+today%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x1%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%24+Billions%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y1%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart: of $63 billion districts paid into pensions in 2020, $45 billion serviced pension debt and $18 billion went to benefits for current employees."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          National per-pupil spending, meanwhile, hit <a href="https://www.census.gov/newsroom/press-releases/2026/school-system-finances.html">$17,619 in FY2024</a> &mdash; an all-time high. Both things are true at once: schools have never spent more, and classrooms have never felt more starved. Pension debt is the variable that reconciles them, and until this year, it was the one nobody could actually see, district by district.
        </P>

        <H2>Three states, one liability, three plays</H2>

        <P>
          The data-guy part of this isn&rsquo;t the math. It&rsquo;s watching three states handle the exact same liability three different ways, in real time, this year.
        </P>

        <P>
          Michigan <a href="https://michiganadvance.com/2025/10/10/new-michigan-school-budget-shifts-more-teacher-pension-costs-to-districts-prompting-pushback/">folded its pension-cost reimbursement into the per-pupil foundation allowance for FY2026</a> &mdash; the same line item that funds lunches and librarians &mdash; so the state can advertise record per-pupil funding ($10,050, up from $9,608) while districts absorb more of a $28 billion pension shortfall through that same number. Not a cut. A relabeling.
        </P>

        <Callout label="Key figure">
          Chicago&rsquo;s Teachers&rsquo; Pension Fund was <a href="https://www.cps.edu/about/finance/budget/budget-2026/pensions-2026/">48.1% funded as of June 2024</a> &mdash; and its unfunded liability still grew $129.5 million, to $13.94 billion, in FY2026, despite a full $1,026.7 million statutory contribution.
        </Callout>

        <P>
          Chicago paid on time, in full, exactly as scheduled &mdash; and still lost ground. That&rsquo;s not mismanagement. That&rsquo;s just what a system less than half funded does to a payment schedule, regardless of how faithfully you make the payment.
        </P>

        <P>
          New York took a third path entirely: this spring it <a href="https://www.edweek.org/policy-politics/new-york-teachers-win-lower-retirement-age-as-lawmakers-pass-pension-reforms/2026/05">lowered the retirement age for thirty-year teachers from 63 to 58</a>, a $557-million-a-year sweetener that makes the promise bigger right as the state is still paying down the last round of promises.
        </P>

        <Divider />

        <P>
          Bury it, service it, or make the promise richer &mdash; that&rsquo;s the whole menu, and every state is running one of those three plays. None of this is really about whether teachers deserve what they were promised. They do, and the people currently owed a pension didn&rsquo;t create the shortfall. It&rsquo;s a story about school finance running for two decades on data infrastructure too fragmented to answer a question a first grader could ask: where did the money go. Now there&rsquo;s an answer, searchable by district. Go look up yours. You will not like the pie chart.
        </P>

      </article>
    </Prose>
  </Container>
);

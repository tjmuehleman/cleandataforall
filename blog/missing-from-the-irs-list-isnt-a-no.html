          {POST.title}
        </h1>

// ==================== Optional hero visual ====================
// Remove this block if the post doesn't have a lead visual.
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 0 56px', maxWidth:900, marginLeft:'auto', marginRight:'auto' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22On+the+IRS+list%22%2C%22Said+they+will+opt+in+%28NY%29%22%2C%22Declined%22%2C%22No+entry+on+Ballotpedia%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22States%22%2C%22data%22%3A%5B30%2C1%2C6%2C13%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23777%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.55%2C%22categoryPercentage%22%3A0.75%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+50+states%2C+sorted+by+what+the+record+actually+says%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A32%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Number+of+states%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
           alt="Horizontal bar chart of the 50 states by status on the federal scholarship tax credit: 30 on the IRS list, 1 said they will opt in (New York), 6 declined, 13 with no entry on Ballotpedia"
           style={{ width:'100%', height:'auto', display:'block' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>
//   <Divider />  (section break)
//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The IRS page was last updated October 22. It has 30 rows on it, Alabama down to Wyoming, and that is the
          whole dataset (<a href="https://www.irs.gov/government-entities/federal-state-local-governments/federal-scholarship-tax-credit-fstc-participating-states" target="_blank" rel="noopener">IRS</a>). Each row is a state whose governor has signed up for the federal scholarship
          tax credit, which pays up to $1,700 per taxpayer ($3,400 joint) starting January 1, 2027. No column for
          &ldquo;declined.&rdquo; No column for &ldquo;thinking about it.&rdquo; No column, period.
        </P>

        <P>
          Which turns the other 20 states into one blob called <em>not on the list</em>. And that blob is lying to you a little.
        </P>

        <H2>Three different blanks</H2>

        <P>
          Ballotpedia does the unglamorous sorting (<a href="https://ballotpedia.org/State_participation_in_the_federal_K-12_education_tax_credit_program" target="_blank" rel="noopener">Ballotpedia</a>). As I read the page: six states have said no
          (Arizona, Hawaii, Minnesota, New Mexico, Oregon, Wisconsin). New York&rsquo;s governor has said she will opt in
          once she&rsquo;s reviewed the regulations, so it&rsquo;s a yes that hasn&rsquo;t made the list yet. That leaves
          13 states with no entry at all, including California, Illinois, Massachusetts and Pennsylvania. Thirty plus one
          plus six plus thirteen is fifty. Only six of the twenty absent states are actual no&rsquo;s.
        </P>

        <H2>Arizona has the receipts</H2>

        <P>
          Arizona is the cleanest &ldquo;no&rdquo; on the board, and also the weirdest one. It runs the oldest operating
          tax-credit scholarship program in America, enacted in 1997 (<a href="https://www.edchoice.org/school-choice/programs/arizona-original-individual-income-tax-credit-scholarship-program/" target="_blank" rel="noopener">EdChoice</a>). Gov. Katie Hobbs vetoed
          participation bills on January 16, April 13 and May 5 (<a href="https://ballotpedia.org/State_participation_in_the_federal_K-12_education_tax_credit_program" target="_blank" rel="noopener">Ballotpedia</a>). A state that has been doing this
          for 29 years, three times declining to join the federal version. That is a decision, and the data shows it.
        </P>

        <H2>Colorado shows up as a yes</H2>

        <P>
          Gov. Jared Polis announced Colorado&rsquo;s participation on January 29, at a gathering of school-choice
          advocates (<a href="https://www.cpr.org/2026/01/29/colorado-tax-credit-federal-voucher-program/" target="_blank" rel="noopener">CPR</a>). Colorado voters had rejected Amendment 80, the school-choice constitutional
          amendment, in November 2024 (<a href="https://www.cpr.org/2024/11/05/amendment-80-school-choice-results/" target="_blank" rel="noopener">CPR</a>). On the list, those two facts look identical to Utah&rsquo;s
          yes. Nothing on the page tells you one state is following a long tradition and the other is going against a
          recent vote.
        </P>

        <H2>Pennsylvania is a blank cell</H2>

        <P>
          Ballotpedia&rsquo;s page doesn&rsquo;t mention Pennsylvania. The news does. On October 15, Chalkbeat reported
          Gov. Josh Shapiro open to opting in but undecided, saying &ldquo;in the next few weeks, we&rsquo;ll make our
          announcement.&rdquo; Governors have until January 1, 2027 (<a href="https://www.chalkbeat.org/philadelphia/2026/10/15/shapiro-facing-pressure-to-opt-in-to-trump-education-tax-credit-program/" target="_blank" rel="noopener">Chalkbeat</a>). So the biggest swing on the
          map is, for any tracker built on a list, a state with no row. It&rsquo;s not a no or a yes. It&rsquo;s nothing.
        </P>

        <Divider />

        <P>
          A list that only records yeses will always make the country look more decided than it is. Anyone who has
          tried to count the zeros in a spreadsheet and found out half of them were blanks already knows that.
        </P>

      </article>
    </Prose>
  </Container>
);

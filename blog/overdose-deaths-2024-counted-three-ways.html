// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;

const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Three different government documents will tell you how many Americans
          died from a drug overdose in 2024. They do not agree.
        </P>

        <P>
          CDC’s final mortality file puts it at <a href="https://www.cdc.gov/nchs/products/databriefs/db549.htm">79,384</a>.
          The provisional count CDC published in May 2025 said <a href="https://www.cdc.gov/nchs/pressroom/releases/20250514.html">80,391</a>.
          The provisional count CDC published a year later, in May 2026, said <a href="https://www.cdc.gov/nchs/pressroom/releases/20260513.html">81,313</a>.
          Same agency. Same year of deaths. Almost 2,000 people between the highest
          answer and the lowest.
        </P>

        <P>
          Before I get data-nerdy about that, the headline — because this is the
          rare post here with good news buried in it. The decline is real, and it’s
          the best trend line in American public health right now. Overdose deaths fell
          from a provisional <a href="https://www.cdc.gov/nchs/pressroom/releases/20250514.html">110,037 in 2023</a> to
          a provisional <a href="https://www.cdc.gov/nchs/pressroom/releases/20260513.html">69,973 in 2025</a> — a third
          straight year down, pulling the count back to roughly its 2019 level (about
          <a href="https://www.cdc.gov/nchs/products/databriefs/db549.htm">70,630</a> that year).
          That’s on the order of 40,000 fewer deaths a year. I’m not here to dampen
          that. I’m here about the word <em>provisional</em>.
        </P>

        <H2>The number is an estimate that hasn’t finished moving</H2>

        <P>
          Every overdose figure you’ve seen for 2025 is a 12-month-ending count that
          CDC publishes every month, with a “predicted” component bolted on to patch
          the fact that death certificates arrive late and toxicology takes time
          (<a href="https://www.cdc.gov/nchs/nvss/vsrr/drug-overdose-data.htm">that’s the VSRR series</a>).
          It is, by design, a draft. And you don’t have to take my word that it’ll move.
          Watch what already happened to 2024: reported at 80,391, then revised up to 81,313,
          then finalized at 79,384 — with the final number landing <em>lower</em> than both
          provisional ones.
        </P>

        <P>
          That’s not CDC getting it wrong. That’s the system working the way it’s built —
          late certificates, jurisdiction-by-jurisdiction toxicology, a “predicted” patch that
          runs a little hot and then settles. Even with all of that,
          <a href="https://www.cdc.gov/nchs/products/databriefs/db549.htm"> 96% of 2024’s overdose deaths</a> named
          the specific drug involved. The number isn’t sloppy. It’s unfinished.
        </P>

        <figure style={{ margin:'2.5em auto', maxWidth:900, textAlign:'center' }}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Final+NVSS+%28Jan+2026%29%22%2C%22Provisional+%28May+2025%29%22%2C%22Provisional+%28May+2026%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222024+overdose+deaths%22%2C%22data%22%3A%5B79384%2C80391%2C81313%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23bbb%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+same+year%2C+counted+three+times%3A+2024+overdose+deaths%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A75000%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Reported+deaths%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=360&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart showing 2024 U.S. overdose deaths counted three ways: final NVSS 79,384, provisional as of May 2025 80,391, provisional as of May 2026 81,313." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
          <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
            The same year of deaths, as counted by three CDC products. Spread between high and low: 1,929. Sources: <a href="https://www.cdc.gov/nchs/products/databriefs/db549.htm">NCHS Data Brief 549</a>, <a href="https://www.cdc.gov/nchs/pressroom/releases/20250514.html">NCHS May 2025</a>, <a href="https://www.cdc.gov/nchs/pressroom/releases/20260513.html">NCHS May 2026</a>.
          </figcaption>
        </figure>

        <H2>The part that matters only shows up in the final data</H2>

        <P>
          Here’s the catch with a provisional count: it’s a single national number. It
          can’t tell you <em>who</em>. For that you need the final file, and the final file
          has the real story. From 2023 to 2024 the overdose death rate fell for every
          racial and ethnic group CDC tracks — but it fell hardest for Black Americans,
          <a href="https://www.cdc.gov/nchs/products/databriefs/db549.htm">down 30.9%</a>, from
          48.9 to 33.8 deaths per 100,000. That begins to close a gap fentanyl had just
          pried open.
        </P>

        <figure style={{ margin:'2.5em auto', maxWidth:900, textAlign:'center' }}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Amer.+Indian%2FAK+Native%22%2C%22Black%22%2C%22White%22%2C%22Native+Haw.%2FPac.+Isl.%22%2C%22Hispanic%22%2C%22Asian%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222023%22%2C%22data%22%3A%5B65.0%2C48.9%2C33.1%2C26.2%2C22.8%2C5.1%5D%2C%22backgroundColor%22%3A%22%23bbb%22%7D%2C%7B%22label%22%3A%222024%22%2C%22data%22%3A%5B51.6%2C33.8%2C24.7%2C20.5%2C17.0%2C4.4%5D%2C%22backgroundColor%22%3A%22%23141210%22%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Atrue%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Overdose+death+rate+by+race%2Fethnicity%2C+2023+%5Cu2192+2024%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Age-adjusted+deaths+per+100%2C000%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2" alt="Grouped horizontal bar chart of age-adjusted overdose death rates per 100,000 by race and ethnicity in 2023 versus 2024. American Indian and Alaska Native 65.0 to 51.6. Black 48.9 to 33.8. White 33.1 to 24.7. Native Hawaiian or Pacific Islander 26.2 to 20.5. Hispanic 22.8 to 17.0. Asian 5.1 to 4.4." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
          <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
            Age-adjusted overdose death rate by race and Hispanic origin, 2023 → 2024. Source: <a href="https://www.cdc.gov/nchs/products/databriefs/db549.htm">CDC NCHS Data Brief 549</a>.
          </figcaption>
        </figure>

        <P>
          And then the line that should bug you. The group with the highest overdose
          rate — American Indian and Alaska Native people, 65.0 falling to 51.6 — is also
          the group whose deaths get undercounted the most. CDC’s own footnote: race
          misclassification on death certificates understates the AIAN rate by
          <a href="https://www.cdc.gov/nchs/products/databriefs/db549.htm">about 34%</a>.
          So the worst number on the chart is also the most understated one on the chart.
          We’re measuring the frontier of this crisis with a ruler we already know is short.
        </P>

        <Divider />

        <P>
          The good news survives all of it. Roughly 40,000 fewer Americans died in 2025
          than two years earlier, and that’s true whether 2024’s real total was 79,384 or
          81,313. “About 40,000” is the honest way to say it. Anyone who quotes you the
          exact figure, to the person, is reading a draft and calling it a fact.
        </P>

      </article>

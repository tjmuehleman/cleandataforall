const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Maryland identifies <a href="https://www.advancedequity.org/briefs/gt-rates" target="_blank" rel="noopener">19.33% of its public school students</a> as gifted and talented. West Virginia identifies 1.98%. Nearly ten to one, across a state line you can drive over before lunch.
        </P>

        <P>
          That gap is not a finding about kids. It&rsquo;s a finding about administrative law. There is no federal definition of &ldquo;gifted&rdquo; and no federal rules for how these programs get run, so <a href="https://www.advancedequity.org/briefs/gt-rates" target="_blank" rel="noopener">every state writes its own policy</a> and plenty of them hand the writing down to the district. The number that comes out the far end is the count of children somebody decided to label.
        </P>

        <P>
          Fine. Predictable, even. Here&rsquo;s the part I keep going back to.
        </P>

        <H2>Look at who&rsquo;s missing</H2>

        <P>
          The bottom five in that chart are West Virginia, Hawaii, Kansas, Tennessee, and Pennsylvania. Now name the state you&rsquo;d expect to be down there. Massachusetts, which <a href="https://www.mass.gov/news/massachusetts-ranks-1-in-national-education-assessment" target="_blank" rel="noopener">posted the highest numeric score of any state on all four 2024 NAEP tests</a> &mdash; fourth and eighth grade, reading and math, clean sweep &mdash; and where a gifted program is close to a rumor.
        </P>

        <P>
          Massachusetts isn&rsquo;t in the bottom five. It isn&rsquo;t in the top five either. If you assumed a state&rsquo;s gifted rate tracks anything at all about how its students actually do, that should be the first thing on this chart that bothers you.
        </P>

        <P>
          Then there&rsquo;s the note at the end of the analysis, which is where I spend most of my life:
        </P>

        <BQ cite="AdvancED Equity, notes to the brief">
          We exclude all school districts that report zero overall enrollment in Gifted and Talented Programs from our analytical sample.
        </BQ>

        <P>
          That is a completely defensible methodological call. A rate needs a denominator of students who could plausibly have been labeled, and a district with no program never had a shot. But run it in a state where the program barely exists and you&rsquo;ve quietly rebuilt the state out of its exceptions. Fordham counted this back in 2018: a gifted program existed in about <a href="https://fordhaminstitute.org/ohio/commentary/massachusetts-failing-its-smartest-students-color" target="_blank" rel="noopener">one of every twenty Massachusetts elementary and middle schools</a>, lower than everywhere but Rhode Island and Vermont, against <a href="https://fordhaminstitute.org/national/research/there-gifted-gap-gifted-education-high-poverty-schools" target="_blank" rel="noopener">more than two-thirds of schools nationally</a>. Drop the zeros there and what&rsquo;s left of the state is the handful of districts that run something.
        </P>

        <P>
          Which means the published rate answers a narrower question than the one people read off it. Not &ldquo;what share of this state&rsquo;s children are called gifted,&rdquo; but &ldquo;what share of children are called gifted in the districts of this state that call anyone gifted.&rdquo; Those are the same sentence in a state like Maryland. They are very different sentences in a state where nineteen schools in twenty never open the question. The filter runs before the ranking, and the ranking is what gets quoted.
        </P>

        <Divider />

        <H2>The control that makes it</H2>

        <Fig caption={<>Source: <a href="https://www.advancedequity.org/briefs/gt-rates" target="_blank" rel="noopener">AdvancED Equity</a>, CRDC 2021&ndash;22 (state rates) and CRDC + NCES Common Core of Data 2021&ndash;22 (urbanicity). Spreads are arithmetic: 8.9 &minus; 7.6 = 1.3; 19.33 &minus; 1.98 = 17.35.</>}>
          <img
            src={CHART_GEO}
            alt="Bar chart comparing gifted identification rates across community types (rural 7.6 percent, urban 8.6 percent, suburban 8.9 percent) against Maryland at 19.33 percent and West Virginia at 1.98 percent."
            style={{ display:'block', width:'100%', height:'auto' }}
          />
        </Fig>

        <P>
          Across the whole country, <a href="https://www.advancedequity.org/briefs/gt-rates" target="_blank" rel="noopener">rural districts identify 7.6% of students, urban districts 8.6%, suburban districts 8.9%</a>. That is 1.3 points of total spread between the kinds of places Americans actually live. A state line moves the same number by 17.35. Whatever is driving the gifted rate, it is not the neighborhood.
        </P>

        <Callout label="Key figure">
          19.33% (Maryland) versus 1.98% (West Virginia). Same federal collection, same school year, 17.35 points apart.
        </Callout>

        <P>
          And inside every one of those community types, the same pattern: Black, Hispanic, Native American, and multiracial students get identified below White students&rsquo; rates, in every urbanicity category and in every CRDC wave back to 2011&ndash;12. That&rsquo;s a referral gap, not an ability gap. Same kids, differently noticed.
        </P>

        <P>
          Two things stay true at once. The label is mostly a product of statute. The label still decides who gets the harder class.
        </P>

        <Divider />

        <P>
          Somewhere outside Boston there&rsquo;s a kid who&rsquo;d be labeled gifted in Baltimore. Nothing in the file about her is wrong. There&rsquo;s just nothing in the file.
        </P>

      </article>
    </Prose>
  </Container>
);

      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here’s a number I did not expect to type this year: in 2024, Africa passed Europe on the HPV vaccine.
        </P>

        <P>
          First-dose coverage among girls across Gavi-supported African countries reached <a href="https://www.gavi.org/news/media-room/cervical-cancer-vaccines-save-over-1-million-lives-lower-income-countries" target="_blank" rel="noopener">44% by the end of 2024</a>, surpassing Europe at 38%. The continent that carries the heaviest cervical-cancer burden is now vaccinating a bigger share of its girls than the continent that started fifteen years earlier and then plateaued.
        </P>

        <P>
          Back up ten years and the climb is the whole story. When Gavi launched its HPV program in 2014, African coverage was <a href="https://www.gavi.org/news/media-room/cervical-cancer-vaccines-save-over-1-million-lives-lower-income-countries" target="_blank" rel="noopener">4%</a>. By the end of 2022 it was 15%. Two years after that, 44%. That’s not a trend line. That’s a hockey stick. And it’s the good kind — the places doing the fastest catching-up are exactly the places that needed it most, since lower-income countries absorb <a href="https://www.gavi.org/news/media-room/cervical-cancer-vaccines-save-over-1-million-lives-lower-income-countries" target="_blank" rel="noopener">90% of the 350,000</a> cervical-cancer deaths recorded in 2022.
        </P>

        <H2>Then I put on the data hat</H2>

        <P>
          Every one of those numbers has a footnote. Literally. The Gavi release that reported them carries a line at the bottom: the figures are “based on preliminary data, to be confirmed by the official release of WHO/UNICEF HPV coverage data in July 2026.” WHO’s <a href="https://www.who.int/news/item/17-11-2025-world-marks-cervical-cancer-elimination-day-as-countries-accelerate-action" target="_blank" rel="noopener">own announcement</a> says the same thing in plainer words — the celebrated 86 million girls is an estimate, and the verified count “will be released in July 2026.”
        </P>

        <P>
          There are two kinds of vaccine coverage numbers, and they are not the same animal. One is program-reported: what campaigns and ministries tally up as they go. The other is WUENIC — the WHO/UNICEF Estimates of National Immunization Coverage, the annual scrub that reconciles those tallies against surveys and catches the double-counts, the shaky denominators, the campaign math that flatters itself. The 44% is the first kind. The second kind lands this month.
        </P>

        <Fig caption={<>Source: Gavi, the Vaccine Alliance, 17 Nov 2025. Coverage across all Gavi-supported countries; both values preliminary, pending WHO/UNICEF verification due July 2026.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222022%22%2C%222024%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22HPV+coverage+across+all+Gavi-supported+countries+%28%25%29%22%2C%22data%22%3A%5B8%2C25%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Coverage+across+all+Gavi-supported+countries%2C+2022+to+2024%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A30%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Coverage+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of HPV coverage across all Gavi-supported countries: 8% in 2022, 25% in 2024." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <H2>Why the gap is worth naming</H2>

        <P>
          The 44% overtake, the 86 million girls, the <a href="https://www.gavi.org/news/media-room/cervical-cancer-vaccines-save-over-1-million-lives-lower-income-countries" target="_blank" rel="noopener">1.4 million future deaths prevented</a> — all of it rests on program data collected mid-sprint, during the biggest HPV push the program has ever run, with more than 50 countries introducing the vaccine at once. Campaign years are exactly when administrative coverage runs hot. Mass campaigns count doses out the door; the denominator, meaning how many girls actually live in the target age band, is a guess stranded between censuses; and the shift to a <a href="https://www.who.int/news/item/20-12-2022-WHO-updates-recommendations-on-HPV-vaccination-schedule" target="_blank" rel="noopener">single-dose schedule in 2022</a> quietly changed what “covered” even means, mid-count.
        </P>

        <P>
          None of that makes 44% wrong. It makes it unaudited. The honest sentence isn’t “Africa passed Europe.” It’s “Africa’s program data says it passed Europe, and we find out in a few weeks whether the scrub agrees.”
        </P>

        <Divider />

        <P>
          So mark it in pencil. The vaccine is real — <a href="https://www.gavi.org/news/media-room/cervical-cancer-vaccines-save-over-1-million-lives-lower-income-countries" target="_blank" rel="noopener">$2.90 a dose</a> in these countries, where it used to run $100 or more. The campaign is real. The reversal is plausible, maybe even likely. But 44% is still wearing an asterisk, and the footnote says the asterisk comes off in July 2026. It’s July 2026. Ask me again in a few weeks.
        </P>

      </article>
    </Prose>
  </Container>
);

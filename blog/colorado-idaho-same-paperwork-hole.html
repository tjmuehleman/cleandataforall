const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Idaho’s kindergarten vaccine exemption rate is <strong>17.5%</strong>. Colorado’s is <strong>4.7%</strong>.
          One of those is the number that gets written about. If you read anything about CDC’s{' '}
          <a href="https://www.cdc.gov/schoolvaxview/data/index.html">August 17 release</a> you already know which one.
        </P>

        <P>
          Now do the subtraction. Idaho’s MMR coverage is 75.2%, so 24.8% of Idaho kindergartners are
          not up to date. Pull out the 17.5 points of exemptions and 7.3 points are still sitting there.
          Colorado’s coverage is 87.7% — 12.3% not up to date — minus 4.7 points of exemptions, leaves 7.6.
        </P>

        <P>
          Colorado’s hole is bigger than Idaho’s. Colorado files roughly a quarter as many exemptions.
        </P>

        <H2>Two maps, not one</H2>

        <P>
          I ran that subtraction across all 51 jurisdictions in the{' '}
          <a href="https://data.cdc.gov/Vaccinations/Vaccination-Coverage-and-Exemptions-among-Kinderga/ijqb-a7ye">CDC state file</a>. Correlation between a state’s exemption rate and its
          leftover — kids not up to date, no exemption on file — comes out to <strong>0.10</strong>.
          That’s a scatter plot with no line in it. Kentucky files exemptions at 2.6% and has a 6.3-point
          leftover. Utah files at 12.7% and has a leftover of 0.1. There is no relationship. There are two
          different problems wearing the same headline, and only one of them has a legislature arguing about it.
        </P>

        <Callout label="How the leftover is computed">
          (100 − MMR coverage) − any-exemption rate, per jurisdiction, from CDC’s published 2025–26 table.
          It’s a floor, not a count: the exemption rate covers any required vaccine, not MMR specifically,
          so it over-subtracts. Oregon comes out at −0.6, which is the arithmetic telling you it’s dirty.
        </Callout>

        <H2>The line that never moves</H2>

        <P>
          Here’s the part that surprised me. The leftover isn’t new and it isn’t growing.
        </P>

        <Fig caption={<>US kindergartners not up to date on MMR, split by whether an exemption was filed. Exempt share and MMR coverage both from CDC SchoolVaxView; the no-exemption segment is (100 − coverage) − exemption rate. 2019–20 through 2025–26.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222019-20%22%2C%222020-21%22%2C%222021-22%22%2C%222022-23%22%2C%222023-24%22%2C%222024-25%22%2C%222025-26%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22No+exemption+on+file%22%2C%22data%22%3A%5B2.3%2C3.9%2C4.4%2C3.9%2C4.0%2C3.9%2C3.4%5D%2C%22backgroundColor%22%3A%22%23141210%22%7D%2C%7B%22label%22%3A%22Exemption+on+file%22%2C%22data%22%3A%5B2.5%2C2.2%2C2.6%2C3.0%2C3.3%2C3.6%2C4.2%5D%2C%22backgroundColor%22%3A%22%239a938a%22%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22position%22%3A%22top%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%2C%22boxWidth%22%3A14%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22US+kindergartners+not+up+to+date+on+MMR+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22stacked%22%3Atrue%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22stacked%22%3Atrue%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A8%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+kindergartners%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Stacked bars by school year from 2019-20 to 2025-26 showing the exempt and non-exempt components of kindergartners not up to date on MMR."
            style={{ display:'block', width:'100%', height:'auto' }} />
        </Fig>

        <P>
          Since 2019–20 the exempt half went 2.5 → 4.2. The other half went 2.3 → 3.4, peaked at 4.4 in
          2021–22, and has otherwise parked between 3.4 and 4.4 for six straight years. Every year some
          reporter charts the top segment climbing and nobody charts the bottom one, because the bottom one
          doesn’t do anything. It just sits there being three and a half percent of every kindergarten class
          in America.
        </P>

        <P>
          Stable is not the same as small. But a number that never moves gets no story, no bill, and no owner.
        </P>

        <H2>CDC already built the metric</H2>

        <P>
          This isn’t some clever outsider recompute. CDC has a name for it. In the{' '}
          <a href="https://www.cdc.gov/mmwr/volumes/73/wr/mm7341a3.htm">2023–24 MMWR</a> they define <em>potentially achievable coverage</em> as
          up-to-date kids plus not-up-to-date-but-nonexempt kids, and they put the national figure at
          <strong> 96.8%</strong>. Run the same arithmetic on the 2025–26 numbers and you land around 95.8%.
          Still above the 95% target, on paper, with zero minds changed.
        </P>

        <P>
          Forty jurisdictions are below 95% MMR coverage right now. Sixteen of them have exemption rates low
          enough that they could clear 95% on paperwork alone — Colorado, Kentucky, Indiana, Iowa, Louisiana,
          Virginia, Tennessee, DC, and eight more. Nobody has to be persuaded of anything. A registrar has to
          close a file.
        </P>

        <H2>And the paperwork half is the half we measure worst</H2>

        <P>
          The 2023–24 report is unusually candid about its own coverage. Exemption estimates were built from
          97.0% of enrolled kindergartners. Vaccination coverage, 93.1%. Grace period and provisional
          enrollment — the actual mechanism behind the leftover — <strong>71.9%</strong>, reported by only
          31 states. Where states did report it, provisional or grace-period attendance ran 2.6%,
          from 0.3% in Delaware to 8.0% in Arkansas.
        </P>

        <P>
          So the thing that generates headlines is measured on 97% of the kids, and the thing that explains
          almost half the gap is measured on 72% of them, by three-fifths of the states. That’s not a CDC
          failure. It’s what happens when a data system gets built around the question people were asking
          fifteen years ago.
        </P>

        <Divider />

        <P>
          Every August the exemption number goes up and the coverage number goes down and everybody writes
          the same piece. Underneath it, unmoved since before the pandemic, are about three and a half points
          of five-year-olds whose parents didn’t object to anything. They’re in the grace period. Their
          records didn’t transfer. Somebody’s fax machine ate it.
        </P>

        <P>
          That’s not a debate. That’s a queue.
        </P>

        <H2>Sources</H2>

        <UL items={[
          <><a href="https://www.cdc.gov/schoolvaxview/data/index.html">CDC SchoolVaxView — Vaccination Coverage and Exemptions among Kindergartners</a>, updated August 17, 2026 (4.2% exemptions, up from 3.6%; MMR coverage 92.4%; ~155,000 exempt; ~280,000 without MMR documentation).</>,
          <><a href="https://data.cdc.gov/Vaccinations/Vaccination-Coverage-and-Exemptions-among-Kinderga/ijqb-a7ye">CDC, Vaccination Coverage and Exemptions among Kindergartners — state-level data file</a> (per-state MMR coverage and any-exemption rates, 2009–10 through 2025–26; all state figures and the 0.10 correlation are computed from this file).</>,
          <><a href="https://www.cdc.gov/mmwr/volumes/73/wr/mm7341a3.htm">MMWR, Coverage with Selected Vaccines and Exemption Rates Among Children in Kindergarten — United States, 2023–24 School Year</a> (definition and national value of potentially achievable coverage, 96.8%; reporting completeness of 97.0% / 93.1% / 71.9%; 31 states reporting grace period or provisional enrollment; 2.6% national, Delaware 0.3% to Arkansas 8.0%).</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

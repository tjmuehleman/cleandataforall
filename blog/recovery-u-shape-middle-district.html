const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The fourth <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Education Scorecard from Harvard, Stanford, and Dartmouth landed May 13</a>. The lead finding isn&rsquo;t an average. It&rsquo;s a binning choice.
        </P>

        <P>
          Sort the country&rsquo;s school districts by the share of kids on federally subsidized lunch, and the recovery curve grows a hole in the middle. The <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">highest-income districts (under 30% subsidized lunch) and the lowest-income districts (over 70%) have improved most since 2022</a>. The middle 30&ndash;70% &mdash; the actual American median district &mdash; has barely moved.
        </P>

        <P>
          I run a data company. The thing I keep staring at is what happens when the same number, plotted two different ways, tells two different stories.
        </P>

        <H2>The shape is the methodology</H2>

        <P>
          The Scorecard links state tests for <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">roughly 35 million U.S. grade 3&ndash;8 students between 2022 and 2025</a> onto a common national scale. Average that into one line and you get the headline most outlets have been running for two years: math is back, reading is finally turning the corner in 2025. Cut into deciles by lunch-subsidy share, the same 35 million kids draw a U.
        </P>

        <P>
          The two ends are recovering for opposite reasons. The lowest-income districts got <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">the bulk of federal ESSER relief; without it, the report estimates the average high-poverty district would still be at its 2022 level of achievement</a>. The highest-income districts had the financial and social capital to recover on their own. The middle had less ESSER (because formula) and less endowment (because middle) and got the smallest share of either side&rsquo;s tailwind.
        </P>

        <P>
          A national average can absorb that. A decile bin can&rsquo;t.
        </P>

        <H2>The state scoreboard rhymes</H2>

        <P>
          The Scorecard also bins by policy. Of the <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">38 states plus DC in the analysis, eight improved in reading between 2022 and 2025: DC, Indiana, Kentucky, Maryland, Minnesota, Mississippi, Louisiana, and Tennessee</a>. All of them were <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">implementing comprehensive science-of-reading reforms as of January 2024</a>. The ten states that <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">had refused those reforms by the same date &mdash; California, Georgia, Hawaii, Massachusetts, New Hampshire, New Jersey, Rhode Island, South Dakota, Washington, Wisconsin &mdash; none of them improved</a>.
        </P>

        <P>
          Then the inconvenient row: <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Arizona, Florida, and Nebraska were implementing multiple elements of those reforms and have yet to turn around</a>. The law on paper is not the same as the implementation depth in classrooms. The data, as ever, has the better view.
        </P>

        <H2>The headwind has a percentage</H2>

        <Fig caption={<>Source: <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Harvard GSE on the May 2026 Education Scorecard</a>. The pre-pandemic baseline is the rate the report compares to; 2024&ndash;25 is the latest reading.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Pre-pandemic+baseline%22%2C%222024-25+%28Scorecard%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Chronic+absenteeism+rate+%28%25%29%22%2C%22data%22%3A%5B15%2C23%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Chronic+absenteeism+is+down+from+the+peak.+Still+8+points+above+pre-pandemic.%22%2C%22fontSize%22%3A14%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A14%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A8%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%2C%22min%22%3A0%2C%22max%22%3A30%2C%22stepSize%22%3A5%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Chronic+absenteeism+rate+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2" alt="Bar chart comparing pre-pandemic chronic absenteeism rate of 15 percent against the 2024-25 rate of 23 percent" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          The Scorecard also names what&rsquo;s slowing every income bucket down: kids aren&rsquo;t in school. <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">23% of students were chronically absent in 2024&ndash;25, down from the post-pandemic peak but still above the 15% the country averaged pre-pandemic</a>. If absence rates returned to pre-pandemic levels, the report estimates <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">the recovery would have been 0.03&ndash;0.05 grade equivalents larger at every income level</a>.
        </P>

        <P>
          Bigger everywhere. The middle 30&ndash;70% would still be the bottom of the U.
        </P>

        <H2>The 108 are a dataset, not a list</H2>

        <P>
          The most actionable thing in the report is a roster. The Scorecard names <a href="https://educationscorecard.org/districts-on-the-rise/">108 &ldquo;Districts on the Rise&rdquo;</a> &mdash; districts of more than 1,200 grade 3&ndash;8 students that <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">gained at least 0.3 grade levels in both reading and math between 2022 and 2025, and between 2019 and 2025, against matched peers in their own state with similar size, demographics, and urbanicity</a>. Districts with large enrollment or demographic shifts were screened out so that the gain reflects instruction, not the kids in the seats changing.
        </P>

        <P>
          The matching is the data work. The roster is the asset.
        </P>

        <Callout label="The receipt">
          35 million kids, grades 3&ndash;8, 2022&ndash;2025. 38 states + DC in the analysis. 8 improved in reading. 10 didn&rsquo;t. 23% chronically absent vs. 15% pre-pandemic. 108 &ldquo;Districts on the Rise.&rdquo; Source: <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Harvard GSE on the May 2026 Education Scorecard</a>.
        </Callout>

        <H2>The recession started a decade before the pandemic</H2>

        <P>
          One more binning point worth standing on. The &ldquo;learning recession&rdquo; <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">started in 2013</a> &mdash; seven years before COVID. <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">In reading, the average annual loss between 2017 and 2019 was as large as the loss sustained during the pandemic itself</a>. <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Grade 8 NAEP reading scores are at their lowest since 1990. Grade 4 scores are at pre-2003 levels.</a>
        </P>

        <BQ cite="Tom Kane, Harvard CEPR, May 13, 2026">
          The pandemic was the mudslide that followed seven years of erosion in student achievement.
        </BQ>

        <P>
          A national average could absorb every one of those years and still report &ldquo;the recovery is underway.&rdquo; A decile bin can&rsquo;t. The 2026 Scorecard is the first time the middle of the country shows up as the thing the headline missed.
        </P>

        <Divider />

        <P>
          The chart everyone has been reading for two years is the average of 35 million kids. The chart the Scorecard just published is the same number, sorted.
        </P>

        <P>
          The American median district is now visible. It&rsquo;s at the bottom of the U.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

        <H3>Sources</H3>

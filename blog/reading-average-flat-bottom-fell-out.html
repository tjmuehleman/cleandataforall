const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On September 8 the headline wrote itself: U.S. reading down 14 points. <a href="https://www.k12dive.com/news/from-science-to-screen-time-4-key-takeaways-from-the-latest-pisa-results/829867/">Seven months of lost learning</a>, per the Education Secretary. Every outlet ran the same number.
        </P>

        <P>
          Here&rsquo;s the number nobody ran. The U.S. average reading score in 2000 was 504. In 2025 it&rsquo;s 490. NCES says those two are <a href="https://nces.ed.gov/surveys/pisa/pisa2025/pdf/PISA2025_compiled.pdf">not significantly different</a> &mdash; a 15-point drop carrying a standard error of 11 doesn&rsquo;t clear the bar. Twenty-five years of American education reform and the mean is roughly where we left it.
        </P>

        <P>
          The mean is lying. Not on purpose. It&rsquo;s just the one number the press release hands you, and it&rsquo;s the worst possible summary of this particular dataset.
        </P>

        <H2>Look at the ends instead</H2>

        <P>
          That chart up top is the whole piece. Since 2015 the U.S. 90th percentile in reading went from 624 to <a href="https://nces.ed.gov/surveys/pisa/pisa2025/pdf/PISA2025_compiled.pdf">644</a>. It went <em>up</em>. The 10th percentile went from 364 to 332. That&rsquo;s not a dip. That&rsquo;s a fall off a table, and it has fallen in every single cycle since: 364, 361, 356, 332.
        </P>

        <P>
          Two groups moving in opposite directions at roughly the same speed produce an average that looks almost boring. That&rsquo;s the entire trick.
        </P>

        <H2>The spread has a shape, and it&rsquo;s a U</H2>

        <P>
          OECD publishes the inter-decile range &mdash; 90th minus 10th &mdash; back to 2000. For the U.S.: 273 in 2000, down to 235 in 2012, then 259, 282, 292, and now <a href="https://stat.link/mrq53f">312</a>.
        </P>

        <Fig caption={<>U.S. reading inter-decile range by PISA cycle, rounded from <a href="https://stat.link/mrq53f">OECD Table I.B1.2a.43</a>. The 2006 cycle is blank because the U.S. reading figure in that table is marked <em>m</em> &mdash; not available. Nobody has backfilled it in twenty years.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222000%22%2C%222003%22%2C%222006%22%2C%222009%22%2C%222012%22%2C%222015%22%2C%222018%22%2C%222022%22%2C%222025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%2290th+minus+10th+percentile%2C+U.S.+reading%22%2C%22data%22%3A%5B273%2C261%2Cnull%2C253%2C235%2C259%2C282%2C292%2C312%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%235a5a5a%22%2C%22%233a3a3a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%2C%22barPercentage%22%3A0.55%2C%22categoryPercentage%22%3A0.75%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+U.S.+reading+spread%2C+2000-2025+%282006%3A+no+data%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A340%2C%22stepSize%22%3A50%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Score+points+between+P90+and+P10%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of the gap between the 90th and 10th percentile U.S. PISA reading scores by cycle. 2000 is 273, 2003 is 261, 2006 has no data, 2009 is 253, 2012 is 235, 2015 is 259, 2018 is 282, 2022 is 292, and 2025 is 312."
            style={{ display:'block', width:'100%', maxWidth:760, height:'auto' }} />
        </Fig>

        <P>
          The American reading distribution tightened for twelve years and has been coming apart for thirteen. Whatever was narrowing it quit working around 2012, which is roughly what Andreas Schleicher, who built PISA, said out loud on the call.
        </P>

        <BQ cite="Andreas Schleicher, OECD, Sept. 8, 2026">
          If you&rsquo;re honest, this decline started much earlier and it continues. So the pandemic is not a compelling explanation.
        </BQ>

        <H2>About that superlative</H2>

        <P>
          NCES says the U.S. now has <a href="https://nces.ed.gov/surveys/pisa/pisa2025/pdf/PISA2025_compiled.pdf">the largest 90th&ndash;10th reading gap</a> of any participating education system. True, as a point estimate. 312, with Sweden behind it at 304.
        </P>

        <P>
          Also from NCES, a few pages later: that gap is &ldquo;larger than the gap in 83 education systems and not significantly different from the gap in 6.&rdquo; So it&rsquo;s a first-place finish with six other countries standing on the podium, on a measurement carrying a standard error of 8.45.
        </P>

        <P>
          The OECD, for its part, never makes the reading claim at all. Its <a href="https://www.oecd.org/en/publications/pisa-2025-results-volume-i_73451bc5-en/full-report/student-performance-in-pisa-2025_23e075c2.html">only &ldquo;largest gap&rdquo; sentence</a> is about science, and it names Luxembourg first.
        </P>

        <P>
          Nobody lied here. Somebody sorted a column descending and read row one. We all do it. It&rsquo;s just that on the way from the spreadsheet to the microphone, the error bars fall off.
        </P>

        <Callout label="In the fine print">
          The U.S. estimates this cycle carry an <a href="https://www.oecd.org/content/dam/oecd/en/publications/support-materials/2026/09/pisa-2025-results-volume-i_5265bfb1/PISA%202025%20Insights%20and%20Interpretations.pdf">OECD asterisk</a> &mdash; one or more PISA sampling standards were not met. The country with the loudest number is the one whose sample flunked.
        </Callout>

        <H2>The next snapshot is 2029</H2>

        <P>
          PISA ran every three years from 2000 through 2025. After 2025 it <a href="https://www.k12dive.com/news/from-science-to-screen-time-4-key-takeaways-from-the-latest-pisa-results/829867/">moves to a four-year cycle</a>.
        </P>

        <P>
          So the instrument that just told us the bottom decile is in free fall doesn&rsquo;t check again until 2029. The kids who&rsquo;ll be 15 that year are 12 right now. They&rsquo;re already in the pipeline and we won&rsquo;t measure them for four years.
        </P>

        <Divider />

        <P>
          We&rsquo;ve got a distribution coming apart, and we just slowed down the camera.
        </P>

      </article>
    </Prose>
  </Container>
);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The 2026 <a href="https://educationscorecard.org/">Education Scorecard</a> came out a week ago.
          Harvard&#8217;s CEPR, Stanford&#8217;s EOP, and Dartmouth, fourth year running. The pitch: state
          test scores for <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Final-Embargoed-Education-Scorecard-Press-Release-2026.pdf">roughly
          35 million students in grades 3 through 8</a>, 2022 to 2025, linked to a common national scale.
          That last part &#8212; <em>linked to a common national scale</em> &#8212; is what makes the
          report worth opening. State tests don&#8217;t talk to each other on their own. The Stanford
          Education Data Archive does the math that makes them comparable.
        </P>

        <P>
          Headline framing: &#8220;reading recession.&#8221; Almost every outlet picked it up.
        </P>

        <P>
          The Associated Press wire, <a href="https://www.cnn.com/2026/05/13/us/reading-recession-students-test-scores">which
          ran in CNN</a> and <a href="https://www.chalkbeat.org/2026/05/13/education-scorecard-shows-us-students-in-reading-recession/">Chalkbeat</a>,
          said &#8220;only five states plus the District of Columbia had meaningful growth in reading test
          scores from 2022 to 2025.&#8221; The Scorecard&#8217;s own{' '}
          <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Final-Embargoed-Education-Scorecard-Press-Release-2026.pdf">press
          release</a> named eight jurisdictions: &#8220;DC, IN, KY, MD, MN, MS, LA, and TN.&#8221;
        </P>

        <P>
          So which is it. Five or seven.
        </P>

        <H2>The discrepancy is two thresholds, not a contradiction</H2>

        <P>
          I run a data company. I read this kind of report for the methodology section before the
          executive summary. The discrepancy isn&#8217;t a contradiction &#8212; it&#8217;s two different
          definitions of &#8220;meaningful growth&#8221; colliding on the same Tuesday. The press release
          lists every state that improved with statistical confidence. The AP cited the subset that
          cleared some higher threshold. Both are defensible. Most of the coverage didn&#8217;t notice.
        </P>

        <P>
          The bigger thing most of the coverage didn&#8217;t notice: twelve states aren&#8217;t in the
          analysis at all. Alaska, Colorado, Illinois, Kansas, Maine, Montana, New Mexico, New York,
          North Dakota, Oklahoma, Oregon, and Vermont &#8212; excluded for data limitations. New York
          and Illinois alone are something like 17% of the U.S. K&#8211;8 enrollment. The footnote sits
          on the last page of the <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Final-Embargoed-Education-Scorecard-Press-Release-2026.pdf">press
          release</a>.
        </P>

        <P>
          So when <a href="https://www.wusf.org/education/2026-05-13/florida-ranks-last-in-reading-warns-nationwide-education-report">Florida
          is described as ranking &#8220;last in reading&#8221;</a>, what that means is: 35th out of 35
          ranked states. Not last among 50.
        </P>

        <H2>The policy puzzle inside the report</H2>

        <P>
          The interesting puzzle inside the report has nothing to do with which number to use. It&#8217;s
          the policy puzzle. Per the <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Final-Embargoed-Education-Scorecard-Press-Release-2026.pdf">press
          release</a>: every state that improved was implementing comprehensive &#8220;science of
          reading&#8221; reforms. And every state that &#8220;had eschewed literacy reforms as of January
          2024&#8221; &#8212; California, Georgia, Hawaii, Massachusetts, New Hampshire, New Jersey,
          Rhode Island, South Dakota, Washington, Wisconsin &#8212; failed to improve.
        </P>

        <P>
          That&#8217;s the cleanest natural experiment in education policy in years. The &#8220;if&#8221;
          reads convincingly. If a state didn&#8217;t pass SoR reforms, scores didn&#8217;t go up. The
          &#8220;only if&#8221; doesn&#8217;t. Arizona, Florida, and Nebraska adopted SoR-aligned policies
          and reading scores still fell. Necessary, not sufficient.
        </P>

        <Fig caption={<>Source: <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Final-Embargoed-Education-Scorecard-Press-Release-2026.pdf">Education Scorecard 2026 press release</a>. State counts from the press release language. &#8220;SoR + did not improve&#8221; = AZ, FL, NE. &#8220;No SoR + did not improve&#8221; = CA, GA, HI, MA, NH, NJ, RI, SD, WA, WI.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22SoR%20%2B%20improved%22%2C%22SoR%20%2B%20did%20not%20improve%22%2C%22No%20SoR%20%2B%20did%20not%20improve%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22States%22%2C%22data%22%3A%5B7%2C3%2C10%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23bbbbbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Reading%20reform%20vs.%20recovery%3A%20states%20grouped%20by%20%27Science%20of%20Reading%27%20status%22%2C%22fontSize%22%3A16%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A12%2C%22stepSize%22%3A2%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Number%20of%20states%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&backgroundColor=transparent&devicePixelRatio=2"
            alt="Bar chart of states grouped by Science of Reading reform status: 7 implemented SoR and improved, 3 implemented SoR but did not improve (AZ, FL, NE), 10 had no SoR reforms and did not improve (CA, GA, HI, MA, NH, NJ, RI, SD, WA, WI)."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>The absenteeism subhead nobody&#8217;s reading</H2>

        <P>
          There&#8217;s a chronic-absenteeism finding underneath that I&#8217;d want louder. The Scorecard
          puts the <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Final-Embargoed-Education-Scorecard-Press-Release-2026.pdf">2024&#8211;25
          rate at 23%</a>, down from the post-pandemic peak, still above the{' '}
          <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Final-Embargoed-Education-Scorecard-Press-Release-2026.pdf">15%
          pre-pandemic baseline</a>. The report estimates that if absenteeism returned to pre-pandemic
          levels, recovery would have been{' '}
          <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Final-Embargoed-Education-Scorecard-Press-Release-2026.pdf">0.03

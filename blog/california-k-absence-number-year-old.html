// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">
        <P>
          The October 15 release came with two numbers built for a headline. Graduation hit <a href="https://www.cde.ca.gov/nr/ne/yr26/yr26rel44.asp">87.9%, the highest in a decade</a>. Chronic absenteeism fell to <a href="https://www.cde.ca.gov/nr/ne/yr26/yr26rel44.asp">18.3%, down 1.1 points</a>, and <a href="https://edsource.org/2026/california-graduation-rates-decade-high/768178">the peak was 30% in 2021&ndash;22</a>. Good news. Everybody ran it.
        </P>

        <P>
          The version of the story I was handed goes one layer down. California built universal transitional kindergarten, the argument goes, and its four-year-olds are now the worst attenders in the state. A U-curve: bad at the start, bad at the end, fine in the middle. Tidy. Shareable. So I went looking for the left side of the U.
        </P>

        <H2>Problem one: the number is a year old</H2>

        <P>
          The same release that has the 87.9% has <a href="https://www.cde.ca.gov/nr/ne/yr26/yr26rel44.asp">no TK or kindergarten figures at all</a>. TK shows up as a program investment and that&rsquo;s it. CDE&rsquo;s downloadable chronic absence files <a href="https://www.cde.ca.gov/ta/ac/cm/chronicdatafiles.asp">stop at 2024&ndash;25</a> (as of this morning). So whatever number is floating around for California&rsquo;s youngest kids is last year&rsquo;s. Not wrong. Old.
        </P>

        <H2>Problem two: it isn&rsquo;t TK</H2>

        <P>
          The number that does exist is <a href="https://edpolicyinca.org/publications/unpacking-californias-chronic-absence-crisis-through-2024-25">kindergarten with TK folded in</a>: 23% chronically absent in 2024&ndash;25. <a href="https://edsource.org/2026/california-tk-chronic-absenteeism/766697">EdSource has it at about 24%</a> for the youngest students, against 19% for everyone (two sources, a point apart, neither one separating TK from K). TK is the new thing. TK is what the story is about. And it&rsquo;s stapled to a grade that&rsquo;s been around forever.
        </P>

        <H2>Problem three: the U leans the wrong way</H2>

        <P>
          <a href="https://edpolicyinca.org/publications/unpacking-californias-chronic-absence-crisis-through-2024-25">High school ran 24% that same year</a>. One point <em>above</em> kindergarten. The left side of the U is lower than the right side. I can&rsquo;t vouch for the middle (grades 1&ndash;8 live in a chart whose values I couldn&rsquo;t pull), but the two ends don&rsquo;t say what the pitch says.
        </P>

        <Fig caption={<>Sources: <a href="https://edpolicyinca.org/publications/unpacking-californias-chronic-absence-crisis-through-2024-25">PACE</a> (kindergarten incl. TK 23%, high school 24%, 2024&ndash;25). The all-students bar is derived: 18.3% in 2025&ndash;26 plus the 1.1-point drop is 19.4% for 2024&ndash;25, per <a href="https://www.cde.ca.gov/nr/ne/yr26/yr26rel44.asp">CDE</a>. <a href="https://edsource.org/2026/california-tk-chronic-absenteeism/766697">EdSource</a> rounds it to 19%.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22All+students+%28derived%29%22%2C%22Kindergarten+incl.+TK%22%2C%22High+school+9-12%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B19.4%2C23%2C24%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.45%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Chronic+absence%2C+California%2C+2024-25%2C+%25%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A30%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+chronically+absent%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Atrue%2C%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22top%22%2C%22font%22%3A%7B%22size%22%3A15%2C%22weight%22%3A%22bold%22%7D%7D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: California chronic absence 2024-25, all students 19.4%, kindergarten including TK 23%, high school 24%" style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }} />
        </Fig>

        <P>
          And the direction isn&rsquo;t a crisis. Kindergarten (TK included) went from 40% in 2021&ndash;22 to 23%. That&rsquo;s 17 points (40 minus 23, my arithmetic). One vendor&rsquo;s slice agrees: in 97 districts, <a href="https://edsource.org/2026/california-tk-chronic-absenteeism/766697">SchoolStatus says TK fell from nearly 29% to under 22%</a> between 2023&ndash;24 and 2025&ndash;26. That&rsquo;s the company&rsquo;s own data, not the state&rsquo;s, so hold it loosely.
        </P>

        <P>
          Does California have a TK attendance problem? Maybe. Four-year-olds don&rsquo;t drive themselves. But a number that&rsquo;s a year old and two grades wide can&rsquo;t tell you.
        </P>

        <Divider />

        <P>
          When the 2025&ndash;26 grade file lands, ask which row is TK. Right now nobody can say.
        </P>

        <P><em>&mdash; TJ</em></P>

        <H3>Sources</H3>
        <UL items={[

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', margin:'0 0 56px', padding:'32px 0', textAlign:'center' }}>

      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:14, maxWidth:760, marginLeft:'auto', marginRight:'auto' }}>

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On September 25th, Indiana published <a href="https://www.chalkbeat.org/indiana/2026/09/25/ilearn-2026-results-see-how-your-school-did/" target="_blank" rel="noopener">school-by-school results</a> for its 2026 ILEARN test. Two headline numbers came out of it: 42% of students proficient in English, 43% in math. Both of those are the wrong number. The number that actually tells you how many Hoosier kids are on grade level — proficient in <em>both</em> subjects at once — is <a href="https://www.chalkbeat.org/indiana/2026/08/11/ilearn-scores-2026-for-math-and-english-released/" target="_blank" rel="noopener">31.5%</a>. Almost no state calculates that joint figure. Indiana just did, right there in its own release, which makes it either the most honest state testing shop in the country or the one that did not think through what its own arithmetic implied.
        </P>

        <P>
          I run a data company. I do not grade schools and I am not about to start. What I do is stare at data pipelines for a living, and this one has a defect you can spot without an opinion on curriculum: Indiana <a href="https://www.chalkbeat.org/indiana/2026/08/11/ilearn-scores-2026-for-math-and-english-released/" target="_blank" rel="noopener">rebuilt ILEARN this year</a> — a shorter end-of-year test plus three new checkpoints spread across the calendar — and state officials cautioned, in the same release, against comparing 2026 scores to any prior year. Fine. Instruments get redesigned. That happens.
        </P>

        <P>
          Except in December, those same freshly redesigned scores become the primary input to <a href="https://www.in.gov/doe/accountability/indianas-accountability-model-families-students/" target="_blank" rel="noopener">Indiana's new A-F school letter grades</a>. The state swapped the ruler, told you it has not been calibrated against the old one, and is about to hand every public school in Indiana a public, consequential grade measured with it anyway.
        </P>

        <Fig caption={<>Statewide averages vs. grade 8 alone. Math falls nine points below its own state average by eighth grade; English rises two points above it. Source: <a href="https://www.chalkbeat.org/indiana/2026/08/11/ilearn-scores-2026-for-math-and-english-released/" target="_blank" rel="noopener">Chalkbeat Indiana</a>, August 11, 2026.</>}>
          <img src={CHART_SLOPE} alt="Statewide math is 43% proficient, English 42%. By grade 8, math falls to 34% while English rises to 44%." style={{ width:'100%', maxWidth:900, height:'auto', display:'block', margin:'0 auto' }} />
        </Fig>

        <P>
          And the ruler bends depending on where a kid stands on it. Just over half of third and fourth graders are proficient in math statewide — by eighth grade that is 34%, nine points under the state's own math average. English runs the other way: flat around 41% from third grade through middle school, then rising to 44% by eighth — two points <em>above</em> the state average. Same cohort, same redesigned test, same twelve months. One subject collapses as kids age through the system. The other does not. That is not a curriculum debate. That is a data lineage question nobody at the state has answered: is the math cliff a real, teenager-specific learning loss, or is the new instrument just behaving differently in the higher grades? Can't tell you. The state will not let this year's data answer that question about itself.
        </P>

        <Callout label="Key figure">
          29% of Indiana students on subsidized meals were proficient in English in 2026, versus 53% of students who were not — a 24-point gap, published school by school. Source: <a href="https://www.chalkbeat.org/indiana/2026/09/25/ilearn-2026-results-see-how-your-school-did/" target="_blank" rel="noopener">Chalkbeat Indiana</a>, September 25, 2026.
        </Callout>

        <P>
          The release states that split plainly instead of making a reporter dig for it. A 24-point gap, in a downloadable file, the same month these numbers start turning into letter grades that run in the local paper.
        </P>

        <P>
          None of this means the schools are lying or the test is garbage. It means Indiana ran two separate operations in the same testing cycle — replace the sensor, then score everybody off the new sensor's readings — and is calling the output accountability. Any data team that has shipped a new instrument mid-pipeline knows this move. You do not get to swap the sensor and the dashboard in the same release and act surprised when the numbers jump around.
        </P>

        <Divider />

        <P>
          December's grades are going to tell some school it improved and the one next door it declined. Neither claim will be falsifiable, because the state already told you the yardstick moved. Somebody in Indianapolis should be running the numbers right now on which schools are about to get a grade that contradicts their own multi-year trend — because that is the actual story, and the data to compute it exists today. It is just not the data anyone is grading on.
        </P>

      </article>
    </Prose>
  </Container>
);

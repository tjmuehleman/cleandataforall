// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>

//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          South Carolina released its report cards on October 13 and called it the strongest year under today&rsquo;s rating model: <a href="https://www.herecolumbia.com/2026/10/13/weaver-releases-2026-school-report-cards-state-house/">320 schools rated Excellent, up from 270, about 52% of schools Good or Excellent, college-and-career readiness at 79%</a>. A week earlier Virginia said its Distinguished share <a href="https://virginiamercury.com/2026/10/07/virginia-doubles-distinguished-schools-as-state-accountability-results-show-major-gains/">went from 23% to 44%</a>. Records. Two states. One October.
        </P>

        <P>
          Here&rsquo;s the thing about a rating, though. It isn&rsquo;t a measurement of kids. It&rsquo;s a formula run on measurements of kids (with the weights picked by adults in a conference room). Change the formula, the weights, or the scale and you can set a record without anybody learning anything. I&rsquo;m not saying that happened. I&rsquo;m saying a press release can&rsquo;t tell you either way.
        </P>

        <H2>Virginia is on a new ruler</H2>

        <P>
          Virginia&rsquo;s 2026 results are only the second release under a School Performance and Support Framework that <a href="https://virginiamercury.com/2026/10/07/virginia-doubles-distinguished-schools-as-state-accountability-results-show-major-gains/">replaced the state&rsquo;s old accountability system</a>, and the state says changes to it will keep rolling for years. Coverage of the results doesn&rsquo;t say whether scoring was identical across the two years. Look at what moved: Distinguished up 21 points, Meets expectations down 17. That looks a lot like schools changing tiers. Maybe they earned it. Maybe the tiers moved. The data we have doesn&rsquo;t pick one.
        </P>

        <Fig caption={<>Source: Virginia school ratings as <a href="https://virginiamercury.com/2026/10/07/virginia-doubles-distinguished-schools-as-state-accountability-results-show-major-gains/">reported by the Virginia Mercury</a>, share of schools, 2025 vs. 2026. Percentages as printed; 2025 sums to 99% from rounding.</>}>
          <img src={"https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Distinguished%22%2C%22Meets+expectations%22%2C%22Approaching%22%2C%22Needs+intensive+support%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222025%22%2C%22data%22%3A%5B23%2C43%2C22%2C11%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22barPercentage%22%3A0.9%2C%22categoryPercentage%22%3A0.7%7D%2C%7B%22label%22%3A%222026%22%2C%22data%22%3A%5B44%2C26%2C23%2C7%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.9%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Virginia%3A+share+of+schools+by+rating%2C+%25%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A50%2C%22stepSize%22%3A10%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"} alt="Bar chart of Virginia school ratings in 2025 and 2026: Distinguished 23% to 44%, Meets expectations 43% to 26%, Approaching 22% to 23%, Needs intensive support 11% to 7%" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>Kansas broke the ruler on purpose</H2>

        <P>
          In August 2025 Kansas swapped a 220&ndash;380 score scale for <a href="https://www.hppr.org/2025-08-28/not-lowering-standards-kansas-education-leaders-adopt-new-scale-for-state-tests">400&ndash;700, with &ldquo;proficient&rdquo; starting at 540 in every grade and subject</a>. The board voted 7&ndash;3. Officials say rigor didn&rsquo;t drop, and I&rsquo;m not going to litigate that. The part I care about: they also said results <em>won&rsquo;t be comparable</em> to past years. States normally keep scales steady so a line can be drawn from last year to this year. Kansas drew a new axis.
        </P>

        <H2>Kentucky is the mirror image</H2>

        <P>
          Kentucky&rsquo;s numbers came out October 15, and they run the other way. <a href="https://www.wkyt.com/2026/10/15/kentucky-reading-scores-hit-multi-year-high-fewer-schools-earn-top-ratings/">Reading proficiency rose at every level</a>: elementary 49% to 50%, middle 47% to 48%, high school 46% to 49%. And the share of schools rated Green or Blue <em>fell</em>: 41% to 39%, 48% to 37%, 58% to 50%. The state&rsquo;s explanation, per the same report, is that lower &ldquo;change&rdquo; scores (this year vs. last) dragged ratings down while &ldquo;status&rdquo; scores stayed about level. Hold steady, and a change-weighted rubric reads it as slipping.
        </P>

        <P>
          Same kind of exercise, opposite sign. Better reading, fewer celebrations.
        </P>

        <Divider />

        <P>
          South Carolina says its scores weigh <a href="https://www.herecolumbia.com/2026/10/13/weaver-releases-2026-school-report-cards-state-house/">achievement, growth, readiness and climate</a>, and the coverage I found doesn&rsquo;t mention a methodology change. Maybe its record is clean. I&rsquo;d love to know. So here&rsquo;s my ask to every state with a record this fall: publish the 2026 ratings recomputed on the 2025 rules. Until then, a record is a statement about the ruler.
        </P>

        <P>
          <strong>Sources</strong>
        </P>

        <UL items={[
          <><a href="https://www.herecolumbia.com/2026/10/13/weaver-releases-2026-school-report-cards-state-house/">South Carolina 2026 report cards (Here Columbia)</a></>,
          <><a href="https://virginiamercury.com/2026/10/07/virginia-doubles-distinguished-schools-as-state-accountability-results-show-major-gains/">Virginia accountability results (Virginia Mercury)</a></>,
          <><a href="https://www.hppr.org/2025-08-28/not-lowering-standards-kansas-education-leaders-adopt-new-scale-for-state-tests">Kansas new assessment scale (HPPR / Kansas News Service)</a></>,
          <><a href="https://www.wkyt.com/2026/10/15/kentucky-reading-scores-hit-multi-year-high-fewer-schools-earn-top-ratings/">Kentucky 2026 results (WKYT)</a></>,
        ]} />

        <P>
          <em>&mdash; TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          1,548,191. That's how many kids American public schools flagged as experiencing homelessness
          in the 2023-24 school year — the highest count since national reporting started in 2004, up
          12.6% in one year and 28.5% in two (<a href="https://nche.ed.gov/wp-content/uploads/2026/03/Education-of-CYEH-in-the-United-States-data-summary-for-school-years-2021-22-to-2023-24.pdf" target="_blank" rel="noopener">NCHE</a>).
        </P>

        <P>
          The obvious read is that child homelessness exploded. The less obvious read — the one I
          actually believe, because I sell data systems to school districts for a living — is that the
          count exploded because for once districts had money to go find these kids. The American
          Rescue Plan put $800 million into homeless-student identification and support, enough to
          reach more than half of U.S. school districts (<a href="https://schoolhouseconnection.org/article/fact-sheet-educating-children-and-youth-experiencing-homelessness" target="_blank" rel="noopener">SchoolHouse Connection</a>).
          That money is gone. What's left for FY2026 is $129 million, which reaches about one in five
          districts — 20.79%, to use the actual number (<a href="https://schoolhouseconnection.org/article/fact-sheet-educating-children-and-youth-experiencing-homelessness" target="_blank" rel="noopener">SchoolHouse Connection</a>).
          Four out of five districts now get zero dedicated dollars to do this work.
        </P>

        <H2>You only find who you fund the finding of</H2>

        <P>
          Identifying a homeless student isn't a sensor reading. It's a McKinney-Vento liaison in a
          building, funded or not, asking the right question at enrollment, checking an address against
          a shelter list, following up on the kid who's been couch-surfing since October. Fund that
          person and the number goes up — not because more kids became homeless, but because someone
          was finally paid to notice the ones who already were.
        </P>

        <Fig caption={<>Source: SchoolHouse Connection, <em>2026 Fact Sheet: K-12 Students Experiencing Homelessness</em>. The FY2026 bar (20.79%) is the source's exact figure; the ARP-HCY bar reflects the source's own precision (&ldquo;over half&rdquo;), shown at 50%.</>}>
          <img src={CHART_FUNDING} alt="Share of U.S. school districts with dedicated federal homeless-education funding: over half during the ARP-HCY era, 20.79% in FY2026" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          And we have the receipts on what funded identification actually does. In districts that got
          ARP-HCY money, identification rebounded 25% between SY 2020-21 and SY 2022-23. Chronic
          absenteeism among homeless students at those districts fell from 52% to 47%. Their four-year
          graduation rate hit 72%, beating the 69% national average for homeless kids (<a href="https://www.ed.gov/media/document/arp-hcy-national-outcomes-summary-109427.pdf" target="_blank" rel="noopener">U.S. Dept. of Education</a>).
          Funding the liaison didn't just inflate a count. It moved outcomes for the kids the count
          represents.
        </P>

        <H2>Two cameras, different shutter speeds</H2>

        <P>
          Nationally, the same pattern shows up: chronic absenteeism among identified homeless students
          dropped from 50.8% to 47.7% between 2021-22 and 2023-24, even as the headline count climbed
          (<a href="https://nche.ed.gov/wp-content/uploads/2026/03/Education-of-CYEH-in-the-United-States-data-summary-for-school-years-2021-22-to-2023-24.pdf" target="_blank" rel="noopener">NCHE</a>).
          And the graduation rate for homeless students was 69.1%, against 86.7% for all students —
          a 17.6-point gap. But that number is from SY 2022-23, not 2023-24, because federal graduation
          data lags enrollment data by a year. Every fall you read this year's dramatic headline count
          next to last year's outcome number and call it a snapshot. It isn't one.
        </P>

        <H2>The count that starts too late</H2>

        <P>
          And the K-12 count, dramatic as it is, starts at kindergarten. Below that there's a bigger,
          blinder gap. SchoolHouse Connection and Poverty Solutions at the University of Michigan
          estimate that roughly 86,000 California children ages 0-3 experienced homelessness in
          2023-24 — more than 5% of the state's infants and toddlers, up 15% from about 74,000 the year
          before. Only about 12,000 of them, 14%, were enrolled in any early learning program (<a href="https://edsource.org/2026/california-infant-toddler-homelessness-rise/765355" target="_blank" rel="noopener">EdSource</a>).
          Whatever machinery finds the 1.5 million K-12 kids doesn't reach a single one of them before
          age five.
        </P>

        <Divider />

        <P>
          So next year's national count will probably look better. Fewer kids identified, a nicer-looking
          line on somebody's dashboard. It won't be because fewer kids are sleeping in cars, shelters,
          and doubled-up apartments with three other families. It'll be because four out of five
          districts stopped getting paid to notice.
        </P>

      </article>

);

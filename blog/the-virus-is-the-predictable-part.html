const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here&rsquo;s a forecast I can&rsquo;t stop rereading: somewhere between <a href="https://www.thelancet.com/journals/lanhiv/article/PIIS2352-3018(25)00074-8/fulltext">4.4 and 10.8 million additional HIV infections by 2030</a>, plus 770,000 to 2.9 million additional deaths. That&rsquo;s not a typo, and it&rsquo;s not two studies arguing. It&rsquo;s one model, one scenario, and a range more than six million people wide.
        </P>

        <P>
          I run a data company, so my first question about an error bar that big is always the same: what&rsquo;s the variable doing the damage? Usually a band that wide means the underlying system is noisy and hard to measure. Here it&rsquo;s the opposite. The epidemiology is the well-behaved part.
        </P>

        <H2>The virus is the line you can fit</H2>

        <P>
          From 2010 to 2023, the countries that leaned on PEPFAR and other foreign aid pushed new HIV infections down an <a href="https://www.thelancet.com/journals/lanhiv/article/PIIS2352-3018(25)00074-8/fulltext">average of 8.3% a year, and deaths down 10.3% a year</a>. Stay on that curve and most of them were on track to hit the global targets to end HIV as a public-health threat around 2036. It&rsquo;s a clean, almost boring trend line. You can lay a ruler on it.
        </P>

        <P>
          The thing you can&rsquo;t lay a ruler on is the appropriation. On <a href="https://www.whitehouse.gov/presidential-actions/2025/01/reevaluating-and-realigning-united-states-foreign-aid/">January 20, 2025 the US paused foreign aid for a 90-day review</a>. The five biggest donors are now signaling a <a href="https://www.thelancet.com/journals/lanhiv/article/PIIS2352-3018(25)00074-8/fulltext">24% cut to international HIV funding by 2026</a>, and the US alone is about 73% of that money. The model&rsquo;s giant range isn&rsquo;t measuring the virus. It&rsquo;s measuring how fast you think a funding system falls over, and whether anyone switches it back on.
        </P>

        <H2>One line item moves the whole forecast</H2>

        <P>
          The Burnet Institute and WHO authors ran the sensitivity check I&rsquo;d have run first. Hold the broader donor cuts in place but <a href="https://www.thelancet.com/journals/lanhiv/article/PIIS2352-3018(25)00074-8/fulltext">reinstate PEPFAR, and the 4.4&ndash;10.8 million projected infections collapse to 0.07&ndash;1.73 million; the deaths drop from 770,000&ndash;2.9 million to roughly 5,000&ndash;61,000</a>. One program is most of the distance between a rounding error and a generational reversal. That&rsquo;s the two bars up top.
        </P>

        <Callout label="The variable">
          PEPFAR currently keeps about <a href="https://www.kff.org/global-health-policy/fact-sheet/the-u-s-presidents-emergency-plan-for-aids-relief-pepfar/">20.6 million people on HIV treatment across 55 countries, and is credited with saving roughly 26 million lives since 2003</a>. In the model, ending it accounts for the large majority of the projected infections and deaths &mdash; not the rest of the donor world, not the biology. One budget line.
        </Callout>

        <H2>Even the pause shows up</H2>

        <P>
          A second model, in <a href="https://www.thelancet.com/journals/eclinm/article/PIIS2589-5370(25)00165-8/fulltext">eClinicalMedicine</a>, didn&rsquo;t touch the long-run cuts at all. It took just the 90-day freeze, across seven sub-Saharan countries that hold about half of Africa&rsquo;s HIV-positive population, and still landed on <a href="https://www.thelancet.com/journals/eclinm/article/PIIS2589-5370(25)00165-8/fulltext">60,000 to 74,000 excess HIV deaths and tens of thousands of new infections</a> by 2030. Ninety days. The deaths don&rsquo;t wait for the appropriations calendar.
        </P>

        <Fig caption={<>Source: <a href="https://www.thelancet.com/journals/eclinm/article/PIIS2589-5370(25)00165-8/fulltext">eClinicalMedicine &mdash; <em>The impact of the PEPFAR funding freeze on HIV deaths and infections</em></a> (Hontelez et al., 2025). Seven countries (Ethiopia, Kenya, Malawi, South Africa, Tanzania, Zambia, Zimbabwe) holding roughly half of Africa&rsquo;s HIV-positive population. Proportional scenario: 60,000 excess deaths (95% UI 49&ndash;71k); near-total-collapse scenario: 74,000 (63&ndash;89k); 35,000&ndash;103,000 excess new infections across scenarios.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Proportional+scenario%22%2C%22Near-total+collapse+scenario%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Excess+HIV+deaths+%28thousands%29%22%2C%22data%22%3A%5B60%2C74%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Excess+HIV+deaths+from+a+90-day+funding+freeze+%28thousands%29%2C+7+countries%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A28%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A90%2C%22stepSize%22%3A15%2C%22fontSize%22%3A11%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Excess+HIV+deaths+by+2030+%28thousands%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=380&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of excess HIV deaths from a 90-day funding freeze across seven countries: about 60,000 under the proportional scenario and 74,000 under the near-total-collapse scenario."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <Divider />

        <P>
          The caveat buried in the Lancet paper is the part that sticks with me. The authors call their own estimate <a href="https://www.thelancet.com/journals/lanhiv/article/PIIS2352-3018(25)00074-8/fulltext">likely an underestimate</a>, and the range is that wide because they&rsquo;re modeling a policy, not a pathogen. And here&rsquo;s the loop a data person can&rsquo;t unsee: PEPFAR didn&rsquo;t just buy antiretrovirals. It built the clinics, the testing, the unglamorous case-reporting pipeline &mdash; the same machinery that would later count whether these projected deaths actually happened. Cut the program and you blind the instrument that would have measured the cut.
        </P>

        <P>
          So we&rsquo;ll forecast the toll to a decimal and never quite get to check our work, because the thing that would have done the counting got defunded in the same motion.
        </P>

        <P>
          The virus, we can forecast. It&rsquo;s the budget that&rsquo;s the wild variable &mdash; and the budget is the one we actually chose.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

        <Divider />

        <H2>Sources</H2>

        <UL items={[

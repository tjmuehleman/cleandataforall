// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On Monday, October 12, a gallon of diesel cost $6.179, <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=pet&amp;s=emd_epd2d_pte_nus_dpg&amp;f=w">per EIA</a>. A year earlier it cost about $3.67 (EIA lists the year-over-year change at $2.514, so that's the subtraction). School buses run on the stuff. In the survey below, <a href="https://www.aasa.org/docs/default-source/advocacy/aasa-asbo-napt-diesel-impact-may-2026.pdf">65% of respondents</a> said diesel is their primary bus fuel, and another 29% run a mix.
        </P>

        <P>
          So what did districts do? In May, AASA, ASBO and NAPT asked their members. 188 people finished the survey, the week of May 4. Of those, 25% reduced the number of routes, 40% consolidated or adjusted them, and 20% limited non-required trips like field trips (<a href="https://www.aasa.org/docs/default-source/advocacy/aasa-asbo-napt-diesel-impact-may-2026.pdf">AASA memo, May 13</a>). And 8% checked a box labeled &ldquo;increased walk-to-stop ratio.&rdquo; <a href="https://www.axios.com/2026/10/05/iran-war-diesel-fuel-costs-school-bus">Axios</a> summarized that one as making kids walk farther to their stops, and that is the version that travels.
        </P>

        <H2>Do the arithmetic on 8%</H2>

        <P>
          8% of 188 is about 15 respondents (8% &times; 188 = 15.04; the memo prints percentages, not counts). Fifteen people. Not fifteen districts, necessarily, and not fifteen thousand kids. In the memo&rsquo;s results it&rsquo;s a label and a percentage. No distances, no student counts, no grade bands.
        </P>

        <Fig caption={<>Source: <a href="https://www.aasa.org/docs/default-source/advocacy/aasa-asbo-napt-diesel-impact-may-2026.pdf">AASA / ASBO / NAPT diesel impact survey</a>, May 2026. Multiple answers allowed, so bars don&rsquo;t sum to 100. Top eight of the memo&rsquo;s operational-change items shown.</>}>
          <img src={"https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Consolidated+%2F+adjusted+routes%22%2C%22Enforced+anti-idling%22%2C%22Reduced+number+of+routes%22%2C%22Limited+field+trips+etc.%22%2C%22Changed+fuel+purchasing%22%2C%22Increased+walk-to-stop+ratio%22%2C%22Moved+off+yellow%2Fdiesel%22%2C%22Renegotiated+vendor+contracts%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B40%2C27%2C25%2C20%2C14%2C8%2C7%2C6%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23777%22%2C%22%23141210%22%2C%22%23777%22%2C%22%23bbb%22%2C%22%23141210%22%2C%22%23bbb%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.7%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22What+188+respondents+said+they+changed%2C+2025-26+%28%25+of+respondents%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22color%22%3A%22%23141210%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A13%7D%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A50%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"} alt="Horizontal bar chart of operational changes districts reported: 40% consolidated routes, 27% anti-idling, 25% reduced routes, 20% limited trips, 14% fuel purchasing, 8% increased walk-to-stop ratio, 7% moved off diesel, 6% renegotiated contracts" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          And the memo is upfront about what it is. It never describes how the 188 were found, the response rate, a margin of error, or any weighting. It calls the results a &ldquo;snapshot.&rdquo; 65% of respondents were transportation directors or coordinators, 34% ran districts under 2,500 students, and 7% ran districts over 50,000. That&rsquo;s a useful poll of people who care about buses. It is not a count of children on sidewalks.
        </P>

        <H2>The snapshot has a cutoff</H2>

        <P>
          The week of May 4, diesel was <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=pet&amp;s=emd_epd2d_pte_nus_dpg&amp;f=w">$5.640</a>. It&rsquo;s $6.179 now, and the survey asked about 2025-26, a school year that was already over. Fall routes, the ones that actually get drawn around a fuel bill, aren&rsquo;t in it.
        </P>

        <P>
          What <em>is</em> in it: 63% were absorbing the extra cost inside the transportation budget, 55% had no spending offsets yet, and 66% said their state doesn&rsquo;t provide dedicated transportation funding that rises with fuel prices. 14% were already more than 20% over their approved diesel budget. One example from Axios: Cherry Creek Public Schools outside Denver budgeted $1.5 million for fuel and now expects $2 million to $2.3 million, and its transportation director says it hasn&rsquo;t cut service (<a href="https://www.axios.com/2026/10/05/iran-war-diesel-fuel-costs-school-bus">Axios, Oct 5</a>).
        </P>

        <Divider />

        <P>
          The cost is real, the price chart is real, and some kids probably are walking farther. Maybe a lot of them. But the data we have for that last part is fifteen-ish checkboxes from May. The policy may have been set in the Strait of Hormuz. The evidence was set in an email survey.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

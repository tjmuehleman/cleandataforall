// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>Kansas publishes a file with three columns I wish every state had: accepted, denied for capacity, denied by policy.</P>

        <P>It’s a PDF. Of course it’s a PDF. But it’s a <a href="https://datacentral.ksde.gov/open_enrollment.aspx">district-by-district, grade-by-grade count</a> of who got into a school outside their home district in 2025-26 and who got told no, and that makes Kansas rare.</P>

        <P>Here’s what I got out of it. My text pull of the <a href="https://datacentral.ksde.gov/docs/open_enroll/2026_Open_Enrollment_Data_Report.pdf">PDF</a> died mid-record at Altoona-Midway, 177 districts in, so treat everything below as a floor, not a statewide total. In those 177 districts: <strong>1,307</strong> transfers accepted. <strong>532</strong> denied. That’s 28.9% of decided applications (532 ÷ 1,839). 57 districts denied at least one student, and 25 of them denied more than they accepted.</P>

        <P>Derby turned away 93 and took 139. Valley Center took 14 and turned away 51. Manhattan-Ogden and Spring Hill each accepted zero, and denied 24 and 22.</P>

        <P>And the reason on the form is almost always the same one. 370 of the 532 denials, roughly 7 in 10, were for capacity. Capacity sounds like a fact. In the file it’s a column each district reports.</P>

        <P>One more thing about that 28.9%: it’s denied divided by accepted-plus-denied, because that’s all the file gives me. Families who were told at the front desk there were no seats and never filed anything? Not in there. (I’m guessing at that one. I don’t know. That’s sorta the point.)</P>

        <P>Kansas doesn’t split denials by disability. Wisconsin does. In 2021-22, districts rejected <a href="https://pbswisconsin.org/news-item/wisconsin-students-with-disabilities-often-denied-public-school-options/">about 40% of open enrollment applications from students with disabilities and 14% from everyone else</a>, with lack of special education space the most common reason, per PBS Wisconsin’s read of state DPI data. In 2022, <a href="https://pbswisconsin.org/news-item/wisconsin-students-with-disabilities-often-denied-public-school-options/">Verona Area announced 115 open seats and reserved zero for students with disabilities</a>. That’s 2021-22. I couldn’t find a newer split.</P>

        <Fig caption={<>Wisconsin figures as reported by <a href="https://pbswisconsin.org/news-item/wisconsin-students-with-disabilities-often-denied-public-school-options/">PBS Wisconsin</a> (“about 40%” and 14%), from state DPI data. No derived values.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Students+with+disabilities%22%2C%22All+other+applicants%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B40%2C14%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%5D%2C%22barPercentage%22%3A0.5%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Wisconsin+open+enrollment+applications+rejected%2C+2021-22+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A50%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+applications+rejected%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A14%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22font%22%3A%7B%22size%22%3A18%2C%22weight%22%3A%22bold%22%7D%7D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: Wisconsin open enrollment applications rejected in 2021-22, about 40 percent for students with disabilities versus 14 percent for all other applicants" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>Zoom out. Reason Foundation’s 2026 ranking gives full credit to <a href="https://reason.org/open-enrollment/public-schools-without-boundaries-2026/">four states for a state report that includes rejected applicants and the reasons</a>: Arkansas, Kansas, Oklahoma and Wisconsin. Everyone else gets partial credit or none. Four. And as far as I can tell the metric asks for counts and reasons, not who the students are. Of the four, the only one I can show you splitting by disability is Wisconsin, in a year that’s now history.</P>

        <P>Everyone argues about whether a family may apply. Choice is a form with two outcomes, and we publish one.</P>

        <Divider />

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://datacentral.ksde.gov/open_enrollment.aspx">KSDE Data Central, Open Enrollment Reports</a></>,
          <><a href="https://datacentral.ksde.gov/docs/open_enroll/2026_Open_Enrollment_Data_Report.pdf">KSDE 2025-26 Open Enrollment Data Report (PDF)</a></>,
          <><a href="https://pbswisconsin.org/news-item/wisconsin-students-with-disabilities-often-denied-public-school-options/">PBS Wisconsin, Wisconsin students with disabilities often denied public school options</a></>,
          <><a href="https://reason.org/open-enrollment/public-schools-without-boundaries-2026/">Reason Foundation, Public Schools Without Boundaries 2026</a></>,
        ]} />

        <P><em>— TJ</em></P>

      </article>
    </Prose>
  </Container>
);

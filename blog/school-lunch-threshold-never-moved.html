const H2 = ({ children }) => <h2>{children}</h2>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In June, <a href="https://www.msd25.org/article/2972561" target="_blank" rel="noopener">Marysville School District</a> in Washington sent a letter home. Three schools &mdash; Cedarcrest Middle, Marysville Getchell High, Marysville Pilchuck High &mdash; are losing their free-lunch-for-everyone status starting this fall. Kids whose families don&rsquo;t separately qualify will pay $4&ndash;5 for lunch, or bring their own. The district&rsquo;s explanation: <a href="https://www.msd25.org/article/2972561" target="_blank" rel="noopener">&ldquo;federal legislation approved by Congress in 2025, which restructured EBT benefits and reduced the percentage of qualifying families in our community.&rdquo;</a>
        </P>

        <P>
          That&rsquo;s a remarkably careful sentence. It&rsquo;s also describing something that never became law.
        </P>

        <P>
          In January 2025, House Republicans <a href="https://www.k12dive.com/news/house-republicans-float-plan-to-cut-community-eligibility-provision/739212/" target="_blank" rel="noopener">floated a reconciliation option</a> to raise the bar for the Community Eligibility Provision &mdash; the rule that lets high-poverty schools feed every kid free, zero paperwork &mdash; from 25% of students on programs like SNAP to 60%. FRAC ran the state-by-state math: <a href="https://frac.org/blog/new-proposal-drastically-reduces-number-of-schools-eligible-for-community-eligibility-provision" target="_blank" rel="noopener">24,559 schools, 12,473,887 kids, gone</a>. It was a great, terrible headline. And it died. Go read <a href="https://frac.org/cep-report-2026" target="_blank" rel="noopener">FRAC&rsquo;s own 2026 report</a> on the program: a school still qualifies at 25% &ldquo;identified students.&rdquo; Same line as always.
        </P>

        <P>
          So how does a district lose eligibility without the eligibility rule changing? You don&rsquo;t move the bar. You shrink who&rsquo;s standing under it.
        </P>

        <P>
          Congress left CEP&rsquo;s 25% threshold alone and cut SNAP itself instead &mdash; <a href="https://www.cbpp.org/research/food-assistance/by-the-numbers-harmful-republican-megabill-takes-food-assistance-away-from" target="_blank" rel="noopener">$187 billion through 2034, per CBO, the largest cut to the program in its history</a>, signed into law July 4, 2025. Buried in CBO&rsquo;s own estimate is the plumbing: because SNAP kids get automatically enrolled in free school meals, cutting SNAP cuts that automatic enrollment too &mdash; <a href="https://www.cbpp.org/research/food-assistance/by-the-numbers-harmful-republican-megabill-takes-food-assistance-away-from" target="_blank" rel="noopener">CBO figures about 96,000 kids a month lose it that way alone</a>. And the losses are outrunning even that estimate. <a href="https://www.cbpp.org/blog/congress-should-staunch-snap-participation-losses-which-exceed-cbos-estimates" target="_blank" rel="noopener">CBO&rsquo;s February 2026 baseline expected SNAP participation to average 39.3 million people in 2026, down from about 42 million in 2025. The actual number for March: 37.4 million</a> &mdash; more than 4 million people gone in eight months, faster than the government&rsquo;s own model said it would happen.
        </P>

        <P>
          Every SNAP case is a kid getting &ldquo;directly certified&rdquo; for lunch with no form. Pull the SNAP case, the kid falls out of the school&rsquo;s eligibility count with it &mdash; not because the school changed, not because the family got richer, but because an upstream program with nothing to do with lunch got smaller. FRAC said as much in its own <a href="https://frac.org/cep-report-2025" target="_blank" rel="noopener">2025 report</a>, in the driest sentence a nonprofit can write: the SNAP cuts &ldquo;will have down-stream effects&hellip; fewer schools will be eligible for CEP.&rdquo;
        </P>

        <P>
          You can watch the number stall. <a href="https://frac.org/cep-report-2025" target="_blank" rel="noopener">CEP added 6,655 schools in 2024-25 &mdash; 14% growth</a>, the best year the program&rsquo;s ever had. <a href="https://frac.org/cep-report-2026" target="_blank" rel="noopener">In 2025-26 it added 1,128. That&rsquo;s 2.1%</a>, the slowest growth FRAC has ever recorded, with <a href="https://frac.org/cep-report-2026" target="_blank" rel="noopener">17 states plus DC already losing CEP schools net, year over year</a> &mdash; and the SNAP cuts hadn&rsquo;t even finished phasing in yet.
        </P>

        <P>
          Meanwhile <a href="https://frac.org/healthy-school-meals-for-all" target="_blank" rel="noopener">nine states</a> &mdash; California, Colorado, Maine, Massachusetts, Michigan, Minnesota, New Mexico, New York, Vermont &mdash; just fund the meals themselves and ignore the federal threshold entirely. Their kids don&rsquo;t ride the SNAP number. Everyone else&rsquo;s do, whether their parents have heard of it or not.
        </P>

        <Divider />

        <P>
          Here&rsquo;s the part that should needle you more than a clean vote to cut lunch would have. Nobody had to defend this one on the record. No member of Congress stood up and said &ldquo;I&rsquo;m voting to make a kid in Marysville fill out a form to eat.&rdquo; The bill that did the damage was about SNAP work requirements and state cost-shifting. The lunch line was downstream plumbing nobody mentioned in the press release &mdash; leaving the district newsletter to do the actual explaining, one careful, blameless sentence at a time.
        </P>

        <P>
          You don&rsquo;t need to change a rule if you&rsquo;re willing to change what&rsquo;s underneath it. That&rsquo;s not really a school meals story. It&rsquo;s a data systems story, wearing a cafeteria tray.
        </P>

        <H2>Sources</H2>
        <UL items={[
          <><a href="https://www.msd25.org/article/2972561" target="_blank" rel="noopener">Marysville School District, &ldquo;School Meals: MSD&rsquo;s Community Eligibility Provision Status Changing for 2026-2027 School Year,&rdquo; June 8, 2026</a></>,
          <><a href="https://frac.org/blog/new-proposal-drastically-reduces-number-of-schools-eligible-for-community-eligibility-provision" target="_blank" rel="noopener">FRAC, &ldquo;New Proposal Drastically Reduces Number of Schools Eligible for Community Eligibility Provision,&rdquo; Jan 17, 2025</a></>,
          <><a href="https://www.k12dive.com/news/house-republicans-float-plan-to-cut-community-eligibility-provision/739212/" target="_blank" rel="noopener">K-12 Dive, &ldquo;House Republicans float plan to cut Community Eligibility Provision,&rdquo; Feb 5, 2025</a></>,
          <><a href="https://frac.org/cep-report-2026" target="_blank" rel="noopener">FRAC, &ldquo;Community Eligibility: The Key to Hunger-Free Schools 2026&rdquo;</a></>,
          <><a href="https://frac.org/cep-report-2025" target="_blank" rel="noopener">FRAC, &ldquo;Community Eligibility: The Key to Hunger-Free Schools 2025&rdquo;</a></>,
          <><a href="https://www.cbpp.org/research/food-assistance/by-the-numbers-harmful-republican-megabill-takes-food-assistance-away-from" target="_blank" rel="noopener">CBPP, &ldquo;By the Numbers: Harmful Republican Megabill Takes Food Assistance Away From Millions of People&rdquo;</a></>,
          <><a href="https://www.cbpp.org/blog/congress-should-staunch-snap-participation-losses-which-exceed-cbos-estimates" target="_blank" rel="noopener">CBPP, &ldquo;Congress Should Stanch SNAP Participation Losses, Which Exceed CBO&rsquo;s Estimates,&rdquo; June 30, 2026</a></>,
          <><a href="https://frac.org/healthy-school-meals-for-all" target="_blank" rel="noopener">FRAC, &ldquo;Healthy School Meals For All&rdquo;</a></>,
        ]} />

        <P><em>— TJ</em></P>

      </article>
    </Prose>
  </Container>
);

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Carjacking%22%2C%22Robbery%22%2C%22Gun+assault%22%2C%22Homicide%22%2C%22Aggravated+assault%22%2C%22Domestic+violence%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+change+2024+to+2025%22%2C%22data%22%3A%5B-43%2C-23%2C-22%2C-21%2C-9%2C-2%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%233a3a3a%22%2C%22%233a3a3a%22%2C%22%23777%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Reported+crime+in+35+U.S.+cities%2C+2024+to+2025+%28%25+change%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-50%2C%22max%22%3A0%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+change%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of reported crime change in 35 U.S. cities from 2024 to 2025. Carjacking down 43 percent, robbery down 23, gun assault down 22, homicide down 21, aggravated assault down 9, domestic violence down 2." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>
//   <Divider />  (section break)
//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Homicides in 35 major U.S. cities fell 21% in 2025 — <a href="https://counciloncj.org/crime-trends-in-u-s-cities-year-end-2025-update/">922 fewer people killed</a> than the year before. Robberies dropped 23%. Gun assaults, 22%. And carjackings, the number that makes you sit up, fell <a href="https://counciloncj.org/crime-trends-in-u-s-cities-year-end-2025-update/">43%</a>.
        </P>

        <P>
          Every one of those lines points the same way: down. Steeply. This is the kind of chart you almost never get to draw in this line of work — no asterisk, no "well, actually," just a clean collapse across the board.
        </P>

        <P>
          So let me be the guy who reads the footnote out loud.
        </P>

        <H2>"Safest in a century" is a forecast, not a count</H2>

        <P>
          The Council on Criminal Justice, which assembled those 35-city numbers, says there's a <a href="https://counciloncj.org/crime-trends-in-u-s-cities-year-end-2025-update/">"strong possibility"</a> the national homicide rate lands near 4.0 per 100,000 once the FBI publishes — which <em>would</em> be the lowest rate on record going back to 1900, and the largest single-year drop ever measured.
        </P>

        <P>
          Read that again. Strong possibility. Would be. Once the FBI publishes. The full 2025 national dataset isn't out. The "safest year in a century" headline everyone is running is a projection stitched from the cities that happened to report early — not the final tally.
        </P>

        <P>
          I'm not saying it's wrong. The direction is real and it's enormous. I'm saying the confident sentence is running about a year ahead of the data that would make it a fact. And this isn't a pandemic bounce, either: homicides in these cities are <a href="https://counciloncj.org/crime-trends-in-u-s-cities-year-end-2025-update/">25% below 2019</a>, robbery 36% below, carjacking 29% below. Something structural moved.
        </P>

        <figure style={{ margin:'2.5em auto', maxWidth:900, textAlign:'center' }}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Robbery%22%2C%22Carjacking%22%2C%22Homicide%22%2C%22Domestic+violence%22%2C%22Gun+assault%22%2C%22Aggravated+assault%22%2C%22Sexual+assault%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+change+2019+to+2025%22%2C%22data%22%3A%5B-36%2C-29%2C-25%2C-19%2C-13%2C-6%2C-4%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Still+below+pre-pandemic%3A+2025+vs+2019+%28%25+change%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-40%2C%22max%22%3A0%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+change+vs+2019%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart comparing 2025 crime to 2019 across the same 35 cities. Robbery down 36 percent, carjacking down 29, homicide down 25, domestic violence down 19, gun assault down 13, aggravated assault down 6, sexual assault down 4." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
          <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>
            Source: Council on Criminal Justice, Year-End 2025 Update. Change vs. 2019, the pre-pandemic baseline.
          </figcaption>
        </figure>

        <H2>The part that actually worries me</H2>

        <P>
          In April 2025, the Department of Justice terminated <a href="https://counciloncj.org/doj-funding-update-a-deeper-look-at-the-cuts/">365 grants</a> and clawed back the unspent balances — roughly $500 million — across more than 550 organizations in 48 states.
        </P>

        <P>
          The cancelled list reads like a table of contents for community safety: violence reduction, victims' services, reentry, substance-use and mental-health treatment. And one category I keep coming back to on the <a href="https://counciloncj.org/doj-funding-update-a-deeper-look-at-the-cuts/">breakdown</a>: research and evaluation.
        </P>

        <P>
          That's the measurement layer. Those are the grants that pay the people who count things — who match a program to a neighborhood to an outcome and tell you whether the money did anything at all.
        </P>

        <Callout label="The timing, laid flat">
          The steepest crime drop on record. A national confirmation still a year out. And the apparatus built to explain the drop — to sort the programs that worked from the ones that didn't — switched off in the same window.
        </Callout>

        <H2>You can't A/B test a thing after you delete the logs</H2>

        <P>
          Every founder learns this one the hard way. You ship a change, the numbers move, everybody's thrilled — and then somebody asks <em>why</em>, and you realize you turned off event logging three weeks ago to trim the bill.
        </P>

        <P>
          That's roughly where U.S. crime data sits right now. The outcome moved in the best possible direction. The instrumentation that would tell us why is getting defunded at the exact moment the result got interesting.
        </P>

        <P>
          And a once-in-a-century result is the one you most want to understand — because if you can name what caused it, you might get to do it again.
        </P>

        <Divider />

        <P>
          Instead we're on track to book the record and lose the receipts. The safest year in a century, filed under cause unknown.
        </P>

        <P><em>— TJ</em></P>

        <H2>Sources</H2>
        <UL items={[
          <span>Council on Criminal Justice, <a href="https://counciloncj.org/crime-trends-in-u-s-cities-year-end-2025-update/">Crime Trends in U.S. Cities: Year-End 2025 Update</a> — homicide −21% (922 fewer), robbery −23%, gun assault −22%, carjacking −43%; 2025 vs. 2019 figures; national ~4.0 per 100,000 projection.</span>,
          <span>Council on Criminal Justice, <a href="https://counciloncj.org/doj-funding-update-a-deeper-look-at-the-cuts/">DOJ Funding Update: A Deeper Look at the Cuts</a> — 365 grants terminated, ~$500M rescinded, 550+ organizations across 48 states, including research and evaluation.</span>,
        ]} />

      </article>
    </Prose>
  </Container>
);

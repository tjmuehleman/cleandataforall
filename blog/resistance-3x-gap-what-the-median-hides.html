      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Western+Pacific%22%2C%22European%22%2C%22Americas%22%2C%22Global+%28median%29%22%2C%22African%22%2C%22Eastern+Mediterranean%22%2C%22South-East+Asia%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Median+resistance+%28%25%29%22%2C%22data%22%3A%5B9.1%2C10.2%2C14.7%2C17.2%2C19.6%2C30.0%2C31.1%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23bbb%22%2C%22%23777%22%2C%22%235a5a5a%22%2C%22%23777%22%2C%22%23141210%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Median+antibiotic+resistance+by+WHO+region%2C+2023%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A35%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+bug-drug+combinations+resistant%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of median antibiotic resistance by WHO region in 2023. South-East Asia 31.1 percent, Eastern Mediterranean 30.0, African 19.6, global median 17.2, Americas 14.7, European 10.2, Western Pacific 9.1 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here&rsquo;s a number that should reorganize how you think about a pill.
          One in six lab-confirmed bacterial infections on Earth is now resistant to
          the antibiotic meant to kill it &mdash; a global median of <a href="https://www.who.int/publications/i/item/9789240116337">17.2%</a> across
          the 93 bug-drug combinations WHO tracks, as of 2023. Break that apart by
          region and it fans out like a hand of cards.
        </P>

        <P>
          In the European Region the median resistance rate is <a href="https://www.who.int/publications/i/item/9789240116337">10.2%</a>.
          In South-East Asia it&rsquo;s 31.1%. The Eastern Mediterranean, 30.0%. So the same class
          of drugs that quietly works about nine times in ten in one place fails one time in
          three in another. 31.1 divided by 10.2 is 3.05. Three times the failure rate, same
          molecule, different longitude.
        </P>

        <P>
          That&rsquo;s the headline, and it&rsquo;s real. I run a data company, though, so my job is
          to be annoying about the word underneath it: <em>average</em>. A regional &ldquo;resistance
          rate&rdquo; is a median &mdash; a middle &mdash; and a middle is a professional liar. It hides three
          things, and all three matter more than the number out front.
        </P>

        <H2>1. It hides the spread</H2>

        <P>
          South-East Asia&rsquo;s 31.1% is the midpoint of a band that runs from <a href="https://www.who.int/publications/i/item/9789240116337">7.3% to 55.1%</a>.
          Europe&rsquo;s 10.2% runs from 1.5% to 24.6%. Those two ranges overlap almost the entire way.
          WHO says it out loud in the report: the median &ldquo;does not reflect the full variation.&rdquo;
          The 3&times; gap between the middles is true. The clean line your brain wants to draw between
          the doomed regions and the safe ones is not in the data. There are terrifying bug-drug pairs
          in Berlin and boring ones in Bangkok.
        </P>

        <figure style={{ margin:'2.5em auto', maxWidth:900, textAlign:'center' }}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Western+Pacific%22%2C%22European%22%2C%22Americas%22%2C%22Global+%28median%29%22%2C%22African%22%2C%22Eastern+Mediterranean%22%2C%22South-East+Asia%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22base%22%2C%22data%22%3A%5B2.1%2C1.5%2C2.3%2C3.5%2C4.2%2C9.2%2C7.3%5D%2C%22backgroundColor%22%3A%22rgba%280%2C0%2C0%2C0%29%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22IQR+of+resistance%22%2C%22data%22%3A%5B23.3%2C23.1%2C32.4%2C36.0%2C51.2%2C44.4%2C47.8%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23bbb%22%2C%22%23777%22%2C%22%235a5a5a%22%2C%22%23777%22%2C%22%23141210%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+spread+inside+each+region+%28interquartile+range%29%2C+2023%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22stacked%22%3Atrue%2C%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A60%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+resistant+%2825th%5Cu201375th+percentile+band%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22stacked%22%3Atrue%2C%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bars showing the interquartile range of resistance within each WHO region in 2023. South-East Asia spans about 7 to 55 percent, Eastern Mediterranean 9 to 54, African 4 to 55, global 4 to 40, Americas 2 to 35, European 2 to 25, Western Pacific 2 to 25. The bands overlap heavily." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
          <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
            Interquartile range (25th&ndash;75th percentile) of resistance within each WHO region, 2023. Each bar is the region&rsquo;s middle band; e.g. South-East Asia spans 7.3%&ndash;55.1% around a 31.1% median, Europe 1.5%&ndash;24.6% around 10.2%. Bar width = 75th &minus; 25th percentile. Source: <a href="https://www.who.int/publications/i/item/9789240116337">WHO, Global antibiotic resistance surveillance report 2025</a> (Figure 2).
          </figcaption>
        </figure>

        <H2>2. It hides which drug is actually failing</H2>

        <P>
          My favorite line in the whole report should be printed on a mug. Resistance to
          ciprofloxacin in non-typhoidal <em>Salmonella</em> &mdash; a nasty bloodstream bug &mdash; runs
          <a href="https://www.who.int/publications/i/item/9789240116337"> 18.0% globally</a>. Its single
          worst region? Europe, at 36.2%. The &ldquo;safest&rdquo; region on the whole scoreboard is the world
          leader for that one drug failing. Averages average. They smother the specific pathogen that&rsquo;s
          going to ruin a specific patient&rsquo;s week &mdash; and sometimes the smothered story is happening in
          the region that looks fine.
        </P>

        <H2>3. It hides who we didn&rsquo;t count</H2>

        <P>
          And this is the part regular readers know I can&rsquo;t leave alone. The whole report rests on
          over <a href="https://www.who.int/publications/i/item/9789240116337">23 million confirmed infections from 104 countries</a>.
          Huge &mdash; and still less than half the world. Nearly half of all countries reported nothing in 2023,
          and among the ones that did, the median national data-completeness score was
          <a href="https://www.who.int/publications/i/item/9789240116337"> 53.8%</a>. A C-minus. The regions posting
          the scariest numbers are also the ones with the thinnest labs, where the sample skews toward the
          sickest people who reached a hospital that could culture them. When your denominator is
          &ldquo;infections we managed to test,&rdquo; the places that test least can look better than they are.
        </P>

        <Divider />

        <P>
          None of this makes the gap fake. <em>E. coli</em> is
          <a href="https://www.who.int/news/item/13-10-2025-who-warns-of-widespread-resistance-to-common-antibiotics-worldwide"> over 40% resistant</a> to
          first-line cephalosporins worldwide and over 70% in the African Region, and resistance climbed in

          hardest where people can least afford it. I&rsquo;m just saying a single regional number is a headline, not a
          finding. The finding is underneath it &mdash; in the spread, in the one drug, in the countries that never

        </P>

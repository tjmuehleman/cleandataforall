<script type="text/babel" data-presets="react">

// ==================== TEMPLATE DATA ====================
const POST = {
  kind:    'Analysis',
  number:  '027',
  date:    'May 4, 2026',
  readTime: '4 min',
  title:   'Louisiana spent six years at #1 in FAFSA completion. The recovery happened everywhere else.',
  dek:     'Louisiana built the cleanest FAFSA mandate dataset in the country. Then they killed the mandate, and we got to watch what the data does on the policy-off side of the experiment.',

// =============================================================================

// ==================== Shared primitives ====================

  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================

);

// ==================== Post header ====================

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, borderTop:'1px solid var(--rule)', borderBottom:'1px solid var(--rule)', padding:'24px 0' }}>

        alt="Horizontal bar chart of year-over-year FAFSA completion change for the 2025-26 cycle vs. 2024-25 cycle, measured at mid-July 2025. Oklahoma (universal FAFSA, year 1): +41.5%. U.S. national average: +15.7%. Louisiana (mandate repealed): +1.7%."
        style={{ width:'100%', display:'block' }}
      />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:14, textAlign:'center' }}>
        Source: NCAN&rsquo;s FAFSA Tracker as of July 23, 2025, via <a href="https://www.bestcolleges.com/news/fafsa-completion-rates-rebound/">BestColleges</a>. YoY measured at the same mid-July reference point as the prior year.
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>
//   <Divider />  (section break)
//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          There&rsquo;s a reason data people get worked up about Louisiana
          FAFSA data. For about a decade it was the rare spot in U.S. policy
          where somebody flipped a switch and let it run long enough that you
          could actually watch what happened. Then somebody else flipped it
          off. And the people running the dataset stayed put.
        </P>

        <P>
          In 2018, Louisiana became the first state in the country to require
          every public-school senior to file the FAFSA before they could
          graduate (
          <a href="https://www.insidehighered.com/news/students/financial-aid/2024/03/11/louisiana-stops-requiring-fafsa-completion-high-school">Inside Higher Ed</a>
          ). Pre-policy completion sat around 65%. By 2020 it was about 80% (
          <a href="https://tcf.org/content/report/states-make-fafsa-mandatory/">The Century Foundation</a>
          ). Louisiana spent <strong>six straight graduating classes</strong>{' '}
          parked at the top of the National College Attainment Network&rsquo;s
          tracker &mdash; a friendly arms race with Tennessee for the #1 slot
          (<a href="https://www.ncan.org/news/667451/Louisiana-Board-Rescinds-States-Universal-FAFSA-Policy.htm">NCAN</a>).
        </P>

        <P>
          In March 2024, the Louisiana Board of Elementary and Secondary
          Education{' '}
          <a href="https://www.insidehighered.com/news/students/financial-aid/2024/03/11/louisiana-stops-requiring-fafsa-completion-high-school">voted to end the mandate</a>,
          beginning with the class of 2025. The board&rsquo;s reasoning ranged
          from &ldquo;the form is invasive&rdquo; to &ldquo;graduation should
          reflect a kid&rsquo;s work, not a parent&rsquo;s compliance.&rdquo;
          (Both true. Neither one a comment on the data.) The class of 2025
          was the first cohort that didn&rsquo;t have to file.
        </P>

        <P>
          Here&rsquo;s where the dataset gets interesting.
        </P>

        <P>
          The 2024-25 FAFSA cycle was also a disaster nationwide. The
          &ldquo;simplified&rdquo; form{' '}
          <a href="https://www.bestcolleges.com/news/fafsa-completion-rates-rebound/">launched late and broken</a>.
          National completion dropped over 10% mid-cycle. So the year
          Louisiana&rsquo;s mandate ended was also the year nobody else&rsquo;s
          data was fully comparable. Hard to disentangle policy from form.
        </P>

        <P>
          Then 2025-26 happened. The form got fixed. Every other state bounced
          back &mdash; <a href="https://www.bestcolleges.com/news/fafsa-completion-rates-rebound/">all 50</a>.
          Year-over-year completion was up <strong>15.7% nationally</strong>.
          Oklahoma, which made FAFSA universal effective 2024-25, led the
          country at <strong>+41.5%</strong>. Seven of the top ten completion
          states now have a universal policy on the books.
        </P>

        <P>
          Louisiana&rsquo;s recovery came in at <strong>1.7%.</strong>
        </P>

        <P>
          That&rsquo;s not a tie for last. It&rsquo;s last. By a wide margin.
        </P>

        <Callout label="Key figures">
          By mid-July 2025, Louisiana was at <strong>55.4% FAFSA
          completion</strong>. National average: <strong>55.8%</strong>. A
          state that spent six years at #1 is now indistinguishable from the
          average, sitting at 14th. (Source:{' '}
          <a href="https://www.bestcolleges.com/news/fafsa-completion-rates-rebound/">NCAN&rsquo;s FAFSA Tracker via BestColleges</a>,
          Aug 5, 2025.)
        </Callout>

        <H2>The data-systems part</H2>

        <P>
          Most of what gets written about this story compares &ldquo;before and
          after the repeal&rdquo; by stitching together mid-cycle measurements
          from one year and final-cycle measurements from another. The 80%
          number is from 2020. The 68% I keep seeing quoted is mid-July 2023.
          The 55.4% is the 2024-25 cycle final. Different cycle phases,
          different reporting cadences. They&rsquo;re not quite the same thing.
        </P>

        <P>
          Most of why this is publishable at all is that NCAN &mdash; a
          private nonprofit &mdash; runs the FAFSA Tracker and quietly
          standardizes messy state data into something comparable enough to
          actually write about. The Department of Education publishes{' '}
          <a href="https://studentaid.gov/data-center/student/application-volume/fafsa-completion-high-school/">high-school-level completion data</a>,
          but the comparable cross-state trend line lives at NCAN&rsquo;s
          tracker. Without that infrastructure, &ldquo;did the mandate
          work?&rdquo; is a question without a clean federal answer.
        </P>

        <Fig caption={<>Sources: 65% pre-policy and ~80% in 2020 from <a href="https://tcf.org/content/report/states-make-fafsa-mandatory/">The Century Foundation</a>, via <a href="https://www.insidehighered.com/news/students/financial-aid/2024/03/11/louisiana-stops-requiring-fafsa-completion-high-school">Inside Higher Ed</a>. 68% mid-July 2023 and 55.4% for the 2024-25 cycle from NCAN&rsquo;s FAFSA Tracker (Bill DeBaun, via <a href="https://www.bestcolleges.com/news/fafsa-completion-rates-rebound/">BestColleges</a>). Note: the four bars are not all measured at the same cycle phase &mdash; the 2023 figure is mid-July, the 2024-25 figure is the cycle final &mdash; which is exactly the data-systems wrinkle this piece is about.</>}>
          <img
            src="https://quickchart.io/chart/render/zf-540424a6-106c-45ce-a01c-b0c5b02df02e"
            alt="Bar chart of Louisiana FAFSA completion rate at four reference points: pre-policy ~2017 at 65%, under mandate peak in 2020 at 80%, under mandate year 6 (class of 2023, mid-July) at 68%, mandate repealed (class of 2025, full cycle) at 55.4%."
            style={{ width:'100%', display:'block' }}
          />
        </Fig>

        <P>
          This is the part that should keep policy data folks up. Texas,
          California, and a stack of other states are sitting on
          universal-FAFSA-flavored proposals. Oklahoma is in year two of its
          own. Whatever each of those states learns from running the policy is
          going to depend on whether somebody records the data points in a way
          that&rsquo;ll still be comparable when the policy gets flipped off
          &mdash; because eventually one of them will flip it off.
        </P>

        <P>
          Louisiana&rsquo;s gift to the U.S. financial aid literature is that
          the state actually let the experiment run, both directions. The
          dataset is real because the state let researchers tag both ends.
        </P>

        <Divider />

        <P>
          If the only thing you build is the on-switch dataset, you&rsquo;re
          not running an experiment. You&rsquo;re running an advocacy campaign.
        </P>

      </article>
    </Prose>
  </Container>
);

          <h3 style={{ fontFamily:'var(--display)', fontWeight:900, letterSpacing:'-0.01em', fontSize:'clamp(32px, 4vw, 56px)', lineHeight:0.95, margin:'8px 0 16px' }}>
            The dispatch,<br/>every Saturday morning.
          </h3>

            <button type="submit"
              style={{ border:0, borderLeft:'1.5px solid var(--ink)', padding:'0 20px', background:'var(--ink)', color:'var(--paper)', fontFamily:'var(--mono)', fontSize:12, letterSpacing:'0.12em', textTransform:'uppercase', cursor:'pointer', fontWeight:600 }}>

        </div>

        <Rule />

        <div style={{ padding:'24px 0 40px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:24, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)' }}>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Colophon</div>

          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>License</div>

          </div>
          <div>
            <div style={{ color:'var(--ink)', marginBottom:6 }}>Contact</div>
            <div>info@standardco.de<br/>Standard Co, est. 2013<br/>A reader-supported project.</div>
          </div>
        </div>

        <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
          <span>© 2013–2026 Standard Co · All rights unreserved</span>
          <span>Made with help from Claude</span>
        </div>
      </Container>
      <style>{`
        @media (max-width: 820px){
          .cdfa-colophon{ grid-template-columns: 1fr !important; }
        }
      `}</style>
    </footer>
  );
};

  return (
    <div>

    </div>

}

root.render(<App />);

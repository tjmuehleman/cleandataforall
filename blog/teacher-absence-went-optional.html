// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;

const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          There is a field in the federal civil rights data collection for teacher absence.
          It has been there since 2009. From the 2009–10 collection through 2017–18, every
          district in the country had to fill it in. Then somebody made it optional.
        </P>

        <P>
          Optional meant zero. When Brookings went looking for the 2021–22 numbers, the
          variable was still in the spec and{' '}
          <a href="https://www.brookings.edu/articles/state-data-shows-k-12-teacher-absences-surged-post-pandemic" target="_blank" rel="noopener">not reported in the public-use files</a>.
          Not deleted. Not fought over. Just no longer required, and therefore not there.
        </P>

        <P>
          We spent those same six years building the most elaborate student attendance
          apparatus in American history. Chronic absenteeism has a dashboard in nearly every
          state, a threshold, a color-coded map, and a press cycle every October. One side of
          the classroom got counted to the decimal. The other side got a checkbox nobody had
          to check.
        </P>

        <H2>What fills a hole like that</H2>

        <P>
          A vendor does.
        </P>

        <P>
          The number you have seen quoted — roughly{' '}
          <a href="https://www.frontlineeducation.com/solutions/absence-time/strategies-to-solve-substitute-teacher-shortage/" target="_blank" rel="noopener">14 million teacher absences went unfilled in 2022–23</a>,
          about 600 a month for the average district — comes from Frontline Education, which
          sells absence-management software to school districts. It is what happened inside
          their customer base. It is a real number, carefully produced, and it is not a census
          of American schools, because there was no census of American schools. (Same source,
          worth noting: the national substitute pool is at its largest ever, 1.4 million. So
          the shortage isn't supply.)
        </P>

        <Callout label="Provenance">
          The most-cited national figure on teacher absence during the federal gap is a
          software company's count of its own clients. That is not a knock on Frontline — they
          filled a hole somebody else dug. But when the public number goes away, the private
          number quietly becomes the public number, and nobody relabels the axis.
        </Callout>

        <H2>The serious version got done by hand</H2>

        <P>
          Brookings pulled state administrative files from Nevada, Connecticut, South Carolina
          and Illinois — four states, picked largely because they publish — and rebuilt a time
          series from 2018–19 through 2022–23. All four finished above their pre-pandemic
          baseline. Outside of one district, the increases ran about 20% to 50% above baseline.
        </P>

        <P>
          Outside of one district. Clark County, which is Las Vegas, came in at a six-fold
          increase. Clark County is also 56% of the Nevada sample. So "Nevada teacher absence
          more than tripled" is really "Las Vegas went up 6x and the rest of the state moved a
          little." Same state number. Completely different fact.
        </P>

        <Fig caption={<>Increase over each school's own 2018–19 level, school year 2022–23. Six-fold is plotted as +500%. The lower bar is a range, not a point estimate — Brookings reports increases of roughly 20% to 50% for the sample outside Clark County. Source: <a href="https://www.brookings.edu/articles/state-data-shows-k-12-teacher-absences-surged-post-pandemic" target="_blank" rel="noopener">Brookings</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Clark+County+%28Las+Vegas%29%22%2C%22All+other+schools+in+the%5Cnfour-state+sample%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Increase+over+2018-19+baseline%22%2C%22data%22%3A%5B%5B0%2C500%5D%2C%5B20%2C50%5D%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%5D%2C%22barPercentage%22%3A0.32%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Teacher+absenteeism+above+pre-pandemic+baseline%2C+2022-23+%28percent%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22min%22%3A0%2C%22max%22%3A520%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+above+2018-19+level%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
               alt="Horizontal bar chart comparing Clark County teacher absenteeism at 500 percent above its 2018-19 baseline against 20 to 50 percent for all other schools in the four-state sample"
               style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          And here is the part that inverts the usual story. Student absenteeism concentrates
          in poor schools — that concentration <em>is</em> the problem. Teacher absenteeism
          didn't. It rose in high- and low-poverty schools at about the same rate, and in the
          Brookings sample the more advantaged schools accounted for the same share or slightly
          more of the schools where it went up. It is the rare education number that isn't a
          poverty number. Which means the fix isn't a poverty fix. We could have known that six
          years ago if anyone had been counting.
        </P>

        <H2>One state publishes it</H2>

        <P>
          Illinois reports a teacher attendance rate every year: the share of teachers who
          logged fewer than ten absences, not counting professional development, family medical
          leave, long-term disability, or parental leave. In 2024–25{' '}
          <a href="https://www.illinoisreportcard.com/District.aspx?source=teachers&source2=teacherattendance&Districtid=15016299025" target="_blank" rel="noopener">Chicago Public Schools came in at 56.8%</a>{' '}
          — meaning at least 43% of CPS teachers missed ten days or more, against{' '}
          <a href="https://www.illinoispolicy.org/over-2-in-5-chicago-teachers-chronically-absent/" target="_blank" rel="noopener">34% statewide</a>.
        </P>

        <P>
          Even Illinois only publishes the binary, though. Fewer than ten, or not. A teacher who
          missed eleven days and a teacher who missed sixty land in the same bucket and come out
          looking identical. The one state doing this is doing it with a threshold instead of a
          count.
        </P>

        <Divider />

        <P>
          Teacher absence is mandatory again. It is in the 2023–24 collection, which the
          department{' '}
          <a href="https://www.npr.org/2026/09/04/nx-s1-5955681/civil-rights-data-schools-trump" target="_blank" rel="noopener">posted two weeks ago as 37 raw files</a>{' '}
          with no First Look Report and no announcement. So the number exists now. It is sitting
          in a zip file.
        </P>

        <P>
          Six years without it, and the first thing we did when it came back was not publish it.
        </P>

      </article>
    </Prose>
  </Container>
);

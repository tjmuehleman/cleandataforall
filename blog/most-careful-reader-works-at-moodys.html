const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In July, Fayette County Public Schools borrowed <a href="https://www.wkyt.com/2026/08/13/wall-street-slashes-fayette-county-schools-credit-rating-warns-17m-deficit-over-inaccurate-reporting/" target="_blank" rel="noopener">$95 million</a> to make payroll.
        </P>

        <P>
          Not for a building. Not for a bus fleet. Just to cover expenses until fall property taxes landed &mdash; the <a href="https://www.wkyt.com/2026/08/13/wall-street-slashes-fayette-county-schools-credit-rating-warns-17m-deficit-over-inaccurate-reporting/" target="_blank" rel="noopener">first time</a> the Lexington district had ever done cash-flow borrowing like that.
        </P>

        <P>
          The reason wasn&rsquo;t a bad year. It was a bad ledger.
        </P>

        <P>
          On August 12, Moody&rsquo;s cut the district&rsquo;s issuer and general obligation ratings to <a href="https://www.bondbuyer.com/news/fayette-county-school-district-kentucky-downgraded-to-baa1" target="_blank" rel="noopener">Baa1 from A3</a> &mdash; the <a href="https://www.wkyt.com/2026/08/13/wall-street-slashes-fayette-county-schools-credit-rating-warns-17m-deficit-over-inaccurate-reporting/" target="_blank" rel="noopener">third downgrade</a> in a single year &mdash; and the stated cause wasn&rsquo;t enrollment or labor costs or the end of pandemic money. It was <a href="https://www.wkyt.com/2026/08/13/wall-street-slashes-fayette-county-schools-credit-rating-warns-17m-deficit-over-inaccurate-reporting/" target="_blank" rel="noopener">&ldquo;inaccurate financial reporting, including inflated fund balance levels and overstated revenue projections.&rdquo;</a> Historical errors in local property tax records overstated revenue by <a href="https://www.wkyt.com/2026/08/13/wall-street-slashes-fayette-county-schools-credit-rating-warns-17m-deficit-over-inaccurate-reporting/" target="_blank" rel="noopener">$12 million</a>, which by itself erases the <a href="https://www.wkyt.com/2026/08/13/wall-street-slashes-fayette-county-schools-credit-rating-warns-17m-deficit-over-inaccurate-reporting/" target="_blank" rel="noopener">$11 million contingency</a> the district had written into its tentative 2027 budget. Moody&rsquo;s now projects the available general fund balance lands somewhere <a href="https://www.wkyt.com/2026/08/13/wall-street-slashes-fayette-county-schools-credit-rating-warns-17m-deficit-over-inaccurate-reporting/" target="_blank" rel="noopener">between negative $10 million and negative $17 million</a> for fiscal 2026.
        </P>

        <P>
          Read that again. The reserves weren&rsquo;t spent. They were never there.
        </P>

        <P>
          And here&rsquo;s the part that should bother anyone who works with public data: a team of bond analysts found it. Not the district&rsquo;s finance office. Not the state. Not an auditor on a normal cycle. Analysts whose actual job is pricing risk for investors ended up doing the most careful read of a Kentucky school district&rsquo;s own numbers.
        </P>

        <H2>Schools are now the biggest downgrade story in munis</H2>

        <P>
          K-12 districts accounted for <a href="https://www.bondbuyer.com/news/school-fiscal-challenges-are-pressuring-bond-ratings" target="_blank" rel="noopener">70&#37; of all of Fitch&rsquo;s downgrades and negative outlook revisions</a> over the trailing 12 months. Around <a href="https://www.bondbuyer.com/news/school-fiscal-challenges-are-pressuring-bond-ratings" target="_blank" rel="noopener">11&#37; of school district ratings</a> carry a negative outlook, against 6&#37; of all local government ratings. And roughly <a href="https://www.bondbuyer.com/news/school-fiscal-challenges-are-pressuring-bond-ratings" target="_blank" rel="noopener">60&#37; of US districts</a> sit in Fitch&rsquo;s two lowest budgetary-flexibility buckets, mostly because they can&rsquo;t raise revenue meaningfully without asking voters first.
        </P>

        <P>
          But the national number hides the interesting part. Same rating agency, same twelve months, same analyst quoted in the same article: Washington&rsquo;s K-12 sector took <strong>24 downgrades and zero upgrades</strong>. California took <strong>19 upgrades against 9 downgrades</strong> (chart at the top). That&rsquo;s not a trend line. That&rsquo;s a couple thousand separate ledgers being read one at a time, and the aggregate is almost meaningless.
        </P>

        <Fig caption={<>Source: Fitch analysts, via <a href="https://www.bondbuyer.com/news/school-fiscal-challenges-are-pressuring-bond-ratings" target="_blank" rel="noopener">The Bond Buyer, May 1, 2026</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22K-12+school+districts%22%2C%22All+local+governments%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Share+of+Fitch+ratings+on+negative+outlook%22%2C%22data%22%3A%5B11%2C6%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22Schools+carry+nearly+twice+the+negative-outlook+rate%22%2C%22Share+of+Fitch+ratings+on+negative+outlook%2C+2026%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%2C%22max%22%3A12%2C%22stepSize%22%3A2%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+rated+credits%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22fontStyle%22%3A%22bold%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=400&bkg=transparent&devicePixelRatio=2" alt="Share of Fitch ratings on negative outlook in 2026: K-12 school districts 11 percent, all local governments 6 percent." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>Three ways a district&rsquo;s numbers fail</H2>

        <P>
          The 2026 downgrades sort into three buckets, and none of them are really about demographics.
        </P>

        <P>
          <strong>The numbers were wrong.</strong> Fayette County. Inflated balances, overstated revenue, a $12 million property tax error nobody surfaced until a rating committee did.
        </P>

        <P>
          <strong>The numbers exist and don&rsquo;t mean anything.</strong> Moody&rsquo;s cut LAUSD&rsquo;s issuer rating to <a href="https://www.bondbuyer.com/news/lausds-ratings-take-a-hit-amid-fiscal-woes" target="_blank" rel="noopener">A1 from Aa3</a> in July and Fitch cut its issuer default rating to <a href="https://www.bondbuyer.com/news/lausds-ratings-take-a-hit-amid-fiscal-woes" target="_blank" rel="noopener">A from AA-minus</a>, days after the Los Angeles County Office of Education said the district meets the statutory criteria for a <a href="https://www.bondbuyer.com/news/lausds-ratings-take-a-hit-amid-fiscal-woes" target="_blank" rel="noopener">&ldquo;lack of going concern&rdquo; designation</a>. LAUSD has a fiscal stabilization plan. It identifies about <a href="https://www.bondbuyer.com/news/lausds-ratings-take-a-hit-amid-fiscal-woes" target="_blank" rel="noopener">$3.6 billion in budgetary solutions</a> through 2029. Fitch&rsquo;s objection is that it <a href="https://www.bondbuyer.com/news/lausds-ratings-take-a-hit-amid-fiscal-woes" target="_blank" rel="noopener">&ldquo;lacks implementation detail&rdquo;</a> &mdash; which is analyst for <em>the plan balances on the page and nowhere else.</em>
        </P>

        <P>
          <strong>The numbers were published and ignored.</strong> Fitch cut Dallas ISD to <a href="https://www.bondbuyer.com/news/fitch-cuts-dallas-school-rating-ahead-of-big-bond-election" target="_blank" rel="noopener">AA from AA-plus</a> in March, explicitly flagging that the district&rsquo;s long-term liability metric could get worse <a href="https://www.bondbuyer.com/news/fitch-cuts-dallas-school-rating-ahead-of-big-bond-election" target="_blank" rel="noopener">if voters approved the May bond</a>. In May, voters approved <a href="https://www.bondbuyer.com/news/dallas-school-system-wins-historic-6-24-billion-bond-election" target="_blank" rel="noopener">$6.24 billion</a>, 3 to 1. Largest school bond in Texas history.
        </P>

        <Callout label="The distinction that matters">
          Falling enrollment is demography. It&rsquo;s nobody&rsquo;s fault and everybody&rsquo;s problem. A fund balance that was never there is something else. That&rsquo;s a data problem, and data problems have owners.
        </Callout>

        <Divider />

        <P>

        </P>

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Two headlines, same state, same test, same week. One said Tennessee students hit <a href="https://www.chalkbeat.org/tennessee/2026/08/27/2026-tcap-school-level-results/">a majority in social studies for the first time</a>. The other said <a href="https://www.wsmv.com/2026/06/26/less-than-half-tennessee-students-are-proficient-any-school-subject-data-shows/">less than half of Tennessee students are proficient in any subject</a>.
        </P>

        <P>
          Both are right. Which is kind of the problem.
        </P>

        <P>
          Here's the 2026 social studies row from the state's own <a href="https://www.tn.gov/content/dam/tn/education/data/TCAP_State_Results_Summer2026.pdf">TCAP results table</a>: 13% Exceeded, 37% Met, 29% Approaching, 21% Below. Add Exceeded and Met and you get 50%. Read only the Met column and you get 37%. The second outlet's numbers for ELA (32%) and math (28%) are also the Met column, row for row, and nothing else. Nobody lied. Somebody just stopped reading one column early.
        </P>

        <H2>The state counts both. The headline didn't have to.</H2>

        <P>
          The state's framing is <a href="https://www.chalkbeat.org/tennessee/2026/08/27/2026-tcap-school-level-results/">met or exceeded expectations</a>, so 50% is the official number. Fine. But "proficiency rate" isn't a number. It's a definition with a number stapled to it, and the definition almost never travels with the number. A reader who sees 37% and a reader who sees 50% are both reading the same spreadsheet. They'd just never know it.
        </P>

        <P>
          And the choice of column moves more than the subject's headline. Read Met only and math trails ELA by four points (28 against 32). Read Met plus Exceeded and it trails by one (41 against 42). Same two subjects, same kids, and the story about which one is "worse" changes depending on whether the analyst stopped after column one, two, or three. Nobody puts that on the slide.
        </P>

        <H2>Is 50% a majority?</H2>

        <P>
          Hmm. Not sure the table can say. Every cell is rounded to a whole percent, and 13 plus 37 equals 50 whether the true figures add up to 49.6 or 50.4. "Crossed 50%" is a claim about the third decimal place. The table supports "50%." It does not, by itself, support "majority." (The Knoxville station WVLT's <a href="https://www.wvlt.tv/2026/06/24/tennessee-tcap-results-show-gains-english-math-social-studies/">write-up of the release</a> says 50%, not "more than half.")
        </P>

        <H2>The part that holds up</H2>

        <P>
          I went looking for the apples-to-oranges problem, because the social studies table has two rows. Middle and High. No Elementary row at all. Math has elementary kids in it, so a statewide 50 against a statewide 41 isn't a fair fight.
        </P>

        <P>
          So match the grade bands. Middle school: social studies 13 + 39 = 52%, math 12 + 29 = 41%. High school: social studies 14 + 28 = 42%, math 8 + 27 = 35%. Social studies still leads in both. The finding survives. The headline just needed a footnote.
        </P>

        <Fig caption={<>Source: Tennessee Department of Education, TCAP State Results, Summer 2026. Totals are Met + Exceeded as printed: 39, 36, 43, 44, 45, 47, 50. The state's release puts the gain since 2019 at <a href="https://www.tn.gov/education/news/2026/6/24/state-assessment-results-show-sustained-momentum-in-achievement-for-students-statewide-.html">11.4 points</a>; the rounded table shows 11.</>}>
          <img src={CHART2} alt="Stacked bar chart of Tennessee social studies results, 2019 to 2026, Met and Exceeded stacked. Totals: 39, 36, 43, 44, 45, 47, 50 percent." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <Divider />

        <P>
          Same test. Same kids. Same year. A 13-point gap between two true headlines, and it's exactly the size of one column.
        </P>

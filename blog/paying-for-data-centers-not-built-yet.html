// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, textAlign:'center' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222024%2F25%22%2C%222025%2F26%22%2C%222026%2F27%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%24+per+MW-day%22%2C%22data%22%3A%5B28.92%2C269.92%2C329.17%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22PJM+capacity+auction+clearing+price+%28%24%2FMW-day%2C+RTO+zone%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%24+per+MW-day%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Delivery+year+%28auction%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of PJM capacity auction clearing prices per MW-day: $28.92 for delivery year 2024/25, $269.92 for 2025/26, and $329.17 for 2026/27." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
        PJM base residual auction clearing price for most of the footprint: $28.92/MW-day (2024/25), $269.92 (2025/26), $329.17 (2026/27, at the FERC-approved cap). Sources: <a href="https://www.spglobal.com/energy/en/news-research/latest-news/electric-power/073024-pjm-power-capacity-auction-clears-at-record-high-price-of-26992mw-day-for-most-of-footprint">S&amp;P Global</a> and <a href="https://insidelines.pjm.com/pjm-auction-procures-134311-mw-of-generation-resources-supply-responds-to-price-signal/">PJM</a>.

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here&rsquo;s the number that got me. In PJM &mdash; the grid that keeps
          the lights on for about 67 million people from Chicago to the Jersey
          shore &mdash; the price to guarantee future power supply went from{' '}
          <a href="https://www.spglobal.com/energy/en/news-research/latest-news/electric-power/073024-pjm-power-capacity-auction-clears-at-record-high-price-of-26992mw-day-for-most-of-footprint">$28.92 per megawatt-day to $269.92</a>{' '}
          in a single auction. The next one hit{' '}
          <a href="https://insidelines.pjm.com/pjm-auction-procures-134311-mw-of-generation-resources-supply-responds-to-price-signal/">$329.17 and slammed into a price cap</a>.
        </P>

        <P>
          Everybody&rsquo;s writing the same headline: AI blew up your power bill.
          True enough. But the spike isn&rsquo;t the interesting part. What&rsquo;s
          <em>inside</em> the spike is.
        </P>

        <H2>The bill is a forecast</H2>

        <P>
          PJM runs a capacity auction &mdash; a market that clears years ahead of
          time, where generators get paid to promise they&rsquo;ll be ready. The
          clearing price is set by a demand forecast. A guess about how much power
          the grid will need three years out.
        </P>

        <P>
          And the data centers live in the guess.
        </P>

        <P>
          PJM&rsquo;s own market monitor &mdash; Monitoring Analytics, the referee,
          not the league &mdash; did the arithmetic. In the most recent auction,
          data-center load accounted for{' '}
          <a href="https://www.utilitydive.com/news/data-centers-pjm-capacity-auction/808951/">$6.5 billion of the $16.4 billion</a>{' '}
          in capacity costs. Forty percent. Across the last three auctions,{' '}
          <a href="https://www.utilitydive.com/news/data-centers-pjm-capacity-auction/808951/">$21.3 billion &mdash; 45% of the $47.2 billion</a>{' '}
          in cleared capacity.
        </P>

        <Fig caption={<>PJM capacity cost, split by the market monitor&rsquo;s data-center attribution. &ldquo;Everything else&rdquo; is the residual: $16.4B &minus; $6.5B = $9.9B for the latest auction, $47.2B &minus; $21.3B = $25.9B across the last three. Source: <a href="https://www.utilitydive.com/news/data-centers-pjm-capacity-auction/808951/">Monitoring Analytics via Utility Dive</a>, Jan. 2026.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Latest+auction+%282027%2F28%29%22%2C%22Last+three+auctions%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Data-center+forecast%22%2C%22data%22%3A%5B6.5%2C21.3%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Everything+else%22%2C%22data%22%3A%5B9.9%2C25.9%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Data-center+demand+as+a+share+of+PJM+capacity+cost+%28%24+billions%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22stacked%22%3Atrue%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%24+billions+in+capacity+cost%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22stacked%22%3Atrue%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Stacked horizontal bar chart: data-center forecast made up $6.5 billion of the $16.4 billion latest PJM auction, and $21.3 billion of the $47.2 billion across the last three auctions." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          Here&rsquo;s the part that should make any data person sit up straight.
          Of that $6.5 billion,{' '}
          <a href="https://www.utilitydive.com/news/data-centers-pjm-capacity-auction/808951/">about $6.2 billion is for data centers that haven&rsquo;t been built</a>.
          Not running. Not pouring concrete. Forecast. We are paying, in real
          dollars on real bills, to reserve power for machines that exist as a
          line in a spreadsheet.
        </P>

        <Callout label="Key figure">
          Roughly <strong>$6.2 billion</strong> of the $6.5 billion in data-center
          capacity cost from PJM&rsquo;s latest auction is for facilities that
          don&rsquo;t exist yet &mdash; only forecast to. (<a href="https://www.utilitydive.com/news/data-centers-pjm-capacity-auction/808951/">Monitoring Analytics</a>)
        </Callout>

        <H2>When the referee doubts the game</H2>

        <P>
          The monitor said the quiet part out loud. The load forecasts are so
          uncertain, it wrote, that they{' '}
          <a href="https://www.utilitydive.com/news/data-centers-pjm-capacity-auction/808951/">&ldquo;raise questions about the meaning of clearing a capacity auction based on those forecasts.&rdquo;</a>{' '}
          When the referee isn&rsquo;t sure the game means anything, that&rsquo;s
          not a rounding error. That&rsquo;s the scoreboard.
        </P>

        <P>
          And forecasts move. PJM missed its own reliability target by{' '}
          <a href="https://www.utilitydive.com/news/data-centers-pjm-capacity-auction/808951/">6,516 megawatts</a>{' '}
          in that auction, using a demand estimate that was already a year old.
          It&rsquo;s now redoing the forecast with stricter vetting of who
          actually shows up. Translation: the number that set your bill may have
          been too high, and we&rsquo;ll find out after we&rsquo;ve paid it.
        </P>

        <P>
          I run a data company. I spend my days telling people a forecast is not a
          measurement, and a model is a hypothesis wearing a suit. This is that,
          at grid scale, with your electric bill as the invoice.
        </P>

        <H2>The demand is real. The certainty isn&rsquo;t.</H2>

        <P>
          None of this means the load is fake. Goldman Sachs figures US
          data-center power demand{' '}
          <a href="https://www.goldmansachs.com/insights/articles/AI-poised-to-drive-160-increase-in-power-demand">climbs 160% by 2030</a>,
          from about 3% of the grid to 8%. The machines are coming. Some of them.
          The question the auction can&rsquo;t answer is which ones, and when
          &mdash; and it charges you full price for the ambiguity.
        </P>

        <P>
          Meanwhile the public has run its own vibe math.{' '}
          <a href="https://heatmap.news/politics/americans-oppose-data-centers-poll">71% of Americans</a>{' '}
          now say they&rsquo;d oppose a data center near them, up from 42% nine
          months earlier. More would rather live next to a{' '}
          <a href="https://news.gallup.com/poll/709772/americans-oppose-data-centers-area.aspx">nuclear plant</a>.
        </P>

        <Divider />

        <P>
          So here&rsquo;s where we are. The bill is real. The spike is real. But

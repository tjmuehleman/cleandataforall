const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Two federal education data releases landed within a few weeks of each other this spring. Almost nobody plotted them on the same axis.
        </P>

        <P>
          <a href="https://www.k12dive.com/news/public-school-enrollment-dips-slightly-2024-25-federal-data/809136/">Public-school enrollment in the U.S. fell 0.3% in 2024&ndash;25</a> &mdash; the fifth straight year of decline. In the same window, <a href="https://exceptionalchildren.org/blog/analysis-2024-idea-data-shows-increase-students-served">IDEA-eligible enrollment grew 3.8%, adding 301,991 students ages 3&ndash;21</a> and pushing the total past eight million for the first time. Two trendlines moved in opposite directions inside one school year.
        </P>

        <P>
          I run a data company. The thing I keep staring at is what happens to a per-pupil funding formula when one of those lines isn&rsquo;t doing the same arithmetic as the other.
        </P>

        <H2>The shape of the split</H2>

        <P>
          The exact number is <a href="https://exceptionalchildren.org/blog/analysis-2024-idea-data-shows-increase-students-served">8,194,424 students</a> served under IDEA Part B in 2024. <a href="https://www.k12dive.com/news/these-3-charts-show-how-special-education-enrollment-keeps-growing-IDEA-autism/812897/">Total growth since 2019 is 12.6%</a> &mdash; the steepest five-year jump on record. Three categories did most of the work: <a href="https://www.k12dive.com/news/these-3-charts-show-how-special-education-enrollment-keeps-growing-IDEA-autism/812897/">autism, developmental delay, and multiple disabilities</a>. Autism alone <a href="https://exceptionalchildren.org/blog/analysis-2024-idea-data-shows-increase-students-served">accounted for 40% of the 2024 increase</a>.
        </P>

        <P>
          The piece worth saying out loud about the data system: the <a href="https://sites.ed.gov/idea/osep-data-products">OSEP Section 618 child count</a> runs on an annual clock, publishes as a static table, and is one of the few federal education series the NCES restructuring did not gut. For now, we will still have this number next year. Which is more than you can say for the <a href="https://hechingerreport.org/proof-points-condition-of-education/">Condition of Education</a>, the federal scoreboard that missed its statutory June 1 deadline for the first time in the Department of Education&rsquo;s history.
        </P>

        <H2>The funding gap</H2>

        <Fig caption={<>The IDEA statute promised the federal government would cover 40% of the per-pupil cost of educating a student with a disability. Source: <a href="https://www.nea.org/resource-library/individual-disabilities-education-act-idea-funding-gaps-school-district">NEA &mdash; IDEA Funding Gaps by School District (2024&ndash;25)</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%221975+IDEA+statute+promise%22%2C%22FY2025+actual+federal+share%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Federal+share+of+IDEA+per-pupil+cost+%28%25%29%22%2C%22data%22%3A%5B40%2C10.9%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+federal+IDEA+cost-share+promise+vs.+what+is+actually+paid%22%2C%22fontSize%22%3A14%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A14%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A8%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%2C%22min%22%3A0%2C%22max%22%3A45%2C%22stepSize%22%3A10%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Federal+share+of+per-pupil+IDEA+cost+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=380&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart comparing the 40 percent federal IDEA cost-share promised in 1975 against the 10.9 percent actually paid in fiscal year 2025" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          The IDEA statute was written in 1975. <a href="https://www.brookings.edu/articles/more-money-is-not-enough-the-case-for-reconsidering-federal-special-education-funding-formulas/">Congress promised the federal government would pick up 40% of the additional per-pupil cost of educating a student with a disability</a>. The actual federal share in FY25 is <a href="https://www.nea.org/resource-library/individual-disabilities-education-act-idea-funding-gaps-school-district">10.9%</a> &mdash; about a quarter of the original promise. The cumulative shortfall against the 40% benchmark, by NEA&rsquo;s math, is <a href="https://www.nea.org/resource-library/individual-disabilities-education-act-idea-funding-gaps-school-district">\$38.66 billion in 2024&ndash;25 alone</a>. The FY26 spending deal that just passed <a href="https://www.naesp.org/blog/congress-rejects-deep-cuts-safeguards-key-k-12-funding-in-fy26-deal/">added \$20 million to IDEA Part B</a> against that gap.
        </P>

        <P>
          The state-level math is worse than the national line implies. <a href="https://www.brookings.edu/articles/more-money-is-not-enough-the-case-for-reconsidering-federal-special-education-funding-formulas/">Wyoming gets about \$2,826 in federal IDEA dollars per eligible child; Nevada gets \$1,384</a>. The per-state floor that was built so no state got too little has quietly become the formula&rsquo;s biggest feature.
        </P>

        <H2>The staffing line</H2>

        <P>
          There&rsquo;s a third number worth putting on the same axis. In the <a href="https://nces.ed.gov/whatsnew/press_releases/10_17_2024.asp">NCES School Pulse survey for 2024&ndash;25</a>, 74% of public elementary schools and 74% of middle schools reported difficulty filling a special-education teaching vacancy with a fully certified teacher &mdash; <a href="https://nces.ed.gov/whatsnew/press_releases/10_17_2024.asp">the highest-vacancy teaching position in the country</a>. Hawaii pays a <a href="https://www.npr.org/2022/04/21/1092343446/special-education-teachers-hawaii">\$10,000 differential for sped teachers</a>; the state&rsquo;s own analysis found it <a href="https://www.npr.org/2022/04/21/1092343446/special-education-teachers-hawaii">cut sped vacancies by 32%</a>. Most states do not differentiate sped pay at all.
        </P>

        <Callout label="The receipt">
          8,194,424 IDEA-eligible students in 2024. +301,991 over 2023. Autism accounted for 40% of the year&rsquo;s growth. Federal share of the per-pupil cost: 10.9%, against a statutory promise of 40%. Sources: <a href="https://exceptionalchildren.org/blog/analysis-2024-idea-data-shows-increase-students-served">CEC on OSEP Section 618</a>; <a href="https://www.nea.org/resource-library/individual-disabilities-education-act-idea-funding-gaps-school-district">NEA</a>.
        </Callout>

        <P>
          So: three lines, three different fiscal years of attention. Total enrollment is down. IDEA enrollment is up at the steepest rate in a decade. The federal cost share is flat. The staffing line was already short before the +3.8% landed on top of it.
        </P>

        <Divider />

        <P>
          The 2024 child-count release reset the denominator. The 2025 release will do it again. The federal share that was supposed to chase those students lands on a different graph, on a different fiscal-year calendar, in a different chamber of Congress.
        </P>

        <P>
          That graph isn&rsquo;t moving either.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

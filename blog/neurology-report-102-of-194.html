// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Last October the WHO put out its <a href="https://www.who.int/publications/i/item/9789240116139">first-ever global status report on neurology</a>, and the headline is the kind of number that stops you cold: more than 1 in 3 people alive &mdash; <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">over 3 billion of us</a> &mdash; are living with a neurological condition. Stroke, migraine, dementia, epilepsy, the neurological damage of a hard birth. <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">Over 11 million deaths a year</a>. Neurological conditions are now <a href="https://www.who.int/news/item/14-03-2024-over-1-in-3-people-affected-by-neurological-conditions--the-leading-cause-of-illness-and-disability-worldwide">the single leading cause of illness and disability on the planet</a>.
        </P>

        <P>
          That&rsquo;s the number everybody ran with. Here&rsquo;s the one I keep staring at.
        </P>

        <P>
          The whole report is built on data from <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">102 of the WHO&rsquo;s 194 member states</a>. Fifty-three percent. The first real global accounting of the world&rsquo;s number-one cause of disability, and barely half the world filled out the form.
        </P>

        <H2>The denominator</H2>

        <P>
          I run a data company. I spend most of my days inside other people&rsquo;s data &mdash; health ministries, school districts, the WHO itself. So when a report like this lands, the first thing I check isn&rsquo;t the headline stat. It&rsquo;s the denominator. Who got counted. Who didn&rsquo;t. And here the gaps aren&rsquo;t noise. They&rsquo;re the finding.
        </P>

        <P>
          Walk down what the 194 countries actually have. <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">102 submitted any data at all</a>. <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">63 have a national policy</a> for neurological disorders &mdash; about a third. <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">49 fold neurology into their universal-health-coverage package</a> &mdash; a quarter. <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">34 put dedicated money behind it</a>. Eighteen percent. For the leading cause of disability on Earth.
        </P>

        <P>
          The response shrinks at every step. A third of the world won&rsquo;t report. Two-thirds have no plan. Four out of five have no budget. And the workforce gap reads like a typo: low-income countries have <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">up to 82 times fewer neurologists per 100,000 people</a> than rich ones. Eighty-two times. That&rsquo;s not a shortage, that&rsquo;s a different planet.
        </P>

        <H2>We can&rsquo;t fix what we can&rsquo;t see</H2>

        <P>
          The report says the quiet part out loud. <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">Weak health information systems and chronic underfunding of research</a> &mdash; its words &mdash; are a big part of why nobody can build decent policy here. Which means the 3-billion figure is almost certainly a floor, not a ceiling. The places carrying the heaviest burden are the places least able to count it, so the true number is hiding in exactly the countries that didn&rsquo;t answer. The cleanest-looking global health stats are usually the ones built on the patchiest ground.
        </P>

        <P>
          And there&rsquo;s a quieter gap underneath all of it. The people who actually hold neurological care together &mdash; the caregivers, mostly women, doing the work that has no billing code &mdash; barely show up in any country&rsquo;s system. <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">46 member states offer them any kind of support service. 44 give them legal protection.</a> Out of 194. We don&rsquo;t count them either.
        </P>

        <Fig caption={<>Source: <a href="https://www.who.int/news/item/14-10-2025-11-million-lives-lost-each-year-urgent-action-needed-on-neurological-care">WHO &mdash; <em>11 million lives lost each year</em> (Global status report on neurology, Oct 14, 2025)</a>. Of 194 member states, 46 offer caregiver support services and 44 have legal protections for carers &mdash; fewer than 1 in 4 either way.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Legal+protections+for+carers%22%2C%22Carer+support+services%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22member+states%22%2C%22data%22%3A%5B44%2C46%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Caregiver+support+exists+in+fewer+than+1+in+4+countries+%28of+194%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A30%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A194%2C%22stepSize%22%3A50%2C%22fontSize%22%3A11%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Member+states+%28of+194%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=320&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart. Of 194 WHO member states, 46 offer caregiver support services and 44 have legal protections for carers."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <Callout label="The shape of it">
          The world&rsquo;s number-one cause of disability. More than 3 billion people, over 11 million deaths a year. And the first global report on it runs on data from 102 of 194 countries &mdash; with 18% funding it and 25% covering it under universal health care.
        </Callout>

        <Divider />

        <P>
          So here&rsquo;s the picture from the data side. We just learned that brain and nervous-system disorders are the single biggest driver of human disability. We learned it from a report nearly half the world&rsquo;s governments didn&rsquo;t contribute to, about a problem most of them don&rsquo;t fund, track, or insure.
        </P>

        <P>
          We finally measured the leading cause of disability on Earth. Then we found out we can only see about half of it.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

        <Divider />

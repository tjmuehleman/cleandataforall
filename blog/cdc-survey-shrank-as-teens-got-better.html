const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          CDC dropped the 2025 <a href="https://www.cdc.gov/yrbs/youth-health-in-focus/mental-health.html" target="_blank" rel="noopener">Youth Risk Behavior Survey</a> five
          days before this ran, and the topline is real. Persistent sadness or hopelessness fell from
          40% to 33% of high schoolers in two years. Seriously considering suicide fell from 20% to
          14%. Making a plan, 16% to 12%. Attempting it, 9% to 6%. These are the biggest two-year
          swings the survey has ever recorded &mdash; in the good direction &mdash; and nobody saw it coming.
        </P>

        <P>
          Here&rsquo;s the part that should stop you before you feel good about it: <a href="https://www.cdc.gov/yrbs/youth-health-in-focus/digital-behaviors.html" target="_blank" rel="noopener">social media use every hour or more</a> went
          37% to 36%. <a href="https://www.cdc.gov/yrbs/youth-health-in-focus/sleep.html" target="_blank" rel="noopener">Eight-plus hours of sleep</a>, 23% to 24%. <a href="https://www.cdc.gov/yrbs/youth-health-in-focus/physical-activity.html" target="_blank" rel="noopener">Daily physical activity</a>, 25%, flat.
          Muscle-strengthening exercise, 51%, flat. The two things every parent, teacher, and cable
          news segment blames for the teen mental health crisis did not move. At all.
        </P>

        <Fig caption={<>Source: CDC, <em>Youth Risk Behavior Surveillance System, Digital Behaviors</em>, <em>Sleep</em>, and <em>Physical Activity</em>, 2025.</>}>
          <img src={CHART_FLAT} alt="Nothing blamed for the crisis moved: social media hourly-plus use 37% to 36%, 8+ hours sleep 23% to 24%, daily physical activity 25% to 25%, muscle-strengthening 51% to 51%" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          So what happened? Nobody knows yet, and normally I&rsquo;d stop there and wait for someone
          smarter than me to run the regression. But I run a data company for a living, and the thing
          that jumps out at me isn&rsquo;t the mystery in the numbers. It&rsquo;s the survey itself.
        </P>

        <H2>A different instrument, not just a different result</H2>

        <P>
          The 2025 YRBS is not the same instrument as the 2023 one. CDC didn&rsquo;t tweak a few
          questions &mdash; <a href="https://www.wamc.org/2026-09-23/latest-cdc-report-on-youth-behavior-has-some-good-news-and-maha-vibes" target="_blank" rel="noopener">it dropped sexual behavior, substance use, weapon-carrying and school
          violence, and, the one that matters here, the entire breakdown by race, ethnicity, and
          LGBTQ+ status</a>. The new report leans hard into the administration&rsquo;s <a href="https://www.cdc.gov/media/releases/2026/cdc-data-show-encouraging-progress-in-youth-health.html" target="_blank" rel="noopener">&ldquo;Make America
          Healthy Again&rdquo; framing</a> &mdash; nutrition, physical activity, chronic disease &mdash; and quietly
          stopped measuring the categories most likely to complicate a good-news story.
        </P>

        <P>
          That&rsquo;s a boring, specific, data-guy problem: the most obvious follow-up question &mdash; did
          this improvement show up for girls the same as boys, for LGBTQ+ kids the same as everybody
          else &mdash; is not answerable from this release. Not because CDC checked and found no gap.
          Because the crosstab doesn&rsquo;t exist anymore.
        </P>

        <Callout label="What did survive">
          The sex breakdown still shows girls reporting worse numbers than boys on every mental health
          indicator in 2025 &mdash; persistent sadness 43% vs. 24%, seriously considering suicide 18% vs.
          11% (<a href="https://www.cdc.gov/yrbs/youth-health-in-focus/mental-health.html" target="_blank" rel="noopener">CDC</a>). So the gap that used to run through gender plainly hasn&rsquo;t closed. Whether it
          closed along any of the lines nobody&rsquo;s tracking anymore is now, structurally, a question
          the CDC&rsquo;s own report cannot answer.
        </Callout>

        <P>
          I&rsquo;ve spent enough years pulling district-level data out of paper attendance logs and
          half-migrated state systems to have a reflex about this: when the instrument changes shape
          in the same release where the number you were hoping for goes down, you don&rsquo;t get to just
          take the win. You ask what the old instrument would have shown you that the new one can&rsquo;t.
          Sometimes the answer is nothing &mdash; the improvement is real, uniform, boring. Sometimes it
          isn&rsquo;t, and you won&rsquo;t know for years, because by the time anyone restores the old
          questions, the 2023 baseline you&rsquo;d need to check it against is gone too.
        </P>

        <Divider />

        <P>
          CDC&rsquo;s own headline on this release is <a href="https://www.cdc.gov/media/releases/2026/cdc-data-show-encouraging-progress-in-youth-health.html" target="_blank" rel="noopener">&ldquo;encouraging progress.&rdquo;</a> It&rsquo;s probably not
          wrong. It&rsquo;s just resting on a report that got a lot quieter in exactly the places that
          would tell us if it&rsquo;s wrong.
        </P>

        <P style={{ fontStyle:'italic', fontSize:'16px', color:'var(--muted)' }}>
          If you or someone you know is struggling, the 988 Suicide &amp; Crisis Lifeline is available
          by call or text, 24/7.
        </P>

      </article>

);

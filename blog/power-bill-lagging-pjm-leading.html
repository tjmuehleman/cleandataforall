const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The May 2026 EIA Short-Term Energy Outlook puts the average U.S. residential electricity price at{' '}
          <a href="https://www.eia.gov/outlooks/steo/">18.2&cent;/kWh</a>{' '}
          &mdash; up about 5% in a year. That reads like a normal inflation story. Move along.
        </P>

        <P>
          Don&rsquo;t move along.
        </P>

        <P>
          One layer below the retail bill is the wholesale capacity market &mdash; what PJM, the grid
          operator covering 67 million people from Illinois to Virginia, pays generators just to be
          available three years out. In{' '}
          <a href="https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2024-2025/2024-2025-base-residual-auction-report.ashx">the 2024/25 auction</a>{' '}
          that price cleared at <strong>$28.92/MW-day</strong> for the rest of the RTO. In{' '}
          <a href="https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2026-2027/2026-2027-bra-report.pdf">the 2026/27 auction held last July</a>,{' '}
          it cleared at <strong>$329.17/MW-day</strong> for the entire footprint. That&rsquo;s a{' '}
          1,038% jump in two cycles. Same grid. Same operator. Same accounting line.
        </P>

        <P>
          That&rsquo;s not inflation. That&rsquo;s a different kind of pricing signal entirely.
        </P>

        <H2>The cap is the story underneath the story</H2>

        <P>
          Then it got weirder. On{' '}
          <a href="https://insidelines.pjm.com/pjm-auction-procures-134479-mw-of-generation-resources/">December 17, 2025, PJM ran the 2027/28 Base Residual Auction</a>.
          The clearing price came in at <strong>$333.44/MW-day</strong>. Only 1.3% above last year.
          You could squint and call that flattening. Don&rsquo;t squint.
        </P>

        <P>
          $333.44 is the FERC-approved <em>cap</em>. Every zone of PJM cleared at it. PJM&rsquo;s own
          number for where the price{' '}
          <a href="https://www.utilitydive.com/news/pjm-interconnection-capacity-auction-data-center/808264/">would have cleared without the cap</a>:{' '}
          about <strong>$530/MW-day</strong>, or 60% higher. The cap was negotiated last year with
          Pennsylvania governor Josh Shapiro to keep retail bills from another step-change. So
          $333.44 is what the bidders got. $530 is what the market said. And the gap between those two
          numbers is being held back by a single politically negotiated lid that is currently not
          scheduled to renew.
        </P>

        <P>
          Two other things in the same report I keep returning to.{' '}
          <a href="https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2027-2028/2027-2028-bra-report.pdf">It was the first auction</a>{' '}
          in which the <em>entire</em> RTO &mdash; including Fixed Resource Requirement areas &mdash;
          fell short of the reliability requirement. And 809.6 MW of capacity offered above the cap
          didn&rsquo;t clear at all. That is the polite engineering way of saying: at the price
          the system is allowed to print, the supply isn&rsquo;t there.
        </P>

        <H2>The shape of the demand</H2>

        <P>
          The reason isn&rsquo;t fuel costs. It isn&rsquo;t weather. It&rsquo;s the demand curve.
          U.S. data center electricity use went from{' '}
          <a href="https://www.energy.gov/articles/doe-releases-new-report-evaluating-increase-electricity-demand-data-centers">58 TWh in 2014 to 176 TWh in 2023</a>{' '}
          &mdash; about 4.4% of national electricity. DOE&rsquo;s own report puts the 2028 range at{' '}
          <strong>325 to 580 TWh</strong>, somewhere between 6.7% and 12% of the whole U.S. grid.
          And it&rsquo;s not spread evenly:{' '}
          <a href="https://www.cnbc.com/2025/11/14/data-centers-are-concentrated-in-these-states-heres-whats-happening-to-electricity-prices-.html">15 states absorb roughly 80% of that load</a>{' '}
          &mdash; Virginia first, Texas second, California third &mdash; and the top three sit
          inside the PJM and ERCOT footprints where the capacity prices are spiking hardest.
        </P>

        <Fig caption={<>Source: <a href="https://www.energy.gov/articles/doe-releases-new-report-evaluating-increase-electricity-demand-data-centers">U.S. Department of Energy &mdash; 2024 Report on U.S. Data Center Energy Use</a> (58 TWh in 2014, 176 TWh in 2023, projected 325&ndash;580 TWh by 2028). The 2028 range is DOE&rsquo;s own low and high scenarios, not a single point estimate.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222014%22%2C%222023%22%2C%222028+%28low+scenario%29%22%2C%222028+%28high+scenario%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22U.S.+data+center+electricity+%28TWh%2Fyr%29%22%2C%22data%22%3A%5B58%2C176%2C325%2C580%5D%2C%22backgroundColor%22%3A%5B%22%23bbbbbb%22%2C%22%235a5a5a%22%2C%22%233a3a3a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+data+center+electricity+use%3A+2014%2C+2023%2C+and+the+2028+forecast+band+%28TWh%2Fyr%29%22%2C%22fontSize%22%3A14%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22fontSize%22%3A11%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Annual+electricity+use+%28TWh%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"

        <H2>Two scoreboards, same supply problem</H2>

        <P>
          I run a data company. The thing I keep staring at here isn&rsquo;t the absolute number. It&rsquo;s
          the fact that the U.S. has two scoreboards measuring the same grid stress and they don&rsquo;t
          look anything alike. The retail bill is a 5% bar. The capacity market is a 1,000%-and-counting
          bar. And the only reason those two charts aren&rsquo;t closer together is a temporary cap that
          could lapse with the next auction cycle.
        </P>

        <Callout label="The data-pipeline read">
          Retail electricity is a backward-looking measurement. It lags fuel prices, capacity decisions,
          and PUC rate filings by 12 to 24 months. The PJM capacity auction is a three-year-forward
          procurement. If you wanted to know in 2024 what your bill was going to do in 2027, the
          right place to look was the BRA &mdash; not your utility&rsquo;s rate sheet.
        </Callout>

        <P>
          And the capacity signal is being intentionally clipped. The Shapiro cap is doing the
          equivalent of taping over a sensor that&rsquo;s reading too high. The reading the regulators
          got was $333.44. The reading the market actually wanted to print was $530. Both are real
          numbers about the same underlying scarcity. Only one of them is making it into the public
          chart.
        </P>

        <P>
          The 5% on the EIA Short-Term Energy Outlook is the autopsy. The PJM auction is the
          diagnosis. The bill in your mailbox isn&rsquo;t the leading indicator. It&rsquo;s the receipt.
        </P>

        <Divider />

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://www.eia.gov/outlooks/steo/">EIA &mdash; Short-Term Energy Outlook (May 2026)</a> (residential price 18.2&cent;/kWh, ~5% YoY rise)</>,
          <><a href="https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2024-2025/2024-2025-base-residual-auction-report.ashx">PJM &mdash; 2024/2025 Base Residual Auction Report</a> ($28.92/MW-day rest-of-RTO Capacity Performance clearing price)</>,
          <><a href="https://www.spglobal.com/energy/en/news-research/latest-news/electric-power/073024-pjm-power-capacity-auction-clears-at-record-high-price-of-26992mw-day-for-most-of-footprint">S&amp;P Global &mdash; PJM 2025/26 clears at $269.92/MW-day</a></>,
          <><a href="https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2026-2027/2026-2027-bra-report.pdf">PJM &mdash; 2026/2027 Base Residual Auction Report</a> ($329.17/MW-day for the entire footprint at the FERC-approved cap)</>,
          <><a href="https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2027-2028/2027-2028-bra-report.pdf">PJM &mdash; 2027/2028 Base Residual Auction Report (Dec 17, 2025)</a> ($333.44/MW-day at the cap, $16.4B total auction value, 809.6 MW didn&rsquo;t clear, first auction with RTO-wide reliability shortfall)</>,
          <><a href="https://insidelines.pjm.com/pjm-auction-procures-134479-mw-of-generation-resources/">PJM Inside Lines &mdash; Auction Procures 134,479 MW</a></>,
          <><a href="https://www.utilitydive.com/news/pjm-interconnection-capacity-auction-data-center/808264/">Utility Dive &mdash; PJM capacity prices hit record high as grid operator falls short of reliability target</a> (PJM&rsquo;s estimate that the uncapped 2027/28 price would have been near $530/MW-day, ~60% higher)</>,
          <><a href="https://www.energy.gov/articles/doe-releases-new-report-evaluating-increase-electricity-demand-data-centers">U.S. DOE &mdash; 2024 Report on U.S. Data Center Energy Use</a> (58 TWh in 2014; 176 TWh in 2023; 325&ndash;580 TWh projected for 2028; 4.4% of U.S. electricity in 2023 rising to 6.7&ndash;12% by 2028)</>,
          <><a href="https://www.cnbc.com/2025/11/14/data-centers-are-concentrated-in-these-states-heres-whats-happening-to-electricity-prices-.html">CNBC &mdash; Data centers are concentrated in these states</a> (the 15 states absorbing ~80% of U.S. data center load, EPRI source)</>,
        ]} />

        <P>
          <em>&mdash; TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

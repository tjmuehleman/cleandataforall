// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          North Carolina public schools served <a href="https://www.ednc.org/market-share-declines-for-homeschools-increases-for-private-schools-holds-steady-for-public-schools-overall/" target="_blank" rel="noopener">1,533,869 students in 2025-26</a>. That is 84% of every student in the state. Same 84% as last year. Same 84% as the year before. Three years into a universal private school voucher, the market share number has not moved a tick.
        </P>

        <P>
          Both sides of that fight predicted it would. Neither got it. Fine &mdash; that&rsquo;s a real finding, and a boring one.
        </P>

        <P>
          The number underneath it is the one that got written up. Registered homeschools fell from <a href="https://www.doa.nc.gov/divisions/non-public-education/home-school-statistics" target="_blank" rel="noopener">101,880 to 95,190</a>, a drop of 6,690 in a single year. Estimated homeschool students fell from 165,243 to 152,897 &mdash; 12,346 kids, down 7.5%. Private schools gained <a href="https://www.carolinajournal.com/nc-private-schools-post-biggest-jump-in-four-decades-amid-voucher-boom/" target="_blank" rel="noopener">8,260 students and 67 schools</a> in the same window, the largest one-year jump in the number of private schools in more than four decades.
        </P>

        <P>
          The story writes itself. The voucher turned the kitchen table into a tuition invoice.
        </P>

        <P>
          Except.
        </P>

        <H2>Somebody cleaned the registry</H2>

        <P>
          During the 2025-26 school year, DNPE went through its files and closed out homeschools that had gone inactive over the years but were <a href="https://nche.com/stats/" target="_blank" rel="noopener">never officially closed</a>. Some got flipped to inactive because a family hadn&rsquo;t updated their online portal info, or hadn&rsquo;t answered an email asking whether the school still existed. Some families report being marked inactive in error.
        </P>

        <P>
          So part of the 6,690 is families who stopped homeschooling and part of it is a database that finally got weeded. Nobody has published the split. It might be mostly real. I have no idea, and that&rsquo;s the whole problem &mdash; neither does anyone quoting the number.
        </P>

        <Callout label="What changed">
          The registration count is a hard number. What changed this year wasn&rsquo;t only how many people homeschool. It was also who was still on the list.
        </Callout>

        <H2>The multiplier is bigger than the finding</H2>

        <P>
          North Carolina does not count homeschool students. State law doesn&rsquo;t require homeschools to report enrollment, so <a href="https://www.doa.nc.gov/divisions/non-public-education/home-school-statistics" target="_blank" rel="noopener">DNPE</a> counts registered schools and multiplies by about 1.6 to get kids. North Carolinians for Home Education says <a href="https://nche.com/stats/" target="_blank" rel="noopener">the right multiplier is 2</a>.
        </P>

        <Fig caption={<>Reported figures from <a href="https://www.ednc.org/market-share-declines-for-homeschools-increases-for-private-schools-holds-steady-for-public-schools-overall/" target="_blank" rel="noopener">EdNC</a>. The two right bars are arithmetic on the 95,190 registered homeschools in the <a href="https://www.doa.nc.gov/dnpe/dnpe-home-school-annual-report-2025-26/download?attachment" target="_blank" rel="noopener">2025-26 DNPE report</a>: 95,190 &times; 1.6 = 152,304 (DNPE&rsquo;s own multiplier) and 95,190 &times; 2.0 = 190,380 (<a href="https://nche.com/stats/" target="_blank" rel="noopener">NCHE&rsquo;s</a>).</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222024-25+reported%22%2C%222025-26+reported%22%2C%2295%2C190+x+1.6+%28DNPE%29%22%2C%2295%2C190+x+2.0+%28NCHE%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Estimated+students%22%2C%22data%22%3A%5B165243%2C152897%2C152304%2C190380%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%2C%22%235a5a5a%22%2C%22%23bbb%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+homeschool+decline+is+smaller+than+the+argument+over+the+multiplier%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A200000%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Estimated+NC+homeschool+students%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart comparing estimated North Carolina homeschool student counts: 165,243 reported for 2024-25, 152,897 reported for 2025-26, 152,304 from 95,190 times 1.6, and 190,380 from 95,190 times 2.0." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          The distance between those two assumptions is 38,076 students. The year-over-year decline everyone is writing about is 12,346. The argument about the multiplier is three times the size of the finding the multiplier produced.
        </P>

        <P>
          DNPE says the quiet part on its own stats page. Enrollment data &ldquo;reflects a snapshot in time&rdquo; of numbers &ldquo;self-reported by the home schools,&rdquo; and &ldquo;may not be current.&rdquo;
        </P>

        <H2>The losses are in the wrong counties</H2>

        <P>
          If a voucher were converting homeschoolers into private school students, the two county maps should be near mirror images. They aren&rsquo;t. Estimated homeschool enrollment <a href="https://www.carolinajournal.com/nc-private-schools-post-biggest-jump-in-four-decades-amid-voucher-boom/" target="_blank" rel="noopener">grew</a> in Wake, Guilford, Forsyth, Mecklenburg, Johnston, and Iredell &mdash; the same metro counties where private school growth was strongest.
        </P>

        <P>
          The steep losses are in the mountains, a year after Helene. Buncombe fell 24.6%, from 4,846 to 3,655, and its registered homeschools went from 3,121 to 2,362. Fifteen mountain counties produced roughly 23% of the statewide drop while holding about 12% of the state&rsquo;s homeschoolers.
        </P>

        <P>
          That is not a voucher pattern. That is a hurricane and a filing cabinet.
        </P>

        <H2>Read the footnotes</H2>

        <P>
          EdNC published its market share table with a note saying it isn&rsquo;t sure why the number on page 1 of DPI&rsquo;s Budget Highlights runs 20 higher than its own public school subtotal, or why page 1 disagrees with page 7. That&rsquo;s a careful newsroom flagging a discrepancy in the state budget document, in public, because there was nowhere else to put it.
        </P>

        <P>
          And the <a href="https://www.doa.nc.gov/dnpe/dnpe-home-school-annual-report-2025-26/download?attachment" target="_blank" rel="noopener">DNPE 2025-26 homeschool report</a> &mdash; the document everybody cited &mdash; carries an age-by-age enrollment table whose column header reads &ldquo;23-24.&rdquo; The total under that header is 152,897. This year&rsquo;s number, last year&rsquo;s label, in the file of record.
        </P>

        <Divider />

        <P>
          Three years of universal vouchers and the cleanest sentence anyone can write about North Carolina is that the public share held at 84%. The state has a <a href="https://www.ednc.org/market-share-declines-for-homeschools-increases-for-private-schools-holds-steady-for-public-schools-overall/" target="_blank" rel="noopener">published goal of 89% by 2030</a>, so at least that one has a scoreboard.
        </P>

        <P>
          Everything below the 84% line is a registration count times a number somebody picked.
        </P>

      </article>
    </Prose>
  </Container>
);

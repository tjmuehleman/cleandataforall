const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">
        <P>
          On September 10, Washington’s state superintendent put out the 2026 test results and said scores had <a href="https://ospi.k12.wa.us/about-ospi/news-center/news-releases/state-superintendent-chris-reykdal-unveils-new-student-achievement-data-and-budget-priorities" target="_blank" rel="noopener">“remained steady”</a> compared to the year before. He’s right. I checked.
        </P>

        <P>
          The release leads with <a href="https://ospi.k12.wa.us/about-ospi/news-center/news-releases/state-superintendent-chris-reykdal-unveils-new-student-achievement-data-and-budget-priorities" target="_blank" rel="noopener">73.7% of students showing “foundational grade-level knowledge and above” in English language arts, and 66.5% in math</a>. That’s Levels 2 through 4 on a four-level test. The Education Data Center read the same results with the top two levels counted as proficient and got <a href="https://statetestscoreresults.substack.com/p/washington-2026-assessment-results" target="_blank" rel="noopener">50.9% for grades 3-8 reading, down from 51.2%</a>.
        </P>

        <P>
          Seventy-four or fifty-one. I went in assuming the generous bar was hiding something. It isn’t. I pulled OSPI’s <a href="https://data.wa.gov/education/Report-Card-Assessment-Data-2025-26-School-Year/fusr-6kv7" target="_blank" rel="noopener">2025-26 file</a> and <a href="https://data.wa.gov/education/Report-Card-Assessment-Data-2024-25-School-Year/qh4i-zmju" target="_blank" rel="noopener">2024-25 file</a> and ran both lines for all tested grades. Reading went from 74.0% to 73.7% at Levels 2-4, and from 53.1% to 52.8% at Levels 3-4. Down three-tenths of a point either way. The bar you pick moves the number 21 points. It doesn’t move the trend at all.
        </P>

        <Fig caption={<>Source: OSPI Report Card Assessment Data, <a href="https://data.wa.gov/education/Report-Card-Assessment-Data-2025-26-School-Year/fusr-6kv7" target="_blank" rel="noopener">2025-26</a> and <a href="https://data.wa.gov/education/Report-Card-Assessment-Data-2024-25-School-Year/qh4i-zmju" target="_blank" rel="noopener">2024-25</a>, State Total rows, Smarter Balanced, all students, all tested grades. Levels 2-4 is the state’s “foundational grade-level knowledge and above” column; Levels 3-4 is “consistent grade-level knowledge and above.” Rounded to one decimal.</>}>
          <img src={CHART2} alt="Grouped bar chart of Washington statewide results in 2025 and 2026. Reading at Levels 2-4: 74.0 then 73.7 percent. Reading at Levels 3-4: 53.1 then 52.8. Math at Levels 2-4: 66.3 then 66.5. Math at Levels 3-4: 42.6 then 43.1." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>Now the districts</H2>

        <P>
          The stat from that same analysis that’s going to end up in a slide deck: <a href="https://statetestscoreresults.substack.com/p/washington-2026-assessment-results" target="_blank" rel="noopener">of 186 districts with reportable reading results in all six grades, two improved in every one</a>. Federal Way and Central Valley. And the next slide is going to say “what are those two doing right?”
        </P>

        <P>
          Before anybody books a site visit, do the coin math. Six grades, each one either up or down. If every grade were a coin flip, six heads in a row is 1 in 64. And 186 divided by 64 is about three. A state full of coins gives you three perfect districts. Washington had two.
        </P>

        <P>
          I reran it on the current file (OSPI refreshed it November 10, and I kept every district with a published rate in all six grades both years, which gets me 213 instead of 186. Different cut, same two districts). Then I counted how many grades went up in each one. That’s the chart at the top. 69 districts improved in exactly three grades; the coin says 67. 20 improved in exactly one; the coin says 20. Five went zero for six; the coin says three.
        </P>

        <P>
          Grades inside one district aren’t really independent coins, so call this a sniff test. But it smells like a coin.
        </P>

        <H2>Why it’s this noisy</H2>

        <P>
          The statewide grades 3-8 reading number is about 464,000 tested kids, and it moved 0.3 points. Across those 213 districts there are 1,278 district-grade results. The median one moved 4.2 points, up or down. 44% moved five or more. The median district-grade in that pile is 159 tested kids, and the smallest is 11. And (this is the part that gets lost) it’s a different batch of kids every year. This year’s fourth graders aren’t last year’s fourth graders.
        </P>

        <P>
          One of Central Valley’s six gains is fourth grade going from 58.0% to 58.0%. 588 of 1,014 kids one year, 645 of 1,112 the next. Technically up. It counts!
        </P>

        <P>
          I’m not saying nothing happened in Federal Way. Third grade there went from 32.1% to 36.4%, and <a href="https://statetestscoreresults.substack.com/p/washington-2026-assessment-results" target="_blank" rel="noopener">both districts were also up in five of six grades in math</a>. Maybe that’s real. I’m saying six for six can’t tell you, because six for six is what two or three districts get for showing up.
        </P>

        <Divider />

        <P>
          So Washington’s boring number is the honest one, at both bars. The exciting one is made of 1,278 results bouncing four points apiece. Want to know which districts got better? Ask again in 2028. Or flip a coin. It’s cheaper.
        </P>

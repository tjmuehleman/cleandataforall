const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Cleveland is closing or merging 29 schools. Philadelphia 17. Atlanta 16. Pittsburgh and
          Houston 12 apiece.
        </P>

        <P>
          Those are real, and I can point you at the board vote for every one of them. What I can&rsquo;t
          point you at is the national number everybody spent the summer quoting.
        </P>

        <P>
          The headline is that more than 1,000 public schools closed during 2025&ndash;26, up 35% from 755
          four years earlier. The 755 is real. It comes from{' '}
          <a href="https://nces.ed.gov/fastfacts/display.asp?id=619" target="_blank" rel="noopener">NCES Table 216.95</a>,
          which counts closed public schools by year. Go look at the table. 755 is the last column.
        </P>

        <P>
          Literally the last column. The series runs 2010&ndash;11 through 2021&ndash;22 and then stops.
          NCES&rsquo;s own Fast Facts page still cites it as retrieved in October 2023.
        </P>

        <H2>755 is not a baseline. It&rsquo;s a trough.</H2>

        <P>
          Look at the rest of the row before anybody says record. 2010&ndash;11: 1,741 closures.
          2013&ndash;14: 1,644. 2017&ndash;18: 1,310. Every single year from 2010&ndash;11 through
          2019&ndash;20 came in over 1,000. Then 2020&ndash;21 fell to 865 and 2021&ndash;22 to 755 &mdash;
          the two lowest years on the whole table, in a stretch when districts were sitting on federal
          relief money and nobody wanted to be the board member who closed a school during a pandemic.
        </P>

        <P>
          So &ldquo;1,000 closures, up 35%&rdquo; is a 2026 hand-count measured against the quietest year
          in the file. It might still be a lot of closures. It is not, on this evidence, more than 2011.
        </P>

        <H2>And a closed school isn&rsquo;t a closed building</H2>

        <P>
          NCES puts this right underneath the table, and almost nobody quotes it:
        </P>

        <BQ cite="NCES, Digest of Education Statistics, Table 216.95">
          The closure of a school does not necessarily mean that a building is no longer used for
          educational purposes. A single school may share a building with another school, or one school
          may be housed in several buildings.
        </BQ>

        <P>
          There goes the paradox. A closure in this dataset is an administrative event &mdash; a school ID
          stops showing up in the directory. Pittsburgh&rsquo;s plan{' '}
          <a href="https://www.k12dive.com/news/public-schools-closure-tracker-enrollment/809364/" target="_blank" rel="noopener">closes 12 schools and opens two new ones plus an early childhood center</a>.
          Miami-Dade&rsquo;s nine consolidations produce a new K-8, two 6&ndash;12 academies and a new K-12.
          Closures in the data, construction on the ground, same district, same vote.
        </P>

        <H2>The construction number doesn&rsquo;t reconcile either</H2>

        <P>
          The figure going around is $89.2 billion. Census doesn&rsquo;t publish a line that says that.
          What Census publishes is{' '}
          <a href="https://www.census.gov/construction/c30/pdf/release.pdf" target="_blank" rel="noopener">Value of Construction Put in Place</a>,
          and in the June 2026 release public educational construction is running at a $113.1 billion
          seasonally adjusted annual rate &mdash; 0.2% above June 2025. Flat.
        </P>

        <P>
          Read one section down in the same release, the not-seasonally-adjusted year-to-date, and public
          educational construction for January through June 2026 is $54.0 billion against $56.0 billion
          for the same months of 2025. Down 3.6%.
        </P>

        <Callout label="Same release, same day">
          Public educational construction, U.S. Census Bureau, released August 3, 2026. Seasonally
          adjusted annual rate: $113.079B in June 2026 vs $112.873B in June 2025, +0.2%. Not seasonally
          adjusted, January&ndash;June: $54.016B in 2026 vs $56.014B in 2025, &minus;3.6%. Neither cut
          says record.
        </Callout>

        <Fig caption={<>Source: <a href="https://www.k12dive.com/news/public-schools-closure-tracker-enrollment/809364/" target="_blank" rel="noopener">K-12 Dive closure tracker</a>, updated June 23, 2026. Board-approved plans only, with effective dates ranging from the end of 2025&ndash;26 through 2027&ndash;28. Counts sum to 147.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Cleveland%22%2C%22Philadelphia%22%2C%22Atlanta%22%2C%22Pittsburgh%22%2C%22Houston%22%2C%22Austin%22%2C%22Miami-Dade%22%2C%22Cedar+Rapids%22%2C%22Fort+Bend%22%2C%22Corpus+Christi%22%2C%22Broward%22%2C%22Kyrene%22%2C%22San+Jose%22%2C%22Judson%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B29%2C17%2C16%2C12%2C12%2C10%2C9%2C7%2C7%2C7%2C6%2C6%2C5%2C4%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Board-approved+closures+or+consolidations%3A+147+across+14+districts%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Schools+to+be+closed+or+consolidated%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=520&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of board-approved school closures or consolidations by district: Cleveland 29, Philadelphia 17, Atlanta 16, Pittsburgh 12, Houston 12, Austin 10, Miami-Dade 9, Cedar Rapids 7, Fort Bend 7, Corpus Christi 7, Broward 6, Kyrene 6, San Jose 5, Judson 4."
            style={{ width:'100%', height:'auto', display:'block' }}
          />
        </Fig>

        <P>
          That chart is the dataset I actually trust: 147 board-approved closures across 14 districts,
          each one with a date, a vote and a savings estimate, hand-tracked by a trade publication. Good
          data. Also fourteen districts out of roughly 13,300 regular school districts.
        </P>

        <H2>The enrollment side holds up</H2>

        <P>
          Fall 2024 public school enrollment was{' '}
          <a href="https://www.k12dive.com/news/nces-reports-show-enrollment-rebound-among-youngest-students/822063/" target="_blank" rel="noopener">49.4 million against a pre-pandemic 50.8 million</a>.
          Fall 2023 was{' '}
          <a href="https://ies.ed.gov/learn/press-release/nces-data-show-public-school-enrollment-held-steady-overall-fall-2022-fall-2023" target="_blank" rel="noopener">49.5 million, 2.5% below 2019</a>,
          with PK&ndash;8 down 4.5% and grades 9&ndash;12 actually up about 2%. The kids left the
          elementary schools. That part is not in dispute.
        </P>

        <P>
          But notice the vintage. That fall 2024 figure comes from the 2026 Condition of Education, which
          NCES released in May 2026 &mdash; roughly a month after it released the <em>2025</em> edition,
          which ran a year late after the agency missed its June 1 statutory deadline for the first time
          ever. Spending data in those same reports still runs through 2023.
        </P>

        <Divider />

        <P>
          So here&rsquo;s where we are. Boards are voting to close buildings in 2026 against national
          enrollment data from 2024, a closure baseline from 2022, and a construction series nobody has
          reconciled to either one. Then a reporter hand-counts the closures, because the federal count
          isn&rsquo;t coming, and the hand-count becomes the record.
        </P>

        <P>
          The closures are real. The wave is probably real. The record is a measurement artifact.
        </P>

      </article>
    </Prose>
  </Container>
);

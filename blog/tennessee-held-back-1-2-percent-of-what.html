const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">
        <P>
          Tennessee failed 60% of its third graders in reading and held back 1.2% of them.
        </P>

        <P>
          That’s the line that landed on my desk this week, and it’s a great line. It’s also two different fractions stapled together.
        </P>

        <P>
          Here’s year one of Tennessee’s retention law. After the spring 2023 test, <a href="https://www.tn.gov/education/news/2023/7/19/tdoe-releases-final-2023-tcap-3rd-grade-appeals-data-.html" target="_blank" rel="noopener">44,395 third graders were eligible for the TCAP retake</a>, which is the state’s way of saying they missed the bar. Tennessee had <a href="https://www.yahoo.com/news/only-1-2-tennessee-third-170025563.html" target="_blank" rel="noopener">nearly 74,000 third graders</a> that year. That’s your 60%. And in the end <a href="https://www.yahoo.com/news/only-1-2-tennessee-third-170025563.html" target="_blank" rel="noopener">898 were retained</a>. The 1.2% is <a href="https://www.yahoo.com/news/only-1-2-tennessee-third-170025563.html" target="_blank" rel="noopener">898 over every public school third grader</a>. Not over the 44,395. Divide by the kids who missed the bar and it’s 2.0%. Still tiny! But the sentence I opened with takes a percentage of one group and hangs it on the other.
        </P>

        <H2>Four states, four fractions</H2>

        <P>
          So fine, pick one denominator and compare states. I tried.
        </P>

        <P>
          Michigan’s numbers come from researchers at Michigan State, who reported it both ways: 545 kids retained for 2022-23, which is <a href="https://msutoday.msu.edu/news/2022/12/third-grade-reading-law-december-2022" target="_blank" rel="noopener">0.6% of all third graders and 9.6% of the 5,680 who were eligible</a>. Indiana’s state board says <a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">about 3.6%, roughly 3,000 students out of 84,163</a>. The same deck says 73,500 were proficient, which leaves 10,663 who weren’t, and <a href="https://indianapublicradio.org/news/2025/11/3000-indiana-students-repeat-third-grade-under-new-literacy-law/" target="_blank" rel="noopener">Indiana Public Radio’s count of 3,040 retained</a> works out to 28.5% of them. Louisiana gave reporters a count, <a href="https://www.wwno.org/education/2026-02-12/less-than-3-of-louisiana-third-graders-held-back-under-new-law" target="_blank" rel="noopener">1,388</a>, and a headline figure of under 3%. The story never prints the total. It does say <a href="https://www.wwno.org/education/2026-02-12/less-than-3-of-louisiana-third-graders-held-back-under-new-law" target="_blank" rel="noopener">nearly 12,000 kids were at risk before the last retest</a>, which would put it around 12%, and that <a href="https://www.wwno.org/education/2026-02-12/less-than-3-of-louisiana-third-graders-held-back-under-new-law" target="_blank" rel="noopener">“the state did not provide the share of students who received exemptions.”</a>
        </P>

        <P>
          1.2%, 0.6%, 3.6%, under 3%. Or 2%, 9.6%, 28.5%, 12ish. Same kids. (Different school years too, which doesn’t help.)
        </P>

        <H2>The bar isn’t the same bar</H2>

        <P>
          Here’s the part that got me. I figured “percent of the kids who missed the bar” was the honest version. It isn’t, because every state hangs the bar somewhere else. Tennessee’s pool was 60% of the grade. Indiana’s was 12.7% (100 minus <a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">87.3% proficient</a>). Michigan only flagged kids who <a href="https://msutoday.msu.edu/news/2024/06/new-msu-report-on-michigan-read-by-grade-three-law" target="_blank" rel="noopener">scored 1252 or below on the state ELA test</a>, which was <a href="https://www.chalkbeat.org/detroit/2022/12/6/23496748/michigan-third-grade-reading-retention-held-back/" target="_blank" rel="noopener">5.8% of all third graders</a>.
        </P>

        <Fig caption={<>Tennessee: <a href="https://www.tn.gov/education/news/2023/7/19/tdoe-releases-final-2023-tcap-3rd-grade-appeals-data-.html" target="_blank" rel="noopener">44,395 retake-eligible</a> ÷ <a href="https://www.yahoo.com/news/only-1-2-tennessee-third-170025563.html" target="_blank" rel="noopener">nearly 74,000 third graders</a> = 60%. Indiana: 100 − <a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">87.3% proficient</a> = 12.7%. Michigan: <a href="https://www.chalkbeat.org/detroit/2022/12/6/23496748/michigan-third-grade-reading-retention-held-back/" target="_blank" rel="noopener">5.8% of third graders flagged for retention</a>.</>}>
          <img src={CHART2} alt="Horizontal bar chart of the share of all third graders who missed the retention bar: Tennessee 60 percent, Indiana 12.7 percent, Michigan 5.8 percent." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          That’s a tenfold spread in who’s even eligible. So Michigan holding back 9.6% of its pool and Tennessee holding back 2% of its pool tells you almost nothing about which state is tougher. Michigan’s pool is the very bottom of the class. Tennessee’s is most of the class.
        </P>

        <P>
          Tennessee did do one thing I love. It published the whole funnel, <a href="https://www.yahoo.com/news/only-1-2-tennessee-third-170025563.html" target="_blank" rel="noopener">counting each student in the first pathway they qualified for</a>: 12,056 into fourth-grade tutoring, 10,620 exempt for a disability or suspected disability, 7,146 on an approved parent appeal, 3,344 who passed the retake. Also 2,296 who were no longer enrolled, and 59 not accounted for. There’s a row for the kids nobody can find. That’s a real data team.
        </P>

        <P>
          Indiana gets close. <a href="https://indianapublicradio.org/news/2025/11/3000-indiana-students-repeat-third-grade-under-new-literacy-law/" target="_blank" rel="noopener">Indiana Public Radio has 6,950 exemptions and 3,040 retained</a>, which is 9,990, against those 10,663 kids who weren’t proficient. Somebody knows where the other 673 went. It isn’t in the deck.
        </P>

        <Divider />

        <P>
          I’m not gonna tell you whether holding back third graders is a good idea (smarter people than me are fighting about that right now). But they’re fighting with numbers that can’t be lined up. What I’d want is boring: kids retained, over kids below the line, with the line written down, the same way in every state.
        </P>

        <P>
          Every state counted the kids it held back. Nobody agreed on what to divide by.
        </P>

        <H3>Sources</H3>

        <UL items={[
          <><a href="https://www.tn.gov/education/news/2023/7/19/tdoe-releases-final-2023-tcap-3rd-grade-appeals-data-.html" target="_blank" rel="noopener">Tennessee Department of Education, “TDOE Releases Final 2023 TCAP 3rd Grade Appeals Data,” July 19, 2023 (44,395 retake-eligible)</a></>,
          <><a href="https://www.yahoo.com/news/only-1-2-tennessee-third-170025563.html" target="_blank" rel="noopener">The Tennessean (via Yahoo), “Only 1.2% of Tennessee third graders held back after reading law rollout,” Nov. 1, 2023 (898 retained, pathway counts from TDOE’s report)</a></>,
          <><a href="https://msutoday.msu.edu/news/2022/12/third-grade-reading-law-december-2022" target="_blank" rel="noopener">MSU Today, EPIC report on Read by Grade Three retention decisions, December 2022 (545 retained, 0.6% and 9.6%)</a></>,
          <><a href="https://msutoday.msu.edu/news/2024/06/new-msu-report-on-michigan-read-by-grade-three-law" target="_blank" rel="noopener">MSU Today, “New MSU report on Michigan Read by Grade Three law,” June 2024 (1252 cut score)</a></>,
          <><a href="https://www.chalkbeat.org/detroit/2022/12/6/23496748/michigan-third-grade-reading-retention-held-back/" target="_blank" rel="noopener">Chalkbeat Detroit, Dec. 6, 2022 (5.8% of third graders flagged)</a></>,
          <><a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">Indiana State Board of Education, Reading Update, Nov. 5, 2025 (84,163 tested, 73,500 proficient, 3.6% retained)</a></>,
          <><a href="https://indianapublicradio.org/news/2025/11/3000-indiana-students-repeat-third-grade-under-new-literacy-law/" target="_blank" rel="noopener">Indiana Public Radio, “3,000 Indiana students repeat third grade under new literacy law,” Nov. 6, 2025 (3,040 retained, 6,950 exemptions)</a></>,
          <><a href="https://www.wwno.org/education/2026-02-12/less-than-3-of-louisiana-third-graders-held-back-under-new-law" target="_blank" rel="noopener">WWNO, “Less than 3% of Louisiana third graders held back under new law,” Feb. 12, 2026 (1,388 retained, nearly 12,000 at risk)</a></>,
        ]} />

        <P><em>— TJ</em></P>

      </article>
    </Prose>
  </Container>
);

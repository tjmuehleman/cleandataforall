const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Kansas math got better last year. The state department of education says so, the commissioner called the results encouraging, and the number holds up: students at Levels 3 and 4 went up 2.27 points while Level 1 fell 1.8 points (<a href="https://www.ksal.com/kansas-english-math-scores-improve/">KSAL, Oct. 19, 2026</a>).
        </P>

        <P>
          Here's the part the release says out loud and then moves past. Kansas introduced a new assessment in spring 2025 and developed new cut scores for it. That makes 2025 to 2026 the <em>only</em> year-over-year comparison the new test has ever had. One change. Everything before it was measured with a different ruler.
        </P>

        <H2>The ruler</H2>

        <P>
          The old scale ran 220 to 380, with cut scores that varied by grade and subject. The new one runs 400 to 700, and Level 3 starts at 540 for every grade and subject. The state board voted 7–3 to reset them, the first change since 2016, and education leaders said ahead of time that the results would not be comparable to past years (<a href="https://www.kcur.org/2025-08-28/not-lowering-standards-kansas-education-leaders-adopt-new-scale-for-state-tests">KCUR, Aug. 28, 2025</a>). The department's own September 2025 preview described the two years of scores as linked but not interchangeable, and noted the 2025 tests had fewer items than 2024's (<a href="https://www.ksde.gov/Home/Quick-Links/News-Room/ArtMID/3386/ArticleID/4532/State-Board-to-receive-state-assessment-score-reports">KSDE, Sept. 4, 2025</a>).
        </P>

        <H2>Two headlines, a year apart</H2>

        <P>
          You can find "highest math scores since 2017" on KSDE's site. It is dated October 10, 2023, and it's about Level 4 math on the old test: 10.01% that year, up from 8.66% (<a href="https://www.ksde.gov/Home/Quick-Links/News-Room/ArtMID/3386/ArticleID/2558/Commissioner-Watson-Kansas-math-assessment-scores-highest-since-2017">KSDE</a>). You can also find the Kansas Policy Institute's "scores tank again." That one is October 20, 2024, and its evidence is math Level 1 going from 33.1% to 33.2% (<a href="https://kansaspolicy.org/no-october-surprise-state-assessment-scores-tank-again/">KPI</a>). Easy to read them as opposite takes on the same file. They aren't. They're a year apart, and both predate the new test.
        </P>

        <Fig caption={<>Black bars: old test. Grey bars: new test. 2018–2023 from <a href="https://www.ksde.gov/Home/Quick-Links/News-Room/ArtMID/3386/ArticleID/2558/Commissioner-Watson-Kansas-math-assessment-scores-highest-since-2017">KSDE</a>; 2025 and 2026 (grades 3–8) from <a href="https://statetestscoreresults.substack.com/p/kansas-2026-assessment-results">State Test Score Results</a>. 2024 left blank, no primary figure pulled.</>}>
          <img src={CHART2} alt="Bar chart of the share of Kansas students at math Level 4: 9.14% in 2018, 7.82% in 2021, 8.66% in 2022, 10.01% in 2023, 11.9% in 2025, 13.0% in 2026." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>The seam</H2>

        <P>
          Now look at what happens in the gap. Level 1 math sat at 33.13% in 2023 and 28.0% in 2025. Level 4 went from 10.01% to 11.9%. Both moved in the "good" direction across a seam that no policy explains and that the 2026 release never mentions (the scope of the 2023 and 2025 figures differs a bit, so treat the exact gap as rough).
        </P>

        <P>
          That is also what a bar sliding downward looks like. It's also what a misaligned old test looks like, which is KSDE's explanation, and the department says it did not reduce rigor (<a href="https://www.ksde.gov/Home/Quick-Links/News-Room/ArtMID/3386/ArticleID/4471/State-Board-approves-new-cut-scores-for-spring-2025-state-assessments">KSDE, Aug. 14, 2025</a>). Both could be partly true. From the public files I can't tell how much of the 2023 to 2025 move is kids and how much is ruler. A concordance table is supposed to answer that, and KSDE said it would go to the board. I couldn't find it sitting next to the 2026 numbers.
        </P>

        <Divider />

        <P>
          The release gives changes, not levels. That's a fair choice, since a one-year change is the only trend the new test can honestly show. It's also a very short story. Two data points make a line. They don't make a trend. Ask me again in 2028.
        </P>

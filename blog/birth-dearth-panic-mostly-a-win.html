      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%2215%5Cu201319%22%2C%2220%5Cu201324%22%2C%2225%5Cu201329%22%2C%2230%5Cu201334%22%2C%2235%5Cu201339%22%2C%2240%5Cu201344%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B-7.1%2C-6.5%2C-4.4%2C2.7%2C1.5%2C0.8%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23777%22%2C%22%23777%22%2C%22%23777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Change+in+U.S.+birth+rate+by+age+of+mother%2C+2024+to+2025%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-8%2C%22max%22%3A4%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+change+in+births+per+1%2C000+women%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of the percent change in U.S. birth rate by age of mother from 2024 to 2025. Teens 15-19 down 7.1 percent, 20-24 down 6.5 percent, 25-29 down 4.4 percent, 30-34 up 2.7 percent, 35-39 up 1.5 percent, 40-44 up 0.8 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The most-panicked-about number in America right now is a single index: 53.1. That&rsquo;s the general fertility rate &mdash; births per 1,000 women ages 15 to 44 &mdash; and in 2025 it hit <a href="https://www.cdc.gov/nchs/pressroom/releases/20260409.html">another record low</a>, down 23% since 2007. Cue the coverage: birth dearth, pronatalism, replacement rate, civilizational doom.
        </P>

        <P>
          Here&rsquo;s the thing about a single index number. It&rsquo;s an average. And averages launder composition.
        </P>

        <H2>Open the table under the headline</H2>

        <P>
          CDC publishes a table right below that press release &mdash; <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">births by age of mother</a> &mdash; and the &ldquo;collapse&rdquo; resolves into something stranger and, frankly, better than the panic suggests. The teen birth rate fell to <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">11.7 births per 1,000</a> women ages 15&ndash;19 in 2025. Another record low. Down 7% in a year, down 72% since 2007, down 81% since its 1991 peak. That is not a rounding blip. That is one of the largest sustained public-health shifts in modern American data, and almost nobody in the birth-dearth discourse is citing it.
        </P>

        <P>
          Meanwhile, at the other end of the table, the rate for women 30&ndash;34 went <em>up</em> &mdash; from 93.7 to <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">96.2 per 1,000</a>. Women 35&ndash;39 rose too. So did 40&ndash;44. The rates that fell were teens (down 7%), women 20&ndash;24 (down about 6%), women 25&ndash;29 (down about 4%). The rates that rose were everyone 30 and up.
        </P>

        <P>
          So read it one way &mdash; top line only &mdash; and Americans stopped having kids. Read it the honest way &mdash; down the age column &mdash; and American women stopped having them as teenagers and started having them in their thirties. The doom number and the triumph number are the same number. You just have to disaggregate to tell them apart.
        </P>

        <H2>A summary statistic is a decision about what to hide</H2>

        <P>
          I build these things for a living, and this is the part that gets under-appreciated. The general fertility rate collapses ten age-specific rates into one, weighted by population. Useful number. Also, structurally, incapable of telling you whether fertility <em>fell</em> or <em>moved</em>. Those are opposite stories with the same headline, and the only way to know which one you&rsquo;re looking at is to open the table most of the coverage didn&rsquo;t open.
        </P>

        <figure style={{ margin:'2.5em auto', maxWidth:900, textAlign:'center' }}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%2215%5Cu201319%22%2C%2220%5Cu201324%22%2C%2225%5Cu201329%22%2C%2230%5Cu201334%22%2C%2235%5Cu201339%22%2C%2240%5Cu201344%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B11.7%2C52.2%2C85.6%2C96.2%2C55.1%2C12.8%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23777%22%2C%22%235a5a5a%22%2C%22%23141210%22%2C%22%235a5a5a%22%2C%22%23777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+birth+rate+by+age+of+mother%2C+2025%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Births+per+1%2C000+women+in+age+group%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of the U.S. birth rate by age of mother in 2025. Rates per 1,000 women: 15-19 is 11.7, 20-24 is 52.2, 25-29 is 85.6, 30-34 is 96.2 (the highest), 35-39 is 55.1, 40-44 is 12.8." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
          <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10 }}>
            Source: CDC/NCHS, Births: Provisional Data for 2025 (VSRR No. 43, April 2026), Table 1. Age-specific birth rates per 1,000 women, 2025.
          </figcaption>
        </figure>

        <P>
          And once you do open it, the composition is unmistakable. In 2025 the highest birth rate of any age group in America belonged to women 30&ndash;34, at 96.2 per 1,000 &mdash; <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">higher than</a> women 25&ndash;29 (85.6) and more than eight times the teen rate (11.7). The 20-something mother used to be the modal American birth story. Now it&rsquo;s the 32-year-old. That&rsquo;s not a collapse. That&rsquo;s a calendar.
        </P>

        <Callout label="The births that didn't happen">
          There were <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">125,933 births</a> to women ages 15&ndash;19 in 2025, down 8% in a single year. In 2007, the teen rate was 41.5 per 1,000. In 2025 it&rsquo;s 11.7. Same country, a quarter of the teen births.
        </Callout>

        <Divider />

        <P>
          None of this makes the fertility decline fake. Births did fall 1%, to <a href="https://www.cdc.gov/nchs/pressroom/releases/20260409.html">3,606,400</a>, the lowest count in decades, and there are real questions downstream of that. But the biggest single driver of the long decline is teenagers not having babies &mdash; and we&rsquo;ve spent a decade treating the country&rsquo;s clearest public-health win like a demographic emergency. It&rsquo;s both, depending on which row you read. That&rsquo;s not a data problem. It&rsquo;s a reading problem.
        </P>

        <P><em>&mdash; TJ</em></P>

        <H2>Sources</H2>
        <UL items={[
          <span>CDC/NCHS, <a href="https://www.cdc.gov/nchs/data/vsrr/vsrr043.pdf">Births: Provisional Data for 2025 (VSRR No. 43, April 2026)</a> &mdash; Table 1 age-specific rates per 1,000 women: 15&ndash;19 = 11.7 (down 7% from 12.6, down 72% since 2007&rsquo;s 41.5, down 81% since 1991&rsquo;s 61.8); 20&ndash;24 = 52.2 (from 55.8); 25&ndash;29 = 85.6 (from 89.5); 30&ndash;34 = 96.2 (from 93.7); 35&ndash;39 = 55.1 (from 54.3); 40&ndash;44 = 12.8 (from 12.7). GFR 53.1, down 23% since 2007. 125,933 teen births, down 8%.</span>,
          <span>CDC/NCHS Pressroom, <a href="https://www.cdc.gov/nchs/pressroom/releases/20260409.html">U.S. Births down 1% in 2025 (April 9, 2026)</a> &mdash; 3,606,400 births in 2025, a 1% decline from 2024; general fertility rate 53.1, another record low; teen 15&ndash;19 rate 11.7, down 7%, a record low.</span>,
        ]} />

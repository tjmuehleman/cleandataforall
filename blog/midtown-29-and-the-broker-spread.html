// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Midtown Manhattan&rsquo;s prime office vacancy in Q1 2026 was{' '}
          <a href="https://www.cbre.com/insights/figures/q1-2026-us-office-market-report">2.9%</a>.
          The city most people declared dead in 2020 is &mdash; at the top of its market &mdash;
          tighter than it was pre-pandemic.
        </P>

        <P>
          Meanwhile, in Austin: <a href="https://partnersrealestate.com/research/austin-office-q1-2026-quarterly-market-report/">23.3%</a> per
          Partners Real Estate&rsquo;s Q1 report. Or <a href="https://www.commercialsearch.com/blog/austin-office-vacancy-climbs/">28.9%</a> per
          CommercialSearch the quarter before. Or somewhere around 26.7% if you read the mid-tier trackers.
          The same city, the same quarter, three brokers&rsquo; PDFs &mdash; six points of spread.
        </P>

        <P>
          That last paragraph is the actual story. Not the inversion. The spread.
        </P>

        <H2>The narrative did flip</H2>

        <P>
          The headline data flipped about a year ago and most readers haven&rsquo;t caught up.
          Manhattan&rsquo;s overall vacancy is now <a href="https://hubblehq.com/blog/new-york-office-report">13.1%</a> per Hubble&rsquo;s
          Q1 NYC report. Manhattan new leasing was{' '}
          <a href="https://hubblehq.com/blog/new-york-office-report">9.5 million square feet</a>{' '}
          &mdash; the highest quarterly total since Q2 2019. San Francisco posted{' '}
          <a href="https://www.cbre.com/insights/figures/san-francisco-office-figures-q1-2026">+2.27 million sq. ft. of positive net absorption</a>{' '}
          in Q1. National net absorption has been positive{' '}
          <a href="https://www.cbre.com/insights/figures/q1-2026-us-office-market-report">eight consecutive quarters</a>.
          The cities everyone said were dying have stopped dying.
        </P>

        <P>
          Austin is the inversion. <a href="https://partnersrealestate.com/research/austin-office-q1-2026-quarterly-market-report/">The Partners report says</a> that
          without the sale of the old 1.2 million sq. ft. 3M campus on River Place Blvd. &mdash; a single
          transaction that pulled a single building out of the inventory and into the data-center side
          of the ledger &mdash; Austin&rsquo;s net absorption would have been negative again.
          That kind of headline (&ldquo;Austin recovers!&rdquo;) with that kind of asterisk (&ldquo;if you
          don&rsquo;t count the deal that turned one office tower into a hyperscaler tenant&rdquo;) is exactly
          the kind of footnote most newsrooms shorten away.
        </P>

        <H2>Pick a broker, pick an Austin</H2>

        <P>
          Back to the spread. Three Q1 2026 reports on the same city, three different vacancy numbers,
          all from credible commercial real estate research desks. None of them is wrong. They&rsquo;re
          measuring different things and calling them the same thing.
        </P>

        <Fig caption={<>Source: <a href="https://partnersrealestate.com/research/austin-office-q1-2026-quarterly-market-report/">Partners Real Estate Q1 2026 Austin Office Report</a> (23.3%); aggregated mid-tier trackers cited in <a href="https://www.credaily.com/briefs/office-vacancy-rates-continue-to-rise-across-us-led-by-austin/">CRE Daily roll-ups</a> around the same window (~26.7%); <a href="https://www.commercialsearch.com/blog/austin-office-vacancy-climbs/">CommercialSearch / Avison Young</a> (28.9%). Same metro, same quarter, ~5.6 points of spread.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Partners+Real+Estate+%28Q1+2026%29%22%2C%22Aggregated+mid-tier+trackers+%28Q1+2026%29%22%2C%22CommercialSearch+%2F+Avison+Young+%28Q1+2026%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Vacancy+%25%22%2C%22data%22%3A%5B23.3%2C26.7%2C28.9%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23bbbbbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Same+city%2C+same+quarter%2C+three+brokers%27+Austin+vacancy%22%2C%22fontSize%22%3A16%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A32%2C%22stepSize%22%3A4%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Vacancy+rate+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=380&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of Austin Q1 2026 office vacancy as reported by three different brokers: Partners Real Estate 23.3 percent, aggregated mid-tier trackers 26.7 percent, CommercialSearch / Avison Young 28.9 percent."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          Three things drive the spread:
        </P>

        <UL items={[
          <>The <em>inventory definition</em>. Some firms count Class A, B, and C; some strip out sublease space; some include flex; some draw the metro boundary tighter than others. CBRE&rsquo;s top-markets table and Partners&rsquo; Austin metro are not the same denominator.</>,
          <>The <em>reporting date</em>. &ldquo;Q1&rdquo; can mean closed at March 31 or rolling through April 20. Two weeks of leases sign in either direction.</>,
          <>The <em>conversions</em>. Properties leave the inventory through data-center, residential, and demolition reclassifications at different rates depending on each firm&rsquo;s tracking cadence. The 3M campus is the cleanest example of the quarter.</>,
        ]} />

        <P>
          The flipside of the city headline lives one level down in the construction line, where the
          numbers don&rsquo;t spread. CBRE notes that Q1 2026 office construction completions hit{' '}
          <a href="https://www.cbre.com/insights/figures/q1-2026-us-office-market-report">1.3 million sq. ft. &mdash; the lowest quarterly total since CBRE began tracking the metric in 1990</a>.
          The under-construction pipeline is down{' '}
          <a href="https://www.cbre.com/insights/figures/q1-2026-us-office-market-report">87% from its Q2 2020 peak</a>.
          The trade pubs are calling this a &ldquo;25-year low.&rdquo; It is not. It&rsquo;s a 36-year
          low. Off by a decade, same direction.
        </P>

        <Callout label="The data-pipeline read">
          The structural story under the broker noise: any future demand uptick hits a construction line
          that has gone quiet for the first time since George H.W. Bush. Whether that&rsquo;s good for
          your city depends on which broker&rsquo;s PDF you opened &mdash; and what their inventory
          definition strips out.
        </Callout>

        <P>
          I run a data company. The thing I keep reading in office reports lately is the same thing I
          read in school district enrollment data and global health surveillance: the headline number is
          one operational decision deep. Change the inclusion criterion, change the cutoff date, count
          the sublease space differently &mdash; and the city is fine, or it isn&rsquo;t. If a national
          newspaper writes &ldquo;Austin is the worst office market in America,&rdquo; the next question
          is the only question: by whose count, and what&rsquo;s outside the count?
        </P>

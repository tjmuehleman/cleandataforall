const PostHero = () => (

      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
        Gallup&rsquo;s annual Crime poll, share of U.S. adults saying there was more crime in the U.S. than a year earlier: 77% in 2023, 64% in 2024, 49% in 2025 &mdash; the lowest reading since at least 2018. Sources: <a href="https://news.gallup.com/poll/652763/smaller-majorities-say-crime-serious-increasing.aspx">Gallup, Oct. 2024</a> and <a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">Gallup, Oct. 2025</a>.

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The safest year for murder this country has probably ever recorded happened while most of us were sure things were falling apart. Homicides fell about <a href="https://counciloncj.org/crime-trends-in-u-s-cities-year-end-2025-update/">21% from 2024 to 2025</a>, the largest single-year drop anyone has on the books, and the Council on Criminal Justice puts the 2025 rate near 4.0 per 100,000 &mdash; likely the lowest since at least 1900.
        </P>

        <P>
          And it didn&rsquo;t stop. Through the first half of 2026, homicide fell <a href="https://counciloncj.org/crime-trends-in-u-s-cities-mid-year-2026-update/">another 18% across 30 cities</a> &mdash; 215 fewer people &mdash; putting the country on track for a second straight record. Two record years back to back. That basically never happens.
        </P>

        <P>
          Here&rsquo;s the part that&rsquo;s actually interesting if you stare at data for a living. The decline didn&rsquo;t start last year. It started in the back half of 2022. And in 2023, with murder already dropping fast, <a href="https://news.gallup.com/poll/652763/smaller-majorities-say-crime-serious-increasing.aspx">77% of Americans</a> told Gallup there was more crime than a year earlier. In 2024, 64%. It took until 2025 for that number to finally slip to <a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">49%</a> &mdash; the first time in years it wasn&rsquo;t a majority.
        </P>

        <H2>Belief is a lagging indicator</H2>

        <P>
          So the popular framing &mdash; &ldquo;crime is way down but everyone thinks it&rsquo;s up&rdquo; &mdash; isn&rsquo;t quite right anymore. People aren&rsquo;t ignoring the data. They&rsquo;re tracking it. Just about two years late. Belief turned the same direction the murder rate did; it just showed up after the music stopped.
        </P>

        <P>
          And the number everyone argues about is the slowest one to move. When Gallup asks about crime in your own area &mdash; the thing you can actually see out the window &mdash; only <a href="https://news.gallup.com/poll/697124/crime-seen-less-serious-second-straight-year.aspx">30% said it rose</a>, down 19 points in a single year. Local belief, closer to lived reality, turned faster and sits lower than the national figure. The national one is what travels through the feed. It&rsquo;s also the one that lags.
        </P>

        <Fig caption={<>Homicide change across four baselines, from CCJ&rsquo;s city samples: &minus;21% (2024 to 2025, year-end estimate), &minus;18% (first-half 2025 to first-half 2026), &minus;31% vs. first-half 2019, &minus;51% vs. the first-half 2022 peak. Sources: <a href="https://counciloncj.org/crime-trends-in-u-s-cities-year-end-2025-update/">CCJ Year-End 2025</a> and <a href="https://counciloncj.org/crime-trends-in-u-s-cities-mid-year-2026-update/">Mid-Year 2026</a> updates.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222024+to+2025+%28est.%29%22%2C%22H1+2025+to+H1+2026%22%2C%22vs.+first-half+2019%22%2C%22vs.+first-half+2022+peak%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+change+in+homicide%22%2C%22data%22%3A%5B-21%2C-18%2C-31%2C-51%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Homicide+keeps+falling%2C+by+every+yardstick%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22suggestedMin%22%3A-60%2C%22max%22%3A0%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+change+in+homicide%2C+CCJ+city+samples%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of homicide percent change across four baselines: down 21 percent 2024 to 2025, down 18 percent first-half 2025 to 2026, down 31 percent versus 2019, down 51 percent versus the 2022 peak." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <H2>The record is still an estimate</H2>

        <P>
          One more thing worth saying plainly: the &ldquo;lowest since 1900&rdquo; headline is a projection, not a final count. The FBI hasn&rsquo;t published finalized 2025 national numbers yet. CCJ isn&rsquo;t the FBI &mdash; it&rsquo;s a <a href="https://counciloncj.org/crime-trends-in-u-s-cities-mid-year-2026-update/">sample of city police portals</a>, stitched together within days of each month closing, precisely because the official pipeline takes a year or more to settle. A fast proxy for a slow system. Good enough to see the trend. Not the certified number.
        </P>

        <Callout label="Key figure">
          Going back to 1900, the U.S. homicide rate has never fallen below 4.5 per 100,000 &mdash; except for an FBI-recorded 4.4 in 2014. CCJ estimates 2025 landed around 4.0, which is why the year-end analysis calls it the <a href="https://counciloncj.org/crime-trends-in-u-s-cities-year-end-2025-update/">lowest on record going back to 1900</a>. Pending the FBI&rsquo;s final tally.
        </Callout>

        <P>
          The decline is real by every yardstick I can find: down 21% year over year, <a href="https://counciloncj.org/crime-trends-in-u-s-cities-mid-year-2026-update/">51% below the 2022 peak</a>, 31% below 2019. But it isn&rsquo;t uniform, because data never is. Homicide fell in 21 of 30 cities in the first half of 2026 and rose in the rest &mdash; Norfolk was up 64%. A national record is an average, and averages quietly bury the places that went the other way.
        </P>

        <Divider />

        <P>
          The murder rate is the rare number that got dramatically better while almost nobody noticed in time. Belief is a lagging indicator. It&rsquo;ll get here. It always does &mdash; a couple years after the data has already left the building.
        </P>

      </article>
    </Prose>
  </Container>
);

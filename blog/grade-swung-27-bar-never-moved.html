// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H3 = ({ children }) => <h3>{children}</h3>;

const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          New York&rsquo;s fifth graders were 44% proficient in reading in 2023&ndash;24.
          Then 57%. Then 43%. Same test, same standards, three consecutive springs
          (<a href="https://www.post-journal.com/news/top-stories/2026/08/mixed-marks-performance-on-state-ela-tests-drops-math-results-increase/">grade-level
          figures from the state&rsquo;s preliminary release</a>).
        </P>

        <P>
          Twenty-seven points of travel in twenty-four months, landing about where it started.
          Math, taken by the same kids in the same building a couple of weeks later, went 49,
          54, 55. A gentle uphill.
        </P>

        <P>
          Three testing experts told <a href="https://www.chalkbeat.org/newyork/2026/08/05/new-york-state-test-scores-reading-drop-math-2025/">Chalkbeat</a> that
          real learning does not behave like this. Brown&rsquo;s Emily Oster: &ldquo;Data
          doesn&rsquo;t usually look like that.&rdquo; Teachers College&rsquo;s Aaron Pallas said
          the pattern makes him &ldquo;worry about something unusual in the 2024 test and how it
          was scored.&rdquo; Harvard&rsquo;s Andrew Ho, who is paid to sit on the panel advising
          New York on its assessment system, split the difference: &ldquo;The safe bet is that
          there was a real gain and a real decline, but probably neither is as big as
          we&rsquo;re seeing.&rdquo;
        </P>

        <H2>The tidy explanation</H2>

        <P>
          Then a tidy explanation showed up, and it is the one everybody ran with. New York
          lowered its cut scores &mdash; the number of questions you have to get right to be
          called proficient. The Albany Times Union had to <em>request</em> those numbers,
          because <a href="https://www.empirecenter.org/publications/as-math-and-reading-proficiency-went-up-cut-scores-went-down/">the
          state stopped routinely posting revised cut scores after 2022</a>. What came back:
          third-grade ELA fell from 60% correct to 57%. Fourth grade went from 65% to 56%.
          Sixth grade, 63% to 57% (<a href="https://www.yahoo.com/news/articles/york-state-lowered-bar-students-132943612.html">figures
          from the Times Union analysis</a>).
        </P>

        <P>
          Nine points, in fourth grade. That is a real move.
        </P>

        <P>
          So: state lowers the bar, scores spike, state doesn&rsquo;t lower it again, scores
          crash back. Clean. Causal. And not what the grades actually show.
        </P>

        <P>
          Because that same analysis found the state did <em>not</em> change the ELA passing
          level for fifth, seventh or eighth grade. Fifth grade is the grade that swung the most.
        </P>

        <Fig caption={<>ELA cut-score change on the 2025 exam (Times Union analysis, via the New York Post) plotted against each grade&rsquo;s 2023&ndash;24 to 2024&ndash;25 proficiency change (NYSED preliminary data, via The Post-Journal). The proficiency series is arithmetic on the two published grade-level rates.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Grade+3%22%2C%22Grade+4%22%2C%22Grade+5%22%2C%22Grade+6%22%2C%22Grade+7%22%2C%22Grade+8%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22ELA+cut-score+change%2C+2025+exam+%28pct+pts%29%22%2C%22data%22%3A%5B-3%2C-9%2C0%2C-6%2C0%2C0%5D%2C%22backgroundColor%22%3A%22%23999999%22%7D%2C%7B%22label%22%3A%22ELA+proficiency+change%2C+2023-24+to+2024-25+%28pct+pts%29%22%2C%22data%22%3A%5B11%2C7%2C13%2C7%2C1%2C0%5D%2C%22backgroundColor%22%3A%22%23141210%22%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Where+the+bar+moved+vs.+where+the+scores+moved%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22min%22%3A-12%2C%22max%22%3A16%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22percentage+points%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Grouped bar chart comparing ELA cut-score changes by grade against proficiency changes by grade."
            style={{ width:'100%', height:'auto', display:'block' }}
          />
        </Fig>

        <P>
          Go grade by grade. Fourth grade got the biggest cut &mdash; nine points &mdash; and
          gained seven. Fifth grade got no cut at all and gained thirteen. Sixth grade got a
          six-point cut, gained seven, then gave back one. If the cut score is the mechanism,
          the size of the effect ought to track the size of the cause. It doesn&rsquo;t.
        </P>

        <P>
          And math moved the <em>other</em> direction and still went up. Fifth graders had to
          answer 51% of math items correctly to pass, up from 48%. Seventh and eighth
          graders&rsquo; bars rose too. Harder bar, higher scores.
        </P>

        <H2>What I think actually happened</H2>

        <P>
          I don&rsquo;t know. That&rsquo;s the honest answer, and it is also the whole point.
        </P>

        <P>
          Here is what I do know, as a guy whose day job is moving education data between
          systems that were never built to talk to each other. New York is mid-migration from
          paper to computer-based testing. It re-benchmarked the whole assessment in 2023 for
          new learning standards, which is why nobody can compare backward past that year. It
          re-equates every form every year using a statistical model the public never sees. It
          stopped publishing cut scores four years ago. And the release is labeled three
          different ways &mdash; the state calls this the 2025&ndash;26 data, Chalkbeat calls it
          the 2025 exams, and Pallas is worried about the &ldquo;2024 test.&rdquo; One
          administration, three names.
        </P>

        <Callout label="The part that isn't in dispute">
          Every one of those decisions is defensible, made by competent people, for good
          reasons. Stack them and you get an instrument where a 27-point grade-level swing has
          at least four candidate explanations and no way for a parent, a principal or a mayor
          to choose between them.
        </Callout>

        <P>
          New York City &mdash; which enrolls nearly 40% of the state&rsquo;s public school
          students &mdash; bet a four-year citywide literacy overhaul on this number. Last
          August the city pointed at the spike as proof the curriculum was working. This August
          its reading proficiency <a href="https://www.chalkbeat.org/newyork/2026/08/07/nyc-students-reading-test-scores-decline-amid-literacy-instruction-changes/">fell
          six points</a>, third grade dropped nearly fourteen, and Chancellor Kamar Samuels is
          asking for &ldquo;careful, rigorous analysis so we can ensure we&rsquo;re measuring what
          students are learning.&rdquo;
        </P>

        <Divider />

        <P>
          EdTrust-New York wants an independent audit of three years of state testing data. The
          state says it already runs two independent audits every year and neither one flagged a
          problem.
        </P>

        <P>

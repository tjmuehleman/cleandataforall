lt="Horizontal bar chart showing the U.S. students-per-counselor ratio by grade band for 2024-25: elementary 694, middle school 571, high school 224, with the ASCA 250:1 recommendation line drawn through them" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          <a href="https://www.schoolcounselor.org/getmedia/62807f33-a020-4c4f-ac6f-bf284803fd97/pr_ratios-24-25.pdf">ASCA&rsquo;s 2024&ndash;25 ratio update</a> landed late last year with the kind of single-line headline that travels. For the first time since <a href="https://www.schoolcounselor.org/about-school-counseling/school-counselor-roles-ratios">ASCA set the 250:1 recommendation in 1965</a>, the U.S. high school average dropped below the line &mdash; somewhere between <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">195 and 224 students per counselor</a> depending on which states report it.
        </P>

        <P>
          Every K-12 trade publication ran a version of &ldquo;schools finally meet the ratio target.&rdquo;
        </P>

        <P>
          I run a data company. The thing that pulled my eye wasn&rsquo;t the milestone. It was the breakdown one paragraph down.
        </P>

        <H2>Same average. Three different schools.</H2>

        <P>
          The <a href="https://www.schoolcounselor.org/getmedia/62807f33-a020-4c4f-ac6f-bf284803fd97/pr_ratios-24-25.pdf">national figure for 2024&ndash;25 is 372:1</a>, up from 376:1 the year before. About <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">529,000 more students gained access to a counselor in twelve months</a>. That&rsquo;s the real win, and it&rsquo;s not nothing.
        </P>

        <P>
          Inside the average: high schools at <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">195&ndash;224:1</a>. Middle schools at 571:1. Elementary schools at 694:1.
        </P>

        <P>
          The kids whose attachment, identity, and academic self-concept are most plastic &mdash; third, fifth, seventh graders &mdash; sit in front of a counselor running roughly three times the recommended caseload. The kids who actually get the counseling pipeline are the ones two semesters from leaving the building.
        </P>

        <P>
          A note on the denominator. The ASCA grade-band figures are built from <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">the 35 states that report counselor counts separately for elementary, middle, and high</a>. Fifteen states report a single combined number. So &ldquo;elementary at 694:1&rdquo; is a national average for two-thirds of the country.
        </P>

        <P>
          That&rsquo;s still the best read we have. It is not a census.
        </P>

        <H2>Four states cleared the line. The rest didn&rsquo;t get close.</H2>

        <Fig caption={<>Source: <a href="https://blog.csba.org/school-counselor-ratios/">ASCA 2024&ndash;25 ratio data, via CSBA</a> and <a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">K-12 Dive coverage</a>. Arizona is flagged by ASCA as &ldquo;most improved&rdquo; for coming down from 645:1 the year before.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Vermont%22%2C%22New+Hampshire%22%2C%22Hawaii%22%2C%22Colorado%22%2C%22U.S.+national+average%22%2C%22Arizona+%28worst+state%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Students+per+counselor+%282024-25%29%22%2C%22data%22%3A%5B172%2C186%2C243%2C247%2C372%2C570%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%233a3a3a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Only+four+states+meet+the+250%3A1+ratio%22%2C%22fontSize%22%3A16%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A14%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A8%2C%22bottom%22%3A14%2C%22left%22%3A12%2C%22right%22%3A28%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A650%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Students+per+counselor%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%2C%22annotation%22%3A%7B%22annotations%22%3A%5B%7B%22type%22%3A%22line%22%2C%22mode%22%3A%22vertical%22%2C%22scaleID%22%3A%22x%22%2C%22value%22%3A250%2C%22borderColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A2%2C%22borderDash%22%3A%5B6%2C4%5D%2C%22label%22%3A%7B%22enabled%22%3Atrue%2C%22content%22%3A%22ASCA+250%3A1%22%2C%22position%22%3A%22top%22%2C%22backgroundColor%22%3A%22rgba%28244%2C239%2C230%2C0.95%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontStyle%22%3A%22bold%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of student-to-counselor ratios for selected states in 2024-25: Vermont 172, New Hampshire 186, Hawaii 243, Colorado 247, U.S. national average 372, and Arizona at 570, with the ASCA 250:1 recommendation line shown" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          The same press release names the four. <a href="https://blog.csba.org/school-counselor-ratios/">Vermont (172:1). New Hampshire (186:1). Hawaii (243:1). Colorado (247:1).</a> Everyone else sits on a slope that ends at <a href="https://blog.csba.org/school-counselor-ratios/">Arizona&rsquo;s 570:1 &mdash; and Arizona is the state ASCA called &ldquo;most improved&rdquo; for coming down from 645:1</a>.
        </P>

        <P>
          Most improved still puts a high school freshman in a caseload twice the recommended size.
        </P>

        <H2>The other half of the data</H2>

        <P>
          ASCA&rsquo;s national average flattens a spread inside the profession that&rsquo;s louder than the spread between states. The <a href="https://blog.csba.org/school-counseling-profession/">2025 State of the Profession survey</a> found 25% of school counselors actually carry a caseload of 250 or fewer &mdash; inside the recommendation. And 11% carry more than 550 students. The mean splits the difference and means almost nothing.
        </P>

        <P>
          On the demand side, a <a href="https://www.eschoolnews.com/sel/2025/04/21/growing-challenges-for-school-counselors-impact-student-outcomes/">2025 YouScience survey of more than 300 middle and high school counselors</a> found 89% of middle school counselors and 86% of high school counselors say time scarcity prevents them from providing individualized guidance. Not &ldquo;sometimes.&rdquo; Prevents. The same survey reported <a href="https://www.eschoolnews.com/sel/2025/04/21/growing-challenges-for-school-counselors-impact-student-outcomes/">over 56% of counselors are managing caseloads of 300 to 400 students</a> &mdash; well above the recommended ratio.
        </P>

        <P>
          The actual demand side lives in the CDC&rsquo;s <a href="https://www.cdc.gov/yrbs/results/2023-yrbs-results.html">2023 Youth Risk Behavior Survey</a> &mdash; the most recent national release. 39.7% of high school students reported persistent feelings of sadness or hopelessness in the prior year. 9.5% attempted suicide. Both improved a couple of points from 2021. Both are still at generational highs.
        </P>

        <H2>Why this is a data story</H2>

        <P>
          The headline number is real. Three others happen to live in the same press release, or one click over.
        </P>

        <UL items={[
          <>The elementary ratio is <a href="https://www.schoolcounselor.org/getmedia/62807f33-a020-4c4f-ac6f-bf284803fd97/pr_ratios-24-25.pdf">2.8x the recommendation</a>.</>,
          <>Middle school is <a href="https://www.schoolcounselor.org/getmedia/62807f33-a020-4c4f-ac6f-bf284803fd97/pr_ratios-24-25.pdf">2.3x</a>.</>,
          <>The people doing the work say they can&rsquo;t, time-wise, do the individualized part of it for <a href="https://www.eschoolnews.com/sel/2025/04/21/growing-challenges-for-school-counselors-impact-student-outcomes/">~90% of their students</a>.</>,
        ]} />

        <Callout label="The receipt">
          372:1 national. 195&ndash;224:1 high school. 571:1 middle. 694:1 elementary. 35 states report the breakdown; 15 don&rsquo;t. Four states meet the 250:1 standard. Source: <a href="https://www.schoolcounselor.org/getmedia/62807f33-a020-4c4f-ac6f-bf284803fd97/pr_ratios-24-25.pdf">ASCA 2024&ndash;25 ratio press release</a>.
        </Callout>

        <P>
          None of those got pulled into the headline. Two are in the same PDF. The third is in a different organization&rsquo;s survey. The CDC data is downstream of all of it.
        </P>

        <P>
          The story we tell about counseling staffing in this country comes from whichever number a press release lifts to the top. That number is a real improvement. It is also a thin slice of a system that quietly rations the most-needed support away from the smallest kids.
        </P>

        <Divider />

        <P>
          The first graders are not getting a press release.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://www.schoolcounselor.org/getmedia/62807f33-a020-4c4f-ac6f-bf284803fd97/pr_ratios-24-25.pdf">ASCA &mdash; 2024&ndash;25 Student-to-School-Counselor Ratio press release (PDF, Nov 2025)</a> &mdash; the 372:1 national average, the 195&ndash;224:1 high school range, the 571:1 middle and 694:1 elementary figures, the 1965 origin of the recommendation.</>,
          <><a href="https://www.schoolcounselor.org/about-school-counseling/school-counselor-roles-ratios">ASCA &mdash; School Counselor Roles &amp; Ratios</a> &mdash; the standing 250:1 guidance.</>,
          <><a href="https://www.k12dive.com/news/more-students-have-access-to-school-counselors-data-shows/812609/">K-12 Dive &mdash; More students have access to school counselors, data shows</a> &mdash; 529,000-more-students stat; the 35-state grade-band reporting denominator.</>,
          <><a href="https://blog.csba.org/school-counselor-ratios/">CSBA Blog &mdash; U.S. student-to-school counselor ratio improves but still misses recommended rate</a> &mdash; Vermont 172:1, New Hampshire 186:1, Hawaii 243:1, Colorado 247:1, Arizona 570:1 (down from 645:1).</>,
          <><a href="https://blog.csba.org/school-counseling-profession/">CSBA Blog &mdash; New report details the state of the school counseling profession</a> &mdash; ASCA State of the Profession 2025: 25% inside 250:1, 11% over 550 students.</>,
          <><a href="https://www.eschoolnews.com/sel/2025/04/21/growing-challenges-for-school-counselors-impact-student-outcomes/">eSchool News &mdash; Growing challenges for school counselors impact student outcomes</a> &mdash; YouScience 2025 survey of 300+ counselors: 89%/86% time-scarcity figures, 56% at 300&ndash;400 students.</>,
          <><a href="https://www.cdc.gov/yrbs/results/2023-yrbs-results.html">CDC &mdash; 2023 Youth Risk Behavior Survey results</a> &mdash; 39.7% persistent sadness/hopelessness; 9.5% attempted suicide.</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

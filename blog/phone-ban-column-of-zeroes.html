const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          By the time Los Angeles Unified spent{' '}
          <a href="https://fortune.com/2026/05/08/phone-bans-classroom-no-effect-school-test-scores-math-reading/">$5.2 million on Yondr pouches</a>{' '}
          and New York City wrote a{' '}
          <a href="https://fortune.com/2026/05/08/phone-bans-classroom-no-effect-school-test-scores-math-reading/">$29 million check</a>{' '}
          for the same,{' '}
          <a href="https://fortune.com/2026/05/08/phone-bans-classroom-no-effect-school-test-scores-math-reading/">37 states plus D.C.</a>{' '}
          had policies restricting student phones in school. The political consensus arrived first. The data took longer.
        </P>

        <P>
          The data finally landed in April 2026, when the National Bureau of Economic Research circulated{' '}
          <a href="https://www.nber.org/papers/w35132">working paper 35132</a> &mdash; the biggest study of school phone bans yet done in the U.S. Hunt Allcott, E. Jason Baron, Thomas Dee, Angela Duckworth, Matthew Gentzkow, and Brian Jacob (Stanford, Duke, Michigan, Penn) pulled administrative records, surveys, and GPS pings for{' '}
          <a href="https://fortune.com/2026/05/08/phone-bans-classroom-no-effect-school-test-scores-math-reading/">roughly 4,600 schools</a>{' '}
          that adopted Yondr lockable pouches. Staggered difference-in-differences. The cleanest national read on the policy that&rsquo;s now operating across more than half of American public schools.
        </P>

        <P>Here&rsquo;s the dashboard.</P>

        <UL items={[
          <>Phone use: down. <a href="https://www.nber.org/papers/w35132">GPS pings and teacher reports</a> both. Working as designed.</>,
          <>Test scores: <a href="https://www.nber.org/papers/w35132">&ldquo;consistently close to zero.&rdquo;</a> High schools nudged up in math; middle schools nudged down. The average wash is on average.</>,
          <>Attendance: <a href="https://www.nber.org/papers/w35132">no effect</a>.</>,
          <>Self-reported classroom attention: <a href="https://www.nber.org/papers/w35132">no effect</a>.</>,
          <>Perceived online bullying: <a href="https://www.nber.org/papers/w35132">no effect</a>.</>,
          <>Disciplinary incidents: <a href="https://www.nber.org/papers/w35132">up in year one. Fade out by year three</a>.</>,
          <>Student well-being: <a href="https://www.nber.org/papers/w35132">down in year one. Up by year three</a>.</>,
        ]} />

        <P>
          I run a data company. The thing I keep staring at isn&rsquo;t the well-being recovery or the discipline curve. It&rsquo;s the column of zeroes in the middle.
        </P>

        <H2>The thing the policy was buying</H2>

        <P>
          Read every press release that accompanied a state phone-ban signing. Almost none of them say &ldquo;we are doing this so that, holding everything else constant, students will spend less time on TikTok during third period.&rdquo; That number &mdash; the one the law actually moved &mdash; wasn&rsquo;t the headline. The headline was always test scores, attention, bullying, well-being. The downstream stuff.
        </P>

        <P>
          The{' '}
          <a href="https://www.sciencedirect.com/science/article/abs/pii/S0927537116300136?via%3Dihub">2013 Beland and Murphy paper</a>{' '}
          on the U.K. phone-ban wave found a{' '}
          <a href="https://fortune.com/2026/05/08/phone-bans-classroom-no-effect-school-test-scores-math-reading/">6.4% test-score gain</a>{' '}
          after restrictions kicked in, concentrated among lower-achieving students. That was the foundational citation. It&rsquo;s still the foundational citation. Twelve years later, every U.S. state legislature that has invoked &ldquo;the research&rdquo; on phone bans was invoking that one study.
        </P>

        <P>
          The new NBER paper, on a U.S. dataset twenty times the size, says: the part of the U.K. result that travels is the part about phones. The part about test scores doesn&rsquo;t.
        </P>

        <H2>The 36-month curve</H2>

        <P>
          The paper finds well-being{' '}
          <a href="https://news.stanford.edu/stories/2026/05/national-study-school-cellphone-bans-benefits-research">worsens in year one and turns positive by year three</a>. That&rsquo;s a 36-month curve. The trough is where most American districts are sitting right now: the wave of bell-to-bell laws is barely 18 months old. Most schools running a phone ban this morning are inside the year-one zone where the paper says discipline rises and well-being falls before either recovers.
        </P>

        <P>
          The administrators I know aren&rsquo;t dumb. They&rsquo;re operating with one foot in their best read on the evidence and the other in whatever the parents at the last board meeting demanded. The board meeting is a year-one phenomenon. The recovery is a year-three phenomenon. The published evidence base, when there is one, is always a half-cycle behind the politics by design.
        </P>

        <Fig caption={<>Sources: <a href="https://fortune.com/2026/05/08/phone-bans-classroom-no-effect-school-test-scores-math-reading/">Fortune, May 8, 2026</a>, citing district procurement filings (NYC $29M, LA $5.2M on Yondr pouches).</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22New+York+City+Schools%22%2C%22Los+Angeles+Schools%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Spending+on+phone+pouches+%28%24+millions%29%22%2C%22data%22%3A%5B29%2C5.2%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Two+districts%27+commitment+to+a+phone-free+school+day%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22fontSize%22%3A11%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Spending+on+Yondr+pouches+%28%24+millions%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of district spending on Yondr phone pouches: New York City Schools 29 million dollars; Los Angeles Schools 5.2 million dollars."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>The receipt</H2>

        <P>
          $29 million in New York City. $5.2 million in Los Angeles. Hundreds of thousands per major district. Every dollar of it bought, in net, less phone use during the school day &mdash; and a year-one disciplinary spike that fades by year three. Nothing else on the dashboard changed.
        </P>

        <P>
          That&rsquo;s not nothing. Less phone use during the school day is a real intermediate outcome, and the kids saying their hallways are louder and more social means something. But that&rsquo;s not what the policy promised. The policy promised the downstream column.
        </P>

        <Callout label="The data-guy read">
          The policy moved one number. The number the policy was about &mdash; test scores &mdash; was &ldquo;consistently close to zero&rdquo; across 4,600 schools and three years. Most of the country&rsquo;s phone-ban laws are less than 18 months old. The published evidence base is half a cycle behind the politics by design.
        </Callout>

        <P>
          The downstream column is zero. The phones, of course, didn&rsquo;t stay at school.
        </P>

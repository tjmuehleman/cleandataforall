// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const H3 = ({ children }) => <h3>{children}</h3>;

const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;

);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">
        <P>Districts where more than 80% of students get subsidized lunch received a median of $6,128 per student from the last two rounds of pandemic relief. That&rsquo;s <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=18">more than three times</a> what the median district at 40 to 50% got.</P>
        <P>Now look at who bounced back. From 2022 to 2025, the lowest-poverty districts (under 10% on subsidized lunch) gained .25 grade equivalents in math. The highest-poverty districts (over 80%) gained a little over .2. In reading both groups slipped, by .02 and .05. And the districts in the middle, 30 to 70% on subsidized lunch, <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=18">&ldquo;saw the least improvement in both subjects.&rdquo;</a> That&rsquo;s the U-shape in the <a href="https://www.gse.harvard.edu/ideas/news/26/05/new-education-scorecard-finds-u-shaped-recovery">Harvard and Stanford Education Scorecard</a>.</P>
        <P>One tweak to the headline you&rsquo;ll see everywhere: reading didn&rsquo;t really recover for anybody. The ends just fell less. The U lives in math.</P>
        <H2>The pipe</H2>
        <P>Here&rsquo;s the data-system part. ESSER II and ARP grants were <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=19">directly proportional to each district&rsquo;s Title I aid in fiscal 2020</a>. Title I was $16 billion that year. ESSER II and ARP were $175 billion. The report&rsquo;s own phrase for it is <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=39">pipes that were designed to carry one-tenth the volume</a>. So a formula built on a pre-pandemic poverty count got multiplied by ten, and everything it didn&rsquo;t see got multiplied by ten too.</P>
        <P>The middle isn&rsquo;t a category in that formula. It&rsquo;s just the stretch between two thresholds. And the other end of the U wasn&rsquo;t waiting around: the report notes the lowest-poverty districts <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=4">had greater financial and social capital to draw on</a>. (My read, not theirs: nobody voted to leave the middle out. The formula just never had a column for it.)</P>
        <P>Does the money explain the high-poverty bump? Mostly, says the report. <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=3">Without federal relief, the average high-poverty district would have stayed at its 2022 level</a>.</P>
        <Fig caption={<>Source: <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=23">Education Scorecard, May 2026 report, p. 22</a>: highest-poverty districts lost .7 grade equivalents and recovered .2 since 2022, leaving them about half a grade equivalent behind 2019. Still behind = &minus;0.7 + 0.2 = &minus;0.5. Values match the report&rsquo;s math estimates (<a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=17">Figure 6</a>, Figure 7). &ldquo;More than .7&rdquo; and &ldquo;over .2&rdquo; are rounded down to .7 and .2.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Lost%2C+2019-22%22%2C%22Regained%2C+2022-25%22%2C%22Still+behind+2019%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Highest-poverty+districts%2C+math%22%2C%22data%22%3A%5B-0.7%2C0.2%2C-0.5%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%2C%22%233a3a3a%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Highest-poverty+districts%2C+math+%28grade+equivalents%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-0.9%2C%22max%22%3A0.4%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Grade+equivalents%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Afalse%2C%22labelString%22%3A%22%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A12%7D%7D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: highest-poverty districts, math, in grade equivalents. Lost 2019 to 2022: minus 0.7. Regained 2022 to 2025: plus 0.2. Still behind 2019: minus 0.5." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>
        <H2>The number that isn&rsquo;t there</H2>
        <P>Here&rsquo;s what bugs me. The report prints numbers for both ends of the U. For the middle it gives you a line on a chart and the word &ldquo;least.&rdquo; The same goes for distance from 2019: the highest-poverty districts are about half a grade equivalent behind, the lowest-poverty about <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=23">.1</a>, and the middle is described as <a href="https://educationscorecard.org/wp-content/uploads/2026/05/Education_Scorecard_May_2026_Report.pdf#page=4">far behind</a> with no figure attached. I could eyeball the plot. I won&rsquo;t, because an eyeballed number in a chart is a made-up number with better posture.</P>
        <P>The group everyone&rsquo;s about to write about is the one without a published value. Somebody should ask for the table.</P>
        <P>Nobody left the middle out on purpose. A formula doesn&rsquo;t do that. It just never asked.</P>

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          A Colorado superintendent published a number this week, and within about a day it had stopped being his.
        </P>

        <P>
          Denver Public Schools put out its year-end results on August 29. Alex Marrero&rsquo;s line, quoted in <a href="https://completecolorado.com/2026/08/25/state-spins-bad-colorado-education-testing-data/" target="_blank" rel="noopener">Complete Colorado</a>: &ldquo;Across the district on READ Act assessments, 69% of K-3 students were at Grade Level &amp; Above.&rdquo; A district figure. Clearly labeled. In a district press release. It is now traveling around as evidence that Colorado&rsquo;s early-literacy law worked statewide, set against the state&rsquo;s middle-grades reading slide.
        </P>

        <P>
          It isn&rsquo;t a state number. Colorado doesn&rsquo;t publish one that means what people think it means.
        </P>

        <H2>Five rulers, one district</H2>

        <P>
          Here&rsquo;s the part that matters if you work with data for a living. The READ Act K-3 assessment isn&rsquo;t a reading test in the sense anyone assumes. CDE says so <a href="https://ed.cde.state.co.us/coloradoliteracy/readact-programming/readactassessments" target="_blank" rel="noopener">plainly</a>: the interim assessment exists &ldquo;to determine whether a student has a significant reading deficiency in grades K through 3,&rdquo; and screens for characteristics of dyslexia. It&rsquo;s a screener. Screeners are built to be sensitive at the bottom of the distribution, not accurate across all of it. Reporting &ldquo;percent at grade level and above&rdquo; off a dyslexia screener is like reporting median household income off a food-stamp eligibility form.
        </P>

        <P>
          And districts don&rsquo;t run the same screener. CDE keeps an advisory list, and a Colorado district picks one of five: Acadience Reading K-6, Amplify&rsquo;s mCLASS with DIBELS 8, i-Ready, ISIP Reading, or Renaissance&rsquo;s Star Early Learning. Five instruments. Five separate cut-score tables, each posted as its own PDF on CDE&rsquo;s site. A kid who is &ldquo;at grade level&rdquo; in one district might not be in the district next door, and neither district did anything wrong.
        </P>

        <Callout label="Scope check">
          69% is Denver Public Schools, not Colorado. There is no comparable statewide K-3 READ Act &ldquo;at grade level&rdquo; percentage in the sources I could pull.
        </Callout>

        <H2>The part I&rsquo;d actually put weight on</H2>

        <P>
          CMAS is the good data here. One test, same grades, published as a clean three-year table. English language arts, percent meeting or exceeding expectations, 2025 to 2026: grade 3 went <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/state-level-results-cmas-psat-sat-2026" target="_blank" rel="noopener">42.0 to 40.8</a>. Grade 4, 42.0 to 47.0. Grade 5, 48.0 to 49.9. Then grade 6, 44.2 to 41.6. Grade 7, 48.8 to 46.6. Grade 8, 43.9 to 42.2.
        </P>

        <Fig caption={<>Percentage-point change, 2026 minus 2025, CMAS ELA. Arithmetic is CDE&rsquo;s own published difference column. Source: <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/state-level-results-cmas-psat-sat-2026" target="_blank" rel="noopener">CDE 2026 state-level results</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Gr+3%22%2C%22Gr+4%22%2C%22Gr+5%22%2C%22Gr+6%22%2C%22Gr+7%22%2C%22Gr+8%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222026+minus+2025%2C+percentage+points%22%2C%22data%22%3A%5B-1.2%2C5.0%2C1.9%2C-2.6%2C-2.2%2C-1.7%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%2C%22%23777%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Same+test%2C+same+grade%2C+one+year+apart%3A+the+sign+flips+at+grade+6%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22min%22%3A-4%2C%22max%22%3A6%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22percentage-point+change+in+%25+met+or+exceeded%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of the percentage-point change in Colorado CMAS English language arts proficiency from 2025 to 2026, by grade: grade 3 down 1.2, grade 4 up 5.0, grade 5 up 1.9, grade 6 down 2.6, grade 7 down 2.2, grade 8 down 1.7." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Three up, three down, sign flips at grade six. That&rsquo;s a real finding, in one instrument, and it&rsquo;s the only piece of this story I&rsquo;d defend without a footnote.
        </P>

        <P>
          Notice which grade fell, though. Third. The grade the READ Act exists to fix.
        </P>

        <H2>The third ruler</H2>

        <P>
          Commissioner Susana C&oacute;rdova, in the <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/state-level-results-cmas-psat-sat-2026" target="_blank" rel="noopener">May 29 release</a>: &ldquo;CMAS English Language Arts (ELA) scores increased by 5 percentage points from third grade in 2025 to fourth grade in 2026.&rdquo; And nearly 8 points from fourth to fifth.
        </P>

        <P>
          Both true. Both computed straight off the table above &mdash; 42.0 to 47.0, 42.0 to 49.9. And both are a grade-3 pass rate minus a grade-4 pass rate. Two different tests, two separately adopted sets of cut scores. Percent-proficient is not a scale score. You can&rsquo;t difference it across grades and call the result growth. I don&rsquo;t think that&rsquo;s spin so much as a category error that happens to point the direction a press release wants.
        </P>

        <P>
          Colorado publishes real growth percentiles. They&rsquo;re in the August file. Nobody quoted them.
        </P>

        <Divider />

        <P>
          One more number to set beside all of it. CDE released attendance data on August 27: <a href="https://www.chalkbeat.org/colorado/2026/08/27/chronic-absenteeism-rate-down-but-still-higher-than-pre-pandemic/" target="_blank" rel="noopener">27.5% of Colorado students were chronically absent</a> in 2025-26, down from 28.4%, still above the 22.6% of 2019-20. More than 230,000 kids missed a tenth of the year. High school seniors were the worst grade in the state. Denver &mdash; the district that supplied the 69% &mdash; ran 36.6%.
        </P>

        <P>
          I don&rsquo;t know what a reading score means for a student who wasn&rsquo;t there. Neither does the reading score.
        </P>

      </article>
    </Prose>
  </Container>
);

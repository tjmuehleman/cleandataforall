// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          For the first time in recorded surveillance, more of the world&rsquo;s 5-to-19-year-olds
          are{' '}
          <a href="https://www.unicef.org/press-releases/obesity-exceeds-underweight-first-time-among-school-age-children-and-adolescents">obese (9.4%) than underweight (9.2%)</a>.
          That&rsquo;s{' '}
          <a href="https://www.unicef.org/press-releases/obesity-exceeds-underweight-first-time-among-school-age-children-and-adolescents">188 million obese kids</a>{' '}
          in 2025 &mdash; up from a global rate of about 3% in 2000. UNICEF&rsquo;s{' '}
          <em>Feeding Profit</em> report has the headline. Every wire service ran it.
        </P>

        <P>
          I run a data company. The lines didn&rsquo;t cross in 2025. They crossed in Niue around
          2000, in the Cook Islands not long after, in Nauru by the time Lehman fell. The chart
          everyone is sharing is a 25-year montage finally averaging out into one number.
        </P>

        <H2>The crossover already crossed</H2>

        <P>
          UNICEF&rsquo;s own country list puts childhood obesity at{' '}
          <a href="https://www.unicef.org/press-releases/obesity-exceeds-underweight-first-time-among-school-age-children-and-adolescents">38% in Niue, 37% in the Cook Islands, and 33% in Nauru</a>{' '}
          &mdash; each roughly doubled since 2000. Those countries didn&rsquo;t wait for the global
          average to flip. They&rsquo;ve been past the line for a generation.
        </P>

        <Fig caption={<>Source: <a href="https://www.unicef.org/press-releases/obesity-exceeds-underweight-first-time-among-school-age-children-and-adolescents">UNICEF &mdash; <em>Feeding Profit</em> press release</a> (Sept 10, 2025). World average is the same 9.4% obesity figure for ages 5&ndash;19 cited in the report.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Niue%22%2C%22Cook+Islands%22%2C%22Nauru%22%2C%22World+average%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Childhood+obesity+%28%25%2C+ages+5%5Cu201319%29%22%2C%22data%22%3A%5B38%2C37%2C33%2C9.4%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%235a5a5a%22%2C%22%23bbbbbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Childhood+obesity+prevalence%2C+ages+5%5Cu201319+%282025%29%22%2C%22fontSize%22%3A16%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A36%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A40%2C%22stepSize%22%3A5%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Prevalence+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of childhood obesity prevalence for ages 5 to 19 in 2025. Niue: 38%. Cook Islands: 37%. Nauru: 33%. World average: 9.4%."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          The global number caught up because high-income countries plateaued in the 20-something
          neighborhood while low- and middle-income countries kept climbing. LMICs{' '}
          <a href="https://www.worldobesity.org/news/feeding-profit-new-unicef-report-exposes-how-food-environments-are-failing-children">now carry 81% of the global overweight-and-obesity burden</a>.{' '}
          Sub-Saharan Africa and South Asia are the only two regions where the lines{' '}
          <a href="https://www.unicef.org/press-releases/obesity-exceeds-underweight-first-time-among-school-age-children-and-adolescents">have not crossed yet</a>.
          Every other region already did, some of them a long time ago.
        </P>

        <P>
          So &ldquo;obesity overtook underweight in 2025&rdquo; isn&rsquo;t a moment. It&rsquo;s a
          montage.
        </P>

        <H2>The leading indicator was on a container ship</H2>

        <P>
          The thing that bugs me about the BMI line is that it&rsquo;s the wrong way to measure
          this. BMI prevalence is a survey number. Country statistical offices weigh and measure a
          sample of kids every few years. The data takes a few more years to clean and publish.
          Then someone aggregates 190 countries into a global average. By the time the line crosses,
          the kids it counted are already buying their own snacks.
        </P>

        <P>
          The actual leading indicator was on the{' '}
          <a href="https://www.fao.org/faostat/en/#data/FBS">FAO Food Balance Sheets</a>.
          Pacific Island countries shifted from local fish, taro, and breadfruit to imported wheat,
          rice, oils, and ultra-processed foods through the 1990s and 2000s &mdash;{' '}
          <a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10685071/">a transition documented across the region</a>{' '}
          and accelerated by trade liberalization in the mid-1990s. The obesity numbers followed the
          supply-side change with a 10-to-15-year lag, which is roughly how long it takes a kid born
          during the supply shift to become an 8-year-old in a national health survey.
        </P>

        <P>
          The marketing side runs in real time. UNICEF{' '}
          <a href="https://www.unicef.org/press-releases/obesity-exceeds-underweight-first-time-among-school-age-children-and-adolescents">polled 64,000 13-to-24-year-olds across 170 countries</a>{' '}
          and found 75% had seen ads for sugary drinks, snacks, or fast food in the past week.
          The ad runs this morning. The BMI surveillance lands in five years.
        </P>

        <H2>The bill, eventually</H2>

        <P>
          UNICEF&rsquo;s number for the economic side: productivity losses from obesity will pass{' '}
          <a href="https://www.worldobesity.org/news/economic-impact-of-overweight-and-obesity-to-surpass-4-trillion-by-2035">US$4 trillion a year by 2035</a>,
          about 3% of global GDP. That projection rests on the same averaging that produced the 2025
          crossover. It&rsquo;s a global aggregate of country lines moving at very different speeds.
        </P>

        <Callout label="The data-pipeline read">
          The 2025 &ldquo;crossover&rdquo; headline is a BMI-survey aggregation that lags the
          food supply by a decade. If you want to know where the next country&rsquo;s line will
          cross, the FAO trade data is years ahead of the WHO prevalence data.
        </Callout>

        <P>
          For most of the post-war era, &ldquo;child malnutrition&rdquo; meant underweight.{' '}
          <em>Feeding Profit</em> retires that framing. The line on the chart says 2025. The line
          in the food supply data said it 20 years ago, country by country, container by container.
        </P>

        <P>
          The kids who never showed up on an underweight chart are not better off. They&rsquo;re on
          a different chart now.
        </P>

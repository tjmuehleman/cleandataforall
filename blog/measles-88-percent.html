        src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222000%22%2C%222024%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Estimated+global+measles+deaths%22%2C%22data%22%3A%5B800000%2C95000%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Estimated+global+measles+deaths%3A+2000+vs.+2024%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Year+%28WHO+measles+report%3B+estimated%2C+not+raw+counts%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A900000%2C%22stepSize%22%3A200000%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Estimated+deaths%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2"

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The new WHO measles report came out <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">late November</a>, and like most of the WHO drops that hit the inbox at Standard Co, I read it the way I read everything: as a story about data systems, not about the disease. Epidemiology isn&rsquo;t my lane. Pipelines are.
        </P>

        <P>
          Two numbers are doing most of the work in the headlines.
        </P>

        <P>
          <strong>88%.</strong> Estimated measles deaths are down 88% from 2000 to 2024. Nearly 59 million lives saved by the vaccine in 25 years. <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">(WHO, 28 Nov 2025)</a>
        </P>

        <P>
          <strong>November 10, 2025.</strong> Canada lost its measles-elimination status &mdash; the first country to do so since <a href="https://www.paho.org/en/news/10-11-2025-paho-calls-regional-action-americas-lose-measles-elimination-status">the Region of the Americas was re-certified</a> in 2024.
        </P>

        <P>
          Both are true. Neither means what the first sentence of the news story implies.
        </P>

        <H2>The 88% is a model</H2>

        <P>
          Here&rsquo;s the thing the headline doesn&rsquo;t say. Neither of these numbers is a count. WHO is upfront about it in the note to editors:
        </P>

        <BQ cite="WHO, 28 Nov 2025">
          WHO uses statistical modelling to estimate measles cases and deaths each year, based on cases reported by countries, and revises the previous year&rsquo;s estimates to assess disease trends over time.
        </BQ>

        <P>
          Translation: 95,000 is a model output. The inputs are notification reports submitted by ministries of health to WHO, on country-specific schedules, with country-specific completeness. The model is then revised when new data comes in. Last year&rsquo;s number isn&rsquo;t last year&rsquo;s number &mdash; it&rsquo;s last year&rsquo;s number <em>as currently estimated</em>.
        </P>

        <P>
          That&rsquo;s not a criticism. That&rsquo;s how this disease (and most diseases WHO tracks) gets measured anywhere on earth. It&rsquo;s just worth holding in your head every time someone quotes the number in a tweet.
        </P>

        <H2>&ldquo;Elimination&rdquo; is a 12-month clock</H2>

        <P>
          Now the second headline. Canada lost elimination.
        </P>

        <P>
          &ldquo;Elimination&rdquo; sounds like an epidemiological term. In practice it&rsquo;s a surveillance definition, and WHO is &mdash; again &mdash; explicit about it:
        </P>

        <BQ cite="WHO, 28 Nov 2025">
          Measles elimination is defined as the absence of endemic measles virus transmission in a region or other defined geographical area for more than 12 months.
        </BQ>

        <P>
          Canada&rsquo;s outbreak <a href="https://www.canada.ca/en/public-health/news/2025/11/statement-from-the-public-health-agency-of-canada-on-canadas-measles-elimination-status.html">began in October 2024</a>. The reclassification landed November 10, 2025. The data event that tripped the change isn&rsquo;t an outbreak curve. It&rsquo;s a calendar &mdash; the moment a 12-month clock rolled over.
        </P>

        <H2>Coverage, but at what grain</H2>

        <P>
          Now the coverage numbers feeding the whole machinery. In 2024, <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">84% of children globally</a> received the first dose of measles vaccine (MCV1). 76% received the second (MCV2). The herd-immunity threshold WHO cites is 95% &mdash; with both doses, <em>at the community level</em>.
        </P>

        <Fig caption={<>Source: <a href="https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge">WHO, 28 Nov 2025</a>. MCV1 and MCV2 are global national-coverage averages.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22MCV1+%28first+dose%29%22%2C%22MCV2+%28second+dose%29%22%2C%22Elimination+threshold%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Global+coverage+%28%25%29%22%2C%22data%22%3A%5B84%2C76%2C95%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Global+measles+vaccination+coverage+vs.+95%25+threshold%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A100%2C%22stepSize%22%3A20%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+eligible+children%2C+WHO+2024+reporting%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart: global MCV1 coverage 84%, MCV2 coverage 76%, against the 95% threshold."
            style={{ width:'100%', display:'block' }}
          />
        </Fig>

        <P>
          Here&rsquo;s the part that&rsquo;s quiet. The 95% threshold is a <em>community-level</em> target. MCV1 and MCV2 are typically reported as a <em>national average</em>. A country at 92% MCV2 nationwide can still contain dozens of communities at 50% &mdash; which is exactly the pattern feeding outbreaks in Canada, the US, and Europe. The community-level data either isn&rsquo;t collected at that grain, isn&rsquo;t published at that grain, or doesn&rsquo;t make it into WHO&rsquo;s country-level submissions.
        </P>

        <P>
          That &ldquo;30 million children under-protected against measles in 2024&rdquo; figure is the same shape &mdash; birth cohort &times; (1 &minus; coverage). Not 30 million kids identified by name.
        </P>

        <H2>What I underlined in the margins</H2>

        <UL items={[
          <>In the WHO European Region, <a href="https://www.who.int/europe/news/item/11-02-2026-measles-cases-dropped-in-europe-and-central-asia-in-2025-compared-to-the-previous-year--but-the-risk-of-outbreaks-remains---unicef-and-who">the number of countries with continuing or re-established endemic measles transmission jumped from 12 to 19</a> at the Regional Verification Commission&rsquo;s September 2025 meeting &mdash; based on 2024 data. The next reclassifications, drawing on 2025 data, are still a year out. The scoreboard runs on a delay.</>,
          <>Europe reported <a href="https://www.who.int/europe/news/item/11-02-2026-measles-cases-dropped-in-europe-and-central-asia-in-2025-compared-to-the-previous-year--but-the-risk-of-outbreaks-remains---unicef-and-who">33,998 measles cases in 2025, down from 127,412 in 2024</a>. Same surveillance pipeline, different year, very different headline.</>,
          <>In the US, the CDC was tracking <a href="https://www.cdc.gov/measles/data-research/index.html">1,281 confirmed measles cases across 31 jurisdictions as of March 5, 2026</a> &mdash; 89% of them outbreak-associated. That&rsquo;s a notification system, not an incidence estimate. The actual case number is some integer above that, and we don&rsquo;t know which one.</>,
        ]} />

        <Divider />

        <P>
          Measles is the most contagious virus we know how to count. The vaccine has existed since 1963. Neither of those is the bottleneck on the resurgence we&rsquo;re now staring at.
        </P>

        <P>
          The bottleneck is information flow. Where you have community-level coverage data. Where you have timely case reporting. Which countries submit notifications by the snapshot. How long the verification commission takes to act on the result. The &ldquo;scoreboard&rdquo; isn&rsquo;t the disease. It&rsquo;s the data pipeline.
        </P>

        <P>

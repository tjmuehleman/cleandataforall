// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Somewhere in a southern state, 37.5% of the high school class of 2022 did not write down their GPA.
        </P>

        <P>
          That is the part of the grade inflation story nobody is arguing about, because nobody noticed it.
          Last November ACT published a careful report on whether grade inflation wrecks the predictive power
          of a transcript. Good paper. The finding traveled. What got skipped is
          {' '}<a href="https://www.act.org/content/dam/act/unsecured/documents/R2432-The-Implications-of-Grade-Inflation-2025-11.pdf" target="_blank" rel="noopener">Table 1</a>,
          where the author notes that the share of the graduating class with no high school GPA on file went
          from 19.0% in 2017 to 37.5% in 2022.
        </P>

        <P>
          High school GPA, in this dataset, is self-reported. Kids type it into a form when they register for
          the ACT. And over five years, more than a third of them stopped typing.
        </P>

        <H2>The denominator moved and nobody announced it</H2>

        <P>
          Across those same graduating classes, mean GPA went from 3.17 to 3.37 while the ACT composite went
          from 19.18 to 18.39. Grades up, scores down &mdash; the divergence everybody writes about. Except the
          grades half of that sentence now rests on a field a third of the class left blank, and the blankness
          is not random. Sanchez had to put a term in the model just for it, and the interaction between cohort
          year and change-in-missing came back at p = 0.003.
        </P>

        <P>
          I run a data company. This is the most familiar failure mode I know. Not a wrong number. A number
          whose denominator quietly changed shape while everyone kept quoting the numerator.
        </P>

        <Callout label="What I dropped">
          Nearly every version of this story opens with &ldquo;half of all seniors now graduate with an A average,
          up from 39% in 1990.&rdquo; I went looking. The 39% traces to 1998, not 1990, and I could not tie the pair
          to a primary source I would link to. So it is not in here.
        </Callout>

        <H2>The scary number is a different number</H2>

        <P>
          Second one. In March, NBER published
          {' '}<a href="https://www.nber.org/papers/w34952" target="_blank" rel="noopener">Easy A&rsquo;s, Less Pay</a>{' '}
          &mdash; Denning, Nesbit, Pope and Warnick &mdash; the first real causal look at what lenient grading does
          to kids downstream. The headline figure is $213,872, and it has been everywhere since.
        </P>

        <P>
          Here is the abstract, verbatim: a teacher with one standard deviation higher average grade inflation
          reduces the present discounted value of lifetime earnings of <em>their students</em> by $213,872{' '}
          <em>per year</em>.
        </P>

        <P>
          Plural. Per year of teaching. That is a full course load &mdash; 90 to 100 kids, per
          {' '}<a href="https://hechingerreport.org/proof-points-grade-inflation-lower-pay/" target="_blank" rel="noopener">Hechinger&rsquo;s writeup</a>.
          Run it per student and the picture is $56 less one year after high school and $145 less six years out.
          Both numbers are true. One is a headline and the other is what happened to your kid. (The paper is a
          working paper, not peer-reviewed yet.)
        </P>

        <H2>Something real is still in there</H2>

        <P>
          Strip out the reporting problem and the distribution still moved. Adjusted for ACT score, the
          25th-percentile GPA in that state went from 2.90 in 2017 to 3.11 in 2022. The bottom quarter crossed a B.
        </P>

        <Fig caption={<>Source: ACT Research Report 2025-11, Figure A1. GPA adjusted for student ACT Composite, school average ACT Composite, and change in the share of students not reporting a GPA.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%2225th+percentile%22%2C%2275th+percentile%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Class+of+2017%22%2C%22data%22%3A%5B2.9%2C3.41%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22borderColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A1%7D%2C%7B%22label%22%3A%22Class+of+2022%22%2C%22data%22%3A%5B3.11%2C3.61%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A1%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+bottom+quarter+crossed+a+B+in+five+years%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22boxWidth%22%3A14%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22display%22%3Afalse%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A2.5%2C%22max%22%3A4.0%2C%22stepSize%22%3A0.25%2C%22fontSize%22%3A12%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Adjusted+high+school+GPA%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Grouped bar chart: adjusted 25th-percentile GPA rose from 2.90 to 3.11 and 75th-percentile GPA rose from 3.41 to 3.61 between 2017 and 2022." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          And the inflation runs hotter at the low-GPA schools, not the fancy ones &mdash; the negative correlation
          is sitting right there in Figure A3. Which is the cruel part. The transcript stops working as a warning
          light exactly where somebody needed the warning. Meanwhile the credential keeps setting records:
          Florida just posted
          {' '}<a href="https://www.fldoe.org/newsroom/latest-news/florida-sets-highest-graduation-rate-in-states-history-at-92-2-.stml" target="_blank" rel="noopener">92.2%</a>,
          the highest graduation rate in state history, up 2.5 points in a year.
        </P>

        <H2>And the test is drifting too</H2>

        <P>
          You would think the fix is easy. Ignore the grades, look at the test. Then New York released
          preliminary scores on August 5 and third-grade reading proficiency in the city
          {' '}<a href="https://www.chalkbeat.org/newyork/2026/08/13/new-york-reading-test-score-swings-raise-questions-with-experts/" target="_blank" rel="noopener">fell 14 points after rising 13</a>{' '}
          the year before. The co-chair of the state&rsquo;s own technical advisory committee told Chalkbeat there
          &ldquo;may have been an issue last year that we missed.&rdquo;
        </P>

        <Divider />

        <P>
          Three instruments. One with a coverage hole, one with a unit-of-analysis problem, one with a cut score
          somebody moved.
        </P>

        <P>
          I do not think grades are fake. I think we are having a very loud argument about what American kids
          know, using three files nobody has audited. Fix the files first.
        </P>

        <H2>Sources</H2>

        <UL items={[

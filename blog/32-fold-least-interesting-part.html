<script type="text/babel" data-presets="react">

// ==================== POST DATA ====================
const POST = {
  kind:    'Data Study',
  number:  '098',
  date:    'July 29, 2026',
  readTime: '4 min',
  title:   'A disease we eliminated came back 32-fold. The 32 is the least interesting part.',
  dek:     'The Americas eliminated measles in 2016. In 2025 the region logged 14,767 cases — 32 times the year before. That multiple is the number everyone quotes. It’s also the one carrying the least information.',
  byline:  'T.J. Müehleman',
};
// =============================================================================

const PAHO = 'https://www.paho.org/en/news/23-4-2026-paho-calls-strengthen-vaccination-amid-rising-measles-cases-americas';
const WHO  = 'https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge';
const CDC  = 'https://www.cdc.gov/measles/data-research/index.html';

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>← All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      {/* Wordmark */}
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      {/* Meta row */}
      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>№ {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      {/* Title + dek */}
      <div style={{ maxWidth:900, paddingTop:32 }}>
        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>
          {POST.dek}
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>
        </div>
      </div>
    </div>
  </Container>
);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, textAlign:'center' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222020%22%2C%222021%22%2C%222022%22%2C%222023%22%2C%222024%22%2C%222025%22%2C%222026%2A%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Confirmed+U.S.+measles+cases%22%2C%22data%22%3A%5B13%2C49%2C121%2C59%2C285%2C2288%2C2318%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23bbb%22%2C%22%23141210%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22U.S.+confirmed+measles+cases+by+year%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22beginAtZero%22%3Atrue%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of U.S. confirmed measles cases by year: 13 in 2020, 49 in 2021, 121 in 2022, 59 in 2023, 285 in 2024, 2,288 in 2025, and 2,318 so far in 2026." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
        Five years near the floor, then a wall. The fold-change you get depends entirely on which flat year you divide by. 2026 is a partial year (through July 23) and already past the 2025 full-year total. Source: CDC, Measles Cases and Outbreaks.
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The number going around is 32. As in: measles in the Americas jumped 32-fold last year — 466 confirmed cases in 2024, <a href={PAHO}>14,767 in 2025</a> across 13 countries. Thirty-two times. It’s a great number. It’s built to travel. And it’s the least useful number in the report.
        </P>

        <P>
          Here’s the thing about a 32× jump: it doesn’t tell you the outbreak is big. It tells you the baseline was small.
        </P>

        <P>
          The Americas eliminated measles in 2016 — the <a href={PAHO}>first region on Earth to do it</a>. Elimination isn’t a cure. It’s a status, and the status resets your denominator to near zero. Beat a disease down to 466 cases across two continents and the first bad year throws off a monster multiple no matter what actually happens on the ground. Divide by something close to zero and everything looks like the end of the world. That’s not epidemiology. That’s arithmetic.
        </P>

        <H2>Same disease, three numbers, none of them talking to each other</H2>

        <P>
          Ask three different counters how much measles there is and you get three answers that don’t line up. PAHO counts <a href={PAHO}>14,767 confirmed cases</a> in the Americas in 2025. The WHO models <a href={WHO}>11 million infections</a> worldwide in 2024 — an estimate, not a count, revised every year as the model learns more. The CDC counts <a href={CDC}>2,288 confirmed cases</a> in the U.S. in 2025, the most since 1991.
        </P>

        <P>
          Those aren’t the same kind of number. One’s a regional lab-confirmed count, one’s a global statistical model, one’s a national count that updates every Thursday. Stack them in a headline and you get a story. Line them up as data and you get three instruments pointed at three different things, reporting in three different units. The 32× lives entirely inside the first one — and only because 2024 happened to be a very good year.
        </P>

        <P>
          Look at the chart up top. Thirteen U.S. cases in 2020. Forty-nine in 2021. Then a wall: <a href={CDC}>2,288 in 2025, and 2,318 in 2026</a> with five months still on the clock. Run the fold-change off 2020 and measles went up 178-fold. Run it off 2019 — an ordinary 1,274-case year — and it barely doubled. Same disease, same country. The multiplier is just a story about which year you drop into the denominator.
        </P>

        <H2>The number that actually predicts something</H2>

        <P>
          If the fold-change is the lagging, viral, basically-useless number, there’s a leading one nobody screenshots: two-dose coverage against the 95% line.
        </P>

        <P>
          95% is the floor. Below it, the most contagious virus we know <a href={WHO}>finds a path</a>. Globally, two-dose coverage sits at <a href={WHO}>76%</a>. In the Americas, second-dose coverage is <a href={PAHO}>79%</a>. In the U.S., kindergarten MMR <a href={CDC}>slid to 92.5%</a> for the 2024–25 school year — under the line.
        </P>

        <Fig caption={<>Three different instruments (routine second-dose coverage for the global and regional figures; kindergarten MMR completion for the U.S.), all short of the 95% two-dose threshold WHO says is needed to stop transmission. Sources: WHO (global, 2024); PAHO (Americas MCV2, 2024); CDC (U.S. kindergarten, 2024–25).</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Global%2C+2+doses+%28WHO%29%22%2C%22Americas%2C+MCV2+%28PAHO%29%22%2C%22U.S.+kindergarten+MMR+%28CDC%29%22%2C%22Herd-immunity+floor%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Coverage+%28%25%29%22%2C%22data%22%3A%5B76%2C79%2C92.5%2C95%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Two-dose+measles+coverage+vs+the+95%25+floor%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A100%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of two-dose measles coverage: global 76 percent, Americas 79 percent, U.S. kindergarten 92.5 percent, all below the 95 percent herd-immunity floor." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          Nobody clears the bar. And that 92.5% is a national average, which is its own kind of lie. Measles doesn’t infect the average — it infects the pocket. A country can sit at 92.5% and still hold counties down in the 70s, which is exactly where the chains start. The mean is comfortable. The distribution is where the outbreak lives.
        </P>

        <P>
          More than <a href={WHO}>30 million kids</a> were under-protected against measles in 2024, three-quarters of them in fragile or conflict-affected places. That’s the number I’d lead with. It just doesn’t fit in a push notification.
        </P>

        <Divider />

        <P>
          Elimination is a wonderful thing to earn and a miserable thing to graph. The day it breaks, your y-axis is still pinned at zero, so the comeback always looks apocalyptic. Mostly it’s the axis. Watch the coverage line, not the multiple — one of them tells you where the next chain starts, and it isn’t the 32.
        </P>

        <P>
          <em>— TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Georgia&rsquo;s math scores came out August 6. Grades four, five and six hit all-time highs, so did high-school Algebra, and proficiency <a href="https://gpee.org/2025-2026-georgia-milestones-results-released/">rose or stayed the same on 12 of 13 assessments</a>. Superintendent Richard Woods <a href="https://www.wabe.org/georgia-milestone-2025-2026-scores-see-all-time-high-in-math-steady-rise-in-science-and-social-studies/">credited &ldquo;getting rid of Common Core&rdquo;</a>. Fine. Reasonable victory lap.
        </P>

        <P>
          The thirteenth test is reading. There is no number. Not a bad number &mdash; no number. GaDOE says 2025&ndash;26 was the first administration of ELA aligned to Georgia&rsquo;s new K&ndash;12 standards, so <a href="https://www.wabe.org/georgia-milestone-2025-2026-scores-see-all-time-high-in-math-steady-rise-in-science-and-social-studies/">&ldquo;additional test development activities must be completed before ELA scores can be calculated and reported.&rdquo;</a> The state <a href="https://thecurrentga.org/2026/08/08/despite-record-math-gains-half-of-georgia-students-still-below-proficiency/">needs until November</a>.
        </P>

        <P>
          I build student data systems for a living, and that is the least surprising sentence in the release. You can&rsquo;t report a proficiency rate before somebody decides where proficient starts. Georgia already did this dance for math: a committee convened in July 2024 and, per <a href="https://www.gadoe.org/Curriculum-Instruction-and-Assessment/Assessment/Pages/Georgia-Milestones-2023-2024-Statewide-Scores.aspx">GaDOE&rsquo;s own statewide-scores note</a>, kept the existing Developing and Proficient cuts while setting new Distinguished cuts. Which is why this year&rsquo;s headline holds up &mdash; the department says percent proficient-and-above <em>is</em> comparable to prior years. Credit where it&rsquo;s due. The math record is real.
        </P>

        <P>
          The reading number isn&rsquo;t late. It doesn&rsquo;t exist.
        </P>

        <H2>The part that didn&rsquo;t make the press release</H2>

        <P>
          Georgia&rsquo;s House this year moved <a href="https://georgiarecorder.com/2026/02/16/lawmakers-push-plan-to-lift-georgias-lagging-literacy-rates/">HB 1193, the Georgia Early Literacy Act of 2026</a> &mdash; 41 pages of phonics, dyslexia screening, and a literacy coach for basically every school with K&ndash;3 kids. House Education Chairman Chris Erwin put the hiring need at &ldquo;somewhere close to 1,300 or over,&rdquo; on top of the 5,000 certified positions the state already has open. Same reporting: <a href="https://georgiarecorder.com/2026/02/16/lawmakers-push-plan-to-lift-georgias-lagging-literacy-rates/">62% of Georgia third graders are not reading proficiently</a>, per the Georgia Council on Literacy.
        </P>

        <Callout label="The timing">
          A statewide phonics overhaul, roughly 1,300 new coaches to hire, and a reading test whose scale hasn&rsquo;t been set yet. November&rsquo;s ELA scores will be a baseline, not a trend. Whatever Georgia reading does next, nobody will be able to say what it did it <em>from</em>.
        </Callout>

        <H2>Four states, one testing year</H2>

        <P>
          And Georgia is the tidy version.
        </P>

        <P>
          Pennsylvania moved every state test online this spring, then <a href="https://www.chalkbeat.org/philadelphia/2026/08/18/state-test-score-delay-leaves-educators-scrambling/">put the statewide PSSA and Keystone release on hold</a>, telling districts a &ldquo;review of preliminary data is still underway.&rdquo; Districts did get preliminary school-level files in June. Philadelphia still says it cannot use the results to evaluate year-over-year achievement or to run school selection, so kids will sit an alternative exam instead. New Jersey&rsquo;s scores are late too. And in New York City, third-grade reading proficiency <a href="https://www.chalkbeat.org/newyork/2026/08/13/new-york-reading-test-score-swings-raise-questions-with-experts/">fell 14 points after rising 13 the year before</a> &mdash; a swing weird enough that EdTrust-New York asked for an independent audit and the state&rsquo;s own technical advisory committee scheduled a meeting to work out what happened. The testing vendor says it found no anomalies. The state says speculation is not a substitute for data. Nobody has an explanation.
        </P>

        <P>
          Then Colorado, which could actually publish. Its 2026 CMAS reading numbers rose 5.0 points in grade four and 1.9 in grade five, and then went negative in six, seven and eight.
        </P>

        <Fig caption={<>Percentage-point change in the share of students meeting or exceeding expectations on CMAS English language arts, 2025 to 2026, from the state-level table in <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/state-level-results-cmas-psat-sat-2026">CDE&rsquo;s 2026 CMAS/PSAT/SAT release</a>. Grade 6 falls 2.6 points, from 44.2 to 41.6. CDE publishes these differences directly.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Grade+3%22%2C%22Grade+4%22%2C%22Grade+5%22%2C%22Grade+6%22%2C%22Grade+7%22%2C%22Grade+8%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Change+in+%25+meeting+or+exceeding%2C+2025+to+2026%22%2C%22data%22%3A%5B-1.2%2C5.0%2C1.9%2C-2.6%2C-2.2%2C-1.7%5D%2C%22backgroundColor%22%3A%5B%22%238a8a8a%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%238a8a8a%22%2C%22%238a8a8a%22%2C%22%238a8a8a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22Colorado+could+publish+its+2026+reading+number.%22%2C%22It+falls+off+a+cliff+at+grade+six.%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-4%2C%22max%22%3A6%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22percentage-point+change+in+ELA%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of Colorado CMAS English language arts change from 2025 to 2026 in percentage points: grade 3 minus 1.2, grade 4 plus 5.0, grade 5 plus 1.9, grade 6 minus 2.6, grade 7 minus 2.2, grade 8 minus 1.7."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          The footnote is the good part. CDE explains that its social studies results only begin in 2026 because <a href="https://ed.cde.state.co.us/newsbureau/newsrelease/state-level-results-cmas-psat-sat-2026">&ldquo;performance level cut scores were not adopted until 2026.&rdquo;</a> Same mechanism as Georgia&rsquo;s ELA blackout. Different subject, different state, identical sentence.
        </P>

        <Divider />

        <P>
          Four states, one testing year: a blackout, a hold, an audit request, and a cliff at grade six.
        </P>

        <P>
          Every one of those has a boring, defensible, technically correct explanation. Standards changed. Cut scores had to be reset. Testing moved to a browser. Vendors ran their checks and found nothing. Nobody did anything wrong. That&rsquo;s the thing about data infrastructure &mdash; it doesn&rsquo;t blow up. It fails politely, on schedule, with a memo attached.
        </P>

        <P>
          And the bill comes due somewhere else. Georgia is about to spend real money hiring 1,300 coaches to move a number it can&rsquo;t currently print. Philadelphia is placing kids without one. New York is auditing one it doesn&rsquo;t trust.
        </P>

        <P>
          Twelve of thirteen is a great headline. The thirteenth is the one the law is about.
        </P>

      </article>
    </Prose>

);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here is how the federal government computes chronic absenteeism. Take every student who missed 10 percent or more of the days they were enrolled, counted across the whole school year. That’s the top of the fraction. Now divide by the number of students enrolled on <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">one day: October 1</a>. Not an average. Not year-end.
        </P>

        <P>
          GAO audited the math in <a href="https://www.gao.gov/products/gao-26-107920">a September 2026 report (GAO-26-107920)</a> and the data came out funny. In school year 2022–23, about 2.5 percent of schools reported a chronic absenteeism rate above 100 percent (<a href="https://files.gao.gov/reports/GAO-26-107920/index.html">GAO says that’s a lower bound</a>). More than every kid, chronically absent. At schools flagged for comprehensive support, it was nearly 13 percent. At shared-time schools, where students attend part of the day (some career and technical programs, say), it was over 30 percent. Pennsylvania had 62 of its 63 shared-time schools over the line. One example in the report: a school that showed up at 125 percent, when a reliable calculation gave 66.
        </P>

        <P>
          Do the arithmetic and the mechanism isn’t mysterious. A kid who enrolls in November can land in the numerator and never appear in the denominator. I would expect that to bite hardest wherever kids move around a lot. (GAO’s own numbers point somewhere narrower: low-performing schools and part-day schools. I’ll stick with what it measured.)
        </P>

        <Fig caption={<>Staff counts per <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">GAO-26-107920</a>: 191 at the end of 2024, 28 at the end of 2025, a reduction of over 85 percent.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22End+of+2024%22%2C%22End+of+2025%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B191%2C28%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.45%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Institute+of+Education+Sciences+staff%2C+as+reported+by+GAO%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Staff%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: Institute of Education Sciences staff, 191 at the end of 2024 and 28 at the end of 2025." style={{ width:'100%', height:'auto' }} />
        </Fig>

        <P>
          So GAO recommended the obvious fix: report enrollment in a way that matches how the absence counts are reported. The Education Department did not concur. Its position, as GAO summarizes it, is that the mismatch is a <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">“known limitation”</a> that’s already documented, and that it would rather not add reporting burden on states. GAO’s reply is that states already identify students enrolled at least 10 days, so the added burden <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">could be minimal</a>. The department also did not concur with resuming comprehensive monitoring of state data, and it says it will announce a plan next year.
        </P>

        <P>
          Which brings us to the staffing. The Institute of Education Sciences went from 191 people at the end of 2024 to 28 at the end of 2025, and the office that stewards this data lost <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">43 percent</a> of its workforce. And 32 of 51 states have <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">not had consolidated monitoring since 2019</a>. A data pipeline with nobody checking it and a formula nobody will fix. Cool cool cool.
        </P>

        <P>
          It matters because people build things on top of this. <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">36 states</a> now put chronic absenteeism in their accountability systems, and Title I alone is <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">over $18 billion</a> a year. GAO’s bottom line is that the federal file can’t reliably be used to compare states or track trends. And at least 25 of 48 responding states define the thing <a href="https://files.gao.gov/reports/GAO-26-107920/index.html">differently than the federal file does</a>, so the national number isn’t even the same number as your state’s dashboard. I’m not saying your state’s decline isn’t real. I’m saying check which denominator it’s standing on.
        </P>

        <P>

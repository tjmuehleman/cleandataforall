// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The Stanford HAI 2026 AI Index landed in April. The headline number out of its Education chapter was the one that got the screenshots:{' '}
          <a href="https://hai.stanford.edu/ai-index/2026-ai-index-report/education">over 80% of U.S. high school and college students used generative AI for schoolwork in 2025</a>. Most of the coverage stopped there.
        </P>

        <P>
          The same week, Stanford&#8217;s SCALE Initiative published a quieter report. They started with{' '}
          <a href="https://scale.stanford.edu/sites/default/files/The%20Evidence%20Base%20on%20AI%20in%20K-12%20Report.pdf">more than 800 academic papers on AI in K-12</a> and filtered for studies that could actually answer the only question that matters &#8212; does this help kids learn?{' '}
          <a href="https://scale.stanford.edu/research-in-action/understanding-evidence-base-ai-k12-education">Twenty survived</a>. Zero in U.S. K-12 classrooms.
        </P>

        <P>
          I run a data company. I&#8217;m not going to write about AI in school. I&#8217;m going to write about the evidence pipeline that&#8217;s supposed to tell us what AI is doing in school.
        </P>

        <H2>The funnel</H2>

        <P>
          The SCALE team&#8217;s filter is the boring part of the story and the important part. Eight hundred-plus papers, expanded to{' '}
          <a href="https://www.edtechinnovationhub.com/news/stanford-expands-ai-research-repository-for-k12-as-evidence-base-grows">over 1,100 in their open repository</a> by late 2025. Most got cut for the same reason every honest education-research review cuts most studies: the treatment group is one classroom. There&#8217;s no control. The effect window is two weeks. The instrument was made up by the same team that ran the trial.
        </P>

        <P>
          Twenty papers cleared a real causal-inference bar. The SCALE team&#8217;s own characterization:{' '}
          <a href="https://www.edtechinnovationhub.com/news/stanford-report-finds-limited-evidence-behind-ai-impact-in-k-12-classrooms">most are in postsecondary or international contexts</a>, and outcomes are heavily tilted toward math. Literacy, social-emotional learning, the teacher-vs.-student split in who&#8217;s using the tool &#8212; those have effectively no U.S. K-12 causal evidence yet.
        </P>

        <P>
          So when guidance documents tell districts to &#8220;use the evidence&#8221; in their AI adoption decisions, there is no U.S. K-12 evidence to use. There is U.K. higher-ed evidence. There is Chinese university evidence. There is a math-heavy global pool of about 20 studies. That&#8217;s it.
        </P>

        <H2>The other gap</H2>

        <P>
          The same HAI report has a second pair of numbers I can&#8217;t stop thinking about.
        </P>

        <UL items={[
          <>80% of U.S. high school and college students using AI for schoolwork.</>,
          <>About 50% of U.S. middle and high schools with any AI policy in place.</>,
          <>6% of U.S. teachers saying their school&#8217;s AI guidance is clear.</>,
        ]} />

        <P>
          Adoption sprinted. Policy walked. Guidance hasn&#8217;t left the house.
        </P>

        <Fig caption={<>Source: <a href="https://hai.stanford.edu/ai-index/2026-ai-index-report/education">Stanford HAI &#8212; 2026 AI Index Report, Education chapter</a>; and summary coverage at <a href="https://wiingy.com/newsroom/stanford-ai-index-report-students-schools/">Wiingy</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22U.S.+students+using+AI+for+schoolwork%22%2C%22U.S.+middle%2Fhigh+schools+with+any+AI+policy%22%2C%22Teachers+who+say+school+AI+guidance+is+clear%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25%22%2C%22data%22%3A%5B80%2C50%2C6%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%23bbbbbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+74-point+gap%3A+students+use+it%2C+teachers+have+no+rules%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22anchor%22%3A%22end%22%2C%22align%22%3A%22right%22%2C%22color%22%3A%22%23141210%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A14%7D%2C%22formatter%22%3A%22value%22%7D%7D%7D%7D&v=2.9.4&w=900&h=440&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart: 80% of U.S. students using AI for schoolwork; about 50% of middle/high schools with any AI policy; 6% of teachers saying school guidance is clear."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          Six percent. That&#8217;s the figure I&#8217;d put on the wall. Six percent of American teachers say they have a clear rule for the tool 80% of their students are already using to do homework.
        </P>

        <H2>Why it stays this way</H2>

        <P>
          Here&#8217;s the data-pipeline part. The reason there&#8217;s no U.S. K-12 causal evidence isn&#8217;t that researchers aren&#8217;t trying. It&#8217;s that the unit of analysis &#8212; a classroom, a teacher, a curriculum &#8212; is the worst possible unit for the experiment that&#8217;s actually being run.
        </P>

        <P>
          Kids don&#8217;t use AI on a curriculum. They use it at 10pm on their phones, on assignments graded by a teacher who has a 6% chance of having a rule about whether that&#8217;s allowed. The treatment exposure can&#8217;t be randomized because it&#8217;s already universal. The control group doesn&#8217;t exist.
        </P>

        <P>
          The only studies that could answer the long-run question &#8212; what does AI-assisted middle school do to a kid by college? &#8212; would need years of consented telemetry across districts, with student-level outcome data. There is no national infrastructure to collect it.{' '}
          <a href="https://hai.stanford.edu/ai-index/2026-ai-index-report/education">Thirty U.S. states had issued some form of AI-in-education guidance by January 2026</a>. Most of the guidance is a paragraph. None of it requires districts to track outcomes, retain data, or share with researchers.
        </P>

        <Callout label="The data-pipeline read">
          Adoption is moving at phone-trend speed. The evidence pipeline is moving at peer-review speed. The two clocks aren&#8217;t even on the same wall.
        </Callout>

        <H2>What to watch</H2>

        <P>
          By 2029 the first cohort that was in 5th grade when ChatGPT launched will be writing college applications. There is no longitudinal dataset in the U.S. that will let anyone honestly say whether AI exposure during middle school helped them, hurt them, or did nothing.
        </P>

        <P>
          The next education story isn&#8217;t whether AI is good for learning. It&#8217;s whether anyone is set up to find out.
        </P>

        <P>
          Twenty papers. Zero in U.S. K-12. Tens of millions of American kids closing the gap with whatever the chatbot says.
        </P>

        <P style={{ marginTop:'2em' }}>
          <em>&#8212; TJ</em>

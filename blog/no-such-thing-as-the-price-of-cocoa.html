// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On December 18, 2024, a metric ton of cocoa cost <a href="https://tradingeconomics.com/commodity/cocoa">$12,646</a> &mdash; an all-time high, a 177% run in a single year, the wildest commodity move of the decade. Sixteen months later it had fallen to near <a href="https://tradingeconomics.com/commodity/cocoa">$3,400</a>. Then, on May 11, 2026, it snapped back to <a href="https://www.barchart.com/story/news/1855399/cocoa-prices-soar-on-crop-fears">$4,709</a> before sliding again toward $3,800 by late May. Spike, crash, rebound. Eighteen months.
        </P>

        <P>
          That whole dramatic arc is one price. And it&rsquo;s the price that lands on almost nobody.
        </P>

        <P>
          Here&rsquo;s the data problem hiding inside the chocolate story: there is no such thing as <em>the</em> price of cocoa. There are at least three of them, measured at three points in the chain, on three different clocks. They&rsquo;re supposed to be the same signal read at different stages. In 2025 and 2026 they stopped agreeing.
        </P>

        <H2>Three prices, three clocks</H2>

        <P>
          The first is the one you just saw &mdash; the futures print on the ICE exchange. It reprices by the second, off a weather map and a pod-count survey, and it&rsquo;s the number every headline means when it says &ldquo;cocoa.&rdquo;
        </P>

        <P>
          The second is the farmgate price: what a grower actually gets. In West Africa that isn&rsquo;t set by the market at all. A state board fixes it, in advance, for a season. Côte d&rsquo;Ivoire, the world&rsquo;s biggest grower, <a href="https://africanagribusiness.com/ivory-coast-slashes-farmgate-cocoa-price-by-57-percent/5453/">cut its mid-crop farmgate 57%</a> for 2025/26, from 2,800 to 1,200 CFA per kilo &mdash; about $2.13. The farmer doesn&rsquo;t get the daily quote. He gets whatever the board decided months ago. And this year, often, he got it late or not at all &mdash; Ghana&rsquo;s COCOBOD confirmed that growers who <a href="https://www.gbcghanaonline.com/general/cocobod-explains-financing-crisis-cocoa-price-pressures-and-farmer-payments-amid-global-market-downturn/2026/">delivered beans in November and December 2025</a> were still unpaid months later. Some walked away from the trees and <a href="https://www.pbs.org/newshour/world/rotting-cocoa-and-a-commodity-crash-push-west-african-farmers-to-seek-other-options">went into illegal sand mining</a> for cash.
        </P>

        <P>
          The third price is the one you pay. US retail &ldquo;candy and chewing gum&rdquo; ran <a href="https://www.bls.gov/news.release/cpi.t07.htm">7.1% higher in May 2026</a> than a year earlier, and USDA expects sugar and sweets up <a href="https://www.ers.usda.gov/data-products/food-price-outlook/summary-findings">about 6.9% across 2026</a>. The raw commodity fell by nearly three-quarters and then whipsawed. Your candy bar just kept climbing.
        </P>

        <Fig caption={<>The three cocoa prices, 2024&ndash;2026, moving three directions. ICE futures down 73% from the Dec 2024 peak ($12,646) to the April 2026 low (~$3,400) &mdash; arithmetic: (3,400 &minus; 12,646) &divide; 12,646. Ivorian farmgate down 57%, 2,800 to 1,200 CFA/kg. US retail candy up 7.1% year over year (May 2026). Sources: <a href="https://tradingeconomics.com/commodity/cocoa" style={{ color:'inherit' }}>Trading Economics</a>, <a href="https://africanagribusiness.com/ivory-coast-slashes-farmgate-cocoa-price-by-57-percent/5453/" style={{ color:'inherit' }}>African Agribusiness</a>, <a href="https://www.bls.gov/news.release/cpi.t07.htm" style={{ color:'inherit' }}>BLS</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22ICE+cocoa+futures%22%2C%22Ivorian+farmgate%22%2C%22US+retail+candy+%28CPI%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+change%22%2C%22data%22%3A%5B-73%2C-57%2C7.1%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+change%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart. ICE cocoa futures down 73 percent. Ivorian farmgate price down 57 percent. US retail candy up 7.1 percent. Two prices crashed, one rose."
            style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          Put them side by side and the textbook breaks. A futures price is supposed to transmit &mdash; down to the farmgate, up to the shelf. Instead: minus 73, minus 57, plus 7. Same bean, same eighteen months, three directions.
        </P>

        <H2>The gap is the story</H2>

        <P>
          None of this is a mystery once you stop pretending there&rsquo;s a single number. The three prices run on different shutter speeds. Futures move in real time. The farmgate is frozen by an administrative decision and then thawed slowly, with a payment lag stacked on top. Retail is locked in by the forward hedges the big chocolate makers placed <em>during</em> the spike &mdash; so shoppers are paying 2024&rsquo;s panic on a 2026 commodity. Three snapshots of the same thing, taken with three different cameras, and they no longer line up.
        </P>

        <P>
          So which one is &ldquo;the price of cocoa&rdquo;? Depends who&rsquo;s asking. The trader lives in the first number, the farmer in the second, the parent at checkout in the third. The distance between them isn&rsquo;t noise, and it isn&rsquo;t lag to be smoothed away. It <em>is</em> the market.
        </P>

        <Callout label="Key figure">
          Over one eighteen-month stretch the three cocoa &ldquo;prices&rdquo; moved three ways: ICE futures &minus;73% (Dec 2024 peak to April 2026 low), Ivorian farmgate &minus;57% (2025/26 main crop to mid crop), US retail candy +7.1% (year over year, May 2026).
        </Callout>

        <Divider />

        <P>
          Next time a headline hands you the price of cocoa, ask which one. The commodity crashed 73%. The farmer got cut 57%, and paid late. You got charged 7% more. They&rsquo;re all true &mdash; and the only thing they agree on is that they&rsquo;ve stopped agreeing.
        </P>

      </article>
    </Prose>
  </Container>
);

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

//   <P>Paragraph text.</P>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On September 14 the IRS updated a page most people don’t know exists. It lists every state
          that has made an advance election to participate in the Federal Scholarship Tax Credit — the
          first federal private school choice program in American history, created by the One Big
          Beautiful Bill Act, live on <a href="https://www.irs.gov/government-entities/federal-state-local-governments/federal-scholarship-tax-credit-fstc" target="_blank" rel="noopener">January 1, 2027</a>.
        </P>

        <P>
          There are <a href="https://www.irs.gov/government-entities/federal-state-local-governments/federal-scholarship-tax-credit-fstc" target="_blank" rel="noopener">30 states on it</a>.
          Go to <a href="https://ballotpedia.org/State_participation_in_the_federal_K-12_education_tax_credit_program" target="_blank" rel="noopener">Ballotpedia</a>,
          which is where most coverage of this program points, and there are 27.
        </P>

        <H2>Where the 27 comes from</H2>

        <P>
          On June 8 the IRS put out <a href="https://www.irs.gov/newsroom/more-than-half-the-us-states-signed-up-to-participate-in-the-federal-scholarship-tax-credit-program-enacted-under-the-one-big-beautiful-bill" target="_blank" rel="noopener">IR-2026-76</a>,
          announcing that 27 states had elected to participate, and naming all 27. That release is where
          the number everyone quotes comes from. It was a fine number. On June 8.
        </P>

        <P>
          The release also says the IRS “will maintain and update the official list of participating
          states,” points to the live page as “the most current information,” and then adds, in case
          that was too subtle: “Some state websites may not yet reflect their current participation status.”
        </P>

        <P>
          The IRS told you the press release would go stale. It went stale. Three states joined in the
          meantime.
        </P>

        <H2>The three</H2>

        <P>
          Kentucky’s legislature overrode Gov. Andy Beshear’s veto of House Bill 1 on March 17.
          Kansas overrode its governor’s veto of Senate Bill 361 on <a href="https://dfipolicy.org/education-freedom-tax-credit/" target="_blank" rel="noopener">April 9</a>.
          North Carolina overrode the veto of House Bill 87 on <a href="https://dfipolicy.org/education-freedom-tax-credit/" target="_blank" rel="noopener">June 3</a> —
          a bill Gov. Josh Stein had vetoed back in <a href="https://ballotpedia.org/State_participation_in_the_federal_K-12_education_tax_credit_program" target="_blank" rel="noopener">August 2025</a>.
        </P>

        <P>All three are on the IRS list. None of them are on Ballotpedia’s.</P>

        <Fig caption={<>Days between each state’s veto override and Sept. 20, 2026. Override dates: Kentucky HB 1, March 17, 2026 (<a href="https://ballotpedia.org/State_participation_in_the_federal_K-12_education_tax_credit_program" target="_blank" rel="noopener">Ballotpedia</a>); Kansas SB 361, April 9, 2026, and North Carolina HB 87, June 3, 2026 (<a href="https://dfipolicy.org/education-freedom-tax-credit/" target="_blank" rel="noopener">Defense of Freedom Institute</a>). All three appear on the <a href="https://www.irs.gov/government-entities/federal-state-local-governments/federal-scholarship-tax-credit-fstc" target="_blank" rel="noopener">IRS participating-states list</a> and none appear on Ballotpedia’s.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Kentucky++%28HB+1+override%2C+Mar+17%29%22%2C%22Kansas++%28SB+361+override%2C+Apr+9%29%22%2C%22North+Carolina++%28HB+87+override%2C+Jun+3%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Days+in+the+program%22%2C%22data%22%3A%5B187%2C164%2C109%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%235a5a5a%22%5D%2C%22barPercentage%22%3A0.45%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Three+states+on+the+IRS+list%2C+absent+from+the+tracker%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A200%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Days+from+state+action+to+Sept+20%2C+2026%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
               alt="Horizontal bar chart showing days each state has been participating but absent from the Ballotpedia list: Kentucky 187 days, Kansas 164 days, North Carolina 109 days"
               style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Kentucky is the one that gets me. Ballotpedia <em>has</em> the override. It’s in the news
          timeline on that page. It’s in the official-action table on that page, dated March 17, 2026,
          with the bill number. The site knows Kentucky overrode the veto. It just never moved Kentucky
          into the list of participating states.
        </P>

        <P>
          That isn’t a sourcing failure. That’s two tables on one page that don’t talk to each other.
        </P>

        <H2>And while we’re in here</H2>

        <P>
          The partisan breakdown section of that same page opens with “Twenty-three have Republican
          trifectas. All twenty-three states—” and then lists twenty-two. North Dakota is missing.
          North Dakota is on Ballotpedia’s own participating-states list further down the page, and its
          governor’s January 26 announcement has its own entry in the noteworthy events section.
        </P>

        <P>One page. Three places. One state that shows up in two of them.</P>

        <Callout label="The authoritative list">
          The IRS maintains it, dates it, and updates it. As of September 14, 2026 it holds 30 states.
          It is free, public, and takes about four seconds to read.
        </Callout>

        <H2>The part that actually matters</H2>

        <P>
          The <a href="https://dfipolicy.org/education-freedom-tax-credit/" target="_blank" rel="noopener">Defense of Freedom Institute</a> runs
          a competing tracker and gets 30 — Kansas, Kentucky, North Carolina, all of them. Good. Its
          sources section cites exactly two things: the IRS page, and Ballotpedia.
        </P>

        <P>

        </P>

          it is free, it carries a date stamp, and it was updated six days ago. Nobody has to reconcile
          anything or file a request or build a scraper. You just have to go look at it instead of quoting
          a press release from June.
        </P>

        <Divider />

        <P>
          A program with no cap on total credits and an income ceiling at 300% of area median gross income
          goes live in 102 days. Families in Kansas, Kentucky and North Carolina are eligible. The page
          most reporting points to still says they’re not.
        </P>

      </article>
    </Prose>

);

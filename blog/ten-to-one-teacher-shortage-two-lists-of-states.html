const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Here's the line making the rounds: for every empty teaching job in America, there are ten classrooms with a teacher who isn't fully certified to be there. 387,843 against 37,569, per the Learning Policy Institute's <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">July 2026 scan</a>. It's a great line. It's also a division problem where the top and the bottom came off different guest lists.
        </P>

        <P>
          The 387,843 covers all 50 states plus D.C. The 37,569 covers 29 states plus D.C., because that's how many <a href="https://learningpolicyinstitute.org/media/5002/download?inline=&amp;file=State_Vacancy_2026_RESOURCE.pdf">publish vacancy data at all</a>. Ohio reports 1,858 teachers without proper certification for their courses and no vacancy count. Oklahoma reports 11,163 and no vacancy count. Thirty of 51 jurisdictions on one side of the fraction, all 51 on the other. Ten-to-one is partly a measurement of who keeps a spreadsheet.
        </P>

        <H2>What counts as "unfilled"?</H2>

        <P>
          Depends on the state, and on the day. Alabama's number is a December survey count, and LPI says right in the table that it's <a href="https://learningpolicyinstitute.org/media/5002/download?inline=&amp;file=State_Vacancy_2026_RESOURCE.pdf">"likely an overcount of unfilled positions"</a> because it includes positions filled by long-term substitutes or teachers on emergency credentials. Which is to say, people who belong in the <em>other</em> bucket. Data years run from 2023–24 to 2025–26, depending on the state. LPI's own summary: all values should be read as estimates.
        </P>

        <P>
          So the credential side is soft (some states survey only some districts, some report percentages and LPI backs into counts) and the vacancy side is softer (fewer states, different dates, one known overlap). Divide soft by softer and you get a number that feels precise to one decimal place. 10.3.
        </P>

        <H2>The part that actually moved</H2>

        <P>
          Here's what I'd put on the slide instead. Compared with the 2025 scan, the states that reported vacancies both years show about 7,000 fewer unfilled positions, <a href="https://learningpolicyinstitute.org/media/5002/download?inline=&amp;file=State_Vacancy_2026_RESOURCE.pdf">a 16% decrease</a>. The 48 states plus D.C. with certification data both years show about 15,800 more teachers not fully certified, a 4% increase. The combined figure has risen three years running, and LPI says this year's rise was <a href="https://learningpolicyinstitute.org/media/5002/download?inline=&amp;file=State_Vacancy_2026_RESOURCE.pdf">primarily driven</a> by the certification side.
        </P>

        <Fig caption={<>Source: <a href="https://learningpolicyinstitute.org/media/5002/download?inline=&amp;file=State_Vacancy_2026_RESOURCE.pdf">Learning Policy Institute, State Teacher Shortages 2026 Update</a>, data description. Changes are LPI's approximations (about 7,000 fewer unfilled; about 15,800 more not fully certified) among states reporting in both the 2025 and 2026 scans. The two groups of states are not the same set, so the bars aren't additive.</>}>
          <img src={CHART2} alt="Bar chart of change since the 2025 scan: unfilled positions down about 7,000 (16 percent) in 29 states plus DC, teachers not fully certified up about 15,800 (4 percent) in 48 states plus DC." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Can I prove the empty seats got filled by uncertified teachers? No. The two lists don't line up cleanly enough. But it's the pattern you'd expect if they did, and it's the version of the story that survives the denominator problem, because each bar is compared against itself.
        </P>

        <H2>And the ratio isn't a law of nature</H2>

        <P>
          Louisiana reports <a href="https://learningpolicyinstitute.org/media/5002/download?inline=&amp;file=State_Vacancy_2026_RESOURCE.pdf">736 unfilled positions and 17,131 teachers not fully certified</a>. Mississippi reports 3,815 unfilled and 2,095 not fully certified. North Dakota: 219 and 78. In two of those three, the empty seats outnumber the credential gaps. Same table. Same scan. A national "ten classrooms" that holds in Louisiana and flips in Mississippi is an average of states that define the problem differently.
        </P>

        <Divider />

        <P>
          Ten-to-one is a real number. It's just not a real ratio.
        </P>

        <P><em>— TJ</em></P>

        <p style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--muted)', maxWidth:'68ch' }}>
          Sources: <a href="https://learningpolicyinstitute.org/media/5002/download?inline=&amp;file=State_Vacancy_2026_RESOURCE.pdf">LPI, State Teacher Shortages 2026 Update (PDF)</a> · <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-2026-factsheet">LPI 2026 factsheet</a> · <a href="https://learningpolicyinstitute.org/product/state-teacher-shortages-vacancy-resource-tool-2026">LPI Vacancy Resource Tool 2026</a>.
        </p>

      </article>
    </Prose>
  </Container>
);

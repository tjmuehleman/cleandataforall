const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Just over 600,000 American public school kids went to a fully virtual school last year.
          About 1 in 80. Roughly double the pre-pandemic number.
        </P>

        <P>
          I did not get that from the Department of Education. I got it from{' '}
          <a href="https://www.chalkbeat.org/2026/08/27/virtual-school-enrollment-has-surged-since-pandemic-new-federal-data-shows/">a reporter at Chalkbeat</a>{' '}
          who pulled the raw federal files and did the join himself.
        </P>

        <P>
          That&rsquo;s the actual story here, and it&rsquo;s a data story before it&rsquo;s an education story.
        </P>

        <H2>The series everyone used to use</H2>

        <P>
          <a href="https://nces.ed.gov/programs/digest/d23/tables/dt23_216.20.asp">NCES Digest Table 216.20</a>{' '}
          &mdash; public school enrollment by charter, magnet, and virtual status. It runs 2013&ndash;14 through
          2022&ndash;23. It ends at 562,659 virtual students. The table says it was prepared in December 2023,
          and it hasn&rsquo;t moved since.
        </P>

        <P>
          Two things about that line should bother you more than the slope does.
        </P>

        <P>
          First, look at the last three published points: 590,267, then 566,188, then 562,659. Going down.
          Now read the footnotes. 2020&ndash;21 is missing California, Illinois, and Utah. 2021&ndash;22 is
          missing California. So some of the decline in the official series is a decline in the number of
          states in the denominator. That&rsquo;s not a trend in the world. It&rsquo;s a trend in the response rate.
        </P>

        <P>
          Second, the line stops. Not because the counting stopped &mdash; this is the part that gets me. The{' '}
          <a href="https://ies.ed.gov/learn/news/2024-25-common-core-data-ccd-universe-data-files-now-available-0">2024&ndash;25 CCD universe files shipped</a>.
          They are on the IES site right now. The collection ran. The states reported. The virtual status flag
          is sitting in the file.
        </P>

        <P>
          Nobody turned it into a table.
        </P>

        <H2>The report is the product</H2>

        <P>
          DOGE canceled the Education Department&rsquo;s research contracts in February 2025, and most of the
          staff at the Institute of Education Sciences were laid off. Since then{' '}
          <a href="https://www.chalkbeat.org/2026/05/07/education-department-ies-cuts-weaken-school-data-and-digest-statistics/">a big chunk of the Digest has just sat there</a>.
          Per-pupil spending. Student-to-teacher ratio. Average teacher salary. SAT and ACT takers.
          Disciplinary incidents. Teacher prep enrollment. Stale since at least January 2025. A department
          spokesperson said a new contract would be awarded before the fiscal year ends in September.
        </P>

        <P>
          I&rsquo;ve spent a lot of years now working in the gap between &ldquo;the data exists&rdquo; and
          &ldquo;somebody can actually use it.&rdquo; Districts live in that gap. The student information
          system has the field, the field is populated, and there is no report. The report is the product.
          A fixed-width extract and a 90-page codebook is not a fact anybody can act on. It&rsquo;s a
          homework assignment.
        </P>

        <P>
          The feds just ran that experiment on themselves.
        </P>

        <Fig caption={<>High school and grades 1&ndash;8 shares are Chalkbeat&rsquo;s figures from the 2024&ndash;25 CCD. The all-students bar is 1.25%, which is 1 divided by 80. Indiana bars compare the federal count for fall 2024 (1%) with Chalkbeat&rsquo;s analysis of state records for the same year (about 3%). Cross-state comparisons are shaky by Chalkbeat&rsquo;s own caution; Indiana is shown as a check on the count, not a ranking.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22High+school%22%2C%22Grades+1-8%22%2C%22All+students+%281+in+80%29%22%2C%22Indiana%2C+federal+count%22%2C%22Indiana%2C+state+count%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%25+of+public+school+students+in+fully+virtual+schools%22%2C%22data%22%3A%5B1.6%2C0.8%2C1.25%2C1.0%2C3.0%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23bbb%22%2C%22%235a5a5a%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Fully+virtual+enrollment%2C+2024-25+%28%25%29+-+and+one+state+where+the+count+disagrees%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22beginAtZero%22%3Atrue%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+students%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart. High school 1.6 percent, grades 1 to 8 0.8 percent, all students 1.25 percent, Indiana federal count 1 percent, Indiana state count 3 percent."
            style={{ display:'block', width:'100%', maxWidth:900, margin:'0 auto', height:'auto' }} />
        </Fig>

        <H2>What we can&rsquo;t see</H2>

        <P>
          This matters here specifically because virtual school is a decision parents make one kid at a time.
          1.6% of high schoolers are in one. 0.8% of grades 1&ndash;8. A majority are charters. Two vendors,
          Stride and Pearson, account for a large chunk of it &mdash; Stride&rsquo;s own{' '}
          <a href="https://investors.stridelearning.com/news/news-details/2026/Stride-reports-fourth-quarter-and-full-year-2026-financial-results/default.aspx">earnings report</a>{' '}
          says its K12 schools now enroll over 240,000 students across public and private.
        </P>

        <P>
          And the best evidence anybody has about whether these schools work is from 2016. Fordham{' '}
          <a href="https://fordhaminstitute.org/national/research/enrollment-and-achievement-ohios-virtual-charter-schools">looked at Ohio&rsquo;s e-schools</a>{' '}
          and found students there lost ground against otherwise-similar kids in brick-and-mortar schools.
          That was ten years ago, when the sector was about half the size it is now.
        </P>

        <Callout label="The count itself is soft">
          Federal data put 1% of Indiana students in fully virtual schools in fall 2024. Chalkbeat&rsquo;s
          analysis using more detailed state records put it at about 3%. Same kids, same year, two systems,
          three times the number.
        </Callout>

        <P>
          So the enrollment doubled, the official series stopped, the last real outcomes study is a decade old,
          and in the one state where somebody bothered to check the federal number against the state&rsquo;s
          own records, it was off by 3x.
        </P>

        <Divider />

        <P>
          Everybody agrees remote school failed. Half a million families signed up for it anyway. On purpose,
          with public money, years after anyone made them.
        </P>

        <P>
          We stopped publishing the number right when it got interesting.
        </P>

        <H2>Sources</H2>

        <UL items={[
          <><a href="https://www.chalkbeat.org/2026/08/27/virtual-school-enrollment-has-surged-since-pandemic-new-federal-data-shows/">Chalkbeat, &ldquo;Virtual school enrollment has doubled in recent years, following pandemic-era surge&rdquo;</a> (Matt Barnum, Aug 27, 2026; data analysis by Kae Petrin). Source for 600,000+ fully virtual students in 2024&ndash;25, 1 in 80, twofold increase, 195,000 additional students in primarily-online schools, 1.6% of high schoolers vs 0.8% of grades 1&ndash;8, majority in charters, the Indiana 1% vs 3% discrepancy, and the Stride figure.</>,
          <><a href="https://nces.ed.gov/programs/digest/d23/tables/dt23_216.20.asp">NCES Digest of Education Statistics, Table 216.20</a> &mdash; enrollment by school level, type, and charter, magnet, and virtual status, 2012&ndash;13 through 2022&ndash;23. Source for every point on the solid line, the December 2023 preparation date, and the missing-state footnotes.</>,
          <><a href="https://ies.ed.gov/learn/news/2024-25-common-core-data-ccd-universe-data-files-now-available-0">IES, 2024&ndash;25 Common Core of Data universe data files</a> &mdash; confirmation that the underlying collection ran and the files are public.</>,
          <><a href="https://www.chalkbeat.org/2026/05/07/education-department-ies-cuts-weaken-school-data-and-digest-statistics/">Chalkbeat, &ldquo;School data goes stale after Trump administration cuts Education Department research arm&rdquo;</a> (May 7, 2026). Source for the February 2025 contract cancellations, the IES layoffs, the list of Digest tables unupdated since at least January 2025, and the department&rsquo;s statement about a new contract before the end of the fiscal year.</>,
          <><a href="https://fordhaminstitute.org/national/research/enrollment-and-achievement-ohios-virtual-charter-schools">Thomas B. Fordham Institute, &ldquo;Enrollment and Achievement in Ohio&rsquo;s Virtual Charter Schools&rdquo;</a> (June Ahn, 2016).</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

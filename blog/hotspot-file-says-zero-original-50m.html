// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;

const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The FCC put this in its own order last September: there is &ldquo;no data or analysis
          regarding the amount of federal funding that has already been used to fund federal and
          state Wi-Fi hotspot lending programs or the impact of the Commission&rsquo;s decision to use
          limited E-Rate funding for this purpose.&rdquo; That line is in the <a href="https://www.federalregister.gov/documents/2026/01/21/2026-01053/addressing-the-homework-gap-through-the-e-rate-program-partial-withdrawal">Order
          on Reconsideration</a> that killed the program.
        </P>

        <P>
          The data is a public download. It took me about twenty minutes.
        </P>

        <H2>What is actually in the file</H2>

        <P>
          USAC publishes every E-Rate funding request, by applicant, by product type, by dollar.
          Filter funding year 2025 for the two off-premises hotspot categories and you get 907 funding
          requests from 815 applicants across 48 states and Puerto Rico, asking for $50,231,398 in
          support. 398 school districts. 300 libraries and library systems. FY2025 was the only year
          those categories ever appeared on the form.
        </P>

        <P>
          I expected the map to be rural. It is not. Los Angeles Unified asked for $13,166,370 &mdash;
          26% of the national total, by itself. The top ten applicants are 52% of it. California is
          51.5%. The median applicant asked for $6,374, and 723 of the 815 &mdash; 89% &mdash; asked for
          less than $50,000 apiece, which together came to 13.6% of the money.
        </P>

        <Callout label="Scale check">
          All FY2025 Form 471 requests totaled $3,333,573,045. The hotspot lines were $50,231,398 of
          that. 50,231,398 divided by 3,333,573,045 is 1.5%. The order describes the rules it rescinded
          as a &ldquo;potentially massive expansion of the E-Rate program.&rdquo;
        </Callout>

        <H2>Two versions of the same row</H2>

        <P>
          Here is the part that got me. The Form 471 dataset keeps two versions of every funding
          request, Original and Current. Pull both for those 907 requests and they do not agree.
        </P>

        <Fig caption={<>Original and Current form versions of the same 907 FY2025 funding requests, field <em>funding commitment request</em>. Author&rsquo;s aggregation of <a href="https://opendata.usac.org/E-Rate/E-Rate-Request-for-Discount-on-Services-FRN-Status-/qdmp-ygft">USAC E-Rate open data</a>. Current status: 887 denied, 16 cancelled.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Original+Form+471+%28as+filed%29%22%2C%22Current+Form+471+%28after+denials%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22%24+requested%22%2C%22data%22%3A%5B50.23%2C0%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23bbbbbb%22%5D%2C%22borderWidth%22%3A0%2C%22barPercentage%22%3A0.45%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Same+907+funding+requests%2C+two+versions+of+the+same+file%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A55%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Funding+commitment+requested%2C+%24+millions%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart comparing two versions of the same 907 funding requests. The original Form 471 shows 50.23 million dollars requested. The current Form 471, after USAC denials, shows zero."
            style={{ display:'block', width:'100%', maxWidth:900, margin:'0 auto', height:'auto' }} />
        </Fig>

        <P>
          The current file says the whole thing cost nothing. Which is true, and also the only answer
          available, because the Commission <a href="https://www.federalregister.gov/documents/2026/01/21/2026-01053/addressing-the-homework-gap-through-the-e-rate-program-partial-withdrawal">directed
          USAC</a> to deny all of them. And that zero is doing real work. The order&rsquo;s regulatory
          flexibility certification finds no significant economic impact on a substantial number of
          small entities, partly because &ldquo;funding for the services permitted in the
          <em>Hotspots Order</em> has not been approved for any E-Rate entities&rdquo; and
          &ldquo;no services or equipment have been provided.&rdquo;
        </P>

        <P>
          Nothing was provided because the agency said not to provide it. The impact analysis is
          reading the outcome of the decision it is supposed to be analyzing. Meanwhile the number it
          says does not exist has been sitting in the Original form version the whole time, itemized,
          with 815 names on it.
        </P>

        <H2>FY2026 is not a decline</H2>

        <P>
          The obvious follow-up is whether districts kept asking anyway. They cannot. FY2026 has
          319,430 Form 471 line items and zero in either hotspot category, because the product types
          are gone from the form. That is not demand falling off. That is a checkbox being removed,
          which is much harder to spot later, since absence and zero look identical in a spreadsheet
          and only one of them is a measurement.
        </P>

        <Divider />

        <P>
          Ten days ago the Department of Education quietly shipped the 2023-24 Civil Rights Data
          Collection, which for the first time asks schools whether students who needed Wi-Fi devices
          for learning actually <a href="https://www.npr.org/2026/09/04/nx-s1-5955681/civil-rights-data-schools-trump">received
          them</a>. It landed without the First Look report that normally summarizes a collection, so
          nobody has run it.
        </P>

        <P>
          Two federal files about the same kids, from two agencies, neither one summarized by the
          agency that published it. One counts who needed a device. The other counts who asked to pay
          for it, and then overwrites itself with a zero.
        </P>

      </article>
    </Prose>
  </Container>
);

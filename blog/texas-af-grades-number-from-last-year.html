// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>
//   <Divider />  (section break)
//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Texas put a letter grade on 9,105 campuses on August 14. I went looking for the racial
          breakdown, because that&rsquo;s the cut that travels, and I found it in about nine seconds.
          Of roughly 300 majority-Black campuses, 20 got an A. 105 got a D or an F.
        </P>

        <P>
          Then I checked the dateline. The <a href="https://www.the74million.org/article/black-majority-schools-in-texas-receive-more-fs-than-a-ratings-leaving-parents-with-tough-choices/">Texas
          Tribune ran that analysis</a> on August 10 &mdash; four days <em>before</em> TEA released the
          2026 ratings. The 105 is from 2025.
        </P>

        <P>
          Which is not a Tribune problem. Their piece says &ldquo;last year&rdquo; plainly, more than
          once. It&rsquo;s a downstream problem. The most quotable fact about Texas school quality this
          month is a year old, and the 2026 version of it doesn&rsquo;t exist yet.
        </P>

        <H2>What TEA published, and what it didn&rsquo;t</H2>

        <P>
          Go read the <a href="https://tea.texas.gov/about-tea/newsroom/tea-releases-2026-f-accountability-ratings-txschoolsgov">August
          14 release</a>. It has 1,202 districts and 9,105 campuses. 24% of both improved on last year.
          585 campuses moved up to an A. 85% of rated campuses landed at C or better. 49% of
          high-poverty campuses earned an A or B, <a href="https://texas2036.org/texas-a-f-school-ratings/">up
          from 47%</a>.
        </P>

        <P>
          Not one cut by student race. Not in the release, not in the graphics.
        </P>

        <P>
          So if you want the 2026 version of &ldquo;105 D&rsquo;s and F&rsquo;s,&rdquo; somebody has to go
          build it: pull the campus rating file, join it to enrollment demographics, pick a definition of
          &ldquo;majority,&rdquo; count. That&rsquo;s a Tuesday for anybody with a laptop. But it
          isn&rsquo;t in the release, so the number that circulates is the one somebody already did the
          work on. Which is last year&rsquo;s.
        </P>

        <H2>The denominator is doing some work</H2>

        <P>
          Here&rsquo;s the part I can&rsquo;t stop looking at. TEA says 9,105 campuses were rated. Then the
          footnote under the campus graphic: of those 9,105, 560 (6%) received a rating of &ldquo;Not
          Rated&rdquo; and are not included on the graphic.
        </P>

        <P>
          So 8,545 campuses actually got a letter. 85% of <em>those</em> cleared C. Multiply it out
          &mdash; 85% of 8,545 is about 7,263 &mdash; and as a share of all 9,105 campuses TEA says it
          rated, acceptable performance is 79.8%.
        </P>

        <Fig caption={<>Left bar is TEA&rsquo;s published figure: 85% of rated campuses at C or above. Right bar is the same numerator against the full campus count cited in the same paragraph: 85% &times; 8,545 = 7,263, and 7,263 &divide; 9,105 = 79.8%. Campus counts and the 560 Not Rated exclusion are from the <a href="https://tea.texas.gov/about-tea/newsroom/tea-releases-2026-f-accountability-ratings-txschoolsgov">August 14 TEA release</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Share+of+the+8%2C545+campuses%5Cnthat+actually+got+a+letter%22%2C%22Share+of+all+9%2C105+campuses%5CnTEA+says+it+rated%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Rated+C+or+above%22%2C%22data%22%3A%5B85.0%2C79.8%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Texas+2026%3A+%5C%2285%25+acceptable%5C%22+depends+on+the+denominator%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%2C%22display%22%3Afalse%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+at+C+or+above%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart comparing 85 percent of the 8,545 Texas campuses that received a letter grade rated C or above, against 79.8 percent of all 9,105 campuses TEA says it rated."
            style={{ display:'block', width:'100%', maxWidth:900, margin:'0 auto', height:'auto' }} />
        </Fig>

        <P>
          Five points, and none of it from teaching. It came from a footnote. I don&rsquo;t know which way
          those 560 campuses would have cut if they&rsquo;d been graded, and neither does the press release
          &mdash; that&rsquo;s sort of the point. The categories are defined in TEA&rsquo;s own <a href="https://tea.texas.gov/school-and-district-leaders/accountability/academic-accountability/performance-reporting/2026-accountability-rating-system">2026
          rating system manual</a>. The headline is defined by whoever picked the denominator.
        </P>

        <H2>And the grades aren&rsquo;t final</H2>

        <P>
          Texas 2036 runs a disclaimer under its <a href="https://texas2036.org/texas-a-f-school-ratings/">2026
          summary</a>: districts have the right to appeal their rating through December 2026, and scores may
          be subject to change.
        </P>

        <Callout label="What that means in practice">
          The ratings families used to pick schools in August are provisional until December. By the time
          they settle, the school year is a third gone.
        </Callout>

        <P>
          I&rsquo;m not against appeals. A rating you can&rsquo;t contest is worse than one you can. But
          it&rsquo;s worth saying plainly: Texas shipped a number in August, told parents to choose with it,
          reserved the right to revise it in December, and publishes no version history when it does. The
          letter a parent reads on TXschools.gov carries no timestamp they can see.
        </P>

        <Divider />

        <P>
          Five consecutive F ratings and the commissioner has to replace the elected school board or close
          the campus. That&rsquo;s the weight resting on a grade whose denominator moves, whose value is
          provisional for four months, and whose most-cited breakdown the state doesn&rsquo;t publish at all.
        </P>

        <P>
          The letters are fine. It&rsquo;s the footnotes that are grading Texas.
        </P>

      </article>
    </Prose>
  </Container>
);

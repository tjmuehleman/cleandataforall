// Available helper components:
//   <H2>Section heading</H2>

);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On May 13, ACT reached into MyACT and took the scores back.
        </P>

        <P>
          Every student who had taken the ACT online during spring school-day testing &mdash; the state-mandated
          junior-year administration, not the Saturday test &mdash; logged in and found nothing there. ACT had
          found a problem in <em>equating</em>, the process that makes a hard test form and an easy test form
          produce comparable scores. Revised scores started repopulating on{' '}
          <a href="https://www.azed.gov/sites/default/files/2026/05/Spring_2026_Scores-School_FAQ.pdf" target="_blank" rel="noopener">May 18, with everyone holding a final score by June 2</a>.
        </P>

        <P>
          And then the part that matters to anyone who works with this data. ACT told schools the revised scores
          would be{' '}
          <a href="https://www.azed.gov/sites/default/files/2026/05/Spring_2026_Scores-School_FAQ.pdf" target="_blank" rel="noopener">&ldquo;equal to or slightly higher than what was originally reported.&rdquo;</a>{' '}
          The examinee FAQ asks the question even more plainly &mdash; could my score go down? &mdash; and{' '}
          <a href="https://www.d120.org/assets/1/6/act-s_d-spring-2026-scores-examinees-faq.pdf" target="_blank" rel="noopener">answers it with one word. No.</a>
        </P>

        <P>
          A correction that can only move one direction isn&rsquo;t really a correction. It&rsquo;s a ratchet.
        </P>

        <H2>Four months later, the accountability results land</H2>

        <P>
          North Carolina reported out on September 2. Four-year graduation rate{' '}
          <a href="https://www.dpi.nc.gov/news/press-releases/2026/09/02/2026-graduation-rate-reaches-historic-high-accountability-results-continue-positive-trend-north" target="_blank" rel="noopener">88.8&#37;, a record, up from 87.8&#37;</a>.
          Composite proficiency 59.2&#37;. College-and-career-ready 37.5&#37;, up from 34.7&#37;. Biology from 48&#37; to 59&#37; in
          a single year. And 162 fewer schools designated low-performing, with only 10 districts on the
          low-performing list &mdash; 13 fewer than last year and the fewest since 2018-19.
        </P>

        <P>
          I went in expecting to have to dig for the asterisk. I didn&rsquo;t. NC DPI put it in the press release,
          in the good-news release, unprompted:
        </P>

        <BQ cite="NC DPI, September 2, 2026">
          This year&rsquo;s results include a one-time correction that increased scores: ACT identified a technical
          scoring issue in its spring 2026 online, school-day testing and rescored all affected exams nationwide.
        </BQ>

        <P>
          That is a state accountability office volunteering a comparability break inside its own record-setting
          announcement. It is the right call and it is rare. So this isn&rsquo;t a story about a state hiding
          something. It&rsquo;s a story about what disclosure actually buys you when the vendor never published
          the number.
        </P>

        <H2>The asterisk with nothing behind it</H2>

        <P>
          North Carolina&rsquo;s 11th-grade ACT composite came in at 18.4. That figure isn&rsquo;t decorative &mdash;
          DPI says the ACT, ACT WorkKeys, math course rigor and graduation rates all factor into School Performance
          Grades for high schools. Those grades are the machinery that moves campuses on and off the low-performing
          list.
        </P>

        <Fig caption={<>Source: NC DPI, Sept. 2, 2026. District figure is DPI&rsquo;s stated year-over-year change (10 districts this year, &ldquo;13 fewer than in 2024-25&rdquo;).</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Schools+off+the+low-performing+list%22%2C%22Districts+off+the+low-performing+list%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Fewer+than+2024-25%22%2C%22data%22%3A%5B162%2C13%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%238a8580%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22What+moved+off+North+Carolina%27s+low-performing+lists+in+one+year%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Count%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=360&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart: 162 fewer schools and 13 fewer districts designated low-performing in 2025-26"
            style={{ display:'block', width:'100%', height:'auto' }}
          />
        </Fig>

        <P>
          Now try to answer the obvious question. How much of that movement is the rescore?
        </P>

        <P>
          You can&rsquo;t. Not because North Carolina won&rsquo;t tell you &mdash; because ACT didn&rsquo;t say.
          &ldquo;Slightly higher&rdquo; is the entire published magnitude of the correction. No mean point gain.
          No breakdown by score band. Nothing about whether the adjustment was flat across the scale or bunched
          somewhere in particular, which matters a lot when a state uses a threshold: 55&#37; of North Carolina juniors
          scored a 17 or higher this year, the minimum for UNC-system admission. What was that share before the
          rescore? Nobody published it. And ACT told districts that any files generated before its final
          communication{' '}
          <a href="https://www.azed.gov/sites/default/files/2026/05/Spring_2026_Scores-School_FAQ.pdf" target="_blank" rel="noopener">&ldquo;should not be used for any purpose&rdquo;</a>{' '}
          until scores were final.
        </P>

        <Callout label="The whole disclosed magnitude">
          &ldquo;Students who tested online can anticipate their Composite scores and section scores to be equal to
          or slightly higher than what was originally reported.&rdquo; That is ACT&rsquo;s published quantification
          of a correction now embedded in state accountability systems.
        </Callout>

        <H2>Monitor forward is the only move left</H2>

        <P>
          DPI&rsquo;s own language is careful: it will &ldquo;monitor how this year&rsquo;s ACT results compare with
          future years as part of its ongoing trend analysis.&rdquo; Monitor forward. Which is the only option
          available to them, because you cannot decompose a number when the thing that moved it was never
          quantified. The footnote is honest and the arithmetic is still unavailable.
        </P>

        <P>
          And North Carolina is the early one. Every state that runs the ACT online on a school day is publishing
          2026 accountability results with the same one-way adjustment sitting inside them. Most will publish a
          composite, a proficiency rate, a set of school letter grades. Far fewer will publish the sentence North
          Carolina published.
        </P>

        <Divider />

        <P>
          North Carolina did the honest thing, and it still doesn&rsquo;t get you very far. The asterisk is there.
          The disclosure is real. The number that would let anyone check the work lives at a vendor that has said,
          publicly, only that scores went up a little.
        </P>

        <P>
          <em>Slightly.</em>
        </P>

      </article>
    </Prose>
  </Container>

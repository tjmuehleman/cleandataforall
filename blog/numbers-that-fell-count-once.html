<style>
  :root{
    --ink:#141210;
    --paper:#F4EFE6;
    --rule: rgba(20,18,16,.18);
    --rule-soft: rgba(20,18,16,.10);
    --muted: rgba(20,18,16,.62);
    --display: 'Roboto Slab', serif;
    --body: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[data-theme="paper"]{ --ink:#141210; --paper:#F4EFE6; --rule:rgba(20,18,16,.18); --rule-soft:rgba(20,18,16,.10); --muted:rgba(20,18,16,.62); }
  html[data-theme="poster"]{ --ink:#EDE6D8; --paper:#171413; --rule:rgba(237,230,216,.22); --rule-soft:rgba(237,230,216,.10); --muted:rgba(237,230,216,.6); }
  html[data-theme="zine"]{ --ink:#0A0908; --paper:#EFEBDF; --rule:rgba(10,9,8,.35); --rule-soft:rgba(10,9,8,.18); --muted:rgba(10,9,8,.68); }

  html[data-pair="slab-serif"]{ --display:'Roboto Slab', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }
  html[data-pair="grotesk-serif"]{ --display:'Archivo', sans-serif; --body:'Fraunces', Georgia, serif; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="slab-mono"]{ --display:'Roboto Slab', serif; --body:'IBM Plex Mono', monospace; --mono:'IBM Plex Mono', monospace; }
  html[data-pair="display-serif"]{ --display:'Instrument Serif', serif; --body:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', monospace; }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }
  body{ font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","ss02","onum"; }
  a{ color: inherit; }
  ::selection{ background: var(--ink); color: var(--paper); }

  body::before{
    content:""; position: fixed; inset:0; pointer-events:none; z-index: 1;
    background-image:
      radial-gradient(rgba(20,18,16,.045) 1px, transparent 1px),
      radial-gradient(rgba(20,18,16,.03) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
    opacity: .7;
  }
  html[data-theme="poster"] body::before{
    background-image:
      radial-gradient(rgba(237,230,216,.04) 1px, transparent 1px),

    mix-blend-mode: screen;

  #root{ position: relative; z-index: 2; }

  /* Post body typography */
  .post-body p { margin: 0 0 1.5em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body h2 { font-family: var(--display); font-weight: 900; font-size: clamp(24px, 2.5vw, 34px); line-height: 1.05; margin: 2em 0 0.5em; letter-spacing: -0.01em; }
  .post-body h3 { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 2vw, 26px); line-height: 1.1; margin: 1.8em 0 0.4em; }
  .post-body ul, .post-body ol { margin: 0 0 1.5em; padding-left: 1.4em; font-size: 19px; line-height: 1.65; max-width: 68ch; }
  .post-body li { margin-bottom: 0.4em; }
  .post-body blockquote { margin: 2em 0; padding: 0 0 0 24px; border-left: 3px solid var(--ink); font-style: italic; font-size: 20px; line-height: 1.6; max-width: 60ch; color: var(--ink); }

  .post-body a { border-bottom: 1px solid var(--rule); text-decoration: none; }

  .post-body figcaption { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }

  .post-body code { font-family: var(--mono); font-size: 0.88em; background: var(--rule-soft); padding: 2px 5px; }
  .post-body pre { font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--rule-soft); padding: 20px 24px; overflow-x: auto; margin: 2em 0; }

<body>

<script type="text/babel" data-presets="react">

// ==================== POST DATA ====================
const POST = {
  kind:    'Analysis',
  number:  '083',
  date:    'July 11, 2026',
  readTime: '3 min',
  title:   'The numbers that fell are the ones we only have to count once',
  dek:     'The WHO’s 2026 hepatitis report led with two numbers that fell and buried two that didn’t. The difference isn’t willpower. It’s that prevention is something you count once, and treatment is something you count five times.',
  byline:  'T.J. Müehleman',
};

const WHO = 'https://www.who.int/news/item/28-04-2026-efforts-to-eliminate-hepatitis-delivers-gains-but-more-action-needed-to-meet-2030-targets';

// ==================== Shared primitives ====================
const Rule = ({ double, style }) => (
  double
    ? <div style={{ borderTop:'1px solid var(--ink)', borderBottom:'1px solid var(--ink)', height:6, margin:0, ...style }} />
    : <hr style={{ height:1, background:'var(--rule)', border:0, margin:0, ...style }} />
);

const Small = ({ children, style }) => (
  <span style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:500, ...style }}>
    {children}
  </span>
);

const Container = ({ children, style }) => (
  <div style={{ maxWidth:1240, margin:'0 auto', padding:'0 clamp(24px, 5vw, 72px)', ...style }}>
    {children}
  </div>
);

const Prose = ({ children, style }) => (
  <div style={{ maxWidth:760, margin:'0 auto', ...style }}>
    {children}
  </div>
);

// ==================== Top bar ====================
const TopBar = () => (
  <div style={{ borderBottom:'1px solid var(--rule)', fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)' }}>
    <Container>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 0', gap:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:20 }}>
          <span>{POST.date}</span>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <a href="../index.html" style={{ textDecoration:'none' }}>&larr; All dispatches</a>
          <a href="../index.html#about" style={{ textDecoration:'none' }}>About</a>
        </div>
      </div>
    </Container>
  </div>
);

// ==================== Post header ====================
const PostHeader = () => (
  <Container>
    <div style={{ padding:'48px 0 40px' }}>
      {/* Wordmark */}
      <div style={{ marginBottom:32 }}>
        <a href="../index.html" style={{ textDecoration:'none' }}>
          <div style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(28px, 4vw, 48px)', lineHeight:0.9, letterSpacing:'-0.02em', textTransform:'uppercase' }}>
            Clean Data For All
          </div>
        </a>
      </div>

      <Rule double />

      {/* Meta row */}
      <div style={{ display:'flex', gap:24, padding:'16px 0', flexWrap:'wrap', alignItems:'center' }}>
        <Small>&#8470; {POST.number}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small style={{ color:'var(--muted)' }}>{POST.date}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>&middot;</span>
        <Small style={{ color:'var(--muted)' }}>{POST.readTime} read</Small>
      </div>

      <Rule />

      {/* Title + dek */}
      <div style={{ maxWidth:900, paddingTop:32 }}>
        <h1 style={{ fontFamily:'var(--display)', fontWeight:900, fontSize:'clamp(38px, 6vw, 82px)', lineHeight:0.95, margin:'0 0 24px', letterSpacing:'-0.015em', textWrap:'balance' }}>
          {POST.title}
        </h1>
        <p style={{ fontSize:'clamp(18px, 2vw, 24px)', lineHeight:1.45, margin:'0 0 24px', maxWidth:'54ch', textWrap:'pretty', color:'var(--ink)' }}>
          {POST.dek}
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <Small style={{ color:'var(--muted)' }}>By {POST.byline}</Small>
        </div>
      </div>
    </div>
  </Container>
);

// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, textAlign:'center' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Hepatitis+B%22%2C%22Hepatitis+C%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Share+never+treated%22%2C%22data%22%3A%5B95%2C80%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Share+of+people+with+chronic+hepatitis+who+have+never+been+treated%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+people+living+with+the+infection%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontStyle%22%3A%22bold%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart. Share of people living with chronic hepatitis who have never been treated: hepatitis B 95 percent or more, hepatitis C 80 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
        Untreated share = 100% &minus; treated share. WHO reports hepatitis B treatment below 5% (untreated 95%+) and hepatitis C treatment at 20% (untreated 80%). Source: WHO, 28 April 2026.
      </figcaption>
    </figure>
  </Container>
);

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On April 28 the WHO dropped its <a href={WHO}>Global Hepatitis Report 2026</a>, and the press release led with two good numbers: new hepatitis B infections are <a href={WHO}>down 32% since 2015</a>, and hepatitis C deaths are <a href={WHO}>down 12%</a>. Real wins. Sustained ones.
        </P>

        <P>
          Four paragraphs down, in the same release, sit two numbers nobody put in a headline. <a href={WHO}>Fewer than 5% of the 240 million people</a> living with chronic hepatitis B are getting treatment. And <a href={WHO}>only 20% of people with hepatitis C</a> have ever been treated &mdash; in the decade since a 12-week course of pills that <a href={WHO}>cures more than 95% of cases</a> became available.
        </P>

        <P>
          I run a data company, not a clinic. So I don&rsquo;t read that as a will problem. I read it as two different counting problems wearing the same lab coat.
        </P>

        <H2>Prevention is a broadcast</H2>

        <P>
          The numbers that improved all have one thing in common: you count them once. A birth-dose vaccine is a single event. One baby, one day, one dose, one record &mdash; on a schedule you can predict nine months in advance. Do that at scale and hepatitis B prevalence among kids under five <a href={WHO}>drops to 0.6%</a>, with <a href={WHO}>85 countries</a> already at or past the 2030 target of 0.1%. That&rsquo;s the easy number. Not easy to deliver &mdash; easy to count.
        </P>

        <H2>Treatment is a manhunt</H2>

        <P>
          Now try to treat someone who already has the virus. You have to find them, test them, confirm the diagnosis, link them to a clinic, and keep them in care long enough for the therapy to finish. Five steps. Every one of them leaks people &mdash; the undiagnosed, the tested-but-lost, the diagnosed-but-never-started. The cure has existed since 2015. The pipeline to a specific person with chronic HBV in a specific district still doesn&rsquo;t. That&rsquo;s why &ldquo;we have the cure&rdquo; and &ldquo;fewer than 5% are treated&rdquo; are both true at once, and not a contradiction.
        </P>

        <Callout label="Key figure">
          240 million people live with chronic hepatitis B. Fewer than 5% are on treatment. The pills work. The finding-people part is the unsolved problem.
        </Callout>

        <H2>Where the broadcast breaks</H2>

        <P>
          Even prevention falls apart where you&rsquo;d most want it not to. The WHO African Region accounts for <a href={WHO}>68% of new HBV infections</a> worldwide &mdash; and <a href={WHO}>only 17% of newborns</a> there get the birth-dose vaccine. The one intervention that&rsquo;s a clean single event, and it reaches fewer than one in five of the babies who need it most. When the easy number is that low, the hard number doesn&rsquo;t stand a chance.
        </P>

        <Fig caption={<>WHO African Region, 2024. Source: WHO, 28 April 2026.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Share+of+new%5Cnglobal+HBV+infections%22%2C%22Newborns+given+the%5Cnbirth-dose+vaccine%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22WHO+African+Region%2C+2024%22%2C%22data%22%3A%5B68%2C17%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22WHO+African+Region%3A+the+burden+is+high%2C+the+one-dose+fix+is+scarce%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontStyle%22%3A%22bold%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A100%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22percent%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart. WHO African Region 2024: share of new global hepatitis B infections 68 percent; newborns given the birth-dose vaccine 17 percent." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          Here&rsquo;s the part that should bother anyone who works with data. Ten countries &mdash; Bangladesh, China, Ethiopia, Ghana, India, Indonesia, Nigeria, the Philippines, South Africa, and Viet Nam &mdash; account for <a href={WHO}>69% of the world&rsquo;s hepatitis B deaths</a>. That&rsquo;s not a diffuse, unknowable problem. It&rsquo;s a concentrated, mapped, named-country problem, with a cure sitting on the shelf and <a href={WHO}>1.1 million people dying of it in 2024</a> anyway.
        </P>

        <Divider />

        <P>
          We didn&rsquo;t fail to invent the answer. We invented it in 2015. We just never built the thing that finds the person.
        </P>

        <P style={{ fontStyle:'italic', color:'var(--muted)' }}>&mdash; TJ</P>

      </article>
    </Prose>
  </Container>
);

        <div>

          <div>Hosted on Github pages. Built with a mix of Claude and TJ.</div>

      <div style={{ borderTop:'1px solid var(--rule)', padding:'18px 0', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--muted)' }}>
        <span>&copy; 2013&ndash;2026 <a href="https://www.standardco.de" target="_blank" rel="noopener" style={{ color:'inherit', borderBottom:'1px solid currentColor', textDecoration:'none' }}>Standard Co</a> &middot; All rights unreserved</span>

        .cdfa-colophon{ grid-template-columns: 1fr !important; }
      }
    `}</style>
  </footer>

// ==================== App ====================
function App() {
  return (
    <div>
      <TopBar />
      <PostHeader />
      <PostHero />
      <PostBody />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

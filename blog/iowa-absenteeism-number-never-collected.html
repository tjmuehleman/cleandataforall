const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Iowa&rsquo;s chronic absenteeism rate fell from 21.6% to 15.8% in a single year, according to the{' '}
          <a href="https://educate.iowa.gov/media/11873/download?inline=" target="_blank" rel="noopener">Iowa Department of Education</a>.
          Of the 44 states and D.C. that have reported 2024&ndash;25 numbers, that&rsquo;s the{' '}
          <a href="https://www.future-ed.org/tracking-state-trends-in-chronic-absenteeism/" target="_blank" rel="noopener">largest decline in the country</a>.
          Four states and D.C. went the other way.
        </P>

        <P>
          Everybody is pointing at the same law.{' '}
          <a href="https://educate.iowa.gov/pk-12/student-supports/prevention/attendance-chronic-absenteeism" target="_blank" rel="noopener">Senate File 2435</a>,
          signed May 9, 2024, effective July 1. Three tiers. Miss more than 10% of a grading period and the school notifies your parents and the county attorney.
          Hit 15% and the family sits down for a school engagement meeting and signs an absenteeism prevention plan. Hit 20% and you&rsquo;re truant, and the county attorney decides whether to charge.
        </P>

        <P>
          I run a data company. So the thing I went looking for was the tier counts &mdash; how many letters, how many meetings, how many referrals.
          What I found instead is that the number that fell and the number the law acts on are two different numbers.
        </P>

        <H2>&ldquo;It is defined both ways depending on the source&rdquo;</H2>

        <P>
          That&rsquo;s not my phrasing. That&rsquo;s question 39 of the state&rsquo;s own{' '}
          <a href="https://educate.iowa.gov/media/10555/download?inline" target="_blank" rel="noopener">Attendance and Chronic Absenteeism FAQ</a>,
          asking whether chronic absenteeism means missing 10% of school days or <em>more than</em> 10%, and answering, in writing, that it depends who&rsquo;s asking.
        </P>

        <Callout label="The two definitions">
          <strong>SF2435:</strong> more than 10% of days or hours <em>in a grading period</em>, counting only <em>non-exempt</em> absences, reset at the start of every grading period. Used for student-level truancy decisions.<br /><br />
          <strong>Federal ESSA:</strong> 10% or more of days <em>across the school year</em>, <em>regardless of the reason</em>. Used for &ldquo;all of Iowa&rsquo;s chronic absenteeism data reporting, including for the purposes of school accountability.&rdquo;
        </Callout>

        <P>
          15.8% is the second one. The law runs on the first one.
        </P>

        <P>
          They come apart in both directions. A kid who misses 12% of the fall quarter and 6% of the other three trips a tier-one notice and never lands on the scoreboard.
          A kid who misses 11% of the year with a documented medical reason is chronically absent on the scoreboard and never generates a single letter.
          The state doesn&rsquo;t hide this. It writes it down: &ldquo;State exemptions under SF2435, SF277 and SF2219 do not apply to federal chronic absenteeism calculations.&rdquo;
        </P>

        <H2>The exemption list keeps growing. Only on one side.</H2>

        <P>
          SF2435 shipped with six exemptions. Senate File 277 added four more in 2025 &mdash; military entrance processing, military service, traveling to a funeral, traveling to a wedding.
          Senate File 2219 added an eleventh in 2026: participation in a school-sponsored activity.
        </P>

        <P>
          Eleven exemptions on the trigger metric. Zero on the reported metric. Those two numbers have been drifting apart on purpose for two years, and the gap between them has never been published.
        </P>

        <Fig caption={<>Source: The 74, June 22, 2026, citing Iowa Department of Education data. Federal ESSA definition, 2021&ndash;22 vs. 2024&ndash;25.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Des+Moines%22%2C%22Davenport%22%2C%22Cedar+Rapids%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222021-22%22%2C%22data%22%3A%5B45.4%2C42.5%2C38.6%5D%2C%22backgroundColor%22%3A%22%23bbbbbb%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%222024-25%22%2C%22data%22%3A%5B21.2%2C33.2%2C27.8%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Three+Iowa+districts%2C+same+metric%2C+very+different+progress%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Atrue%2C%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%2C%22boxWidth%22%3A12%7D%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A8%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22fontSize%22%3A11%2C%22max%22%3A50%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+students+chronically+absent%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Grouped bar chart of chronic absenteeism in three Iowa districts, 2021-22 versus 2024-25: Des Moines 45.4 to 21.2 percent, Davenport 42.5 to 33.2 percent, Cedar Rapids 38.6 to 27.8 percent."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>Where the law&rsquo;s number actually lives</H2>

        <P>
          Iowa publishes a document whose entire job is explaining that its attendance systems &ldquo;are not intended to be interchangeable.&rdquo;
          It ends in a comparison table across five systems, with a row labeled <em>Truancy reporting</em>. Reading across: No. No. Yes. No. No.
        </P>

        <P>
          The one Yes is the local student information system. &ldquo;Calculations for truancy reporting to meet the requirements of SF 2435 using the specified exemptions are made{' '}
          <em>solely</em> within the local SIS.&rdquo;{' '}
          (<a href="https://educate.iowa.gov/media/10669/download?inline" target="_blank" rel="noopener">Attendance Data Supports</a>)
        </P>

        <P>
          Solely. It never leaves the building. There is no statewide count of tier-one notices, no count of engagement meetings, no count of referrals.
          Des Moines told <a href="https://www.the74million.org/article/iowa-declared-war-on-chronic-absenteeism-now-its-gaining-some-ground/" target="_blank" rel="noopener">The 74</a> it
          referred 80 cases last year. One district, volunteering one number to a reporter. As far as I can tell that is the best public data that exists on how the law is being used.
        </P>

        <Divider />

        <P>
          The 5.8 points are real. Kids are in school who weren&rsquo;t, and Des Moines went from 45.4% to 21.2% in three years, which is not a rounding artifact.
          Iowa also bought Panorama licenses for every district, stood up an early-warning system, and ran a statewide reduction work group.
          Any of that could be doing the work. The law is a plausible bet, not a finding.
        </P>

        <P>
          Iowa built a three-tier machine, ran it for two years, and measured the room with a different ruler.
          The state can tell you exactly how many kids were chronically absent. It cannot tell you how many got a letter.
        </P>

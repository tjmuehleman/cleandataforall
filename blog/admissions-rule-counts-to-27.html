// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H3 = ({ children }) => <h3>{children}</h3>;

const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Massachusetts seated its first lottery class this month. More than two dozen vocational and
          technical schools, admissions by random draw whenever applicants outnumber seats, <a href="https://www.massadvocates.org/news/vocational-school" target="_blank" rel="noopener">effective for students entering fall 2026</a>.
          Grades are out. Interviews are out. Teacher recommendations are out.
        </P>

        <P>
          And the regulation is <em>specific</em>. If a school runs a weighted lottery, a kid earns one
          extra entry for <a href="https://www.massadvocates.org/news/vocational-school" target="_blank" rel="noopener">fewer than 27 unexcused full-day absences over the prior 270 school days</a>.
          One more for no suspensions or expulsions for certain serious offenses across that same 270 days.
          One more for demonstrated interest &mdash; showing up to an open house, finishing an online module.
          That is the entire permitted list.
        </P>

        <P>
          Twenty-seven absences. Two hundred seventy days. Somebody sat in a room and picked those numbers,
          and now every eighth grader in the state gets sorted against them.
        </P>

        <P>Then there&rsquo;s the number that got us here.</P>

        <H2>Eighteen thousand five hundred, as of 2020</H2>

        <P>
          <a href="https://www.wgbh.org/news/education-news/2025-05-20/itll-soon-be-a-lottery-to-get-into-vocational-and-technical-schools-in-massachusetts" target="_blank" rel="noopener">18,500 rising ninth graders applied for 10,616 seats</a>.
          That figure is in basically every story about this policy. It is the arithmetic the whole thing
          rests on. And it is from the 2020&ndash;21 school year.
        </P>

        <P>
          2020&ndash;21. The remote-learning year. The year attendance data across America stopped meaning
          what it normally means &mdash; which matters here, because attendance is now one of three things
          that can move a child&rsquo;s odds in a lottery.
        </P>

        <Fig caption={<>Years elapsed from the school year 2020&ndash;21 applicant count to each downstream event, measured from January 2021 to the dated milestone. Board vote: <a href="https://www.wgbh.org/news/education-news/2025-05-20/itll-soon-be-a-lottery-to-get-into-vocational-and-technical-schools-in-massachusetts" target="_blank" rel="noopener">May 2025</a>. First lottery class and spring 2027 data release: <a href="https://www.wgbh.org/news/education-news/2026-04-13/the-new-mass-voc-tech-lottery-was-supposed-to-solve-problems-but-some-families-are-frustrated" target="_blank" rel="noopener">GBH News</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Demand+counted+%28SY+2020-21%29%22%2C%22Board+votes+for+lottery+%28May+2025%29%22%2C%22First+lottery+class+seated+%28Sep+2026%29%22%2C%22First+admissions+data+%28spring+2027%29%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Years%22%2C%22data%22%3A%5B0%2C4.3%2C5.7%2C6.2%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23777%22%2C%22%233a3a3a%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.45%2C%22categoryPercentage%22%3A0.7%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Everything+downstream+of+a+number+measured+in+2020-21%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A7%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Years+after+the+applicant+count%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
               alt="Horizontal bar chart of years elapsed after the 2020-21 applicant count: board vote 4.3 years, first lottery class seated 5.7 years, first admissions data 6.2 years"
               style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          The Board of Elementary and Secondary Education voted in May 2025. Letters went out to families
          in February. Both of those decisions sit on top of a supply-and-demand gap measured four and five
          years earlier.
        </P>

        <H2>To be fair about it</H2>

        <P>
          The gap is almost certainly still real. Everybody GBH talked to &mdash; advocates, superintendents,
          the chamber of commerce guy who hated the policy &mdash; agrees there aren&rsquo;t enough seats. Jill
          Rossetti, who runs Blue Hills Regional Technical, put it about as plainly as you can: <a href="https://www.wgbh.org/news/education-news/2026-04-13/the-new-mass-voc-tech-lottery-was-supposed-to-solve-problems-but-some-families-are-frustrated" target="_blank" rel="noopener">regardless of the methodology, there are still students we can&rsquo;t take</a>.
          A DESE-funded analysis back in 2019 figured the state could fill a few thousand more spots.
        </P>

        <P>
          So the policy probably isn&rsquo;t wrong. But &ldquo;probably isn&rsquo;t wrong&rdquo; and
          &ldquo;measured&rdquo; are different words. Nobody has published a current count. Not the
          department, not the schools, not the advocacy groups on either side of a fight they have been
          having for three years. The most-quoted number in Massachusetts education policy is six years old
          and everyone reads it in the present tense.
        </P>

        <Callout label="What lands when">
          Admissions data for next fall&rsquo;s class arrives next spring. Graduation rates and grades under
          the new system take years after that. Measure demand in 2020&ndash;21, vote in 2025, seat the class
          in 2026, see the first numbers in 2027, learn whether it worked sometime around 2030.
        </Callout>

        <P>
          And this isn&rsquo;t a Massachusetts failure, exactly. The screening system the lottery replaced got
          indicted by a <a href="https://www.wgbh.org/news/politics/2023-02-02/federal-complaint-claims-discrimination-in-mass-vocational-school-admissions" target="_blank" rel="noopener">2023 federal civil rights complaint</a> and
          a <a href="https://www.bostonglobe.com/2024/07/18/metro/massachusetts-vocational-school-admissions-policies/" target="_blank" rel="noopener">2024 Boston Globe analysis</a>,
          both of which were also looking at years-old data. That&rsquo;s just what education datasets look like.
          You argue about the present using the most recent past anybody bothered to publish.
        </P>

        <Divider />

        <H2>The part that bugs me</H2>

        <P>
          We built a rule that can count a student&rsquo;s unexcused absences to the individual day across a
          270-day rolling window. We cannot count how many kids applied last year.
        </P>

        <P>
          One of those is a field sitting in a student information system that every district already runs,
          queried against a date range. The other is a sum. It is an addition problem across a couple dozen
          districts, and it is apparently harder to produce than the attendance window.
        </P>

        <P>
          Next spring the state publishes its first real admissions numbers, and good &mdash; that&rsquo;s the
          hard part, the who-got-in-and-who-didn&rsquo;t part. While they&rsquo;re in there, somebody should
          publish the applicant count too.
        </P>

        <P>It&rsquo;s one column.</P>

      </article>
    </Prose>
  </Container>
);

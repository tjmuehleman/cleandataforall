// ==================== Optional hero visual ====================
// Remove this block if the post doesn't have a lead visual.
const PostHero = () => (
  <Container>
    <figure style={{ maxWidth:900, margin:'0 auto 56px' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Class+of+2018+%28old+record%29+54.4%25%22%2C%22Class+of+2024+46.0%25%22%2C%22Class+of+2025+53.8%25%22%2C%22Class+of+2026+59.1%25%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B54.4%2C46%2C53.8%2C59.1%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%23bbb%22%2C%22%233a3a3a%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22National+FAFSA+completion+rate+by+high+school+class+%28NCAN%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A70%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+seniors+completing%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of national FAFSA completion rate: class of 2018 54.4%, class of 2024 46.0%, class of 2025 53.8%, class of 2026 59.1%" style={{ width:'100%', height:'auto', display:'block' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />
//   <OL items={['First', 'Second']} />
//   <BQ cite="Source name">Blockquote text.</BQ>
//   <Callout label="Note">Callout box text.</Callout>
//   <Divider />  (section break)
//   <Fig caption="Caption text."><img src="..." /></Fig>
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On July 6, the National College Attainment Network announced that the high school class of 2026 had completed the FAFSA at a rate of 59.1%, a record (<a href="https://www.ncan.org/Web/News/Class-of-2026-Sets-New-June-30-FAFSA-Completion-Record" target="_blank" rel="noopener">NCAN</a>). The old record was 54.4%, set by the class of 2018. That&rsquo;s 4.7 points. It works out to more than 200,000 extra seniors compared with the class of 2025.
        </P>

        <P>
          Cool. True, even. But read the first sentence of the release again. 59.1% <em>through June 26</em>. The headline says June 30. A record like this is a comparison of snapshots, and a snapshot is only as good as its date.
        </P>

        <P>
          Here&rsquo;s the thing about snapshots. Seniors don&rsquo;t stop filing on June 30. On October 19, NCAN&rsquo;s Tracker started its tenth year and put the class of 2026 at an estimated 64.6% through September 25 (<a href="https://www.ncan.org/Web/News/NCAN-FAFSA-Tracker-10th-Year%20Launches%20as%20U.S.%20Pushes%20to%20Extend%20FAFSA%20Record.aspx" target="_blank" rel="noopener">NCAN</a>). Same class. Same form. 5.5 points above the record we all just clapped for. (It&rsquo;s a Tracker estimate, not the June count, so don&rsquo;t staple the two together. Which is sort of the point.)
        </P>

        <P>
          The small end wobbles too. NCAN&rsquo;s May piece gives the class of 2025 as 53.9% by the end of June (<a href="https://www.ncan.org/Web/News/Class-of-2026-Sets-All-Time-High-FAFSA-Completion-Rate.aspx" target="_blank" rel="noopener">NCAN, May</a>). The July piece says 53.8% through the same date. A tenth of a point. Nobody did anything wrong, that&rsquo;s just what happens when you count a moving thing twice.
        </P>

        <H2>Tennessee isn&rsquo;t on the list</H2>

        <P>
          Then there&rsquo;s the leaderboard. Tennessee 72.7%, Illinois 71.6%, Texas 69.3%, New Jersey 67.5%, Mississippi 66.3%. NCAN says three of the top five are among the nine states with universal FAFSA policies, meaning completion is a requirement or an expectation for graduation (<a href="https://www.ncan.org/Web/News/Class-of-2026-Sets-New-June-30-FAFSA-Completion-Record" target="_blank" rel="noopener">NCAN</a>). In May, it counted four of the top five (<a href="https://www.ncan.org/Web/News/Class-of-2026-Sets-All-Time-High-FAFSA-Completion-Rate.aspx" target="_blank" rel="noopener">NCAN, May</a>). Same group, two months, one fewer.
        </P>

        <Fig caption={<>Top five states by class-of-2026 completion rate. Source: <a href="https://www.ncan.org/Web/News/Class-of-2026-Sets-New-June-30-FAFSA-Completion-Record" target="_blank" rel="noopener">NCAN, July 6, 2026</a>. Dark bars are states on NCAN&rsquo;s list of nine universal-FAFSA states (Alabama, California, Indiana, Illinois, Nebraska, New Jersey, New York, Oklahoma, Texas) as published in <a href="https://www.ncan.org/news/715517/NCANs-FAFSA-Tracker-Returns-as-Nation-Pushes-for-Record-Completions.htm" target="_blank" rel="noopener">its December 2025 Tracker release</a>. Light bars are not on that list. That says nothing about whether those states have other policies, only that NCAN doesn&rsquo;t count them among the nine.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Tennessee+72.7%25%22%2C%22Illinois+71.6%25%22%2C%22Texas+69.3%25%22%2C%22New+Jersey+67.5%25%22%2C%22Mississippi+66.3%25%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B72.7%2C71.6%2C69.3%2C67.5%2C66.3%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23bbb%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Top+five+states%2C+class+of+2026+%28dark+%3D+on+NCAN+list+of+nine+universal-FAFSA+states%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A80%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+seniors+completing%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Horizontal bar chart of top five states by FAFSA completion: Tennessee 72.7%, Illinois 71.6%, Texas 69.3%, New Jersey 67.5%, Mississippi 66.3%" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Look at the list of nine. Alabama, California, Indiana, Illinois, Nebraska, New Jersey, New York, Oklahoma, Texas. Tennessee isn&rsquo;t on it. Neither is Mississippi. So the first and fifth place states are the two the &ldquo;policy states&rdquo; story can&rsquo;t explain, at least not by NCAN&rsquo;s own count. I can&rsquo;t tell you why from these sources. I can tell you the label is doing work the data doesn&rsquo;t show.
        </P>

        <H2>And the calendar?</H2>

        <P>
          The 2026-27 form opened September 24, 2025, the earliest it&rsquo;s ever been released and the first on-time launch in three years (<a href="https://www.bestcolleges.com/news/fafsa-updates-what-students-need-to-know-federal-financial-aid" target="_blank" rel="noopener">BestColleges</a>). That&rsquo;s the obvious explanation for the jump, and it might be the right one. Nothing in the numbers above separates it from anything else that changed that year.
        </P>

        <Divider />

        <P>
          Every FAFSA record is a record as of a date. The calendar the form opened on gets the credit. The calendar the count stops on gets none.
        </P>

      </article>
    </Prose>
  </Container>
);

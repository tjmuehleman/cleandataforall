nt 30 percent." style={{ width:'100%', height:'auto', display:'block' }} />

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Georgia published two numbers for the same third graders in the same school year.
          Sixty-five percent read at or above grade level. Thirty-five percent are proficient in
          English language arts. Nobody made a mistake.
        </P>

        <P>
          Both numbers come off the Georgia Milestones ELA assessment. Same test, same kids, same
          spring. The state&rsquo;s own <a href="https://georgiainsights.gadoe.org/dashboards/reading-readiness/">Reading Readiness dashboard</a> explains
          why they differ, in a paragraph that I&rsquo;m guessing almost nobody reads: the Milestones ELA
          composite includes &ldquo;a reading status measure, based on student performance on the Reading
          &amp; Vocabulary subset of items and the associated Lexile measure, and an overall ELA
          proficiency measure based on both Reading &amp; Vocabulary and Writing &amp; Language
          content.&rdquo;
        </P>

        <P>
          So 65% is the reading half. 35% is reading plus writing. The 30-point gap isn&rsquo;t two
          agencies fighting. It&rsquo;s a subscore versus a composite, and Georgia tells you so if you
          click the Overview tab.
        </P>

        <H2>The dashboard already warned you</H2>

        <P>
          This is the part I keep chewing on, because as data products go, Georgia did this pretty
          well. The State Board <a href="https://georgiainsights.gadoe.org/dashboards/reading-readiness/">adopted the State Literacy Metric in
          November 2023</a> under Section 20-2-153.1. The dashboard names the instrument. It names the
          subscore. It even parks a caveat in a tab called Data Sources saying the results are based
          on files with &ldquo;minimal exclusions&rdquo; and that it is &ldquo;expected that these results will vary
          from reports of achievement that use different rules (e.g., CCRPI; Report Card).&rdquo;
        </P>

        <P>
          That&rsquo;s a state agency documenting its own metrological ambiguity in advance. And it still
          shipped a 65% that travels alone, because headline numbers always leave the footnote at
          home.
        </P>

        <H2>Which number the law got built on</H2>

        <P>
          In February, when lawmakers were making the case for a literacy bill, the figure in the
          room was <a href="https://thecurrentga.org/2026/02/16/lawmakers-push-plan-to-lift-georgias-lagging-literacy-rates/">62% of third graders not reading proficiently</a>,
          credited to the Georgia Council on Literacy. Sixty-two percent not proficient is the mirror
          of 38% proficient, which is <a href="https://geears.org/news/we-must-invest-in-early-education-to-improve-childrens-literacy/">exactly Georgia&rsquo;s 2024 Milestones third-grade
          figure</a>. I can&rsquo;t prove that&rsquo;s where it came from. But 2025 came in at 35%, and the mirror
          of <em>that</em> is 65%.
        </P>

        <Callout label="Same digits, opposite meaning">
          65% is Georgia&rsquo;s share of third graders reading at or above grade level on the State
          Literacy Metric. 65% is also the share who are <em>not</em> proficient on Milestones ELA
          (100 &minus; 35). Two identical numbers on the same subject, pointing in opposite
          directions, both correct.
        </Callout>

        <Fig caption={<>Georgia Milestones third-grade ELA, percent scoring Proficient or above. 2020 not administered. Source: <a href="https://geears.org/news/we-must-invest-in-early-education-to-improve-childrens-literacy/">GEEARS, reading the GaDOE 2025 Georgia Milestones state release</a> (2019: 42%; 2021: 36%; 2022: 37%; 2023: 39%; 2024: 38%; 2025: 35%).</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22line%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222019%22%2C%222021%22%2C%222022%22%2C%222023%22%2C%222024%22%2C%222025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Percent+proficient+or+above%22%2C%22data%22%3A%5B42%2C36%2C37%2C39%2C38%2C35%5D%2C%22borderColor%22%3A%22%23141210%22%2C%22backgroundColor%22%3A%22rgba%2820%2C18%2C16%2C0.06%29%22%2C%22pointBackgroundColor%22%3A%22%23141210%22%2C%22pointRadius%22%3A4%2C%22borderWidth%22%3A2%2C%22fill%22%3Afalse%2C%22lineTension%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22Georgia+third+graders%2C+Milestones+ELA%2C+proficient+or+above%22%2C%222020+not+administered.+The+law+was+written+on+2024%27s+number.%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Afalse%2C%22min%22%3A30%2C%22max%22%3A45%2C%22stepSize%22%3A3%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+proficient+or+above%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Line chart of Georgia third-grade Milestones ELA proficiency: 42 percent in 2019, 36 in 2021, 37 in 2022, 39 in 2023, 38 in 2024, 35 in 2025." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          And the state average is doing a lot of work. GPEE, reading GaDOE&rsquo;s district files, found
          third-grade ELA proficiency <a href="https://gpee.org/georgia-milestones-data-underscore-math-progress-literacy-challenges/">ranged from 0% to 68.6% across districts</a>. A 0% is
          almost certainly a tiny denominator or a reporting artifact, not a district where no child
          can read. It&rsquo;s in the statewide number either way.
        </P>

        <H2>Then there&rsquo;s the arithmetic of the fix</H2>

        <P>
          Kemp signed <a href="https://gov.georgia.gov/press-releases/2026-05-05/gov-kemp-signs-bills-strengthening-literacy-and-k-12-schools">HB 1193, the Georgia Early Literacy Act of 2026</a>,
          on May 5. It funds one literacy coach in every school serving any of grades K&ndash;3 &mdash;
          full funding above 200 students, half below. The Senate budget set aside <a href="https://www.wabe.org/every-georgia-k-3-school-may-get-a-literacy-coach-as-bill-goes-to-governors-desk/">$70 million for
          1,313 coaches</a>. Rep. Chris Erwin, who wrote the bill, put the need at &ldquo;somewhere close to
          1,300 or over,&rdquo; then said the quiet part: &ldquo;We currently have over 5,000 open certified
          positions in the state of Georgia today, and now we&rsquo;re going to put 1,300 more in there.&rdquo;
        </P>

        <P>
          The regional layer has its own math problem. Each of Georgia&rsquo;s 16 RESAs gets at least one
          regional leadership literacy coach. Caitlin Dooley, who chairs early childhood and
          elementary education at Georgia State, did the division out loud: 1,852 elementary schools,
          16 coaches, &ldquo;a load of over 100 per coach.&rdquo; The Professional Standards Commission has until
          the end of 2026 to invent the endorsement those coaches will need.
        </P>

        <Divider />

        <P>
          Here&rsquo;s the thing that actually bugs me. The whole plan rests on a pilot: in 2024&ndash;25,
          GaDOE put full-time literacy coaches in 60 schools from the lowest-performing 5% and
          reported a 15% increase in student reading, strongest in kindergarten. Fifteen percent
          measured on what? The Lexile subscore that says 65%? The composite that says 35%? A
          screener? Nobody has said.
        </P>

        <P>
          Georgia is about to spend seventy million dollars a year teaching kids to read and then
          measure whether it worked. There are at least four rulers in that drawer, and two of them
          print the same digits with opposite signs.
        </P>

      </article>
    </Prose>
  </Container>
);

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          8.6 million kids. That&rsquo;s the 2023&ndash;24 secondary CTE participant count in the federal Perkins file, <a href="https://www.acteonline.org/blog/cte-policy-watch/octae-releases-2023-24-perkins-data/">up from 7.8 million the year before &mdash; a 10.3% jump</a>. Career and technical education is the one line in American high school data that&rsquo;s going the right direction, and that number got quoted everywhere.
        </P>

        <P>
          Same release, next sentence: <a href="https://www.acteonline.org/blog/cte-policy-watch/octae-releases-2023-24-perkins-data/">&ldquo;Texas is the primary contributor, adding over 690,000 secondary CTE participants.&rdquo;</a>
        </P>

        <P>
          Do the arithmetic. 10.3% of 7.8 million is about 803,000 new participants nationally. Texas is 690,000 of them. Which leaves something like 113,000 for the other 49 states, DC, and the territories &mdash; combined. The record national year is a Texas story wearing a national headline.
        </P>

        <H2>Nobody agrees on what a participant is</H2>

        <P>
          Perkins V defines a CTE participant as someone who completes <a href="https://www.acteonline.org/wp-content/uploads/2025/03/ACTE-Perkins101-Accountability-Feb2025.pdf">not less than one course</a> in a CTE program or program of study. Federal law does not say what a course is. States do, in their own plans, and they landed in different places.
        </P>

        <P>
          <a href="https://www.michigan.gov/-/media/Project/Websites/mde/CTE/cte_Perkins/Perkins_V_FINAL_Definitions-Course_Participant_Concentrator_Completer.pdf?rev=5ebdf401798f4f9b9fe75a7faa006b58">Michigan</a> counts a student who successfully completes one Perkins Course Code. <a href="https://doe.sd.gov/cte/documents/Concentrator-Defs.pdf">South Dakota</a> requires a credit earned in a cluster or pathway course, taken for high school credit. <a href="https://www.minnstate.edu/system/cte/operational-guide/performance-indicators.html">Minnesota</a> takes any 9th&ndash;12th grader who finishes one or more courses in a state-approved program. Those are three different students. The 8.6 million is a sum across fifty-plus of these.
        </P>

        <H2>Texas re-plumbed the pipe the same year</H2>

        <P>
          Here&rsquo;s the part that made me stop. Texas hasn&rsquo;t collected CTE data from districts since 2020&ndash;21. TEA derives it from course-completion records instead. And in the 2023&ndash;24 enrollment report, buried in the technical notes:
        </P>

        <BQ cite="Texas Education Agency, Enrollment in Texas Public Schools 2023-24, p. 4">
          Beginning with this report, the CTE concentrator classification is derived from extended-year submission course completion data as well as summer submission data; therefore, numbers and percentages of CTE concentrators for the 2021&ndash;22 and 2022&ndash;23 school years presented in this report may vary from those reported in Enrollment in Texas Public Schools, 2022&ndash;23.
        </BQ>

        <P>
          Read that again. Texas added a second data submission to the derivation and told you, in advance, that its own prior years would no longer match what it published a year earlier. That is a spec change, not a behavior change. Kids didn&rsquo;t enroll in anything. The query got wider.
        </P>

        <P>
          Texas&rsquo;s own concentrator series &mdash; a different, stricter measure than participant, so not apples to apples &mdash; runs <a href="https://tea.texas.gov/reports-and-data/school-performance/accountability-research/enroll-2023-24.pdf">680,625 in 2021&ndash;22 to 717,366 in 2022&ndash;23, an increase of 36,741, or 5.4%</a>. That&rsquo;s a series growing steadily. It is not a series that looks about to add 690,000 of anything.
        </P>

        <Callout label="What this is not">
          I&rsquo;m not saying the CTE boom is fake. Enrollment is almost certainly up. I&rsquo;m saying one state posted roughly 86% of a record national increase in the same year it changed how it derives CTE status, and I can&rsquo;t find anyone who published a reconciliation of the two.
        </Callout>

        <H2>The quality numbers have a different problem</H2>

        <P>
          The same release reports what look like national program-quality totals. <a href="https://www.acteonline.org/blog/cte-policy-watch/octae-releases-2023-24-perkins-data/">Almost 434,000 concentrators earned a recognized postsecondary credential. About 236,000 did work-based learning. About 134,000 earned postsecondary credit in their CTE program area.</a>
        </P>

        <P>
          Across 22 states. Then 29 states. Then 11.
        </P>

        <Fig caption={<>Source: <a href="https://www.acteonline.org/blog/cte-policy-watch/octae-releases-2023-24-perkins-data/" style={{ color:'inherit' }}>ACTE summary of OCTAE 2023&ndash;24 Perkins data</a>. Counts are states and territories reporting each secondary program-quality indicator; there are 50 states plus DC and several territories in the collection.</>}>
          <img src={SECOND_CHART} alt="Horizontal bar chart. Work-based learning reported by 29 states and territories, recognized credential by 22, postsecondary credit earned by 11." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Three national-sounding numbers, three different denominators, and not one of them is fifty. Each state picks which quality indicator it reports. So the totals aren&rsquo;t wrong, exactly &mdash; they&rsquo;re just answers to a question nobody asked, which is &ldquo;how many kids did this, among the states that chose to tell us.&rdquo;
        </P>

        <H2>The survey and the file disagree about what CTE is</H2>

        <P>
          One more. The EdWeek Research Center surveyed educators and found <a href="https://www.edweek.org/teaching-learning/why-schools-are-adding-to-their-cte-offerings-and-what-could-slow-them-down/2025/11">61% say their district expanded CTE offerings over five years and 71% say student interest is up</a>, with <a href="https://www.edweek.org/teaching-learning/interest-in-cte-has-jumped-which-fields-are-expected-to-see-the-biggest-growth/2026/05">digital technology, AI, IT and cybersecurity the most popular category for new programs</a>. That&rsquo;s the story everybody tells about CTE now. Robots, not table saws.
        </P>

        <P>
          The administrative file says the top three career clusters for secondary concentrators are <a href="https://www.acteonline.org/blog/cte-policy-watch/octae-releases-2023-24-perkins-data/">Health Science; Agriculture, Food &amp; Natural Resources; and Business Management &amp; Administration</a>. No cyber. Not a contradiction &mdash; new programs and where kids actually concentrate are different measures. But if you read the survey and skipped the file, you&rsquo;d think this was an AI boom. It&rsquo;s a health-science-and-agriculture boom with a cybersecurity press release stapled to the front.
        </P>

        <Divider />

        <P>
          ACTE ended the release with a line nobody quoted: <a href="https://www.acteonline.org/blog/cte-policy-watch/octae-releases-2023-24-perkins-data/">&ldquo;Please be aware that this data may be subject to change, if corrections are needed.&rdquo;</a>
        </P>

        <P>
          Everybody took the 10%. Nobody took the disclaimer.
        </P>

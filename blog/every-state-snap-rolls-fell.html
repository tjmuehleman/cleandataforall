const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Roughly <a href="https://www.fns.usda.gov/pd/supplemental-nutrition-assistance-program-snap">4.3 million fewer
          Americans were on SNAP in January 2026 than in January 2025</a> &mdash; about a 10% year-over-year drop, the
          steepest 12-month decline in the program&rsquo;s modern history. <a href="https://www.cbpp.org/blog/post-megabill-drop-in-snap-participation-is-steepest-in-decades">Every
          state&rsquo;s rolls fell</a>. <a href="https://www.cbpp.org/research/food-assistance/snap-tracker-people-are-losing-food-assistance-as-the-republican-megabill">Thirty-six
          fell by 5% or more</a>.
        </P>

        <P>
          In the same window, the national unemployment rate moved from <a href="https://www.bls.gov/news.release/archives/empsit_02062026.htm">4.0% in January 2025 to about 4.4%
          by the end of 2025</a>. Half a point, after rounding generously.
        </P>

        <P>
          These two numbers are supposed to track each other. The mental model is straightforward: when more people are
          out of work, more people qualify for food assistance, and the rolls grow. When fewer people are out of work,
          fewer people need it, and the rolls shrink. This year the rolls collapsed while the labor market barely
          flinched. Whatever happened, it didn&rsquo;t happen because the country got jobs.
        </P>

        <H2>What actually happened was administrative</H2>

        <P>
          The mechanical cause is the <a href="https://www.congress.gov/bill/119th-congress/house-bill/1">July 2025
          megabill</a>. It added new work-reporting documentation for adults up to age 65, raised the bar on
          households with a child age 14 or older, and introduced a state cost-share tied to payment error rates &mdash;
          states with error rates above 6% have to start paying <a href="https://www.naco.org/resource/hr-1-and-supplemental-nutrition-assistance-program-snap-what-counties-should-know">5%
          to 15% of benefit costs</a>. That payment-error clock started ticking on <a href="https://www.cbpp.org/research/food-assistance/many-low-income-people-will-soon-begin-to-lose-food-assistance-under">November
          1, 2025</a>. States responded the way states always respond to a per-error penalty: they tightened verification,
          shortened recertification cycles, and let procedural denials do the work.
        </P>

        <P>
          CBPP has been running a state-by-state <a href="https://www.cbpp.org/research/food-assistance/snap-tracker-people-are-losing-food-assistance-as-the-republican-megabill">SNAP
          tracker</a> since the bill passed. Every state is down. Arizona, Tennessee, Virginia, Florida, Illinois, Texas,
          Utah, Connecticut, Massachusetts, Louisiana, Kansas, South Carolina &mdash; all down more than 10% since July.
          CBPP&rsquo;s own analysis points out that unemployment was <a href="https://www.cbpp.org/blog/post-megabill-drop-in-snap-participation-is-steepest-in-decades">flat
          at 4% nationally and improved by less than a percentage point in 13 states</a>, which makes it very unlikely the
          underlying need actually moved.
        </P>

        <H2>Two reputable sources, same state, eight points apart</H2>

        <P>
          Arizona is the cleanest example of why this is a data story before it&rsquo;s a policy story. CBPP&rsquo;s
          tracker reports Arizona&rsquo;s SNAP enrollment is <a href="https://www.cbpp.org/blog/arizonas-snap-participation-is-plummeting-far-more-than-anticipated-as-it-implements-megabill">down
          51% since July 2025 using state-agency data</a> &mdash; about 1 million Arizonans in January 2025 down to
          roughly 533,000 in January 2026. The same tracker quotes USDA&rsquo;s federal monthly file at <strong>about
          43%</strong> for that state. Two reputable sources, the same state, the same month, eight points apart.
        </P>

        <P>
          Nobody&rsquo;s wrong. State agency reports capture mass redeterminations the week the caseworkers process
          them. The federal pipeline aggregates from a slower file and catches up later. Whichever number you cite says
          something true; they describe different slices of the same event.
        </P>

        <P>
          (I run a data company. The right number depending on which clock you&rsquo;re reading is the kind of thing that
          makes me twitchy.)
        </P>

        <H2>Georgia tells you what the drop is actually made of</H2>

        <P>
          Georgia is the second-largest contributor to the national decline. Roughly <a href="https://georgiadata.org/topics/public-assistance/SNAP">500,000
          fewer SNAP participants year-over-year</a>; the state&rsquo;s rolls dropped 26% from January 2025 to January 2026. Look at it sliced three ways and the
          administrative fingerprint stands out:
        </P>

        <Fig caption={<>Source: Georgia state SNAP data, summarized in <a href="https://www.cbpp.org/research/food-assistance/snap-tracker-people-are-losing-food-assistance-as-the-republican-megabill">CBPP SNAP Tracker</a>. Participants are individuals; households are case heads; benefits issued is total dollars. Drop in individuals far exceeds drop in households or dollars &mdash; the signature of mass procedural review, not mass case closure.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Participants%22%2C%22Households%22%2C%22Benefits+issued%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Georgia+change+since+July+2025+%28%25%29%22%2C%22data%22%3A%5B-24%2C-5%2C-1%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23777%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Georgia+SNAP+changes+since+July+2025%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A0%2C%22stepSize%22%3A5%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+change+%28Georgia+DHS+dashboard%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=420&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart of Georgia's SNAP changes since July 2025: participants down 24 percent, households down 5 percent, benefits issued down 1 percent."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          Participants down 24%. Households down 5%. Benefits issued, basically flat. Translation: households mostly
          stayed on the program; individuals inside them got knocked off. That&rsquo;s not what reduced food need looks
          like. That&rsquo;s what mass procedural review looks like &mdash; one person in a household doesn&rsquo;t turn
          in the paperwork in time, and the case shrinks, but doesn&rsquo;t close.
        </P>

        <H2>The survey that would have told us what happened next was canceled</H2>

        <P>
          For 30 years the USDA published an annual <em>Household Food Security in the United States</em> report. It
          surveyed a few tens of thousands of households, asked them whether they had enough to eat, and turned the
          answers into a national food-insecurity rate. The 2024 release said <a href="https://www.ers.usda.gov/publications/pub-details?pubid=113622">one
          in seven households &mdash; 47.4 million people, including 13.8 million kids &mdash; were food insecure</a>. The
          report ran through five administrations of both parties.
        </P>

        <P>
          On <a href="https://www.usda.gov/about-usda/news/press-releases/2025/09/20/usda-terminates-redundant-food-insecurity-survey">September 20, 2025</a>,
          USDA announced the report was being terminated. The 2024 edition was the last. The press release called the
          survey &ldquo;redundant, costly, politicized, and extraneous.&rdquo;
        </P>

        <Callout label="Key figure">
          Same year, two decisions: the U.S. shed millions of people from SNAP without an unemployment signal to back the
          drop, and shut down the survey that would have told us whether the people who left were still hungry.
        </Callout>

        <P>
          So we still have data on who exited. We no longer have data on what happened to them after they did.
        </P>

        <Divider />

        <P>
          A program got smaller. The labor market didn&rsquo;t. The instrument that connected those two facts to whether
          anyone was actually going hungry got switched off. That&rsquo;s a system telling you exactly what it&rsquo;s
          willing to measure. And what it isn&rsquo;t.
        </P>

        <H2>Sources</H2>

        <UL items={[
          <><a href="https://www.cbpp.org/blog/post-megabill-drop-in-snap-participation-is-steepest-in-decades">CBPP &mdash; Post-Megabill Drop in SNAP Participation Is Steepest in Decades</a></>,

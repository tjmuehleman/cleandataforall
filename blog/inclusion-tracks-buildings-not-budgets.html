          alt="Horizontal bar chart of four coefficients from GAO's district-level regression, in percentage points: no standalone special education school plus 5.2, a 30 percent lower per-pupil revenue plus 1.6, a one point increase in English learners plus 0.07, and an additional 100 students per counselor caseload minus 0.35."

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          GAO dropped a special education report on July 2. The finding everybody is going to quote is
          the one about money:{' '}
          <a href="https://www.gao.gov/products/gao-26-107814">districts with <em>lower</em> per-pupil revenue
          had a <em>higher</em> share of students with disabilities</a> in a general education classroom
          for at least 40 percent of the day. Inverted. Poorer districts include more.
        </P>

        <P>
          It&#8217;s a real finding. It&#8217;s also the third-biggest number in the model, and the report
          underneath it is a much better story about data plumbing than about funding.
        </P>

        <H2>Start with the coefficient</H2>

        <P>
          GAO found that{' '}
          <a href="https://www.gao.gov/assets/gao-26-107814.pdf">a 30 percent decrease in per-pupil revenue was
          associated with a 1.6 percentage point increase</a> in the share of students in gen ed for at
          least 40 percent of the day. Thirty percent. That is not a rounding error in a district budget.
          And it buys you 1.6 points.
        </P>

        <P>
          Now the one nobody will headline. In the same model, with the same controls, districts{' '}
          <em>without</em> a standalone special education school ran{' '}
          <a href="https://www.gao.gov/assets/gao-26-107814.pdf">5.2 percentage points higher</a> than districts
          with one. Three times the size of the money effect, and it has nothing to do with money. It has
          to do with whether there is a building to send the kid to.
        </P>

        <P>
          Placement follows inventory. If you own the separate school, it fills up.
        </P>

        <H2>Four files, three school years</H2>

        <P>
          Here&#8217;s where it gets interesting for anyone who has ever tried to join two education
          datasets. That regression is stitched from IDEA Section 618 data for 2022&#8211;23, the Civil
          Rights Data Collection for 2021&#8211;22, CCD Finance for 2021&#8211;22, and CCD non-fiscal for
          2022&#8211;23. GAO says so in a footnote, and says why: they used the older CCD year{' '}
          <a href="https://www.gao.gov/assets/gao-26-107814.pdf">&#8220;to improve the match across datasets with
          different year availability.&#8221;</a>
        </P>

        <P>
          Which is the honest version of a thing every data team learns the hard way. The newest year you
          can <em>analyze</em> is set by your slowest file, not your fastest. GAO published in July 2026 and
          the money variable is from the 2021&#8211;22 school year. Four years back.
        </P>

        <Callout label="Note">
          The descriptive half of the report runs a year fresher, through 2023&#8211;24. New Mexico is not
          in it &#8212; the state did not report Section 618 data that year. Iowa reported, but not by type
          of disability. So &#8220;increased in 42 of 50 states and the District of Columbia&#8221; is
          really 42 out of 50, with one state as a hole in the file.
        </Callout>

        <H2>The state numbers are inside a PNG</H2>

        <P>
          The thing every parent and advocate is going to want out of this report is their own state.
          GAO built it &#8212; Figure 3 maps the change by state, Figure 4 maps the 2023&#8211;24 level by
          state &#8212; and published both as images with no data table behind them. You can lift exactly
          four numbers out of the prose.
        </P>

        <Fig caption={<>The four state-level figures GAO states in text. District of Columbia and California had the largest increases; Nevada and North Dakota the largest decreases. Source: <a href="https://www.gao.gov/products/gao-26-107814">GAO&#8211;26&#8211;107814</a>. The other 47 jurisdictions appear only inside Figure 3, which is an image.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22District+of+Columbia%22%2C%22California%22%2C%22Nevada%22%2C%22North+Dakota%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22pp%22%2C%22data%22%3A%5B7.7%2C6.4%2C-2.6%2C-3.2%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%233a3a3a%22%2C%22%23777%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%5B%22The+only+four+states+GAO+put+a+number+on%22%2C%22Change+in+share+of+students+with+disabilities+in+general+education%22%2C%2240%25%2B+of+the+day%2C+2012-13+to+2023-24%22%5D%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-5%2C%22max%22%3A9%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percentage+points%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of change in the share of students with disabilities in general education at least 40 percent of the day, 2012-13 to 2023-24: District of Columbia plus 7.7 points, California plus 6.4, Nevada minus 2.6, North Dakota minus 3.2."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          Which is a shame, because the spread is the story. GAO says the state average{' '}
          <a href="https://www.gao.gov/assets/gao-26-107814.pdf">ranged from 71 percent to 93 percent in
          2023&#8211;24</a>. Twenty-two points, same federal law, same kids.
        </P>

        <P>
          One more, and I mean this affectionately. Table 4 breaks out the top and bottom quarter of
          districts in every state. Hawaii and DC are excluded and GAO says why (one district each).
          Arkansas is just not there, with no note. And West Virginia is spelled &#8220;West Virgina.&#8221;
        </P>

        <Divider />

        <P>
          I&#8217;m not dunking. This is a careful report with unusually honest footnotes, including a flat
          statement that none of the regression is causal and a companion analysis that found{' '}
          <a href="https://www.gao.gov/assets/gao-26-107814.pdf">no significant relationship</a> between gen ed time
          and district graduation, dropout, or discipline rates. GAO showed its work. That&#8217;s the point
          &#8212; when somebody shows their work, what you see is what a real dataset actually looks like.
          A missing state, a missing row, a typo, and four vintages stapled together.
        </P>

        <P>
          The funding finding will get the press. The building finding is the one that would change an IEP
          meeting. And the reporting calendar is why, in September of 2026, we&#8217;re arguing about 2022.
        </P>

        <P style={{ fontStyle:'italic', color:'var(--muted)' }}>&#8212; TJ</P>

      </article>
    </Prose>
  </Container>
);

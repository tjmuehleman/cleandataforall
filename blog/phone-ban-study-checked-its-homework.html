        <Small>{POST.kind}</Small>
        <span style={{ opacity:.4, fontFamily:'var(--mono)', fontSize:11 }}>·</span>

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;

const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);

const PostHero = () => (
  <Container>
    <Fig caption={<>Teacher-reported in-class phone use, before vs. after pouch adoption. Source: <a href="https://www.nber.org/papers/w35132">NBER Working Paper 35132</a>.</>}>
      <img
        src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Before+ban%22%2C%22After+ban%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Students+using+phone+in+class+%28teacher-reported%29%22%2C%22data%22%3A%5B61%2C13%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23777%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22In-class+phone+use+collapsed+after+pouch+bans%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A70%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+of+students%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
        alt="Bar chart showing teacher-reported in-class phone use falling from 61 percent before phone bans to 13 percent after."
        style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
      />
    </Fig>
  </Container>
);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Twenty-six states now require schools to ban student cellphones — twenty-two of those laws signed in <a href="https://civiciq.com/blog/26-states-now-require-school-cell-phone-bans-2026-k-12-policy-tracker-implementation-guide">2025 alone</a>. That's a policy stampede, faster than states ever moved on seatbelts. And in April, the biggest study yet on whether the bans actually work landed: a Stanford-Duke-Michigan-Penn team's <a href="https://www.nber.org/papers/w35132">NBER working paper 35132</a>, comparing schools that adopted lockable phone pouches against ones that didn't, across three years and <a href="https://news.stanford.edu/stories/2026/05/national-study-school-cellphone-bans-benefits-research">more than 43,000 middle and high schools</a>.
        </P>

        <P>
          The headline number: teacher surveys say the share of students using phones in class for personal reasons fell from <a href="https://www.nber.org/papers/w35132">61% to 13%</a>. Taken on its own, that number is close to meaningless. It's a self-report from teachers who know their school just adopted a new policy and are primed to say it worked. Nearly every education dataset I've ever touched has some version of this problem — you ask the people enforcing a policy whether the policy is working, and they tell you yes, because that's what a good year looks like from where they're standing.
        </P>

        <P>
          This study didn't stop at the survey. The researchers also pulled <a href="https://www.nber.org/papers/w35132">GPS ping data</a> straight off the phones — a machine-generated signal nobody could spin — and it moved the same direction as the teacher reports. Two instruments, built on completely different data collection methods, agreeing on the same collapse. That's the part of this paper that deserves more attention than it gets. Most education research runs on a single measurement doing all the work: one survey, one administrative dataset, no second check. This one came with a receipt.
        </P>

        <H2>The other thing nobody's writing about</H2>

        <P>
          The study was also <a href="https://www.nber.org/papers/w35132">pre-registered</a>. The authors published their hypotheses and their outcome measures on the Open Science Framework before they ran the analysis. That matters more than it sounds like it should, because it's the difference between "here's what we found" and "here's what we went looking for." A researcher who commits — in writing, in public, ahead of time — to naming test scores, attendance, classroom attention, and perceived bullying as the outcomes has a much harder time p-hacking a headline out of the data afterward.
        </P>

        <P>
          Which is why I actually believe the null result. Test scores, attendance, self-reported classroom attention, and perceived online bullying all moved <a href="https://www.nber.org/papers/w35132">close to zero</a> across the sample. Not because the sample is big, though it is — it's because the researchers verified their treatment variable two different ways and locked their outcome list before looking at a single result. That combination is rare enough that when I read "close to zero," I trust it more than I'd trust a single self-reported effect size ten times as large.
        </P>

        <Callout label="The data-guy read">
          Two independent instruments (teacher survey, GPS pings) agreeing on the treatment. A pre-registered outcome list filed before the analysis ran. That's the whole reason "close to zero" is a credible finding here instead of a p-hacked one.
        </Callout>

        <H2>Twenty-two states, one working paper</H2>

        <P>
          None of this is an argument against phone bans. States didn't pass <a href="https://civiciq.com/blog/26-states-now-require-school-cell-phone-bans-2026-k-12-policy-tracker-implementation-guide">22 of these laws in a single year</a> because of a working paper — they passed them because parents and teachers wanted the phones gone, and the wellbeing evidence mostly backs that instinct eventually. But it's worth sitting with the fact that the best evidence anyone has on this policy is good specifically because the people who built it refused to trust their own first measurement.
        </P>

        <Fig caption={<>States with cellphone-ban laws enacted, by timing. 22 of 26 total laws passed in 2025 (26 − 22 = 4 pre-2025). Source: <a href="https://civiciq.com/blog/26-states-now-require-school-cell-phone-bans-2026-k-12-policy-tracker-implementation-guide">Civic IQ policy tracker</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Before+2025%22%2C%222025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22States+with+cellphone-ban+laws+enacted%22%2C%22data%22%3A%5B4%2C22%5D%2C%22backgroundColor%22%3A%5B%22%23bbb%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%2226+states+now+require+school+phone+bans+%5Cu2014+22+laws+passed+in+2025+alone%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22max%22%3A26%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%23+of+states%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart showing 4 states enacted cellphone-ban laws before 2025 and 22 states enacted them in 2025, for a total of 26."
            style={{ width:'100%', maxWidth:760, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          Most of the data crossing my desk doesn't clear the bar this paper set. It's one survey, self-graded, published the week the board wants a slide.
        </P>

        <Divider />

        <P>
          Check your instrument before you trust your number.
        </P>

        <Divider />

        <H3>Sources</H3>
        <UL items={[
          <><a href="https://www.nber.org/papers/w35132">NBER Working Paper 35132 — The Effects of School Phone Bans: National Evidence from Lockable Pouches (April 2026)</a> — Allcott, Baron, Dee, Duckworth, Gentzkow, Jacob. Teacher-reported phone use 61% to 13%, verified against GPS pings; pre-registered pre-analysis plan; test scores/attendance/attention/bullying close to zero.</>,
          <><a href="https://news.stanford.edu/stories/2026/05/national-study-school-cellphone-bans-benefits-research">Stanford Report — School cell phone bans deliver benefits, but not right away (May 2026)</a> — more than 43,000 middle and high schools, three-year comparison.</>,
          <><a href="https://siepr.stanford.edu/news/school-cellphone-bans-deliver-benefits-not-right-away">SIEPR — School cellphone bans deliver benefits, but not right away (May 2026)</a>.</>,
          <><a href="https://edsource.org/updates/cellphone-bans-have-little-impact-on-academics-or-behavior-study-finds">EdSource — Cellphone bans have little impact on academics or behavior, study finds (May 2026)</a>.</>,
          <><a href="https://civiciq.com/blog/26-states-now-require-school-cell-phone-bans-2026-k-12-policy-tracker-implementation-guide">Civic IQ — School Cell Phone Bans: 26-State Policy Tracker 2026</a> — 26 states with bans, 22 enacted in 2025.</>,
        ]} />

      </article>
    </Prose>
  </Container>
);

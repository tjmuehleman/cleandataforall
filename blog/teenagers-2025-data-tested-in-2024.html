// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The headline number out of June&rsquo;s long-term trend release is 14 percent. That&rsquo;s the
          share of 13-year-olds who say they read for fun almost every day. One in seven.
          It&rsquo;s a real number, it&rsquo;s down from 35 percent in 1984, and it is the least
          interesting thing in the file.
        </P>

        <P>
          Here&rsquo;s what got me. NAEP&rsquo;s own <a href="https://www.nationsreportcard.gov/ltt/2025/">assessment
          design table</a> says the 9-year-olds sat for this test between January and March
          of 2025. The 13-year-olds sat for it between October and December of <strong>2024</strong>.
          Different semester. Different season. Both published on the same morning, June 10,
          2026, under one label: 2025.
        </P>

        <P>
          Then it gets better. The 9-year-olds&rsquo; scores are compared to 2022. The 13-year-olds&rsquo;
          are compared to 2023. Those are the last years each age happened to be tested. So the
          sentence every outlet wrote &mdash; little kids recovering, teenagers frozen &mdash; is a
          three-year change sitting next to a two-year change, from two cohorts tested in
          different halves of the school year, printed as one finding.
        </P>

        <P>
          None of that makes the finding wrong. Nine-year-olds really did gain 4 points in
          reading and 4 in math since 2022, and the gains really did land on the kids at the
          bottom &mdash; <a href="https://www.the74million.org/article/long-term-naep-shows-growth-for-nine-year-olds-more-disappointment-for-teens/">8 points
          at the 10th percentile in reading, 9 in math</a>. Thirteen-year-olds really are flat,
          and their reading score is <a href="https://www.nationsreportcard.gov/ltt/2025/">statistically
          indistinguishable from 1971</a>. Those hold up.
        </P>

        <P>
          But when one file carries two clocks under one year label, the write-ups drift. And
          they did.
        </P>

        <H2>Four newsrooms, one dataset, one morning</H2>

        <P>
          <a href="https://www.npr.org/2026/06/10/nx-s1-5844932/naep-long-term-trends-reading-math">NPR
          reported</a> that 13-year-olds hit 14 percent &ldquo;in 2022 and 2025.&rdquo; The 13-year-olds
          weren&rsquo;t assessed in 2022 &mdash; <a href="https://www.k12dive.com/news/9-year-olds-show-some-growth-as-13-year-olds-stagnate-in-naep-long-term-tre/822423/">their
          previous administration was 2023</a>. The Dallas Express wrote that 13-year-olds were
          <a href="https://dallasexpress.com/education/only-14-of-13-year-olds-read-for-fun-daily-as-naep-scores-released/">&ldquo;assessed
          October&ndash;December 2025&rdquo;</a>, which is a year off the actual window and lands after
          the report&rsquo;s own collection period closed. The 74 appended a <a href="https://www.the74million.org/article/long-term-naep-shows-growth-for-nine-year-olds-more-disappointment-for-teens/">correction
          on June 11</a> for misstating the peak reading-for-fun percentages <em>and</em> the year
          they peaked.
        </P>

        <P>
          That last one is the tell. The 74&rsquo;s corrected version puts the peak at 58 percent for
          9-year-olds and 37 percent for 13-year-olds, &ldquo;over 30 years ago.&rdquo; K-12 Dive, the same
          morning, ran the 1984 figures: <a href="https://www.k12dive.com/news/9-year-olds-show-some-growth-as-13-year-olds-stagnate-in-naep-long-term-tre/822423/">53
          percent and 35 percent</a>. Both are right. 1984 isn&rsquo;t the peak &mdash; it&rsquo;s just the
          first year NAEP asked the question. Anchor on the first year and you get one collapse.
          Anchor on the peak and you get a bigger one. Nobody is lying. Everybody picked a
          different starting line.
        </P>

        <Fig caption={<>Source: <a href="https://www.k12dive.com/news/9-year-olds-show-some-growth-as-13-year-olds-stagnate-in-naep-long-term-tre/822423/">K-12 Dive</a>, reporting NAEP long-term trend survey results. NAEP&rsquo;s <a href="https://www.nationsreportcard.gov/ltt/2025/reading/student-experiences/?age=9">own student-experiences page</a> states the 2025 age-9 figure is 16 percentage points below 1984, which matches 53 &rarr; 37.</>}>
          <img src={CHART_FUN} alt="Grouped bar chart showing the share of 9- and 13-year-olds who read for fun almost every day in 1984, 2020 and 2025."
               style={{ display:'block', width:'100%', maxWidth:900, margin:'0 auto', height:'auto' }} />
        </Fig>

        <H2>The part that should bother you</H2>

        <P>
          This is the cleanest longitudinal dataset in American education. Paper and pencil,
          many of the same questions, since 1971. Julia Rafal-Baer, who sits on the governing
          board, called it &ldquo;the closest thing we have to a long-term memory of how kids are
          doing.&rdquo; And on release day, four competent newsrooms produced four subtly different
          versions of it.
        </P>

        <P>
          That&rsquo;s not a journalism problem. It&rsquo;s a metadata problem. The assessment windows, the
          comparison years, the survey baselines &mdash; all of it is in the report. None of it is
          in the number. And the number is what travels.
        </P>

        <Callout label="Key figure">
          Age 9 was assessed January&ndash;March 2025 and compared to 2022. Age 13 was assessed
          October&ndash;December 2024 and compared to 2023. Both were released June 10, 2026 as
          &ldquo;2025.&rdquo; (<a href="https://www.nationsreportcard.gov/ltt/2025/">NCES</a>)
        </Callout>

        <Divider />

        <P>

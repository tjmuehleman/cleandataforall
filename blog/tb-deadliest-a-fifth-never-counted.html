// ==================== Hero visual ====================
const PostHero = () => (
  <Container>
    <figure style={{ margin:'0 auto 56px', maxWidth:900, textAlign:'center' }}>
      <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22People+who+fell+ill+with+TB%2C+2024%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Diagnosed+and+reported%3A+8.3M%22%2C%22data%22%3A%5B8.3%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Estimated+but+never+counted%3A+2.4M%22%2C%22data%22%3A%5B2.4%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%221+in+5+TB+cases+in+2024+was+estimated%2C+not+counted%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Atrue%2C%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22stacked%22%3Atrue%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A11%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Millions+of+people%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22stacked%22%3Atrue%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Stacked bar showing the 10.7 million people estimated to have fallen ill with TB in 2024, split into 8.3 million diagnosed and reported and 2.4 million estimated but never counted." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
      <figcaption style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginTop:10, textAlign:'left' }}>
        WHO estimates 10.7M people fell ill with TB in 2024; 8.3M were newly diagnosed and reported (78% of the estimate), leaving roughly 2.4M not diagnosed or not reported. 8.3 + 2.4 = 10.7. Source: WHO Global Tuberculosis Report 2025 fact sheet.

// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>&mdash; {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On November 12 the WHO published its <a href={REPORT}>Global Tuberculosis Report 2025</a> and handed the world&rsquo;s oldest documented killer back its title: tuberculosis is once again the <a href={PRESS}>deadliest infectious disease on earth</a>, with an estimated <a href={BURDEN}>1.23 million deaths in 2024</a>. It took the top spot back from COVID in 2023 and hasn&rsquo;t let go. And for once the trend line points the right way &mdash; incidence and deaths both edged down year over year.
        </P>

        <P>
          The headline number everyone ran with is 10.7 million people who fell ill in 2024. So I went looking for where that number comes from. It&rsquo;s an <a href={BURDEN}>estimate</a>. WHO says so on the same page it prints it.
        </P>

        <H2>The count and the estimate are two different numbers</H2>

        <P>
          Here&rsquo;s the part that doesn&rsquo;t make the headline. Of that estimated 10.7 million, only <a href={FACT}>8.3 million were actually diagnosed and reported</a> to national authorities &mdash; 78% of the estimate. The other 2.4 million are people WHO believes fell ill but who were never diagnosed, or were diagnosed and never made it into a report. Its words, not mine.
        </P>

        <BQ cite="WHO Global Tuberculosis Report 2025, fact sheet">
          There is still a large global gap between the estimated number of people who fell ill with TB and the number of people newly diagnosed, with approximately 2.4 million people not diagnosed with the disease, or not officially reported to national authorities in 2024.
        </BQ>

        <P>
          So the &ldquo;deadliest infectious disease is back&rdquo; story rests on a number that is roughly one-fifth model. That&rsquo;s not a knock on WHO &mdash; you can&rsquo;t count what nobody diagnosed, and modeling the gap is the honest thing to do. But it&rsquo;s worth saying out loud that 2.4 million of those 10.7 million are an inference, not a case file.
        </P>

        <P>
          And the two numbers move independently. The count actually went <em>up</em> &mdash; <a href={FACT}>8.3 million reported in 2024, a record, up from 8.2 million in 2023</a> &mdash; even as the modeled incidence rate came down. That&rsquo;s not a contradiction. It&rsquo;s two different instruments. Notifications are counted, one certificate at a time. Incidence is estimated from prevalence surveys and trend models. When they diverge, the count is the thing you can audit.
        </P>

        <H2>Barely half the counted cases start with a good test</H2>

        <P>
          It gets blurrier. Of those 8.3 million diagnosed people, a <a href={FACT}>rapid molecular test was the first diagnostic for only 54%</a> &mdash; up from 48% the year before, which is real progress, but it means nearly half the confirmed cases still start with older, less reliable methods. The instrument that turns a cough into a solid, reportable case isn&rsquo;t reaching half the people who make it into the count at all.
        </P>

        <P>
          Which brings me to the thing a data person can&rsquo;t stop looking at. Everything above &mdash; the labs, the rapid tests, the reporting pipelines that move a diagnosis into a national number &mdash; costs money. And the money is going the wrong way.
        </P>

        <Fig caption={<>Funding available for TB prevention, diagnosis, treatment and care fell from US$6.5B in 2019 to US$5.9B in 2024, against a 2027 target of US$22B set at the 2023 UN high-level meeting. Source: WHO Global Tuberculosis Report 2025 fact sheet.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Available+2019%22%2C%22Available+2024%22%2C%222027+UN+target%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22US%24+billions%22%2C%22data%22%3A%5B6.5%2C5.9%2C22%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23141210%22%2C%22%23bbb%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+money+that+pays+for+the+counting+is+shrinking%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22fontStyle%22%3A%22bold%22%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A24%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22US%24+billions+available+per+year%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of TB funding available: 6.5 billion dollars in 2019, 5.9 billion in 2024, against a 22 billion dollar target for 2027." style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          Only <a href={FACT}>US$5.9 billion was available in 2024</a> &mdash; down from US$6.5 billion in 2019, and just 27% of the US$22 billion a year that governments themselves committed to by 2027. The line that&rsquo;s supposed to climb toward 22 is instead drifting down toward 5.
        </P>

        <Callout label="What the model says happens next">
          WHO cites <a href={PRESS}>modelling that long-term cuts to international donor funding could cause up to 2 million additional TB deaths and 10 million additional cases between 2025 and 2035</a>.
        </Callout>

        <Divider />

        <P>
          Cut the funding and the disease doesn&rsquo;t just get worse. The <em>measurement</em> gets worse first. Fewer labs, fewer rapid tests, fewer people moved from &ldquo;sick&rdquo; to &ldquo;counted.&rdquo; The 2.4 million gap doesn&rsquo;t grow because more people fall ill. It grows because fewer of them get found. TB is finally winnable and finally trending down. We&rsquo;re about to lose the ability to watch it happen.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

      </article>
    </Prose>
  </Container>
);

);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          The freshest national number on who gets suspended in an American school
          describes a school year that ended in June 2022. The file came out in
          January 2025. Call it two and a half years of lag, which for federal
          education data is unremarkable. What happened after that is not.
        </P>

        <P>
          On July 24, 2026, a final rule took effect stripping the disparate-impact
          provisions out of the Education Department&rsquo;s Title VI regulations &mdash;
          <a href="https://www.federalregister.gov/documents/2026/07/24/2026-15019/rescinding-portions-of-the-department-of-education-title-vi-regulations-to-align-with-the-statutory" target="_blank" rel="noopener"> 34 CFR 100.3(b)(2), (b)(6), (c)(2) and (c)(3) reserved or removed outright</a>, and the word &ldquo;effect&rdquo; swapped
          for &ldquo;purpose&rdquo; in (b)(3). Twenty-five days later, the Office for Civil
          Rights sent districts a Dear Colleague Letter saying that
          <a href="https://www.k12dive.com/news/ocr-calls-on-schools-to-stop-racial-balancing-in-new-discipline-guidance/828211/" target="_blank" rel="noopener"> &ldquo;it is race discrimination under Title VI for the school to evaluate the
          racial outcomes of their discipline policies and to make decisions based on
          or because of those racial outcomes.&rdquo;</a> Same day, OCR opened Title VI
          investigations into
          <a href="https://www.ed.gov/about/news/press-release/us-department-of-education-directs-schools-stop-racial-balancing-student-discipline-policies-investigates-two-school-districts" target="_blank" rel="noopener"> Fayetteville, Arkansas and Milwaukee, Wisconsin</a>.
        </P>

        <P>
          Read that as a data person and it&rsquo;s a strange sentence. The Civil Rights
          Data Collection still exists. OCR has been running it
          <a href="https://www.ed.gov/laws-and-policy/civil-rights-laws/civil-rights-data-collection-crdc" target="_blank" rel="noopener"> since 1968</a>, and most
          of it is still disaggregated by race, ethnicity, sex, disability and
          English-learner status. Nobody turned the collection off. They turned off
          the thing you were allowed to do with the output.
        </P>

        <H2>What&rsquo;s actually in the last file</H2>

        <P>
          The 2021-22 CRDC covered 17,704 districts and 98,010 schools. About
          <a href="https://www.ed.gov/media/document/2021-22-crdc-first-look-report-109194.pdf" target="_blank" rel="noopener"> 2.4 million students, 5 percent of K-12 enrollment, got at least one
          out-of-school suspension</a>. Black boys were 8 percent of enrollment and
          22 percent of the kids who got one. White boys were 23 and 23. That&rsquo;s the
          chart at the top, and whatever you think it means, it is the last national
          version of the sentence.
        </P>

        <P>
          The law-enforcement side goes further, and it&rsquo;s the number I&rsquo;d have led
          with if I were OCR.
        </P>

        <Fig caption={<>Source: 2021-22 CRDC First Look, p.&nbsp;23. Districts referred about 220,000 K-12 students to law enforcement; roughly 17 percent of those referrals ended in a school-related arrest. Black and American Indian or Alaska Native students are the only two race groups OCR stated numerically in prose &mdash; the rest of the breakdown lives inside a chart image (Figure 13).</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Black+students%22%2C%22American+Indian+or+Alaska+Native+students%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Share+of+K-12+enrollment%22%2C%22data%22%3A%5B15%2C1%5D%2C%22backgroundColor%22%3A%22%23bbbbbb%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Share+referred+to+law+enforcement%22%2C%22data%22%3A%5B28%2C2%5D%2C%22backgroundColor%22%3A%22%235a5a5a%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%22Share+subjected+to+school-related+arrest%22%2C%22data%22%3A%5B33%2C2%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%2C%22boxWidth%22%3A14%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22text%22%3A%5B%22Referrals+to+law+enforcement+and+school-related+arrests%22%2C%222021-22+CRDC%2C+the+only+two+race+groups+OCR+printed+in+prose%22%5D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A0%2C%22max%22%3A35%2C%22stepSize%22%3A5%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+of+all+K-12+students%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Afalse%7D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Grouped bar chart from the 2021-22 Civil Rights Data Collection. Black students were 15 percent of K-12 enrollment, 28 percent of students referred to law enforcement, and 33 percent of students subjected to school-related arrest. American Indian or Alaska Native students were 1 percent of enrollment, 2 percent of referrals, and 2 percent of arrests."
            style={{ width:'100%', height:'auto', display:'block' }}
          />
        </Fig>

        <H2>The hole in a biennial survey</H2>

        <P>
          ED calls the CRDC &ldquo;generally biennial.&rdquo; Look at the collection years
          and &ldquo;generally&rdquo; is carrying a lot of weight. 2020-21 was already a
          slip &mdash; the planned 2019-20 collection got pushed a year for COVID, and
          <a href="https://nces.ed.gov/admindata/crdc/" target="_blank" rel="noopener"> collection for 2020-21 didn&rsquo;t open until October 2021</a>. Then 2021-22.
          Then nothing. The next one covers 2025-26, and as of an
          <a href="https://www.federalregister.gov/documents/2025/08/07/2025-15038/agency-information-collection-activities-submission-to-the-office-of-management-and-budget-for" target="_blank" rel="noopener"> August 2025 Federal Register notice</a> the Department was still asking OMB
          to approve it, bundled with 2027-28.
        </P>

        <P>
          So a biennial series skips four school years. Not because anyone announced a
          cancellation. Because a revision request sat in a queue. The most boring
          possible mechanism, which is how most data actually goes missing.
        </P>

        <Callout label="Small detail, big tell">
          The <a href="https://www.ed.gov/laws-and-policy/civil-rights-laws/civil-rights-data-collection-crdc/civil-rights-data-collection-state-files" target="_blank" rel="noopener">CRDC State Files page</a> on ed.gov still says the files were &ldquo;produced by
          OPEPD and last updated October 2018.&rdquo; The parent page was reviewed in
          February 2026. Somebody looked at it and left it.
        </Callout>

        <H2>The gap isn&rsquo;t a deletion</H2>

        <P>
          I keep seeing this framed as data destruction, and the distinction matters
          if you actually work with the stuff. Nothing got deleted. Nothing has even
          been un-collected yet. The information collection request for 2025-26 says
          in plain language that ED may &ldquo;add or remove data elements,&rdquo; so maybe
          the discipline-by-race items survive and maybe they don&rsquo;t. I don&rsquo;t know.
          Neither does anybody else writing about it this week.
        </P>

        <P>
          What changed is the question. Disparate impact was the mechanism that turned
          a distribution into a finding &mdash; the reason a percentage in a table could
          become a letter to a superintendent. Take it out and the discipline tables
          become what most government data already is: descriptive, published, inert.
          The letter says it flatly. Outcome data &ldquo;cannot substitute for the
          ultimate inquiry.&rdquo;
        </P>

        <Divider />

        <P>
          Data people spend most of our worry on collection. Is it collected, is it
          clean, is it timely, did the district actually submit. I&rsquo;ve had that fight
          over school SIS exports and over WHO repos and the shape of it is always the
          same. This one is a different shape. The pipeline is fine. The file will
          publish. Somebody will build the chart. And the chart will be, legally
          speaking, just a picture.
        </P>

        <H3>Sources</H3>

        <UL items={[
          <><a href="https://www.ed.gov/about/news/press-release/us-department-of-education-directs-schools-stop-racial-balancing-student-discipline-policies-investigates-two-school-districts" target="_blank" rel="noopener">U.S. Dept. of Education, &ldquo;Directs Schools to Stop Racial Balancing in Student Discipline Policies, Investigates Two School Districts,&rdquo; August 18, 2026</a></>,
          <><a href="https://www.federalregister.gov/documents/2026/07/24/2026-15019/rescinding-portions-of-the-department-of-education-title-vi-regulations-to-align-with-the-statutory" target="_blank" rel="noopener">Federal Register, &ldquo;Rescinding Portions of the Department of Education Title VI Regulations,&rdquo; final rule effective July 24, 2026 (FR Doc. 2026-15019)</a></>,
          <><a href="https://www.k12dive.com/news/ocr-calls-on-schools-to-stop-racial-balancing-in-new-discipline-guidance/828211/" target="_blank" rel="noopener">K-12 Dive, &ldquo;OCR calls on schools to &lsquo;stop racial balancing&rsquo; in new discipline guidance,&rdquo; August 18, 2026 (quoting the Dear Colleague Letter)</a></>,
          <><a href="https://www.ed.gov/media/document/2021-22-crdc-first-look-report-109194.pdf" target="_blank" rel="noopener">OCR, &ldquo;2021-22 Civil Rights Data Collection &mdash; A First Look,&rdquo; January 2025 (Figure 12 and pp. 22&ndash;25)</a></>,
          <><a href="https://www.ed.gov/laws-and-policy/civil-rights-laws/civil-rights-data-collection-crdc" target="_blank" rel="noopener">ED, Civil Rights Data Collection overview (collected since 1968; &ldquo;generally biennial&rdquo;; State Files last updated October 2018)</a></>,
          <><a href="https://www.federalregister.gov/documents/2025/08/07/2025-15038/agency-information-collection-activities-submission-to-the-office-of-management-and-budget-for" target="_blank" rel="noopener">Federal Register, &ldquo;Mandatory Civil Rights Data Collection&rdquo; ICR for the 2025-26 and 2027-28 CRDCs, August 7, 2025</a></>,
          <><a href="https://nces.ed.gov/admindata/crdc/" target="_blank" rel="noopener">NCES, CRDC history (2019-20 collection delayed a year; 2020-21 collection opened October 2021)</a></>,
        ]} />

      </article>
    </Prose>
  </Container>
);

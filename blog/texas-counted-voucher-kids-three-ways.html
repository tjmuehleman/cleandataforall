const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>Ask Texas how many kids are in its new voucher program and you get three answers in 15 days.</P>

        <P><strong>85,344.</strong> That’s the funded-account count in the comptroller’s <a href="https://educationfreedom.texas.gov/wp-content/uploads/2026/07/TEFA-Annual-Demographic-Report.pdf">annual demographic report</a>, which says it’s current as of July 29. (The <a href="https://educationfreedom.texas.gov/wp-content/uploads/2026/08/8.10.26-TEFA-Awarded-Applications-Fact-Sheet.pdf">Aug. 10 fact sheet</a> says that same report reflects funded participants as of July 27. Two days. Sure.)</P>

        <P><strong>118,441.</strong> That’s the fact sheet’s headline: students awarded. A bucket the fine print says includes awards that haven’t been claimed yet.</P>

        <P><strong>101,600.</strong> That’s the comptroller’s <a href="https://comptroller.texas.gov/about/media-center/news/20260813-comptroller-don-huffines-announces-100000-students-receiving-texas-education-freedom-accounts-1786645098165">Aug. 13 announcement</a>, students who have received funding.</P>

        <P>None of these is a lie. They’re snapshots, wearing different labels, of a thing that’s moving. But the gap between the first two is 33,097 kids (118,441 minus 85,344), and that’s a lot of children living somewhere between “got a letter” and “got a bank account.” This is a <a href="https://www.edchoice.org/2026-the-texas-efa-program-explained/">$1 billion appropriation</a>. Which number is the denominator kind of matters.</P>

        <P>If you run a data system you know this feeling. Somebody asks how many, and the honest answer is <em>as of when, and defined how?</em></P>

        <H2>The 70% has the same problem</H2>

        <P>You’ve probably seen it: about 70% of the kids in the program were already in private school or homeschooled. I’ve now seen that 70% stapled to three different things.</P>

        <UL items={[
          <>The <a href="https://www.texastribune.org/2026/08/03/esa-students-texas-school-vouchers-first-year/">Texas Tribune</a> (Aug. 3): 70% of <em>families</em> who have joined or have pending invites.</>,
          <><a href="https://www.click2houston.com/news/local/2026/08/18/70-of-texas-voucher-awardees-previously-attended-private-school-or-were-homeschooled-state-data-shows/">Click2Houston</a> (Aug. 18): seven of every 10 <em>students</em> awarded money, using comptroller data as of Aug. 10.</>,
          <><a href="https://www.the74million.org/article/which-families-are-using-esas-heres-what-we-know-about-texas-first-school-vouchers/">The 74</a>, in between: the demographic report didn’t say how many students previously attended private school or were homeschooled, though earlier state data had 57% of families <em>invited</em> in that category.</>,
        ]} />

        <P>Families or students. Joined, pending, awarded, invited. 57%, then 70%, then 70% again. I went looking for the figure in the demographic report and couldn’t find it. Maybe it’s right. Maybe it’s exactly right. But a number you can’t reproduce from the published file isn’t a finding yet. It’s a quote.</P>

        <H2>The number everyone wants isn’t in a dataset</H2>

        <P>Same story for declines. The Tribune says more than 20,700 families have declined invites, most with kids previously in public school, and credits a Dallas News report. The state’s published data, <a href="https://www.click2houston.com/news/local/2026/08/18/70-of-texas-voucher-awardees-previously-attended-private-school-or-were-homeschooled-state-data-shows/">per Click2Houston</a>, doesn’t say how many families declined, withdrew or never claimed an award. So the most politically interesting number in the program lives in a newspaper, not a dataset. I couldn’t tie it to a primary source, so I’m not building anything on it.</P>

        <H2>What the state does publish is clean</H2>

        <P>The report counts 34,792 white students among the 85,344 funded accounts. That’s 41%, and the Tribune sets it against 24% of Texas public school students. Hispanic students are 28% of the program and 53% of public schools. Black students: 14% and 13%.</P>

        <Fig caption={<>Sources: participant counts from the <a href="https://educationfreedom.texas.gov/wp-content/uploads/2026/07/TEFA-Annual-Demographic-Report.pdf">TEFA annual demographic report</a> (34,792 white, 24,043 Hispanic, 11,570 Black, of 85,344 funded accounts: 40.8%, 28.2%, 13.6%, rounded). Public school shares as reported by the <a href="https://www.texastribune.org/2026/08/03/esa-students-texas-school-vouchers-first-year/">Texas Tribune</a> and <a href="https://www.the74million.org/article/which-families-are-using-esas-heres-what-we-know-about-texas-first-school-vouchers/">The 74</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22White%22%2C%22Hispanic%22%2C%22Black%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22ESA+participants%22%2C%22data%22%3A%5B41%2C28%2C14%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22barPercentage%22%3A0.8%2C%22categoryPercentage%22%3A0.6%7D%2C%7B%22label%22%3A%22Texas+public+school+students%22%2C%22data%22%3A%5B24%2C53%2C13%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22barPercentage%22%3A0.8%2C%22categoryPercentage%22%3A0.6%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Share+of+students%2C+by+race%2Fethnicity+%28%25%29%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%2C%22max%22%3A60%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22id%22%3A%22y%22%7D%5D%2C%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22id%22%3A%22x%22%7D%5D%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22end%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%2C%22size%22%3A13%7D%7D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Paired bar chart: share of ESA participants vs Texas public school students by race and ethnicity" style={{ width:'100%', height:'auto', display:'block' }} />

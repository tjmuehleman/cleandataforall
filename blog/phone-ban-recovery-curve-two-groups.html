const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">
        <P>
          Every write-up of the big national phone ban study tells the same little story. Lock up the phones, the kids get grumpy, wait it out, the kids get happier. Stanford’s summary says discipline problems rose and well-being fell at first, and then <a href="https://ed.stanford.edu/news/national-study-school-cell-phone-bans-shows-benefits-are-not-immediate" target="_blank" rel="noopener">“in the third year, student well-being was higher than before the phones were stashed away.”</a> The brief on my desk had it even tighter: the policy works, it just charges the bill up front.
        </P>

        <P>
          It’s a great story. I’ve told it myself (back in May I <a href="phone-ban-column-of-zeroes.html">called it a 36-month curve</a>). Then I read page 26.
        </P>

        <H2>Three cohorts, and one of them is missing</H2>

        <P>
          The paper is <a href="https://www.nber.org/papers/w35132" target="_blank" rel="noopener">NBER working paper 35132</a>, from Allcott, Baron, Dee, Duckworth, Gentzkow and Jacob. Its main analysis is restricted to <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">“schools that adopt Yondr in 2023, 2024, or 2025,”</a> and the outcome data <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">runs through the 2025 school year</a>. So do the arithmetic. A 2023 adopter gets three school years on the clock. A 2024 adopter gets two. A 2025 adopter gets one. Anything the study says about year three is the 2023 cohort and nobody else.
        </P>

        <Fig caption={<>Derived from the paper’s design: main-analysis cohorts are 2023, 2024 and 2025 adopters and outcome years end in 2025, so 2025 − 2023 + 1 = 3, 2025 − 2024 + 1 = 2, and 1. The paper confirms it observes <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">only the adoption year for the 2025 cohort</a> and omits the 2024 cohort from the well-being analysis.</>}>
          <img src={CHART2} alt="Horizontal bar chart of school years observed after adopting phone pouches, counting the adoption year: 3 for 2023 adopters, 2 for 2024 adopters, who have no well-being data, and 1 for 2025 adopters." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Well-being is thinner still. It comes from Panorama Education surveys, which are <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">“administered at the discretion of districts and schools.”</a> The well-being estimate sits on <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">3,382 observations, against 155,712 for discipline</a>. And the 2024 cohort is gone entirely, because <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">“no schools in that cohort have both pre- and post-adoption SWB observations in the final estimation sample.”</a> Not a few schools. No schools.
        </P>

        <H2>So who dipped, and who recovered?</H2>

        <P>
          The headline numbers: well-being falls by about <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">0.603 school-level standard deviations</a> in the adoption year, and it’s up about <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">0.485</a> two years after that. Dip, then recovery. Now here’s the authors’ own sentence about it:
        </P>

        <BQ cite="Allcott et al., section 5.2">the initial decline in SWB is driven primarily by the 2025 cohort, while the subsequent recovery comes from the 2023 cohort</BQ>

        <P>
          Read that twice. I did. The schools that dipped are schools we’ve watched for exactly one year. And the schools that recovered? For the 2023 cohort the paper reports <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">“little change in the year of adoption.”</a> They didn’t have much of a dip to recover <em>from</em>. The curve everybody drew (me included) connects one group’s rough first year to a different group’s good third year. Nobody in the data rode the whole thing.
        </P>

        <P>
          The authors aren’t hiding any of this. They write that the short panel and staggered adoption <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">“make it difficult to fully disentangle dynamic treatment effects from cross-cohort heterogeneity.”</a> That’s economist for: maybe bans get better with time, or maybe the schools that bought pouches in 2023 are just different from the ones that bought in 2025. Can’t tell yet. Pool every cohort and every year together and the well-being effect is <a href="https://web.stanford.edu/~gentzkow/research/PhoneBans.pdf" target="_blank" rel="noopener">−0.305 with a standard error of 0.201</a>. Not distinguishable from zero.
        </P>

        <Divider />

        <P>
          Why does a data guy care? Because principals are being told right now to hang on through the ugly first year, the payoff shows up in year three. Maybe it does! But the schools that could actually tell us are the 2025 adopters, and their year three is the 2027 school year. Until then “it gets better” is a line drawn between two different sets of kids. Somebody please keep those surveys running.
        </P>

        <P>
          The dip is real. The recovery is real. They just haven’t met.
        </P>

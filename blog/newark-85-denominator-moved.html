// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;

  <div className="callout"><div className="callout-label">{label}</div>{children}</div>

const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Newark Public Schools told its board last Thursday that <a href="https://www.chalkbeat.org/newark/2026/08/28/2025-2026-chronic-absenteeism-rate-drops-to-85-percent/" target="_blank" rel="noopener">8.5% of students were chronically absent</a> in 2025-26. Down from 27% in 2018-19. Down from 29.7% back in 2016-17, when the district was under state operation and staring at a corrective action plan.
        </P>

        <P>
          One day earlier, Colorado reported <a href="https://www.chalkbeat.org/colorado/2026/08/27/chronic-absenteeism-rate-down-but-still-higher-than-pre-pandemic/" target="_blank" rel="noopener">27.5% statewide and 36.6% in Denver</a>.
        </P>

        <P>
          Put those side by side and Newark looks like it solved the thing nobody else can solve. Both numbers are honestly reported. Neither one is measuring quite the same thing.
        </P>

        <H2>The threshold moved</H2>

        <P>
          New Jersey&rsquo;s ESSA state plan used to say a student had to be enrolled at a school for at least 45 days before their attendance counted toward that school&rsquo;s chronic absenteeism rate. NJDOE&rsquo;s April 2025 <a href="https://www.nj.gov/education/safety/sandp/attendance/docs/ReportingStudentAttendanceandDeterminingChronicAbsenteeismRates.pdf" target="_blank" rel="noopener">reporting guidance</a> says the department submitted an amendment to raise that to 90 days &ldquo;to align with federal requirements,&rdquo; effective for 2024-25 if the feds approved it by fall 2025.
        </P>

        <P>
          Ninety days out of 180. Half a year of enrollment before you are in the math at all.
        </P>

        <P>
          Let me be careful about what did <em>not</em> change, because some of the coverage has gotten this backwards. Chronic absenteeism in New Jersey is still missing 10% or more of the days you were enrolled. That definition is untouched. What changed is who gets a row in the table.
        </P>

        <Callout label="What changed">
          Not the bar for being absent. The bar for being counted.
        </Callout>

        <P>
          And the students that rule removes are not a random sample. Read the same guidance on transfer students: a kid at School 1 from September to November and School 2 after that gets filed as two separate records, and their attendance &ldquo;should reference ONLY the time period for each school instance and should not be combined.&rdquo; Move once mid-year and you can land under 90 days at both schools. Kids who move mid-year are also, and every attendance clerk in America knows this, the kids who miss the most school.
        </P>

        <P>
          Newark&rsquo;s superintendent said it out loud at the August board retreat: &ldquo;We did extraordinarily well this past year simply because the state of New Jersey actually changed the rules to assist more school districts in their chronic absenteeism rates, at least that is from our perspective.&rdquo;
        </P>

        <P>
          Chalkbeat&rsquo;s line is that it&rsquo;s unclear how much the change influenced the rate. Which is the correct thing to write, and also the whole problem. Nobody has run the counterfactual. The district&rsquo;s Office of Data and Research is sitting on the enrollment-duration distribution that would settle it in an afternoon.
        </P>

        <H2>This is not a Newark problem</H2>

        <P>
          Nat Malkus at AEI publishes the closest thing the country has to a national attendance scoreboard. His <a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/" target="_blank" rel="noopener">June 2026 report</a> covers 45 states with 2025 data: about 15% chronically absent in 2018 and 2019, a 28.3% peak in 2022, then 25.7%, then 23.5%, then 22.6%.
        </P>

        <Fig caption={<>Annual declines from the 45-state series in <a href="https://www.aei.org/research-products/report/from-attendance-crisis-to-chronic-condition-tracking-post-pandemic-chronic-absenteeism-into-2025/" target="_blank" rel="noopener">AEI&rsquo;s June 2026 report</a>: 28.3% &rarr; 25.7% &rarr; 23.5% &rarr; 22.6%. Differences are 2.6, 2.2 and 0.9; AEI states them as 2.7, 2.1 and &ldquo;just under 1&rdquo; from unrounded figures, and those are the values plotted.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222023%22%2C%222024%22%2C%222025%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Annual+change%22%2C%22data%22%3A%5B-2.7%2C-2.1%2C-0.9%5D%2C%22backgroundColor%22%3A%5B%22%23777%22%2C%22%235a5a5a%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22The+national+improvement+is+dying+by+thirds%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A-3%2C%22max%22%3A0%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Change+in+chronic+absenteeism%2C+45+states+%28pct+pts%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of annual change in chronic absenteeism across 45 states: down 2.7 points in 2023, down 2.1 points in 2024, down 0.9 points in 2025." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          Two point seven, then two point one, then under one. The country has essentially stopped improving, which is what makes a district record look so loud right now.
        </P>

        <P>
          Buried in that same report is the sentence that should be stapled to every attendance dashboard in America:
        </P>

        <BQ cite="AEI, From Attendance Crisis to Chronic Condition?, June 2026">
          States also vary in which students they include in their calculations, with some states counting all students enrolled for at least 10 days and others using longer enrollment thresholds. These differences can produce different rates for similar attendance behaviors.
        </BQ>

        <P>
          That is the guy who builds the scoreboard telling you the scoreboard is not a scoreboard. He says it every year. It gets quoted approximately never.
        </P>

        <H2>The part I can&rsquo;t stop thinking about</H2>

        <P>
          Same NJDOE document, further down: New Jersey is required to report attendance to the feds through EDFacts, and EDFacts &ldquo;does include students with 10 or more days in membership.&rdquo;
        </P>

        <P>
          So New Jersey computes this metric twice. Ten-day threshold for Washington. Ninety-day threshold for the School Performance Reports that parents actually read, that reporters actually quote, that districts actually get flagged on. Same state, same kids, same year, two denominators.
        </P>

        <P>
          Only one of them ever makes the headline.
        </P>

        <Divider />

        <P>
          None of this means Newark faked anything. Reviving an attendance department, individualized intervention plans, a truancy task force, staff calling five families apiece before the first day &mdash; that is real work, done for eight years, and the trend was bending long before the threshold moved.
        </P>

        <P>
          It means we can&rsquo;t tell how much of 8.5% is the work. And we could tell, easily, if anyone published the same year computed both ways. Two numbers instead of one. That&rsquo;s the whole ask.
        </P>

        <P>
          Newark&rsquo;s own Kids Count data says homeless students were chronically absent at 25% in 2024-25. Those are the kids who move mid-year. Those are the kids the 90-day rule is most likely to drop.
        </P>

        <P>
          A metric that gets better when you stop counting the students who move is not measuring attendance. It&rsquo;s measuring stability, and calling it attendance.
        </P>

      </article>
    </Prose>
  </Container>
);

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          A professor at the University of Oregon spent two days running a program
          &mdash; &ldquo;literally hundreds of pages of code long,&rdquo; in her words &mdash; to find out
          what the federal government had just published about American schoolchildren.
          There was no press release. No blog post. No announcement of any kind. The
          Civil Rights Data Collection, the survey of how every public school in the
          country treats kids by race, disability, sex and language, simply
          {' '}<a href="https://www.npr.org/2026/09/04/nx-s1-5955681/civil-rights-data-schools-trump">appeared on ed.gov this week</a>.
        </P>

        <P>
          It was due in December.
        </P>

        <P>
          I run a data company, so let me say the boring part first: being late is not
          the interesting failure here. Federal data slips. Contracts lapse, people quit,
          the file doesn&rsquo;t validate. What&rsquo;s interesting is what got shipped.
        </P>

        <H2>Nine months, six weeks of explanation</H2>

        <P>
          The Department set its own deadline, and the deadline was
          {' '}<a href="https://www.npr.org/2026/07/02/nx-s1-5859422/civil-rights-data-students-education">last December</a>.
          The files went up in early September. NPR asked what happened and the
          Department didn&rsquo;t answer &mdash; not in July, not this week. The only
          explanation anyone has offered on the record came from a former Education
          Department employee, who said the 2025 government shutdown knocked out
          operations at the agency for over six weeks, CRDC work included.
        </P>

        <P>
          Six weeks. Out of nine months.
        </P>

        <Fig caption={<>Nine months elapsed between the Department&rsquo;s own December 2025 deadline and the early-September 2026 release. The one on-the-record explanation, a shutdown that hit Education Department operations for &ldquo;over six weeks,&rdquo; covers about 1.4 months of it (6 weeks &divide; 4.3 weeks per month); the remaining ~7.6 months is 9 minus 1.4. The Department did not answer NPR&rsquo;s questions about the delay. Source: NPR, July 2 and September 4, 2026.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22horizontalBar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Explained+on+the+record%22%2C%22Never+explained%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22months%22%2C%22data%22%3A%5B1.4%2C7.6%5D%2C%22backgroundColor%22%3A%5B%22%235a5a5a%22%2C%22%23141210%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Nine+months+late%2C+and+only+six+weeks+of+it+accounted+for%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A17%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22display%22%3Atrue%2C%22color%22%3A%22%23141210%22%2C%22anchor%22%3A%22end%22%2C%22align%22%3A%22right%22%2C%22font%22%3A%7B%22size%22%3A15%2C%22weight%22%3A%22bold%22%7D%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22max%22%3A9%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Months+between+the+December+2025+deadline+and+the+September+2026+release%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A13%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=460&bkg=transparent&devicePixelRatio=2"
            alt="Horizontal bar chart splitting the nine-month CRDC delay into 1.4 months explained on the record by the 2025 government shutdown and 7.6 months never explained."
            style={{ display:'block', width:'100%', maxWidth:900, margin:'0 auto', height:'auto' }} />
        </Fig>

        <P>
          The rest is context nobody offered as a cause. The Office for Civil Rights,
          which runs the collection, cut its staff in half after the administration took
          office, and the administration has announced it&rsquo;s moving OCR to the Justice
          Department. Both true. Neither given as the reason.
        </P>

        <H2>37 files is a delivery, not a publication</H2>

        <P>
          For more than a decade the CRDC came with a First Look Report: plain-language
          national numbers, the thing a parent could actually open. This cycle there
          isn&rsquo;t one. Catherine Lhamon, who led OCR under Obama and Biden, put it about as
          plainly as it can be put.
        </P>

        <BQ cite="Catherine Lhamon, former head of the Education Department's Office for Civil Rights, to NPR">
          It didn&rsquo;t make it usable for somebody&rsquo;s mom to be able to see what&rsquo;s happening in
          a school community, advocate with a school board, compare the school community
          experience to another district or other states in the country.
        </BQ>

        <P>
          This is the part I think people underrate, and it&rsquo;s the part I&rsquo;d care about if
          the topic were shipping manifests or well yields instead of schools. Nobody
          deleted the data. They deleted the readability layer. A dataset without one
          isn&rsquo;t public, it&rsquo;s <em>available</em>, and those are different words. The 37 files are
          right there. The price of reading them went from clicking a PDF to writing
          hundreds of pages of code, which is a real price, paid in a currency most school
          board members and every parent I&rsquo;ve ever met does not have.
        </P>

        <H2>The column that isn&rsquo;t there</H2>

        <P>
          The 2023&ndash;24 collection was supposed to be the first CRDC ever to report how
          nonbinary students are treated at school. Schools were asked. Schools answered.
          Then the Department stripped that information out of each of the 37 files it
          released, citing the January 2025 executive order declaring the federal
          government recognizes two sexes.
        </P>

        <Callout label="The sequence">
          The data was collected. Schools reported it. The Department published 37 files
          and removed it from all 37. Whoever in each district actually sat down and filled
          out that section of the survey did the work, and the return on that work is zero.
        </Callout>

        <P>
          There are two ways to lose a number. You can decline to collect it, or you can
          collect it and drop the column on the way out the door. The second one is worse,
          and not for the reason you&rsquo;d think. It&rsquo;s worse because the cost was already
          sunk. The burden already landed on the districts. Every hour of clerical time
          this cost was spent before the decision was made to throw the answer away.
        </P>

        <P>
          And this is the last clean look at it either way. The
          {' '}<a href="https://www.ed.gov/media/document/2025-26-civil-rights-data-collection-general-overview-changes-and-list-of-data-elements-114324.pdf">2025&ndash;26 collection</a>
          {' '}has already dropped the nonbinary category outright, along with the
          gender-identity questions &mdash; how many students identify as nonbinary, how many
          nonbinary students have disabilities, how many are English learners. Gone before
          the next survey goes out. And a spokesperson confirmed the Department has begun
          collecting for the next three cycles.
        </P>

        <Divider />

        <P>
          OCR told NPR it &ldquo;will be releasing more data and materials in the coming weeks,&rdquo;
          and wouldn&rsquo;t say what that meant. Maybe a First Look substitute shows up. Maybe it
          doesn&rsquo;t. In the meantime, the federal census of how American schools treat their
          children is 37 spreadsheets, one deliberately empty column, and a professor in
          Oregon with a very long program.
        </P>

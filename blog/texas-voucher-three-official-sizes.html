const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Texas has published three different sizes for its new voucher program in the space of eight weeks. All three are correct.
        </P>

        <P>
          On May 4 the Comptroller&rsquo;s office announced <a href="https://comptroller.texas.gov/about/media-center/news/20260504-additional-students-awarded-texas-education-freedom-accounts-1777649639747">more than 53,000 new awards</a>, stacked on top of the 42,600-plus already issued to students with a disability and their siblings. Call it 96,000. On June 10 the official count was <a href="https://educationfreedom.texas.gov/wp-content/uploads/2026/06/100K-TEFA-Awarded-Applications-Fact-Sheet.pdf">102,037</a>. On June 30 the number was <a href="https://comptroller.texas.gov/about/media-center/news/20260630-nearly-73000-texas-education-freedom-accounts-to-receive-initial-funding-july-1-1782833580152">nearly 73,000</a> &mdash; that being how many accounts actually received money on July 1.
        </P>

        <P>
          Nobody is lying. Those are three measurements taken at three points in a pipeline, and the pipeline leaks.
        </P>

        <H2>Award, acceptance, and funding are three different events</H2>

        <P>
          An award is a notice. Acceptance is a parent picking an option by July 15. Funding requires the private school to confirm the kid&rsquo;s enrollment in the portal by <a href="https://comptroller.texas.gov/about/media-center/news/20260630-nearly-73000-texas-education-freedom-accounts-to-receive-initial-funding-july-1-1782833580152">July 31</a>. Three separate events, three separate deadlines, and a student can drop out at any of them. About 2,000 families had already opted out by June 8 &mdash; and the fact sheet says, in a footnote, that the 102,037 excludes them.
        </P>

        <P>
          That footnote is the most honest thing in the dataset. It tells you the headline number has a cutoff date baked into it.
        </P>

        <Callout label="Key figure">
          <a href="https://comptroller.texas.gov/about/media-center/news/20260610-texas-education-freedom-accounts-pass-100000-student-milestone-1781032778918">144,744 students were still on the waitlist</a> on June 10 &mdash; more than the 102,037 holding awards that same day, and roughly double the ~73,000 that got funded three weeks later.
        </Callout>

        <P>
          To be fair to the Comptroller, this is a well-instrumented program. Tier 2 awards went out by <a href="https://comptroller.texas.gov/about/media-center/news/20260504-additional-students-awarded-texas-education-freedom-accounts-1777649639747">random lottery</a> because demand beat the money, the draw was observed by the State Auditor&rsquo;s Office and Ernst &amp; Young, and the thing is slated for three separate audits. Transparency isn&rsquo;t the problem here. The problem is that being transparent about a moving pipeline still gets you a moving number.
        </P>

        <H2>The biggest group of recipients can&rsquo;t have left anything</H2>

        <P>
          Here&rsquo;s the part I didn&rsquo;t expect. Break the 102,037 awards out by grade and the largest single cohort is pre-K: 10,938 kids.
        </P>

        <Fig caption={<>Source: Texas Comptroller, <a href="https://educationfreedom.texas.gov/wp-content/uploads/2026/06/100K-TEFA-Awarded-Applications-Fact-Sheet.pdf">TEFA awarded-applications fact sheet</a>, June 10, 2026. The 14 grade-level bars sum to exactly 102,037.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Pre-K%22%2C%22K%22%2C%221%22%2C%222%22%2C%223%22%2C%224%22%2C%225%22%2C%226%22%2C%227%22%2C%228%22%2C%229%22%2C%2210%22%2C%2211%22%2C%2212%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Awards%22%2C%22data%22%3A%5B10938%2C8287%2C8290%2C8231%2C8642%2C8647%2C8463%2C8634%2C7432%2C6439%2C5910%2C4973%2C4048%2C3103%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%2C%22%235a5a5a%22%5D%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22TEFA+awards+by+grade+level%3A+Pre-K+is+the+largest+single+cohort%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A15%2C%22fontStyle%22%3A%22bold%22%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Grade+level%2C+2026-27%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22beginAtZero%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Awards%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart of Texas Education Freedom Account awards by 2026-27 grade level. Pre-K is the tallest bar at 10,938 awards, kindergarten through eighth grade run roughly 6,400 to 8,650, and twelfth grade is the shortest at 3,103."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <P>
          Pre-K and kindergarten together come to 19,225 awards, or 18.8% of the total (19,225 &divide; 102,037). Those are four- and five-year-olds. Whatever you think about vouchers, a pre-K student is not escaping a failing public school, because a pre-K student was not enrolled in one. The largest block of recipients is entering the system, not leaving it.
        </P>

        <P>
          And the twelfth-grade column is the shortest at 3,103. Demand clusters exactly where a family is making a first enrollment decision rather than switching out of one.
        </P>

        <H2>The number that moved the most</H2>

        <P>
          In February, a program spokesperson told KSAT that <a href="https://www.ksat.com/news/local/2026/02/13/4-in-5-texas-education-freedom-account-applicants-plan-on-attending-private-school-spokesperson-says/">4 in 5 applicants</a> planned to attend private school. In May, KSAT got program data on the actual awardees: <a href="https://www.ksat.com/news/local/2026/05/14/more-than-half-of-tefa-recipients-already-enrolled-in-private-or-homeschool-data-shows/">43% were in public school, 57% were already in private school or homeschooling</a>.
        </P>

        <P>
          Also not the same measurement. One is applicant intent, self-reported on a form, before anybody verified anything. The other is awardees, after eligibility screening and a lottery. Different population, different moment, different collection method &mdash; and a twenty-point-plus gap between them.
        </P>

        <Divider />

        <P>
          I don&rsquo;t have a strong view on whether Texas should be doing this. I have a very strong view that &ldquo;how many kids are in the program&rdquo; is not a question this data can answer yet, and won&rsquo;t be until the July 31 school confirmations settle and somebody publishes a reconciled count.
        </P>

        <P>
          For now the program has three sizes, a waitlist bigger than its own enrollment, and a headline number that depends on which Tuesday you ask.
        </P>

        <P>
          Pick one and somebody will correct you. Correctly.
        </P>

      </article>
    </Prose>
  </Container>
);

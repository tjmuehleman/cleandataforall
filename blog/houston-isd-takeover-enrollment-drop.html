const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          In June 2023, the Texas Education Agency fired Houston ISD&rsquo;s elected school board, installed a state-appointed team to run the district, and cited years of academic underperformance plus violations of state open-meetings and procurement law. Two and a half years later, researchers at the University of Houston pulled the district&rsquo;s enrollment and teacher-certification records, stitched them into a before-and-after, and published the accountability report on the takeover itself (<a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">UH Institute for Education Policy Research and Evaluation, Jan 2026</a>).
        </P>

        <P>
          The topline: HISD is serving <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">13,208 fewer students</a> in 2024-25 than it was in 2022-23, and the losses grew every year after the takeover, not before it. Ninth grade &mdash; the grade where a family actually chooses a school instead of just getting assigned one &mdash; <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">fell 15.1%</a> in two years. The share of kids leaving Texas public education entirely, as opposed to switching districts or going charter, <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">doubled: 4.4% in 2016-17 to 8.1% in 2024-25</a>.
        </P>

        <P>
          That&rsquo;s the enrollment half. The workforce half is worse, and it&rsquo;s the half I actually care about, because it&rsquo;s a staffing pipeline problem before it&rsquo;s a politics problem. The share of HISD teachers who are uncertified went from <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">0.3% in 2016-17 to 19.8% in 2024-25</a>. First-year teachers are <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">up 64.7%</a> since the takeover, while teachers with two to five years of experience grew a slower 12.5%. Teacher retention &mdash; staying on the same campus year to year &mdash; dropped from north of 70% to <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">58.6%</a>. Read that twice: a district trying to prove it can raise outcomes is doing it with a workforce that&rsquo;s never been less experienced.
        </P>

        <Fig caption={<>First-year teacher count is up 64.7% since the takeover; teachers with 2&ndash;5 years of experience are up 12.5% over the same span. Source: <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">UH IEPRE</a>.</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22First-year+teachers%22%2C%22Teachers+with+2-5+yrs+experience%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Growth+since+takeover+%28%25%29%22%2C%22data%22%3A%5B64.7%2C12.5%5D%2C%22backgroundColor%22%3A%22%23141210%22%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Growth+in+HISD+teacher+counts+by+experience+tier%2C+since+takeover%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22beginAtZero%22%3Atrue%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22%25+growth+since+takeover%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Bar chart showing Houston ISD first-year teacher growth of 64.7% versus 12.5% growth for teachers with 2-5 years experience since the takeover"
          />
        </Fig>

        <P>
          Here&rsquo;s the data-guy part, because a research shop did the boring, unglamorous work that makes a report like this possible. HISD&rsquo;s enrollment gets snapshotted once a year, on the last Friday in October &mdash; a single fixed date standing in for twelve months of families quietly leaving mid-year. And to track a teacher&rsquo;s certification status over time, UH&rsquo;s Education Research Center had to marry that enrollment file to a completely separate one: the <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">State Board for Educator Certification&rsquo;s records</a>. Two administrative systems that were never built to talk to each other, bolted together so a university could answer a question the agency running the district didn&rsquo;t publish an answer to itself.
        </P>

        <P>
          And the baseline is cleaner than it will ever be again. Report co-author Blake Heller notes that <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">none of this yet includes competition from private schools under Senate Bill 2</a>, Texas&rsquo;s new voucher program, which hasn&rsquo;t phased in yet. Which means 13,208 is a pre-treatment number. The real test comes once Houston families have a subsidized private option sitting next to a district that just published, in its own hiring data, how green its next teacher is likely to be.
        </P>

        <Divider />

        <P>
          Texas didn&rsquo;t stop at Houston. The state has <a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">announced takeovers of Fort Worth, Beaumont, Connally, and Lake Worth ISDs</a> &mdash; same instrument, four new baselines, running the exact playbook the Houston data says is emptying the district it was supposed to save. Nobody planned a controlled experiment here. But that&rsquo;s what four more districts running the same before-and-after clock hands you, whether the state wanted the comparison or not.
        </P>

        <H2>Sources</H2>
        <UL items={[
          <><a href="https://www.uh.edu/news-events/stories/2026/january/01152026-houston-isd-takeover-by-the-numbers.php" target="_blank" rel="noopener">UH Institute for Education Policy Research and Evaluation, &ldquo;UH Report Finds Houston ISD Enrollment Declines Accelerated After State Takeover,&rdquo; Jan 15, 2026</a></>,
          <><a href="https://www.uh.edu/education/research/institutes-centers/iepre/reports_publications/houston_isd_takeover-2026-final-1-13-26.pdf" target="_blank" rel="noopener">Full report PDF: &ldquo;Houston ISD Takeover: By the Numbers&rdquo;</a></>,
          <><a href="https://www.houstonpublicmedia.org/articles/education/2026/01/15/540871/university-of-houston-report-shows-major-enrollment-decline-workforce-shifts-under-houston-isd-takeover/" target="_blank" rel="noopener">Houston Public Media coverage</a></>,
          <><a href="https://www.click2houston.com/news/local/2026/01/21/hisd-lost-more-than-13000-students-after-state-takeover-uh-report-finds/" target="_blank" rel="noopener">Click2Houston coverage</a></>,
        ]} />

        <P><em>— TJ</em></P>

      </article>
    </Prose>
  </Container>
);

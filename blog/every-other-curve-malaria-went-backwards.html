// ==================== Post body ====================
const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          WHO published <em>World Health Statistics 2026</em> on May 13. I read these reports the way some people read box scores &mdash; scanning for the one line that doesn&rsquo;t fit.
        </P>

        <P>
          This year it&rsquo;s malaria. Global incidence is{' '}
          <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">up 8.5% since 2015</a>. Everything else in the report bends the right way: new HIV infections{' '}
          <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">down 40% since 2010</a>, the number of people needing treatment for neglected tropical diseases <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">down 36%</a>, tobacco and alcohol both falling. Malaria is the exception. The one curve pointed the wrong way.
        </P>

        <P>
          The 2024 count: <a href="https://www.who.int/teams/global-malaria-programme/reports/world-malaria-report-2025">282 million cases and 610,000 deaths</a>. Ninety-five percent of the deaths in the African Region; 75% of those among children under five. The year before it was{' '}
          <a href="https://www.who.int/teams/global-malaria-programme/reports/world-malaria-report-2024">263 million cases and 597,000 deaths</a>. The line is moving, and it&rsquo;s moving up.
        </P>

        <H2>Where it&rsquo;s moving fastest</H2>

        <P>
          Southern Africa. And the numbers there aren&rsquo;t annual estimates &mdash; they&rsquo;re weekly, district-level counts from{' '}
          <a href="https://africacdc.org/news-item/malaria-surge-in-southern-africa/">Africa CDC&rsquo;s surveillance feed</a>.
        </P>

        <P>
          Zimbabwe, through epidemiological week 23 of 2025:{' '}
          <a href="https://africacdc.org/news-item/malaria-surge-in-southern-africa/">111,998 cases and 310 deaths</a>, against 29,031 cases and 49 deaths in the same window of 2024. Nearly four times the cases, six times the deaths. Botswana &mdash; a country that was on the elimination shortlist a decade ago &mdash; went from{' '}
          <a href="https://africacdc.org/news-item/malaria-surge-in-southern-africa/">218 cases and zero deaths to 2,223 cases and 11 deaths</a>. Namibia logged{' '}
          <a href="https://africacdc.org/news-item/malaria-surge-in-southern-africa/">89,959 cases and 146 deaths since November 2024</a>, across 37 of its 121 districts.
        </P>

        <Fig caption={<>Source: <a href="https://africacdc.org/news-item/malaria-surge-in-southern-africa/">Africa CDC &mdash; <em>Malaria Surge in Southern Africa</em></a> (July 2025), epidemiological weeks 1&ndash;23. Plotted on a log scale so both countries are legible. Zimbabwe rose ~3.9&times; (49 to 310 deaths); Botswana ~10.2&times; (0 to 11 deaths).</>}>
          <img
            src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22Zimbabwe%22%2C%22Botswana%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%222024+%28epi+weeks+1-23%29%22%2C%22data%22%3A%5B29031%2C218%5D%2C%22backgroundColor%22%3A%22%23bbb%22%2C%22borderWidth%22%3A0%7D%2C%7B%22label%22%3A%222025+%28epi+weeks+1-23%29%22%2C%22data%22%3A%5B111998%2C2223%5D%2C%22backgroundColor%22%3A%22%23141210%22%2C%22borderWidth%22%3A0%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Malaria+cases%2C+same+window+of+the+year%3A+2024+vs+2025%22%2C%22fontSize%22%3A15%2C%22fontColor%22%3A%22%23141210%22%2C%22padding%22%3A16%7D%2C%22legend%22%3A%7B%22position%22%3A%22bottom%22%2C%22labels%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%7D%2C%22layout%22%3A%7B%22padding%22%3A%7B%22top%22%3A10%2C%22bottom%22%3A12%2C%22left%22%3A12%2C%22right%22%3A24%7D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22type%22%3A%22logarithmic%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A11%2C%22min%22%3A100%2C%22max%22%3A200000%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Confirmed+cases+%28log+scale%29%22%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A12%7D%2C%22gridLines%22%3A%7B%22display%22%3Afalse%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2"
            alt="Grouped bar chart on a log scale of malaria cases in Zimbabwe and Botswana, epidemiological weeks 1 to 23. Zimbabwe: 29,031 in 2024 versus 111,998 in 2025. Botswana: 218 in 2024 versus 2,223 in 2025."
            style={{ width:'100%', maxWidth:900, display:'block', margin:'0 auto' }}
          />
        </Fig>

        <H2>Two clocks</H2>

        <P>
          I run a data company. The part that gets me here isn&rsquo;t the case count. It&rsquo;s a line buried two-thirds of the way down the same WHO report.
        </P>

        <BQ cite="WHO, World Health Statistics 2026">
          As of end 2025, only 18% of countries were reporting mortality data to WHO within one year, and nearly one third have never reported cause-of-death data.
        </BQ>

        <P>
          Of an estimated <a href="https://www.who.int/news/item/13-05-2026-global-health-gains-face-threat-of-reversal">61 million deaths globally in 2023, only about a third were reported with a cause</a>, and only about a fifth had ICD-coded data. So when WHO says 610,000 people died of malaria last year, that number is mostly modeled &mdash; built from the slice of the world that reports and stretched across the slice that doesn&rsquo;t. The 8.5% reversal is real. It&rsquo;s also a measurement taken through a keyhole.
        </P>

        <P>
          That&rsquo;s what makes the southern Africa numbers different. The Africa CDC counts are weekly and granular because someone is counting in near-real-time. The global figure is an annual estimate that lands a year and a half late and gets quietly revised every cycle. Two systems, two clocks &mdash; and the loud headline runs on the slow one.
        </P>

        <H2>And the tools are degrading too</H2>

        <P>
          Then there&rsquo;s the part underneath the count. Artemisinin partial resistance &mdash; resistance to the drug the entire treatment strategy is built on &mdash; is now{' '}
          <a href="https://www.who.int/news-room/questions-and-answers/item/artemisinin-resistance">confirmed in four African countries: Eritrea, Rwanda, Uganda, and Tanzania</a>, with{' '}
          <a href="https://www.who.int/teams/global-malaria-programme/reports/world-malaria-report-2025">suspected resistance in four more</a> (Ethiopia, Namibia, Sudan, Zambia). The thing you treat malaria with is starting to not work, in the same neighborhood where the case count is climbing.
        </P>

        <Callout label="The shape of it">
          One disease curve in the whole report is pointed the wrong way (+8.5% since 2015). It&rsquo;s accelerating fastest in countries that were supposed to be eliminating it. And the frontline drug is failing in four countries, suspected in four more.
        </Callout>

        <Divider />

        <P>
          So here&rsquo;s the picture from the data side. The case count went up. It&rsquo;s climbing fastest where the disease was nearly gone. The drug is failing where it&rsquo;s spreading. And we&rsquo;re watching all of it through a reporting system that, by its own admission, can see about a third of the world&rsquo;s deaths within a useful window.
        </P>

        <P>
          The malaria number went up. The bigger problem is how hard it&rsquo;s become to see the number at all.
        </P>

        <P>
          <em>&mdash; TJ</em>
        </P>

        <Divider />

        <H2>Sources</H2>

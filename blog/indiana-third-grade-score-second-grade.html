const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">
        <P>
          On August 11, Indiana announced that <a href="https://www.in.gov/doe/about/news/Press-Releases/Indiana%20Literacy%20Rates%20Increase%20for%20Fifth%20Consecutive%20Year.pdf" target="_blank" rel="noopener">88.7% of its third graders</a> are proficient readers on IREAD. That beats the <a href="https://www.chalkbeat.org/indiana/2026/08/11/iread-pass-rates-surpass-pre-covid-literacy-levels/" target="_blank" rel="noopener">87.3% from 2019</a>, it’s the <a href="https://www.in.gov/doe/about/news/Press-Releases/Indiana%20Literacy%20Rates%20Increase%20for%20Fifth%20Consecutive%20Year.pdf" target="_blank" rel="noopener">fifth straight annual increase</a>, and it’s the <a href="https://www.chalkbeat.org/indiana/2026/08/11/iread-pass-rates-surpass-pre-covid-literacy-levels/" target="_blank" rel="noopener">first time</a> the state has cleared its pre-pandemic number. Good news, and I think a lot of it is real.
        </P>

        <P>
          But I’m a data guy, so I spent my evening on a smaller question. What’s a third grader?
        </P>

        <H2>One test, five chances, two grades</H2>

        <P>
          Under policies the state lists as new for 2024–25, <a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">every second grader now takes IREAD</a>, and kids get five opportunities to pass before fourth grade. Third graders who miss in the spring get two summer retests. And a second grader who passes is <a href="https://www.chalkbeat.org/indiana/2026/08/11/iread-pass-rates-surpass-pre-covid-literacy-levels/" target="_blank" rel="noopener">counted in the following year’s third-grade results</a> and never sits the test again.
        </P>

        <P>
          So the 2026 number isn’t <em>what share of third graders passed a reading test this spring</em>. It’s what share of a cohort passed at least once, over as many as five sittings, across two school years. That’s a fine thing to measure! It’s just not what the 2019 number measured, and every chart (mine included) draws them as one line.
        </P>

        <P>
          How much does it matter? <a href="https://www.chalkbeat.org/indiana/2026/08/11/iread-pass-rates-surpass-pre-covid-literacy-levels/" target="_blank" rel="noopener">48% of second graders passed in 2025</a>, and those passes rolled straight into this year’s third-grade result. This year <a href="https://www.chalkbeat.org/indiana/2026/08/11/iread-pass-rates-surpass-pre-covid-literacy-levels/" target="_blank" rel="noopener">62% of second graders passed</a>, so a big piece of next August’s headline is already in the bank. A year early.
        </P>

        <P>
          Look at the shape of the line, too. From 2021 to 2024 the rate crawled from 81.2% to 82.5%. Then 2025 jumped to 87.3%, which the state itself calls <a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">the largest single-year increase since 2013</a>. Same year the new rules kicked in. Some of that is real teaching (the state’s <a href="https://www.in.gov/doe/about/news/Press-Releases/Indiana%20Literacy%20Rates%20Increase%20for%20Fifth%20Consecutive%20Year.pdf" target="_blank" rel="noopener">Literacy Cadre coaching program</a> has now reached about 770 schools). Some of it is more at-bats. I can’t tell you the split, because the one column that would settle it (third graders only, spring only, first attempt) isn’t in the August release or the November deck.
        </P>

        <H2>The other missing table</H2>

        <P>
          Then there’s the part of the law with teeth. In 2025, <a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">73,500 of 84,163 third graders</a> were proficient. That leaves 10,663 who weren’t. Of those, <a href="https://www.chalkbeat.org/indiana/2025/11/05/how-many-students-held-back-under-retention-law/" target="_blank" rel="noopener">6,950 got a good cause exemption</a> and went on to fourth grade, 3,040 were held back, and roughly 673 left the state or are now homeschooled.
        </P>

        <Fig caption={<>Sources: 84,163 tested and 73,500 proficient from IDOE’s <a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">November 5, 2025 reading update</a>; 10,663 = 84,163 − 73,500, also reported by <a href="https://www.chalkbeat.org/indiana/2025/11/05/how-many-students-held-back-under-retention-law/" target="_blank" rel="noopener">Chalkbeat</a>, along with 6,950 exempted, 3,040 retained and roughly 673 no longer enrolled. 6,950 + 3,040 + 673 = 10,663.</>}>
          <img src={CHART2} alt="Horizontal bar chart of Indiana third graders in 2025: 84,163 tested, 10,663 did not pass, 6,950 exempted and promoted, 3,040 retained in grade 3, 673 left the state or homeschooled." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          The state tells us who got exempted: <a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">nearly 75% were in special education and nearly 24% were English learners</a>. Who got retained? As of August, the department <a href="https://www.chalkbeat.org/indiana/2026/08/11/iread-pass-rates-surpass-pre-covid-literacy-levels/" target="_blank" rel="noopener">had not released the demographics</a> of the 3,040. One branch of the fork gets a breakdown. The other branch, the one where a kid repeats third grade, gets a total.
        </P>

        <Divider />

        <P>
          I’d bet Indiana did teach more kids to read. I’d also bet the attempt-level file exists, because you can’t run a five-chance test without one. Publish the first-attempt column and the retention table and this whole post goes away. Until then the record has a footnote, and the footnote is a second grader.
        </P>

        <H3>Sources</H3>

        <UL items={[
          <><a href="https://www.in.gov/doe/about/news/Press-Releases/Indiana%20Literacy%20Rates%20Increase%20for%20Fifth%20Consecutive%20Year.pdf" target="_blank" rel="noopener">Indiana Department of Education, “Indiana Literacy Rates Increase for Fifth Consecutive Year,” August 11, 2026</a></>,
          <><a href="https://www.in.gov/sboe/files/11.5.25-Reading-Update.pdf" target="_blank" rel="noopener">Indiana Department of Education, “Maximizing Reading Support for Students,” State Board of Education, November 5, 2025</a></>,
          <><a href="https://www.chalkbeat.org/indiana/2026/08/11/iread-pass-rates-surpass-pre-covid-literacy-levels/" target="_blank" rel="noopener">Chalkbeat Indiana, “Indiana third grade reading scores surpass pre-pandemic levels on IREAD test,” August 11, 2026</a></>,
          <><a href="https://www.chalkbeat.org/indiana/2025/11/05/how-many-students-held-back-under-retention-law/" target="_blank" rel="noopener">Chalkbeat Indiana, “Here’s how many students were held back thanks to Indiana’s retention law,” November 5, 2025</a></>,
        ]} />

        <P><em>— TJ</em></P>

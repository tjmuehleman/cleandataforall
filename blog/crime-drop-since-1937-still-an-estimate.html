// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>
//   <H3>Sub-heading</H3>
//   <P>Paragraph text.</P>
//   <UL items={['Item one', 'Item two']} />

const H2 = ({ children }) => <h2>{children}</h2>;
const H3 = ({ children }) => <h3>{children}</h3>;
const P  = ({ children }) => <p>{children}</p>;
const UL = ({ items }) => <ul>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
const OL = ({ items }) => <ol>{items.map((x,i)=><li key={i}>{x}</li>)}</ol>;
const BQ = ({ children, cite }) => <blockquote>{children}{cite && <cite>— {cite}</cite>}</blockquote>;
const Callout = ({ label='Note', children }) => (
  <div className="callout"><div className="callout-label">{label}</div>{children}</div>
);
const Divider = () => <hr />;
const Fig = ({ caption, children }) => <figure>{children}{caption && <figcaption>{caption}</figcaption>}</figure>;

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          On May 13, the FBI said violent crime in the United States <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">fell an estimated 9.3% in 2025, and murder fell 18.1%</a>. Robbery, down 18.5%. Property crime, down 12.4%. The Bureau called it the <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">single largest decline in violent crime and murder since 1937</a>. One nonpartisan think tank figures that if the numbers hold, 2025 may have had the <a href="https://stateline.org/2026/05/20/preliminary-fbi-data-shows-a-sharp-drop-in-violent-crime/">lowest homicide rate in more than a century</a>.
        </P>

        <P>
          That is, by any reading, good news. Real, broad, hard-to-fake good news.
        </P>

        <P>
          I run a data company. So when a number lands this good and this round, my first reaction isn&rsquo;t a victory lap &mdash; it&rsquo;s a question. Where did it come from, and how solid is the pipe it came through?
        </P>

        <H2>Here&rsquo;s the pipe</H2>

        <P>
          The FBI doesn&rsquo;t count crime. It collects counts that local police departments choose to send it. <a href="https://stateline.org/2026/05/20/preliminary-fbi-data-shows-a-sharp-drop-in-violent-crime/">Participation is voluntary, the data only reflects crimes reported to police, and the whole thing runs on NIBRS &mdash; a reporting system that only became the national standard in 2021</a>. That transition blew holes in the national totals for a couple of years while departments scrambled to switch over.
        </P>

        <P>
          For 2025, <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">more than 17,000 agencies reported, covering 96% of the population &mdash; up from 16,675 the year before</a>. That&rsquo;s genuinely good coverage. It&rsquo;s also a moving denominator: the set of agencies reporting changes every year, which means part of any year-over-year change is just who showed up.
        </P>

        <P>
          And these are estimates. The FBI labeled the release <a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">&ldquo;First Look&rdquo; &mdash; preliminary, and &ldquo;subject to change&rdquo;</a> before the finalized report lands later this year.
        </P>

        <H2>How much can &ldquo;subject to change&rdquo; move?</H2>

        <P>Ask 2022.</P>

        <Fig caption={<>Same year, two answers. Source: <a href="https://oversight.house.gov/release/comer-demands-transparency-from-fbi-about-quietly-revised-crime-statistics/">House Committee on Oversight, Oct. 31, 2024</a>.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%22As+first+reported+%282023%29%22%2C%22After+the+quiet+revision%22%5D%2C%22datasets%22%3A%5B%7B%22data%22%3A%5B-1.7%2C4.5%5D%2C%22backgroundColor%22%3A%5B%22%23777777%22%2C%22%23141210%22%5D%7D%5D%7D%2C%22options%22%3A%7B%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22title%22%3A%7B%22display%22%3Atrue%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A16%2C%22text%22%3A%5B%22Same+year%2C+two+different+answers%22%2C%22U.S.+violent+crime+change%2C+2022+%28FBI+estimate%29%22%5D%7D%2C%22scales%22%3A%7B%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22ticks%22%3A%7B%22min%22%3A-4%2C%22max%22%3A6%2C%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent+change+in+violent+crime%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart of U.S. violent crime change for 2022: as first reported in 2023, down 1.7 percent; after the FBI's later revision, up 4.5 percent" style={{ width:'100%', height:'auto', display:'block', border:'1px solid var(--rule)' }} />
        </Fig>

        <P>
          When the FBI first reported 2022, it showed <a href="https://oversight.house.gov/release/comer-demands-transparency-from-fbi-about-quietly-revised-crime-statistics/">violent crime down 1.7%. Then it quietly revised the same year to up 4.5%</a> &mdash; a 6.2-point swing, after adding back <a href="https://oversight.house.gov/release/comer-demands-transparency-from-fbi-about-quietly-revised-crime-statistics/">1,699 murders, 7,780 rapes, 33,459 robberies, and 37,091 aggravated assaults</a> the first cut had missed. The House Oversight Committee went looking for an explanation. A revision like that isn&rsquo;t proof of anything sinister &mdash; it&rsquo;s what happens when you estimate first and finalize later. But it&rsquo;s a reminder that the decimal is softer than the headline.
        </P>

        <H2>The perception gap isn&rsquo;t only in people&rsquo;s heads</H2>

        <P>
          None of this is why most people think crime is rising. In 2023, <a href="https://news.gallup.com/poll/1603/crime.aspx">77% of Americans told Gallup there was more crime in the U.S. than a year before</a> &mdash; a level the series has only beaten once, at 89% in 1992. The distance between that fear and the falling line is the viral story.
        </P>

        <P>
          But the take usually skips a part: the data isn&rsquo;t innocent here. It arrives months late. It gets revised after the news cycle has moved on. It runs through a counting machine most people have never heard of and can&rsquo;t see. When the official number is a preliminary estimate that swung six points the last time anyone checked, &ldquo;trust the data, not your gut&rdquo; is a harder sell than the charts make it look.
        </P>

        <P>
          So believe the direction. Cities, independent trackers, and the FBI all point the same way: 2025 was a very good year for not getting killed in America. Just hold the &ldquo;since 1937&rdquo; loosely. It&rsquo;s a record built on an estimate, from a system rebuilt in 2021, last seen revising itself by six points.
        </P>

        <P>The crime fell. The decimal is still settling.</P>

        <Divider />

        <P><strong>Sources</strong></P>

        <UL items={[
          <><a href="https://www.fbi.gov/news/press-releases/fbi-releases-historic-early-look-at-annual-crime-data">FBI &mdash; Releases Historic Early Look at Annual Crime Data (First Look: 2025)</a></>,
          <><a href="https://stateline.org/2026/05/20/preliminary-fbi-data-shows-a-sharp-drop-in-violent-crime/">Stateline &mdash; Preliminary FBI data shows a sharp drop in violent crime</a></>,
          <><a href="https://oversight.house.gov/release/comer-demands-transparency-from-fbi-about-quietly-revised-crime-statistics/">House Committee on Oversight &mdash; Comer Demands Transparency from FBI About Quietly Revised Crime Statistics</a></>,
          <><a href="https://news.gallup.com/poll/1603/crime.aspx">Gallup &mdash; Crime (historical trends)</a></>,
        ]} />

      </article>
    </Prose>
  </Container>
);

// ==================== Post body ====================
// Write the article inside the <article> tag below.
// Available helper components:
//   <H2>Section heading</H2>

const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Pop quiz. When did the country last check what a 4th grader knows about science? 2019. When does it check next? Winter 2033, results that fall, according to the <a href="https://nces.ed.gov/nationsreportcard/about/calendar.aspx">NCES assessment calendar</a> (last updated May 26, 2026). Same deal for 12th grade.
        </P>

        <P>
          That&rsquo;s fourteen years between tests. The kids who took it in 4th grade in 2019 will be in their twenties by the time anyone asks a 4th grader again.
        </P>

        <H2>Grade 8 gets a test. Sort of.</H2>

        <P>
          Eighth graders did sit for science in 2024 &mdash; <a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/top-5-things-to-know-about-naep-science-results.html">they were the only grade that did</a> &mdash; and the average score <a href="https://www.nationsreportcard.gov/reports/science/2024/national-trends/">dropped 4 points from 2019</a>. The calendar then lists a grade 8 pilot in winter 2027, <a href="https://nces.ed.gov/nationsreportcard/about/calendar.aspx">results not released</a>, and a real grade 8 administration in winter 2029. A test of the test, then a test.
        </P>

        <P>
          And when 2033 finally arrives, the footnote says the grade 4 and 12 science assessments are <a href="https://nces.ed.gov/nationsreportcard/about/calendar.aspx">&ldquo;at the national level only.&rdquo;</a> No state numbers. So fourteen years of waiting buys you one national dot for each of two grades.
        </P>

        <P>
          I can&rsquo;t tell you whether this was always the plan or whether it slipped. That would take the archived 2023 and 2024 versions of the schedule side by side, and I haven&rsquo;t pulled them yet. What I can tell you is that the same page says the schedule &ldquo;is as of May 15, 2026 and may be subject to change.&rdquo; Which is true of every schedule ever written. It&rsquo;s also the whole evidence base here.
        </P>

        <H2>Empty cells are a data product too</H2>

        <P>
          Science isn&rsquo;t the only thing going quiet. The Condition of Education, the congressionally mandated annual compendium, came out in May with <a href="https://www.edweek.org/policy-politics/feds-issue-a-slimmed-down-data-release-on-u-s-schools/2026/05">updates on only 17 of the 702 indicators</a> NCES collects. NCES had also missed the June 1 deadline the year before, and has since said it&rsquo;s moving from one big compendium to <a href="https://www.edweek.org/policy-politics/feds-issue-a-slimmed-down-data-release-on-u-s-schools/2026/05">&ldquo;rolling data updates throughout the year.&rdquo;</a> AERA&rsquo;s executive director called the reduced release <a href="https://www.edweek.org/policy-politics/feds-issue-a-slimmed-down-data-release-on-u-s-schools/2026/05">&ldquo;deeply concerning.&rdquo;</a>
        </P>

        <Fig caption={<>Source: <a href="https://www.edweek.org/policy-politics/feds-issue-a-slimmed-down-data-release-on-u-s-schools/2026/05">Education Week, May 2026</a>. 17 indicators updated of 702 collected; &ldquo;not updated&rdquo; = 702 &minus; 17 = 685 (2.4% updated). Whether later rolling updates have since landed is not reflected.</>}>
          <img src={CHART_COE} alt="Bar chart: of 702 Condition of Education indicators, 17 updated in May 2026 and 685 not updated." style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <P>
          &ldquo;Rolling&rdquo; is the interesting word. A compendium has a date you can miss, so everyone notices. A rolling update has no date, so there&rsquo;s nothing to miss. Reporting lag becomes a feature. I haven&rsquo;t checked how many indicators have shown up since May, and honestly that&rsquo;s the number I&rsquo;d want before I believed anything about the plan.
        </P>

        <Divider />

        <P>
          Everybody has a take right now on what kids need to know about science and AI and whatever the pipeline is called this year. Great. Based on what? If you need a national number for 4th grade science before 2033, the calendar has one ready for you. It&rsquo;s from 2019.
        </P>

        <H2>Sources</H2>

        <UL items={[
          <><a href="https://nces.ed.gov/nationsreportcard/about/calendar.aspx">NCES, NAEP Assessment Calendar</a> (last updated May 26, 2026)</>,
          <><a href="https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/top-5-things-to-know-about-naep-science-results.html">NAGB, Top 5 things to know about NAEP science results (2024)</a></>,
          <><a href="https://www.nationsreportcard.gov/reports/science/2024/national-trends/">NAEP, 2024 Science: National Trends and Student Skills</a></>,
          <><a href="https://www.edweek.org/policy-politics/feds-issue-a-slimmed-down-data-release-on-u-s-schools/2026/05">Education Week, Feds issue a slimmed-down data release on U.S. schools (May 2026)</a></>,
        ]} />

        <P><em>&mdash; TJ</em></P>

      </article>
    </Prose>
  </Container>

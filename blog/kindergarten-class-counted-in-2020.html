const PostBody = () => (
  <Container>
    <Prose>
      <article className="post-body">

        <P>
          Every fall somebody in a district office builds an enrollment forecast. And every fall, a big chunk of that forecast was already written five years earlier, on birth certificates, by people who will never sit through a school board budget hearing.
        </P>

        <P>
          Here&rsquo;s the most boring ratio in American education (I mean that as a compliment). Take public kindergarten enrollment from <a href="https://nces.ed.gov/programs/digest/d24/tables/dt24_203.10.asp" target="_blank" rel="noopener">NCES</a> and divide it by US births five years earlier from the <a href="https://www.cdc.gov/nchs/data/nvsr/nvsr75/nvsr75-02.pdf" target="_blank" rel="noopener">CDC</a>. Fall 2015 through fall 2019: 92.8, 93.6, 93.2, 93.6, 93.2 kindergartners per 100 births. Five years inside a band of less than a point. That&rsquo;s not a trend line. That&rsquo;s a utility bill.
        </P>

        <H2>Then 2020 broke it twice</H2>

        <P>
          Break number one was the pandemic. Fall 2020 public kindergarten fell 9%, about <a href="https://nces.ed.gov/programs/coe/indicator/cga" target="_blank" rel="noopener">338,000 kids</a>, and the ratio dropped to 84.9. Families held kids out, and the ratio has been crawling back since: 90.1, 91.5, 92.3 by fall 2023.
        </P>

        <P>
          Break number two is quieter and it doesn&rsquo;t heal. Births fell from <a href="https://www.cdc.gov/nchs/data/nvsr/nvsr75/nvsr75-02.pdf" target="_blank" rel="noopener">3,747,540 in 2019 to 3,613,647 in 2020</a>. Those 2020 babies are the kindergarten class that started in fall 2025. The 2020 cohort is 133,893 smaller than 2019&rsquo;s and 385,739 smaller than 2010&rsquo;s. And the years after it didn&rsquo;t bounce: 3,664,292 in 2021, 3,667,758 in 2022, 3,596,017 in 2023, <a href="https://www.cdc.gov/nchs/fastats/births.htm" target="_blank" rel="noopener">3,628,934 in 2024</a>. Every one of those is below every single year from 2010 to 2019. The kindergarten pools through fall 2029 are already born. They&rsquo;re just small.
        </P>

        <Fig caption={<>Public kindergarten enrollment (<a href="https://nces.ed.gov/programs/digest/d24/tables/dt24_203.10.asp" target="_blank" rel="noopener">NCES Table 203.10</a>) divided by US births five years earlier (<a href="https://www.cdc.gov/nchs/data/nvsr/nvsr75/nvsr75-02.pdf" target="_blank" rel="noopener">CDC/NCHS Table 1</a>). Example: fall 2019, 3,716 thousand / 3,988,076 births in 2014 = 93.2. Fall 2020 (grey) is the pandemic year.</>}>
          <img src="https://quickchart.io/chart?c=%7B%22type%22%3A%22bar%22%2C%22data%22%3A%7B%22labels%22%3A%5B%222015%22%2C%222016%22%2C%222017%22%2C%222018%22%2C%222019%22%2C%222020%22%2C%222021%22%2C%222022%22%2C%222023%22%5D%2C%22datasets%22%3A%5B%7B%22label%22%3A%22Kindergarten+enrollment+as+%25+of+births+five+years+earlier%22%2C%22data%22%3A%5B92.8%2C93.6%2C93.2%2C93.6%2C93.2%2C84.9%2C90.1%2C91.5%2C92.3%5D%2C%22backgroundColor%22%3A%5B%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23bbb%22%2C%22%23141210%22%2C%22%23141210%22%2C%22%23141210%22%5D%2C%22barPercentage%22%3A0.6%2C%22categoryPercentage%22%3A0.8%7D%5D%7D%2C%22options%22%3A%7B%22title%22%3A%7B%22display%22%3Atrue%2C%22text%22%3A%22Kindergartners+per+100+births%2C+five+years+later%22%2C%22fontColor%22%3A%22%23141210%22%2C%22fontSize%22%3A18%7D%2C%22legend%22%3A%7B%22display%22%3Afalse%7D%2C%22plugins%22%3A%7B%22datalabels%22%3A%7B%22anchor%22%3A%22end%22%2C%22align%22%3A%22top%22%2C%22color%22%3A%22%23141210%22%2C%22font%22%3A%7B%22weight%22%3A%22bold%22%7D%7D%7D%2C%22scales%22%3A%7B%22xAxes%22%3A%5B%7B%22id%22%3A%22x%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%7D%7D%5D%2C%22yAxes%22%3A%5B%7B%22id%22%3A%22y%22%2C%22gridLines%22%3A%7B%22color%22%3A%22rgba%2820%2C18%2C16%2C0.10%29%22%2C%22zeroLineColor%22%3A%22rgba%2820%2C18%2C16%2C0.30%29%22%7D%2C%22ticks%22%3A%7B%22fontColor%22%3A%22%23141210%22%2C%22min%22%3A80%2C%22max%22%3A100%7D%2C%22scaleLabel%22%3A%7B%22display%22%3Atrue%2C%22labelString%22%3A%22Percent%22%2C%22fontColor%22%3A%22%23141210%22%7D%7D%5D%7D%7D%7D&v=2.9.4&w=900&h=480&bkg=transparent&devicePixelRatio=2" alt="Bar chart: kindergartners per 100 births five years earlier: 2015 92.8, 2016 93.6, 2017 93.2, 2018 93.6, 2019 93.2, 2020 84.9, 2021 90.1, 2022 91.5, 2023 92.3" style={{ width:'100%', height:'auto', display:'block' }} />
        </Fig>

        <H2>Now add the immigration story</H2>

        <P>
          This fall the enrollment conversation is mostly about enforcement, and the pain is real. <a href="https://www.npr.org/2026/11/06/nx-s1-5971283/public-school-enrollment-ice-deportation-birthrate" target="_blank" rel="noopener">NPR</a> reports Texas enrollment fell by more than 76,000 students last year, with most of the drop among Hispanic kids and children of immigrant families, per a Texas Education Agency study. Nationally, NCES has enrollment peaking in 2019 and down roughly 1.5 million as of the 2024 school year.
        </P>

        <P>
          But the same story cites a Bellwether and WestEd report naming the sustained drop in birth rates as the primary driver, with the immigration slowdown second. Primary. Second. No numbers. Nobody has published the split, and I&rsquo;m not going to fake one.
        </P>

        <H2>The split is a spreadsheet, not a vibe</H2>

        <P>
          Here&rsquo;s how you&rsquo;d actually do it, state by state. Births five years back from CDC WONDER. Kindergarten counts from the Common Core of Data. Each state&rsquo;s own pre-2020 ratio. Expected kindergartners = births &times; ratio. Whatever falls below that line is the residual, and the residual is a junk drawer: kids who moved to Florida, kids who moved to a private school or the kitchen table, and kids whose families left or are too scared to enroll. You need Census migration estimates before you can call any of it enforcement.
        </P>

        <P>
          The weird part is which data shows up first. CDC already has final 2024 births out. The NCES grade-by-grade table I used stops at fall 2023 and was prepared in January 2025. The leading indicator is fresher than the thing it predicts. And NCES&rsquo;s own <a href="https://nces.ed.gov/programs/coe/indicator/cga" target="_blank" rel="noopener">projection</a> (total enrollment from 49.6 million in fall 2022 to 46.9 million in fall 2031) was built on data through fall 2021, before any of this year&rsquo;s raids.
        </P>

        <Divider />

        <P>
          Deportations are making the hole deeper. But the hole was dug in 2020, in maternity wards, and the paperwork has been sitting at the CDC the whole time.
        </P>

      </article>
    </Prose>
  </Container>
);
